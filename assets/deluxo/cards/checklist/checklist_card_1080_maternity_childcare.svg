  <text x="100" y="715" font-family="'Pretendard',sans-serif" font-size="36" fill="#22C55E">☑</text>
  <text x="150" y="715" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#FFF">신청 기한 확인 (종료 후 12개월 이내)</text>
