<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">전월세 신고 전 1분 체크리스트</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="120" width="960" height="100" rx="16" fill="rgba(239,68,68,0.08)"/>
  <rect x="80" y="145" width="40" height="40" rx="8" fill="rgba(239,68,68,0.3)" stroke="#EF4444" stroke-width="2"/>
  <text x="100" y="173" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#EF4444">!</text>
  <text x="140" y="165" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">보증금 6,000만 원↑ 또는 월세 30만 원↑ 확인</text>
  <text x="140" y="198" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">하나만 해당돼도 신고 대상</text>

  <rect x="60" y="232" width="960" height="100" rx="16" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="257" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="277" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">계약 체결일로부터 30일 이내인지 확인</text>
  <text x="140" y="310" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">입주일이 아닌 계약서 작성일 기준</text>

  <rect x="60" y="344" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="369" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="397" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="389" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">임대차 계약서 원본(또는 사진) 준비</text>
  <text x="140" y="422" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">모바일 신고 시 사진 촬영으로 업로드</text>

  <rect x="60" y="456" width="960" height="100" rx="16" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="481" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="509" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="501" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">온라인: rtms.molit.go.kr + 인증서 준비</text>
  <text x="140" y="534" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">공동인증서 또는 카카오·네이버 간편인증</text>

  <rect x="60" y="568" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="593" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="621" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="613" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">전입신고(주민센터) + 임대차 신고 둘 다 완료</text>
  <text x="140" y="646" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">전입신고 ≠ 전월세 신고 — 별도 진행 필수</text>

  <rect x="60" y="680" width="960" height="100" rx="16" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="705" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="733" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="725" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">갱신 계약 시 금액 변동 여부 확인</text>
  <text x="140" y="758" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">1원이라도 변동 시 30일 이내 재신고</text>

  <rect x="60" y="792" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="817" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="845" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="837" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">확정일자 자동 부여 확인 (별도 신청 불필요)</text>
  <text x="140" y="870" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">신고 완료 = 확정일자 무료 부여 → 우선변제권 확보</text>

  <rect x="60" y="904" width="960" height="100" rx="16" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="929" width="40" height="40" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="957" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">✓</text>
  <text x="140" y="949" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">전세 피해 위험 시 전세피해지원센터 연락</text>
  <text x="140" y="982" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">인천: 032-440-8895 / 전국: 정부24(110)</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
