  <text x="150" y="680" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">과거 수혜 이력 확인</text>
  <text x="150" y="712" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">동일 사업 중복 수혜 제한 — 이전 신청 내역 조회</text>

  <rect x="60" y="740" width="960" height="90" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="786" font-family="'Pretendard',sans-serif" font-size="34" fill="#22C55E">☑</text>
  <text x="150" y="780" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">사업계획서 작성 (종합지원)</text>
  <text x="150" y="812" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">구체적 매출 목표·실행 계획·예산 편성 포함</text>

  <rect x="60" y="840" width="960" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="886" font-family="'Pretendard',sans-serif" font-size="34" fill="#22C55E">☑</text>
  <text x="150" y="880" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">금융지원 서류 준비 (융자 신청 시)</text>
  <text x="150" y="912" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">부가세 과세표준증명원·매출 증빙·재무제표</text>

  <rect x="60" y="945" width="960" height="90" rx="16" fill="rgba(59,130,246,0.15)"/>
  <text x="100" y="991" font-family="'Pretendard',sans-serif" font-size="34" fill="#3B82F6">🔗</text>
  <text x="150" y="990" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#3B82F6">서울시 소상공인 종합지원 포털 접속 확인!</text>
</svg>