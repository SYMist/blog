<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">서울시 지원사업 신청 전 체크리스트</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="140" width="960" height="90" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="186" font-family="'Pretendard',sans-serif" font-size="34" fill="#22C55E">☑</text>
  <text x="150" y="180" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">사업장 소재지 서울 확인</text>
  <text x="150" y="212" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">사업자등록증 주소가 서울특별시여야 신청 가능</text>

  <rect x="60" y="240" width="960" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
