  <text x="150" y="280" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">소상공인 요건 확인</text>
  <text x="150" y="312" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">상시근로자 5인 미만(제조·건설·운수·광업 10인 미만)</text>

  <rect x="60" y="340" width="960" height="90" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="386" font-family="'Pretendard',sans-serif" font-size="34" fill="#22C55E">☑</text>
  <text x="150" y="380" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">제외 업종 해당 여부 확인</text>
  <text x="150" y="412" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">유흥업·부동산임대·금융보험 등 제외</text>

  <rect x="60" y="440" width="960" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="486" font-family="'Pretendard',sans-serif" font-size="34" fill="#22C55E">☑</text>
  <text x="150" y="480" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">국세·지방세 체납 없음 확인</text>
  <text x="150" y="512" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">납세증명서 미리 발급 (홈택스·위택스)</text>

  <rect x="60" y="540" width="960" height="90" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="586" font-family="'Pretendard',sans-serif" font-size="34" fill="#22C55E">☑</text>
  <text x="150" y="580" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">사업자등록증·신분증·통장사본 준비</text>
  <text x="150" y="612" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">스캔본 미리 저장 — 온라인 접수 시 업로드 필요</text>

  <rect x="60" y="640" width="960" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
