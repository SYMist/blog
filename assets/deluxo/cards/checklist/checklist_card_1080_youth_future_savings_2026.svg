<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="12" fill="url(#accent)"/>

  <!-- Title -->
  <text x="540" y="78" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">청년 미래적금 가입 전 1분 체크리스트</text>
  <text x="540" y="118" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">6가지 확인 후 6월 출시에 바로 신청하자</text>

  <!-- Divider -->
  <rect x="60" y="136" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- Item 1 -->
  <rect x="60" y="154" width="960" height="118" rx="16" fill="#1A3270"/>
  <rect x="80" y="182" width="48" height="48" rx="12" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="182" width="48" height="48" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="104" y="213" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">☐</text>
  <text x="155" y="196" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#EAF2FF">나이 확인: 만 19~34세 (군복무 2년 추가 인정 가능)</text>
  <text x="155" y="228" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">병역 이행자는 최대 만 36세까지 해당 가능 — 출시 후 은행 확인 필요</text>
  <text x="155" y="254" font-family="-apple-system, sans-serif" font-size="15" fill="#6B7280">나이 계산 기준일: 출시 공고 확인</text>

  <!-- Item 2 -->
  <rect x="60" y="286" width="960" height="118" rx="16" fill="#1A3270"/>
  <rect x="80" y="314" width="48" height="48" rx="12" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="314" width="48" height="48" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="104" y="345" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">☐</text>
  <text x="155" y="328" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#EAF2FF">소득 확인: 홈택스 소득금액증명원 조회</text>
  <text x="155" y="360" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">일반형: 6,000만원 이하 / 우대형: 3,600만원 이하 (근로·사업·기타소득 합산)</text>
  <text x="155" y="386" font-family="-apple-system, sans-serif" font-size="15" fill="#6B7280">전전년도(2024년 귀속) 소득 기준 적용 가능성 높음</text>

  <!-- Item 3 -->
  <rect x="60" y="418" width="960" height="118" rx="16" fill="#1A3270"/>
  <rect x="80" y="446" width="48" height="48" rx="12" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="446" width="48" height="48" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="104" y="477" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">☐</text>
  <text x="155" y="460" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#EAF2FF">가구소득: 건강보험공단 앱에서 중위소득 기준 확인</text>
  <text x="155" y="492" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">일반형: 중위 200% 이하 / 우대형: 150% 이하 (가구 전체 합산)</text>
  <text x="155" y="518" font-family="-apple-system, sans-serif" font-size="15" fill="#6B7280">건강보험공단 앱 → 나의 납부내역 → 보험료 조회</text>

  <!-- Item 4 -->
  <rect x="60" y="550" width="960" height="118" rx="16" fill="#1A3270"/>
  <rect x="80" y="578" width="48" height="48" rx="12" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="578" width="48" height="48" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="104" y="609" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">☐</text>
  <text x="155" y="592" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#EAF2FF">청년도약계좌 유지 여부 확인</text>
  <text x="155" y="624" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">도약계좌 보유자는 중복 불가 — 갈아타기 vs 유지 손익 계산 먼저</text>
  <text x="155" y="650" font-family="-apple-system, sans-serif" font-size="15" fill="#6B7280">잔여 기간 3년 미만이면 유지 권장</text>

  <!-- Item 5 -->
  <rect x="60" y="682" width="960" height="118" rx="16" fill="#1A3270"/>
  <rect x="80" y="710" width="48" height="48" rx="12" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="710" width="48" height="48" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="104" y="741" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">☐</text>
  <text x="155" y="724" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#EAF2FF">서류 준비: 소득금액증명원 + 건강보험료 납부 확인서</text>
  <text x="155" y="756" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">소상공인: 사업자등록증 + 매출 확인서류 추가 필요</text>
  <text x="155" y="782" font-family="-apple-system, sans-serif" font-size="15" fill="#6B7280">홈택스 발급 (소득금액증명원) + 건강보험공단 앱</text>

  <!-- Item 6 -->
  <rect x="60" y="814" width="960" height="118" rx="16" fill="#1A3270"/>
  <rect x="80" y="842" width="48" height="48" rx="12" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="842" width="48" height="48" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="104" y="873" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">☐</text>
  <text x="155" y="856" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#EAF2FF">2026년 6월 출시 알림 설정 완료</text>
  <text x="155" y="888" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">kinfa.or.kr 알림 설정 + 주거래 은행 앱 사전 등록</text>
  <text x="155" y="914" font-family="-apple-system, sans-serif" font-size="15" fill="#6B7280">선착순 가능 — 출시 당일 바로 신청 준비</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
