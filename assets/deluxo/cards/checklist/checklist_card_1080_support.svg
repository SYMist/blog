<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="48" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">지원금 체크리스트</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">2026 소상공인 지원금 신청 전</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Checklist Items -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#111827" font-size="30">
    <text x="170" y="360">□ 소상공인 요건(인원·업종·매출) 충족</text>
    <text x="170" y="430">□ 지원 제외 업종 해당 여부 확인</text>
    <text x="170" y="500">□ 중복 수혜 제한 확인</text>
    <text x="170" y="570">□ 세금 체납 없음</text>
    <text x="170" y="640">□ 사업자등록 유지(영업 중)</text>
    <text x="170" y="710">□ 신청 플랫폼(소상공인24/OLS) 확인</text>
    <text x="170" y="780">□ 필수 서류 최신본 확보</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="840" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="895" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    예산 소진 전 접수하는 것이 유리합니다
  </text>
</svg>
