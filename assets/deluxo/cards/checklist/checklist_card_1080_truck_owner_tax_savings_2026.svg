<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#F59E0B"/>

  <!-- Title -->
  <text x="540" y="68" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">신청 전 1분 체크리스트</text>
  <text x="540" y="106" font-family="-apple-system, sans-serif" font-size="21" font-weight="600" fill="#F59E0B" text-anchor="middle">화물차 사업자 세금 절감 (2026)</text>

  <!-- Item 1 -->
  <rect x="40" y="140" width="1000" height="120" rx="12" fill="#1A3270"/>
  <rect x="40" y="140" width="8" height="120" rx="4" fill="#34D399"/>
  <rect x="66" y="166" width="48" height="48" rx="8" fill="#34D399" opacity="0.2"/>
