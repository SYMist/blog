<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="48" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">신청 전 체크리스트</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">국민취업지원제도 1분 점검</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Checklist Items -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#111827" font-size="30">
    <text x="170" y="360">□ 만 15~69세 연령 요건 충족</text>
    <text x="170" y="430">□ 가구 소득·재산 기준 확인 (사전진단 완료)</text>
    <text x="170" y="500">□ 실업급여 종료 후 6개월 경과 확인</text>
    <text x="170" y="570">□ 고용24 회원가입·구직등록 완료</text>
    <text x="170" y="640">□ 제도 안내 동영상 시청 완료</text>
    <text x="170" y="710">□ 신분증 및 상황별 추가 서류 준비</text>
    <text x="170" y="780">□ 온라인/고용센터 방문 신청 경로 확인</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="840" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="895" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    고용24 사전진단으로 본인 유형을 먼저 확인하세요
  </text>
</svg>
