<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="48" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">폐업지원금 체크리스트</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">희망리턴패키지 신청 전 점검</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Checklist Items -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#111827" font-size="30">
    <text x="170" y="360">□ 폐업(예정) 소상공인 요건 충족</text>
    <text x="170" y="430">□ 지원 제외 업종 해당 여부 확인</text>
    <text x="170" y="500">□ 국세·지방세 체납 없음</text>
    <text x="170" y="570">□ 철거 전에 온라인 신청(사전 신청)</text>
    <text x="170" y="640">□ 폐업사실증명원/사업자등록증 준비</text>
    <text x="170" y="710">□ 철거 계약서·견적서·영수증 준비</text>
    <text x="170" y="780">□ 전직수당 신청 시 구직/취업 증빙</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="840" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="895" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    서류 누락이 가장 흔한 탈락 사유입니다
  </text>
</svg>
