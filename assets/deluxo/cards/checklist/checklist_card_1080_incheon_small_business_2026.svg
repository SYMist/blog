  <rect x="60" y="878" width="960" height="152" rx="20" fill="#F59E0B"/>
  <text x="540" y="936" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">8개 모두 ✓면 신청 준비 완료</text>
  <text x="540" y="994" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0B1F3B" text-anchor="middle">인천신보 1577-3790 · 소상공인 통합 콜센터 1357</text>
