    <text x="82" y="450" fill="#FFFFFF" font-weight="900" text-anchor="middle">✓</text>
    <text x="130" y="450">신용 사전 조회 완료 (연체·불량 이력 없음)</text>

    <rect x="60" y="493" width="44" height="44" rx="10" fill="#10B981"/>
    <text x="82" y="525" fill="#FFFFFF" font-weight="900" text-anchor="middle">✓</text>
