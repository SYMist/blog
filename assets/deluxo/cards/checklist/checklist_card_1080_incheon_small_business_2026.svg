<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="118" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#F59E0B" text-anchor="middle">신청 전 1분 체크리스트</text>
  <text x="540" y="196" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">인천 소상공인 8가지 점검</text>

  <g font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#EAF2FF">
    <rect x="60" y="268" width="44" height="44" rx="10" fill="#10B981"/>
    <text x="82" y="300" fill="#FFFFFF" font-weight="900" text-anchor="middle">✓</text>
    <text x="130" y="300">인천 소재 사업자등록 확인 (등록증 주소가 인천)</text>

