    <rect x="60" y="568" width="44" height="44" rx="10" fill="#10B981"/>
    <text x="82" y="600" fill="#FFFFFF" font-weight="900" text-anchor="middle">✓</text>
    <text x="130" y="600">보증드림 앱 설치 및 회원가입 완료</text>

    <rect x="60" y="643" width="44" height="44" rx="10" fill="#10B981"/>
    <text x="82" y="675" fill="#FFFFFF" font-weight="900" text-anchor="middle">✓</text>
