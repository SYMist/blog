<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter></defs>
  <rect width="1080" height="1080" rx="32" fill="#F0F4FA"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFF" filter="url(#s)"/>
  <rect x="40" y="40" width="1000" height="100" rx="24" fill="#1D4ED8"/><rect x="40" y="95" width="1000" height="45" fill="#1D4ED8"/>
  <text x="540" y="103" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#FFF">3월 소상공인 정책자금 신청 체크리스트</text>

  <!-- 공통 -->
  <text x="100" y="200" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">공통 확인 사항</text>
  <line x1="80" y1="220" x2="1000" y2="220" stroke="#E5E7EB" stroke-width="2"/>
  <text x="100" y="258" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  소상공인 기준 충족 (상시근로자 5인/10인 미만)</text>
  <text x="100" y="296" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  국세·지방세 완납 확인 (홈택스)</text>
  <text x="100" y="334" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  금융 연체·신용정보 등록 없음 확인</text>
  <text x="100" y="372" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  최근 5년 내 정책자금 3회 이상 수혜 아닌지 확인</text>
  <text x="100" y="410" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  사업자등록증 + 재무제표 + 세금완납증명 준비</text>

  <!-- 3/3 접수 -->
  <text x="100" y="475" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#DC2626">3월 3일 접수 준비</text>
  <line x1="80" y1="495" x2="1000" y2="495" stroke="#E5E7EB" stroke-width="2"/>
  <text x="100" y="533" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  ols.semas.or.kr 회원가입 + 로그인 테스트</text>
  <text x="100" y="571" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  자금집행계획서·사업계획서 작성 완료</text>
  <text x="100" y="609" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  재도전특별자금: 재창업 교육 수료증 발급</text>
  <text x="100" y="647" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  혁신성장촉진: 수출실적/스마트공장 확인서 준비</text>
  <text x="100" y="685" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  3/3 오전 9:50 접속 → 10:00 즉시 제출</text>

  <!-- 3/9 접수 -->
  <text x="100" y="750" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#7C3AED">3월 9일 접수 준비 (신용취약)</text>
  <line x1="80" y1="770" x2="1000" y2="770" stroke="#E5E7EB" stroke-width="2"/>
  <text x="100" y="808" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  NCB 신용평점 839점 이하 여부 확인</text>
  <text x="100" y="846" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  온라인 신용관리 교육 사전 이수 완료</text>
  <text x="100" y="884" font-family="'Pretendard',sans-serif" font-size="25" fill="#111827">□  운전자금 3,000만원 한도 내 필요 금액 산정</text>

  <!-- 문의처 -->
  <rect x="80" y="920" width="920" height="60" rx="14" fill="#EFF6FF"/>
  <text x="540" y="958" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">문의: 소상공인 통합콜센터 1357 | ols.semas.or.kr</text>

