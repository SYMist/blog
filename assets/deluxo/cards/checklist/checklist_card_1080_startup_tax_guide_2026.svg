<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#F59E0B"/>

  <!-- Title -->
  <text x="540" y="70" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle">소상공인 창업 세금 신고 전 1분 체크리스트</text>
  <text x="540" y="108" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">이 6가지만 확인하면 창업 첫 해 세금 실수 제로</text>

  <!-- Item 1 -->
  <rect x="60" y="140" width="960" height="110" rx="12" fill="#1A3270"/>
  <rect x="60" y="140" width="6" height="110" rx="3" fill="#34D399"/>
  <circle cx="118" cy="195" r="22" fill="#34D399"/>
  <text x="118" y="202" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#0B1F3B" text-anchor="middle">1</text>
  <text x="158" y="183" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">사업 개시 후 20일 이내 사업자등록 완료</text>
  <text x="158" y="212" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">홈택스(hometax.go.kr) 또는 관할 세무서 — 초과 시 매입세액 공제 불가</text>

  <!-- Item 2 -->
  <rect x="60" y="262" width="960" height="110" rx="12" fill="#0D2347"/>
  <rect x="60" y="262" width="6" height="110" rx="3" fill="#34D399"/>
  <circle cx="118" cy="317" r="22" fill="#34D399"/>
  <text x="118" y="324" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#0B1F3B" text-anchor="middle">2</text>
  <text x="158" y="305" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">업종 코드 확인 — 청년창업 세액감면 대상 여부</text>
  <text x="158" y="334" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">음식점업·제조·정보통신 등 18개 업종만 해당 — 카페 비알코올 코드는 제외</text>

  <!-- Item 3 -->
  <rect x="60" y="384" width="960" height="110" rx="12" fill="#1A3270"/>
  <rect x="60" y="384" width="6" height="110" rx="3" fill="#F59E0B"/>
  <circle cx="118" cy="439" r="22" fill="#F59E0B"/>
  <text x="118" y="446" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#0B1F3B" text-anchor="middle">3</text>
  <text x="158" y="427" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">과세 유형 선택 — 일반 vs 간이 vs 면세</text>
  <text x="158" y="456" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">B2B 거래 多 → 일반 / 소규모 B2C → 간이 / 의료·교육 등 → 면세</text>

  <!-- Item 4 -->
  <rect x="60" y="506" width="960" height="110" rx="12" fill="#0D2347"/>
  <rect x="60" y="506" width="6" height="110" rx="3" fill="#F59E0B"/>
  <circle cx="118" cy="561" r="22" fill="#F59E0B"/>
  <text x="118" y="568" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#0B1F3B" text-anchor="middle">4</text>
  <text x="158" y="549" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">부가세 신고 일정 캘린더 등록</text>
  <text x="158" y="578" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">일반: 1월·7월 25일 / 간이: 1월 25일 — 신고 기한 놓치면 가산세 20%</text>

  <!-- Item 5 -->
  <rect x="60" y="628" width="960" height="110" rx="12" fill="#1A3270"/>
  <rect x="60" y="628" width="6" height="110" rx="3" fill="#34D399"/>
  <circle cx="118" cy="683" r="22" fill="#34D399"/>
  <text x="118" y="690" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#0B1F3B" text-anchor="middle">5</text>
  <text x="158" y="671" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">종소세 신고 5월 31일 + 감면 신청서 준비</text>
  <text x="158" y="700" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">청년창업 세액감면 해당자 → 홈택스 신고 시 "감면 신청서" 별도 첨부 필수</text>

  <!-- Item 6 -->
  <rect x="60" y="750" width="960" height="110" rx="12" fill="#0D2347"/>
  <rect x="60" y="750" width="6" height="110" rx="3" fill="#EF4444"/>
  <circle cx="118" cy="805" r="22" fill="#EF4444"/>
  <text x="118" y="812" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="158" y="793" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">직원 고용 시 원천세 신고 (매월 10일)</text>
  <text x="158" y="822" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">급여 지급 다음 달 10일까지 홈택스 신고 — 20명 이하 소기업은 반기납부 신청 가능</text>

  <!-- Footer -->
  <text x="540" y="960" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | hometax.go.kr | nts.go.kr | ☎ 126</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
</svg>
