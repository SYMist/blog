  <text x="160" y="645" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">홈택스 사업용 카드 즉시 등록</text>
  <text x="160" y="680" font-family="'Pretendard', sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.65">경비 자동 수집으로 세금 신고 간소화</text>

  <!-- Checklist Item 5 -->
  <rect x="60" y="725" width="960" height="105" rx="16" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="753" width="48" height="48" rx="10" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
