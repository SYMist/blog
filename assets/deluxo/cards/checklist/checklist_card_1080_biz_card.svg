<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="50" width="160" height="44" rx="22" fill="#F59E0B"/>
  <text x="140" y="79" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#0B1F3B">필수 확인</text>

  <!-- Title -->
  <text x="60" y="155" font-family="'Pretendard', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">카드 발급 전 1분 체크리스트</text>

  <!-- Divider -->
  <line x1="60" y1="183" x2="1020" y2="183" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Checklist Item 1 -->
  <rect x="60" y="225" width="960" height="105" rx="16" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="253" width="48" height="48" rx="10" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
  <text x="114" y="286" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">&#10003;</text>
  <text x="160" y="270" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">최대 지출 항목 확인</text>
  <text x="160" y="305" font-family="'Pretendard', sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.65">4대보험 / 주유 / 식자재 / 광고</text>

  <!-- Checklist Item 2 -->
  <rect x="60" y="350" width="960" height="105" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="90" y="378" width="48" height="48" rx="10" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
  <text x="114" y="411" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">&#10003;</text>
  <text x="160" y="395" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">4대보험 카드 혜택 > 수수료 0.8% 확인</text>
  <text x="160" y="430" font-family="'Pretendard', sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.65">수수료 대비 캐시백이 높은지 비교</text>

  <!-- Checklist Item 3 -->
  <rect x="60" y="475" width="960" height="105" rx="16" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="503" width="48" height="48" rx="10" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
  <text x="114" y="536" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">&#10003;</text>
  <text x="160" y="520" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">메인카드 + 서브카드 조합 결정</text>
  <text x="160" y="555" font-family="'Pretendard', sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.65">업종별 최적 2장 조합 선택</text>

  <!-- Checklist Item 4 -->
  <rect x="60" y="600" width="960" height="105" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="90" y="628" width="48" height="48" rx="10" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
