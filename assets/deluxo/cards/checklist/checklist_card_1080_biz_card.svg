  <text x="160" y="770" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">바우처 25만 원 소상공인24 신청</text>
  <text x="160" y="805" font-family="'Pretendard', sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.65">소상공인24에서 바우처 신청 가능</text>

  <!-- Checklist Item 6 -->
  <rect x="60" y="850" width="960" height="105" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="90" y="878" width="48" height="48" rx="10" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
  <text x="114" y="911" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">&#10003;</text>
  <text x="160" y="895" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">카드론·현금서비스 잔액 확인 (DSR)</text>
  <text x="160" y="930" font-family="'Pretendard', sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.65">잔액 과다 시 발급 거절 가능</text>

  <!-- Chips -->
  <rect x="60" y="990" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="108" y="1018" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">체크</text>

  <rect x="176" y="990" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="224" y="1018" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">발급</text>

  <rect x="292" y="990" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="340" y="1018" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">등록</text>
</svg>