<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#F8FAFC"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>
  <text x="120" y="170" font-size="48" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">신청 전 체크리스트</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">긴급복지 지원금 1분 점검</text>
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#111827" font-size="30">
    <text x="170" y="360">□ 법정 위기사유(사망·질병·화재·실직 등) 해당</text>
    <text x="170" y="440">□ 가구소득 중위소득 75% 이하 충족</text>
    <text x="170" y="520">□ 재산·금융재산 기준 충족</text>
    <text x="170" y="600">□ 생계급여·실업급여 등 미수급 상태</text>
    <text x="170" y="680">□ 동일 사유 2년 내 지원 이력 없음</text>
    <text x="170" y="760">□ 위기사유 증빙서류 확보 가능</text>
    <text x="170" y="840">□ ☎129 또는 주민센터 연락처 확인</text>
  </g>
  <rect x="120" y="890" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="945" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    위기 발생 즉시 ☎129 신고 → 선 지원, 후 조사
  </text>
</svg>
