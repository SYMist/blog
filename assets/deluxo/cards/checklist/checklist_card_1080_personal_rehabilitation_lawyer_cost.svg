<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <rect x="60" y="60" width="340" height="60" rx="30" fill="#10B981"/>
  <text x="230" y="101" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">신청 전 1분 체크</text>

  <text x="540" y="200" font-family="'Pretendard', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle">개인회생 8단계 확인</text>

  <rect x="60" y="270" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="320" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="320" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">최근 6개월 신규 대출·카드론 없음</text>

  <rect x="60" y="370" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="420" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="420" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">채무 총액 무담보 10억·담보 15억 이하</text>

  <rect x="60" y="470" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="520" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="520" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">정기 소득 증빙 가능 (근로·사업·연금)</text>

  <rect x="60" y="570" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="620" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="620" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">가족 명의 재산·차명계좌 정리 완료</text>

  <rect x="60" y="670" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="720" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="720" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">과거 5년 내 회생·7년 내 파산 이력 없음</text>

  <rect x="60" y="770" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="820" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="820" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">법원 실비 70~90만 원 예치 가능</text>

  <rect x="60" y="870" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="920" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="920" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">소상공인 — 매출 3억 이하 소송구조 확인</text>

  <rect x="60" y="970" width="960" height="80" rx="16" fill="#F59E0B"/>
  <text x="100" y="1020" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#0B1F3B">☑</text>
  <text x="160" y="1020" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#0B1F3B">대한법률구조공단 132 무료상담 예약</text>
</svg>
