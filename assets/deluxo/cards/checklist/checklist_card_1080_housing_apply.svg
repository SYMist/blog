<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="280" height="44" rx="22" fill="#F59E0B"/>
  <text x="200" y="79" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#0B1F3B">청약 전 체크리스트</text>

  <!-- 메인 제목 -->
  <text x="60" y="150" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">주택청약 당첨 전략</text>
  <text x="60" y="210" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">확인하셨나요?</text>

  <!-- 구분선 -->
  <rect x="60" y="240" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Check 1 -->
  <rect x="60" y="280" width="960" height="90" rx="14" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="305" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="335" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="330" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">구형 통장 → 종합저축 전환 완료</text>
  <text x="140" y="358" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">청약예금·부금은 민영 청약 불가 — 주택청약종합저축으로 전환</text>

  <!-- Check 2 -->
  <rect x="60" y="385" width="960" height="90" rx="14" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="410" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="440" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="435" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">매월 25만 원 납입 설정 확인</text>
  <text x="140" y="463" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">자동이체 변경 — 납입 인정액 최대화</text>

  <!-- Check 3 -->
  <rect x="60" y="490" width="960" height="90" rx="14" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="515" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="545" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="540" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">가점 계산기 총점 확인 (청약홈)</text>
  <text x="140" y="568" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">무주택·부양가족·가입기간 84점 만점 기준 내 점수 산출</text>

  <!-- Check 4 -->
  <rect x="60" y="595" width="960" height="90" rx="14" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="620" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="650" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="645" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">배우자 가입 기간 합산 여부 확인</text>
  <text x="140" y="673" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">배우자 통장 유지 중이면 최대 +3점 추가 가능</text>

  <!-- Check 5 -->
  <rect x="60" y="700" width="960" height="90" rx="14" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="725" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="755" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="750" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">특별공급 자격 확인 (신생아·신혼·다자녀)</text>
  <text x="140" y="778" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">일반공급 전 특공 자격 먼저 검토 — 당첨 확률 높음</text>

  <!-- Check 6 -->
  <rect x="60" y="805" width="960" height="90" rx="14" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="830" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="860" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="855" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">소득·자산 기준 충족 여부 점검</text>
  <text x="140" y="883" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">특공·공공분양 소득·순자산 기준 초과 시 탈락</text>

  <!-- Check 7 -->
  <rect x="60" y="910" width="960" height="90" rx="14" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="935" width="40" height="40" rx="10" fill="#10B981"/>
  <text x="100" y="965" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="140" y="960" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">자금 계획 수립 (DSR 반영)</text>
  <text x="140" y="988" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#94A3B8">당첨 후 대출 한도 DSR 40% 기준 미리 산정</text>

  <!-- 칩 -->
  <rect x="60" y="1020" width="150" height="36" rx="18" fill="#E8F0FF"/>
  <text x="135" y="1044" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">체크리스트</text>
  <rect x="230" y="1020" width="100" height="36" rx="18" fill="#E8F0FF"/>
  <text x="280" y="1044" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">저장</text>
  <rect x="350" y="1020" width="100" height="36" rx="18" fill="#E8F0FF"/>
  <text x="400" y="1044" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">2026</text>
</svg>