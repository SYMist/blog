<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="55" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="140" y="86" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B">필수 확인</text>

  <!-- Title -->
  <text x="60" y="165" font-family="'Pretendard', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">법인전환 전 1분 체크리스트</text>

  <!-- Divider -->
  <rect x="60" y="190" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Checklist Item 1 -->
  <rect x="60" y="240" width="960" height="105" rx="20" fill="rgba(255,255,255,0.05)" filter="url(#shadow)"/>
  <rect x="90" y="270" width="44" height="44" rx="12" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="2"/>
  <text x="112" y="301" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#34D399">&#10003;</text>
  <text x="155" y="300" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">연 소득 5,000만↑ 또는 성실신고 기준 도달</text>

  <!-- Checklist Item 2 -->
  <rect x="60" y="365" width="960" height="105" rx="20" fill="rgba(255,255,255,0.05)" filter="url(#shadow)"/>
  <rect x="90" y="395" width="44" height="44" rx="12" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="2"/>
  <text x="112" y="426" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#34D399">&#10003;</text>
  <text x="155" y="425" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">소규모 법인 3요건 해당 여부 확인</text>

  <!-- Checklist Item 3 -->
  <rect x="60" y="490" width="960" height="105" rx="20" fill="rgba(255,255,255,0.05)" filter="url(#shadow)"/>
  <rect x="90" y="520" width="44" height="44" rx="12" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="2"/>
  <text x="112" y="551" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#34D399">&#10003;</text>
  <text x="155" y="543" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">부동산 포함 → 방식 결정</text>
  <text x="155" y="573" font-family="'Pretendard', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">포괄양수도 vs 현물출자</text>

  <!-- Checklist Item 4 -->
  <rect x="60" y="615" width="960" height="105" rx="20" fill="rgba(255,255,255,0.05)" filter="url(#shadow)"/>
  <rect x="90" y="645" width="44" height="44" rx="12" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="2"/>
  <text x="112" y="676" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#34D399">&#10003;</text>
  <text x="155" y="675" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">자본금 ≥ 순자산가액 확인</text>

  <!-- Checklist Item 5 -->
  <rect x="60" y="740" width="960" height="105" rx="20" fill="rgba(255,255,255,0.05)" filter="url(#shadow)"/>
  <rect x="90" y="770" width="44" height="44" rx="12" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="2"/>
  <text x="112" y="801" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#34D399">&#10003;</text>
  <text x="155" y="793" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">취득세 감면 일몰(2027.12.31) 전 완료</text>
  <text x="155" y="823" font-family="'Pretendard', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">기한 경과 시 감면 혜택 소멸</text>

  <!-- Checklist Item 6 -->
  <rect x="60" y="865" width="960" height="105" rx="20" fill="rgba(255,255,255,0.05)" filter="url(#shadow)"/>
  <rect x="90" y="895" width="44" height="44" rx="12" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="2"/>
  <text x="112" y="926" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#34D399">&#10003;</text>
  <text x="155" y="925" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">정관에 퇴직금·보수 규정 삽입</text>

  <!-- Chips -->
  <rect x="60" y="1000" width="100" height="46" rx="32" fill="#E8F0FF"/>
  <text x="110" y="1030" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">체크</text>

  <rect x="180" y="1000" width="100" height="46" rx="32" fill="#E8F0FF"/>
  <text x="230" y="1030" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">절차</text>

  <rect x="300" y="1000" width="100" height="46" rx="32" fill="#E8F0FF"/>
  <text x="350" y="1030" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">서류</text>

  <!-- Footer -->
  <text x="1020" y="1055" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="18" font-weight="400" fill="#475569">tistory.deluxo · 2026</text>
