<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="48" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">노란우산공제 체크리스트</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">가입 전 1분 점검</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Checklist Items -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#111827" font-size="30">
    <text x="170" y="360">□ 소상공인/법인대표 가입 대상 확인</text>
    <text x="170" y="430">□ 내 소득구간 공제 한도 확인</text>
    <text x="170" y="500">□ 임의해약 가능성(세금·환급) 점검</text>
    <text x="170" y="570">□ 재난·질병 등 위기 대비 필요성 체크</text>
    <text x="170" y="640">□ 공제계약대출 한도·이율 확인</text>
    <text x="170" y="710">□ 지자체 장려금 운영 여부 확인</text>
    <text x="170" y="780">□ 납입 금액·주기 현실적으로 설정</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="840" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="895" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    해약 리스크 점검이 가장 중요합니다
  </text>
</svg>
