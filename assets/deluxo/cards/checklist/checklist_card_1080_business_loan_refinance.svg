<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <rect x="60" y="60" width="320" height="60" rx="30" fill="#10B981"/>
  <text x="220" y="101" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">신청 전 체크리스트</text>

  <text x="540" y="200" font-family="'Pretendard', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle">갈아타기 8단계</text>

  <rect x="60" y="270" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="320" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="320" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">기존 대출 시점이 2025.06.30 이전인가?</text>

  <rect x="60" y="370" width="960" height="80" rx="16" fill="#1A3270"/>
  <text x="100" y="420" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
