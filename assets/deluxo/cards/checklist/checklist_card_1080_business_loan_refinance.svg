  <text x="100" y="720" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#10B981">☑</text>
  <text x="160" y="720" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">사업용 가계대출은 자금 사용 증빙 준비</text>

  <rect x="60" y="770" width="960" height="80" rx="16" fill="#1A3270"/>
