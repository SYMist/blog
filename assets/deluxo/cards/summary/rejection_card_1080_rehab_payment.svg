<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">변제금 계산 실수 TOP 5</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- Item 1 -->
  <rect x="60" y="125" width="960" height="165" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="145" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="175" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">1</text>
  <text x="160" y="175" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">추가 생계비 미신청</text>
  <rect x="530" y="155" width="140" height="30" rx="15" fill="rgba(239,68,68,0.3)"/>
  <text x="600" y="176" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#EF4444">변제금 폭탄</text>
  <text x="160" y="215" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">서울 주거비 31.5만 · 의료비 · 양육비 누락 시</text>
  <text x="160" y="250" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">→ 추가 생계비만으로 변제금 30만 원 이상 절감 가능!</text>

  <!-- Item 2 -->
  <rect x="60" y="305" width="960" height="165" rx="20" fill="rgba(239,68,68,0.08)"/>
  <rect x="80" y="325" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="355" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">2</text>
  <text x="160" y="355" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">면제재산 신청 누락</text>
  <rect x="500" y="335" width="180" height="30" rx="15" fill="rgba(239,68,68,0.3)"/>
  <text x="590" y="356" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#EF4444">청산가치↑ 변제금↑</text>
  <text x="160" y="395" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">예금 250만 · 보험 250만 면제 안 하면 청산가치 상승</text>
  <text x="160" y="430" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">→ 면제재산 신청서 별도 제출 필수 (자동 적용 아님!)</text>

  <!-- Item 3 -->
  <rect x="60" y="485" width="960" height="165" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="505" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="535" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">3</text>
  <text x="160" y="535" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">부양가족 수 미소명</text>
  <rect x="490" y="515" width="250" height="30" rx="15" fill="rgba(239,68,68,0.3)"/>
  <text x="615" y="536" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#EF4444">1명 차이 = 생계비 60~100만 차이</text>
  <text x="160" y="575" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">부양가족 증빙 미제출 → 1인 기준 적용 → 변제금 폭증</text>
  <text x="160" y="610" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">→ 주민등록등본 · 가족관계증명서 반드시 첨부!</text>

  <!-- Item 4 -->
  <rect x="60" y="665" width="960" height="165" rx="20" fill="rgba(239,68,68,0.08)"/>
  <rect x="80" y="685" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="715" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">4</text>
  <text x="160" y="715" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">3회 연체로 폐지</text>
  <rect x="460" y="695" width="120" height="30" rx="15" fill="rgba(239,68,68,0.3)"/>
  <text x="520" y="716" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#EF4444">인가 취소</text>
  <text x="160" y="755" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">변제금 3회 이상 미납 시 → 개인회생 폐지 결정</text>
  <text x="160" y="790" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">→ 자동이체 설정 필수! 어려우면 변제계획 변경안 활용</text>

  <!-- Item 5 -->
  <rect x="60" y="845" width="960" height="165" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="865" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="895" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">5</text>
  <text x="160" y="895" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">소득 축소 시도</text>
  <rect x="430" y="875" width="200" height="30" rx="15" fill="rgba(239,68,68,0.3)"/>
  <text x="530" y="896" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#EF4444">폐지 + 면책 불허</text>
  <text x="160" y="935" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">마이데이터 통합 조회로 소득·재산 전수 확인</text>
  <text x="160" y="970" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">→ 적발 시 회생 폐지 + 향후 면책 불허가 사유!</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>