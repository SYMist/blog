  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="85" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="800" fill="#34D399" text-anchor="middle">법인 전환 결정 전</text>
  <text x="540" y="140" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" text-anchor="middle">1분 체크리스트</text>
  <line x1="80" y1="165" x2="1000" y2="165" stroke="#1A3270" stroke-width="2"/>

  <!-- Checklist items -->
  <!-- Item 1 -->
  <rect x="80" y="185" width="920" height="100" rx="10" fill="#0D2347"/>
  <rect x="80" y="205" width="50" height="60" rx="8" fill="#34D399" fill-opacity="0.2"/>
  <text x="105" y="245" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#34D399" text-anchor="middle">✓</text>
  <text x="150" y="228" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">순이익 연 2억원 이상 여부 확인</text>
  <text x="150" y="265" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">미만이면 유지비 대비 효과 검토 필요</text>

