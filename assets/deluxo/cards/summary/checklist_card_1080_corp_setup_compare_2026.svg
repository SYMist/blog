  <rect x="80" y="415" width="920" height="100" rx="10" fill="#0D2347"/>
  <rect x="80" y="435" width="50" height="60" rx="8" fill="#34D399" fill-opacity="0.2"/>
  <text x="105" y="475" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#34D399" text-anchor="middle">✓</text>
  <text x="150" y="458" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">설립 예정지 과밀억제권역 여부 확인</text>
