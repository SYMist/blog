  <text x="150" y="688" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">세무사 급여 시뮬레이션 요청</text>
  <text x="150" y="725" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">법인세 + 대표이사 종소세 합산 최적 급여 수준 산출</text>

  <!-- Item 6 -->
  <rect x="80" y="760" width="920" height="100" rx="10" fill="#102A56"/>
  <rect x="80" y="780" width="50" height="60" rx="8" fill="#34D399" fill-opacity="0.2"/>
  <text x="105" y="820" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#34D399" text-anchor="middle">✓</text>
  <text x="150" y="803" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">가족법인이라면 가족 업무 참여 증빙 준비</text>
  <text x="150" y="840" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">급여 적정성 증빙 없으면 부당행위계산 부인 리스크</text>

  <!-- Bottom note -->
  <rect x="80" y="880" width="920" height="80" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
  <text x="540" y="920" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">6개 항목 모두 확인 후 법인 전환 결정하세요</text>
  <text x="540" y="950" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">준비 없는 전환은 오히려 비용 증가로 이어질 수 있습니다</text>

  <text x="540" y="1020" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4B6A9A" text-anchor="middle">startbiz.go.kr | hometax.go.kr | nts.go.kr</text>
  <text x="540" y="1055" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#2D4A7A" text-anchor="middle">2026년 법인세율·설립 비용 기준</text>
