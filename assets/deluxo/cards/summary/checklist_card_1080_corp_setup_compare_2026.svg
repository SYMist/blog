  <rect x="80" y="300" width="920" height="100" rx="10" fill="#102A56"/>
  <rect x="80" y="320" width="50" height="60" rx="8" fill="#34D399" fill-opacity="0.2"/>
  <text x="105" y="360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#34D399" text-anchor="middle">✓</text>
  <text x="150" y="343" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">법인 유지비 월 20~40만원 감당 가능 여부</text>
  <text x="150" y="380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">세무사 기장료 + 4대보험 + 기타 고정비 포함</text>

