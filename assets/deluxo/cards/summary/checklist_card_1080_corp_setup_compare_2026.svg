  <text x="150" y="610" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">너무 낮으면 법인 통장 개설 거절 사례 있음</text>

  <!-- Item 5 -->
  <rect x="80" y="645" width="920" height="100" rx="10" fill="#0D2347"/>
