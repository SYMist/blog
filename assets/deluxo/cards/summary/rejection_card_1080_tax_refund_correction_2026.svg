<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="130" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#EF4444" text-anchor="middle">⚠ 경정청구 거절·경비 부인 TOP 5</text>
  <text x="540" y="210" font-family="'Pretendard', sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">이것만은 피하세요</text>

  <rect x="60" y="270" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="325" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">① 증빙 쪼개기</text>
  <text x="100" y="375" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">3만 초과를 분할해 간이영수증 → 실질과세 부인</text>

  <rect x="60" y="430" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="485" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">② 원천세 미신고 인건비</text>
  <text x="100" y="535" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">지급명세서 없는 인건비 → 경비 부인 + 가산세</text>

  <rect x="60" y="590" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="645" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">③ 운행기록부 없이 1,500만 초과</text>
  <text x="100" y="695" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">업무용 차량 비용 초과분 전액 부인</text>

  <rect x="60" y="750" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="805" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">④ 가사관련비 혼입</text>
  <text x="100" y="855" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">본인 식대·가족 차량·성형·여행비 → §33 부인</text>

  <rect x="60" y="910" width="960" height="140" rx="20" fill="#F59E0B"/>
  <text x="100" y="965" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">⑤ 기한 경과 5년·3개월</text>
  <text x="100" y="1015" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B">통상 5년 · 후발적 사유 3개월 초과 → 각하</text>
</svg>
