<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="46" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">폐업지원금 요약표</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">희망리턴패키지 핵심 정리</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Rows -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <text x="120" y="340" font-size="30" fill="#111827" font-weight="700">대상</text>
    <text x="260" y="340" font-size="28" fill="#374151">폐업(예정) 소상공인 + 요건 충족</text>

    <line x1="120" y1="380" x2="960" y2="380" stroke="#F1F5F9"/>

    <text x="120" y="440" font-size="30" fill="#111827" font-weight="700">철거비</text>
    <text x="260" y="440" font-size="28" fill="#374151">평당 13만 원 기준, 최대 250만 원</text>
    <text x="260" y="475" font-size="26" fill="#6B7280">실비 범위 내 정산 (공고 기준)</text>

    <line x1="120" y1="515" x2="960" y2="515" stroke="#F1F5F9"/>

    <text x="120" y="575" font-size="30" fill="#111827" font-weight="700">수당</text>
    <text x="260" y="575" font-size="28" fill="#374151">전직 장려수당 최대 100만 원</text>

    <line x1="120" y1="615" x2="960" y2="615" stroke="#F1F5F9"/>

    <text x="120" y="675" font-size="30" fill="#111827" font-weight="700">신청</text>
    <text x="260" y="675" font-size="28" fill="#374151">온라인 접수, 선착순 예산 소진</text>
    <text x="260" y="710" font-size="26" fill="#6B7280">접수일 공고 확인 필수</text>

    <line x1="120" y1="750" x2="960" y2="750" stroke="#F1F5F9"/>

    <text x="120" y="810" font-size="30" fill="#111827" font-weight="700">주의</text>
    <text x="260" y="810" font-size="28" fill="#374151">철거 전 사전 신청 원칙</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="860" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="915" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    금액·기간은 공고 기준으로 최종 확인
  </text>
</svg>
