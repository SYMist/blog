<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#F59E0B"/>

  <!-- Title -->
  <text x="540" y="66" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">개인사업자 vs 가족법인 — 10초 판단 가이드</text>
  <text x="540" y="100" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">나는 지금 어느 단계인가? 아래 6가지로 판단하세요</text>
  <line x1="60" y1="122" x2="1020" y2="122" stroke="#1A3270" stroke-width="2"/>

  <!-- Table header -->
  <rect x="60" y="140" width="960" height="50" rx="8" fill="#1A3270"/>
  <text x="220" y="172" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="middle">판단 기준</text>
  <text x="540" y="172" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#A0B4D0" text-anchor="middle">개인사업자 유지</text>
  <text x="840" y="172" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle">법인(가족법인) 전환</text>

  <!-- Row 1 -->
  <rect x="60" y="190" width="960" height="66" rx="0" fill="#0D2347"/>
  <text x="220" y="220" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">순이익 규모</text>
  <text x="540" y="220" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#A0B4D0" text-anchor="middle">연 5,000만원 미만</text>
  <text x="840" y="218" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#34D399" text-anchor="middle">연 5,000만원 이상</text>
  <text x="840" y="240" font-family="-apple-system, sans-serif" font-size="12" fill="#34D399" text-anchor="middle">총매출 6~10억 이상</text>

  <!-- Row 2 -->
  <rect x="60" y="256" width="960" height="66" rx="0" fill="#102A56"/>
  <text x="220" y="296" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">세율 상한</text>
  <text x="540" y="290" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#EF4444" text-anchor="middle">소득세 최고 45%</text>
  <text x="840" y="290" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">법인세 최고 25%</text>

  <!-- Row 3 -->
  <rect x="60" y="322" width="960" height="66" rx="0" fill="#0D2347"/>
  <text x="220" y="362" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">대표이사 급여 처리</text>
  <text x="540" y="356" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">불가</text>
  <text x="540" y="374" font-family="-apple-system, sans-serif" font-size="12" fill="#A0B4D0" text-anchor="middle">(소득 전체 과세)</text>
  <text x="840" y="356" font-family="-apple-system, sans-serif" font-size="16" fill="#34D399" text-anchor="middle">가능 (법인 비용 인정)</text>
  <text x="840" y="374" font-family="-apple-system, sans-serif" font-size="12" fill="#34D399" text-anchor="middle">과세표준 감소 효과</text>

  <!-- Row 4 -->
  <rect x="60" y="388" width="960" height="66" rx="0" fill="#102A56"/>
  <text x="220" y="428" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">퇴직금 적립</text>
  <text x="540" y="422" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">개인 부담</text>
  <text x="840" y="422" font-family="-apple-system, sans-serif" font-size="16" fill="#34D399" text-anchor="middle">법인 적립 가능</text>
  <text x="840" y="440" font-family="-apple-system, sans-serif" font-size="12" fill="#34D399" text-anchor="middle">비용 처리 가능</text>

  <!-- Row 5 -->
  <rect x="60" y="454" width="960" height="66" rx="0" fill="#0D2347"/>
  <text x="220" y="494" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">가족 자금 이전</text>
  <text x="540" y="488" font-family="-apple-system, sans-serif" font-size="16" fill="#EF4444" text-anchor="middle">증여세 부담 높음</text>
  <text x="840" y="488" font-family="-apple-system, sans-serif" font-size="16" fill="#34D399" text-anchor="middle">배당·급여로 합법 이전</text>
  <text x="840" y="506" font-family="-apple-system, sans-serif" font-size="12" fill="#34D399" text-anchor="middle">소득 분산 효과</text>

  <!-- Row 6 -->
  <rect x="60" y="520" width="960" height="66" rx="0" fill="#1A3270"/>
  <rect x="60" y="520" width="960" height="66" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <text x="220" y="560" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle">한 줄 요약</text>
  <text x="540" y="554" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">소규모·초기 사업자</text>
  <text x="540" y="572" font-family="-apple-system, sans-serif" font-size="12" fill="#A0B4D0" text-anchor="middle">법인 유지 비용이 더 클 수 있음</text>
  <text x="840" y="554" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">이익이 안정적으로 발생하는 단계</text>
  <text x="840" y="572" font-family="-apple-system, sans-serif" font-size="12" fill="#34D399" text-anchor="middle">절세 효과 &gt; 법인 유지 비용</text>

  <!-- 법인 유지 비용 안내 -->
  <rect x="60" y="616" width="960" height="80" rx="12" fill="#0D2347"/>
  <rect x="60" y="616" width="960" height="80" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="540" y="648" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="middle">법인 유지 비용 (절세액과 비교 필수)</text>
  <text x="540" y="676" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">세무기장료 월 10~30만원 + 법인세 신고 비용 + 4대보험 사업장 관리</text>

  <!-- 절세 시뮬레이션 박스 -->
  <rect x="60" y="720" width="960" height="130" rx="12" fill="#1A3270"/>
  <rect x="60" y="720" width="960" height="130" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="540" y="756" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle">절세 시뮬레이션 — 순이익 1억원 기준</text>
  <text x="285" y="790" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">개인사업자</text>
  <text x="285" y="812" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="middle">약 2,211만원</text>
  <text x="285" y="834" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">소득세 2,010 + 지방소득세 201</text>
  <text x="540" y="814" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" fill="#34D399" text-anchor="middle">→</text>
  <text x="795" y="790" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">법인 + 대표이사 급여 4,000만원 시</text>
  <text x="795" y="812" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#34D399" text-anchor="middle">약 930만원</text>
  <text x="795" y="834" font-family="-apple-system, sans-serif" font-size="13" fill="#34D399" text-anchor="middle">법인세 600 + 개인 소득세 330</text>

  <!-- Bottom note -->
  <rect x="60" y="876" width="960" height="62" rx="10" fill="#0D2347"/>
  <text x="540" y="904" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="middle">연간 절감: 약 1,281만원 → 5년 누적 약 6,400만원+</text>
  <text x="540" y="926" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">※ 법인 유지 비용 제외 전 수치. 세무사 상담을 통한 정확한 시뮬레이션 권장</text>

  <!-- Footer -->
  <text x="540" y="974" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 개인 상황에 따라 효과 상이 | 전문가 상담 후 결정 권장</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
</svg>
