<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="80" y="60" width="180" height="52" rx="26" fill="#F59E0B"/>
  <text x="170" y="95" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#0B1F3B">5줄 요약</text>

  <!-- Title -->
  <text x="80" y="175" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFF">소상공인 창업지원금</text>
  <text x="80" y="235" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFF">핵심 체크포인트</text>

  <!-- Item 1 -->
  <rect x="80" y="290" width="920" height="120" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="100" y="315" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="128" y="354" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">1</text>
  <text x="180" y="345" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">비상환 보조금 초기 1억 · 도약 2~3억</text>
  <text x="180" y="383" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">갚지 않는 보조금 — 창업패키지 경쟁 선발</text>

  <!-- Item 2 -->
  <rect x="80" y="425" width="920" height="120" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="100" y="450" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="128" y="489" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">2</text>
  <text x="180" y="480" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">청년 전용 대출 연 2.5% 고정 최대 1억</text>
  <text x="180" y="518" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">만 39세 이하 소상공인 전용 저금리 대출</text>

  <!-- Item 3 -->
  <rect x="80" y="560" width="920" height="120" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="100" y="585" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="128" y="624" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">3</text>
  <text x="180" y="615" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">정책자금 일반 7천만 / 성장 1억 / 도약 2억</text>
  <text x="180" y="653" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">소진공 직접대출 — 업력별 한도 차등</text>

  <!-- Item 4 -->
  <rect x="80" y="695" width="920" height="120" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="100" y="720" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="128" y="759" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">4</text>
  <text x="180" y="748" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">인천 이차보전 경영안정 5,000만 + 청년보증 3,000만</text>
  <text x="180" y="786" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">지자체 추가 지원 — 이자 차액 보전</text>

  <!-- Item 5 -->
  <rect x="80" y="830" width="920" height="120" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="100" y="855" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="128" y="894" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">5</text>
  <text x="180" y="883" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">교육 12시간 사전 이수 필수 (확인서 발급)</text>
  <text x="180" y="921" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">지식배움터 이수 → 정책자금 신청 자격 확보</text>

  <!-- Bottom Chips -->
  <rect x="80" y="985" width="200" height="52" rx="26" fill="#E8F0FF"/>
  <text x="180" y="1019" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">창업지원금</text>
  <rect x="310" y="985" width="130" height="52" rx="26" fill="#E8F0FF"/>
  <text x="375" y="1019" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">대출</text>
  <rect x="470" y="985" width="130" height="52" rx="26" fill="#E8F0FF"/>
  <text x="535" y="1019" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">2026</text>
</svg>