<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="12" fill="url(#accent)"/>

  <!-- Title -->
  <text x="540" y="78" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">청년 미래적금 가입 실패 TOP 5</text>
  <text x="540" y="118" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">이 5가지만 피하면 가입 성공률 높아진다</text>

  <!-- Divider -->
  <rect x="60" y="136" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- Mistake 1 -->
  <rect x="60" y="154" width="960" height="142" rx="16" fill="#1A3270"/>
  <circle cx="112" cy="225" r="32" fill="#EF4444"/>
  <text x="112" y="233" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="170" y="202" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FCA5A5">나이 기준 초과 (군복무 인정 미확인)</text>
  <text x="170" y="234" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">만 35세 이상은 가입 불가 — 단, 병역 이행 기간은 최대 2년 추가 인정</text>
  <text x="170" y="264" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">2년 군복무 경우 만 36세까지 가입 가능할 수 있으므로 반드시 확인</text>

  <!-- Mistake 2 -->
  <rect x="60" y="310" width="960" height="142" rx="16" fill="#1A3270"/>
  <circle cx="112" cy="381" r="32" fill="#EF4444"/>
  <text x="112" y="389" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="170" y="358" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FCA5A5">소득 기준 착오 (올해 연봉 vs 전전년도 기준)</text>
  <text x="170" y="390" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">소득 판정은 전전년도 확정 소득을 기준으로 적용하는 경우가 많음</text>
  <text x="170" y="420" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">올해 연봉이 6,000만원 초과해도 2024년 소득이 기준 이하면 가입 가능할 수 있음</text>

  <!-- Mistake 3 -->
  <rect x="60" y="466" width="960" height="142" rx="16" fill="#1A3270"/>
  <circle cx="112" cy="537" r="32" fill="#EF4444"/>
  <text x="112" y="545" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="170" y="514" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FCA5A5">가구소득 200% 기준 초과</text>
  <text x="170" y="546" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">개인 소득이 낮아도 부모·배우자 소득 합산 후 가구 중위소득 초과 시 탈락</text>
  <text x="170" y="576" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">건강보험료 조회로 가구소득 기준 사전 확인 필수</text>

  <!-- Mistake 4 -->
  <rect x="60" y="622" width="960" height="142" rx="16" fill="#1A3270"/>
  <circle cx="112" cy="693" r="32" fill="#EF4444"/>
  <text x="112" y="701" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="170" y="670" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FCA5A5">청년도약계좌와 중복 신청 시도</text>
  <text x="170" y="702" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">두 상품은 중복 가입 불가 — 도약계좌 유지 중이면 가입 신청 자체가 안 됨</text>
  <text x="170" y="732" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">갈아타기 원한다면 도약계좌 중도해지 절차 먼저 진행</text>

  <!-- Mistake 5 -->
  <rect x="60" y="778" width="960" height="142" rx="16" fill="#1A3270"/>
  <circle cx="112" cy="849" r="32" fill="#EF4444"/>
  <text x="112" y="857" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="170" y="826" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FCA5A5">출시 후 신청 기간 내 미신청</text>
  <text x="170" y="858" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">청년도약계좌처럼 선착순·기간 한정 신청 가능 — 출시 초반 가입자 몰림 예상</text>
  <text x="170" y="888" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">서민금융진흥원(kinfa.or.kr) 알림 설정 + 은행 앱 사전 등록 권장</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
