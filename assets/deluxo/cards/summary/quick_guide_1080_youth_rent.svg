<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">빠른 판단</text>

  <!-- Title -->
  <text x="80" y="185" font-family="'Pretendard', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">어떤 지원을 받을 수 있나?</text>
  <text x="80" y="235" font-family="'Pretendard', sans-serif" font-size="32" font-weight="600" fill="rgba(255,255,255,0.7)">10초 판단</text>

  <!-- Divider -->
  <rect x="80" y="265" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Row 1 -->
  <rect x="60" y="310" width="960" height="150" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="355" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="rgba(255,255,255,0.8)">만19~34세 + 소득 중위60%↓</text>
  <rect x="100" y="375" width="40" height="3" rx="1.5" fill="#F59E0B"/>
  <text x="100" y="410" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#F59E0B">국토부 월세 지원</text>
  <text x="440" y="410" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">480만 원</text>

  <!-- Row 2 -->
  <rect x="60" y="480" width="960" height="150" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="525" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="rgba(255,255,255,0.8)">만35~39세 + 서울 거주</text>
  <rect x="100" y="545" width="40" height="3" rx="1.5" fill="#F59E0B"/>
  <text x="100" y="580" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#F59E0B">서울시 월세 지원</text>
  <text x="400" y="580" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">240만 원</text>

  <!-- Row 3 -->
  <rect x="60" y="650" width="960" height="150" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="695" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="rgba(255,255,255,0.8)">만35~39세 + 인천 거주</text>
  <rect x="100" y="715" width="40" height="3" rx="1.5" fill="#F59E0B"/>
  <text x="100" y="750" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#F59E0B">인천형 월세 + 이사비</text>

  <!-- Row 4 -->
  <rect x="60" y="820" width="960" height="150" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="865" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="rgba(255,255,255,0.8)">소득 중위48%↓ + 부모와 별도 거주</text>
  <rect x="100" y="885" width="40" height="3" rx="1.5" fill="#F59E0B"/>
  <text x="100" y="920" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#F59E0B">주거급여 분리지급</text>
</svg>