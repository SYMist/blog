  <text x="100" y="515" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F59E0B">② 소규모 법인 / 중기업</text>
  <text x="100" y="565" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">운용리스 + 장기렌트 혼합</text>
  <text x="100" y="605" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">업무전용 자동차보험 의무 가입</text>

  <rect x="60" y="650" width="960" height="170" rx="24" fill="#1A3270"/>
