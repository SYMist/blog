<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="40" y="36" width="200" height="44" rx="22" fill="#F59E0B"/>
  <text x="140" y="65" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">2026 최신</text>

  <!-- 제목 -->
  <text x="40" y="130" font-family="'Pretendard',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">부산·대구·광주</text>
  <text x="40" y="185" font-family="'Pretendard',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">소상공인 지원금 요약</text>

  <!-- 구분선 -->
  <rect x="40" y="210" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- 전국 공통 -->
  <rect x="40" y="240" width="1000" height="100" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="70" y="275" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">전국 공통</text>
  <text x="70" y="310" font-family="'Pretendard',sans-serif" font-size="24" font-weight="600" fill="#EAF2FF">경영안정 바우처 25만 원 + 비수도권 금리 0.2%p 우대 + 고용보험 50~80% 환급</text>

  <!-- 부산 -->
  <rect x="40" y="360" width="1000" height="160" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="70" y="400" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">부산</text>
  <text x="160" y="400" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">로컬 브랜드 + 육아 특화</text>
  <text x="70" y="438" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 스타소상공인 2,000만 원 (10개사)</text>
  <text x="70" y="470" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 육성자금 최대 1.2억 원 (1.5% 이차보전)</text>
  <text x="70" y="502" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 육아응원 패키지 최대 460만 원 (3종)</text>

  <!-- 대구 -->
  <rect x="40" y="540" width="1000" height="160" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="70" y="580" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">대구</text>
  <text x="160" y="580" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">이자 지원 + 출산·양육</text>
  <text x="70" y="618" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 전략산업 1.7% 이자 지원 (2년)</text>
  <text x="70" y="650" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 구청별 최대 3,000만 원 (2~3% 이차보전)</text>
  <text x="70" y="682" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 출산양육비 250만 원 + 육아응원금 100만 원</text>

  <!-- 광주 -->
  <rect x="40" y="720" width="1000" height="160" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="70" y="760" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">광주</text>
  <text x="160" y="760" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">인건비 + 보험료 지원</text>
  <text x="70" y="798" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 신규 채용 인건비 월 50만 원 (최대 2명×3개월)</text>
  <text x="70" y="830" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 특례보증 5,000만 원 (3~4% 이자 지원)</text>
  <text x="70" y="862" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">• 사회보험료 산재 50~100% 지원 (최대 3년)</text>

  <!-- 하단 총합 -->
  <rect x="40" y="910" width="1000" height="80" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="945" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">3개 도시 혜택 합산 시 수백만~수천만 원 절감 가능</text>
  <text x="540" y="975" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">전국 바우처 + 지역 고유 사업 중복 수혜 가능</text>

  <!-- 칩 -->
  <rect x="40" y="1020" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="90" y="1045" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">부산</text>
  <rect x="155" y="1020" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="205" y="1045" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">대구</text>
  <rect x="270" y="1020" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="320" y="1045" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">광주</text>
</svg>
