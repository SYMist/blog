  <rect x="60" y="945" width="960" height="90" rx="16" fill="rgba(245,158,11,0.1)"/>
  <text x="540" y="1000" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">모든 자금 정책금리 적용 · 온라인 접수(ols.semas.or.kr) · 예산 소진 시 조기 마감</text>

