  <text x="160" y="865" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#3B82F6">대환대출</text>
  <text x="340" y="865" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">5천만</text>
  <text x="490" y="860" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">10년(거치2)</text>
