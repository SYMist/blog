<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="55" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="140" y="86" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B">방식 비교</text>

  <!-- Title -->
  <text x="60" y="165" font-family="'Pretendard', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">전환 방식 3가지 비교</text>

  <!-- Divider -->
  <rect x="60" y="190" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Table Container -->
  <rect x="60" y="230" width="960" height="680" rx="24" fill="rgba(255,255,255,0.04)" filter="url(#shadow)"/>

  <!-- Table Header Row -->
  <rect x="60" y="230" width="960" height="80" rx="24" fill="rgba(255,255,255,0.08)"/>
  <!-- Fix bottom corners of header -->
  <rect x="60" y="280" width="960" height="30" fill="rgba(255,255,255,0.08)"/>

  <text x="200" y="280" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#94A3B8">구분</text>
  <text x="430" y="280" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#60A5FA">포괄양수도</text>
  <text x="430" y="300" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="400" fill="#60A5FA">(일반)</text>
  <text x="680" y="280" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#34D399">포괄양수도</text>
  <text x="680" y="300" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="400" fill="#34D399">(세혜택)</text>
  <text x="910" y="280" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#FBBF24">현물출자</text>

  <!-- Column dividers -->
  <line x1="310" y1="250" x2="310" y2="900" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="560" y1="250" x2="560" y2="900" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="800" y1="250" x2="800" y2="900" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Row 1: 기간 -->
  <rect x="60" y="320" width="960" height="100" fill="rgba(255,255,255,0.02)"/>
  <line x1="80" y1="420" x2="1000" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="200" y="378" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">기간</text>
  <text x="430" y="370" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="32" font-weight="700" fill="#60A5FA">40일</text>
  <text x="680" y="370" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="32" font-weight="700" fill="#34D399">40일</text>
  <text x="910" y="370" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="32" font-weight="700" fill="#FBBF24">2~3개월</text>

  <!-- Row 2: 비용 -->
  <rect x="60" y="420" width="960" height="100" fill="transparent"/>
  <line x1="80" y1="520" x2="1000" y2="520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="200" y="478" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">비용</text>
  <text x="430" y="478" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#60A5FA">40만~</text>
  <text x="680" y="468" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#34D399">40만~</text>
  <text x="680" y="496" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="400" fill="#34D399">+컨설팅비</text>
  <text x="910" y="478" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FBBF24">수백만 원</text>

  <!-- Row 3: 양도세 -->
  <rect x="60" y="520" width="960" height="100" fill="rgba(255,255,255,0.02)"/>
  <line x1="80" y1="620" x2="1000" y2="620" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="200" y="578" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">양도세</text>
  <rect x="375" y="555" width="110" height="38" rx="19" fill="rgba(248,113,113,0.15)"/>
  <text x="430" y="581" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#F87171">발생</text>
  <rect x="620" y="555" width="120" height="38" rx="19" fill="rgba(52,211,153,0.15)"/>
  <text x="680" y="581" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#34D399">이월과세</text>
  <rect x="850" y="555" width="120" height="38" rx="19" fill="rgba(52,211,153,0.15)"/>
  <text x="910" y="581" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#34D399">이월과세</text>

  <!-- Row 4: 적합 -->
  <rect x="60" y="620" width="960" height="100" fill="transparent"/>
  <text x="200" y="678" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">적합</text>
  <text x="430" y="670" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">부동산</text>
  <text x="430" y="698" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">없는 경우</text>
  <text x="680" y="670" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">부동산 有</text>
  <text x="680" y="698" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">+ 세혜택</text>
  <text x="910" y="670" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">고가</text>
  <text x="910" y="698" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">부동산</text>

  <!-- Chips -->
  <rect x="60" y="950" width="120" height="46" rx="32" fill="#E8F0FF"/>
  <text x="120" y="980" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">양수도</text>

  <rect x="200" y="950" width="140" height="46" rx="32" fill="#E8F0FF"/>
  <text x="270" y="980" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">현물출자</text>

  <rect x="360" y="950" width="100" height="46" rx="32" fill="#E8F0FF"/>
  <text x="410" y="980" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">비용</text>

  <!-- Footer -->
  <text x="1020" y="1040" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="18" font-weight="400" fill="#475569">tistory.deluxo · 2026</text>
</svg>