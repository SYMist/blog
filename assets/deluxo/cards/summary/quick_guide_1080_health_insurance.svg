  <text x="100" y="908" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 소득 정산 감액 신청 · 11월 확정 정산</text>

  <rect x="60" y="945" width="960" height="95" rx="16" fill="rgba(239,68,68,0.1)"/>
  <text x="100" y="985" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#EF4444">피부양자에서 탈락했다</text>
  <text x="100" y="1018" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 전환 세대 경감 80→60→40→20% 단계 적용</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
