<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 타이틀 -->
  <rect x="60" y="54" width="960" height="110" rx="16" fill="#0D2347"/>
  <text x="540" y="102" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="800" fill="#F59E0B" text-anchor="middle">상가임대차보호법</text>
  <text x="540" y="148" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">임대료 인상 한도 · 환산보증금 기준</text>

  <!-- 환산보증금 계산식 박스 -->
  <rect x="60" y="186" width="960" height="80" rx="14" fill="#1A3270"/>
  <text x="540" y="224" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">환산보증금 = 보증금 + (월 차임 × 100)</text>
  <text x="540" y="256" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">예: 보증금 5,000만원 + 월세 200만원 → 환산보증금 2억 5,000만원</text>

  <!-- 헤더 -->
  <rect x="60" y="288" width="960" height="50" rx="0" fill="#1A3270"/>
  <text x="200" y="320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#A0B4D0" text-anchor="middle">지역</text>
  <text x="490" y="320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#A0B4D0" text-anchor="middle">환산보증금 기준</text>
  <text x="800" y="320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#A0B4D0" text-anchor="middle">5% 상한</text>
  <rect x="340" y="288" width="2" height="50" fill="#0B1F3B"/>
  <rect x="630" y="288" width="2" height="50" fill="#0B1F3B"/>

  <!-- 행 1: 서울 -->
  <rect x="60" y="338" width="960" height="80" rx="0" fill="#0D2347"/>
  <rect x="60" y="338" width="6" height="80" fill="#34D399"/>
  <text x="200" y="385" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">서울특별시</text>
  <text x="490" y="385" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">9억원 이하</text>
  <text x="800" y="385" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">✅ 적용</text>
  <rect x="340" y="338" width="2" height="80" fill="#1A3270"/>
  <rect x="630" y="338" width="2" height="80" fill="#1A3270"/>

  <!-- 행 2: 수도권·부산 -->
  <rect x="60" y="418" width="960" height="80" rx="0" fill="#102A56"/>
  <rect x="60" y="418" width="6" height="80" fill="#34D399"/>
  <text x="200" y="455" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">수도권 과밀억제권역</text>
  <text x="200" y="483" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ 부산</text>
  <text x="490" y="465" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">6억 9천만원 이하</text>
  <text x="800" y="465" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">✅ 적용</text>
  <rect x="340" y="418" width="2" height="80" fill="#0B1F3B"/>
  <rect x="630" y="418" width="2" height="80" fill="#0B1F3B"/>

  <!-- 행 3: 광역시 등 -->
  <rect x="60" y="498" width="960" height="90" rx="0" fill="#0D2347"/>
  <rect x="60" y="498" width="6" height="90" fill="#34D399"/>
  <text x="200" y="531" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">광역시·세종·파주</text>
  <text x="200" y="557" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">화성·안산·용인·김포·광주</text>
  <text x="490" y="549" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">5억 4천만원 이하</text>
  <text x="800" y="549" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">✅ 적용</text>
  <rect x="340" y="498" width="2" height="90" fill="#1A3270"/>
  <rect x="630" y="498" width="2" height="90" fill="#1A3270"/>

  <!-- 행 4: 기타 -->
  <rect x="60" y="588" width="960" height="80" rx="0" fill="#102A56"/>
  <rect x="60" y="588" width="6" height="80" fill="#34D399"/>
  <text x="200" y="635" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">기타 지역</text>
  <text x="490" y="635" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">3억 7천만원 이하</text>
  <text x="800" y="635" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">✅ 적용</text>
  <rect x="340" y="588" width="2" height="80" fill="#0B1F3B"/>
  <rect x="630" y="588" width="2" height="80" fill="#0B1F3B"/>

  <!-- 행 5: 기준 초과 -->
  <rect x="60" y="668" width="960" height="80" rx="0" fill="#1A0A0A"/>
  <rect x="60" y="668" width="6" height="80" fill="#EF4444"/>
  <text x="200" y="715" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#A0B4D0" text-anchor="middle">기준 초과 상가</text>
  <text x="490" y="715" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">지역 기준 초과</text>
  <text x="800" y="715" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#EF4444" text-anchor="middle">❌ 미적용</text>
  <rect x="340" y="668" width="2" height="80" fill="#0B1F3B"/>
  <rect x="630" y="668" width="2" height="80" fill="#0B1F3B"/>

  <!-- 테두리 -->
  <rect x="60" y="288" width="960" height="460" fill="none" stroke="#1A3270" stroke-width="2"/>

  <!-- 핵심 포인트 -->
  <rect x="60" y="770" width="960" height="90" rx="16" fill="#1A3270"/>
  <text x="540" y="812" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#F59E0B" text-anchor="middle">📌 기준 초과 상가도 갱신청구권(10년)·권리금 보호는 동일 적용</text>
  <text x="540" y="848" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">5% 상한이 없을 뿐 — 임대인이 갱신을 일방 거절할 수는 없음</text>

  <!-- 하단 -->
  <text x="540" y="940" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4A6080" text-anchor="middle">상가건물 임대차보호법 제11조 · 2026년 5월 기준 · deluxo</text>
</svg>
