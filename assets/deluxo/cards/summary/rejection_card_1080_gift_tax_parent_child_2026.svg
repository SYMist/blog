<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="60" width="960" height="110" rx="16" fill="#EF4444" opacity="0.9"/>
  <text x="540" y="108" font-family="-apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">자주 혼동되는 포인트</text>
  <text x="540" y="148" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">증여세 신고 전 반드시 확인하세요</text>

  <!-- Point 1 -->
  <rect x="60" y="200" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="200" width="8" height="120" rx="4" fill="#EF4444"/>
  <text x="100" y="246" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#EF4444">① 부모 양쪽 공제는 합산 5,000만원</text>
  <text x="100" y="284" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">아버지 3,000만 + 어머니 2,000만 = 공제 한도 소진</text>
  <text x="100" y="312" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff">각각 5,000만원이 아님 — 합산 기준임을 유의</text>

  <!-- Point 2 -->
  <rect x="60" y="334" width="960" height="120" rx="12" fill="#1A3270"/>
  <rect x="60" y="334" width="8" height="120" rx="4" fill="#F59E0B"/>
  <text x="100" y="380" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#F59E0B">② 10년 합산 적용</text>
  <text x="100" y="418" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">과거 10년간 증여받은 금액이 모두 합산되어 공제 한도 계산</text>
  <text x="100" y="446" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff">이미 3,000만 받았다면 추가 공제 한도는 2,000만원뿐</text>

  <!-- Point 3 -->
  <rect x="60" y="468" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="468" width="8" height="120" rx="4" fill="#EF4444"/>
  <text x="100" y="514" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#EF4444">③ 조부모 → 손자녀 직접 증여 시 30% 할증</text>
  <text x="100" y="552" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">세대를 건너뛰면 산출세액에 30% 추가 과세</text>
  <text x="100" y="580" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff">단, 부모가 사망한 경우에는 할증 미적용</text>

  <!-- Point 4 -->
  <rect x="60" y="602" width="960" height="120" rx="12" fill="#1A3270"/>
  <rect x="60" y="602" width="8" height="120" rx="4" fill="#F59E0B"/>
  <text x="100" y="648" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#F59E0B">④ 주택 증여 시 취득세 3.5~12% 별도</text>
  <text x="100" y="686" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">증여세 외에 취득세(수증자 부담)가 추가로 발생</text>
  <text x="100" y="714" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff">다주택자·조정지역 주택은 최대 12% — 사전 확인 필수</text>

  <!-- Point 5 -->
  <rect x="60" y="736" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="736" width="8" height="120" rx="4" fill="#EF4444"/>
  <text x="100" y="782" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#EF4444">⑤ 신고 기한 초과 시 가산세 20%</text>
  <text x="100" y="820" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">증여받은 달의 말일부터 3개월 이내 홈택스에서 신고</text>
  <text x="100" y="848" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff">미신고 시 신고불성실 가산세 20% + 납부불성실 가산세 추가</text>

  <!-- Footer -->
  <text x="540" y="980" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">deluxo.co.kr</text>
  <text x="540" y="1016" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">증여세 자주 혼동되는 포인트 | 2026년 최신</text>
</svg>
