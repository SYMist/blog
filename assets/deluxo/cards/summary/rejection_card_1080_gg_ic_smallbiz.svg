<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter></defs>
  <rect width="1080" height="1080" rx="32" fill="#F0F4FA"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFF" filter="url(#s)"/>
  <rect x="40" y="40" width="1000" height="100" rx="24" fill="#DC2626"/><rect x="40" y="95" width="1000" height="45" fill="#DC2626"/>
  <text x="540" y="103" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="38" font-weight="800" fill="#FFF">소상공인 지원금 신청 탈락 사유 TOP 5</text>

  <!-- Item 1 -->
  <rect x="80" y="180" width="920" height="130" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="100" y="200" width="70" height="70" rx="35" fill="#DC2626"/>
  <text x="135" y="247" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#FFF">1</text>
  <text x="200" y="235" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#991B1B">국세·지방세 체납</text>
  <text x="200" y="275" font-family="'Pretendard',sans-serif" font-size="22" fill="#6B7280">체납 내역 있으면 보증심사에서 즉시 반려 — 홈택스에서 미리 확인</text>

  <!-- Item 2 -->
  <rect x="80" y="330" width="920" height="130" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="100" y="350" width="70" height="70" rx="35" fill="#DC2626"/>
  <text x="135" y="397" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#FFF">2</text>
  <text x="200" y="385" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#991B1B">신용불량 상태</text>
  <text x="200" y="425" font-family="'Pretendard',sans-serif" font-size="22" fill="#6B7280">채무조정 중이거나 연체 기록이 있으면 보증 불가</text>

  <!-- Item 3 -->
  <rect x="80" y="480" width="920" height="130" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="100" y="500" width="70" height="70" rx="35" fill="#DC2626"/>
  <text x="135" y="547" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#FFF">3</text>
  <text x="200" y="535" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#991B1B">사업장 소재지 불일치</text>
  <text x="200" y="575" font-family="'Pretendard',sans-serif" font-size="22" fill="#6B7280">경기도 지원금은 경기도 사업장만 가능 — 거주지가 아닌 사업장 기준</text>

  <!-- Item 4 -->
  <rect x="80" y="630" width="920" height="130" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="100" y="650" width="70" height="70" rx="35" fill="#DC2626"/>
  <text x="135" y="697" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#FFF">4</text>
  <text x="200" y="685" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#991B1B">동일 사업 중복 수령</text>
  <text x="200" y="725" font-family="'Pretendard',sans-serif" font-size="22" fill="#6B7280">같은 지자체의 같은 성격 융자를 이미 받은 경우 중복 불가</text>

  <!-- Item 5 -->
  <rect x="80" y="780" width="920" height="130" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="100" y="800" width="70" height="70" rx="35" fill="#DC2626"/>
  <text x="135" y="847" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#FFF">5</text>
  <text x="200" y="835" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#991B1B">예산 소진 후 신청</text>
  <text x="200" y="875" font-family="'Pretendard',sans-serif" font-size="22" fill="#6B7280">선착순 마감! 공고 확인 즉시 서류 준비하고 신청하세요</text>

  <!-- Footer -->
  <rect x="80" y="940" width="920" height="70" rx="14" fill="#F1F5F9"/>
  <text x="540" y="983" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="600" fill="#6B7280">2026년 경기도·인천 소상공인 지원금 기준 | 공식 공고 확인 필수</text>
</svg>
