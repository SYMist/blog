  <text x="540" y="955" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#F59E0B">직접대출 10월 중순 오전 9시 · 수 분 내 마감 · 사전 준비 필수</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
