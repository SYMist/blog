<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">절세 계좌 흔한 실수 TOP 5</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- Item 1 -->
  <rect x="60" y="145" width="960" height="160" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="165" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="195" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">1</text>
  <text x="160" y="195" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#FFF">연금저축만 넣고 IRP 안 넣기</text>
  <text x="160" y="240" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">600만원이면 끝? IRP 300만원 추가로 49.5만원 더 환급</text>
  <text x="160" y="280" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">손해: 매년 최대 49.5만원 놓침</text>

  <!-- Item 2 -->
  <rect x="60" y="325" width="960" height="160" rx="20" fill="rgba(239,68,68,0.08)"/>
  <rect x="80" y="345" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="375" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">2</text>
  <text x="160" y="375" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#FFF">ISA 3년 전에 해지</text>
  <text x="160" y="420" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">의무기간 미충족 → 비과세 혜택 전부 소멸</text>
  <text x="160" y="460" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">손해: 일반 과세(15.4%) 적용</text>

  <!-- Item 3 -->
  <rect x="60" y="505" width="960" height="160" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="525" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="555" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">3</text>
  <text x="160" y="555" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#FFF">IRP 위험자산 100% 시도</text>
  <text x="160" y="600" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">IRP는 70%까지만 허용, 초과 주문은 자동 거부</text>
  <text x="160" y="640" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">주의: 30%는 원리금보장형 필수 편입</text>

  <!-- Item 4 -->
  <rect x="60" y="685" width="960" height="160" rx="20" fill="rgba(239,68,68,0.08)"/>
  <rect x="80" y="705" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="735" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">4</text>
  <text x="160" y="735" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#FFF">ISA 만기 후 연금전환 안 하기</text>
  <text x="160" y="780" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">전환공제 최대 300만원 → 환급 49.5만원 놓침</text>
  <text x="160" y="820" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">손해: 가장 흔하고 아까운 실수</text>

  <!-- Item 5 -->
  <rect x="60" y="865" width="960" height="160" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="885" width="60" height="44" rx="22" fill="#EF4444"/>
  <text x="110" y="915" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">5</text>
  <text x="160" y="915" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#FFF">55세 전 중도해지 페널티 모르기</text>
  <text x="160" y="960" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">기타소득세 16.5% 부과 + 기존 환급세금 전액 반환</text>
  <text x="160" y="1000" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">손해: 세액공제 혜택 전부 토해냄</text>
</svg>
