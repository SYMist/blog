<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#34D399"/>

  <!-- Title -->
  <text x="540" y="52" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">피부양자 탈락 전후 보험료 비교</text>
  <text x="540" y="82" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">실제 사례 2가지로 보는 지역가입자 전환 비용 (2026년 기준)</text>

  <!-- Case A box -->
  <rect x="30" y="100" width="1020" height="360" rx="14" fill="#0D2347"/>
  <rect x="30" y="100" width="6" height="360" rx="3" fill="#34D399"/>
  <text x="60" y="140" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#34D399">사례 A — 은퇴 후 연금·이자 수령자</text>
  <text x="60" y="168" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">상황: 국민연금 월 100만원(연 1,200만원) + 이자소득 연 900만원 = 합산 2,100만원 → 탈락</text>
  <text x="60" y="192" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">보유 아파트: 공시가격 5억원 → 재산세 과세표준 3억원</text>

  <!-- Before/After comparison -->
  <rect x="60" y="208" width="440" height="220" rx="12" fill="#1A3270"/>
  <text x="280" y="248" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#A0B4D0" text-anchor="middle">피부양자 시절</text>
  <text x="280" y="300" font-family="-apple-system, sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle">0원</text>
  <text x="280" y="338" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">월 납부 건강보험료</text>
  <text x="280" y="362" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">자녀 직장 건강보험 혜택 무료 적용</text>
  <text x="280" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">연 납부 0원</text>

  <text x="540" y="320" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#EF4444" text-anchor="middle">→</text>

  <rect x="580" y="208" width="440" height="220" rx="12" fill="#1A3270"/>
  <text x="800" y="248" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F59E0B" text-anchor="middle">지역가입자 전환 후</text>
  <text x="800" y="290" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#EF4444" text-anchor="middle">약 15~18만원</text>
  <text x="800" y="330" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">월 납부 건강보험료</text>
  <text x="800" y="355" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">소득보험료 약 12.6만원 + 재산보험료 약 3~5만원</text>
  <text x="800" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">연 납부 약 180~216만원 추가</text>

  <!-- Case B box -->
  <rect x="30" y="478" width="1020" height="340" rx="14" fill="#0D2347"/>
  <rect x="30" y="478" width="6" height="340" rx="3" fill="#F59E0B"/>
  <text x="60" y="518" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#F59E0B">사례 B — 퇴직자 임의계속가입 활용</text>
  <text x="60" y="546" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">상황: 퇴직 전 직장 보험료 월 12만원 → 퇴직 후 지역가입자 전환 시 월 20만원 예상</text>

  <rect x="60" y="564" width="440" height="210" rx="12" fill="#1A3270"/>
  <text x="280" y="606" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#A0B4D0" text-anchor="middle">임의계속가입 선택</text>
  <text x="280" y="654" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#34D399" text-anchor="middle">월 12만원</text>
  <text x="280" y="694" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">퇴직 전 수준 유지 (3년간)</text>
  <text x="280" y="750" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">3년간 총 절약: 약 288만원</text>

  <text x="540" y="672" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#EF4444" text-anchor="middle">vs</text>

  <rect x="580" y="564" width="440" height="210" rx="12" fill="#1A3270"/>
  <text x="800" y="606" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#A0B4D0" text-anchor="middle">지역가입자 전환</text>
  <text x="800" y="654" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#EF4444" text-anchor="middle">월 20만원</text>
  <text x="800" y="694" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">소득+재산 기반 보험료</text>
  <text x="800" y="750" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">월 8만원 × 36개월 = 288만원 손해</text>

  <!-- Key message -->
  <rect x="30" y="836" width="1020" height="108" rx="14" fill="#1A3270"/>
  <text x="540" y="880" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#F59E0B" text-anchor="middle">핵심: 탈락 전 소득 점검 + 탈락 후 임의계속가입 선택</text>
  <text x="540" y="916" font-family="-apple-system, sans-serif" font-size="16" fill="#EAF2FF" text-anchor="middle">퇴직 직후 최초 납부 기한 전에 건강보험공단에 임의계속가입 신청 필수</text>

  <text x="540" y="1000" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | nhis.or.kr | 국민건강보험공단 ☎1577-1000 | 개인 상황에 따라 다를 수 있음</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
</svg>
