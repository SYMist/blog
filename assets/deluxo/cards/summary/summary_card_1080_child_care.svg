<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">아이돌봄서비스 한눈에 요약</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 대상·자격 -->
  <rect x="60" y="120" width="960" height="140" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="136" width="160" height="34" rx="17" fill="#1D4ED8"/>
  <text x="160" y="160" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">대상·자격</text>
  <text x="80" y="200" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">만 3개월 ~ 12세 이하 아동</text>
  <text x="80" y="236" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">양육 공백 필수 (맞벌이·질병·학업·출산 등)</text>

  <!-- 비용 -->
  <rect x="60" y="276" width="960" height="260" rx="20" fill="rgba(245,158,11,0.08)"/>
  <rect x="80" y="292" width="300" height="34" rx="17" fill="#F59E0B"/>
  <text x="230" y="316" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#0B1F3B">시간당 비용 (일반형 기준)</text>

  <text x="80" y="360" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">가형 (75%↓)</text>
  <text x="350" y="360" font-family="'Pretendard',sans-serif" font-size="26" font-weight="900" fill="#F59E0B">1,918원</text>
  <text x="540" y="360" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">85% 정부 지원</text>

  <text x="80" y="400" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">나형 (120%↓)</text>
  <text x="350" y="400" font-family="'Pretendard',sans-serif" font-size="26" font-weight="900" fill="#F59E0B">5,116원</text>
  <text x="540" y="400" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">60% 정부 지원</text>

  <text x="80" y="440" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">다형 (150%↓)</text>
  <text x="350" y="440" font-family="'Pretendard',sans-serif" font-size="26" font-weight="900" fill="#F59E0B">8,952원</text>
  <text x="540" y="440" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">30% 정부 지원</text>

  <text x="80" y="480" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">라형 (250%↓)</text>
  <text x="350" y="480" font-family="'Pretendard',sans-serif" font-size="26" font-weight="900" fill="#F59E0B">10,870원</text>
  <text x="540" y="480" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">15% 정부 지원 · 2026 확대</text>

  <text x="80" y="520" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">마형 (250%↑)</text>
  <text x="350" y="520" font-family="'Pretendard',sans-serif" font-size="26" font-weight="900" fill="#EF4444">12,790원</text>
  <text x="540" y="520" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">전액 본인 부담</text>

  <!-- 할인 -->
  <rect x="60" y="552" width="960" height="140" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="568" width="200" height="34" rx="17" fill="#1D4ED8"/>
  <text x="180" y="592" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">추가 할인</text>
  <text x="80" y="630" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">다자녀(2자녀+)</text>
  <text x="380" y="630" font-family="'Pretendard',sans-serif" font-size="26" font-weight="900" fill="#F59E0B">본인부담 10% 추가 감면</text>
  <text x="80" y="668" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">동시 돌봄</text>
  <text x="380" y="668" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">2명 25%, 3명 33.3% 감면 (중복 적용)</text>

  <!-- 인천 -->
  <rect x="60" y="708" width="960" height="120" rx="20" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="748" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">인천 추가 지원</text>
  <text x="200" y="796" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="900" fill="#FFF">가형 100% 환급</text>
  <text x="540" y="796" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="900" fill="#FFF">나형 50% 환급</text>
  <text x="880" y="796" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="900" fill="#FFF">다형 20% 환급</text>

  <!-- 신청 -->
  <rect x="60" y="844" width="960" height="100" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="860" width="160" height="34" rx="17" fill="#1D4ED8"/>
  <text x="160" y="884" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">신청 흐름</text>
  <text x="80" y="924" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">복지로 소득판정 → 국민행복카드 → 아이돌봄 홈페이지 예약</text>

  <!-- 핵심 수치 -->
  <rect x="60" y="960" width="460" height="70" rx="16" fill="rgba(245,158,11,0.2)"/>
  <text x="290" y="1004" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">정부 지원 연 960시간 (취약 1,080)</text>

  <rect x="540" y="960" width="480" height="70" rx="16" fill="rgba(245,158,11,0.2)"/>
  <text x="780" y="1004" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">국가자격제 2026.4.23 시행</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
