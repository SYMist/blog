<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="118" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#EF4444" text-anchor="middle">⚠ ISA 절세 실패 사유 TOP 5</text>
  <text x="540" y="196" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">이것만은 피하세요</text>

  <rect x="60" y="250" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="305" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#EF4444">① 3년 의무기간 미충족 해지</text>
  <text x="100" y="360" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#EAF2FF">만기 2주 전 해지도 동일 — 비과세·분리과세 전액 소멸 ✕</text>

  <rect x="60" y="408" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="463" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#EF4444">② 연금계좌 이전 60일 기한 초과</text>
  <text x="100" y="518" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#EAF2FF">만기일로부터 하루라도 초과 → 추가 세액공제 300만원 소멸 ✕</text>

  <rect x="60" y="566" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="621" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#EF4444">③ 금융소득종합과세 대상자 일반형 신청</text>
  <text x="100" y="676" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#EAF2FF">직전 3개년 중 1회라도 대상이면 가입 불가 → 국내투자형 이용</text>

  <rect x="60" y="724" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="779" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#EF4444">④ 의무기간 중 수익금 인출 시도</text>
  <text x="100" y="834" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#EAF2FF">원금만 인출 가능 — 수익금(배당·평가차익)은 만기 전 인출 불가 ✕</text>

  <rect x="60" y="882" width="960" height="140" rx="20" fill="#F59E0B"/>
  <text x="100" y="937" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">⑤ 1인 1계좌 원칙 위반</text>
  <text x="100" y="992" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0B1F3B">동일 유형 2계좌 개설 불가 — 타 기관 이전만 허용</text>
</svg>
