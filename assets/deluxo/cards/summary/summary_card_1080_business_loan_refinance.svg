<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <rect x="60" y="60" width="300" height="60" rx="30" fill="#F59E0B"/>
  <text x="210" y="101" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 추경 6,000억</text>

  <text x="540" y="200" font-family="'Pretendard', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle">사업자 대환대출</text>
  <text x="540" y="280" font-family="'Pretendard', sans-serif" font-size="44" font-weight="700" fill="#F59E0B" text-anchor="middle">핵심 한눈에 요약</text>

  <rect x="60" y="340" width="960" height="120" rx="20" fill="#1A3270"/>
  <text x="540" y="385" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">소진공 정책 대환</text>
  <text x="540" y="430" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#EAF2FF" text-anchor="middle">연 4.5% 고정 · 최대 5,000만 · 최대 10년</text>

  <rect x="60" y="490" width="960" height="120" rx="20" fill="#1A3270"/>
  <text x="540" y="535" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">대상 채무 시점 확대</text>
  <text x="540" y="580" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#EAF2FF" text-anchor="middle">2024.07.03 → 2025.06.30 이전까지</text>

  <rect x="60" y="640" width="960" height="120" rx="20" fill="#1A3270"/>
  <text x="540" y="685" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">사업용 가계대출 한도 상향</text>
  <text x="540" y="730" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#EAF2FF" text-anchor="middle">1,000만 → 5,000만 (5배 상향)</text>

  <rect x="60" y="790" width="960" height="120" rx="20" fill="#1A3270"/>
  <text x="540" y="835" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">햇살론 특례 금리 인하</text>
  <text x="540" y="880" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#EAF2FF" text-anchor="middle">15.9% → 12.5% (사회적 배려자 9.9%)</text>

  <rect x="60" y="940" width="960" height="100" rx="20" fill="#F59E0B"/>
  <text x="540" y="1005" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#0B1F3B" text-anchor="middle">5,000만 갈아타기 = 연 225만 절감</text>
</svg>
