  <text x="98" y="461" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">2</text>
  <text x="150" y="445" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">UBI/T-map 최대 32% 할인</text>
  <text x="150" y="480" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">운전습관 연동 보험 — 안전 운전할수록 할인</text>
