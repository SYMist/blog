  <text x="98" y="316" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">1</text>
  <text x="150" y="300" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">마일리지 특약 최대 47.1% 할인</text>
  <text x="150" y="335" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">연간 주행거리 적을수록 보험료 대폭 절감</text>
  <rect x="40" y="400" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
