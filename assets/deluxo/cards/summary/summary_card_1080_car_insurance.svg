  <rect x="40" y="36" width="180" height="44" rx="22" fill="#F59E0B"/>
  <text x="130" y="65" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">5줄 요약</text>
  <text x="40" y="135" font-family="'Pretendard',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">자동차보험 절감</text>
  <text x="40" y="190" font-family="'Pretendard',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">핵심 체크포인트</text>
