  <text x="98" y="606" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">3</text>
  <text x="150" y="590" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">업무전용 보험 미가입 → 비용 50% 축소</text>
  <text x="150" y="625" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">개인사업자 업무용 승용차 세무 비용 처리 필수</text>
  <rect x="40" y="690" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="70" y="715" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="751" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">4</text>
  <text x="150" y="735" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">운행기록부 미작성 → 1,500만 원 한도</text>
  <text x="150" y="770" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">1,500만 초과분은 운행기록부 없으면 비용 부인</text>
  <rect x="40" y="835" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="860" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="896" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">5</text>
  <text x="150" y="880" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">연두색 번호판 8,000만↑ 법인차 필수</text>
  <text x="150" y="915" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">미부착 시 비용 전액 부인 + 상여 처분 위험</text>
