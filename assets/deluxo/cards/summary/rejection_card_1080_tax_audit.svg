<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">주의 필수</text>

  <!-- Title -->
  <text x="80" y="185" font-family="'Pretendard', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">소상공인 세무 실수 TOP 5</text>

  <!-- Divider -->
  <rect x="80" y="215" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Row 1 -->
  <rect x="60" y="270" width="960" height="130" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="120" cy="335" r="30" fill="#F59E0B"/>
  <text x="120" y="345" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">1</text>
  <text x="175" y="320" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">사업용 카드로 개인 지출 처리</text>
  <text x="175" y="360" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7">→ 부정 과소신고</text>
  <text x="920" y="345" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="end">40%</text>

  <!-- Row 2 -->
  <rect x="60" y="420" width="960" height="130" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="120" cy="485" r="30" fill="#F59E0B"/>
  <text x="120" y="495" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">2</text>
  <text x="175" y="470" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">적격증빙 미수취 (3만 원 초과)</text>
  <text x="175" y="510" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7">→ 증빙불비 가산세</text>
  <text x="920" y="495" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="end">2%</text>

  <!-- Row 3 -->
  <rect x="60" y="570" width="960" height="130" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="120" cy="635" r="30" fill="#F59E0B"/>
  <text x="120" y="645" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">3</text>
  <text x="175" y="620" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">인건비 현금 지급·원천세 누락</text>
  <text x="175" y="660" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7">→ 지급명세서 미제출</text>
  <text x="920" y="645" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="end">1%</text>

  <!-- Row 4 -->
  <rect x="60" y="720" width="960" height="130" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="120" cy="785" r="30" fill="#F59E0B"/>
  <text x="120" y="795" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">4</text>
  <text x="175" y="770" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">매출 이중 집계·누락</text>
  <text x="175" y="810" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7">→ 과소신고 가산세</text>
  <text x="920" y="795" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="end">10%</text>

  <!-- Row 5 -->
  <rect x="60" y="870" width="960" height="130" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="120" cy="935" r="30" fill="#F59E0B"/>
  <text x="120" y="945" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">5</text>
  <text x="175" y="920" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">현금영수증 미발급 (20만 원↑)</text>
  <text x="175" y="960" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7">→ 미발급 가산세</text>
  <text x="920" y="945" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="end">20%</text>
</svg>