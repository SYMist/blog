<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <rect x="60" y="60" width="240" height="60" rx="30" fill="#F59E0B"/>
  <text x="180" y="101" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">빠른 판단</text>

  <text x="540" y="200" font-family="'Pretendard', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle">나는 어떤 지원금?</text>

  <rect x="60" y="280" width="960" height="220" rx="20" fill="#1A3270"/>
  <text x="540" y="335" font-family="'Pretendard', sans-serif" font-size="36" font-weight="800" fill="#F59E0B" text-anchor="middle">강원 사업장 + 자녀 있음</text>
  <text x="540" y="395" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">→ 1차 경영안정자금 5,000만</text>
  <text x="540" y="440" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">기본 2.0% + 영세 0.5%p + 다자녀 1.0%p</text>
  <text x="540" y="485" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#A7C4FF" text-anchor="middle">최대 3.5%p · 보증료 0.8% 전액</text>

  <rect x="60" y="530" width="960" height="220" rx="20" fill="#1A3270"/>
  <text x="540" y="585" font-family="'Pretendard', sans-serif" font-size="36" font-weight="800" fill="#F59E0B" text-anchor="middle">제주 사업장 + 매출 10%↓</text>
  <text x="540" y="645" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">→ 관광진흥기금 + 원금 상환 유예</text>
  <text x="540" y="690" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">실질 1.21% · 개인 5억 한도</text>
  <text x="540" y="735" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#A7C4FF" text-anchor="middle">1년 원금 유예 · 상환 1~2년 연장</text>

  <rect x="60" y="780" width="960" height="220" rx="20" fill="#1A3270"/>
  <text x="540" y="835" font-family="'Pretendard', sans-serif" font-size="36" font-weight="800" fill="#F59E0B" text-anchor="middle">울산 사업장 + 재창업</text>
  <text x="540" y="895" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">→ 긴급 재기지원자금 8,000만</text>
  <text x="540" y="940" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">2020년 이후 폐업 · 교육 수료 필수</text>
  <text x="540" y="985" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#A7C4FF" text-anchor="middle">4월 중순 조기 집행 시작</text>
</svg>
