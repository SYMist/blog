  <text x="60" y="546" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#F59E0B">법인세율 vs 소득세율 비교 (2026년)</text>

  <rect x="60" y="562" width="450" height="180" rx="12" fill="#0D2347"/>
  <text x="285" y="600" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#EF4444" text-anchor="middle">개인사업자 (소득세)</text>
  <text x="285" y="638" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">최고 45%</text>
  <text x="285" y="676" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">10억원 초과 구간</text>
