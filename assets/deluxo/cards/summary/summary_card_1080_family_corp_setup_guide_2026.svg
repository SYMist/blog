  <text x="220" y="464" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">법무사 대행 시 추가</text>
  <text x="520" y="464" font-family="-apple-system, sans-serif" font-size="15" fill="#F59E0B" text-anchor="middle">+15~50만원</text>
  <text x="840" y="464" font-family="-apple-system, sans-serif" font-size="15" fill="#F59E0B" text-anchor="middle">+15~50만원</text>

