  <text x="540" y="660" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#34D399" text-anchor="middle">→</text>

  <rect x="570" y="562" width="450" height="180" rx="12" fill="#1A3270"/>
  <rect x="570" y="562" width="450" height="180" rx="12" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="795" y="600" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle">법인 (법인세)</text>
  <text x="795" y="638" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">최고 25%</text>
  <text x="795" y="676" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">3,000억원 초과 구간</text>
  <text x="795" y="720" font-family="-apple-system, sans-serif" font-size="13" fill="#34D399" text-anchor="middle">2억원 이하는 10%</text>

  <!-- Saving stat boxes -->
  <rect x="60" y="768" width="290" height="110" rx="14" fill="#0D2347"/>
  <text x="205" y="808" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">절세 손익분기점</text>
  <text x="205" y="844" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">순이익 5천만원</text>
  <text x="205" y="868" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">이상부터 효과 발생</text>

  <rect x="394" y="768" width="292" height="110" rx="14" fill="#0D2347"/>
  <text x="540" y="808" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">1억원 기준 절감</text>
  <text x="540" y="844" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">연 약 1,281만원</text>
  <text x="540" y="868" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">5년 누적 6,400만원+</text>

  <rect x="730" y="768" width="290" height="110" rx="14" fill="#0D2347"/>
  <text x="875" y="808" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#EF4444" text-anchor="middle">설립 소요기간</text>
  <text x="875" y="844" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">약 2~4주</text>
  <text x="875" y="868" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">서류 완비 기준</text>

  <!-- Footer -->
  <text x="540" y="974" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 자본금 2,800만원 이하 기준 | 세무사 상담 후 진행 권장</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
</svg>
