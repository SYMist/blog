  <text x="520" y="405" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#34D399" text-anchor="middle">약 15.5만원</text>
  <text x="840" y="405" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#EF4444" text-anchor="middle">약 42.5만원</text>

