<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#34D399"/>

  <!-- Title -->
  <text x="60" y="72" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">가족법인 설립 비용 · 절세 효과 요약</text>
  <text x="60" y="106" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0">2026년 기준 | 주식회사 기준 | 자본금 2,800만원 이하 기준</text>
  <line x1="60" y1="126" x2="1020" y2="126" stroke="#1A3270" stroke-width="2"/>

  <!-- 설립 비용 표 제목 -->
  <text x="60" y="162" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#F59E0B">설립 비용 (공과금 기준)</text>

  <!-- Table header -->
  <rect x="60" y="174" width="960" height="46" rx="8" fill="#1A3270"/>
  <text x="220" y="203" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">항목</text>
  <text x="520" y="203" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">비과밀억제권역 (지방)</text>
  <text x="840" y="203" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#EF4444" text-anchor="middle">과밀억제권역 (서울 등)</text>

  <!-- Rows -->
  <rect x="60" y="220" width="960" height="52" rx="0" fill="#0D2347"/>
  <text x="220" y="252" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">등록면허세</text>
  <text x="520" y="252" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">112,500원</text>
  <text x="840" y="246" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#EF4444" text-anchor="middle">337,500원</text>
  <text x="840" y="264" font-family="-apple-system, sans-serif" font-size="12" fill="#EF4444" text-anchor="middle">(3배 중과)</text>

  <rect x="60" y="272" width="960" height="52" rx="0" fill="#102A56"/>
  <text x="220" y="304" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">지방교육세</text>
  <text x="520" y="304" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">22,500원</text>
  <text x="840" y="304" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#EF4444" text-anchor="middle">67,500원</text>

  <rect x="60" y="324" width="960" height="52" rx="0" fill="#0D2347"/>
  <text x="220" y="356" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">등기신청수수료</text>
  <text x="520" y="356" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">20,000원</text>
  <text x="840" y="356" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">20,000원</text>

  <rect x="60" y="376" width="960" height="56" rx="0" fill="#1A3270"/>
