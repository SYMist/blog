<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">아이돌봄서비스 실수 TOP 5</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="120" width="960" height="170" rx="16" fill="rgba(239,68,68,0.1)"/>
  <rect x="80" y="140" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="174" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">1</text>
  <text x="150" y="168" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">양육 공백 미인정 → 신청 거절</text>
  <text x="150" y="200" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">전업주부 가정은 원칙적으로 양육 공백 인정 불가</text>
  <text x="150" y="230" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">예외: 다자녀(12세↓ 2명+), 장애 가구, 질병·간병</text>
  <text x="150" y="268" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">대안: 양육 공백 예외 사유 해당 여부 먼저 확인</text>

  <rect x="60" y="306" width="960" height="170" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="326" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="360" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">2</text>
  <text x="150" y="354" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">1월 소득 재판정 기한 놓침 → 마형 전환</text>
  <text x="150" y="386" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">매년 1월 30일까지 재판정 미신청 시 2월부터 전액 자부담</text>
  <text x="150" y="416" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">뒤늦게 신청해도 판정 완료까지 2~4주간 마형 적용</text>
  <text x="150" y="454" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">대안: 12월 말~1월 초에 바로 재판정 신청</text>

  <rect x="60" y="492" width="960" height="170" rx="16" fill="rgba(239,68,68,0.1)"/>
  <rect x="80" y="512" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="546" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">3</text>
  <text x="150" y="540" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">예치금 부족 → 예약 확정 불가</text>
  <text x="150" y="572" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">할인 전 총액 기준 예치금 확보 필요 — 잔액 부족 시 자동 취소</text>
  <text x="150" y="602" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">다자녀·동시 돌봄 할인은 사후 정산이라 총액 기준으로 예치</text>
  <text x="150" y="640" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">대안: 월 예상 이용액의 120% 이상 넉넉히 충전</text>

  <rect x="60" y="678" width="960" height="170" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="698" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="732" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">4</text>
  <text x="150" y="726" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">프리랜서 양육 공백 증빙 서류 미비</text>
  <text x="150" y="758" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">사업자등록증 + 소득금액증명원 제출 필수 (4대보험 자동확인 불가)</text>
  <text x="150" y="788" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">프리랜서 계약서도 함께 제출하면 인정 확률 높아짐</text>
  <text x="150" y="826" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">대안: 홈택스에서 소득금액증명 발급 후 함께 제출</text>

  <rect x="60" y="864" width="960" height="160" rx="16" fill="rgba(239,68,68,0.1)"/>
  <rect x="80" y="884" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="918" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">5</text>
  <text x="150" y="912" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">육아휴직 중 신청 → 원칙 거절</text>
  <text x="150" y="944" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">육아휴직자는 양육 공백 사유 해당 안 됨</text>
  <text x="150" y="974" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">단, 복직 30일 전부터 예비 판정 신청 가능</text>
  <text x="150" y="1004" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">대안: 복직 예정일 기준 30일 전에 미리 신청</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
