<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="60" width="960" height="110" rx="16" fill="#0D2347"/>
  <text x="540" y="106" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">전기차 보조금 신청 전 1분 체크리스트</text>
  <text x="540" y="150" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">이 7가지를 확인하면 탈락 없이 보조금 받을 수 있습니다</text>

  <!-- Checklist items -->
  <!-- Item 1 -->
  <rect x="60" y="196" width="960" height="100" rx="14" fill="#1A3270"/>
  <rect x="60" y="196" width="80" height="100" rx="14" fill="#34D399"/>
  <text x="100" y="256" font-family="-apple-system, sans-serif" font-size="40" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="170" y="238" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">구매 차량이 순수 전기차(BEV)인지 확인</text>
  <text x="170" y="276" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">하이브리드는 국비·지방보조금 대상 아님</text>

  <!-- Item 2 -->
  <rect x="60" y="310" width="960" height="100" rx="14" fill="#0D2347"/>
  <rect x="60" y="310" width="80" height="100" rx="14" fill="#34D399"/>
  <text x="100" y="370" font-family="-apple-system, sans-serif" font-size="40" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="170" y="352" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">차량 가격이 8,500만원 미만인지 확인</text>
  <text x="170" y="390" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">이상은 보조금 없음 / 5,300만 초과 시 50%만 지급</text>

  <!-- Item 3 -->
  <rect x="60" y="424" width="960" height="100" rx="14" fill="#1A3270"/>
  <rect x="60" y="424" width="80" height="100" rx="14" fill="#34D399"/>
  <text x="100" y="484" font-family="-apple-system, sans-serif" font-size="40" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="170" y="466" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">해당 지역 지방보조금 예산 잔액 확인</text>
  <text x="170" y="504" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">예산 소진 시 조기 마감 — 지자체 홈페이지 확인 필수</text>

  <!-- Item 4 -->
  <rect x="60" y="538" width="960" height="100" rx="14" fill="#0D2347"/>
  <rect x="60" y="538" width="80" height="100" rx="14" fill="#F59E0B"/>
  <text x="100" y="598" font-family="-apple-system, sans-serif" font-size="40" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="170" y="580" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">내연차 3년 이상 보유 여부 확인 (전환지원금)</text>
  <text x="170" y="618" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">해당 시 +100만원 — 가족 양도 불가, 폐차·중고매도만</text>

  <!-- Item 5 -->
  <rect x="60" y="652" width="960" height="100" rx="14" fill="#1A3270"/>
  <rect x="60" y="652" width="80" height="100" rx="14" fill="#34D399"/>
  <text x="100" y="712" font-family="-apple-system, sans-serif" font-size="40" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="170" y="694" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">서류 사전 준비 (등록증·신분증·통장·계약서)</text>
  <text x="170" y="732" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">출고 당일 바로 제출 준비 — 10일 내 미제출 시 취소</text>

  <!-- Item 6 -->
  <rect x="60" y="766" width="960" height="100" rx="14" fill="#0D2347"/>
  <rect x="60" y="766" width="80" height="100" rx="14" fill="#34D399"/>
  <text x="100" y="826" font-family="-apple-system, sans-serif" font-size="40" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="170" y="808" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">세제혜택 마감 전 연내 등록 계획 수립</text>
  <text x="170" y="846" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">취득세·개소세 감면 2026.12.31까지만 적용</text>

  <!-- Item 7 -->
  <rect x="60" y="880" width="960" height="100" rx="14" fill="#1A3270"/>
  <rect x="60" y="880" width="80" height="100" rx="14" fill="#EF4444"/>
  <text x="100" y="940" font-family="-apple-system, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="170" y="922" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">2년 내 처분 계획 없음 확인</text>
  <text x="170" y="960" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0">보조금 수령 후 2년 내 판매·폐차 시 전액 환수</text>

  <!-- Footer -->
  <text x="540" y="1032" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">deluxo | 저장하고 신청 전 꼭 확인하세요 — 2026년 기준</text>
  <text x="540" y="1062" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">※ 실제 조건은 공식 공고와 지자체 안내 우선</text>
</svg>
