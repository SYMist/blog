<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">개인회생 변제금 계산·변제계획안 한눈에 보기</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 계산 공식 -->
  <rect x="60" y="120" width="960" height="70" rx="16" fill="rgba(245,158,11,0.12)"/>
  <text x="540" y="148" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">계산 공식</text>
  <text x="540" y="176" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="19" font-weight="700" fill="#FFF">월 세후 수입 - 최저생계비(60%) - 추가 생계비 = 가용소득 = 월 변제금</text>

  <!-- 2026 최저생계비 -->
  <rect x="60" y="202" width="960" height="100" rx="16" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="214" width="220" height="34" rx="17" fill="#1D4ED8"/>
  <text x="190" y="238" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">2026 최저생계비 60%</text>
  <text x="80" y="276" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">1인 154만  ·  2인 252만  ·  3인 322만  ·  4인 390만</text>
  <rect x="700" y="260" width="180" height="30" rx="15" fill="rgba(245,158,11,0.2)"/>
  <text x="790" y="281" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#F59E0B">역대 최대 인상</text>

  <!-- 면제재산 확대 -->
  <rect x="60" y="314" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="326" width="160" height="34" rx="17" fill="#1D4ED8"/>
  <text x="160" y="350" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">면제재산 확대</text>
  <text x="80" y="384" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">예금 250만</text>
  <text x="230" y="384" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">(↑65만)</text>
  <text x="340" y="384" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">· 보험 250만</text>
  <text x="510" y="384" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">(↑100만)</text>
  <text x="620" y="384" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">· 사망보험 1,500만</text>
  <text x="840" y="384" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">(↑500만)</text>

  <!-- 주거비 추가 인정 -->
  <rect x="60" y="426" width="960" height="100" rx="16" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="438" width="200" height="34" rx="17" fill="#1D4ED8"/>
  <text x="180" y="462" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">주거비 추가 인정</text>
  <text x="80" y="500" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">서울 31.5만  ·  수도권 26.9만  ·  광역시 20만  ·  기타 15만</text>

  <!-- 변제기간 -->
  <rect x="60" y="538" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="550" width="140" height="34" rx="17" fill="#1D4ED8"/>
  <text x="150" y="574" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">변제 기간</text>
  <text x="80" y="610" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">3~5년 (36~60개월)</text>
  <text x="420" y="610" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">청년·고령자·장애인 → 24개월 단축</text>

  <!-- 2026 주요 변경 사항 요약 -->
  <rect x="60" y="660" width="960" height="340" rx="20" fill="rgba(245,158,11,0.08)"/>
  <text x="540" y="700" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">2026 핵심 변경 사항</text>

  <rect x="100" y="720" width="860" height="50" rx="12" fill="rgba(59,130,246,0.1)"/>
  <rect x="120" y="730" width="140" height="30" rx="15" fill="rgba(232,240,255,0.15)"/>
  <text x="190" y="752" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">투자 손실</text>
  <text x="280" y="752" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">청산가치 산정에서 제외 (코인·주식 손실 구제)</text>

  <rect x="100" y="780" width="860" height="50" rx="12" fill="rgba(255,255,255,0.04)"/>
  <rect x="120" y="790" width="140" height="30" rx="15" fill="rgba(232,240,255,0.15)"/>
  <text x="190" y="812" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">마이데이터</text>
  <text x="280" y="812" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">채무·소득·재산 통합 조회로 서류 간소화</text>

  <rect x="100" y="840" width="860" height="50" rx="12" fill="rgba(59,130,246,0.1)"/>
  <rect x="120" y="850" width="140" height="30" rx="15" fill="rgba(232,240,255,0.15)"/>
  <text x="190" y="872" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">전자소송</text>
  <text x="280" y="872" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">ecfs.scourt.go.kr 온라인 신청 확대</text>

  <rect x="100" y="900" width="860" height="50" rx="12" fill="rgba(255,255,255,0.04)"/>
  <rect x="120" y="910" width="180" height="30" rx="15" fill="rgba(232,240,255,0.15)"/>
  <text x="210" y="932" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">면제재산 확대</text>
  <text x="320" y="932" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">예금·보험·사망보험금 한도 대폭 상향</text>

  <rect x="100" y="960" width="860" height="30" rx="12" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="982" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" font-weight="700" fill="#F59E0B">투자 손실 청산가치 제외 · 마이데이터 통합 · 전자소송</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>