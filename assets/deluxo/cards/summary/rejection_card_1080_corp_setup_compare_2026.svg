<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="85" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="800" fill="#EF4444" text-anchor="middle">법인 전환 후 후회하는 이유</text>
  <text x="540" y="140" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" text-anchor="middle">TOP 5</text>
  <line x1="80" y1="165" x2="1000" y2="165" stroke="#1A3270" stroke-width="2"/>

  <!-- Item 1 -->
  <rect x="80" y="185" width="920" height="145" rx="12" fill="#0D2347"/>
  <text x="116" y="230" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444">1위</text>
  <text x="155" y="230" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">법인 유지비 과소평가</text>
  <text x="116" y="268" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">세무사 기장료 월 10~20만원, 4대보험, 법인 통장 수수료</text>
  <text x="116" y="300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">연간 최소 200~300만원 이상 고정비 발생</text>

  <!-- Item 2 -->
  <rect x="80" y="342" width="920" height="130" rx="12" fill="#102A56"/>
  <text x="116" y="387" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444">2위</text>
  <text x="155" y="387" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">법인 자금 개인 사용</text>
  <text x="116" y="425" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">법인 카드·통장으로 개인 지출 처리 시</text>
  <text x="116" y="458" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#EF4444">횡령·가지급금 이슈 발생 → 세무조사 리스크</text>

  <!-- Item 3 -->
  <rect x="80" y="484" width="920" height="130" rx="12" fill="#0D2347"/>
  <text x="116" y="529" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444">3위</text>
  <text x="155" y="529" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">대표이사 급여 과소 설정</text>
  <text x="116" y="567" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">급여가 너무 낮으면 법인에 이익잉여금이 쌓임</text>
  <text x="116" y="600" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#EF4444">나중에 배당 시 배당소득세 추가 부담 발생</text>

  <!-- Item 4 -->
  <rect x="80" y="626" width="920" height="130" rx="12" fill="#102A56"/>
  <text x="116" y="671" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#F59E0B">4위</text>
  <text x="155" y="671" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">과밀억제권역 등록면허세 중과 미확인</text>
  <text x="116" y="709" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">서울·인천·경기 일부에서 설립 시 등록면허세 3배 중과</text>
  <text x="116" y="742" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">설립 전 주소 과밀억제권역 여부 반드시 확인</text>

  <!-- Item 5 -->
  <rect x="80" y="768" width="920" height="130" rx="12" fill="#0D2347"/>
  <text x="116" y="813" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#F59E0B">5위</text>
  <text x="155" y="813" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">법인 청산 비용 및 기간 미고려</text>
  <text x="116" y="851" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">사업 종료 시 청산 절차에 50~200만원 비용 + 수개월 소요</text>
  <text x="116" y="884" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">개인사업자 폐업(무료·즉시)과 대조적</text>

  <!-- Footer -->
  <text x="540" y="960" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#4B6A9A" text-anchor="middle">법인 설립 전 세무사와 충분히 상담하고 결정하세요</text>
  <text x="540" y="1000" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4B6A9A" text-anchor="middle">설립 후 취소·청산은 번거롭고 비용이 발생합니다</text>
  <text x="540" y="1050" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#2D4A7A" text-anchor="middle">출처: 공고 검토 및 세무 실무 사례 분석 (2026년 기준)</text>
</svg>
