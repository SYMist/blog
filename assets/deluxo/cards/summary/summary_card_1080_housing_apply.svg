<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="180" height="44" rx="22" fill="#F59E0B"/>
  <text x="150" y="79" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#0B1F3B">5줄 요약</text>

  <!-- 메인 제목 -->
  <text x="60" y="150" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">주택청약 당첨 전략</text>
  <text x="60" y="210" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">핵심 체크포인트</text>

  <!-- 구분선 -->
  <rect x="60" y="240" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Item 1 -->
  <rect x="60" y="280" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="310" width="54" height="54" rx="27" fill="#F59E0B"/>
  <text x="107" y="347" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">1</text>
  <text x="155" y="340" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">월 납입 한도 10만→25만 원 상향</text>
  <text x="155" y="375" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">납입 인정액 늘려 가점·소득공제 동시 확보</text>

  <!-- Item 2 -->
  <rect x="60" y="420" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="450" width="54" height="54" rx="27" fill="#F59E0B"/>
  <text x="107" y="487" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">2</text>
  <text x="155" y="480" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">가점 84점 = 무주택(32)+부양가족(35)+가입기간(17)</text>
  <text x="155" y="515" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">만점 구조를 알아야 전략이 보인다</text>

  <!-- Item 3 -->
  <rect x="60" y="560" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="590" width="54" height="54" rx="27" fill="#F59E0B"/>
  <text x="107" y="627" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">3</text>
  <text x="155" y="620" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">배우자 가입 기간 합산 최대 +3점</text>
  <text x="155" y="655" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">부부 모두 청약통장 유지하면 가점 추가 확보</text>

  <!-- Item 4 -->
  <rect x="60" y="700" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="730" width="54" height="54" rx="27" fill="#F59E0B"/>
  <text x="107" y="767" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">4</text>
  <text x="155" y="760" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">신생아 특공 2년 이내 출산 가구 20%↑ 배정</text>
  <text x="155" y="795" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">2024년 이후 출생아 기준, 소득·자산 요건 별도</text>

  <!-- Item 5 -->
  <rect x="60" y="840" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="870" width="54" height="54" rx="27" fill="#F59E0B"/>
  <text x="107" y="907" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">5</text>
  <text x="155" y="900" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">부부 중복 청약 허용 — 당첨 확률 2배</text>
  <text x="155" y="935" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">같은 단지에 부부 각각 신청 가능</text>

  <!-- 칩 -->
  <rect x="60" y="990" width="140" height="40" rx="20" fill="#E8F0FF"/>
  <text x="130" y="1017" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">주택청약</text>
  <rect x="220" y="990" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="270" y="1017" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">가점</text>
  <rect x="340" y="990" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="390" y="1017" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">2026</text>
</svg>