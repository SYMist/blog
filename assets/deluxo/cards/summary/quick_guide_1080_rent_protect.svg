<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="180" height="44" rx="22" fill="#F59E0B"/>
  <text x="150" y="79" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#0B1F3B">10초 판단</text>

  <!-- 메인 제목 -->
  <text x="60" y="150" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">나는 어디?</text>
  <text x="60" y="210" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">경영 유지 vs 폐업·재기</text>

  <!-- 구분선 -->
  <rect x="60" y="240" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Column Headers -->
  <rect x="60" y="280" width="460" height="60" rx="16" fill="#3B82F6"/>
  <text x="290" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">경영 유지</text>
  <rect x="560" y="280" width="460" height="60" rx="16" fill="#8B5CF6"/>
  <text x="790" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">폐업·재기</text>

  <!-- Row 1: 핵심 지원 -->
  <text x="540" y="385" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">핵심 지원</text>
  <rect x="60" y="400" width="460" height="140" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="80" y="440" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">바우처 25만 원</text>
  <text x="80" y="472" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">착한 임대인 세액공제 70%</text>
  <text x="80" y="504" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">대환대출 금리 인하</text>
  <rect x="560" y="400" width="460" height="140" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="580" y="440" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">철거비 최대 600만 원</text>
  <text x="580" y="472" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">재기사업화 최대 2,000만 원</text>
  <text x="580" y="504" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">전직장려수당 100만 원</text>

  <!-- Row 2: 법적 권리 -->
  <text x="540" y="585" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">법적 권리</text>
  <rect x="60" y="600" width="460" height="140" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="80" y="640" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">관리비 공개 (5/12~)</text>
  <text x="80" y="672" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">차임 증액 5% 상한</text>
  <text x="80" y="704" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">계약갱신 10년 보장</text>
  <rect x="560" y="600" width="460" height="140" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="580" y="640" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">원상복구 합의</text>
  <text x="580" y="672" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">권리금 회수 보호</text>
  <text x="580" y="704" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">법률자문·채무조정 무료</text>

  <!-- Row 3: 추가 활용 -->
  <text x="540" y="785" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">추가 활용</text>
  <rect x="60" y="800" width="460" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="80" y="840" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">정책자금 3.36조</text>
  <text x="80" y="872" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">지자체 임대료 감면 사업</text>
  <rect x="560" y="800" width="460" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="580" y="840" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">취업 연계 교육</text>
  <text x="580" y="872" font-family="'Pretendard',sans-serif" font-size="19" fill="#EAF2FF">국민취업지원제도 병행</text>

  <!-- 칩 -->
  <rect x="60" y="960" width="160" height="40" rx="20" fill="#E8F0FF"/>
  <text x="140" y="987" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">빠른판단</text>
  <rect x="240" y="960" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="290" y="987" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">비교</text>
  <rect x="360" y="960" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="410" y="987" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">2026</text>

  <!-- 하단 라인 -->
  <rect x="60" y="1040" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
