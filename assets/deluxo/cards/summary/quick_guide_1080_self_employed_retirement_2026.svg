<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#F59E0B"/>

  <!-- Title -->
  <text x="540" y="68" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#F59E0B" text-anchor="middle">소득구간별 최적 납입 전략</text>
  <text x="540" y="106" font-family="-apple-system, sans-serif" font-size="21" font-weight="700" fill="#A0B4D0" text-anchor="middle">내 종합소득에 맞는 노란우산 + IRP 조합 전략</text>

  <!-- Header -->
  <rect x="40" y="132" width="1000" height="50" rx="8" fill="#1A3270"/>
  <text x="185" y="163" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" text-anchor="middle">종합소득 구간</text>
  <text x="390" y="163" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" text-anchor="middle">노란우산 한도</text>
  <text x="590" y="163" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" text-anchor="middle">IRP+연금저축</text>
  <text x="770" y="163" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" text-anchor="middle">연간 절세 합계</text>
  <text x="970" y="163" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" text-anchor="middle">핵심</text>

  <!-- Row 1 -->
  <rect x="40" y="186" width="1000" height="96" rx="8" fill="#0D2347"/>
  <rect x="40" y="186" width="6" height="96" rx="3" fill="#34D399"/>
  <text x="185" y="224" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#34D399" text-anchor="middle">4,000만원 이하</text>
  <text x="185" y="262" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">세율 6~15%</text>
  <text x="390" y="240" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">600만원</text>
  <text x="590" y="232" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">900만원 (16.5%)</text>
  <text x="590" y="258" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">연금저축 600+IRP 300</text>
  <text x="770" y="240" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#34D399" text-anchor="middle">~238만원</text>
  <text x="970" y="232" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">노란우산 최대</text>
  <text x="970" y="254" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">+ IRP 최대</text>

  <!-- Row 2 -->
  <rect x="40" y="288" width="1000" height="96" rx="8" fill="#1A3270"/>
  <rect x="40" y="288" width="6" height="96" rx="3" fill="#F59E0B"/>
  <text x="185" y="326" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F59E0B" text-anchor="middle">4,000~4,500만원</text>
  <text x="185" y="358" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">세율 15~16.5%</text>
  <text x="390" y="342" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">400만원</text>
  <text x="590" y="334" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">900만원 (16.5%)</text>
  <text x="590" y="360" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">연금저축 600+IRP 300</text>
  <text x="770" y="342" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#F59E0B" text-anchor="middle">~209만원</text>
  <text x="970" y="334" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">IRP 우선,</text>
  <text x="970" y="356" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">노란우산 400만원</text>

  <!-- Row 3 -->
  <rect x="40" y="390" width="1000" height="96" rx="8" fill="#0D2347"/>
  <rect x="40" y="390" width="6" height="96" rx="3" fill="#F59E0B"/>
  <text x="185" y="428" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#EAF2FF" text-anchor="middle">4,500만원~1억</text>
  <text x="185" y="460" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">세율 24~35%</text>
  <text x="390" y="444" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">400만원</text>
  <text x="590" y="436" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">900만원 (13.2%)</text>
  <text x="590" y="462" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">연금저축 600+IRP 300</text>
  <text x="770" y="444" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#EAF2FF" text-anchor="middle">~219만원</text>
  <text x="970" y="436" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">노란우산</text>
  <text x="970" y="458" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">공제 효과 큼</text>

  <!-- Row 4 -->
  <rect x="40" y="492" width="1000" height="96" rx="8" fill="#1A3270"/>
  <rect x="40" y="492" width="6" height="96" rx="3" fill="#A0B4D0"/>
  <text x="185" y="530" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#A0B4D0" text-anchor="middle">1억원 초과</text>
  <text x="185" y="562" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">세율 35~38%↑</text>
  <text x="390" y="546" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">200만원</text>
  <text x="590" y="538" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">900만원 (13.2%)</text>
  <text x="590" y="564" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">연금저축 600+IRP 300</text>
  <text x="770" y="546" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#A0B4D0" text-anchor="middle">~189만원</text>
  <text x="970" y="538" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">IRP 효과</text>
  <text x="970" y="560" font-family="-apple-system, sans-serif" font-size="14" fill="#EAF2FF" text-anchor="middle">상대적으로 큼</text>

  <!-- Key insight -->
  <rect x="40" y="614" width="1000" height="80" rx="12" fill="#1A3270"/>
  <text x="540" y="650" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle">핵심: 노란우산(소득공제) + IRP·연금저축(세액공제)는 한도 충돌 없음</text>
  <text x="540" y="680" font-family="-apple-system, sans-serif" font-size="16" fill="#EAF2FF" text-anchor="middle">두 제도 동시 납입 시 소득공제 + 세액공제 혜택을 각각 전액 수령 가능</text>

  <!-- Optimal combo -->
  <text x="540" y="756" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">최적 조합 (종합소득 4,500만원↓)</text>
  <rect x="80" y="774" width="260" height="130" rx="16" fill="#0D2347"/>
  <text x="210" y="820" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">노란우산공제</text>
  <text x="210" y="858" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">600만원</text>
  <text x="210" y="890" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">소득공제 ~90만원↓</text>

  <text x="415" y="845" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle">+</text>

  <rect x="450" y="774" width="260" height="130" rx="16" fill="#0D2347"/>
  <text x="580" y="820" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle">연금저축+IRP</text>
  <text x="580" y="858" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">900만원</text>
  <text x="580" y="890" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">세액공제 ~148만원↓</text>

  <text x="765" y="845" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#34D399" text-anchor="middle">=</text>

  <rect x="800" y="774" width="240" height="130" rx="16" fill="#1A3270"/>
  <rect x="800" y="774" width="240" height="130" rx="16" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="920" y="820" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle">연간 절세</text>
  <text x="920" y="858" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">~238만원</text>
  <text x="920" y="890" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">합산 최대</text>

  <text x="540" y="970" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 개인 소득 상황에 따라 실제 절세액 상이</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
</svg>
