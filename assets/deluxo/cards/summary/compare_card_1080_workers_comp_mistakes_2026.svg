<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="98" font-family="'Pretendard', sans-serif" font-size="40" font-weight="900" fill="#EF4444" text-anchor="middle">⚠ 불승인 후 불복 절차 3단계</text>
  <text x="540" y="152" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#EAF2FF" text-anchor="middle">각 단계 90일 기한 — 하루라도 초과 시 처분 확정</text>

  <!-- Step 1: 심사청구 -->
  <rect x="60" y="195" width="295" height="550" rx="24" fill="#1D4ED8"/>
  <text x="207" y="264" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">1단계</text>
  <text x="207" y="330" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">심사청구</text>
  <rect x="90" y="356" width="235" height="2" fill="#FFFFFF" rx="1"/>
  <text x="207" y="400" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#C7D9FF" text-anchor="middle">근로복지공단</text>
  <text x="207" y="432" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#C7D9FF" text-anchor="middle">산재심사위원회</text>
  <text x="207" y="506" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle">90일</text>
  <text x="207" y="548" font-family="'Pretendard', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">불승인 통보받은 날부터</text>
  <text x="207" y="624" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#C7D9FF" text-anchor="middle">공단에 직접 서면 제출</text>
  <text x="207" y="656" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#C7D9FF" text-anchor="middle">추가 의견서 첨부 가능</text>
  <text x="207" y="700" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#C7D9FF" text-anchor="middle">결과: 약 30~60일 내 통보</text>

  <!-- Arrow 1→2 -->
  <text x="378" y="484" font-family="'Pretendard', sans-serif" font-size="54" font-weight="900" fill="#F59E0B" text-anchor="middle">➡</text>

  <!-- Step 2: 재심사청구 -->
  <rect x="393" y="195" width="295" height="550" rx="24" fill="#1E40AF"/>
  <text x="540" y="264" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">2단계</text>
  <text x="540" y="330" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">재심사청구</text>
  <rect x="423" y="356" width="235" height="2" fill="#FFFFFF" rx="1"/>
  <text x="540" y="400" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#C7D9FF" text-anchor="middle">고용노동부</text>
  <text x="540" y="432" font-family="'Pretendard', sans-serif" font-size="17" font-weight="700" fill="#C7D9FF" text-anchor="middle">산재보상보험재심사위원회</text>
  <text x="540" y="506" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle">90일</text>
  <text x="540" y="548" font-family="'Pretendard', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">심사 결과 통보 후</text>
  <text x="540" y="624" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#C7D9FF" text-anchor="middle">1단계 생략 가능</text>
  <text x="540" y="656" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#C7D9FF" text-anchor="middle">(2015년 이후)</text>
  <text x="540" y="700" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#C7D9FF" text-anchor="middle">결과: 약 60~90일 내 통보</text>

  <!-- Arrow 2→3 -->
  <text x="711" y="484" font-family="'Pretendard', sans-serif" font-size="54" font-weight="900" fill="#F59E0B" text-anchor="middle">➡</text>

  <!-- Step 3: 행정소송 -->
  <rect x="726" y="195" width="295" height="550" rx="24" fill="#F59E0B"/>
  <text x="873" y="264" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#0B1F3B" text-anchor="middle">3단계</text>
  <text x="873" y="330" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#0B1F3B" text-anchor="middle">행정소송</text>
  <rect x="756" y="356" width="235" height="2" fill="#0B1F3B" rx="1"/>
  <text x="873" y="400" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#0B1F3B" text-anchor="middle">행정법원</text>
  <text x="873" y="432" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#0B1F3B" text-anchor="middle">취소소송 제기</text>
  <text x="873" y="506" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#0B1F3B" text-anchor="middle">90일</text>
  <text x="873" y="548" font-family="'Pretendard', sans-serif" font-size="17" font-weight="700" fill="#0B1F3B" text-anchor="middle">재심사 결과 통보 후</text>
  <text x="873" y="624" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0B1F3B" text-anchor="middle">법률 지원 권장</text>
  <text x="873" y="656" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0B1F3B" text-anchor="middle">노동법률 지원단</text>
  <text x="873" y="700" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0B1F3B" text-anchor="middle">☎ 1350 무료 상담</text>

  <!-- Bottom bar -->
  <rect x="60" y="782" width="960" height="240" rx="20" fill="#1A3270"/>
  <text x="540" y="852" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#F59E0B" text-anchor="middle">2015년 이후: 심사청구 없이 바로 행정소송 가능</text>
  <text x="540" y="910" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">심사청구를 거친 경우 → 재심사 없이 바로 소송 선택 가능</text>
  <text x="540" y="985" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">※ 각 단계 90일 초과 즉시 그 단계 불복권 소멸 — 달력 관리 필수</text>
</svg>
