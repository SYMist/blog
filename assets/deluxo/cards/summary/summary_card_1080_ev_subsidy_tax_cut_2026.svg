  <text x="540" y="154" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" fill="#A0B4D0" text-anchor="middle">2026년 지원 종류별 금액 요약</text>

  <!-- Row 1: 국비보조금 -->
  <rect x="60" y="210" width="960" height="120" rx="14" fill="#1A3270"/>
  <rect x="60" y="210" width="8" height="120" rx="4" fill="#34D399"/>
  <text x="100" y="261" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#34D399">국비보조금</text>
  <text x="100" y="300" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">중·대형 최대 580만원 / 소형 530만원 / 초소형 200만원</text>
  <text x="980" y="280" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399" text-anchor="end">580만</text>

  <!-- Row 2: 전환지원금 -->
  <rect x="60" y="346" width="960" height="110" rx="14" fill="#0D2347"/>
  <rect x="60" y="346" width="8" height="110" rx="4" fill="#F59E0B"/>
  <text x="100" y="393" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#F59E0B">내연차 전환지원금</text>
  <text x="100" y="430" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">3년 이상 내연차 처분 후 전기차 구매 시 추가</text>
  <text x="980" y="420" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#F59E0B" text-anchor="end">+100만</text>

  <!-- Row 3: 취득세 감면 -->
  <rect x="60" y="472" width="470" height="110" rx="14" fill="#1A3270"/>
  <rect x="60" y="472" width="8" height="110" rx="4" fill="#A0B4D0"/>
  <text x="100" y="519" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">취득세 감면</text>
  <text x="100" y="554" font-family="-apple-system, sans-serif" font-size="21" fill="#A0B4D0">2026.12.31까지</text>
  <text x="510" y="540" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="end">최대 140만</text>

  <!-- Row 3: 개소세 감면 -->
  <rect x="550" y="472" width="470" height="110" rx="14" fill="#1A3270"/>
  <rect x="550" y="472" width="8" height="110" rx="4" fill="#A0B4D0"/>
  <text x="590" y="519" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">개소세 감면</text>
  <text x="590" y="554" font-family="-apple-system, sans-serif" font-size="21" fill="#A0B4D0">2026.12.31까지</text>
  <text x="1000" y="540" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="end">최대 300만</text>

  <!-- Row 4: 지방보조금 -->
