  <text x="980" y="672" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#60A5FA" text-anchor="end">지역별 상이</text>

  <!-- Total box -->
  <rect x="60" y="730" width="960" height="120" rx="16" fill="#34D399" fill-opacity="0.15"/>
  <rect x="60" y="730" width="960" height="4" rx="2" fill="#34D399"/>
  <text x="540" y="785" font-family="-apple-system, sans-serif" font-size="30" font-weight="800" fill="#34D399" text-anchor="middle">조건 모두 충족 시 보조금+세제 합산</text>
  <text x="540" y="833" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">최대 약 1,200만원 이상 절감</text>

  <!-- Price tier note -->
  <rect x="60" y="876" width="960" height="80" rx="12" fill="#1A3270"/>
  <text x="540" y="910" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">가격 기준: 5,300만 미만 100% / 5,300~8,500만 50% / 8,500만 이상 미지원</text>
  <text x="540" y="942" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">※ 지방보조금 예산 소진 시 조기 마감 — 신청 전 공고 필수 확인</text>

  <!-- Footer -->
  <text x="540" y="1010" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">deluxo | 2026-05-20 기준</text>
  <text x="540" y="1048" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">※ 실제 수령액은 차량 모델·지역·개인 조건에 따라 다릅니다</text>
</svg>
