<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">정책자금 vs 시중대출 금리 비교</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- Left: 시중은행 -->
  <rect x="60" y="120" width="460" height="60" rx="16" fill="rgba(239,68,68,0.15)"/>
  <text x="290" y="158" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#EF4444">시중은행 사업자 대출</text>

  <!-- Right: 정책자금 -->
  <rect x="560" y="120" width="460" height="60" rx="16" fill="rgba(34,197,94,0.15)"/>
  <text x="790" y="158" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#22C55E">4분기 정책자금</text>

  <!-- Row 1 -->
  <rect x="60" y="200" width="460" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="290" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">금리</text>
  <text x="290" y="272" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#EF4444">연 6.0% ~ 9.0%</text>
  <rect x="560" y="200" width="460" height="90" rx="16" fill="rgba(34,197,94,0.06)"/>
  <text x="790" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">금리</text>
  <text x="790" y="272" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#22C55E">연 2.8% ~ 4.2%</text>

  <!-- Row 2 -->
  <rect x="60" y="310" width="460" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="290" y="350" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">5,000만 원 연 이자</text>
  <text x="290" y="382" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#EF4444">300~450만 원</text>
  <rect x="560" y="310" width="460" height="90" rx="16" fill="rgba(34,197,94,0.06)"/>
  <text x="790" y="350" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">5,000만 원 연 이자</text>
  <text x="790" y="382" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#22C55E">140~175만 원</text>

  <!-- Row 3 -->
  <rect x="60" y="420" width="460" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="290" y="460" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">한도</text>
  <text x="290" y="492" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#EAF2FF">신용 평가에 따라 상이</text>
  <rect x="560" y="420" width="460" height="90" rx="16" fill="rgba(34,197,94,0.06)"/>
  <text x="790" y="460" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">한도</text>
  <text x="790" y="492" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#22C55E">7,000만~10억 원</text>

  <!-- Row 4 -->
  <rect x="60" y="530" width="460" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="290" y="570" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">우대 금리</text>
  <text x="290" y="602" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#EAF2FF">거의 없음</text>
  <rect x="560" y="530" width="460" height="90" rx="16" fill="rgba(34,197,94,0.06)"/>
  <text x="790" y="570" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">우대 금리</text>
  <text x="790" y="602" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#22C55E">최대 0.4%p 인하</text>

  <!-- Row 5 -->
  <rect x="60" y="640" width="460" height="90" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="290" y="680" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">대환 가능 여부</text>
  <text x="290" y="712" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#EAF2FF">제한적</text>
  <rect x="560" y="640" width="460" height="90" rx="16" fill="rgba(34,197,94,0.06)"/>
  <text x="790" y="680" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">대환 가능 여부</text>
  <text x="790" y="712" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#22C55E">7%+→4.5% 대환 가능</text>

  <!-- Bottom -->
  <rect x="60" y="770" width="960" height="100" rx="20" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="820" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#F59E0B">연간 절감 효과: 125만 ~ 275만 원 (5,000만 원 기준)</text>
  <text x="540" y="855" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">비수도권 -0.2%p · 디지털 전환 -0.5%p · 안전망 가입 각 -0.1%p</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
