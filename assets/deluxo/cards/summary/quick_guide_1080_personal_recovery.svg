<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="60" y="50" width="200" height="44" rx="22" fill="#F59E0B"/>
  <text x="160" y="79" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#0B1F3B">빠른 판단 가이드</text>
  <text x="60" y="148" font-family="'Pretendard',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">개인회생 vs 개인파산</text>
  <text x="60" y="200" font-family="'Pretendard',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">10초 판단</text>
  <rect x="60" y="225" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- 헤더 -->
  <rect x="60" y="265" width="320" height="45" rx="10" fill="#3B82F6"/>
  <text x="220" y="295" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">비교 항목</text>
  <rect x="400" y="265" width="310" height="45" rx="10" fill="#10B981"/>
  <text x="555" y="295" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">개인회생</text>
  <rect x="730" y="265" width="290" height="45" rx="10" fill="#EF4444"/>
  <text x="875" y="295" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">개인파산</text>

  <!-- Row 1 -->
  <rect x="60" y="330" width="320" height="80" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="220" y="378" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">핵심 성격</text>
  <rect x="400" y="330" width="310" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="555" y="368" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">소득으로 일부 갚고</text>
  <text x="555" y="395" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">나머지 탕감</text>
  <rect x="730" y="330" width="290" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="875" y="368" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">재산 처분 후</text>
  <text x="875" y="395" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">잔여 채무 면책</text>

  <!-- Row 2 -->
  <rect x="60" y="425" width="320" height="80" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="220" y="473" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">소득 요건</text>
  <rect x="400" y="425" width="310" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="555" y="473" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#34D399">정기 소득 필수</text>
  <rect x="730" y="425" width="290" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="875" y="473" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">소득 없어도 가능</text>

  <!-- Row 3 -->
  <rect x="60" y="520" width="320" height="80" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="220" y="568" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">재산 처분</text>
  <rect x="400" y="520" width="310" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="555" y="568" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#34D399">재산 유지 가능</text>
  <rect x="730" y="520" width="290" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="875" y="568" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#FCA5A5">재산 처분 필요</text>

  <!-- Row 4 -->
  <rect x="60" y="615" width="320" height="80" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="220" y="663" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">기간</text>
  <rect x="400" y="615" width="310" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="555" y="663" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FBBF24">3~5년</text>
  <rect x="730" y="615" width="290" height="80" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="875" y="663" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FBBF24">3~6개월</text>

  <!-- Row 5 -->
  <rect x="60" y="710" width="320" height="80" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="220" y="758" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">한 줄 요약</text>
  <rect x="400" y="710" width="310" height="80" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1"/>
  <text x="555" y="748" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#34D399">소득 있고</text>
  <text x="555" y="775" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#34D399">재산 지키고 싶으면</text>
  <rect x="730" y="710" width="290" height="80" rx="8" fill="rgba(239,68,68,0.1)" stroke="#EF4444" stroke-width="1"/>
  <text x="875" y="748" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#FCA5A5">소득 없고</text>
  <text x="875" y="775" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#FCA5A5">빨리 끝내고 싶으면</text>

  <text x="60" y="860" font-family="'Pretendard',sans-serif" font-size="18" fill="#94A3B8">※ 정확한 판단은 법률 전문가 상담을 통해 확인하세요</text>
</svg>
