<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1080" height="8" fill="#EF4444"/>

  <!-- Title -->
  <text x="540" y="68" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">정책자금 탈락사유 TOP 5</text>
  <text x="540" y="100" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">음식점·카페 창업자 필수 확인 — 소상공인 정책자금 심사 기준</text>

  <!-- Divider -->
  <line x1="60" y1="120" x2="1020" y2="120" stroke="#EF4444" stroke-width="1.5"/>

  <!-- Item 1 -->
  <rect x="60" y="138" width="960" height="156" rx="14" fill="#2A1515"/>
  <rect x="60" y="138" width="960" height="156" rx="14" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <text x="120" y="210" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#EF4444">1</text>
  <text x="200" y="186" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">제외 업종 해당</text>
  <text x="200" y="214" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">유흥업소, 사행성 업종, 도박 관련 영업은 정책자금 신청 자체가 불가</text>
  <text x="200" y="240" font-family="-apple-system, sans-serif" font-size="15" fill="#EF4444">→ 일반 음식점·카페는 해당 없음. 업종코드 먼저 확인</text>
  <text x="200" y="262" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0">단란주점·유흥주점은 제외 대상 가능성 높음 — 신청 전 확인 필수</text>

  <!-- Item 2 -->
  <rect x="60" y="306" width="960" height="148" rx="14" fill="#0D2347"/>
  <text x="120" y="378" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#F59E0B">2</text>
  <text x="200" y="354" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">연체·금융 불량 이력</text>
  <text x="200" y="382" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">신용정보 조회 시 장기 연체·부실 채권이 있으면 심사에서 탈락</text>
  <text x="200" y="408" font-family="-apple-system, sans-serif" font-size="15" fill="#F59E0B">→ 신청 전 신용정보원(www.credit.co.kr)에서 본인 신용 조회 권장</text>

  <!-- Item 3 -->
  <rect x="60" y="466" width="960" height="148" rx="14" fill="#2A1515"/>
  <rect x="60" y="466" width="960" height="148" rx="14" fill="none" stroke="#EF4444" stroke-width="1"/>
  <text x="120" y="538" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#EF4444">3</text>
  <text x="200" y="514" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">사업계획서 미흡</text>
  <text x="200" y="542" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">자금 사용처가 '운영자금'처럼 막연하거나 상환 계획이 부실한 경우</text>
  <text x="200" y="568" font-family="-apple-system, sans-serif" font-size="15" fill="#EF4444">→ 인건비·임차료·원재료비 등 항목별 금액 구체적으로 기재 필수</text>

  <!-- Item 4 -->
  <rect x="60" y="626" width="960" height="148" rx="14" fill="#0D2347"/>
  <text x="120" y="698" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#F59E0B">4</text>
  <text x="200" y="674" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">업종 코드 불일치</text>
  <text x="200" y="702" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">사업자등록 업종과 실제 영업 업종이 다르면 심사에서 부적격 처리</text>
  <text x="200" y="728" font-family="-apple-system, sans-serif" font-size="15" fill="#F59E0B">→ 카페인데 일반음식점 코드로 등록되어 있는 경우 수정 필요</text>

  <!-- Item 5 -->
  <rect x="60" y="786" width="960" height="148" rx="14" fill="#2A1515"/>
  <rect x="60" y="786" width="960" height="148" rx="14" fill="none" stroke="#EF4444" stroke-width="1"/>
  <text x="120" y="858" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#EF4444">5</text>
  <text x="200" y="834" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">기존 대출 과다</text>
  <text x="200" y="862" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">소득 대비 총 부채 비율이 높아 상환능력 부족으로 판정되는 경우</text>
  <text x="200" y="888" font-family="-apple-system, sans-serif" font-size="15" fill="#EF4444">→ 기존 고금리 대출 대환 후 신청하거나 부채 일부 상환 후 재신청</text>

  <!-- Bottom note -->
  <text x="540" y="984" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">2026년 기준 | 소상공인시장진흥공단 ols.semas.or.kr | ☎1533-0100</text>

  <!-- Bottom bar -->
  <rect x="0" y="1072" width="1080" height="8" fill="#EF4444"/>
</svg>
