<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="85" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="800" fill="#F59E0B" text-anchor="middle">나는 어디? 사업 형태 10초 판단</text>
  <text x="540" y="135" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">법인 전환 빠른 판단 가이드</text>
  <line x1="80" y1="160" x2="1000" y2="160" stroke="#1A3270" stroke-width="2"/>

  <!-- Card 1: 1억 미만 -->
  <rect x="80" y="178" width="920" height="140" rx="12" fill="#0D2347"/>
  <rect x="80" y="178" width="8" height="140" rx="4" fill="#A0B4D0"/>
  <text x="116" y="222" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">순이익 1억 미만 · 막 시작하는 단계</text>
  <text x="116" y="268" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">개인사업자 유지 권장</text>
  <text x="116" y="302" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">법인 유지비(월 20~40만원)가 절세 효과를 상쇄할 수 있음</text>

  <!-- Card 2: 1억~2억 -->
  <rect x="80" y="332" width="920" height="140" rx="12" fill="#0D2347"/>
  <rect x="80" y="332" width="8" height="140" rx="4" fill="#F59E0B"/>
  <text x="116" y="376" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">순이익 1억~2억 · 혼자 사업 운영</text>
  <text x="116" y="422" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="900" fill="#F59E0B">1인법인 전환 검토 시작</text>
  <text x="116" y="456" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">세율 차이 발생 구간 — 건강보험 절감 포함 시 전환 이익 발생</text>

  <!-- Card 3: 2억 이상 혼자 -->
  <rect x="80" y="486" width="920" height="140" rx="12" fill="#0D2347"/>
  <rect x="80" y="486" width="8" height="140" rx="4" fill="#34D399"/>
  <text x="116" y="530" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">순이익 2억 이상 · 가족 참여 없음</text>
  <text x="116" y="576" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="900" fill="#34D399">1인법인 전환 적극 권장</text>
  <text x="116" y="610" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">연 3,450만원 절세 효과 + 건강보험 직장가입자 전환</text>

  <!-- Card 4: 2억 이상 가족 참여 -->
  <rect x="80" y="640" width="920" height="140" rx="12" fill="#0D2347"/>
  <rect x="80" y="640" width="8" height="140" rx="4" fill="#34D399"/>
  <text x="116" y="684" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0">순이익 2억 이상 · 배우자·자녀 업무 참여</text>
  <text x="116" y="730" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="900" fill="#34D399">가족법인 설립 권장</text>
  <text x="116" y="764" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">배당 분산(15.4% 분리과세) + 가족 급여 비용처리로 추가 절세</text>

  <!-- Card 5: 5억 이상 -->
  <rect x="80" y="794" width="920" height="110" rx="12" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1.5"/>
  <text x="540" y="840" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#34D399" text-anchor="middle">순이익 5억 이상</text>
  <text x="540" y="878" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">가족법인 절세 효과 극대화 (세무사 상담 필수)</text>

  <!-- Footer -->
  <text x="540" y="960" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#4B6A9A" text-anchor="middle">※ 업종·부채·자산 규모에 따라 달라질 수 있습니다</text>
  <text x="540" y="995" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4B6A9A" text-anchor="middle">개인 상황에 맞는 정확한 판단은 세무사 상담을 권장합니다</text>
  <text x="540" y="1050" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#2D4A7A" text-anchor="middle">출처: 국세청 2026년 법인세율 기준</text>
</svg>
