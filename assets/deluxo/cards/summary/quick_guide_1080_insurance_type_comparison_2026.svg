<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="12" fill="url(#accent)"/>

  <!-- Title -->
  <text x="540" y="80" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">나는 어떤 유형? 상황별 판단</text>
  <text x="540" y="118" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">내 상황에 맞는 보험 유형 찾기</text>

  <!-- Divider -->
  <rect x="60" y="138" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- Table header -->
  <rect x="60" y="156" width="960" height="56" rx="10" fill="#1A3270"/>
  <text x="300" y="191" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#F59E0B" text-anchor="middle">내 상황</text>
  <text x="680" y="191" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#F59E0B" text-anchor="middle">추천 유형</text>
  <line x1="540" y1="156" x2="540" y2="212" stroke="#0B1F3B" stroke-width="2"/>

  <!-- Row 1 -->
  <rect x="60" y="216" width="960" height="114" rx="0" fill="#0F2348"/>
  <rect x="60" y="324" width="960" height="2" fill="#1A3270"/>
  <text x="300" y="258" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">보험료 예산이 빠듯하다</text>
  <text x="300" y="284" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">저축도 따로 할 생각이다</text>
  <text x="680" y="258" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#34D399" text-anchor="middle">순수보장형</text>
  <text x="680" y="284" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">최저 비용, 차액 투자로 수익 극대화</text>
  <line x1="540" y1="216" x2="540" y2="326" stroke="#1A3270" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="60" y="326" width="960" height="114" rx="0" fill="#0B1F3B"/>
  <rect x="60" y="434" width="960" height="2" fill="#1A3270"/>
  <text x="300" y="368" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">저축 의지가 약하다</text>
  <text x="300" y="394" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">강제로 돈을 묶어두고 싶다</text>
  <text x="680" y="368" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#F59E0B" text-anchor="middle">만기환급형</text>
  <text x="680" y="394" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">강제 저축 효과 (수익률 낮음 주의)</text>
  <line x1="540" y1="326" x2="540" y2="436" stroke="#1A3270" stroke-width="2"/>

  <!-- Row 3 -->
  <rect x="60" y="436" width="960" height="114" rx="0" fill="#0F2348"/>
  <rect x="60" y="544" width="960" height="2" fill="#1A3270"/>
  <text x="300" y="478" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">장기 유지 확실 + 보험료 절약</text>
  <text x="300" y="504" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">중도해지 가능성이 없다</text>
  <text x="680" y="478" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#34D399" text-anchor="middle">무해지환급형</text>
  <text x="680" y="504" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">가장 저렴한 보험료</text>
  <line x1="540" y1="436" x2="540" y2="546" stroke="#1A3270" stroke-width="2"/>

  <!-- Row 4 -->
  <rect x="60" y="546" width="960" height="114" rx="0" fill="#0B1F3B"/>
  <rect x="60" y="654" width="960" height="2" fill="#1A3270"/>
  <text x="300" y="588" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">노후 자금 + 비과세 혜택 원한다</text>
  <text x="300" y="614" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">10년 이상 장기 유지 가능하다</text>
  <text x="680" y="588" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#F59E0B" text-anchor="middle">적립형 (연금보험)</text>
  <text x="680" y="614" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">이자소득세 비과세 혜택</text>
  <line x1="540" y1="546" x2="540" y2="656" stroke="#1A3270" stroke-width="2"/>

  <!-- Row 5 -->
  <rect x="60" y="656" width="960" height="114" rx="0" fill="#0F2348"/>
  <rect x="60" y="764" width="960" height="2" fill="#1A3270"/>
  <text x="300" y="698" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">의료실비보험에 가입하고 싶다</text>
  <text x="300" y="724" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">선택 가능한 유형이 없다</text>
  <text x="680" y="698" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#EAF2FF" text-anchor="middle">갱신형 (의무)</text>
  <text x="680" y="724" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">실비는 갱신형만 존재</text>
  <line x1="540" y1="656" x2="540" y2="766" stroke="#1A3270" stroke-width="2"/>

  <!-- Row 6 -->
  <rect x="60" y="766" width="960" height="114" rx="0" fill="#0B1F3B"/>
  <text x="300" y="808" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">보장성 보험 갱신·비갱신 선택</text>
  <text x="300" y="834" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">암보험·CI보험·종신보험 등</text>
  <text x="680" y="808" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#34D399" text-anchor="middle">비갱신형</text>
  <text x="680" y="834" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">보험료 고정, 갱신 거절 없음</text>
  <line x1="540" y1="766" x2="540" y2="880" stroke="#1A3270" stroke-width="2"/>

  <!-- Bottom bar -->
  <rect x="0" y="896" width="1080" height="160" fill="#0A1A35"/>
  <text x="540" y="950" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#EAF2FF" text-anchor="middle">보험 유형 무료 비교</text>
  <text x="540" y="982" font-family="-apple-system, sans-serif" font-size="18" fill="#F59E0B" text-anchor="middle">금감원 금융소비자 포털: fine.fss.or.kr ☎ 1332</text>
  <text x="540" y="1014" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">생명보험협회 공시실: pub.insure.or.kr</text>
  <text x="540" y="1042" font-family="-apple-system, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">가입 전 반드시 약관·상품설명서 확인 필수</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
