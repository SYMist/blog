<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="180" r="240" fill="#1A3270" opacity="0.3"/>

  <!-- 제목 -->
  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF">가족돌봄휴직 거부 가능 여부</text>
  <text x="60" y="136" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="900" fill="#34D399">10초 판단 가이드 — 5가지 예외 사유</text>
  <rect x="60" y="154" width="680" height="3" rx="2" fill="#34D399"/>

  <!-- 사유 1 -->
  <rect x="60" y="174" width="960" height="90" rx="12" fill="#0D2347"/>
  <rect x="60" y="174" width="8" height="90" rx="4" fill="#34D399"/>
  <text x="88" y="210" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399">① 계속 근로 6개월 미만</text>
  <text x="88" y="244" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">휴직 개시 전날까지 해당 사업장 근속 6개월 미만 → 거부 가능</text>

  <!-- 사유 2 -->
  <rect x="60" y="276" width="960" height="90" rx="12" fill="#0D2347"/>
  <rect x="60" y="276" width="8" height="90" rx="4" fill="#34D399"/>
  <text x="88" y="312" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399">② 다른 가족이 돌볼 수 있는 경우</text>
  <text x="88" y="346" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">실제로 돌볼 수 있는 다른 가족 존재 (사업주가 증명) → 거부 가능</text>

  <!-- 사유 3 -->
  <rect x="60" y="378" width="960" height="110" rx="12" fill="#0D2347"/>
  <rect x="60" y="378" width="8" height="110" rx="4" fill="#34D399"/>
  <text x="88" y="414" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399">③ 조부모·손자녀: 다른 직계비속·존속 존재</text>
  <text x="88" y="448" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">단, 그들이 질병·장애·미성년이면 예외 사유 적용 불가</text>
  <text x="88" y="476" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#F59E0B">→ 예외: 다른 가족도 질병·장애·미성년이면 거부 불가</text>

  <!-- 사유 4 -->
  <rect x="60" y="500" width="960" height="110" rx="12" fill="#0D2347"/>
  <rect x="60" y="500" width="8" height="110" rx="4" fill="#34D399"/>
  <text x="88" y="536" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399">④ 대체인력 14일+ 구인 실패</text>
  <text x="88" y="570" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">고용센터 구인 신청 후 14일 이상 채용 노력 기록 보유</text>
  <text x="88" y="598" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#EF4444">⚠ 정당한 이유 없이 2회 이상 채용 거부하면 예외 불가</text>

  <!-- 사유 5 -->
  <rect x="60" y="622" width="960" height="110" rx="12" fill="#0D2347"/>
  <rect x="60" y="622" width="8" height="110" rx="4" fill="#F59E0B"/>
  <text x="88" y="658" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#F59E0B">⑤ 정상 사업 운영에 중대한 지장</text>
  <text x="88" y="692" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0">사업주가 중대한 지장을 직접 증명해야 함</text>
  <text x="88" y="720" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#EF4444">⚠ 입증 기준 높아 실무상 인정 사례 극히 드뭄</text>

  <!-- 경고 박스 -->
  <rect x="60" y="748" width="960" height="100" rx="14" fill="#1A0F2E"/>
  <text x="540" y="790" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#EF4444" text-anchor="middle">위 5가지 외의 이유로 거부하면</text>
  <text x="540" y="826" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">500만 원 이하 과태료 부과 대상</text>

  <!-- 거부 시 필수 조치 -->
  <rect x="60" y="862" width="960" height="80" rx="14" fill="#102A56"/>
  <text x="540" y="898" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">거부 시 필수 조치</text>
  <text x="540" y="928" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">서면으로 사유 통보 + 근로시간 조정·단축 등 대안 제시 (의무)</text>

  <!-- 출처 -->
  <text x="540" y="1034" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#4A6080" text-anchor="middle">deluxo · 남녀고용평등과 일·가정 양립 지원에 관한 법률 · 2026년 5월 기준</text>
</svg>
