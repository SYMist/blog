<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <!-- Title -->
  <text x="80" y="185" font-family="'Pretendard', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">청년 월세 지원 핵심 정리</text>

  <!-- Divider -->
  <rect x="80" y="215" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Row 1 -->
  <rect x="60" y="270" width="960" height="120" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="310" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">국토부</text>
  <text x="100" y="345" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.85">만19~34세 / 월 20만 원 × 24개월</text>
  <text x="100" y="375" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">= 최대 480만 원</text>

  <!-- Row 2 -->
  <rect x="60" y="410" width="960" height="120" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="450" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">서울시</text>
  <text x="100" y="485" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.85">만19~39세 / 중위150%↓</text>
  <text x="100" y="515" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">최대 240만 원</text>

  <!-- Row 3 -->
  <rect x="60" y="550" width="960" height="120" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="590" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">인천시</text>
  <text x="100" y="625" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.85">만35~39세 인천형</text>
  <text x="100" y="655" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">+ 이사비 40만 원</text>

  <!-- Row 4 -->
  <rect x="60" y="690" width="960" height="120" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="730" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">주거급여</text>
  <text x="100" y="765" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.85">중위48%↓ / 분리지급</text>
  <text x="100" y="795" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">60만 원 정액공제</text>

  <!-- Row 5 -->
  <rect x="60" y="830" width="960" height="120" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="870" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">주택드림</text>
  <text x="100" y="905" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.85">통장 4.5% + 대출 2.2%~</text>
  <text x="100" y="935" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">출산 우대 적용</text>
</svg>