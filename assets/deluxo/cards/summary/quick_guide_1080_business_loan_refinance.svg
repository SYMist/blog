<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <rect x="60" y="60" width="240" height="60" rx="30" fill="#F59E0B"/>
  <text x="180" y="101" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B" text-anchor="middle">빠른 판단</text>

  <text x="540" y="200" font-family="'Pretendard', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle">나는 어디에 해당?</text>

  <rect x="60" y="280" width="960" height="220" rx="20" fill="#1A3270"/>
  <text x="540" y="335" font-family="'Pretendard', sans-serif" font-size="36" font-weight="800" fill="#F59E0B" text-anchor="middle">NICE 919점 이하 소상공인</text>
  <text x="540" y="395" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">→ 소진공 정책 대환 (연 4.5% 고정)</text>
  <text x="540" y="440" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">최대 5,000만 · 최대 10년</text>
  <text x="540" y="485" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#A7C4FF" text-anchor="middle">중도상환수수료 면제</text>

  <rect x="60" y="530" width="960" height="220" rx="20" fill="#1A3270"/>
  <text x="540" y="585" font-family="'Pretendard', sans-serif" font-size="36" font-weight="800" fill="#F59E0B" text-anchor="middle">대전·세종·인천·충남 사업장</text>
  <text x="540" y="645" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">→ 지역 이차보전 추가 (실질 2% 수준)</text>
  <text x="540" y="690" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">소진공 + 이차보전 결합 가능</text>
  <text x="540" y="735" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#A7C4FF" text-anchor="middle">보증드림 앱 비대면 신청</text>

  <rect x="60" y="780" width="960" height="220" rx="20" fill="#1A3270"/>
  <text x="540" y="835" font-family="'Pretendard', sans-serif" font-size="36" font-weight="800" fill="#F59E0B" text-anchor="middle">정책 자격 미해당 시</text>
  <text x="540" y="895" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">→ 토스·카카오페이 갈아타기</text>
  <text x="540" y="940" font-family="'Pretendard', sans-serif" font-size="30" font-weight="600" fill="#EAF2FF" text-anchor="middle">민간 신용대출 금리 비교 · 평균 -1.8%p</text>
  <text x="540" y="985" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#A7C4FF" text-anchor="middle">30분 내 비대면 실행</text>
</svg>
