<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">자금별 한도·금리·기간 비교</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 헤더 -->
  <rect x="60" y="120" width="960" height="50" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="150" y="152" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#F59E0B">자금</text>
  <text x="350" y="152" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#F59E0B">운전 한도</text>
  <text x="530" y="152" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#F59E0B">시설 한도</text>
  <text x="710" y="152" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#F59E0B">금리</text>
  <text x="900" y="152" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#F59E0B">기간</text>

  <!-- 일반경영 -->
  <rect x="60" y="180" width="960" height="80" rx="0" fill="rgba(59,130,246,0.1)"/>
  <text x="150" y="228" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="19" font-weight="700" fill="#FFF">일반경영</text>
  <text x="350" y="228" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">7,000만</text>
  <text x="530" y="228" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">-</text>
  <text x="710" y="228" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">기준+0.6%p</text>
  <text x="900" y="228" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">5년(거치2)</text>

  <!-- 성장지원 -->
  <rect x="60" y="270" width="960" height="80" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="150" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="19" font-weight="700" fill="#FFF">성장지원</text>
  <text x="350" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">1억</text>
  <text x="530" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">5억</text>
  <text x="710" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">기준+0.4%p</text>
  <text x="900" y="318" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">5/8년</text>

  <!-- 도약지원 -->
  <rect x="60" y="360" width="960" height="80" rx="0" fill="rgba(245,158,11,0.08)"/>
  <text x="150" y="408" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="19" font-weight="700" fill="#F59E0B">도약지원</text>
  <text x="350" y="408" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">2억</text>
  <text x="530" y="408" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">10억</text>
  <text x="710" y="408" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">기준+0.4%p</text>
  <text x="900" y="408" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">5/8년</text>

  <!-- 신용취약 -->
  <rect x="60" y="450" width="960" height="80" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="150" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="19" font-weight="700" fill="#FFF">신용취약</text>
  <text x="350" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">3,000만</text>
  <text x="530" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">-</text>
  <text x="710" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">기준+1.6%p</text>
  <text x="900" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">5년(거치2)</text>

  <!-- 대환대출 -->
  <rect x="60" y="540" width="960" height="80" rx="0" fill="rgba(59,130,246,0.1)"/>
  <text x="150" y="588" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="19" font-weight="700" fill="#FFF">대환대출</text>
  <text x="350" y="588" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">5,000만</text>
  <text x="530" y="588" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">-</text>
  <text x="710" y="580" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">연 4.5%</text>
  <text x="710" y="604" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="15" fill="#EAF2FF">고정</text>
  <text x="900" y="588" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">10년(거치2)</text>

  <!-- 금리 우대 -->
  <rect x="60" y="650" width="960" height="360" rx="20" fill="rgba(245,158,11,0.08)"/>
  <text x="540" y="690" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">금리 우대 — 최대 0.8%p 감면</text>

  <rect x="100" y="710" width="860" height="50" rx="12" fill="rgba(59,130,246,0.1)"/>
  <text x="200" y="742" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">노란우산·고용보험·풍수해보험</text>
  <text x="800" y="742" text-anchor="end" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">각 0.1%p</text>

  <rect x="100" y="770" width="860" height="50" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="802" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">비수도권·인구감소 지역</text>
  <text x="800" y="802" text-anchor="end" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">0.2%p</text>

  <rect x="100" y="830" width="860" height="50" rx="12" fill="rgba(59,130,246,0.1)"/>
  <text x="200" y="862" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">성실 상환 (3년 무연체)</text>
  <text x="800" y="862" text-anchor="end" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">0.3%p</text>

  <rect x="100" y="890" width="860" height="50" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="922" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">제로페이·여성·장애인기업</text>
  <text x="800" y="922" text-anchor="end" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">각 0.1%p</text>

  <rect x="100" y="960" width="860" height="36" rx="18" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="984" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" font-weight="700" fill="#F59E0B">중복 합산 가능! 대출 기간 전체로 수백만 원 절감</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>