<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 타이틀 -->
  <rect x="60" y="54" width="960" height="100" rx="16" fill="#0D2347"/>
  <text x="540" y="100" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">내 상황은? 10초 판단 가이드</text>
  <text x="540" y="138" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">직장가입자 vs 지역가입자 vs 피부양자</text>

  <!-- 왼쪽 박스: 직장가입자 -->
  <rect x="60" y="180" width="300" height="520" rx="20" fill="#0D2347" stroke="#34D399" stroke-width="3"/>
  <rect x="60" y="180" width="300" height="60" rx="20" fill="#34D399"/>
  <rect x="60" y="220" width="300" height="20" fill="#34D399"/>
  <text x="210" y="220" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#0B1F3B" text-anchor="middle">직장가입자</text>

  <text x="210" y="290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">조건</text>
  <text x="210" y="322" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#34D399" text-anchor="middle">1개월 이상</text>
  <text x="210" y="352" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#34D399" text-anchor="middle">+ 월 60시간 이상</text>

  <rect x="90" y="380" width="240" height="2" fill="#1A3270"/>

  <text x="210" y="420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">보험료</text>
  <text x="210" y="452" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">근로자 50%</text>
  <text x="210" y="480" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">사업주 50%</text>

  <rect x="90" y="508" width="240" height="2" fill="#1A3270"/>

  <text x="210" y="546" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">신고</text>
  <text x="210" y="576" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">사업주가 의무</text>
  <text x="210" y="604" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">14일 이내 신고</text>

  <rect x="90" y="636" width="240" height="60" rx="10" fill="#34D399"/>
  <text x="210" y="672" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">조건 충족 시 사업주에게</text>
  <text x="210" y="696" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">신고 요청하세요</text>

  <!-- 가운데 박스: 지역가입자 -->
  <rect x="390" y="180" width="300" height="520" rx="20" fill="#0D2347" stroke="#F59E0B" stroke-width="3"/>
  <rect x="390" y="180" width="300" height="60" rx="20" fill="#F59E0B"/>
  <rect x="390" y="220" width="300" height="20" fill="#F59E0B"/>
  <text x="540" y="220" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#0B1F3B" text-anchor="middle">지역가입자</text>

  <text x="540" y="290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">조건</text>
  <text x="540" y="322" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">직장가입자 조건</text>
  <text x="540" y="352" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">미충족 / 자영업자</text>

  <rect x="420" y="380" width="240" height="2" fill="#1A3270"/>

  <text x="540" y="420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">보험료</text>
  <text x="540" y="452" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">소득·재산·자동차</text>
  <text x="540" y="480" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">합산 산출</text>

  <rect x="420" y="508" width="240" height="2" fill="#1A3270"/>

  <text x="540" y="546" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">특이사항</text>
  <text x="540" y="576" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">전액 본인 부담</text>
  <text x="540" y="604" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">경감 신청 가능</text>

  <rect x="420" y="636" width="240" height="60" rx="10" fill="#F59E0B"/>
  <text x="540" y="665" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">소득 낮으면</text>
  <text x="540" y="689" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">경감 신청 검토</text>

  <!-- 오른쪽 박스: 피부양자 -->
  <rect x="720" y="180" width="300" height="520" rx="20" fill="#0D2347" stroke="#34D399" stroke-width="3"/>
  <rect x="720" y="180" width="300" height="60" rx="20" fill="#34D399"/>
  <rect x="720" y="220" width="300" height="20" fill="#34D399"/>
  <text x="870" y="220" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#0B1F3B" text-anchor="middle">피부양자</text>

  <text x="870" y="290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">소득 요건</text>
  <text x="870" y="322" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#34D399" text-anchor="middle">연 2,000만 원 이하</text>
  <text x="870" y="354" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">(금융소득 1,000만↓ 제외)</text>

  <rect x="750" y="380" width="240" height="2" fill="#1A3270"/>

  <text x="870" y="420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">재산 요건</text>
  <text x="870" y="452" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">과세표준</text>
  <text x="870" y="480" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">5억 4천만 원 이하</text>

  <rect x="750" y="508" width="240" height="2" fill="#1A3270"/>

  <text x="870" y="546" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">보험료</text>
  <text x="870" y="580" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="900" fill="#34D399" text-anchor="middle">0원</text>

  <rect x="750" y="636" width="240" height="60" rx="10" fill="#34D399"/>
  <text x="870" y="665" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">취업 후 90일 이내</text>
  <text x="870" y="689" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">신청해야 소급 가능</text>

  <!-- 경고 박스 -->
  <rect x="60" y="730" width="960" height="110" rx="16" fill="#1A0A0A" stroke="#EF4444" stroke-width="2"/>
  <text x="540" y="776" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#EF4444" text-anchor="middle">⚠️ 핵심 경고</text>
  <text x="540" y="812" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">사업자 등록 있으면 실 소득 0원이어도 피부양자 탈락 가능</text>
  <text x="540" y="840" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">불필요한 사업자 등록은 폐업 신고 후 피부양자 신청 검토</text>

  <!-- 하단 출처 -->
  <text x="540" y="898" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#A0B4D0" text-anchor="middle">공단 1577-1000 · 국민건강보험법 제6조 · 2026년 5월 기준</text>
  <text x="540" y="930" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4A6080" text-anchor="middle">deluxo</text>
</svg>
