<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">워크아웃 vs 개인회생 vs 개인파산</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- Header -->
  <rect x="60" y="130" width="960" height="55" rx="0" fill="rgba(59,130,246,0.2)"/>
  <text x="200" y="165" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">항목</text>
  <text x="440" y="165" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#3B82F6">워크아웃</text>
  <text x="680" y="165" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#10B981">개인회생</text>
  <text x="920" y="165" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#EF4444">개인파산</text>

  <!-- Row 1 -->
  <rect x="60" y="190" width="960" height="75" rx="0" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="235" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">성격</text>
  <text x="440" y="235" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">사적 조정</text>
  <text x="680" y="235" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">법적 절차</text>
  <text x="920" y="235" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">법적 절차</text>

  <!-- Row 2 -->
  <rect x="60" y="270" width="960" height="75" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="315" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">감면</text>
  <text x="440" y="315" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">이자 감면</text>
  <text x="680" y="315" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">원금 최대 90%</text>
  <text x="920" y="315" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">전액 면책</text>

  <!-- Row 3 -->
  <rect x="60" y="350" width="960" height="75" rx="0" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="395" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">채무 한도</text>
  <text x="440" y="395" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">15억 이하</text>
  <text x="680" y="395" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">무담보10억/담보15억</text>
  <text x="920" y="395" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">제한 없음</text>

  <!-- Row 4 -->
  <rect x="60" y="430" width="960" height="75" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="475" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">소득 요건</text>
  <text x="440" y="475" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">상환 의지</text>
  <text x="680" y="475" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">정기 소득 필수</text>
  <text x="920" y="475" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">지급불능 상태</text>

  <!-- Row 5 -->
  <rect x="60" y="510" width="960" height="75" rx="0" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="555" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">변제 기간</text>
  <text x="440" y="555" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">최장 10년</text>
  <text x="680" y="555" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">3~5년</text>
  <text x="920" y="555" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">없음 (면책)</text>

  <!-- Row 6 -->
  <rect x="60" y="590" width="960" height="75" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="635" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">비용</text>
  <text x="440" y="635" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">무료</text>
  <text x="680" y="635" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">인지대+송달료</text>
  <text x="920" y="635" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">인지대+송달료</text>

  <!-- Row 7 -->
  <rect x="60" y="670" width="960" height="75" rx="0" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="715" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">재산 처분</text>
  <text x="440" y="715" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">없음</text>
  <text x="680" y="715" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">청산가치 보장</text>
  <text x="920" y="715" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">재산 처분</text>

  <!-- Row 8 -->
  <rect x="60" y="750" width="960" height="75" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="795" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">신용회복</text>
  <text x="440" y="795" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">완제 후 즉시</text>
  <text x="680" y="795" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">면책 후 5년 이내</text>
  <text x="920" y="795" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">면책 후 5년 이내</text>

  <!-- Row 9 -->
  <rect x="60" y="830" width="960" height="75" rx="0" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="875" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">강제집행</text>
  <text x="440" y="875" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">중단 불가</text>
  <text x="680" y="875" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">중지명령 가능</text>
  <text x="920" y="875" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" fill="#FFF">파산선고 시 중지</text>

  <!-- 하단 -->
  <rect x="60" y="930" width="960" height="105" rx="20" fill="rgba(245,158,11,0.1)"/>
  <text x="540" y="975" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">핵심 판단 기준</text>
  <text x="540" y="1015" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">이자만 줄이면 OK → 워크아웃 | 원금 감면 필요 → 회생 | 상환 불가 → 파산</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>