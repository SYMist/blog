<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 타이틀 -->
  <rect x="60" y="54" width="960" height="100" rx="16" fill="#0D2347"/>
  <text x="540" y="98" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">신청 전 1분 체크리스트</text>
  <text x="540" y="138" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">건강보험 직장가입자 / 피부양자 등재</text>

  <!-- 체크 항목 1 -->
  <rect x="60" y="178" width="960" height="98" rx="14" fill="#0D2347"/>
  <rect x="84" y="202" width="48" height="48" rx="10" fill="#34D399"/>
  <text x="108" y="234" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="168" y="218" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">아르바이트·일용직 — 고용기간 1개월 이상</text>
  <text x="168" y="252" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0">+ 월 60시간 이상 충족 여부</text>

  <!-- 체크 항목 2 -->
  <rect x="60" y="286" width="960" height="98" rx="14" fill="#102A56"/>
  <rect x="84" y="310" width="48" height="48" rx="10" fill="#34D399"/>
  <text x="108" y="342" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="168" y="326" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">사업주가 직장건강보험 신고를 했는지 확인</text>
  <text x="168" y="360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0">급여명세서 또는 건강보험 자격확인서로 확인</text>

  <!-- 체크 항목 3 -->
  <rect x="60" y="394" width="960" height="98" rx="14" fill="#0D2347"/>
  <rect x="84" y="418" width="48" height="48" rx="10" fill="#34D399"/>
  <text x="108" y="450" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="168" y="434" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">피부양자 대상 가족 — 연 소득 2,000만 원 이하 확인</text>
  <text x="168" y="468" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0">금융소득 1,000만 원 이하는 소득 계산 제외</text>

  <!-- 체크 항목 4 -->
  <rect x="60" y="502" width="960" height="98" rx="14" fill="#102A56"/>
  <rect x="84" y="526" width="48" height="48" rx="10" fill="#34D399"/>
  <text x="108" y="558" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="168" y="542" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">재산세 과세표준 5억 4천만 원 이하 확인</text>
  <text x="168" y="576" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0">형제·자매는 별도로 1억 8천만 원 이하 기준 적용</text>

  <!-- 체크 항목 5 -->
  <rect x="60" y="610" width="960" height="98" rx="14" fill="#0D2347"/>
  <rect x="84" y="634" width="48" height="48" rx="10" fill="#F59E0B"/>
  <text x="108" y="666" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">!</text>
  <text x="168" y="650" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#F59E0B">직장가입자 취득일 90일 이내 신청 기한 확인</text>
  <text x="168" y="684" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0">초과 시 신청일 기준 (소급 불가)</text>

  <!-- 체크 항목 6 -->
  <rect x="60" y="718" width="960" height="98" rx="14" fill="#102A56"/>
  <rect x="84" y="742" width="48" height="48" rx="10" fill="#34D399"/>
  <text x="108" y="774" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">✓</text>
  <text x="168" y="758" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">사업자 등록 여부 확인</text>
  <text x="168" y="792" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0">불필요한 사업자는 폐업 신고 후 피부양자 신청</text>

  <!-- 결과 강조 -->
  <rect x="60" y="836" width="960" height="100" rx="16" fill="#34D399"/>
  <text x="540" y="878" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B" text-anchor="middle">✅ 6가지 모두 확인했다면</text>
  <text x="540" y="918" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">지금 바로 사업장에 피부양자 등재 신청하세요</text>

  <!-- 하단 출처 -->
  <text x="540" y="990" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4A6080" text-anchor="middle">공단 1577-1000 · 2026년 5월 기준 · deluxo</text>
</svg>
