<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="46" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">개인회생 요약표</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">자격 · 절차 · 핵심 포인트</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Rows -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <text x="120" y="340" font-size="30" fill="#111827" font-weight="700">자격</text>
    <text x="260" y="340" font-size="28" fill="#374151">담보 15억/무담보 10억 이하 + 지속적 소득</text>

    <line x1="120" y1="380" x2="960" y2="380" stroke="#F1F5F9"/>

    <text x="120" y="440" font-size="30" fill="#111827" font-weight="700">절차</text>
    <text x="260" y="440" font-size="28" fill="#374151">신청 → 개시결정 → 인가 → 변제 → 면책</text>

    <line x1="120" y1="480" x2="960" y2="480" stroke="#F1F5F9"/>

    <text x="120" y="540" font-size="30" fill="#111827" font-weight="700">기간</text>
    <text x="260" y="540" font-size="28" fill="#374151">변제기간 통상 3년(사정 시 5년)</text>

    <line x1="120" y1="580" x2="960" y2="580" stroke="#F1F5F9"/>

    <text x="120" y="640" font-size="30" fill="#111827" font-weight="700">주의</text>
    <text x="260" y="640" font-size="28" fill="#374151">소득·재산·채무 누락 시 보정/기각</text>

    <line x1="120" y1="680" x2="960" y2="680" stroke="#F1F5F9"/>

    <text x="120" y="740" font-size="30" fill="#111827" font-weight="700">비면책</text>
    <text x="260" y="740" font-size="28" fill="#374151">국세·벌금·과태료 등은 면책 제외</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="840" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="895" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    세부 요건은 법원/공공기관 안내 기준으로 확인
  </text>
</svg>
