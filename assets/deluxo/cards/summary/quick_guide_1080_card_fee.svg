<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">내 상황에 맞는 카드수수료 확인</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="140" width="960" height="160" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="185" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#3B82F6">동네 가게 · 1인 사업 (연매출 3억 이하)</text>
  <text x="100" y="225" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">→ 영세 우대: 신용 0.40% / 체크 0.15%</text>
  <text x="100" y="260" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">자동 적용 · 별도 신청 없음</text>

  <rect x="60" y="310" width="960" height="160" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="355" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#3B82F6">소규모 매장 (연매출 3~5억)</text>
  <text x="100" y="395" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">→ 중소1 우대: 신용 1.00% / 체크 0.75%</text>
  <text x="100" y="430" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">여신금융협회에서 적용 여부 확인</text>

  <rect x="60" y="480" width="960" height="160" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="525" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#3B82F6">중소 매장 · 프랜차이즈 (연매출 5~30억)</text>
  <text x="100" y="565" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">→ 중소2~3 우대: 최대 1.45% / 1.15%</text>
  <text x="100" y="600" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">매출 구간별 자동 분류</text>

  <rect x="60" y="650" width="960" height="160" rx="16" fill="rgba(16,185,129,0.12)"/>
  <text x="100" y="695" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#10B981">신규 개업 후 6개월 미만</text>
  <text x="100" y="735" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">→ 일반 수수료 납부 → 우대 전환 후 차액 환급</text>
  <text x="100" y="770" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">정산 계좌 정보 정확한지 반드시 확인!</text>

  <rect x="60" y="820" width="960" height="160" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="865" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#3B82F6">온라인 쇼핑몰 · PG사 이용</text>
  <text x="100" y="905" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">→ PG사 하위가맹점 동일 우대 적용</text>
  <text x="100" y="940" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">PG사 관리자 페이지에서 수수료율 확인</text>

  <rect x="60" y="1030" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>