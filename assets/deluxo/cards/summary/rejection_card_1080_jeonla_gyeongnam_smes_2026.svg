<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#EF4444"/>

  <!-- Title -->
  <text x="540" y="66" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">지원금 탈락사유 TOP 5</text>
  <text x="540" y="102" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">전라·경남 소상공인 지원금 신청 전 반드시 확인하세요</text>
  <line x1="60" y1="124" x2="1020" y2="124" stroke="#1A3270" stroke-width="2"/>

  <!-- Rejection 1 -->
  <rect x="60" y="148" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="148" width="6" height="120" rx="3" fill="#EF4444"/>
  <text x="110" y="196" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#EF4444">01</text>
  <text x="210" y="192" font-family="-apple-system, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">지역 요건 미충족</text>
  <text x="210" y="220" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">사업장 소재지가 해당 시도·시군 밖이면 신청 불가</text>
  <text x="210" y="248" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 사업자등록증 소재지 먼저 확인 | 전남 사업장 → 전남 공고 신청</text>

  <!-- Rejection 2 -->
  <rect x="60" y="286" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="286" width="6" height="120" rx="3" fill="#EF4444"/>
  <text x="110" y="334" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#EF4444">02</text>
  <text x="210" y="330" font-family="-apple-system, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">업종 제외</text>
  <text x="210" y="358" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">유흥업소·사행성 업종·도박 관련 업종은 지원 불가</text>
  <text x="210" y="386" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 업종코드·업태 확인 후 지원 공고의 대상 업종 목록과 대조</text>

  <!-- Rejection 3 -->
  <rect x="60" y="424" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="424" width="6" height="120" rx="3" fill="#F59E0B"/>
  <text x="110" y="472" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#F59E0B">03</text>
  <text x="210" y="468" font-family="-apple-system, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">기존 보증 한도 초과</text>
  <text x="210" y="496" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">신용보증재단 잔여 보증 한도가 부족하면 보증서 발급 거절</text>
  <text x="210" y="524" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 기존 보증 잔액 확인 후 한도 내 신청 | 전남신보 1588-3884 문의</text>

  <!-- Rejection 4 -->
  <rect x="60" y="562" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="562" width="6" height="120" rx="3" fill="#F59E0B"/>
  <text x="110" y="610" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#F59E0B">04</text>
  <text x="210" y="606" font-family="-apple-system, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">사업자등록 기간 미충족</text>
  <text x="210" y="634" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">전남 도 육성자금: 3개월 이상 영업 필수 | 경남: 공고 요건 별도 확인</text>
  <text x="210" y="662" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 사업자등록증 개업일 기준으로 충족 여부 사전 확인</text>

  <!-- Rejection 5 -->
  <rect x="60" y="700" width="960" height="120" rx="12" fill="#0D2347"/>
  <rect x="60" y="700" width="6" height="120" rx="3" fill="#A0B4D0"/>
  <text x="110" y="748" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#A0B4D0">05</text>
  <text x="210" y="744" font-family="-apple-system, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">연체·금융 불량 이력</text>
  <text x="210" y="772" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">현재 연체 중이거나 금융 불량 이력이 있으면 보증 심사 탈락</text>
  <text x="210" y="800" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 신청 전 나이스지키미·올크레딧 등 신용 조회 후 정리</text>

  <!-- Bottom tip -->
  <rect x="60" y="848" width="960" height="72" rx="10" fill="#1A3270"/>
  <rect x="60" y="848" width="960" height="72" rx="10" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <text x="540" y="874" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle">탈락 방지 핵심</text>
  <text x="540" y="900" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">신청 전 전남신보(1588-3884) 또는 경남신보(1644-2900)에 사전 상담 — 서류 미비 방지</text>

  <!-- Footer -->
  <text x="540" y="974" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 소상공인통합콜센터 ☎1533-0100 | 자세한 자격 요건은 공고문 확인 필수</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#EF4444"/>
</svg>
