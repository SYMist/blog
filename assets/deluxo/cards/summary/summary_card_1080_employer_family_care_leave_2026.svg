<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="920" cy="160" r="260" fill="#1A3270" opacity="0.35"/>
  <circle cx="100" cy="920" r="180" fill="#0D2347" opacity="0.5"/>

  <!-- 제목 -->
  <text x="60" y="96" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">가족돌봄휴직 vs 가족돌봄휴가</text>
  <text x="60" y="144" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" fill="#34D399">사업주 의무 핵심 비교 요약</text>
  <rect x="60" y="162" width="560" height="3" rx="2" fill="#34D399"/>

  <!-- 비교 테이블 헤더 -->
  <rect x="60" y="182" width="960" height="56" rx="10" fill="#0D2347"/>
  <text x="340" y="218" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">가족돌봄휴직</text>
  <text x="780" y="218" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#F59E0B" text-anchor="middle">가족돌봄휴가</text>
  <rect x="560" y="188" width="2" height="44" fill="#1A3270"/>

  <!-- 행 1: 목적 -->
  <rect x="60" y="242" width="960" height="66" rx="0" fill="#112240"/>
  <text x="160" y="270" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0">목적</text>
  <text x="340" y="266" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">장기 질병·사고·노령 돌봄</text>
  <text x="340" y="294" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">(장기)</text>
  <rect x="560" y="248" width="2" height="54" fill="#1A3270"/>
  <text x="780" y="266" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">긴급 단기 돌봄 / 자녀 양육</text>
  <text x="780" y="294" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">(단기·긴급)</text>

  <!-- 행 2: 연간 최대 -->
  <rect x="60" y="312" width="960" height="66" rx="0" fill="#0F1E3A"/>
  <text x="160" y="340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0">연간 최대</text>
  <text x="340" y="352" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="900" fill="#34D399" text-anchor="middle">90일</text>
  <rect x="560" y="318" width="2" height="54" fill="#1A3270"/>
  <text x="780" y="340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle">10일</text>
  <text x="780" y="368" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">(휴직 90일에 포함)</text>

  <!-- 행 3: 사용 단위 -->
  <rect x="60" y="382" width="960" height="60" rx="0" fill="#112240"/>
  <text x="160" y="410" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0">사용 단위</text>
  <text x="340" y="418" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">1회 최소 30일</text>
  <rect x="560" y="388" width="2" height="48" fill="#1A3270"/>
  <text x="780" y="418" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">일 단위 (하루씩 사용)</text>

  <!-- 행 4: 급여 -->
  <rect x="60" y="446" width="960" height="60" rx="0" fill="#0F1E3A"/>
  <text x="160" y="474" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0">급여</text>
  <text x="340" y="482" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444" text-anchor="middle">무급 원칙</text>
  <rect x="560" y="452" width="2" height="48" fill="#1A3270"/>
  <text x="780" y="482" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444" text-anchor="middle">무급 원칙</text>

  <!-- 행 5: 신청 기한 -->
  <rect x="60" y="510" width="960" height="60" rx="0" fill="#112240"/>
  <text x="160" y="538" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0">신청 기한</text>
  <text x="340" y="546" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">개시 30일 전 서면</text>
  <rect x="560" y="516" width="2" height="48" fill="#1A3270"/>
  <text x="780" y="546" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">사용 전 또는 당일</text>

  <!-- 행 6: 위반 시 -->
  <rect x="60" y="574" width="960" height="60" rx="0" fill="#0F1E3A"/>
  <text x="160" y="602" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#A0B4D0">위반 제재</text>
  <text x="340" y="610" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444" text-anchor="middle">500만 원 이하 과태료</text>
  <rect x="560" y="580" width="2" height="48" fill="#1A3270"/>
  <text x="780" y="610" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#EF4444" text-anchor="middle">500만 원 이하 과태료</text>

  <!-- 구분선 -->
  <rect x="60" y="652" width="960" height="2" rx="1" fill="#1A3270"/>

  <!-- 핵심 포인트 -->
  <rect x="60" y="666" width="960" height="110" rx="14" fill="#0D2347"/>
  <text x="540" y="702" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="middle">⚠ 핵심 포인트</text>
  <text x="540" y="734" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">가족돌봄휴가 10일은 별도 부여가 아닌</text>
  <text x="540" y="760" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">가족돌봄휴직 90일 한도 안에 포함됩니다.</text>

  <!-- 불이익 처우 경고 -->
  <rect x="60" y="790" width="460" height="90" rx="14" fill="#1A0F2E"/>
  <text x="290" y="826" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#EF4444" text-anchor="middle">불이익 처우 시</text>
  <text x="290" y="858" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">3년 이하 징역 또는 3천만 원 벌금</text>

  <!-- 복귀 의무 -->
  <rect x="540" y="790" width="480" height="90" rx="14" fill="#0D2347"/>
  <text x="780" y="826" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">복귀 후 의무</text>
  <text x="780" y="858" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">동일·동등 업무 복귀 / 근속 기간 포함</text>

  <!-- 출처 -->
  <text x="540" y="1034" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#4A6080" text-anchor="middle">deluxo · 남녀고용평등과 일·가정 양립 지원에 관한 법률 · 2026년 5월 기준</text>
</svg>
