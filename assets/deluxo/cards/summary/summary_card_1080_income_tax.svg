<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">2026 종합소득세 신고 핵심 요약</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 신고 기간 -->
  <rect x="60" y="140" width="960" height="100" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="185" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#F59E0B">신고 기간: 2026년 5월 1일 ~ 31일</text>
  <text x="540" y="225" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">5.31 일요일 → 실질 마감 6.1 | 성실신고확인 대상 → 6.30까지</text>

  <!-- 신고 대상 -->
  <rect x="60" y="265" width="960" height="150" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="80" y="305" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">신고 대상</text>
  <text x="80" y="345" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">• 프리랜서(3.3% 원천징수)  • 개인사업자(자영업)</text>
  <text x="80" y="375" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">• 부업 직장인  • 금융소득 2,000만원 초과  • 임대소득자</text>
  <text x="80" y="405" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">• 기타소득 300만원 초과  • 사적연금 1,500만원 초과</text>

  <!-- 세율 핵심 -->
  <rect x="60" y="435" width="960" height="180" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="80" y="475" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">주요 세율 구간</text>
  <text x="80" y="515" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">1,400만원 이하  6%  |  ~5,000만원  15%  |  ~8,800만원  24%</text>
  <text x="80" y="550" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">~1.5억  35%  |  ~3억  38%  |  ~5억  40%  |  10억 초과  45%</text>
  <text x="80" y="595" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">+ 지방소득세(국세의 10%) 별도 신고·납부 필수</text>

  <!-- 절세 공제 -->
  <rect x="60" y="640" width="960" height="170" rx="16" fill="rgba(34,197,94,0.12)"/>
  <text x="80" y="680" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#22C55E">절세 핵심 공제</text>
  <text x="80" y="720" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">연금저축+IRP 세액공제 → 최대 148.5만원 절세</text>
  <text x="80" y="755" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">노란우산공제 → 최대 500만원 소득공제</text>
  <text x="80" y="790" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">국민연금·건보료 → 납입액 전액 공제</text>

  <!-- 환급 안내 -->
  <rect x="60" y="835" width="460" height="110" rx="16" fill="rgba(59,130,246,0.15)"/>
  <text x="290" y="880" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#60A5FA">프리랜서 환급</text>
  <text x="290" y="915" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">2,400만원 이하 단순경비율</text>
  <text x="290" y="940" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#22C55E">환급률 40~57%</text>

  <rect x="560" y="835" width="460" height="110" rx="16" fill="rgba(239,68,68,0.12)"/>
  <text x="790" y="880" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#EF4444">미신고 불이익</text>
  <text x="790" y="915" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">무신고 가산세 20%</text>
  <text x="790" y="940" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">소득증명 미발급·건보료 인상</text>

  <!-- 신고처 -->
  <rect x="60" y="970" width="960" height="60" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="1010" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">홈택스 hometax.go.kr · 위택스 wetax.go.kr · 국세상담 ☎126</text>
</svg>
