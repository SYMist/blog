<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#34D399"/>

  <!-- Title -->
  <text x="540" y="58" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">피부양자 탈락 방지 6단계 체크리스트</text>
  <text x="540" y="90" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#A0B4D0" text-anchor="middle">매년 11월 통보 전에 아래 6가지를 확인하면 탈락 위험을 줄일 수 있습니다</text>

  <!-- Item 1 -->
  <rect x="30" y="110" width="1020" height="138" rx="12" fill="#1A3270"/>
  <rect x="30" y="110" width="6" height="138" rx="3" fill="#34D399"/>
  <circle cx="94" cy="179" r="28" fill="#34D399"/>
  <text x="94" y="187" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#0B1F3B" text-anchor="middle">1</text>
  <text x="144" y="152" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">연 합산소득을 직접 계산해 2,000만원 이하인지 확인했다</text>
  <text x="144" y="181" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">홈택스 → 조회/발급 → 소득금액확인 → 이자+배당+사업+근로+연금+기타 합산</text>
  <text x="144" y="208" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 확인이 어려우면 공단(☎1577-1000)에 현재 자격 확인 요청 가능</text>

  <!-- Item 2 -->
  <rect x="30" y="254" width="1020" height="138" rx="12" fill="#0D2347"/>
  <rect x="30" y="254" width="6" height="138" rx="3" fill="#34D399"/>
  <circle cx="94" cy="323" r="28" fill="#34D399"/>
  <text x="94" y="331" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#0B1F3B" text-anchor="middle">2</text>
  <text x="144" y="296" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">금융소득(이자+배당)이 연 1,000만원 이하인지 별도로 확인했다</text>
  <text x="144" y="325" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">합산소득이 2,000만원 이하여도 금융소득만 1,000만원 초과 시 탈락</text>
  <text x="144" y="352" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">→ 기준 근접 시 ISA, 비과세 상품으로 금융소득 절감 검토</text>

  <!-- Item 3 -->
  <rect x="30" y="398" width="1020" height="138" rx="12" fill="#1A3270"/>
  <rect x="30" y="398" width="6" height="138" rx="3" fill="#F59E0B"/>
  <circle cx="94" cy="467" r="28" fill="#F59E0B"/>
  <text x="94" y="475" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#0B1F3B" text-anchor="middle">3</text>
  <text x="144" y="440" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">부업·프리랜서 사업소득이 연 500만원 이하인지 확인했다</text>
  <text x="144" y="469" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">강사료·원고료·유튜브 수익 등 소규모 사업소득도 포함</text>
  <text x="144" y="496" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B">→ 종합소득세 신고 후 공단에 자동 반영되므로 신고 전 점검 필수</text>

  <!-- Item 4 -->
  <rect x="30" y="542" width="1020" height="138" rx="12" fill="#0D2347"/>
  <rect x="30" y="542" width="6" height="138" rx="3" fill="#F59E0B"/>
  <circle cx="94" cy="611" r="28" fill="#F59E0B"/>
  <text x="94" y="619" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#0B1F3B" text-anchor="middle">4</text>
  <text x="144" y="584" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">보유 부동산의 재산세 과세표준(공시가격×60%)을 계산했다</text>
  <text x="144" y="613" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">5.4억원 초과+소득 1,000만원 초과, 또는 단독 9억원 초과 시 탈락</text>
  <text x="144" y="640" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B">→ 부동산공시가격알리미(realtyprice.kr)에서 공시가격 조회 가능</text>

  <!-- Item 5 -->
  <rect x="30" y="686" width="1020" height="138" rx="12" fill="#1A3270"/>
  <rect x="30" y="686" width="6" height="138" rx="3" fill="#EF4444"/>
  <circle cx="94" cy="755" r="28" fill="#EF4444"/>
  <text x="94" y="763" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="144" y="728" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">배우자 소득도 함께 확인해 부부 동반 탈락 여부를 점검했다</text>
  <text x="144" y="757" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">배우자 중 한 명이라도 소득 기준 초과 시 부부 모두 탈락</text>
  <text x="144" y="784" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444">→ 재산 기준은 개인별 산정이나 소득 기준은 부부 공동 적용</text>

  <!-- Item 6 -->
  <rect x="30" y="830" width="1020" height="138" rx="12" fill="#0D2347"/>
  <rect x="30" y="830" width="6" height="138" rx="3" fill="#EF4444"/>
  <circle cx="94" cy="899" r="28" fill="#EF4444"/>
  <text x="94" y="907" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="144" y="872" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">탈락 통보를 받았다면 이의신청·소득조정·임의계속가입을 검토했다</text>
  <text x="144" y="901" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">탈락 후 4~8주 이내 이의신청, 또는 소득 감소 시 조정 신청 가능</text>
  <text x="144" y="928" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444">→ 퇴직자는 임의계속가입으로 3년간 보험료 절약 (퇴직 직후 신청)</text>

  <text x="540" y="1000" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | nhis.or.kr | 국민건강보험공단 ☎1577-1000 | 개인 상황에 따라 다를 수 있음</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
</svg>
