<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="180" height="44" rx="22" fill="#F59E0B"/>
  <text x="150" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0B1F3B">2026 최신</text>

  <!-- 메인 제목 -->
  <text x="60" y="150" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">가족돌봄휴직·긴급돌봄</text>
  <text x="60" y="210" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">지원금 핵심 요약</text>

  <!-- 구분선 -->
  <rect x="60" y="240" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- 카드 1: 가족돌봄휴직 -->
  <rect x="60" y="280" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="300" width="8" height="80" rx="4" fill="#3B82F6"/>
  <text x="110" y="330" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">가족돌봄휴직</text>
  <text x="110" y="370" font-family="Arial,sans-serif" font-size="24" fill="#EAF2FF">연간 최대 90일 (무급) · 1회 30일 이상 · 사업주 거부 불가</text>

  <!-- 카드 2: 가족돌봄휴가 -->
  <rect x="60" y="420" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="440" width="8" height="80" rx="4" fill="#10B981"/>
  <text x="110" y="470" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">가족돌봄휴가</text>
  <text x="110" y="510" font-family="Arial,sans-serif" font-size="24" fill="#EAF2FF">연 10일 (한부모 15일) · 1일 단위 · 긴급 시 당일 사용</text>

  <!-- 카드 3: 긴급돌봄비용 -->
  <rect x="60" y="560" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="580" width="8" height="80" rx="4" fill="#F59E0B"/>
  <text x="110" y="610" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">긴급 가족돌봄비용</text>
  <text x="110" y="650" font-family="Arial,sans-serif" font-size="24" fill="#EAF2FF">1일 5만원 × 최대 10일 = 50만원 (감염병 한시 운영)</text>

  <!-- 카드 4: 경기도 돌봄수당 -->
  <rect x="60" y="700" width="460" height="140" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="720" width="8" height="100" rx="4" fill="#8B5CF6"/>
  <text x="110" y="750" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">경기도 돌봄수당</text>
  <text x="110" y="790" font-family="Arial,sans-serif" font-size="22" fill="#EAF2FF">월 30만원</text>
  <text x="110" y="820" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">24~36개월 영아 · 중위 150%</text>

  <!-- 카드 5: 서울 돌봄SOS -->
  <rect x="560" y="700" width="460" height="140" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="580" y="720" width="8" height="100" rx="4" fill="#EC4899"/>
  <text x="610" y="750" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">서울 돌봄SOS</text>
  <text x="610" y="790" font-family="Arial,sans-serif" font-size="22" fill="#EAF2FF">무료~시간당 16,300원</text>
  <text x="610" y="820" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">만 50세+ · 72시간 긴급</text>

  <!-- 칩 -->
  <rect x="60" y="880" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="110" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">신청</text>
  <rect x="180" y="880" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="230" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">조건</text>
  <rect x="300" y="880" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="350" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">서류</text>

  <!-- 하단 안내 -->
  <text x="60" y="980" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">※ 지자체 예산·공고에 따라 변동될 수 있습니다</text>
  <text x="60" y="1010" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">   신청 전 공식 공고/FAQ 확인 필수</text>
</svg>
