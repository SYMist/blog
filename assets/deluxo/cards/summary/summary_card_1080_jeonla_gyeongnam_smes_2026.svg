  <text x="540" y="862" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#EF4444" text-anchor="middle">예산 소진 시 조기 마감</text>
  <text x="540" y="886" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">각 시군별 예산 상이 — 공고 확인 즉시 신청 | 문의: 소상공인통합콜센터 1533-0100</text>

  <!-- Footer -->
  <text x="540" y="968" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 지역별 공고 확인 필수 | 전남신보 1588-3884 | 경남신보 1644-2900</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
