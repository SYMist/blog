<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">절세 전략 4단계 흐름도</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- Step 1 -->
  <rect x="60" y="150" width="960" height="180" rx="20" fill="rgba(245,158,11,0.12)"/>
  <rect x="80" y="170" width="90" height="44" rx="22" fill="#F59E0B"/>
  <text x="125" y="200" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">STEP 1</text>
  <text x="200" y="240" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#FFF">연금저축 600만원 채우기</text>
  <text x="200" y="280" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">누구나 가입 · 수수료 없음 · 위험자산 100%</text>
  <text x="200" y="310" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#F59E0B">→ 환급 최대 99만원</text>

  <!-- Arrow -->
  <text x="540" y="360" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" fill="#F59E0B">▼</text>

  <!-- Step 2 -->
  <rect x="60" y="380" width="960" height="180" rx="20" fill="rgba(232,240,255,0.08)"/>
  <rect x="80" y="400" width="90" height="44" rx="22" fill="#E8F0FF"/>
  <text x="125" y="430" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#1D4ED8">STEP 2</text>
  <text x="200" y="470" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#FFF">IRP 추가 300만원 납입</text>
  <text x="200" y="510" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">합산 900만원 한도 활용 · 위험자산 70%까지</text>
  <text x="200" y="540" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#F59E0B">→ 추가 환급 49.5만원 (합계 148.5만원)</text>

  <!-- Arrow -->
  <text x="540" y="590" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" fill="#F59E0B">▼</text>

  <!-- Step 3 -->
  <rect x="60" y="610" width="960" height="180" rx="20" fill="rgba(255,255,255,0.06)"/>
  <rect x="80" y="630" width="90" height="44" rx="22" fill="#E8F0FF"/>
  <text x="125" y="660" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#1D4ED8">STEP 3</text>
  <text x="200" y="700" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#FFF">ISA 장기투자 (3년 이상)</text>
  <text x="200" y="740" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">비과세 200만원 + 초과분 9.9% 분리과세 + 손익통산</text>
  <text x="200" y="770" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#F59E0B">→ 투자수익 절세 효과</text>

  <!-- Arrow -->
  <text x="540" y="820" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" fill="#F59E0B">▼</text>

  <!-- Step 4 -->
  <rect x="60" y="840" width="960" height="180" rx="20" fill="rgba(245,158,11,0.12)"/>
  <rect x="80" y="860" width="90" height="44" rx="22" fill="#F59E0B"/>
  <text x="125" y="890" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">STEP 4</text>
  <text x="200" y="930" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#FFF">ISA → 연금계좌 전환</text>
  <text x="200" y="970" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">전환금액 10% (최대 300만원) 추가 세액공제</text>
  <text x="200" y="1000" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#F59E0B">→ 추가 환급 최대 49.5만원</text>
</svg>
