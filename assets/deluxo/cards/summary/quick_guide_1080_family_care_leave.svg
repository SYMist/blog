<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="200" height="44" rx="22" fill="#F59E0B"/>
  <text x="160" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0B1F3B">빠른 판단 가이드</text>

  <!-- 제목 -->
  <text x="60" y="145" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">내 상황에 맞는 돌봄 제도는?</text>

  <!-- 구분선 -->
  <rect x="60" y="175" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- 박스 1 -->
  <rect x="60" y="210" width="460" height="155" rx="16" fill="rgba(59,130,246,0.15)" stroke="#3B82F6" stroke-width="1"/>
  <text x="80" y="245" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#60A5FA">부모님 장기 간병</text>
  <text x="80" y="280" font-family="Arial,sans-serif" font-size="20" fill="#FFFFFF">→ 가족돌봄휴직 (연 90일)</text>
  <text x="80" y="310" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">무급 · 1회 30일 이상</text>
  <text x="80" y="340" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">30일 전 서면 신청</text>

  <!-- 박스 2 -->
  <rect x="560" y="210" width="460" height="155" rx="16" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="580" y="245" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#34D399">자녀 급성 질환 (1~2일)</text>
  <text x="580" y="280" font-family="Arial,sans-serif" font-size="20" fill="#FFFFFF">→ 가족돌봄휴가 (연 10일)</text>
  <text x="580" y="310" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">무급 · 1일 단위</text>
  <text x="580" y="340" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">긴급 시 당일 사용 가능</text>

  <!-- 박스 3 -->
  <rect x="60" y="390" width="460" height="155" rx="16" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1"/>
  <text x="80" y="425" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#FBBF24">감염병으로 돌봄 필요</text>
  <text x="80" y="460" font-family="Arial,sans-serif" font-size="20" fill="#FFFFFF">→ 긴급 가족돌봄비용</text>
  <text x="80" y="490" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">1일 5만원 × 최대 10일</text>
  <text x="80" y="520" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">= 최대 50만원</text>

  <!-- 박스 4 -->
  <rect x="560" y="390" width="460" height="155" rx="16" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="1"/>
  <text x="580" y="425" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#A78BFA">경기도 조부모·친척 돌봄</text>
  <text x="580" y="460" font-family="Arial,sans-serif" font-size="20" fill="#FFFFFF">→ 경기도 가족돌봄수당</text>
  <text x="580" y="490" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">월 30만원 (2명 45만, 3명 60만)</text>
  <text x="580" y="520" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">24~36개월 · 중위 150%</text>

  <!-- 박스 5 -->
  <rect x="60" y="570" width="960" height="155" rx="16" fill="rgba(236,72,153,0.15)" stroke="#EC4899" stroke-width="1"/>
  <text x="80" y="605" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#F472B6">서울, 고령 부모 긴급 돌봄</text>
  <text x="80" y="640" font-family="Arial,sans-serif" font-size="20" fill="#FFFFFF">→ 서울 돌봄SOS센터</text>
  <text x="80" y="670" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">일시재가·단기시설·동행·식사 지원 | 만 50세+ · 72시간 긴급 | 중위 100% 이하 무료</text>
  <text x="80" y="700" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">120다산콜 또는 동 주민센터 신청</text>

  <!-- 하단 팁 -->
  <rect x="60" y="760" width="960" height="80" rx="16" fill="rgba(255,255,255,0.05)"/>
  <text x="80" y="795" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#FBBF24">💡 복수 제도 병행 활용 가능!</text>
  <text x="80" y="825" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">돌봄휴가 + 긴급돌봄비용 + 지자체 수당을 함께 사용하면 부담을 줄일 수 있습니다</text>

  <!-- 칩 -->
  <rect x="60" y="880" width="140" height="40" rx="20" fill="#E8F0FF"/>
  <text x="130" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">돌봄휴직</text>
  <rect x="220" y="880" width="140" height="40" rx="20" fill="#E8F0FF"/>
  <text x="290" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">돌봄휴가</text>
  <rect x="380" y="880" width="160" height="40" rx="20" fill="#E8F0FF"/>
  <text x="460" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">긴급돌봄비용</text>

  <text x="60" y="980" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">※ 제도별 세부 조건은 공식 공고에서 확인하세요</text>
</svg>
