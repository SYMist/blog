<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="130" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#F59E0B" text-anchor="middle">빠른 판단 가이드</text>
  <text x="540" y="210" font-family="'Pretendard', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle">서비스 유형 4선</text>

  <rect x="60" y="270" width="960" height="170" rx="24" fill="#1A3270"/>
  <text x="100" y="325" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F59E0B">① 시간제 일반형 (12,790원/h)</text>
  <text x="100" y="375" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">식사·등하원·놀이 · 1회 최소 2시간 · 연 960시간</text>
  <text x="100" y="415" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">맞벌이 하원 픽업 공백 메우기에 최적</text>

  <rect x="60" y="460" width="960" height="170" rx="24" fill="#1A3270"/>
  <text x="100" y="515" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F59E0B">② 시간제 종합형 (16,620원/h)</text>
  <text x="100" y="565" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">일반형 + 아동 관련 가사(청소·세탁)</text>
  <text x="100" y="605" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">출산 직후·다자녀 가사 부담이 클 때</text>

  <rect x="60" y="650" width="960" height="170" rx="24" fill="#1A3270"/>
  <text x="100" y="705" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F59E0B">③ 영아종일제 (12,790원/h)</text>
  <text x="100" y="755" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">36개월 이하 · 월 60~200시간</text>
  <text x="100" y="795" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">0~1세 우선 신청 · 부모급여와 일부 연동</text>

  <rect x="60" y="840" width="960" height="170" rx="24" fill="#F59E0B"/>
  <text x="100" y="895" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#0B1F3B">④ 질병감염아동 (15,340원/h)</text>
  <text x="100" y="945" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B">수족구·인플루엔자 등 진단 시 1회 5일·40시간</text>
  <text x="100" y="985" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B">의사 진단서·소견서 필수 · 연 한도와 별도</text>
</svg>
