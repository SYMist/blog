<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="220" height="44" rx="22" fill="#DC2626"/>
  <text x="170" y="79" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">부적격 TOP 5</text>

  <!-- 메인 제목 -->
  <text x="60" y="150" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">주택청약 당첨</text>
  <text x="60" y="210" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">이것 때문에 취소됩니다</text>

  <!-- 구분선 -->
  <rect x="60" y="240" width="120" height="4" rx="2" fill="#DC2626"/>

  <!-- Item 1 -->
  <rect x="60" y="280" width="960" height="130" rx="16" fill="rgba(220,38,38,0.08)"/>
  <rect x="80" y="310" width="54" height="54" rx="27" fill="#DC2626"/>
  <text x="107" y="347" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFF">1</text>
  <text x="155" y="335" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">부양가족 주소 불일치</text>
  <text x="155" y="370" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#FCA5A5">→ 등본 3년 미달 시 부양가족 인정 불가</text>
  <text x="155" y="395" font-family="'Pretendard',sans-serif" font-size="17" fill="#94A3B8">가점 계산 시 동일 주민등록등본 3년 이상 유지 필수</text>

  <!-- Item 2 -->
  <rect x="60" y="430" width="960" height="130" rx="16" fill="rgba(220,38,38,0.08)"/>
  <rect x="80" y="460" width="54" height="54" rx="27" fill="#DC2626"/>
  <text x="107" y="497" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFF">2</text>
  <text x="155" y="485" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">무주택 기간 오산</text>
  <text x="155" y="520" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#FCA5A5">→ 만 30세 미만은 기산 불가 (혼인 시 예외)</text>
  <text x="155" y="545" font-family="'Pretendard',sans-serif" font-size="17" fill="#94A3B8">미혼 청년 무주택 기간은 만 30세부터 기산</text>

  <!-- Item 3 -->
  <rect x="60" y="580" width="960" height="130" rx="16" fill="rgba(220,38,38,0.08)"/>
  <rect x="80" y="610" width="54" height="54" rx="27" fill="#DC2626"/>
  <text x="107" y="647" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFF">3</text>
  <text x="155" y="635" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">소득 기준 초과</text>
  <text x="155" y="670" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#FCA5A5">→ 맞벌이 합산 미확인으로 탈락</text>
  <text x="155" y="695" font-family="'Pretendard',sans-serif" font-size="17" fill="#94A3B8">특별공급 소득 기준 부부 합산 확인 필수</text>

  <!-- Item 4 -->
  <rect x="60" y="730" width="960" height="130" rx="16" fill="rgba(220,38,38,0.08)"/>
  <rect x="80" y="760" width="54" height="54" rx="27" fill="#DC2626"/>
  <text x="107" y="797" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFF">4</text>
  <text x="155" y="785" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">재당첨 제한 위반</text>
  <text x="155" y="820" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#FCA5A5">→ 세대원 5년 이내 당첨 이력 있으면 제한</text>
  <text x="155" y="845" font-family="'Pretendard',sans-serif" font-size="17" fill="#94A3B8">본인 아니어도 같은 세대 구성원 당첨 시 적용</text>

  <!-- Item 5 -->
  <rect x="60" y="880" width="960" height="110" rx="16" fill="rgba(220,38,38,0.08)"/>
  <rect x="80" y="900" width="54" height="54" rx="27" fill="#DC2626"/>
  <text x="107" y="937" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFF">5</text>
  <text x="155" y="930" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">통장 미전환</text>
  <text x="155" y="965" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#FCA5A5">→ 구형 통장은 민영 청약 불가 — 종합저축 전환 필수</text>

  <!-- 칩 -->
  <rect x="60" y="1010" width="120" height="36" rx="18" fill="#E8F0FF"/>
  <text x="120" y="1034" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">부적격</text>
  <rect x="200" y="1010" width="100" height="36" rx="18" fill="#E8F0FF"/>
  <text x="250" y="1034" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">주의</text>
  <rect x="320" y="1010" width="100" height="36" rx="18" fill="#E8F0FF"/>
  <text x="370" y="1034" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">2026</text>
</svg>