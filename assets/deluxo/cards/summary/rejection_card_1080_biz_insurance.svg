<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="40" y="36" width="220" height="44" rx="22" fill="#F59E0B"/>
  <text x="150" y="65" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">탈락 사유 TOP 5</text>
  <text x="40" y="135" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">4대보험 절감 혜택</text>
  <text x="40" y="185" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">이것 때문에 못 받습니다</text>
  <rect x="40" y="210" width="120" height="4" rx="2" fill="#F59E0B"/>
  <rect x="40" y="245" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="270" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="306" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">1</text>
  <text x="150" y="295" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">재산·소득 기준 초과</text>
  <text x="150" y="330" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">연금(과표 6억/소득 1,680만), 두루누리(과표 6억/소득 4,300만) 각각 다름</text>
  <text x="150" y="358" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 사업별 기준을 개별 확인하세요</text>
  <rect x="40" y="390" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="70" y="415" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="451" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">2</text>
  <text x="150" y="440" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">두루누리 신규 가입자 조건 미충족</text>
  <text x="150" y="475" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">직전 1년 고용보험·국민연금 이력 있으면 80% 지원 대상 제외</text>
  <text x="150" y="503" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 기존 가입자는 지원 불가</text>
  <rect x="40" y="535" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="560" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="596" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">3</text>
  <text x="150" y="585" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">피부양자 소득 1원 초과</text>
  <text x="150" y="620" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">사업자등록 후 소득 발생 → 건보 피부양자 즉시 탈락</text>
  <text x="150" y="648" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 등록 전 소득 시뮬레이션 필수</text>
  <rect x="40" y="680" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="70" y="705" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="741" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">4</text>
  <text x="150" y="730" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">고용보험 등급 선택 오류</text>
  <text x="150" y="765" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">낮은 등급 = 보험료↓ 실업급여↓ 장기 손해</text>
  <text x="150" y="793" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 80% 환급이므로 높은 등급 추천</text>
  <rect x="40" y="825" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="850" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="886" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">5</text>
  <text x="150" y="875" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">환급 신청 누락</text>
  <text x="150" y="910" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">고용보험료는 사후 환급 — 신청 안 하면 환급 불가</text>
  <text x="150" y="938" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 납부 후 반드시 소상공인24에서 환급 신청</text>
  <rect x="40" y="980" width="140" height="38" rx="19" fill="#E8F0FF"/>
  <text x="110" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">탈락 사유</text>
  <rect x="195" y="980" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="245" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">주의</text>
  <rect x="310" y="980" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="360" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">2026</text>
</svg>