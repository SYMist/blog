<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">빠른 판단</text>

  <!-- Title -->
  <text x="540" y="185" font-family="'Pretendard', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle">수정신고 vs 기한후신고 빠른 판단</text>

  <!-- Divider -->
  <rect x="480" y="210" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Left Column: 수정신고 -->
  <rect x="60" y="260" width="460" height="640" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="290" y="310" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#F59E0B" text-anchor="middle">수정신고</text>

  <text x="100" y="370" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">상황</text>
  <text x="100" y="400" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.9">기한 내 신고 완료</text>
  <text x="100" y="430" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.9">세액이 부족한 경우</text>

  <rect x="90" y="460" width="400" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>

  <text x="100" y="500" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">대상 가산세</text>
  <text x="100" y="535" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">과소신고 10%</text>

  <rect x="90" y="560" width="400" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>

  <text x="100" y="600" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">감면율</text>
  <text x="100" y="640" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1개월: 90% 감면</text>
  <text x="100" y="675" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.8">3개월: 75% 감면</text>
  <text x="100" y="710" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.8">6개월: 50% 감면</text>
  <text x="100" y="745" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.8">1년: 30% 감면</text>
  <text x="100" y="780" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.8">2년: 10% 감면</text>

  <rect x="90" y="810" width="400" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>

  <text x="290" y="860" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">실질 1%만 부담 (1개월)</text>

  <!-- Right Column: 기한후신고 -->
  <rect x="560" y="260" width="460" height="640" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="790" y="310" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">기한후신고</text>

  <text x="600" y="370" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">상황</text>
  <text x="600" y="400" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.9">신고 기한 자체를</text>
  <text x="600" y="430" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.9">놓친 경우</text>

  <rect x="590" y="460" width="400" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>

  <text x="600" y="500" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">대상 가산세</text>
  <text x="600" y="535" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">무신고 20%</text>

  <rect x="590" y="560" width="400" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>

  <text x="600" y="600" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">감면율</text>
  <text x="600" y="640" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1개월: 50% 감면</text>
  <text x="600" y="675" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.8">3개월: 30% 감면</text>
  <text x="600" y="710" font-family="'Pretendard', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.8">6개월: 20% 감면</text>

  <rect x="590" y="810" width="400" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>

  <text x="790" y="860" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">실질 10%만 부담 (1개월)</text>

  <!-- Bottom note -->
  <rect x="200" y="940" width="680" height="60" rx="16" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1"/>
  <text x="540" y="978" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#F59E0B" text-anchor="middle">빨리 할수록 유리 — 1개월이 골든타임</text>
</svg>