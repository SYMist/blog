  <rect x="70" y="705" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="741" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">4</text>
  <text x="150" y="730" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">마일리지 특약 미적용</text>
  <text x="150" y="765" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">표준 요율 그대로 납부 — 최대 47.1% 할인 놓침</text>
  <text x="150" y="793" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 주행거리 적으면 마일리지 특약 필수</text>
  <!-- Item 5 -->
  <rect x="40" y="825" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="850" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="886" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">5</text>
  <text x="150" y="875" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">연두색 번호판 미부착</text>
  <text x="150" y="910" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">비용 전액 부인 + 상여 처분 위험</text>
  <text x="150" y="938" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 8,000만↑ 법인차 즉시 부착하세요</text>
  <!-- Chips -->
  <rect x="40" y="980" width="140" height="38" rx="19" fill="#E8F0FF"/>
  <text x="110" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">실패사유</text>
