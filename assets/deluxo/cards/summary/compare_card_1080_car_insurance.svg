<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="40" y="36" width="240" height="44" rx="22" fill="#F59E0B"/>
  <text x="160" y="65" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">2025 vs 2026</text>
  <text x="40" y="135" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">자동차보험</text>
  <text x="40" y="185" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">이렇게 달라졌다</text>
  <rect x="40" y="210" width="120" height="4" rx="2" fill="#F59E0B"/>
  <!-- Table Header -->
  <rect x="40" y="240" width="1000" height="55" rx="12" fill="rgba(245,158,11,0.2)"/>
  <text x="240" y="275" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">항목</text>
  <text x="560" y="275" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">2025</text>
  <text x="840" y="275" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">2026</text>
  <!-- Row 1 -->
  <rect x="40" y="305" width="1000" height="90" fill="rgba(255,255,255,0.06)"/>
  <text x="70" y="358" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">보험료 기조</text>
  <text x="560" y="358" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.6)">인하 기조</text>
  <text x="840" y="358" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">1.3~1.5% 인상</text>
  <!-- Row 2 -->
  <rect x="40" y="405" width="1000" height="90" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="458" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">UBI 할인</text>
  <text x="560" y="458" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.6)">제한적</text>
  <text x="840" y="458" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">최대 32% 확대</text>
  <!-- Row 3 -->
  <rect x="40" y="505" width="1000" height="90" fill="rgba(255,255,255,0.06)"/>
  <text x="70" y="558" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">저출산 3종</text>
  <text x="560" y="558" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.6)">미시행</text>
  <text x="840" y="558" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">2026.04 시행</text>
  <!-- Row 4 -->
  <rect x="40" y="605" width="1000" height="90" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="658" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">운행기록부 한도</text>
  <text x="560" y="658" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.6)">1,000만 원</text>
  <text x="840" y="658" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">1,500만 원</text>
  <!-- Row 5 -->
  <rect x="40" y="705" width="1000" height="90" fill="rgba(255,255,255,0.06)"/>
  <text x="70" y="758" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">연두색 번호판</text>
  <text x="560" y="758" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.6)">유예기간</text>
  <text x="840" y="758" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">본격 세무조사</text>
  <!-- CTA -->
  <rect x="40" y="830" width="1000" height="70" rx="16" fill="rgba(245,158,11,0.12)"/>
  <text x="540" y="873" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">2026년 = 보험료 인상 + 특약 할인 확대 + 세무 강화</text>
  <!-- Chips -->
  <rect x="40" y="970" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="90" y="995" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">변화</text>
  <rect x="155" y="970" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="205" y="995" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">비교</text>
  <rect x="270" y="970" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="320" y="995" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">2026</text>
</svg>