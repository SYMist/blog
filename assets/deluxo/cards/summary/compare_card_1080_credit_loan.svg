<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">시중은행 vs 인터넷은행 비교</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 헤더 -->
  <rect x="60" y="130" width="960" height="65" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="220" y="172" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">비교 항목</text>
  <text x="540" y="172" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">5대 시중은행</text>
  <text x="860" y="172" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">인터넷은행</text>

  <!-- 최저 금리 -->
  <rect x="60" y="207" width="960" height="100" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="220" y="265" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">최저 금리</text>
  <text x="540" y="255" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#22C55E">4.01%</text>
  <text x="540" y="285" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#94A3B8">신용 1등급 기준</text>
  <text x="860" y="255" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#60A5FA">5.15%</text>
  <text x="860" y="285" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#94A3B8">토스 함께대출 기준</text>

  <!-- 중도상환 -->
  <rect x="60" y="319" width="960" height="100" rx="0" fill="rgba(59,130,246,0.08)"/>
  <text x="220" y="377" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">중도상환수수료</text>
  <text x="540" y="377" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EF4444">0.05~0.18%</text>
  <rect x="790" y="358" width="140" height="40" rx="20" fill="rgba(34,197,94,0.2)"/>
  <text x="860" y="385" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#22C55E">0원</text>

  <!-- 중저신용자 -->
  <rect x="60" y="431" width="960" height="100" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="220" y="489" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">중저신용자 포용</text>
  <text x="540" y="489" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#94A3B8">제한적</text>
  <text x="860" y="479" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#22C55E">넓은 범위</text>
  <text x="860" y="509" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#94A3B8">사잇돌 등 정책 연계</text>

  <!-- 심사 방식 -->
  <rect x="60" y="543" width="960" height="100" rx="0" fill="rgba(59,130,246,0.08)"/>
  <text x="220" y="601" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">심사 방식</text>
  <text x="540" y="601" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#FFF">대면 + 비대면</text>
  <text x="860" y="601" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">100% 비대면</text>

  <!-- 한도 -->
  <rect x="60" y="655" width="960" height="100" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="220" y="713" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">최대 한도</text>
  <text x="540" y="713" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">소득·DSR 기준</text>
  <text x="860" y="703" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">최대 3억 원</text>
  <text x="860" y="733" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#94A3B8">토스뱅크 기준</text>

  <!-- 추천 -->
  <rect x="60" y="767" width="960" height="100" rx="0" fill="rgba(59,130,246,0.08)"/>
  <text x="220" y="825" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">추천 대상</text>
  <text x="540" y="815" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">고신용(900↑)</text>
  <text x="540" y="845" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#94A3B8">최저 금리 확보</text>
  <text x="860" y="815" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">중신용 + 유연성 중시</text>
  <text x="860" y="845" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#94A3B8">수수료 0원·빈번한 갈아타기</text>

  <!-- 하단 -->
  <rect x="60" y="900" width="960" height="140" rx="20" fill="rgba(245,158,11,0.12)"/>
  <text x="540" y="950" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">결론</text>
  <text x="540" y="995" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">금리만 보면 시중은행, 총 비용(수수료+유연성)까지 따지면</text>
  <text x="540" y="1025" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">인터넷은행도 경쟁력 — 반드시 동시 비교!</text>
</svg>