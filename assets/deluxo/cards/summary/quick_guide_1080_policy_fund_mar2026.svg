<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter></defs>
  <rect width="1080" height="1080" rx="32" fill="#F0F4FA"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFF" filter="url(#s)"/>
  <rect x="40" y="40" width="1000" height="100" rx="24" fill="#059669"/><rect x="40" y="95" width="1000" height="45" fill="#059669"/>
  <text x="540" y="103" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#FFF">내 상황에 맞는 정책자금은? 빠른 판단</text>

  <!-- Row 1 -->
  <rect x="70" y="170" width="470" height="175" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="90" y="205" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">매출이 급감했어요</text>
  <text x="90" y="238" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">연매출 1억4백만↓, 업력 7년↓, 매출 15%↓</text>
  <line x1="90" y1="258" x2="520" y2="258" stroke="#BFDBFE" stroke-width="1"/>
  <text x="90" y="290" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">→ 일시적경영애로자금</text>
  <text x="90" y="322" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">최대 7,000만원</text>

  <rect x="560" y="170" width="450" height="175" rx="16" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="580" y="205" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#7C3AED">폐업 후 재창업했어요</text>
  <text x="580" y="238" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">재창업 교육 수료, 폐업 이력</text>
  <line x1="580" y1="258" x2="990" y2="258" stroke="#DDD6FE" stroke-width="1"/>
  <text x="580" y="290" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">→ 재도전특별자금</text>
  <text x="580" y="322" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">최대 2억원 (도약형)</text>

  <!-- Row 2 -->
  <rect x="70" y="365" width="470" height="175" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="90" y="400" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#059669">수출·스마트 공장 도입 중</text>
  <text x="90" y="433" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">수출기업, 로컬크리에이터, 강한 소상공인</text>
  <line x1="90" y1="453" x2="520" y2="453" stroke="#BBF7D0" stroke-width="1"/>
  <text x="90" y="485" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">→ 혁신성장촉진자금</text>
  <text x="90" y="517" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">운전 2억 / 시설 10억</text>

  <rect x="560" y="365" width="450" height="175" rx="16" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="580" y="400" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#92400E">신용점수가 낮아요</text>
  <text x="580" y="433" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">NCB 839점 이하, 은행 심사 어려움</text>
  <line x1="580" y1="453" x2="990" y2="453" stroke="#FDE68A" stroke-width="1"/>
  <text x="580" y="485" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">→ 신용취약소상공인자금</text>
  <text x="580" y="517" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">최대 3,000만원 (3/9 재개)</text>

  <!-- Row 3 -->
  <rect x="70" y="560" width="305" height="175" rx="16" fill="#FEE2E2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="90" y="595" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#991B1B">숙련 기술 제조업</text>
  <text x="90" y="628" font-family="'Pretendard',sans-serif" font-size="16" fill="#6B7280">백년소공인·특화지원 선정</text>
  <line x1="90" y1="645" x2="355" y2="645" stroke="#FECACA" stroke-width="1"/>
  <text x="90" y="675" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#111827">→ 특화자금(유망)</text>
  <text x="90" y="710" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#DC2626">운전 2억/시설 10억</text>

  <rect x="395" y="560" width="305" height="175" rx="16" fill="#F1F5F9" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="415" y="595" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#374151">플랫폼 협업(TOPS)</text>
  <text x="415" y="628" font-family="'Pretendard',sans-serif" font-size="16" fill="#6B7280">온라인 사업 확장</text>
  <line x1="415" y1="645" x2="680" y2="645" stroke="#E5E7EB" stroke-width="1"/>
  <text x="415" y="675" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#111827">→ 상생성장지원금</text>
  <text x="415" y="710" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#DC2626">최대 2억원</text>

  <rect x="720" y="560" width="290" height="175" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="740" y="595" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#059669">민간 투자 받음</text>
  <text x="740" y="628" font-family="'Pretendard',sans-serif" font-size="16" fill="#6B7280">투자금 매칭 지원</text>
  <line x1="740" y1="645" x2="990" y2="645" stroke="#A7F3D0" stroke-width="1"/>
  <text x="740" y="675" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#111827">→ 민간투자연계형</text>
  <text x="740" y="710" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#DC2626">투자금 5배(최대 5억)</text>

  <!-- 접수일 안내 -->
  <rect x="70" y="770" width="940" height="85" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="540" y="805" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#DC2626">접수일을 놓치지 마세요!</text>
  <text x="540" y="838" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">3월 3일(화) 10시: 6개 자금 | 3월 9일(월): 신용취약자금 재개</text>

  <!-- 신청처 -->
  <rect x="70" y="880" width="940" height="65" rx="14" fill="#EFF6FF"/>
  <text x="540" y="920" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#1D4ED8">신청: ols.semas.or.kr | 전 프로그램 선착순 예산 소진</text>

  <!-- Footer -->
  <rect x="70" y="970" width="940" height="5" rx="2" fill="#059669"/>
</svg>
