<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter></defs>
  <rect width="1080" height="1080" rx="32" fill="#F0F4FA"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFF" filter="url(#s)"/>
  <rect x="40" y="40" width="1000" height="100" rx="24" fill="#1D4ED8"/><rect x="40" y="95" width="1000" height="45" fill="#1D4ED8"/>
  <text x="540" y="103" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#FFF">2026 3월 소상공인 정책자금 신청 일정 요약</text>

  <!-- 총액 -->
  <rect x="80" y="175" width="920" height="65" rx="14" fill="#EFF6FF"/>
  <text x="540" y="217" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#1D4ED8">2026년 정책자금 총 3조 3,620억원 | 3월 직접대출 7개 접수</text>

  <!-- 3/3 접수 -->
  <rect x="80" y="270" width="60" height="36" rx="18" fill="#DC2626"/>
  <text x="110" y="295" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">3/3</text>
  <text x="155" y="296" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#DC2626">오전 10시 — 직접대출 6개 동시 접수</text>
  <line x1="80" y1="315" x2="1000" y2="315" stroke="#E5E7EB" stroke-width="2"/>

  <text x="100" y="350" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">일시적경영애로자금</text>
  <text x="600" y="350" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">최대 7,000만원</text>
  <text x="820" y="350" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">매출 15%↓</text>

  <text x="100" y="388" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">재도전특별자금 (도약형)</text>
  <text x="600" y="388" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">최대 2억원</text>
  <text x="820" y="388" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">폐업후 재창업</text>

  <text x="100" y="426" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">혁신성장촉진자금</text>
  <text x="600" y="426" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#374151">운전 2억 / 시설 10억</text>
  <text x="820" y="426" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">4,800억</text>

  <text x="100" y="464" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">소상공인특화자금 (유망)</text>
  <text x="600" y="464" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#374151">운전 2억 / 시설 10억</text>
  <text x="820" y="464" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">2,000억</text>

  <text x="100" y="502" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">민간투자연계형매칭</text>
  <text x="600" y="502" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#374151">투자금 5배 (최대 5억)</text>
  <text x="820" y="502" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">360억</text>

  <text x="100" y="540" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">상생성장지원금</text>
  <text x="600" y="540" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#374151">최대 2억 (TOPS 참여)</text>
  <text x="820" y="540" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">760억</text>

  <!-- 3/9 접수 -->
  <rect x="80" y="580" width="60" height="36" rx="18" fill="#7C3AED"/>
  <text x="110" y="605" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">3/9</text>
  <text x="155" y="606" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#7C3AED">접수 재개</text>
  <line x1="80" y1="625" x2="1000" y2="625" stroke="#E5E7EB" stroke-width="2"/>

  <text x="100" y="660" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">신용취약소상공인자금</text>
  <text x="600" y="660" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#DC2626">최대 3,000만원</text>
  <text x="820" y="660" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">NCB 839점↓</text>

  <!-- 대리대출 -->
  <rect x="80" y="700" width="920" height="55" rx="12" fill="#F1F5F9"/>
  <text x="540" y="735" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#6B7280">대리대출(일반경영안정·청년고용연계·긴급경영안정): 2월 마감 → 4/6 재개 예정</text>

  <!-- 지자체 -->
  <text x="100" y="800" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#059669">지자체 특별경영자금</text>
  <line x1="80" y1="820" x2="1000" y2="820" stroke="#E5E7EB" stroke-width="2"/>
  <text x="100" y="855" font-family="'Pretendard',sans-serif" font-size="22" fill="#111827">강원도 경영안정자금 1차</text>
  <text x="600" y="855" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#374151">1,500억원 / 최대 5천만원</text>
  <text x="100" y="885" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">2026.02.09~ 예산 소진 시까지 | 보증드림 앱 또는 은행 창구</text>

  <!-- 신청처 -->
  <rect x="80" y="920" width="920" height="60" rx="14" fill="#EFF6FF"/>
  <text x="540" y="958" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">신청: 소진공 정책자금 포털 ols.semas.or.kr | 선착순 예산 소진</text>

  <!-- Footer -->
  <rect x="80" y="995" width="920" height="5" rx="2" fill="#1D4ED8"/>
</svg>
