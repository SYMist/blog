<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="108" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#F59E0B" text-anchor="middle">나는 어디? 자금 선택 10초 판단</text>
  <text x="540" y="164" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#EAF2FF" text-anchor="middle">경영안정자금 vs 밸류업 특별보증</text>

  <!-- Table Header Row (y=200, h=120) -->
  <rect x="60" y="200" width="200" height="120" rx="0" fill="#1A3270"/>
  <text x="160" y="268" font-family="'Pretendard', sans-serif" font-size="22" font-weight="800" fill="#EAF2FF" text-anchor="middle">구분</text>

  <rect x="268" y="200" width="362" height="120" rx="0" fill="#1D4ED8"/>
  <text x="449" y="268" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">경영안정자금</text>

  <rect x="638" y="200" width="382" height="120" rx="0" fill="#F59E0B"/>
  <text x="829" y="268" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#0B1F3B" text-anchor="middle">밸류업 특별보증</text>

  <!-- Row: 성격 (y=328, h=130) -->
  <rect x="60" y="328" width="200" height="130" rx="0" fill="#162C5A"/>
  <text x="160" y="402" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#EAF2FF" text-anchor="middle">성격</text>

  <rect x="268" y="328" width="362" height="130" rx="0" fill="#0F2247"/>
  <text x="449" y="386" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">저금리 운전·</text>
  <text x="449" y="422" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">경영 안정 자금</text>

  <rect x="638" y="328" width="382" height="130" rx="0" fill="#0F2247"/>
  <text x="829" y="386" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">성장 단계별</text>
  <text x="829" y="422" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">맞춤형 보증</text>

  <!-- Row: 한도 (y=466, h=130) -->
  <rect x="60" y="466" width="200" height="130" rx="0" fill="#162C5A"/>
  <text x="160" y="540" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#EAF2FF" text-anchor="middle">한도</text>

  <rect x="268" y="466" width="362" height="130" rx="0" fill="#1A3270"/>
  <text x="449" y="542" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">최대 5,000만원</text>

  <rect x="638" y="466" width="382" height="130" rx="0" fill="#1A3270"/>
  <text x="829" y="514" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle">창업기 1억</text>
  <text x="829" y="550" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle">도약기 1.5억</text>
  <text x="829" y="586" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle">성장기 2억</text>

  <!-- Row: 금리/보증 (y=604, h=150) -->
  <rect x="60" y="604" width="200" height="150" rx="0" fill="#162C5A"/>
  <text x="160" y="685" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#EAF2FF" text-anchor="middle">금리/보증</text>

  <rect x="268" y="604" width="362" height="150" rx="0" fill="#0F2247"/>
  <text x="449" y="658" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">첫 1년 2.0% 지원</text>
  <text x="449" y="694" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">이후 2년 1.5% 지원</text>
  <text x="449" y="730" font-family="'Pretendard', sans-serif" font-size="17" font-weight="600" fill="#A0B4D0" text-anchor="middle">+보증료 0.8%</text>

  <rect x="638" y="604" width="382" height="150" rx="0" fill="#0F2247"/>
  <text x="829" y="658" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">보증 제공</text>
  <text x="829" y="694" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" text-anchor="middle">금리는 협약 은행 적용</text>

  <!-- Row: 이런 분께 (y=762, h=130) -->
  <rect x="60" y="762" width="200" height="130" rx="0" fill="#162C5A"/>
  <text x="160" y="830" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#EAF2FF" text-anchor="middle">이런 분께</text>

  <rect x="268" y="762" width="362" height="130" rx="0" fill="#1A3270"/>
  <text x="449" y="820" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">지금 당장 운전자금이</text>
  <text x="449" y="856" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">급한 분</text>

  <rect x="638" y="762" width="382" height="130" rx="0" fill="#1A3270"/>
  <text x="829" y="820" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">사업 확장·투자 계획이</text>
  <text x="829" y="856" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">있는 분</text>

  <!-- Bottom bar -->
  <rect x="60" y="926" width="960" height="110" rx="20" fill="#F59E0B"/>
  <text x="540" y="972" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#0B1F3B" text-anchor="middle">동시 신청 가능 — 인천신보 1577-3790에서 통합 상담</text>
  <text x="540" y="1018" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#0B1F3B" text-anchor="middle">한도 여유 있으면 두 가지 모두 신청하세요</text>
</svg>
