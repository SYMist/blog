  <!-- Title -->
  <text x="60" y="150" font-family="'Pretendard', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">업종별 카드 조합 추천</text>

  <!-- Divider -->
  <line x1="60" y1="178" x2="1020" y2="178" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Comparison Box 1: 온라인 쇼핑몰 -->
  <rect x="60" y="220" width="960" height="230" rx="20" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="60" y="220" width="960" height="60" rx="20" fill="#F59E0B" fill-opacity="0.15"/>
  <rect x="60" y="250" width="960" height="30" fill="#F59E0B" fill-opacity="0.15"/>
  <text x="100" y="260" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#F59E0B">온라인 쇼핑몰</text>

  <rect x="100" y="305" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>
  <text x="120" y="340" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#F59E0B">메인</text>
  <text x="120" y="375" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Npay biz</text>

  <text x="530" y="365" font-family="'Pretendard', sans-serif" font-size="30" font-weight="700" fill="#F59E0B">+</text>

  <rect x="570" y="305" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  <text x="590" y="340" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" fill-opacity="0.6">서브</text>
  <text x="590" y="375" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">LOCA LIKIT</text>

  <!-- Comparison Box 2: 오프라인 매장 -->
  <rect x="60" y="480" width="960" height="230" rx="20" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="60" y="480" width="960" height="60" rx="20" fill="#F59E0B" fill-opacity="0.15"/>
  <rect x="60" y="510" width="960" height="30" fill="#F59E0B" fill-opacity="0.15"/>
  <text x="100" y="520" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#F59E0B">오프라인 매장</text>

  <rect x="100" y="565" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>
  <text x="120" y="600" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#F59E0B">메인</text>
  <text x="120" y="635" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">KB 비즈</text>

  <text x="530" y="625" font-family="'Pretendard', sans-serif" font-size="30" font-weight="700" fill="#F59E0B">+</text>

  <rect x="570" y="565" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  <text x="590" y="600" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" fill-opacity="0.6">배달</text>
  <text x="590" y="635" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">현대 D</text>

  <!-- Comparison Box 3: 중규모 사업장 -->
  <rect x="60" y="740" width="960" height="230" rx="20" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="60" y="740" width="960" height="60" rx="20" fill="#F59E0B" fill-opacity="0.15"/>
  <rect x="60" y="770" width="960" height="30" fill="#F59E0B" fill-opacity="0.15"/>
  <text x="100" y="780" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#F59E0B">중규모 사업장</text>

  <rect x="100" y="825" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>
  <text x="120" y="860" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#F59E0B">고정비</text>
  <text x="120" y="895" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">삼성 BIZ iD</text>

  <text x="530" y="885" font-family="'Pretendard', sans-serif" font-size="30" font-weight="700" fill="#F59E0B">+</text>

  <rect x="570" y="825" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  <text x="590" y="860" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" fill-opacity="0.6">매입</text>
  <text x="590" y="895" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">LOCA LIKIT</text>

  <!-- Chips -->
  <rect x="60" y="1000" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="108" y="1028" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">메인</text>

  <rect x="176" y="1000" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="224" y="1028" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">서브</text>

  <rect x="292" y="1000" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="340" y="1028" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">조합</text>
