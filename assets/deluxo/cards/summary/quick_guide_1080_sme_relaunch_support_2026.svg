  <text x="870" y="206" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">재도전특별자금 (중진공)</text>
  <line x1="740" y1="222" x2="1000" y2="222" stroke="#1A3270" stroke-width="1"/>

  <text x="870" y="252" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">핵심 성격</text>
  <text x="870" y="274" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">저금리 창업 자금</text>

