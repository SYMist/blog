  <text x="870" y="504" font-family="-apple-system, sans-serif" font-size="12" fill="#A0B4D0" text-anchor="middle">(원리금 상환 필요)</text>

  <text x="870" y="538" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">선택 기준</text>
  <text x="870" y="564" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">창업 후 자금 추가로</text>
  <text x="870" y="584" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">필요하다면</text>

  <rect x="750" y="660" width="240" height="60" rx="10" fill="#EF4444"/>
  <text x="870" y="696" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">kosmes.or.kr</text>

  <!-- Bottom note -->
  <rect x="60" y="764" width="960" height="70" rx="12" fill="#1A3270"/>
  <text x="540" y="794" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle">재기사업화 + 재도전특별자금 병행 가능 (주관 기관 다름)</text>
  <text x="540" y="820" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">재기사업화와 특화취업지원은 원칙상 중복 신청 어려움 — 재창업 or 취업 중 선택</text>

  <!-- Footer -->
  <text x="540" y="974" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 소상공인24 sbiz24.kr | 중진공 kosmes.or.kr | 콜센터 1357 / 1533-0100</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
