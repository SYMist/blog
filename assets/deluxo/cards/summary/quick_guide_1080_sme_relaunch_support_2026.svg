  <text x="540" y="504" font-family="-apple-system, sans-serif" font-size="12" fill="#A0B4D0" text-anchor="middle">(교육 무료 + 수당 지급)</text>

  <text x="540" y="538" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">선택 기준</text>
  <text x="540" y="564" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">직장으로 돌아가고 싶다면</text>
