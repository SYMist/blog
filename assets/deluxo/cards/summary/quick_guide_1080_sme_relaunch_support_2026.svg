  <text x="540" y="696" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#0B1F3B" text-anchor="middle">sbiz24.kr 신청</text>

  <!-- Col 3: 재도전 자금 -->
  <rect x="720" y="140" width="300" height="600" rx="14" fill="#0D2347"/>
