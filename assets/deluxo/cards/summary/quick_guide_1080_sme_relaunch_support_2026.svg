  <line x1="80" y1="222" x2="340" y2="222" stroke="#1A3270" stroke-width="1"/>

  <text x="210" y="252" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">핵심 성격</text>
  <text x="210" y="274" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">새 사업 시작 지원</text>

  <text x="210" y="308" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">주요 대상</text>
  <text x="210" y="330" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">재창업 예정자</text>
