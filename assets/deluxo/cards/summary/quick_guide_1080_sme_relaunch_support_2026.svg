  <text x="870" y="330" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">재창업 후 자금 부족자</text>
  <text x="870" y="350" font-family="-apple-system, sans-serif" font-size="12" fill="#A0B4D0" text-anchor="middle">(폐업 후 5년 이내)</text>

  <text x="870" y="384" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">받는 지원</text>
  <text x="870" y="406" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="middle">최대 7,000만원</text>
  <text x="870" y="428" font-family="-apple-system, sans-serif" font-size="12" fill="#A0B4D0" text-anchor="middle">대출 (금리 약 3% 내외)</text>

  <text x="870" y="462" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">조건</text>
