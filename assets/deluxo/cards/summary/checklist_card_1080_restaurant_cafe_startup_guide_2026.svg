<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1080" height="8" fill="#34D399"/>

  <!-- Title -->
  <text x="540" y="68" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">음식점·카페 창업 전 1분 체크리스트</text>
  <text x="540" y="102" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">인허가 + 자금 신청 — 놓치면 개업이 늦어지는 6가지</text>

  <!-- Divider -->
  <line x1="60" y1="122" x2="1020" y2="122" stroke="#1A3270" stroke-width="2"/>

  <!-- Step 1 -->
  <rect x="60" y="140" width="960" height="128" rx="14" fill="#0D2347"/>
  <rect x="60" y="140" width="8" height="128" rx="4" fill="#34D399"/>
  <text x="116" y="192" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399">1</text>
  <text x="176" y="184" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">업종 선택 확인</text>
  <text x="176" y="212" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">주류 판매 여부 → 카페(휴게음식점) or 일반음식점 구분</text>
  <text x="176" y="238" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">맥주 판매 예정이면 처음부터 일반음식점으로 신고</text>

  <!-- Step 2 -->
  <rect x="60" y="280" width="960" height="128" rx="14" fill="#0D2347"/>
  <rect x="60" y="280" width="8" height="128" rx="4" fill="#34D399"/>
  <text x="116" y="332" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399">2</text>
  <text x="176" y="324" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">식품위생교육 이수 완료</text>
  <text x="176" y="352" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">신규: 6~8시간 (식품안전나라 온라인 가능, 당일 이수)</text>
  <text x="176" y="378" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399">영업신고 전 이수 시 개업 일정 1~2주 단축 가능</text>

  <!-- Step 3 -->
  <rect x="60" y="420" width="960" height="128" rx="14" fill="#0D2347"/>
  <rect x="60" y="420" width="8" height="128" rx="4" fill="#F59E0B"/>
  <text x="116" y="472" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#F59E0B">3</text>
  <text x="176" y="464" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">영업신고 서류 준비</text>
  <text x="176" y="492" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">신고서 + 이수증 + 신분증 + 평면도 + 임대차계약서</text>
  <text x="176" y="518" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B">지하수 사용 시 수질검사성적서, 공유주방은 계약서 추가</text>

  <!-- Step 4 -->
  <rect x="60" y="560" width="960" height="128" rx="14" fill="#0D2347"/>
  <rect x="60" y="560" width="8" height="128" rx="4" fill="#F59E0B"/>
  <text x="116" y="612" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#F59E0B">4</text>
  <text x="176" y="604" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">소상공인 정책자금 자격 확인</text>
  <text x="176" y="632" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">상시근로자 5인 미만 + 연매출 10억원 이하 + 제외 업종 아님</text>
  <text x="176" y="658" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B">한도 최대 7,000만원, 금리 연 3.36~3.56% (2026년 기준)</text>

  <!-- Step 5 -->
  <rect x="60" y="700" width="960" height="128" rx="14" fill="#0D2347"/>
  <rect x="60" y="700" width="8" height="128" rx="4" fill="#EF4444"/>
  <text x="116" y="752" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#EF4444">5</text>
  <text x="176" y="744" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">사업계획서 작성</text>
  <text x="176" y="772" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">인건비·임차료·원재료비 등 항목별 금액 구체적으로 기재</text>
  <text x="176" y="798" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444">'운영자금' 단어 하나로 쓰면 심사 탈락 위험</text>

  <!-- Step 6 -->
  <rect x="60" y="840" width="960" height="128" rx="14" fill="#1A3270"/>
  <rect x="60" y="840" width="8" height="128" rx="4" fill="#EF4444"/>
  <text x="116" y="892" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#EF4444">6</text>
  <text x="176" y="884" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">개업 후 즉시 정책자금 신청</text>
  <text x="176" y="912" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">예산 선착순 소진 — 개업 직후 ols.semas.or.kr에서 바로 신청</text>
  <text x="176" y="938" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444">비수도권 사업자: 금리 0.2%p 추가 우대 신청 잊지 말 것</text>

  <!-- Bottom note -->
  <text x="540" y="1022" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 소상공인통합콜센터 ☎1533-0100 | 신청 전 공식 공고 확인 필수</text>

  <!-- Bottom bar -->
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
</svg>
