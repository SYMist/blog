<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1080" height="8" fill="#34D399"/>

  <!-- Title -->
  <text x="540" y="68" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">정책자금 vs 시중은행 — 이자 비교</text>
  <text x="540" y="100" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">5,000만원 창업자금 기준 | 2026년 소상공인 정책자금</text>

  <!-- Divider -->
  <line x1="60" y1="120" x2="1020" y2="120" stroke="#1A3270" stroke-width="2"/>

  <!-- Left: 정책자금 -->
  <rect x="60" y="140" width="430" height="340" rx="16" fill="#0D2347"/>
  <rect x="60" y="140" width="430" height="340" rx="16" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="275" y="186" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#34D399" text-anchor="middle">소상공인 정책자금</text>
  <text x="275" y="240" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#34D399" text-anchor="middle">연 3.5%</text>
  <text x="275" y="278" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">5,000만원 × 3.5% ÷ 12</text>
  <line x1="100" y1="298" x2="450" y2="298" stroke="#1A3270" stroke-width="1"/>
  <text x="275" y="328" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">월 이자</text>
  <text x="275" y="368" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">약 14만6천원</text>
  <text x="275" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">ols.semas.or.kr 신청</text>
  <text x="275" y="424" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">무담보·무보증 가능</text>
  <text x="275" y="446" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">개업 직후 신청 가능</text>

  <!-- VS -->
  <text x="540" y="330" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#EF4444" text-anchor="middle">VS</text>

  <!-- Right: 시중은행 -->
  <rect x="590" y="140" width="430" height="340" rx="16" fill="#1A2030"/>
  <text x="805" y="186" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#A0B4D0" text-anchor="middle">시중은행 신용대출</text>
  <text x="805" y="240" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#EF4444" text-anchor="middle">연 7%</text>
  <text x="805" y="278" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">5,000만원 × 7% ÷ 12</text>
  <line x1="630" y1="298" x2="980" y2="298" stroke="#1A3270" stroke-width="1"/>
  <text x="805" y="328" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">월 이자</text>
  <text x="805" y="368" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">약 29만2천원</text>
  <text x="805" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">은행 창구/앱 신청</text>
  <text x="805" y="424" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">담보·보증 요구 가능</text>
  <text x="805" y="446" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">업력 요건 있을 수 있음</text>

  <!-- Savings highlight -->
  <rect x="60" y="502" width="960" height="130" rx="14" fill="#1A3270"/>
  <rect x="60" y="502" width="960" height="130" rx="14" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="540" y="548" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#F59E0B" text-anchor="middle">정책자금 이용 시 3년간 절감 이자</text>
  <text x="540" y="598" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#34D399" text-anchor="middle">약 522만원</text>
  <text x="540" y="626" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">(월 14만6천 vs 29만2천 × 36개월 기준)</text>

  <!-- Soyo time table -->
  <text x="60" y="680" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">개업부터 자금 실행까지 실제 소요기간</text>

  <rect x="60" y="698" width="960" height="40" rx="8" fill="#1A3270"/>
  <text x="200" y="724" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle">단계</text>
  <text x="540" y="724" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle">소요 일수</text>
  <text x="870" y="724" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle">비고</text>

  <rect x="60" y="738" width="960" height="36" rx="0" fill="#0D2347"/>
  <text x="200" y="762" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">식품위생교육 이수</text>
  <text x="540" y="762" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">1~3일</text>
  <text x="870" y="762" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">온라인 당일 가능</text>

  <rect x="60" y="774" width="960" height="36" rx="0" fill="#0B1F3B"/>
  <text x="200" y="798" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">영업신고 처리</text>
  <text x="540" y="798" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">3~5일</text>
  <text x="870" y="798" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">구청 혼잡 시 +2일</text>

  <rect x="60" y="810" width="960" height="36" rx="0" fill="#0D2347"/>
  <text x="200" y="834" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">사업자등록</text>
  <text x="540" y="834" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">1~3일</text>
  <text x="870" y="834" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">홈택스 당일 처리 가능</text>

  <rect x="60" y="846" width="960" height="36" rx="0" fill="#0B1F3B"/>
  <text x="200" y="870" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">정책자금 심사·실행</text>
  <text x="540" y="870" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">14~30일</text>
  <text x="870" y="870" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">서류 완비 기준</text>

  <rect x="60" y="882" width="960" height="36" rx="8" fill="#1A3270"/>
  <text x="200" y="906" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">합계</text>
  <text x="540" y="906" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">약 4~7주</text>
  <text x="870" y="906" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">사전교육 선행 시 단축 가능</text>

  <!-- Bottom note -->
  <text x="540" y="968" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 금리·한도 분기별 변동 | 소상공인통합콜센터 ☎1533-0100</text>

  <!-- Bottom bar -->
  <rect x="0" y="1072" width="1080" height="8" fill="#34D399"/>
</svg>
