<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">내 상황에 맞는 정책자금 빠른 판단</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 7가지 상황 -->
  <rect x="60" y="140" width="960" height="110" rx="16" fill="rgba(34,197,94,0.12)"/>
  <text x="80" y="185" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#22C55E">업종 무관, 운영자금 필요</text>
  <text x="700" y="175" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">일반경영안정</text>
  <text x="700" y="205" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">7,000만원 | 4/6 접수</text>
  <text x="80" y="235" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">소상공인이면 OK, 업력 제한 없음</text>

  <rect x="60" y="265" width="960" height="110" rx="16" fill="rgba(59,130,246,0.12)"/>
  <text x="80" y="310" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#60A5FA">청년 직원을 고용 중</text>
  <text x="700" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">청년고용연계</text>
  <text x="700" y="330" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">7,000만원 | 4/6 접수</text>
  <text x="80" y="360" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">만 15~34세 청년 고용보험 가입 증빙 필요</text>

  <rect x="60" y="390" width="960" height="110" rx="16" fill="rgba(168,85,247,0.12)"/>
  <text x="80" y="435" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#A855F7">장애인 대표/주요 주주</text>
  <text x="700" y="425" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">장애인기업</text>
  <text x="700" y="455" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">1억원 | 4/6 접수</text>
  <text x="80" y="485" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">장애인 등록증 필요, 7년 장기상환</text>

  <rect x="60" y="515" width="960" height="110" rx="16" fill="rgba(239,68,68,0.12)"/>
  <text x="80" y="560" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#EF4444">매출 15%↓ 경영위기</text>
  <text x="700" y="550" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">긴급경영안정(일시적)</text>
  <text x="700" y="580" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">1분기 마감 — 재공고 확인</text>
  <text x="80" y="610" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">2026년 매출 감소 기준 15%로 상향</text>

  <rect x="60" y="640" width="960" height="110" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="80" y="685" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">재해 피해 소상공인</text>
  <text x="700" y="675" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">긴급경영안정(재해)</text>
  <text x="700" y="705" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">1억원 | 수시 공고</text>
  <text x="80" y="735" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">특별재난지역 금리 1.5% 고정</text>

  <rect x="60" y="765" width="960" height="110" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="80" y="810" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">제조업 소공인(10인 미만)</text>
  <text x="700" y="800" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">소공인특화</text>
  <text x="700" y="830" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">1분기 마감 — 재공고 확인</text>
  <text x="80" y="860" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">시설자금 최대 5억원, 운전자금 1억원</text>

  <rect x="60" y="890" width="960" height="110" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="80" y="935" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">기존 정책자금 금리 인하</text>
  <text x="700" y="925" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">대환대출</text>
  <text x="700" y="955" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">1분기 마감 — 재공고 확인</text>
  <text x="80" y="985" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">5,000만원, 10년 장기분할상환</text>

  <rect x="60" y="1030" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
