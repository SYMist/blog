<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="50" width="110" height="48" rx="24" fill="#F59E0B"/>
  <text x="115" y="82" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">주의</text>

  <!-- Title -->
  <text x="60" y="155" font-family="Pretendard, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">탈락 사유 TOP 5</text>

  <!-- Chips -->
  <rect x="60" y="180" width="85" height="40" rx="32" fill="#E8F0FF"/>
  <text x="102" y="207" font-family="Pretendard, sans-serif" font-size="18" font-weight="600" fill="#1D4ED8" text-anchor="middle">탈락</text>
  <rect x="158" y="180" width="85" height="40" rx="32" fill="#E8F0FF"/>
  <text x="200" y="207" font-family="Pretendard, sans-serif" font-size="18" font-weight="600" fill="#1D4ED8" text-anchor="middle">사유</text>
  <rect x="256" y="180" width="85" height="40" rx="32" fill="#E8F0FF"/>
  <text x="298" y="207" font-family="Pretendard, sans-serif" font-size="18" font-weight="600" fill="#1D4ED8" text-anchor="middle">확인</text>

  <!-- Divider -->
  <line x1="60" y1="250" x2="1020" y2="250" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Item 1 -->
  <rect x="60" y="290" width="960" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="320" width="60" height="60" rx="30" fill="#F59E0B"/>
  <text x="120" y="360" font-family="Pretendard, sans-serif" font-size="30" font-weight="800" fill="#0B1F3B" text-anchor="middle">1</text>
  <text x="180" y="345" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">사업장 소재지 관할 불일치</text>
  <text x="180" y="380" font-family="Pretendard, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.5">대전 사업장인데 충남에 신청하는 등 관할 오류</text>

  <!-- Item 2 -->
  <rect x="60" y="430" width="960" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="460" width="60" height="60" rx="30" fill="#F59E0B"/>
  <text x="120" y="500" font-family="Pretendard, sans-serif" font-size="30" font-weight="800" fill="#0B1F3B" text-anchor="middle">2</text>
  <text x="180" y="485" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">기존 정책자금 연체 이력</text>
  <text x="180" y="520" font-family="Pretendard, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.5">과거 정책자금 대출 연체 기록이 있는 경우</text>

  <!-- Item 3 -->
  <rect x="60" y="570" width="960" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="600" width="60" height="60" rx="30" fill="#F59E0B"/>
  <text x="120" y="640" font-family="Pretendard, sans-serif" font-size="30" font-weight="800" fill="#0B1F3B" text-anchor="middle">3</text>
  <text x="180" y="625" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">소상공인 확인서 미발급 . 매출 초과</text>
  <text x="180" y="660" font-family="Pretendard, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.5">소상공인 기준 매출액 초과 시 확인서 발급 불가</text>

  <!-- Item 4 -->
  <rect x="60" y="710" width="960" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="740" width="60" height="60" rx="30" fill="#F59E0B"/>
  <text x="120" y="780" font-family="Pretendard, sans-serif" font-size="30" font-weight="800" fill="#0B1F3B" text-anchor="middle">4</text>
  <text x="180" y="765" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">보증드림 정보동의 미완료</text>
  <text x="180" y="800" font-family="Pretendard, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.5">앱 설치 후 정보제공 동의 절차를 누락한 경우</text>

  <!-- Item 5 -->
  <rect x="60" y="850" width="960" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="90" y="880" width="60" height="60" rx="30" fill="#F59E0B"/>
  <text x="120" y="920" font-family="Pretendard, sans-serif" font-size="30" font-weight="800" fill="#0B1F3B" text-anchor="middle">5</text>
  <text x="180" y="905" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">분기별 예산 소진 후 접수</text>
  <text x="180" y="940" font-family="Pretendard, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.5">예산 소진 시 접수 자체가 마감되므로 일정 확인 필수</text>

  <!-- Footer -->
  <text x="1020" y="1050" font-family="Pretendard, sans-serif" font-size="16" fill="#FFFFFF" fill-opacity="0.35" text-anchor="end">tistory.deluxo | 2026</text>
</svg>