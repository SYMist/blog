<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">내 상황에 맞는 채무조정은?</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="140" width="960" height="120" rx="16" fill="rgba(59,130,246,0.12)"/>
  <text x="100" y="185" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#3B82F6">소득이 있고 이자만 줄이면 갚을 수 있다</text>
  <text x="100" y="228" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 신용회복위원회 워크아웃 · 이자 감면+기간 연장</text>

  <rect x="60" y="270" width="960" height="120" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="315" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#3B82F6">아직 연체 전이지만 곧 못 갚을 것 같다</text>
  <text x="100" y="358" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 프리워크아웃 · 이자율 5~8%·최장 10년 연장</text>

  <rect x="60" y="400" width="960" height="120" rx="16" fill="rgba(16,185,129,0.12)"/>
  <text x="100" y="445" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#10B981">소득은 있지만 원금을 대폭 줄여야 한다</text>
  <text x="100" y="488" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 개인회생 · 원금 최대 90% 감면 · 3~5년 변제</text>

  <rect x="60" y="530" width="960" height="120" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="575" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#10B981">사업자·프리랜서인데 빚이 감당 안 된다</text>
  <text x="100" y="618" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 영업소득자 개인회생 · 5년 변제계획</text>

  <rect x="60" y="660" width="960" height="120" rx="16" fill="rgba(239,68,68,0.12)"/>
  <text x="100" y="705" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#EF4444">소득도 재산도 없어 상환 불가능</text>
  <text x="100" y="748" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 개인파산·면책 · 채무 전액 면책 (비면책 채권 제외)</text>

  <rect x="60" y="790" width="960" height="120" rx="16" fill="rgba(245,158,11,0.12)"/>
  <text x="100" y="835" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#F59E0B">어떤 제도가 맞는지 모르겠다</text>
  <text x="100" y="878" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 신용회복위원회 1600-5500 무료 상담 먼저!</text>

  <rect x="60" y="940" width="960" height="95" rx="16" fill="rgba(59,130,246,0.15)"/>
  <text x="100" y="985" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#3B82F6">무료 법률 상담</text>
  <text x="100" y="1018" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">대한법률구조공단 132 · 법률홈닥터 (대한변협)</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>