<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter></defs>
  <rect width="1080" height="1080" rx="32" fill="#F0F4FA"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFF" filter="url(#s)"/>
  <rect x="40" y="40" width="1000" height="100" rx="24" fill="#059669"/><rect x="40" y="95" width="1000" height="45" fill="#059669"/>
  <text x="540" y="103" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="38" font-weight="800" fill="#FFF">나는 어디? 폐업정리 vs 취업전환 vs 재창업</text>

  <!-- 3 columns -->
  <!-- Column 1: 폐업정리 -->
  <rect x="70" y="175" width="300" height="820" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="70" y="175" width="300" height="70" rx="16" fill="#1D4ED8"/>
  <rect x="70" y="220" width="300" height="25" fill="#1D4ED8"/>
  <text x="220" y="220" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="800" fill="#FFF">폐업 정리</text>

  <text x="220" y="290" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">사업 접고 정리할 때</text>
  <line x1="100" y1="310" x2="340" y2="310" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="100" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">점포철거비</text>
  <text x="100" y="375" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#DC2626">최대 600만원</text>
  <text x="100" y="410" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">평당 20만원 한도</text>
  <line x1="100" y1="435" x2="340" y2="435" stroke="#BFDBFE" stroke-width="1"/>
  <text x="100" y="468" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">컨설팅 3분야 무료</text>
  <text x="100" y="498" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">세무/부동산/재기전략</text>
  <text x="100" y="525" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">심리/직무·직능</text>
  <line x1="100" y1="550" x2="340" y2="550" stroke="#BFDBFE" stroke-width="1"/>
  <text x="100" y="583" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">법률자문·채무조정</text>
  <text x="100" y="613" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">파산·회생 상담 포함</text>
  <line x1="100" y1="645" x2="340" y2="645" stroke="#BFDBFE" stroke-width="1"/>
  <text x="100" y="680" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">신청처</text>
  <text x="100" y="710" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">소상공인24</text>
  <text x="100" y="738" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">sbiz24.kr</text>
  <line x1="100" y1="765" x2="340" y2="765" stroke="#BFDBFE" stroke-width="1"/>
  <text x="220" y="810" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">폐업 예정·기폐업</text>
  <text x="220" y="840" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">소상공인 대상</text>

  <!-- Column 2: 취업전환 -->
  <rect x="390" y="175" width="300" height="820" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="390" y="175" width="300" height="70" rx="16" fill="#059669"/>
  <rect x="390" y="220" width="300" height="25" fill="#059669"/>
  <text x="540" y="220" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="800" fill="#FFF">취업 전환</text>

  <text x="540" y="290" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#059669">다시 취업할 때</text>
  <line x1="420" y1="310" x2="660" y2="310" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="420" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">직무교육·일경험</text>
  <text x="420" y="375" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#059669">현장 중심 교육</text>
  <text x="420" y="410" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">다양한 일자리 연계</text>
  <line x1="420" y1="435" x2="660" y2="435" stroke="#BBF7D0" stroke-width="1"/>
  <text x="420" y="468" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">전직장려수당</text>
  <text x="420" y="498" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#DC2626">최대 100만원</text>
  <text x="420" y="528" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">수료 60만 + 근속 40만</text>
  <line x1="420" y1="560" x2="660" y2="560" stroke="#BBF7D0" stroke-width="1"/>
  <text x="420" y="595" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">다른 프로그램 병행</text>
  <text x="420" y="625" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">컨설팅·채무조정 동시 가능</text>
  <line x1="420" y1="655" x2="660" y2="655" stroke="#BBF7D0" stroke-width="1"/>
  <text x="420" y="690" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#059669">신청처</text>
  <text x="420" y="720" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">희망리턴패키지</text>
  <text x="420" y="748" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">hope.sbiz.or.kr</text>
  <line x1="420" y1="775" x2="660" y2="775" stroke="#BBF7D0" stroke-width="1"/>
  <text x="540" y="820" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#059669">만 15~69세</text>
  <text x="540" y="850" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#059669">폐업(예정) 소상공인</text>

  <!-- Column 3: 재창업 -->
  <rect x="710" y="175" width="300" height="820" rx="16" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="710" y="175" width="300" height="70" rx="16" fill="#7C3AED"/>
  <rect x="710" y="220" width="300" height="25" fill="#7C3AED"/>
  <text x="860" y="220" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="800" fill="#FFF">재창업</text>

  <text x="860" y="290" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#7C3AED">다시 사업할 때</text>
  <line x1="740" y1="310" x2="980" y2="310" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="740" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">전문가 경영 진단</text>
  <text x="740" y="375" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#7C3AED">맞춤형 전략 수립</text>
  <text x="740" y="410" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">사전교육+심화교육+멘토링</text>
  <line x1="740" y1="435" x2="980" y2="435" stroke="#DDD6FE" stroke-width="1"/>
  <text x="740" y="468" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">사업화자금</text>
  <text x="740" y="498" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#DC2626">최대 2,000만원</text>
  <text x="740" y="528" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">정부:자부담 2:1 매칭</text>
  <line x1="740" y1="560" x2="980" y2="560" stroke="#DDD6FE" stroke-width="1"/>
  <text x="740" y="595" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">자부담 조건</text>
  <text x="740" y="625" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">현금 30% 이상 필수</text>
  <line x1="740" y1="655" x2="980" y2="655" stroke="#DDD6FE" stroke-width="1"/>
  <text x="740" y="690" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#7C3AED">신청처</text>
  <text x="740" y="720" font-family="'Pretendard',sans-serif" font-size="20" fill="#111827">희망리턴패키지</text>
  <text x="740" y="748" font-family="'Pretendard',sans-serif" font-size="18" fill="#6B7280">hope.sbiz.or.kr</text>
  <line x1="740" y1="775" x2="980" y2="775" stroke="#DDD6FE" stroke-width="1"/>
  <text x="860" y="820" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#7C3AED">매출 10%↓ 경영위기</text>
  <text x="860" y="850" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#7C3AED">or 폐업후 재창업자</text>

  <!-- Footer -->
  <rect x="70" y="1010" width="940" height="5" rx="2" fill="#059669"/>
</svg>
