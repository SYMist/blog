<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="940" height="940" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Header -->
  <text x="120" y="170" font-size="46" fill="#111827" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif">조부모 돌봄수당 요약표</text>
  <text x="120" y="230" font-size="28" fill="#6B7280" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif">중복수급 · 아이돌봄 비교</text>

  <!-- Divider -->
  <line x1="120" y1="270" x2="960" y2="270" stroke="#E5E7EB"/>

  <!-- Rows -->
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <text x="120" y="340" font-size="30" fill="#111827" font-weight="700">대상</text>
    <text x="260" y="340" font-size="28" fill="#374151">양육 공백 가정 + 조부모/친인척 돌봄</text>

    <line x1="120" y1="380" x2="960" y2="380" stroke="#F1F5F9"/>

    <text x="120" y="440" font-size="30" fill="#111827" font-weight="700">지원</text>
    <text x="260" y="440" font-size="28" fill="#374151">현금성 돌봄비(지자체별 금액 상이)</text>

    <line x1="120" y1="480" x2="960" y2="480" stroke="#F1F5F9"/>

    <text x="120" y="540" font-size="30" fill="#111827" font-weight="700">중복 가능</text>
    <text x="260" y="540" font-size="28" fill="#374151">부모급여 · 양육수당 (사례 다수)</text>

    <line x1="120" y1="580" x2="960" y2="580" stroke="#F1F5F9"/>

    <text x="120" y="640" font-size="30" fill="#111827" font-weight="700">중복 제한</text>
    <text x="260" y="640" font-size="28" fill="#374151">아이돌봄서비스 · 어린이집 종일 이용</text>

    <line x1="120" y1="680" x2="960" y2="680" stroke="#F1F5F9"/>

    <text x="120" y="740" font-size="30" fill="#111827" font-weight="700">확인</text>
    <text x="260" y="740" font-size="28" fill="#374151">거주지 지자체 공고 기준</text>
  </g>

  <!-- Footer Note -->
  <rect x="120" y="860" width="840" height="90" rx="12" fill="#F1F5F9"/>
  <text x="150" y="915" font-size="24" fill="#4B5563" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    지자체별 조건이 달라요
  </text>
</svg>
