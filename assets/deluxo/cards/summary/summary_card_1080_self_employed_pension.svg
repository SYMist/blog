  <text x="400" y="375" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#EAF2FF">기존 40%까지 하락 예정 →</text>
  <text x="780" y="375" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="42" font-weight="900" fill="#F59E0B">43% 고정</text>

