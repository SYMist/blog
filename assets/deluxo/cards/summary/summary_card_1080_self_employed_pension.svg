  <rect x="60" y="440" width="960" height="200" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="456" width="280" height="34" rx="17" fill="#1D4ED8"/>
  <text x="220" y="480" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">수령액 시뮬레이션 (월 소득 300만)</text>

  <text x="230" y="540" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">가입 20년</text>
  <text x="230" y="575" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="900" fill="#FFF">약 72만 원</text>

  <text x="540" y="540" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">가입 25년</text>
  <text x="540" y="575" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="900" fill="#FFF">약 90만 원</text>

  <text x="850" y="540" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">가입 30년</text>
  <text x="850" y="575" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="900" fill="#FFF">약 108만 원</text>

  <text x="540" y="625" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="700" fill="#F59E0B">20년 초과 시 1년당 연금 5% 할증 + 물가 연동 평생 수령</text>

  <!-- 핵심 변화 -->
  <rect x="60" y="660" width="460" height="160" rx="20" fill="rgba(245,158,11,0.12)"/>
