<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">자영업자 국민연금 2026 요약</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 보험료율 변화 -->
  <rect x="60" y="120" width="960" height="160" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="136" width="180" height="34" rx="17" fill="#1D4ED8"/>
  <text x="170" y="160" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">보험료율 변화</text>

  <text x="180" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#EAF2FF">9.0%</text>
  <text x="180" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">2025년</text>

  <text x="370" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#F59E0B">→</text>

  <text x="540" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="42" font-weight="900" fill="#F59E0B">9.5%</text>
  <text x="540" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">2026년</text>

  <text x="720" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#F59E0B">→</text>

  <text x="880" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#EAF2FF">13.0%</text>
  <text x="880" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">2033년 최종</text>

  <text x="540" y="268" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">매년 +0.5%p | 월 소득 300만 기준: 270,000 → 285,000 → 390,000원</text>

  <!-- 소득대체율 -->
  <rect x="60" y="300" width="960" height="120" rx="20" fill="rgba(245,158,11,0.08)"/>
  <rect x="80" y="316" width="180" height="34" rx="17" fill="#F59E0B"/>
