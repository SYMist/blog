  <text x="290" y="775" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">509만 미만 소득 → 연금 전액 수령</text>
  <text x="290" y="805" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">10만 명(65%) 혜택, 월 최대 15만 원 보전</text>

  <rect x="540" y="660" width="480" height="160" rx="20" fill="rgba(245,158,11,0.12)"/>
  <text x="780" y="700" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">크레딧 확대</text>
  <text x="780" y="740" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="900" fill="#FFF">군 복무: 6개월 → 12개월</text>
  <text x="780" y="775" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="900" fill="#FFF">출산: 첫째부터 12개월</text>
  <text x="780" y="805" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">상한 폐지 · 부부 각자 적용 가능</text>

  <!-- 지원 제도 -->
  <rect x="60" y="840" width="960" height="120" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="856" width="260" height="34" rx="17" fill="#1D4ED8"/>
  <text x="210" y="880" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">저소득 보험료 지원 확대</text>
  <text x="80" y="920" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">기준소득 80만 원 미만 →</text>
  <text x="480" y="920" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#F59E0B">보험료 50% 지원</text>
  <text x="740" y="920" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">(월 최대 45,000원 × 12개월)</text>
  <text x="540" y="950" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" fill="#EAF2FF">'납부재개자' 조건 삭제 → 모든 저소득 지역가입자 대상</text>

  <!-- A값 -->
  <rect x="60" y="980" width="960" height="56" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="1016" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">2026 A값(평균소득월액) 3,193,511원 (+3.4%) | 물가 반영 2.1% 인상 | 상수 1.29 고정</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
