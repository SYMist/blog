<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#EF4444"/>

  <!-- Title -->
  <text x="540" y="70" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#EF4444" text-anchor="middle">창업 세금 감면 상실 · 가산세 TOP 5</text>
  <text x="540" y="108" font-family="-apple-system, sans-serif" font-size="21" font-weight="700" fill="#A0B4D0" text-anchor="middle">이 중 하나만 걸려도 수십만~수백만 원 손실</text>

  <!-- Item 1 -->
  <rect x="60" y="136" width="960" height="112" rx="12" fill="#1A3270"/>
  <rect x="60" y="136" width="6" height="112" rx="3" fill="#EF4444"/>
  <circle cx="118" cy="192" r="24" fill="#EF4444"/>
  <text x="118" y="199" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="162" y="176" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">청년창업 감면 신청서 미첨부</text>
  <text x="162" y="204" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">종소세 신고 시 "창업중소기업 세액감면 신청서"를 별도 첨부하지 않으면 자동 미적용</text>
  <text x="162" y="230" font-family="-apple-system, sans-serif" font-size="16" fill="#EF4444">→ 연간 수십~수백만 원 감면 혜택 미수령</text>

  <!-- Item 2 -->
  <rect x="60" y="258" width="960" height="112" rx="12" fill="#0D2347"/>
  <rect x="60" y="258" width="6" height="112" rx="3" fill="#EF4444"/>
  <circle cx="118" cy="314" r="24" fill="#EF4444"/>
  <text x="118" y="321" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="162" y="298" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">업종 코드 착오 — 감면 비대상 코드로 등록</text>
  <text x="162" y="326" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">카페 → "비알코올 음료점" 코드 선택 시 감면 제외 (음식점 코드로 등록해야 포함)</text>
  <text x="162" y="352" font-family="-apple-system, sans-serif" font-size="16" fill="#EF4444">→ 5년간 감면 기회 상실, 코드 변경은 복잡한 절차 필요</text>

  <!-- Item 3 -->
  <rect x="60" y="380" width="960" height="112" rx="12" fill="#1A3270"/>
  <rect x="60" y="380" width="6" height="112" rx="3" fill="#F59E0B"/>
  <circle cx="118" cy="436" r="24" fill="#F59E0B"/>
  <text x="118" y="443" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#0B1F3B" text-anchor="middle">3</text>
  <text x="162" y="420" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">사업자등록 20일 초과 — 매입세액 공제 불가</text>
  <text x="162" y="448" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">사업 개시 후 20일 초과 등록 시, 개시 전 인테리어·설비에 납부한 부가세 환급 불가</text>
  <text x="162" y="474" font-family="-apple-system, sans-serif" font-size="16" fill="#F59E0B">→ 초기 투자 1,000만원 기준 부가세 약 90만원 미회수</text>

  <!-- Item 4 -->
  <rect x="60" y="502" width="960" height="112" rx="12" fill="#0D2347"/>
  <rect x="60" y="502" width="6" height="112" rx="3" fill="#F59E0B"/>
  <circle cx="118" cy="558" r="24" fill="#F59E0B"/>
  <text x="118" y="565" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#0B1F3B" text-anchor="middle">4</text>
  <text x="162" y="542" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">간이과세자로 등록 후 세금계산서 미발급 — B2B 거래 상실</text>
  <text x="162" y="570" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">연 매출 4,800만원 미만 간이과세자는 세금계산서 발급 불가 → 거래처가 거래 거부하는 사례</text>
  <text x="162" y="596" font-family="-apple-system, sans-serif" font-size="16" fill="#F59E0B">→ B2B 납품·용역 계약 해지로 매출 직격</text>

  <!-- Item 5 -->
  <rect x="60" y="624" width="960" height="112" rx="12" fill="#1A3270"/>
  <rect x="60" y="624" width="6" height="112" rx="3" fill="#EF4444"/>
  <circle cx="118" cy="680" r="24" fill="#EF4444"/>
  <text x="118" y="687" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="162" y="664" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">부가세 무신고 또는 매출 누락</text>
  <text x="162" y="692" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0">신고 누락 시 납부세액 × 20% 가산세, 부정 누락 시 40% / 납부지연 0.022%/일 추가</text>
  <text x="162" y="718" font-family="-apple-system, sans-serif" font-size="16" fill="#EF4444">→ 추징세액 + 가산세로 원래 세금의 1.5~2배 납부 사례</text>

  <!-- Bottom Warning -->
  <rect x="60" y="762" width="960" height="70" rx="12" fill="#2A1818"/>
  <rect x="60" y="762" width="960" height="70" rx="12" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="540" y="796" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#EF4444" text-anchor="middle">사업자등록 전 업종 코드 + 과세 유형 확인이 모든 세금 문제의 출발점</text>
  <text x="540" y="820" font-family="-apple-system, sans-serif" font-size="16" fill="#EAF2FF" text-anchor="middle">불확실하면 창업 전 국세청 ☎ 126 상담 — 무료, 비대면 가능</text>

  <!-- Footer -->
  <text x="540" y="960" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | hometax.go.kr | nts.go.kr | ☎ 126</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#EF4444"/>
</svg>
