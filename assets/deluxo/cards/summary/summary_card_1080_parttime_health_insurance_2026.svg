<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 상단 제목 영역 -->
  <rect x="60" y="54" width="960" height="110" rx="16" fill="#0D2347"/>
  <text x="540" y="106" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="800" fill="#F59E0B" text-anchor="middle">일용직·아르바이트</text>
  <text x="540" y="148" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">건강보험 자격 기준 요약</text>

  <!-- 구분선 -->
  <rect x="60" y="184" width="960" height="3" rx="2" fill="#1A3270"/>

  <!-- 헤더 행 -->
  <rect x="60" y="197" width="960" height="54" rx="0" fill="#1A3270"/>
  <text x="160" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#A0B4D0" text-anchor="middle">근무 형태</text>
  <text x="390" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#A0B4D0" text-anchor="middle">조건</text>
  <text x="650" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#A0B4D0" text-anchor="middle">건강보험 자격</text>
  <text x="910" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#A0B4D0" text-anchor="middle">보험료</text>

  <!-- 열 구분선 -->
  <rect x="240" y="197" width="2" height="54" fill="#0B1F3B"/>
  <rect x="500" y="197" width="2" height="54" fill="#0B1F3B"/>
  <rect x="780" y="197" width="2" height="54" fill="#0B1F3B"/>

  <!-- 행 1: 직장가입자 -->
  <rect x="60" y="251" width="960" height="130" rx="0" fill="#0D2347"/>
  <rect x="60" y="251" width="6" height="130" rx="0" fill="#34D399"/>
  <text x="160" y="298" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">아르바이트</text>
  <text x="160" y="330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">일용직</text>
  <text x="390" y="298" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#34D399" text-anchor="middle">1개월 이상</text>
  <text x="390" y="328" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#34D399" text-anchor="middle">+ 월 60시간 이상</text>
  <text x="650" y="310" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">직장가입자 ✅</text>
  <text x="910" y="298" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle">근로자 50%</text>
  <text x="910" y="328" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle">사업주 50%</text>
  <rect x="240" y="251" width="2" height="130" fill="#1A3270"/>
  <rect x="500" y="251" width="2" height="130" fill="#1A3270"/>
  <rect x="780" y="251" width="2" height="130" fill="#1A3270"/>

  <!-- 행 2: 지역가입자 -->
  <rect x="60" y="381" width="960" height="130" rx="0" fill="#102A56"/>
  <rect x="60" y="381" width="6" height="130" rx="0" fill="#F59E0B"/>
  <text x="160" y="428" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">아르바이트</text>
  <text x="160" y="460" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">일용직</text>
  <text x="390" y="428" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#F59E0B" text-anchor="middle">1개월 미만</text>
  <text x="390" y="458" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#F59E0B" text-anchor="middle">또는 월 60시간 미만</text>
  <text x="650" y="438" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">지역가입자 / 피부양자</text>
  <text x="910" y="438" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#A0B4D0" text-anchor="middle">전액 본인 부담</text>
  <rect x="240" y="381" width="2" height="130" fill="#0B1F3B"/>
  <rect x="500" y="381" width="2" height="130" fill="#0B1F3B"/>
  <rect x="780" y="381" width="2" height="130" fill="#0B1F3B"/>

  <!-- 행 3: 피부양자 -->
  <rect x="60" y="511" width="960" height="130" rx="0" fill="#0D2347"/>
  <rect x="60" y="511" width="6" height="130" rx="0" fill="#34D399"/>
  <text x="160" y="558" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">피부양자</text>
  <text x="160" y="590" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">(부양가족)</text>
  <text x="390" y="546" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">소득 연 2,000만 원 이하</text>
  <text x="390" y="574" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">재산세 과세표준</text>
  <text x="390" y="600" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">5억 4천만 원 이하</text>
  <text x="650" y="566" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">직장가입자에 등재</text>
  <text x="910" y="558" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="900" fill="#34D399" text-anchor="middle">0원</text>
  <text x="910" y="592" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">보험료 없음</text>
  <rect x="240" y="511" width="2" height="130" fill="#1A3270"/>
  <rect x="500" y="511" width="2" height="130" fill="#1A3270"/>
  <rect x="780" y="511" width="2" height="130" fill="#1A3270"/>

  <!-- 테두리 -->
  <rect x="60" y="197" width="960" height="444" rx="0" fill="none" stroke="#1A3270" stroke-width="2"/>

  <!-- 핵심 포인트 박스 -->
  <rect x="60" y="668" width="960" height="120" rx="16" fill="#1A3270"/>
  <text x="540" y="712" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">📌 핵심 포인트</text>
  <text x="540" y="752" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle">사업주 신고 의무 — 조건 충족 시 14일 이내 신고 필수</text>
  <text x="540" y="780" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">미신고 시 사업주에게 제재 (근로자가 공단에 신고 가능)</text>

  <!-- 피부양자 90일 박스 -->
  <rect x="60" y="808" width="460" height="90" rx="16" fill="#0D2347"/>
  <text x="290" y="848" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">피부양자 90일 기한</text>
  <text x="290" y="882" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">취득일 90일 이내 신청 → 소급 적용</text>

  <!-- 금융소득 박스 -->
  <rect x="560" y="808" width="460" height="90" rx="16" fill="#0D2347"/>
  <text x="790" y="848" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">금융소득 1,000만 원 이하</text>
  <text x="790" y="882" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">소득 계산에서 제외 (모르면 손해)</text>

  <!-- 하단 출처 -->
  <text x="540" y="1030" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4A6080" text-anchor="middle">국민건강보험법 제6조 · 2026년 5월 기준 · deluxo</text>
</svg>
