<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">소득별 최적 조합 빠른 판단</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 테이블 헤더 -->
  <rect x="60" y="140" width="280" height="60" rx="0" fill="rgba(255,255,255,0.12)"/>
  <rect x="340" y="140" width="350" height="60" rx="0" fill="rgba(255,255,255,0.12)"/>
  <rect x="690" y="140" width="330" height="60" rx="0" fill="rgba(255,255,255,0.12)"/>
  <text x="200" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">구분</text>
  <text x="515" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">총급여 5,500만원 이하</text>
  <text x="855" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">총급여 5,500만원 초과</text>

  <!-- Row 1: 공제율 -->
  <rect x="60" y="200" width="280" height="70" fill="rgba(255,255,255,0.04)"/>
  <rect x="340" y="200" width="350" height="70" fill="rgba(255,255,255,0.02)"/>
  <rect x="690" y="200" width="330" height="70" fill="rgba(255,255,255,0.02)"/>
  <text x="200" y="243" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">세액공제율</text>
  <text x="515" y="243" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#F59E0B">16.5%</text>
  <text x="855" y="243" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#EAF2FF">13.2%</text>

  <!-- Row 2: 연금저축 -->
  <rect x="60" y="270" width="280" height="100" fill="rgba(255,255,255,0.06)"/>
  <rect x="340" y="270" width="350" height="100" fill="rgba(255,255,255,0.04)"/>
  <rect x="690" y="270" width="330" height="100" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="310" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">연금저축</text>
  <text x="200" y="345" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">600만원</text>
  <text x="515" y="330" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#FFF">99만원</text>
  <text x="855" y="330" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="800" fill="#FFF">79.2만원</text>

  <!-- Row 3: IRP -->
  <rect x="60" y="370" width="280" height="100" fill="rgba(255,255,255,0.04)"/>
  <rect x="340" y="370" width="350" height="100" fill="rgba(255,255,255,0.02)"/>
  <rect x="690" y="370" width="330" height="100" fill="rgba(255,255,255,0.02)"/>
  <text x="200" y="410" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">+IRP</text>
  <text x="200" y="445" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">300만원</text>
  <text x="515" y="415" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#FFF">+49.5만원</text>
  <text x="515" y="450" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">(합계 148.5만원)</text>
  <text x="855" y="415" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#FFF">+39.6만원</text>
  <text x="855" y="450" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">(합계 118.8만원)</text>

  <!-- Row 4: ISA 전환 -->
  <rect x="60" y="470" width="280" height="100" fill="rgba(255,255,255,0.06)"/>
  <rect x="340" y="470" width="350" height="100" fill="rgba(255,255,255,0.04)"/>
  <rect x="690" y="470" width="330" height="100" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="510" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">ISA 전환</text>
  <text x="200" y="545" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">300만원</text>
  <text x="515" y="530" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#FFF">+49.5만원</text>
  <text x="855" y="530" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#FFF">+39.6만원</text>

  <!-- Row 5: 합계 -->
  <rect x="60" y="570" width="280" height="80" fill="rgba(245,158,11,0.2)"/>
  <rect x="340" y="570" width="350" height="80" fill="rgba(245,158,11,0.15)"/>
  <rect x="690" y="570" width="330" height="80" fill="rgba(245,158,11,0.15)"/>
  <text x="200" y="618" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">최대 연간 환급</text>
  <text x="515" y="618" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#F59E0B">198만원</text>
  <text x="855" y="618" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="900" fill="#F59E0B">158.4만원</text>

  <!-- 하단 안내 -->
  <rect x="60" y="690" width="960" height="160" rx="20" fill="rgba(255,255,255,0.06)"/>
  <text x="540" y="740" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">최적 납입 순서</text>
  <text x="540" y="790" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#F59E0B">① 연금저축 600 → ② IRP 300 → ③ ISA 장기투자</text>
  <text x="540" y="830" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">ISA 만기 후 → 연금계좌 전환으로 추가 공제</text>

  <text x="540" y="920" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">※ 종합소득 4,500만원(총급여 5,500만원) 기준 · 지방세 포함 세율</text>

  <rect x="60" y="990" width="960" height="6" rx="3" fill="#F59E0B"/>
  <text x="540" y="1050" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">2026년 기준 · louisville blog</text>
</svg>
