<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">출산급여·육아휴직급여 핵심 요약</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 출산휴가급여 -->
  <rect x="60" y="140" width="960" height="280" rx="20" fill="rgba(255,255,255,0.06)"/>
  <rect x="80" y="160" width="200" height="44" rx="22" fill="#F59E0B"/>
  <text x="180" y="190" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#0B1F3B">출산휴가급여</text>
  <text x="80" y="245" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#FFF">기간: 90일 (다태아 120일)</text>
  <text x="80" y="285" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">지급률: 통상임금 100%</text>
  <text x="80" y="325" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">2026 상한: 월 220만원 (90일 최대 660만원)</text>
  <text x="80" y="365" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">고용보험 180일 이상 가입 필수</text>
  <text x="80" y="400" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">→ 고용보험 지급분 비과세·4대보험 미부과</text>

  <!-- 육아휴직급여 -->
  <rect x="60" y="440" width="960" height="340" rx="20" fill="rgba(255,255,255,0.06)"/>
  <rect x="80" y="460" width="200" height="44" rx="22" fill="#E8F0FF"/>
  <text x="180" y="490" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#1D4ED8">육아휴직급여</text>
  <text x="80" y="545" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#FFF">기간: 최대 12개월 (부모 합산 3년)</text>
  <text x="80" y="585" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">1~3개월: 통상임금 100%, 상한 250만원</text>
  <text x="80" y="625" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">4~6개월: 통상임금 100%, 상한 200만원</text>
  <text x="80" y="665" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">7~12개월: 통상임금 80%, 상한 160만원</text>
  <text x="80" y="705" font-family="'Pretendard',sans-serif" font-size="24" fill="#EAF2FF">사후지급금 폐지 → 매월 100% 전액 지급</text>
  <text x="80" y="745" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">→ 12개월 최대 2,310만원 (비과세)</text>

  <!-- 합산 -->
  <rect x="60" y="810" width="960" height="120" rx="20" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="860" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="900" fill="#F59E0B">출산휴가 + 육아휴직 합산</text>
  <text x="540" y="905" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="40" font-weight="900" fill="#FFF">최대 약 2,970만원</text>

  <text x="540" y="990" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">6+6 부모 육아휴직제: 부부 합산 최대 5,920만원</text>
  <rect x="60" y="1030" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
