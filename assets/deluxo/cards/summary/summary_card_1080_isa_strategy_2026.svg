  <text x="540" y="810" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#0B1F3B" text-anchor="middle">만기 후 60일 이내 연금계좌 이전 → 추가 세액공제</text>
  <text x="540" y="870" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0B1F3B" text-anchor="middle">총급여 5,500만↓ 기준 최대 49만 5,000원 환급</text>
  <text x="540" y="940" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#0B1F3B" text-anchor="middle">금융위원회: fsc.go.kr | 국세청: nts.go.kr</text>
