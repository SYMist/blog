  <rect x="60" y="622" width="290" height="66" rx="33" fill="#1A3270"/>
  <text x="205" y="663" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">손익통산 과세</text>

  <rect x="395" y="622" width="290" height="66" rx="33" fill="#1A3270"/>
  <text x="540" y="663" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">금소세 기준 제외</text>

  <rect x="730" y="622" width="290" height="66" rx="33" fill="#1A3270"/>
