  <text x="80" y="600" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">5대 은행 신용대출</text>
  <text x="350" y="600" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#EF4444">4.01~5.38%</text>
  <text x="600" y="600" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">14개월 만에 4%대 돌파</text>

  <!-- 대환대출 -->
  <rect x="60" y="660" width="960" height="120" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="672" width="140" height="34" rx="17" fill="#1D4ED8"/>
  <text x="150" y="696" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFF">대환대출</text>

  <text x="80" y="740" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">고금리(7%+) → 전환</text>
  <text x="350" y="740" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#F59E0B">4.5% 고정</text>
  <text x="560" y="740" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">최대 5,000만 · 10년 분할</text>

  <!-- 금리 우대 -->
  <rect x="60" y="800" width="960" height="120" rx="20" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="840" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">금리 우대 최대 0.8%p</text>
  <text x="200" y="885" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">정책 0.2%p</text>
  <text x="400" y="885" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">안전망 0.2%p</text>
  <text x="600" y="885" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">지역 0.2%p</text>
  <text x="800" y="885" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#EAF2FF">성실상환 0.3%p</text>

  <!-- 핵심 수치 -->
  <rect x="60" y="940" width="460" height="80" rx="16" fill="rgba(245,158,11,0.2)"/>
  <text x="290" y="975" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">정책자금 총 3조 3,620억 원</text>
  <text x="290" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="600" fill="#EAF2FF">역대 최대 · 비수도권 60%+ 배정</text>

  <rect x="540" y="940" width="480" height="80" rx="16" fill="rgba(245,158,11,0.2)"/>
  <text x="780" y="975" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#F59E0B">마이데이터 연 1,680억 절감</text>
  <text x="780" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="600" fill="#EAF2FF">자동 금리 인하 · 2026.2.26 시행</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
