<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">신고 유형별 핵심 포인트·환급 비교</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 프리랜서 -->
  <rect x="60" y="140" width="460" height="280" rx="20" fill="rgba(34,197,94,0.12)"/>
  <rect x="80" y="160" width="120" height="40" rx="20" fill="#22C55E"/>
  <text x="140" y="188" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#0B1F3B">프리랜서</text>
  <text x="80" y="230" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">3.3% 원천징수 ≠ 최종 세금</text>
  <text x="80" y="265" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">종합소득세 신고로 정산</text>
  <text x="80" y="310" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#22C55E">2,400만원 이하</text>
  <text x="80" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">→ 단순경비율 적용</text>
  <text x="80" y="375" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">환급률 40~57%</text>
  <text x="80" y="405" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">7,500만원+ → 추가 납부 발생</text>

  <!-- 개인사업자 -->
  <rect x="560" y="140" width="460" height="280" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="580" y="160" width="140" height="40" rx="20" fill="#60A5FA"/>
  <text x="650" y="188" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#0B1F3B">개인사업자</text>
  <text x="580" y="230" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">장부 의무 확인 필수</text>
  <text x="580" y="265" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">미기장 시 가산세 20%</text>
  <text x="580" y="310" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#60A5FA">4,800만원 초과</text>
  <text x="580" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">→ 복식부기 고려</text>
  <text x="580" y="375" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#60A5FA">7,500만원 초과</text>
  <text x="580" y="405" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">→ 세무대리인 권장</text>

  <!-- 부업 직장인 -->
  <rect x="60" y="445" width="460" height="200" rx="20" fill="rgba(168,85,247,0.12)"/>
  <rect x="80" y="465" width="140" height="40" rx="20" fill="#A855F7"/>
  <text x="150" y="493" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#FFF">부업 직장인</text>
  <text x="80" y="535" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">연말정산과 별도 신고 필수</text>
  <text x="80" y="570" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">근로소득 + 사업소득 합산</text>
  <text x="80" y="610" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EF4444">미신고 시 가산세 부과</text>

  <!-- 금융소득자 -->
  <rect x="560" y="445" width="460" height="200" rx="20" fill="rgba(245,158,11,0.12)"/>
  <rect x="580" y="465" width="140" height="40" rx="20" fill="#F59E0B"/>
  <text x="650" y="493" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#0B1F3B">금융소득자</text>
  <text x="580" y="535" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">이자+배당 2,000만원 초과 시</text>
  <text x="580" y="570" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">종합과세 (누진세율 적용)</text>
  <text x="580" y="610" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">2,000만원 이하 → 15.4% 분리과세</text>

  <!-- 절세 공제 -->
  <rect x="60" y="680" width="960" height="200" rx="20" fill="rgba(34,197,94,0.08)"/>
  <text x="540" y="720" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#22C55E">주요 절세 공제 항목</text>

  <rect x="80" y="745" width="290" height="110" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="225" y="785" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">연금저축+IRP</text>
  <text x="225" y="815" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">납입 900만원</text>
  <text x="225" y="845" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#22C55E">절세 최대 148.5만</text>

  <rect x="395" y="745" width="290" height="110" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="540" y="785" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">노란우산공제</text>
  <text x="540" y="815" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">소득공제</text>
  <text x="540" y="845" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#22C55E">최대 500만원</text>

  <rect x="710" y="745" width="290" height="110" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="855" y="785" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">국민연금·건보</text>
  <text x="855" y="815" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">소득공제</text>
  <text x="855" y="845" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#22C55E">납입액 전액</text>

  <!-- 하단 -->
  <rect x="60" y="910" width="960" height="80" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="960" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">홈택스 셀프 신고 4단계: 유형확인 → 소득확인 → 작성제출 → 환급계좌</text>

  <rect x="60" y="1020" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
