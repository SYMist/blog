<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="60" width="960" height="110" rx="16" fill="#0D2347"/>
  <text x="540" y="106" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">전기차 보조금 가격별 지급률</text>
  <text x="540" y="150" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="26" font-weight="600" fill="#A0B4D0" text-anchor="middle">차량 구매 가격에 따른 보조금 수령 기준 (2026)</text>

  <!-- Tier 1: Under 5,300만 -->
  <rect x="60" y="196" width="960" height="200" rx="16" fill="#34D399" fill-opacity="0.12"/>
  <rect x="60" y="196" width="12" height="200" rx="6" fill="#34D399"/>
  <text x="110" y="248" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399">차량 가격 5,300만원 미만</text>
  <text x="110" y="290" font-family="-apple-system, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF">보조금 100% 지급</text>
  <text x="110" y="336" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">중·대형 기준 국비 580만원 + 지방보조금 전액</text>
  <rect x="820" y="230" width="160" height="60" rx="10" fill="#34D399"/>
  <text x="900" y="270" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#0B1F3B" text-anchor="middle">최유리</text>

  <!-- Tier 2: 5,300~8,500만 -->
  <rect x="60" y="416" width="960" height="200" rx="16" fill="#F59E0B" fill-opacity="0.12"/>
  <rect x="60" y="416" width="12" height="200" rx="6" fill="#F59E0B"/>
  <text x="110" y="468" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#F59E0B">차량 가격 5,300만~8,500만원</text>
  <text x="110" y="510" font-family="-apple-system, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF">보조금 50% 지급</text>
  <text x="110" y="556" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">중·대형 기준 국비 580만원의 절반 = 290만원</text>
  <rect x="820" y="448" width="160" height="60" rx="10" fill="#F59E0B"/>
  <text x="900" y="488" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#0B1F3B" text-anchor="middle">절반</text>

  <!-- Tier 3: Over 8,500만 -->
  <rect x="60" y="636" width="960" height="200" rx="16" fill="#EF4444" fill-opacity="0.12"/>
  <rect x="60" y="636" width="12" height="200" rx="6" fill="#EF4444"/>
  <text x="110" y="688" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#EF4444">차량 가격 8,500만원 이상</text>
  <text x="110" y="730" font-family="-apple-system, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF">보조금 미지원</text>
  <text x="110" y="776" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0">국비보조금 대상 차량에서 제외 — 세제혜택만 적용</text>
  <rect x="820" y="668" width="160" height="60" rx="10" fill="#EF4444"/>
  <text x="900" y="708" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">미지원</text>

  <!-- Simulation box -->
  <rect x="60" y="856" width="960" height="156" rx="16" fill="#1A3270"/>
  <text x="540" y="896" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">예시: 5,000만원 아이오닉6 구매 (서울, 전환지원금 포함)</text>
  <text x="160" y="936" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">국비 580만 + 서울 150만 + 전환 100만 + 취득세 140만 + 개소세 300만</text>
  <text x="540" y="984" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#34D399" text-anchor="middle">= 실질 절감 약 1,270만원</text>
  <text x="540" y="1026" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">※ 조건 모두 충족 시 참고용 계산 — 실제 금액은 공고 기준 확인 필수</text>
</svg>
