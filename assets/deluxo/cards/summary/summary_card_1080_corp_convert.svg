<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)" rx="0"/>

  <!-- Badge -->
  <rect x="60" y="55" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="140" y="86" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B">2026 최신</text>

  <!-- Title -->
  <text x="60" y="160" font-family="'Pretendard', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">법인전환 핵심 정리</text>

  <!-- Divider -->
  <rect x="60" y="185" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Tax Comparison Box -->
  <rect x="60" y="220" width="960" height="130" rx="20" fill="rgba(255,255,255,0.06)" filter="url(#shadow)"/>
  <text x="120" y="270" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#94A3B8">개인 최고세율</text>
  <text x="120" y="310" font-family="'Pretendard', sans-serif" font-size="42" font-weight="800" fill="#F87171">49.5%</text>
  <text x="420" y="295" font-family="'Pretendard', sans-serif" font-size="36" font-weight="700" fill="#F59E0B">vs</text>
  <text x="560" y="270" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#94A3B8">법인 실효세율</text>
  <text x="560" y="310" font-family="'Pretendard', sans-serif" font-size="42" font-weight="800" fill="#34D399">11~22%</text>
  <text x="860" y="295" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">격차 최대 22%p↑</text>

  <!-- Info Rows -->
  <!-- Row 1: 전환 비용 -->
  <rect x="60" y="380" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <circle cx="110" cy="430" r="28" fill="rgba(245,158,11,0.15)"/>
  <text x="110" y="438" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" fill="#F59E0B">₩</text>
  <text x="160" y="418" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">전환 비용</text>
  <text x="160" y="452" font-family="'Pretendard', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">비과밀 약 40만 원 · 과밀 지역 3배 중과</text>

  <!-- Row 2: 이월과세 -->
  <rect x="60" y="500" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <circle cx="110" cy="550" r="28" fill="rgba(245,158,11,0.15)"/>
  <text x="110" y="558" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" fill="#F59E0B">⏳</text>
  <text x="160" y="538" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">이월과세</text>
  <text x="160" y="572" font-family="'Pretendard', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">양도세 유예 — 5년 사후관리 의무</text>

  <!-- Row 3: 취득세 감면 -->
  <rect x="60" y="620" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <circle cx="110" cy="670" r="28" fill="rgba(245,158,11,0.15)"/>
  <text x="110" y="678" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" fill="#F59E0B">🏛</text>
  <text x="160" y="658" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">취득세 감면</text>
  <text x="160" y="692" font-family="'Pretendard', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">일몰 2027.12.31 — 기한 내 전환 필요</text>

  <!-- Row 4: 가업승계 -->
  <rect x="60" y="740" width="960" height="100" rx="16" fill="rgba(255,255,255,0.04)"/>
  <circle cx="110" cy="790" r="28" fill="rgba(245,158,11,0.15)"/>
  <text x="110" y="798" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" fill="#F59E0B">👨‍👦</text>
  <text x="160" y="778" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">가업승계</text>
  <text x="160" y="812" font-family="'Pretendard', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">120억까지 10% 저율 과세 적용</text>

  <!-- Chips -->
  <rect x="60" y="890" width="100" height="46" rx="32" fill="#E8F0FF"/>
  <text x="110" y="920" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">절세</text>

  <rect x="180" y="890" width="100" height="46" rx="32" fill="#E8F0FF"/>
  <text x="230" y="920" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">비교</text>

  <rect x="300" y="890" width="120" height="46" rx="32" fill="#E8F0FF"/>
  <text x="360" y="920" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#1D4ED8">총정리</text>

  <!-- Footer -->
  <text x="1020" y="1040" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="18" font-weight="400" fill="#475569">tistory.deluxo · 2026</text>
</svg>