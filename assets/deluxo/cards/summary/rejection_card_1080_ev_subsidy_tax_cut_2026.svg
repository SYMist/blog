<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Red top bar -->
  <rect x="0" y="0" width="1080" height="10" fill="#EF4444"/>

  <!-- Header -->
  <rect x="60" y="40" width="960" height="120" rx="16" fill="#1A1A2E"/>
  <rect x="60" y="40" width="960" height="6" rx="3" fill="#EF4444"/>
  <text x="540" y="92" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="36" font-weight="900" fill="#EF4444" text-anchor="middle">전기차 보조금 탈락 사유 TOP 5</text>
  <text x="540" y="138" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">신청 전 반드시 확인하세요</text>

  <!-- Reason 1 -->
  <rect x="60" y="192" width="960" height="140" rx="14" fill="#1A3270"/>
  <rect x="60" y="192" width="80" height="140" rx="14" fill="#EF4444"/>
  <text x="100" y="272" font-family="-apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="170" y="248" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">차량 가격 8,500만원 이상</text>
  <text x="170" y="290" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">보조금 대상 제외 — 세제혜택만 적용, 국비·지방보조금 모두 없음</text>

  <!-- Reason 2 -->
  <rect x="60" y="350" width="960" height="140" rx="14" fill="#0D2347"/>
  <rect x="60" y="350" width="80" height="140" rx="14" fill="#EF4444"/>
  <text x="100" y="430" font-family="-apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="170" y="406" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">전환지원금 — 보유 기간 3년 미만</text>
  <text x="170" y="448" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">내연차를 3년 이상 보유하지 않으면 전환지원금 +100만원 탈락</text>

  <!-- Reason 3 -->
  <rect x="60" y="508" width="960" height="140" rx="14" fill="#1A3270"/>
  <rect x="60" y="508" width="80" height="140" rx="14" fill="#EF4444"/>
  <text x="100" y="588" font-family="-apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="170" y="564" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">전환지원금 — 가족간 거래로 처분</text>
  <text x="170" y="606" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">배우자·자녀에게 판매한 경우 인정 불가 (공식 폐차 또는 중고 매도만)</text>

  <!-- Reason 4 -->
  <rect x="60" y="666" width="960" height="140" rx="14" fill="#0D2347"/>
  <rect x="60" y="666" width="80" height="140" rx="14" fill="#EF4444"/>
  <text x="100" y="746" font-family="-apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="170" y="722" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">서류 제출 기한 초과 (등록 후 10일)</text>
  <text x="170" y="764" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">차량 등록 후 10일 이내 미제출 시 지원 취소 — 출고 당일 바로 준비</text>

  <!-- Reason 5 -->
  <rect x="60" y="824" width="960" height="140" rx="14" fill="#1A3270"/>
  <rect x="60" y="824" width="80" height="140" rx="14" fill="#EF4444"/>
  <text x="100" y="904" font-family="-apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="170" y="880" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">보조금 수령 후 2년 내 판매·폐차</text>
  <text x="170" y="922" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">2년 이내 처분 시 받은 보조금 전액 환수 — 반드시 2년 이상 보유</text>

  <!-- Footer -->
  <text x="540" y="1018" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">deluxo | 2026년 전기차 보조금 기준 — 신청 전 공고 확인 필수</text>
  <text x="540" y="1052" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">지방보조금 조건은 지역별 공고에 따라 다릅니다</text>
</svg>
