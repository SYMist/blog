<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="#F0F4FA"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="40" y="40" width="1000" height="110" rx="24" fill="#1D4ED8"/>
  <rect x="40" y="100" width="1000" height="50" fill="#1D4ED8"/>
  <text x="540" y="108" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">전세보증금 반환보증 HUG·HF·SGI 비교</text>

  <!-- Row labels -->
  <text x="100" y="210" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#374151">구분</text>
  <text x="380" y="210" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">HUG</text>
  <text x="610" y="210" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">HF (전세지킴)</text>
  <text x="900" y="210" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">SGI</text>
  <line x1="80" y1="230" x2="1000" y2="230" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Row 1: 보증금 한도 -->
  <text x="100" y="280" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="600" fill="#374151">보증금 한도</text>
  <text x="380" y="280" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">수도권 7억</text>
  <text x="380" y="312" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">비수도권 5억</text>
  <text x="610" y="280" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">수도권 7억</text>
  <text x="610" y="312" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">비수도권 5억</text>
  <text x="900" y="280" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">한도 없음</text>
  <text x="900" y="312" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#6B7280">(비아파트 10억↓)</text>
  <line x1="80" y1="340" x2="1000" y2="340" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- Row 2: LTV 조건 -->
  <text x="100" y="390" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="600" fill="#374151">LTV 조건</text>
  <text x="380" y="390" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">60% 이하</text>
  <text x="610" y="390" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">90% 이하</text>
  <text x="900" y="390" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">주택가격 이내</text>
  <line x1="80" y1="420" x2="1000" y2="420" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- Row 3: 보증료 요율 -->
  <text x="100" y="470" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="600" fill="#374151">보증료(연)</text>
  <text x="380" y="470" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#DC2626">0.115~0.154%</text>
  <text x="610" y="470" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#059669">0.04~0.18%</text>
  <text x="900" y="470" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#DC2626">0.192~0.218%</text>
  <line x1="80" y1="500" x2="1000" y2="500" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- Row 4: 할인 제도 -->
  <text x="100" y="550" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="600" fill="#374151">할인 제도</text>
  <text x="380" y="550" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">저소득·신혼 50%</text>
  <text x="380" y="580" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">청년 10%</text>
  <text x="610" y="550" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">우대가구</text>
  <text x="610" y="580" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">0.02%p 할인</text>
  <text x="900" y="550" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">채권양도 20%</text>
  <text x="900" y="580" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">LTV 할인 20~30%</text>
  <line x1="80" y1="610" x2="1000" y2="610" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- Row 5: 신청 기한 -->
  <text x="100" y="660" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="600" fill="#374151">신청 기한</text>
  <text x="380" y="660" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">계약기간 절반 전</text>
  <text x="610" y="660" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">계약기간 절반 전</text>
  <text x="900" y="660" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#111827">계약일 10개월 내</text>
  <line x1="80" y1="690" x2="1000" y2="690" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- Row 6: 대상 주택 -->
  <text x="100" y="740" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="600" fill="#374151">대상 주택</text>
  <text x="380" y="740" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">아파트·빌라</text>
  <text x="380" y="770" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">오피스텔·도시형</text>
  <text x="610" y="740" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">모든 주택 유형</text>
  <text x="900" y="740" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">아파트·빌라</text>
  <text x="900" y="770" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#111827">오피스텔·단독</text>
  <line x1="80" y1="800" x2="1000" y2="800" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- Row 7: 보증료 지원 -->
  <rect x="80" y="820" width="920" height="80" rx="12" fill="#EFF6FF"/>
  <text x="100" y="870" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">보증료 환급</text>
  <text x="380" y="870" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#1D4ED8">청년·신혼 전액 / 일반 90% — 최대 40만원</text>

  <!-- Footer -->
  <rect x="80" y="930" width="920" height="80" rx="12" fill="#F1F5F9"/>
  <text x="540" y="965" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#6B7280">※ 요율·한도는 주택 감정가·선순위 채권에 따라 달라질 수 있습니다</text>
  <text x="540" y="995" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#6B7280">2026년 기준 | 신청 전 공식 사이트 확인 필수</text>
</svg>
