  <text x="100" y="325" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">① "월 0원~" 광고 함정</text>
  <text x="100" y="375" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">선수금·보증금·인수가 합치면 총 부담 동일·증가</text>

