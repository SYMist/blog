  <text x="540" y="138" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">환산보증금 기준 · 상가임대차보호법</text>

  <!-- 좌측 박스: 5% 적용 상가 -->
  <rect x="60" y="180" width="460" height="560" rx="20" fill="#0D2347" stroke="#34D399" stroke-width="3"/>
  <rect x="60" y="180" width="460" height="64" rx="20" fill="#34D399"/>
  <rect x="60" y="224" width="460" height="20" fill="#34D399"/>
  <text x="290" y="222" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="900" fill="#0B1F3B" text-anchor="middle">5% 상한 적용 상가</text>

  <text x="290" y="290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" font-weight="700" fill="#A0B4D0" text-anchor="middle">조건</text>
