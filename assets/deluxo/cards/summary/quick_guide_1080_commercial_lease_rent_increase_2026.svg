  <rect x="560" y="180" width="460" height="64" rx="20" fill="#F59E0B"/>
  <rect x="560" y="224" width="460" height="20" fill="#F59E0B"/>
  <text x="790" y="222" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="900" fill="#0B1F3B" text-anchor="middle">5% 상한 미적용 상가</text>

