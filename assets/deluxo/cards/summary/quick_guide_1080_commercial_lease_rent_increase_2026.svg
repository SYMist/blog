  <text x="290" y="354" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle">(서울 9억 / 수도권·부산 6.9억)</text>

  <rect x="90" y="375" width="400" height="2" fill="#1A3270"/>

  <text x="290" y="412" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" font-weight="700" fill="#A0B4D0" text-anchor="middle">임대료 인상</text>
  <text x="290" y="445" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#34D399" text-anchor="middle">연 5% 이내</text>
