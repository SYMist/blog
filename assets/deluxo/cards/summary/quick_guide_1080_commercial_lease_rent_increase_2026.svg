  <text x="790" y="322" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#F59E0B" text-anchor="middle">환산보증금 > 기준</text>
  <text x="790" y="354" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle">(서울 기준 9억원 초과)</text>

  <rect x="590" y="375" width="400" height="2" fill="#1A3270"/>

  <text x="790" y="412" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" font-weight="700" fill="#A0B4D0" text-anchor="middle">임대료 인상</text>
  <text x="790" y="445" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#EF4444" text-anchor="middle">상한 없음</text>
  <text x="790" y="475" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">당사자 자유 협의</text>

  <rect x="590" y="496" width="400" height="2" fill="#1A3270"/>

  <text x="790" y="532" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" font-weight="700" fill="#A0B4D0" text-anchor="middle">갱신청구권</text>
  <text x="790" y="562" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#34D399" text-anchor="middle">10년 동일 보장 ✅</text>

  <rect x="590" y="582" width="400" height="2" fill="#1A3270"/>

  <text x="790" y="618" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23" font-weight="700" fill="#A0B4D0" text-anchor="middle">권리금 보호</text>
  <text x="790" y="648" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#34D399" text-anchor="middle">동일하게 보호 ✅</text>

  <rect x="590" y="668" width="400" height="60" rx="10" fill="#F59E0B"/>
  <text x="790" y="696" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">갱신·권리금은 똑같이</text>
  <text x="790" y="720" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#0B1F3B" text-anchor="middle">주장할 수 있다</text>

  <!-- 경고 박스 -->
  <rect x="60" y="762" width="960" height="110" rx="16" fill="#1A0A0A" stroke="#EF4444" stroke-width="2"/>
  <text x="540" y="808" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800" fill="#EF4444" text-anchor="middle">⚠️ 갱신 요구 기한 주의</text>
  <text x="540" y="844" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">계약 만료 6개월~1개월 전 사이에만 행사 가능</text>
  <text x="540" y="870" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">1일 초과 시 갱신청구권 소멸 — 달력 확인 필수</text>

  <!-- 하단 -->
  <text x="540" y="935" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4A6080" text-anchor="middle">대한법률구조공단 132 무료 상담 · 2026년 5월 기준 · deluxo</text>
