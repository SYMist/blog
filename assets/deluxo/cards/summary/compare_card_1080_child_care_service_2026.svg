  <text x="100" y="965" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#0B1F3B">정부지원 0 · 시간당 12,790원 전액</text>
  <text x="100" y="1010" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B">다자녀 10% + 인구감소 5% 추가 차감 가능</text>
