      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="130" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#F59E0B" text-anchor="middle">2026 가구 유형별 본인부담</text>
  <text x="540" y="210" font-family="'Pretendard', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">시간제 일반형 12,790원 기준</text>

  <rect x="60" y="270" width="960" height="130" rx="20" fill="#1A3270"/>
  <text x="100" y="320" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F59E0B">① 가형 (중위 75% 이하)</text>
  <text x="100" y="365" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">정부 85% · 본인 15% → 시간당 1,918원</text>

  <rect x="60" y="420" width="960" height="130" rx="20" fill="#1A3270"/>
  <text x="100" y="470" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F59E0B">② 나형 (75~120%)</text>
  <text x="100" y="515" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">정부 60% · 본인 40% → 시간당 5,116원</text>

  <rect x="60" y="570" width="960" height="130" rx="20" fill="#1A3270"/>
  <text x="100" y="620" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F59E0B">③ 다형 (120~150%)</text>
  <text x="100" y="665" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">정부 30% · 본인 70% → 시간당 8,953원</text>

  <rect x="60" y="720" width="960" height="130" rx="20" fill="#1A3270"/>
  <text x="100" y="770" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F59E0B">④ 라형 (150~250%) NEW</text>
