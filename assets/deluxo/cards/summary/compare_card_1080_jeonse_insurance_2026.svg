<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="130" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#F59E0B" text-anchor="middle">2026 전세보증보험 4대 변화</text>
  <text x="540" y="210" font-family="'Pretendard', sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">한눈에 보기</text>

  <rect x="60" y="270" width="960" height="170" rx="24" fill="#1A3270"/>
  <text x="100" y="325" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#F59E0B">① 2026-02 HUG 요율 4단계</text>
  <text x="100" y="375" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">0.115% ~ 0.154%</text>
  <text x="100" y="415" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">1억·2억·5억·7억 구간 세분화 · 실부담 하락</text>

  <rect x="60" y="460" width="960" height="170" rx="24" fill="#1A3270"/>
  <text x="100" y="515" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#F59E0B">② 2026-03 임대인 의무화</text>
  <text x="100" y="565" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">보증금 10% · 최대 3천만 과태료</text>
  <text x="100" y="605" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">미가입은 계약 해지 사유 · 보증료 분담도 의무</text>

  <rect x="60" y="650" width="960" height="170" rx="24" fill="#1A3270"/>
  <text x="100" y="705" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#F59E0B">③ 국가 지원 40만 원</text>
  <text x="100" y="755" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">기존 30만 → 40만 상향</text>
  <text x="100" y="795" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">청년 5천·일반 6천·신혼 7,500만 소득 기준</text>

  <rect x="60" y="840" width="960" height="170" rx="24" fill="#F59E0B"/>
  <text x="100" y="895" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#0B1F3B">④ 2026-07 임대사업자 126%</text>
  <text x="100" y="945" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#0B1F3B">재계약 공시가 126% 이내 필수</text>
  <text x="100" y="985" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B">초과 계약은 보증금 하향 또는 재계약 불가</text>
</svg>
