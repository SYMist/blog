<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="40" y="36" width="220" height="44" rx="22" fill="#F59E0B"/>
  <text x="150" y="65" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">탈락 사유 TOP 5</text>

  <!-- 제목 -->
  <text x="40" y="135" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">소상공인 지원금</text>
  <text x="40" y="185" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">이것 때문에 탈락합니다</text>

  <rect x="40" y="210" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- 1 -->
  <rect x="40" y="245" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="270" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="306" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">1</text>
  <text x="150" y="295" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">매출 기준 초과</text>
  <text x="150" y="330" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">바우처(1억 400만)·영세 보증(5억) 등 사업마다 기준이 다름</text>
  <text x="150" y="358" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 신청 전 매출 기준부터 확인하세요</text>

  <!-- 2 -->
  <rect x="40" y="390" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="70" y="415" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="451" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">2</text>
  <text x="150" y="440" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">사업자등록 소재지 불일치</text>
  <text x="150" y="475" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">지역 사업은 거주지가 아닌 사업자등록 소재지 기준</text>
  <text x="150" y="503" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 사업자등록증의 주소지를 확인하세요</text>

  <!-- 3 -->
  <rect x="40" y="535" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="560" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="596" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">3</text>
  <text x="150" y="585" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">중복 수혜 확인 누락</text>
  <text x="150" y="620" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">출산·양육 지원금은 정부·타 구청 사업과 중복 불가 경우 多</text>
  <text x="150" y="648" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 담당 부서에 중복 가능 여부 사전 문의</text>

  <!-- 4 -->
  <rect x="40" y="680" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <rect x="70" y="705" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="741" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">4</text>
  <text x="150" y="730" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">홀·짝제 신청일 오류</text>
  <text x="150" y="765" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">바우처 등 대규모 사업은 사업자번호 끝자리로 날짜 배분</text>
  <text x="150" y="793" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 내 사업자번호 끝자리와 신청일 미리 확인</text>

  <!-- 5 -->
  <rect x="40" y="825" width="1000" height="130" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="70" y="850" width="56" height="56" rx="28" fill="#F59E0B"/>
  <text x="98" y="886" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#0B1F3B">5</text>
  <text x="150" y="875" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">필수 서류 누락</text>
  <text x="150" y="910" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">무주택 확인(등본)·출생증명서·4대 보험 취득 확인서 등 빠짐</text>
  <text x="150" y="938" font-family="'Pretendard',sans-serif" font-size="17" font-weight="600" fill="#F59E0B">→ 상황별 추가 서류 체크리스트 미리 준비</text>

  <!-- 칩 -->
  <rect x="40" y="980" width="140" height="38" rx="19" fill="#E8F0FF"/>
  <text x="110" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">탈락 사유</text>
  <rect x="195" y="980" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="245" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">주의</text>
  <rect x="310" y="980" width="100" height="38" rx="19" fill="#E8F0FF"/>
  <text x="360" y="1005" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">2026</text>
</svg>
