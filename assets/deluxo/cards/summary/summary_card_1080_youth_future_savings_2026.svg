<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="12" fill="url(#accent)"/>

  <!-- Title -->
  <text x="540" y="78" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">청년 미래적금 — 일반형 vs 우대형</text>
  <text x="540" y="118" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">2026년 6월 출시 예정 · 가입 조건 + 정부기여금 비교</text>

  <!-- Divider -->
  <rect x="60" y="136" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- Left card: 일반형 -->
  <rect x="60" y="154" width="450" height="480" rx="20" fill="#1A3270"/>
  <text x="285" y="202" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#EAF2FF" text-anchor="middle">일반형</text>
  <text x="285" y="232" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">정부기여금 6%</text>

  <rect x="100" y="252" width="370" height="2" fill="#2A4A8A"/>

  <text x="285" y="290" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">소득 조건</text>
  <text x="285" y="318" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="middle">개인소득 연 6,000만원 이하</text>
  <text x="285" y="344" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">소상공인: 매출 3억원 이하</text>

  <text x="285" y="384" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">가구 중위소득</text>
  <text x="285" y="412" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="middle">200% 이하</text>

  <text x="285" y="456" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">정부기여금 (월 50만원 기준)</text>
  <text x="285" y="490" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#F59E0B" text-anchor="middle">108만원</text>
  <text x="285" y="514" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">3년 합산</text>

  <text x="285" y="558" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">예상 만기 수령액</text>
  <text x="285" y="592" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">약 2,080만원</text>

  <!-- Right card: 우대형 -->
  <rect x="570" y="154" width="450" height="480" rx="20" fill="#1A3270"/>
  <rect x="570" y="154" width="450" height="480" rx="20" fill="none" stroke="#34D399" stroke-width="3"/>
  <text x="795" y="202" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">우대형</text>
  <text x="795" y="232" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">정부기여금 12%</text>

  <rect x="610" y="252" width="370" height="2" fill="#2A4A8A"/>

  <text x="795" y="290" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">소득 조건</text>
  <text x="795" y="318" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="middle">개인소득 연 3,600만원 이하</text>
  <text x="795" y="344" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">소상공인: 매출 1억원 이하</text>

  <text x="795" y="384" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">가구 중위소득</text>
  <text x="795" y="412" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="middle">150% 이하</text>

  <text x="795" y="456" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">정부기여금 (월 50만원 기준)</text>
  <text x="795" y="490" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399" text-anchor="middle">216만원</text>
  <text x="795" y="514" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">3년 합산 (일반형의 2배)</text>

  <text x="795" y="558" font-family="-apple-system, sans-serif" font-size="17" fill="#A0B4D0" text-anchor="middle">예상 만기 수령액</text>
  <text x="795" y="592" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">약 2,200만원</text>

  <!-- Additional note -->
  <rect x="570" y="620" width="450" height="48" rx="12" fill="#34D399" opacity="0.15"/>
  <text x="795" y="651" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle">중소기업 신규취업자(입사 6개월 이내) 우대 적용 가능</text>

  <!-- Bottom key facts -->
  <rect x="60" y="660" width="960" height="268" rx="20" fill="#0F2348"/>
  <text x="540" y="706" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#F59E0B" text-anchor="middle">공통 조건 및 상품 구조</text>

  <rect x="80" y="720" width="430" height="184" rx="16" fill="#1A3270"/>
  <text x="295" y="760" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">상품 구조</text>
  <text x="295" y="792" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">대상: 만 19~34세 청년</text>
  <text x="295" y="820" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">만기: 3년 / 월 납입: 최대 50만원</text>
  <text x="295" y="848" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">방식: 자유적립식 (매월 조절 가능)</text>
  <text x="295" y="876" font-family="-apple-system, sans-serif" font-size="15" fill="#F59E0B" text-anchor="middle">이자소득 전액 비과세</text>

  <rect x="570" y="720" width="430" height="184" rx="16" fill="#1A3270"/>
  <text x="785" y="760" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">신청 안내</text>
  <text x="785" y="792" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">출시: 2026년 6월 (예정)</text>
  <text x="785" y="820" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">은행: 국민·신한·우리·하나 등</text>
  <text x="785" y="848" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">문의: 서민금융진흥원 ☎ 1397</text>
  <text x="785" y="876" font-family="-apple-system, sans-serif" font-size="15" fill="#F59E0B" text-anchor="middle">청년도약계좌와 중복 가입 불가</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
