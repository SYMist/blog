<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">내 상황에 맞는 신청 경로는?</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="140" width="960" height="110" rx="16" fill="rgba(59,130,246,0.12)"/>
  <text x="100" y="185" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#3B82F6">보험 미가입 + 처음 신청</text>
  <text x="100" y="225" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 근로복지공단 토탈서비스에서 가입+지원 원스톱</text>

  <rect x="60" y="260" width="960" height="110" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="305" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#3B82F6">이미 고용보험 가입 중</text>
  <text x="100" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 소상공인24(sbiz24.kr)에서 환급 신청</text>

  <rect x="60" y="380" width="960" height="110" rx="16" fill="rgba(245,158,11,0.12)"/>
  <text x="100" y="425" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#F59E0B">연 매출 1억 400만 미만</text>
  <text x="100" y="465" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 경영안정 바우처 25만 원 추가 · 4대 보험료 납부 가능</text>

  <rect x="60" y="500" width="960" height="110" rx="16" fill="rgba(16,185,129,0.12)"/>
  <text x="100" y="545" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#10B981">인천·경기·울산 사업장</text>
  <text x="100" y="585" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 지자체 추가 지원금 별도 신청 (중복 수혜 OK)</text>

  <rect x="60" y="620" width="960" height="110" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="100" y="665" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#EAF2FF">1인 소상공인 (무고용)</text>
  <text x="100" y="705" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 건강보험자격득실확인서 → 고용+산재 동시 가입</text>

  <rect x="60" y="740" width="960" height="110" rx="16" fill="rgba(239,68,68,0.12)"/>
  <text x="100" y="785" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#EF4444">폐업을 고려 중</text>
  <text x="100" y="825" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 지금 가입 → 1년 유지 후 비자발적 폐업 시 실업급여</text>

  <rect x="60" y="860" width="960" height="110" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="905" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#8B5CF6">65세 이상</text>
  <text x="100" y="945" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">→ 실업급여 불가 · 고용안정·직업능력개발 지원만 가능</text>

  <rect x="60" y="990" width="960" height="55" rx="16" fill="rgba(59,130,246,0.15)"/>
  <text x="540" y="1025" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#3B82F6">근로복지공단 1588-0075 · 소상공인진흥공단 1357</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>