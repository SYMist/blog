  <rect x="40" y="658" width="310" height="150" rx="16" fill="#1A3270"/>
  <text x="195" y="712" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">사업자등록 기한</text>
  <text x="195" y="766" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">20일</text>
  <text x="195" y="796" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">개시 후 이내</text>

  <rect x="385" y="658" width="310" height="150" rx="16" fill="#1A3270"/>
  <text x="540" y="712" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">청년창업 감면 (비수도권)</text>
  <text x="540" y="766" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">100%</text>
  <text x="540" y="796" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">소득세 5년 감면</text>

  <rect x="730" y="658" width="310" height="150" rx="16" fill="#34D399" opacity="0.2"/>
  <rect x="730" y="658" width="310" height="150" rx="20" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="885" y="712" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle">부가세 무신고 가산세</text>
  <text x="885" y="766" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">20%</text>
  <text x="885" y="796" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">부정 시 40%</text>

  <!-- Footer -->
  <text x="540" y="958" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | hometax.go.kr | nts.go.kr | ☎ 126</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
</svg>
