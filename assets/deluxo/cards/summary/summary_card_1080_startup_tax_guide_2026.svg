  <rect x="40" y="282" width="1000" height="80" rx="8" fill="#1A3270"/>
  <rect x="40" y="282" width="6" height="80" rx="3" fill="#F59E0B"/>
  <text x="130" y="314" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">부가세(일반)</text>
  <text x="130" y="340" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">세율 10%</text>
  <text x="360" y="314" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1월 1~25일</text>
  <text x="360" y="338" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">7월 1~25일</text>
  <text x="570" y="326" font-family="-apple-system, sans-serif" font-size="15" fill="#EAF2FF" text-anchor="middle">일반과세자</text>
  <text x="800" y="326" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">연 2회 확정신고</text>

