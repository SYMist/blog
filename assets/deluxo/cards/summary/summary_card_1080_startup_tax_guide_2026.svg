  <rect x="40" y="458" width="1000" height="80" rx="8" fill="#1A3270"/>
  <rect x="40" y="458" width="6" height="80" rx="3" fill="#34D399"/>
  <text x="130" y="490" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">종합소득세</text>
  <text x="130" y="516" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">청년 100% 감면</text>
  <text x="360" y="490" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5월 1~31일</text>
  <text x="360" y="514" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">(성실신고 6월 30일)</text>
  <text x="570" y="498" font-family="-apple-system, sans-serif" font-size="15" fill="#EAF2FF" text-anchor="middle">모든 사업자</text>
  <text x="800" y="490" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">감면 신청서 필수</text>
  <text x="800" y="512" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">자동 미적용</text>

  <!-- Row 5 — 원천세 -->
  <rect x="40" y="546" width="1000" height="80" rx="8" fill="#0D2347"/>
  <rect x="40" y="546" width="6" height="80" rx="3" fill="#A0B4D0"/>
  <text x="130" y="578" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">원천세</text>
  <text x="130" y="604" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">직원 고용 시</text>
  <text x="360" y="578" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">매월 10일</text>
  <text x="360" y="602" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">(반기납부 1월·7월)</text>
  <text x="570" y="590" font-family="-apple-system, sans-serif" font-size="15" fill="#EAF2FF" text-anchor="middle">직원 있는 사업자</text>
  <text x="800" y="590" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">홈택스 전자신고</text>

