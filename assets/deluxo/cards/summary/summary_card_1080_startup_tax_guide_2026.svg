  <text x="130" y="428" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">세율 1.5~4%</text>
  <text x="360" y="414" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1월 1~25일</text>
  <text x="570" y="414" font-family="-apple-system, sans-serif" font-size="15" fill="#EAF2FF" text-anchor="middle">간이과세자</text>
  <text x="800" y="414" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">연 1회 (전년도 전체)</text>

