<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#F59E0B"/>

  <!-- Title -->
  <text x="540" y="72" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#F59E0B" text-anchor="middle">소상공인 창업 초기 세금 신고 일정 총정리</text>
  <text x="540" y="110" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#A0B4D0" text-anchor="middle">사업자등록 · 부가세 · 종소세 · 원천세 한눈에</text>

  <!-- Header Row -->
  <rect x="40" y="142" width="1000" height="48" rx="8" fill="#1A3270"/>
  <text x="130" y="173" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F59E0B" text-anchor="middle">세금 종류</text>
  <text x="360" y="173" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F59E0B" text-anchor="middle">신고 기한</text>
  <text x="570" y="173" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F59E0B" text-anchor="middle">대상</text>
  <text x="800" y="173" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F59E0B" text-anchor="middle">비고</text>

  <!-- Row 1 — 사업자등록 -->
  <rect x="40" y="194" width="1000" height="80" rx="8" fill="#0D2347"/>
  <rect x="40" y="194" width="6" height="80" rx="3" fill="#34D399"/>
  <text x="130" y="226" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">사업자등록</text>
  <text x="130" y="252" font-family="-apple-system, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">홈택스·세무서</text>
  <text x="360" y="226" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">사업 개시 전 또는</text>
  <text x="360" y="250" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">개시 후 20일 이내</text>
  <text x="570" y="238" font-family="-apple-system, sans-serif" font-size="15" fill="#EAF2FF" text-anchor="middle">모든 사업자</text>
  <text x="800" y="230" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">초과 시 매입세액</text>
  <text x="800" y="252" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">공제 불가 위험</text>

