<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">사업용 자동차 실수 TOP 5</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <rect x="60" y="120" width="960" height="160" rx="16" fill="rgba(239,68,68,0.1)"/>
  <rect x="80" y="140" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="174" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">1</text>
  <text x="150" y="168" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">업무전용보험 미가입 → 비용 0%</text>
  <text x="150" y="200" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">복식부기의무자 필수 — 미가입 시 차량 비용 전액 불인정</text>
  <rect x="150" y="216" width="280" height="28" rx="14" fill="rgba(245,158,11,0.2)"/>
  <text x="290" y="236" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="15" font-weight="700" fill="#F59E0B">매년 수백만 원 세금 손해</text>
  <text x="150" y="264" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">✓ 대안: 임직원만 운전 가능한 보험 즉시 가입</text>

  <rect x="60" y="296" width="960" height="160" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="316" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="350" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">2</text>
  <text x="150" y="344" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">리스로 경차 취득 → 부가세 환급 불가</text>
  <text x="150" y="376" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">리스는 면세 계산서 발행 → 환급받을 세액 자체가 없음</text>
  <rect x="150" y="392" width="320" height="28" rx="14" fill="rgba(245,158,11,0.2)"/>
  <text x="310" y="412" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="15" font-weight="700" fill="#F59E0B">연간 약 40만 원 환급 기회 상실</text>
  <text x="150" y="440" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">✓ 대안: 경차·승합·화물 = 렌트 또는 할부 선택</text>

  <rect x="60" y="472" width="960" height="160" rx="16" fill="rgba(239,68,68,0.1)"/>
  <rect x="80" y="492" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="526" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">3</text>
  <text x="150" y="520" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">할부 구매 후 DSR에 걸려 대출 한도↓</text>
  <text x="150" y="552" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">자동차 할부 = 기타 대출 → 주담대·신용대출 한도 잠식</text>
  <rect x="150" y="568" width="300" height="28" rx="14" fill="rgba(245,158,11,0.2)"/>
  <text x="300" y="588" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="15" font-weight="700" fill="#F59E0B">대출 한도 최대 1.2억 축소 가능</text>
  <text x="150" y="616" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">✓ 대안: 대출 계획 있으면 렌트(부채 미인식) 먼저 검토</text>

  <rect x="60" y="648" width="960" height="160" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="668" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="702" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">4</text>
  <text x="150" y="696" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">운행기록부 없이 1,500만 원 초과 청구</text>
  <text x="150" y="728" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">1,500만 원 초과분 불인정 + 비용 명세서 허위 시 1% 가산세</text>
  <rect x="150" y="744" width="280" height="28" rx="14" fill="rgba(245,158,11,0.2)"/>
  <text x="290" y="764" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="15" font-weight="700" fill="#F59E0B">국세청 서식 다운로드 → 매일 기록</text>
  <text x="150" y="792" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">✓ 대안: 엑셀/앱으로 일자·거리·업무내용 꼼꼼히 기록</text>

  <rect x="60" y="824" width="960" height="160" rx="16" fill="rgba(239,68,68,0.1)"/>
  <rect x="80" y="844" width="50" height="50" rx="25" fill="#EF4444"/>
  <text x="105" y="878" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">5</text>
  <text x="150" y="872" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">연두색 번호판 피하려고 할인 가액 맞추기</text>
  <text x="150" y="904" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">공급가액·기준가격 중 높은 금액 기준 → 할인해도 적용</text>
  <rect x="150" y="920" width="340" height="28" rx="14" fill="rgba(245,158,11,0.2)"/>
  <text x="320" y="940" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="15" font-weight="700" fill="#F59E0B">적발 시 세무조사 + 비용 인정 거부 위험</text>
  <text x="150" y="968" font-family="'Pretendard',sans-serif" font-size="16" fill="#F59E0B">✓ 대안: 경차·9인승+·화물차는 연두색 제외 대상</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>