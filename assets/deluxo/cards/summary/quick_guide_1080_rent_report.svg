<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="72" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">나는 해당? 전월세 신고 10초 판단</text>
  <rect x="60" y="96" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- YES cases -->
  <text x="80" y="150" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#22C55E">✅ 신고 대상</text>

  <rect x="60" y="170" width="960" height="110" rx="20" fill="rgba(34,197,94,0.08)"/>
  <text x="80" y="210" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">보증금 7,000만 원 + 월세 0원</text>
  <text x="80" y="250" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">→ 보증금 6,000만 원 초과 → 신고 대상</text>

  <rect x="60" y="295" width="960" height="110" rx="20" fill="rgba(34,197,94,0.08)"/>
  <text x="80" y="335" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">보증금 3,000만 원 + 월세 50만 원</text>
  <text x="80" y="375" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">→ 월세 30만 원 초과 → 신고 대상</text>

  <rect x="60" y="420" width="960" height="110" rx="20" fill="rgba(34,197,94,0.08)"/>
  <text x="80" y="460" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">보증금 500만 원 인상하여 갱신</text>
  <text x="80" y="500" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">→ 금액 변동 = 30일 이내 재신고</text>

  <!-- NO cases -->
  <text x="80" y="575" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#EF4444">❌ 신고 대상 아님</text>

  <rect x="60" y="595" width="960" height="110" rx="20" fill="rgba(239,68,68,0.06)"/>
  <text x="80" y="635" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">보증금 5,000만 원 + 월세 25만 원</text>
  <text x="80" y="675" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">→ 보증금·월세 모두 기준 이하</text>

  <rect x="60" y="720" width="960" height="110" rx="20" fill="rgba(239,68,68,0.06)"/>
  <text x="80" y="760" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">같은 조건으로 재계약 (금액 변동 없음)</text>
  <text x="80" y="800" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">→ 금액 변동 없으면 제외</text>

  <rect x="60" y="845" width="960" height="110" rx="20" fill="rgba(239,68,68,0.06)"/>
  <text x="80" y="885" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">묵시적 갱신 (아무 통지 없이 연장)</text>
  <text x="80" y="925" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#EAF2FF">→ 묵시적 갱신 = 신고 대상 아님</text>

  <rect x="60" y="980" width="960" height="60" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="1018" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#F59E0B">기준: 보증금 6,000만 원↑ 또는 월세 30만 원↑ → 30일 이내 신고</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>
