<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#accent)"/>

  <!-- Title -->
  <text x="60" y="88" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF">2026년 4대보험</text>
  <text x="60" y="136" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#F59E0B">요율 비교표</text>

  <!-- Divider -->
  <rect x="60" y="158" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- 국민연금 -->
  <rect x="60" y="186" width="960" height="174" rx="16" fill="#1A3270"/>
  <text x="90" y="232" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">국민연금</text>
  <!-- bar -->
  <rect x="90" y="248" width="880" height="8" rx="4" fill="#0A1A35"/>
  <rect x="90" y="248" width="880" height="8" rx="4" fill="#F59E0B"/>
  <!-- numbers -->
  <text x="90" y="296" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">전체 요율</text>
  <text x="90" y="326" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">9.5%</text>
  <text x="430" y="296" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">사업자 부담</text>
  <text x="430" y="326" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#F59E0B">4.75%</text>
  <text x="740" y="296" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">근로자 부담</text>
  <text x="740" y="326" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#EAF2FF">4.75%</text>
  <text x="90" y="350" font-family="-apple-system, sans-serif" font-size="15" fill="#6B8AB0">기준소득월액 상한: 637만 원 (2026년)</text>

  <!-- 건강보험 -->
  <rect x="60" y="374" width="960" height="174" rx="16" fill="#1A3270"/>
  <text x="90" y="420" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">건강보험</text>
  <rect x="90" y="436" width="880" height="8" rx="4" fill="#0A1A35"/>
  <rect x="90" y="436" width="790" height="8" rx="4" fill="#34D399"/>
  <text x="90" y="484" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">전체 요율</text>
  <text x="90" y="514" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">7.19%</text>
  <text x="430" y="484" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">사업자 부담</text>
  <text x="430" y="514" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#F59E0B">3.595%</text>
  <text x="740" y="484" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">근로자 부담</text>
  <text x="740" y="514" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#EAF2FF">3.595%</text>
  <text x="90" y="538" font-family="-apple-system, sans-serif" font-size="15" fill="#6B8AB0">장기요양보험료 포함 시 약 7.98%</text>

  <!-- 고용보험 -->
  <rect x="60" y="562" width="460" height="174" rx="16" fill="#1A3270"/>
  <text x="90" y="608" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">고용보험</text>
  <rect x="90" y="624" width="400" height="8" rx="4" fill="#0A1A35"/>
  <rect x="90" y="624" width="200" height="8" rx="4" fill="#60A5FA"/>
  <text x="90" y="672" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">전체 요율</text>
  <text x="90" y="706" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">1.8%</text>
  <text x="90" y="730" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0">사업자 1.15% / 근로자 0.9% (150인 미만)</text>

  <!-- 산재보험 -->
  <rect x="560" y="562" width="460" height="174" rx="16" fill="#1D3A60"/>
  <text x="590" y="608" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">산재보험</text>
  <rect x="590" y="624" width="400" height="8" rx="4" fill="#0A1A35"/>
  <rect x="590" y="624" width="120" height="8" rx="4" fill="#FBBF24"/>
  <text x="590" y="672" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0">업종별 상이</text>
  <text x="590" y="706" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">사업자 전액</text>
  <text x="590" y="730" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0">근로자 부담 없음 · 가족 직원도 동일</text>

  <!-- Notice -->
  <rect x="60" y="756" width="960" height="80" rx="14" fill="#2D1F00"/>
  <text x="540" y="796" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="middle">⚠ 배우자·동거 직계가족은 고용보험·산재보험 가입 불가</text>
  <text x="540" y="824" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">비동거 친족은 일반 직원과 동일하게 4대보험 전부 가입 가능</text>

  <!-- Bottom note -->
  <text x="540" y="900" font-family="-apple-system, sans-serif" font-size="16" fill="#6B8AB0" text-anchor="middle">2026년 현행 기준 · 향후 요율 변동 가능</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
