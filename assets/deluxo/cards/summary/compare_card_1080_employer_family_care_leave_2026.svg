  <text x="293" y="296" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">신청서 접수 확인</text>

  <rect x="554" y="236" width="466" height="80" rx="10" fill="#112240"/>
  <text x="787" y="268" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#A0B4D0" text-anchor="middle">STEP 1</text>
  <text x="787" y="296" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">신청서 접수 확인</text>

  <!-- 단계 2 -->
  <rect x="60" y="328" width="466" height="80" rx="10" fill="#0F1E3A"/>
  <text x="293" y="360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#A0B4D0" text-anchor="middle">STEP 2</text>
  <text x="293" y="388" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">예외 사유 없음 확인</text>

  <rect x="554" y="328" width="466" height="80" rx="10" fill="#0F1E3A"/>
  <text x="787" y="360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#A0B4D0" text-anchor="middle">STEP 2</text>
