<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#accent)"/>

  <!-- Title -->
  <text x="60" y="88" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF">세무조사 실수</text>
  <text x="60" y="136" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#F87171">TOP5 — 절대 하지 말 것</text>

  <!-- Divider -->
  <rect x="60" y="158" width="960" height="3" fill="#EF4444" rx="2"/>

  <!-- Mistake 1 -->
  <rect x="60" y="182" width="960" height="148" rx="14" fill="#2D1515"/>
  <rect x="60" y="182" width="8" height="148" rx="4" fill="#EF4444"/>
  <text x="96" y="228" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#F87171">01</text>
  <text x="200" y="228" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F87171">허위 직원 등록</text>
  <text x="200" y="260" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">실제 근무하지 않는 가족을 직원으로 등록</text>
  <text x="200" y="308" font-family="-apple-system, sans-serif" font-size="16" fill="#FCA5A5">→ 인건비 전액 부인 + 부정행위 가산세 40% + 형사처벌 위험</text>

  <!-- Mistake 2 -->
  <rect x="60" y="344" width="960" height="148" rx="14" fill="#2D1515"/>
  <rect x="60" y="344" width="8" height="148" rx="4" fill="#EF4444"/>
  <text x="96" y="390" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#F87171">02</text>
  <text x="200" y="390" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F87171">사업주 본인 급여 비용처리</text>
  <text x="200" y="422" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">개인사업자가 본인 급여를 필요경비로 처리</text>
  <text x="200" y="470" font-family="-apple-system, sans-serif" font-size="16" fill="#FCA5A5">→ 전액 부인 + 소득세 재계산 + 가산세 10~40%</text>

  <!-- Mistake 3 -->
  <rect x="60" y="506" width="960" height="148" rx="14" fill="#2D1515"/>
  <rect x="60" y="506" width="8" height="148" rx="4" fill="#F59E0B"/>
  <text x="96" y="552" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#FBBF24">03</text>
  <text x="200" y="552" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FBBF24">배우자 고용보험·산재보험 가입</text>
  <text x="200" y="584" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">동거 여부 무관하게 배우자는 고용·산재 가입 불가</text>
  <text x="200" y="632" font-family="-apple-system, sans-serif" font-size="16" fill="#FCA5A5">→ 납부한 보험료 환급 문제 + 급여 지급 시 공단 확인 요구</text>

  <!-- Mistake 4 -->
  <rect x="60" y="668" width="460" height="148" rx="14" fill="#2D1515"/>
  <rect x="60" y="668" width="8" height="148" rx="4" fill="#F59E0B"/>
  <text x="96" y="714" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#FBBF24">04</text>
  <text x="200" y="714" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FBBF24">원천세 신고 누락</text>
  <text x="96" y="762" font-family="-apple-system, sans-serif" font-size="16" fill="#EAF2FF">다음 달 10일 기한 초과</text>
  <text x="96" y="796" font-family="-apple-system, sans-serif" font-size="15" fill="#FCA5A5">→ 10~20% 가산세</text>

  <!-- Mistake 5 -->
  <rect x="560" y="668" width="460" height="148" rx="14" fill="#2D1515"/>
  <rect x="560" y="668" width="8" height="148" rx="4" fill="#F59E0B"/>
  <text x="596" y="714" font-family="-apple-system, sans-serif" font-size="48" font-weight="900" fill="#FBBF24">05</text>
  <text x="700" y="714" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FBBF24">과도한 급여 설정</text>
  <text x="596" y="762" font-family="-apple-system, sans-serif" font-size="16" fill="#EAF2FF">시가 대비 5% 또는 3억 이상</text>
  <text x="596" y="796" font-family="-apple-system, sans-serif" font-size="15" fill="#FCA5A5">→ 부당행위계산부인</text>

  <!-- Bottom -->
  <rect x="60" y="836" width="960" height="60" rx="12" fill="#0A1A35"/>
  <text x="540" y="873" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#EAF2FF" text-anchor="middle">근로계약서 없이 현금 지급 시 세무조사 즉시 인건비 부인 → 계좌이체 필수</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
