  <rect x="60" y="385" width="440" height="2" fill="rgba(255,255,255,0.15)"/>
  <text x="280" y="420" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">특약 조합</text>
  <text x="280" y="455" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="18" font-weight="600" fill="#EAF2FF">마일리지+UBI+커넥티드카</text>
  <rect x="560" y="330" width="480" height="150" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="800" y="370" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#F59E0B">핵심 절감</text>
