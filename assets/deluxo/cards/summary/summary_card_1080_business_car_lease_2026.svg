  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="140" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#F59E0B" text-anchor="middle">2026 사업자 차량 총정리</text>

  <text x="540" y="230" font-family="'Pretendard', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle">리스·렌트·장기렌트</text>
  <text x="540" y="310" font-family="'Pretendard', sans-serif" font-size="44" font-weight="600" fill="#EAF2FF" text-anchor="middle">한 번에 정리</text>

  <rect x="60" y="380" width="310" height="240" rx="24" fill="#1A3270"/>
  <text x="215" y="435" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">비용 한도</text>
  <text x="215" y="500" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">연 1,500만</text>
  <text x="215" y="548" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF" text-anchor="middle">운행기록부 ✕ 정액</text>
  <text x="215" y="590" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#EAF2FF" text-anchor="middle">감가상각 800만 별도</text>

  <rect x="385" y="380" width="310" height="240" rx="24" fill="#1A3270"/>
  <text x="540" y="435" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">부가세 환급</text>
  <text x="540" y="500" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">연 96만</text>
  <text x="540" y="548" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF" text-anchor="middle">장기렌트 환급차량</text>
  <text x="540" y="590" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#EAF2FF" text-anchor="middle">9인승·경차·화물·영업</text>

  <rect x="710" y="380" width="310" height="240" rx="24" fill="#1A3270"/>
  <text x="865" y="435" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">절세 효과</text>
  <text x="865" y="500" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">1,048만</text>
  <text x="865" y="548" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF" text-anchor="middle">36개월 누적</text>
