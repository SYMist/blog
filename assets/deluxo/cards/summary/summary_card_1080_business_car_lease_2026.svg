  <text x="540" y="705" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#0B1F3B" text-anchor="middle">2026 복식부기의무자 업무전용 보험 필수</text>
  <text x="540" y="745" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">미가입 시 차량비용 100% 부인 (한도도 ✕)</text>

  <rect x="60" y="790" width="300" height="80" rx="16" fill="#10B981"/>
  <text x="210" y="840" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">금융리스 인수형</text>

