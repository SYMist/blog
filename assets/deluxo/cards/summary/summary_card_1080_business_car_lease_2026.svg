  <text x="540" y="950" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">전기차 보조금 최대 580만 + 지자체 별도</text>
  <text x="540" y="1000" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF" text-anchor="middle">취득세 140만 면제 · 자동차세 13만 정액</text>
