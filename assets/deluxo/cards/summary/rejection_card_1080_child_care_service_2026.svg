<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="130" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#EF4444" text-anchor="middle">⚠ 탈락·환수 사유 TOP 5</text>
  <text x="540" y="210" font-family="'Pretendard', sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">이것만은 피하세요</text>

  <rect x="60" y="270" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="325" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">① 양육공백 증빙 부족</text>
  <text x="100" y="375" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">한쪽만 직장가입자 + 사유 미입증 → 자격 거절</text>

  <rect x="60" y="430" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="485" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">② 소득 초과 (중위 250% 초과)</text>
  <text x="100" y="535" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">마형 분류 → 정부지원 0, 시간당 12,790원 전액</text>

  <rect x="60" y="590" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="645" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">③ 친·인척 위탁 형태 운영</text>
  <text x="100" y="695" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">무관계 외부 인력 원칙 위반 → 환수·재신청 제한</text>

  <rect x="60" y="750" width="960" height="140" rx="20" fill="#1A3270"/>
  <text x="100" y="805" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#EF4444">④ 보육료와 중복 수급</text>
  <text x="100" y="855" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">어린이집 보육료 + 동시간대 아이돌봄 → 환수</text>

  <rect x="60" y="910" width="960" height="140" rx="20" fill="#F59E0B"/>
  <text x="100" y="965" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#0B1F3B">⑤ 소득재판정 누락</text>
  <text x="100" y="1015" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0B1F3B">2026.1 미신청 → 2.1부터 정부지원 자동 중단</text>
</svg>
