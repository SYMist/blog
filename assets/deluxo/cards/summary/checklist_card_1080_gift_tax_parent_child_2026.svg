<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="60" width="960" height="110" rx="16" fill="#0D2347"/>
  <text x="540" y="108" font-family="-apple-system, sans-serif" font-size="38" font-weight="700" fill="#34D399" text-anchor="middle">증여 신고 체크리스트</text>
  <text x="540" y="148" font-family="-apple-system, sans-serif" font-size="26" fill="#A0B4D0" text-anchor="middle">이 순서대로 진행하면 실수 없이 완료</text>

  <!-- Step 1 -->
  <rect x="60" y="200" width="960" height="100" rx="12" fill="#0D2347"/>
  <circle cx="116" cy="250" r="28" fill="#34D399"/>
  <text x="116" y="258" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">1</text>
  <text x="165" y="240" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">증여계약서 작성</text>
  <text x="165" y="274" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">증여자·수증자 서명 / 공증 권장 (선택사항) / 소요 약 1일</text>

  <!-- Step 2 -->
  <rect x="60" y="314" width="960" height="100" rx="12" fill="#1A3270"/>
  <circle cx="116" cy="364" r="28" fill="#60A5FA"/>
  <text x="116" y="372" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">2</text>
  <text x="165" y="354" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">소유권이전등기 신청</text>
  <text x="165" y="388" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">법무사 대행 또는 직접 신청 / 등기소 방문 / 약 1~3 영업일</text>

  <!-- Step 3 -->
  <rect x="60" y="428" width="960" height="100" rx="12" fill="#0D2347"/>
  <circle cx="116" cy="478" r="28" fill="#34D399"/>
  <text x="116" y="486" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">3</text>
  <text x="165" y="468" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">홈택스 증여세 신고</text>
  <text x="165" y="502" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">hometax.go.kr / 증여일 속한 달 말일 + 3개월 이내 / 온라인 즉시 처리</text>

  <!-- Step 4 -->
  <rect x="60" y="542" width="960" height="100" rx="12" fill="#1A3270"/>
  <circle cx="116" cy="592" r="28" fill="#F59E0B"/>
  <text x="116" y="600" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">4</text>
  <text x="165" y="582" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">증여세 납부</text>
  <text x="165" y="616" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">신고와 동시 납부 / 1,000만원 초과 시 2개월 내 분납 가능</text>

  <!-- Step 5 -->
  <rect x="60" y="656" width="960" height="100" rx="12" fill="#0D2347"/>
  <circle cx="116" cy="706" r="28" fill="#34D399"/>
  <text x="116" y="714" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#0B1F3B" text-anchor="middle">5</text>
  <text x="165" y="696" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">취득세 신고·납부</text>
  <text x="165" y="730" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">위택스 또는 시·군·구청 / 취득일(등기일) 후 60일 이내 / 3.5~12%</text>

  <!-- Summary box -->
  <rect x="60" y="776" width="960" height="80" rx="12" fill="#34D399" opacity="0.15"/>
  <rect x="60" y="776" width="4" height="80" rx="2" fill="#34D399"/>
  <text x="100" y="808" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#34D399">전체 소요 기간: 약 2~4주 (등기 포함)</text>
  <text x="100" y="840" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0">자진신고 3% 감면 혜택 — 기한 내 신고가 절세 첫 번째 단계</text>

  <!-- Key reminder -->
  <rect x="60" y="876" width="960" height="64" rx="12" fill="#1A3270"/>
  <text x="540" y="904" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">신고 기한 초과 시 신고불성실 가산세 20% 부과 → 자진신고 기한 엄수</text>
  <text x="540" y="932" font-family="-apple-system, sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">홈택스 hometax.go.kr · 국세청 nts.go.kr</text>

  <!-- Footer -->
  <text x="540" y="1000" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">deluxo.co.kr</text>
  <text x="540" y="1036" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">증여 신고 체크리스트 | 2026년 최신</text>
</svg>
