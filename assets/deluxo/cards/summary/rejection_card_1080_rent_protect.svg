<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="260" height="44" rx="22" fill="#DC2626"/>
  <text x="190" y="79" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">신청 실패 TOP 5</text>

  <!-- 메인 제목 -->
  <text x="60" y="150" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">소상공인 임대료 지원</text>
  <text x="60" y="210" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">이것 때문에 탈락합니다</text>

  <!-- 구분선 -->
  <rect x="60" y="240" width="120" height="4" rx="2" fill="#DC2626"/>

  <!-- Item 1 -->
  <rect x="60" y="280" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <circle cx="110" cy="340" r="30" fill="#DC2626"/>
  <text x="110" y="350" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">1</text>
  <text x="160" y="325" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">매출 기준 초과</text>
  <text x="160" y="365" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">바우처 1억 400만 원 기준 — 매출액 확인 필수</text>

  <!-- Item 2 -->
  <rect x="60" y="420" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <circle cx="110" cy="480" r="30" fill="#DC2626"/>
  <text x="110" y="490" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">2</text>
  <text x="160" y="465" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">소상공인 확인서 미발급</text>
  <text x="160" y="505" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">대부분 지원 신청 시 필수 첨부 서류</text>

  <!-- Item 3 -->
  <rect x="60" y="560" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <circle cx="110" cy="620" r="30" fill="#DC2626"/>
  <text x="110" y="630" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">3</text>
  <text x="160" y="605" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">환산보증금 초과</text>
  <text x="160" y="645" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">상가임대차보호법 보호 범위 밖 — 지역별 기준 확인</text>

  <!-- Item 4 -->
  <rect x="60" y="700" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <circle cx="110" cy="760" r="30" fill="#DC2626"/>
  <text x="110" y="770" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">4</text>
  <text x="160" y="745" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">착한 임대인 사후 인상</text>
  <text x="160" y="785" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">5% 초과 인상 시 세액공제 추징 — 인하 후 동결 유지</text>

  <!-- Item 5 -->
  <rect x="60" y="840" width="960" height="120" rx="16" fill="rgba(255,255,255,0.08)"/>
  <circle cx="110" cy="900" r="30" fill="#DC2626"/>
  <text x="110" y="910" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">5</text>
  <text x="160" y="885" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">자가 건물 폐업</text>
  <text x="160" y="925" font-family="'Pretendard',sans-serif" font-size="19" font-weight="600" fill="#EAF2FF">점포 철거비 대상 제외 — 임차인만 신청 가능</text>

  <!-- 칩 -->
  <rect x="60" y="990" width="140" height="40" rx="20" fill="#E8F0FF"/>
  <text x="130" y="1017" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">실패사유</text>
  <rect x="220" y="990" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="270" y="1017" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">주의</text>
  <rect x="340" y="990" width="100" height="40" rx="20" fill="#E8F0FF"/>
  <text x="390" y="1017" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">2026</text>
</svg>
