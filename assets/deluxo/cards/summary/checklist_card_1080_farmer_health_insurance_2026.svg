<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 레이블 -->
  <rect x="60" y="52" width="280" height="44" rx="22" fill="#34D399" opacity="0.18"/>
  <text x="200" y="80" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">신청 전 1분 체크리스트</text>

  <!-- 제목 -->
  <text x="540" y="158" font-family="-apple-system,sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" text-anchor="middle">농어업인 건강보험료 지원 체크리스트</text>
  <text x="540" y="210" font-family="-apple-system,sans-serif" font-size="32" font-weight="600" fill="#A0B4D0" text-anchor="middle">이것만 확인하면 지원받을 수 있습니다 (2026)</text>

  <line x1="60" y1="236" x2="1020" y2="236" stroke="#1A3270" stroke-width="2"/>

  <!-- 체크 항목들 -->
  <!-- 1 -->
  <rect x="60" y="252" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="252" width="4" height="72" rx="2" fill="#34D399"/>
  <text x="84" y="282" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ 건강보험 지역가입자 확인</text>
  <text x="84" y="312" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">직장가입자이면 해당 없음 — 퇴직·지역전환 후 신청</text>

  <!-- 2 -->
  <rect x="60" y="334" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="334" width="4" height="72" rx="2" fill="#34D399"/>
  <text x="84" y="364" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ 농촌·준농촌 지역(군·읍·면) 거주 확인</text>
  <text x="84" y="394" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">주민등록상 주소 기준 / 동 지역은 22% 자동 경감 해당 안 됨</text>

  <!-- 3 -->
  <rect x="60" y="416" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="416" width="4" height="72" rx="2" fill="#34D399"/>
  <text x="84" y="446" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ 농업·축산·임업 종사 확인</text>
  <text x="84" y="476" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">어업인은 수협·해양수산부 별도 지원 확인 필요</text>

  <!-- 4 -->
  <rect x="60" y="498" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="498" width="4" height="72" rx="2" fill="#F59E0B"/>
  <text x="84" y="528" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ 월 보험료 부과액 528,970원 미만 확인</text>
  <text x="84" y="558" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">이상이면 22% 자동 경감만 적용 (28% 국고지원 제외)</text>

  <!-- 5 -->
  <rect x="60" y="580" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="580" width="4" height="72" rx="2" fill="#34D399"/>
  <text x="84" y="610" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ 농어업경영체 등록 여부 확인</text>
  <text x="84" y="640" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">등록자 → 공단 직접 신청 가능 / 미등록자 → 읍면동 방문 먼저</text>

  <!-- 6 -->
  <rect x="60" y="662" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="662" width="4" height="72" rx="2" fill="#34D399"/>
  <text x="84" y="692" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ 신청서 + 농어업경영체 등록 확인서 준비</text>
  <text x="84" y="722" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">미등록자는 읍면동장 확인서도 필요</text>

  <!-- 7 -->
  <rect x="60" y="744" width="960" height="72" rx="12" fill="#0D2347"/>
  <rect x="60" y="744" width="4" height="72" rx="2" fill="#F59E0B"/>
  <text x="84" y="774" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">☑ "6개월 소급 신청"도 함께 요청</text>
  <text x="84" y="804" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0">공단 방문 시 명확히 요청해야 소급분이 함께 처리됨</text>

  <!-- 결과 -->
  <rect x="60" y="834" width="960" height="80" rx="14" fill="#34D399" opacity="0.12"/>
  <rect x="60" y="834" width="4" height="80" rx="2" fill="#34D399"/>
  <text x="540" y="870" font-family="-apple-system,sans-serif" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">7개 모두 ☑ → 지금 바로 신청하세요!</text>
  <text x="540" y="902" font-family="-apple-system,sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">국민건강보험공단 ☎ 1577-1000 | 정부24 신청</text>

  <text x="540" y="1036" font-family="-apple-system,sans-serif" font-size="20" fill="#4B6080" text-anchor="middle">정부24·국민건강보험공단 기준 | 2026.05 기준</text>
</svg>
