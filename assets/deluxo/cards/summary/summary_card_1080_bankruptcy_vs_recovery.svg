<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">개인파산 vs 개인회생 핵심 비교</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 개인회생 -->
  <rect x="60" y="140" width="460" height="820" rx="20" fill="rgba(232,240,255,0.08)"/>
  <rect x="80" y="160" width="180" height="44" rx="22" fill="#E8F0FF"/>
  <text x="170" y="190" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#1D4ED8">개인회생</text>

  <text x="80" y="245" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">채무 처리</text>
  <text x="80" y="275" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">3~5년 일부 변제 → 나머지 탕감</text>
  <text x="80" y="330" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">소득 요건</text>
  <text x="80" y="360" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">정기 소득 필수</text>
  <text x="80" y="415" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">채무 한도</text>
  <text x="80" y="445" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">무담보 10억 / 담보 15억 이하</text>
  <text x="80" y="500" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">재산</text>
  <text x="80" y="530" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#22C55E">유지 가능</text>
  <text x="80" y="585" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">직업 제한</text>
  <text x="80" y="615" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#22C55E">없음</text>
  <text x="80" y="670" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">도박 채무</text>
  <text x="80" y="700" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#22C55E">신청 가능</text>
  <text x="80" y="755" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">소요 기간</text>
  <text x="80" y="785" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">인가 3~6개월 + 변제 3~5년</text>

  <rect x="80" y="830" width="420" height="60" rx="12" fill="rgba(232,240,255,0.12)"/>
  <text x="290" y="868" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">소득 있고 재산 지키고 싶을 때</text>

  <!-- 개인파산 -->
  <rect x="560" y="140" width="460" height="820" rx="20" fill="rgba(245,158,11,0.08)"/>
  <rect x="580" y="160" width="180" height="44" rx="22" fill="#F59E0B"/>
  <text x="670" y="190" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#0B1F3B">개인파산</text>

  <text x="580" y="245" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">채무 처리</text>
  <text x="580" y="275" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">재산 청산 → 배당 → 면책</text>
  <text x="580" y="330" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">소득 요건</text>
  <text x="580" y="360" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">소득 없어도 가능</text>
  <text x="580" y="415" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">채무 한도</text>
  <text x="580" y="445" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">제한 없음</text>
  <text x="580" y="500" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">재산</text>
  <text x="580" y="530" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#EF4444">처분 (관리권 상실)</text>
  <text x="580" y="585" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">직업 제한</text>
  <text x="580" y="615" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#EF4444">일부 전문직·공무원 제한</text>
  <text x="580" y="670" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">도박 채무</text>
  <text x="580" y="700" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#EF4444">면책 불허 가능</text>
  <text x="580" y="755" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">소요 기간</text>
  <text x="580" y="785" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">면책까지 6개월~1년</text>

  <rect x="580" y="830" width="420" height="60" rx="12" fill="rgba(245,158,11,0.12)"/>
  <text x="790" y="868" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">소득 없고 빨리 끝내고 싶을 때</text>

  <rect x="60" y="990" width="960" height="6" rx="3" fill="#F59E0B"/>
  <text x="540" y="1050" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">2026년 기준 · louisville blog</text>
</svg>
