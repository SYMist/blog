<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">서울시 소상공인 지원 한눈에 보기</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 종합지원 -->
  <rect x="60" y="140" width="960" height="260" rx="20" fill="rgba(255,255,255,0.06)"/>
  <rect x="80" y="160" width="160" height="44" rx="22" fill="#3B82F6"/>
  <text x="160" y="190" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">종합지원</text>
  <text x="260" y="190" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">315억원 · 2.4만명</text>

  <text x="100" y="240" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">창업</text>
  <text x="160" y="240" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">스타트업 300만 / 특화 200만 / 청년 250만 / 시니어 250만</text>
  <text x="100" y="275" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">성장</text>
  <text x="160" y="275" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">디지털전환 300만+100만 / 프리랜서 온 플랫폼</text>
  <text x="100" y="310" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">위기</text>
  <text x="160" y="310" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">위기극복 300만 / 폐업 300만</text>
  <text x="100" y="345" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">재도전</text>
  <text x="190" y="345" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">재기지원 200만</text>
  <text x="100" y="380" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">총 8개 사업 · 사업별 별도 접수</text>

  <!-- 금융지원 -->
  <rect x="60" y="420" width="960" height="240" rx="20" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="440" width="160" height="44" rx="22" fill="#10B981"/>
  <text x="160" y="470" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">금융지원</text>
  <text x="260" y="470" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">2조 7,000억원</text>

  <text x="100" y="520" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">직접융자</text>
  <text x="240" y="520" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">고정금리 · 업체당 최대 5억(일부 10억)</text>
  <text x="100" y="555" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">시중은행 협력</text>
  <text x="300" y="555" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">변동금리 · 시중금리 대비 0.3~1.5%p↓</text>
  <text x="100" y="590" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#FFF">안심통장</text>
  <text x="240" y="590" font-family="'Pretendard',sans-serif" font-size="18" fill="#EAF2FF">마이너스통장 · 최대 1,000만 · 연 4%대</text>
  <text x="100" y="635" font-family="'Pretendard',sans-serif" font-size="18" font-weight="700" fill="#F59E0B">서울신용보증재단 보증 연계 가능</text>

  <!-- 핵심 포인트 -->
  <rect x="60" y="680" width="960" height="160" rx="20" fill="rgba(245,158,11,0.12)"/>
  <text x="540" y="730" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#F59E0B">2026년 주요 변경 사항</text>
  <text x="100" y="775" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">· 디지털전환 대상 250명 → 500명 확대</text>
  <text x="100" y="810" font-family="'Pretendard',sans-serif" font-size="22" fill="#FFF">· 안심통장 금리 추가 인하 (4%대 진입)</text>

  <!-- 신청 기간 -->
  <rect x="60" y="870" width="960" height="160" rx="20" fill="rgba(255,255,255,0.06)"/>
  <text x="100" y="920" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">신청 채널</text>
  <text x="100" y="960" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">종합지원 → 서울시 소상공인 종합지원 포털</text>
  <text x="100" y="995" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">금융지원 → 서울신용보증재단 / 시중은행 지점 방문</text>
</svg>