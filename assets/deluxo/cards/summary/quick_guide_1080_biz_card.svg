<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="50" width="180" height="44" rx="22" fill="#F59E0B"/>
  <text x="150" y="79" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#0B1F3B">업종별 추천</text>

  <!-- Title -->
  <text x="60" y="150" font-family="'Pretendard', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">내 업종에 맞는 카드 10초 판단</text>

  <!-- Divider -->
  <line x1="60" y1="178" x2="1020" y2="178" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Row 1 -->
  <rect x="60" y="220" width="960" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="100" y="275" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">업종 니즈</text>
  <text x="100" y="310" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">고정비(4대보험) 최적화</text>
  <text x="920" y="275" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">추천 카드</text>
  <text x="920" y="315" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">삼성 BIZ iD BENEFIT</text>
  <!-- Arrow -->
  <text x="540" y="355" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" fill="#F59E0B">→</text>

  <!-- Row 2 -->
  <rect x="60" y="410" width="960" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="100" y="465" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">업종 니즈</text>
  <text x="100" y="500" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">온라인 쇼핑몰·플랫폼</text>
  <text x="920" y="465" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">추천 카드</text>
  <text x="920" y="505" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">신한 Npay biz</text>
  <text x="540" y="545" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" fill="#F59E0B">→</text>

  <!-- Row 3 -->
  <rect x="60" y="600" width="960" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="100" y="655" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">업종 니즈</text>
  <text x="100" y="690" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">오프라인 식자재·주유</text>
  <text x="920" y="655" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">추천 카드</text>
  <text x="920" y="695" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">KB 탄탄대로 비즈</text>
  <text x="540" y="735" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" fill="#F59E0B">→</text>

  <!-- Row 4 -->
  <rect x="60" y="790" width="960" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="100" y="845" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">업종 니즈</text>
  <text x="100" y="880" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">대량 매입 서브카드</text>
  <text x="920" y="845" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">추천 카드</text>
  <text x="920" y="885" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">롯데 LOCA LIKIT 1.2</text>
  <text x="540" y="925" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" fill="#F59E0B">→</text>

  <!-- Chips -->
  <rect x="60" y="985" width="110" height="42" rx="32" fill="#E8F0FF"/>
  <text x="115" y="1013" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">고정비</text>

  <rect x="190" y="985" width="110" height="42" rx="32" fill="#E8F0FF"/>
  <text x="245" y="1013" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">온라인</text>

  <rect x="320" y="985" width="130" height="42" rx="32" fill="#E8F0FF"/>
  <text x="385" y="1013" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">오프라인</text>

  <rect x="470" y="985" width="96" height="42" rx="32" fill="#E8F0FF"/>
  <text x="518" y="1013" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">서브</text>
</svg>