<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="12" fill="url(#accent)"/>

  <!-- Title -->
  <text x="540" y="78" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">순수보장형 vs 만기환급형</text>
  <text x="540" y="118" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">20년 보험료 차액 투자 시뮬레이션</text>
  <text x="540" y="152" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">40세 남성 암보험 기준 · 2026년 5월 기준 예시</text>

  <!-- Divider -->
  <rect x="60" y="166" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- VS section: two cards side by side -->
  <rect x="60" y="184" width="440" height="320" rx="20" fill="#1A3270"/>
  <text x="280" y="228" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">순수보장형</text>

  <text x="280" y="272" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">월 보험료 (예시)</text>
  <text x="280" y="302" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">40,000원</text>

  <text x="280" y="348" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">20년 총 납입</text>
  <text x="280" y="378" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#EAF2FF" text-anchor="middle">960만 원</text>

  <text x="280" y="418" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">만기 환급금</text>
  <text x="280" y="448" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#FCA5A5" text-anchor="middle">0원</text>
  <text x="280" y="480" font-family="-apple-system, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">단, 차액으로 투자 가능</text>

  <!-- VS circle -->
  <circle cx="540" cy="344" r="44" fill="#F59E0B"/>
  <text x="540" y="356" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#0B1F3B" text-anchor="middle">VS</text>

  <rect x="580" y="184" width="440" height="320" rx="20" fill="#1A3270"/>
  <text x="800" y="228" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#F59E0B" text-anchor="middle">만기환급형</text>

  <text x="800" y="272" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">월 보험료 (예시)</text>
  <text x="800" y="302" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">80,000원</text>

  <text x="800" y="348" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">20년 총 납입</text>
  <text x="800" y="378" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#EAF2FF" text-anchor="middle">1,920만 원</text>

  <text x="800" y="418" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">만기 환급금</text>
  <text x="800" y="448" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#F59E0B" text-anchor="middle">1,920만 원</text>
  <text x="800" y="480" font-family="-apple-system, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">명목 원금 — 물가 미반영</text>

  <!-- Investment simulation -->
  <rect x="60" y="524" width="960" height="200" rx="20" fill="#0F2348"/>
  <text x="540" y="568" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#F59E0B" text-anchor="middle">차액 40,000원을 투자하면?</text>

  <rect x="80" y="586" width="430" height="118" rx="12" fill="#1A3270"/>
  <text x="295" y="622" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">연 4% 적금 20년 납입</text>
  <text x="295" y="658" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399" text-anchor="middle">약 1,470만 원</text>
  <text x="295" y="690" font-family="-apple-system, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">세전 기준</text>

  <rect x="570" y="586" width="430" height="118" rx="12" fill="#1A3270"/>
  <text x="785" y="622" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">연 6% 투자 20년 납입</text>
  <text x="785" y="658" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399" text-anchor="middle">약 1,850만 원</text>
  <text x="785" y="690" font-family="-apple-system, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">세전 기준 — 만기환급형 환급금과 유사</text>

  <!-- Inflation note -->
  <rect x="60" y="744" width="960" height="130" rx="20" fill="#1A3270"/>
  <text x="540" y="784" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FCA5A5" text-anchor="middle">물가상승률 반영 시 만기환급금 실질 가치</text>
  <text x="540" y="820" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">1,920만 원 → 약 1,064만 원</text>
  <text x="540" y="856" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">연 물가상승률 3% 가정, 현재 화폐 기준 — "원금 환급"의 실질 가치는 절반 수준</text>

  <!-- Bottom bar -->
  <rect x="0" y="896" width="1080" height="160" fill="#0A1A35"/>
  <text x="540" y="950" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#EAF2FF" text-anchor="middle">보험은 보장, 저축은 저축으로 분리하라</text>
  <text x="540" y="986" font-family="-apple-system, sans-serif" font-size="18" fill="#F59E0B" text-anchor="middle">순수보장형 + 차액 적금·투자 = 더 유리한 조합</text>
  <text x="540" y="1018" font-family="-apple-system, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">※ 이 수치는 일반적 예시입니다. 개인 조건에 따라 다를 수 있습니다.</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
