<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">지역 비교</text>

  <!-- Title -->
  <text x="80" y="190" font-family="'Pretendard', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">국토부 vs 서울시 vs 인천시 비교</text>

  <!-- Divider -->
  <rect x="80" y="220" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Table -->
  <!-- Header Row -->
  <rect x="60" y="290" width="960" height="80" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="210" y="340" font-family="'Pretendard', sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle">구분</text>
  <text x="450" y="340" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">국토부</text>
  <text x="690" y="340" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">서울시</text>
  <text x="900" y="340" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="middle">인천시</text>

  <!-- Column dividers -->
  <line x1="330" y1="300" x2="330" y2="900" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="570" y1="300" x2="570" y2="900" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="790" y1="300" x2="790" y2="900" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Row 1: 연령 -->
  <rect x="60" y="385" width="960" height="120" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="210" y="440" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">연령</text>
  <text x="450" y="440" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">19~34</text>
  <text x="450" y="475" font-family="'Pretendard', sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">만 나이</text>
  <text x="690" y="440" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">19~39</text>
  <text x="690" y="475" font-family="'Pretendard', sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">만 나이</text>
  <text x="900" y="440" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">35~39</text>
  <text x="900" y="475" font-family="'Pretendard', sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">만 나이</text>

  <!-- Row 2: 소득 -->
  <rect x="60" y="520" width="960" height="120" rx="12" fill="rgba(255,255,255,0.02)"/>
  <text x="210" y="575" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">소득</text>
  <text x="450" y="575" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">중위60%</text>
  <text x="690" y="575" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">중위150%</text>
  <text x="900" y="575" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">공고확인</text>

  <!-- Row 3: 금액 -->
  <rect x="60" y="655" width="960" height="120" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="210" y="710" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">금액</text>
  <text x="450" y="710" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">480만</text>
  <text x="690" y="710" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">240만</text>
  <text x="900" y="710" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">24회</text>

  <!-- Row 4: 선정 -->
  <rect x="60" y="790" width="960" height="120" rx="12" fill="rgba(255,255,255,0.02)"/>
  <text x="210" y="855" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">선정</text>
  <text x="450" y="855" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">심사</text>
  <text x="690" y="855" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">추첨</text>
  <text x="900" y="855" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">심사</text>
</svg>