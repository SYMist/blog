<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">급여 유형별 빠른 판단 가이드</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 헤더 -->
  <rect x="60" y="140" width="200" height="60" fill="rgba(255,255,255,0.12)"/>
  <rect x="260" y="140" width="280" height="60" fill="rgba(255,255,255,0.12)"/>
  <rect x="540" y="140" width="260" height="60" fill="rgba(255,255,255,0.12)"/>
  <rect x="800" y="140" width="220" height="60" fill="rgba(255,255,255,0.12)"/>
  <text x="160" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">구분</text>
  <text x="400" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">출산휴가급여</text>
  <text x="670" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">육아휴직 (일반)</text>
  <text x="910" y="178" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">6+6 부모</text>

  <!-- Row 1: 대상 -->
  <rect x="60" y="200" width="200" height="80" fill="rgba(255,255,255,0.06)"/>
  <rect x="260" y="200" width="280" height="80" fill="rgba(255,255,255,0.03)"/>
  <rect x="540" y="200" width="260" height="80" fill="rgba(255,255,255,0.03)"/>
  <rect x="800" y="200" width="220" height="80" fill="rgba(255,255,255,0.03)"/>
  <text x="160" y="248" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">대상</text>
  <text x="400" y="248" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">출산 근로자</text>
  <text x="670" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">만 8세 이하</text>
  <text x="670" y="265" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">자녀 근로자</text>
  <text x="910" y="240" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">18개월 이하</text>
  <text x="910" y="265" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#FFF">자녀 부모 모두</text>

  <!-- Row 2: 기간 -->
  <rect x="60" y="280" width="200" height="70" fill="rgba(255,255,255,0.04)"/>
  <rect x="260" y="280" width="280" height="70" fill="rgba(255,255,255,0.02)"/>
  <rect x="540" y="280" width="260" height="70" fill="rgba(255,255,255,0.02)"/>
  <rect x="800" y="280" width="220" height="70" fill="rgba(255,255,255,0.02)"/>
  <text x="160" y="323" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">기간</text>
  <text x="400" y="323" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">90일</text>
  <text x="670" y="323" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">최대 12개월</text>
  <text x="910" y="323" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#FFF">부모 각 6개월</text>

  <!-- Row 3: 월 상한 -->
  <rect x="60" y="350" width="200" height="100" fill="rgba(255,255,255,0.06)"/>
  <rect x="260" y="350" width="280" height="100" fill="rgba(255,255,255,0.04)"/>
  <rect x="540" y="350" width="260" height="100" fill="rgba(255,255,255,0.04)"/>
  <rect x="800" y="350" width="220" height="100" fill="rgba(255,255,255,0.04)"/>
  <text x="160" y="408" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">월 상한</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="800" fill="#F59E0B">220만원</text>
  <text x="670" y="390" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">250→200</text>
  <text x="670" y="420" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">→160만원</text>
  <text x="910" y="390" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">250~450</text>
  <text x="910" y="420" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">만원</text>

  <!-- Row 4: 총 최대 -->
  <rect x="60" y="450" width="200" height="80" fill="rgba(245,158,11,0.15)"/>
  <rect x="260" y="450" width="280" height="80" fill="rgba(245,158,11,0.1)"/>
  <rect x="540" y="450" width="260" height="80" fill="rgba(245,158,11,0.1)"/>
  <rect x="800" y="450" width="220" height="80" fill="rgba(245,158,11,0.1)"/>
  <text x="160" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#F59E0B">총 최대</text>
  <text x="400" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#F59E0B">660만원</text>
  <text x="670" y="498" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="900" fill="#F59E0B">2,310만원</text>
  <text x="910" y="490" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#F59E0B">부부 합산</text>
  <text x="910" y="518" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="900" fill="#F59E0B">5,920만원</text>

  <!-- 하단: 세금 안내 -->
  <rect x="60" y="570" width="960" height="100" rx="20" fill="rgba(255,255,255,0.06)"/>
  <text x="540" y="610" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#FFF">실수령액 포인트</text>
  <text x="540" y="650" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">고용보험 지급분: 소득세 비과세 + 4대보험 미부과 → 지급액 = 실수령액</text>

  <rect x="60" y="710" width="960" height="100" rx="20" fill="rgba(245,158,11,0.12)"/>
  <text x="540" y="750" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">2026년 핵심 변화</text>
  <text x="540" y="790" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" fill="#EAF2FF">출산휴가 상한↑ 220만원 · 사후지급금 폐지 · 통합신청 도입</text>

  <rect x="60" y="870" width="960" height="6" rx="3" fill="#F59E0B"/>
  <text x="540" y="930" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#EAF2FF">2026년 기준 · louisville blog</text>
</svg>
