<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 레이블 -->
  <rect x="60" y="52" width="240" height="44" rx="22" fill="#F59E0B" opacity="0.18"/>
  <text x="180" y="80" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">신청 절차 비교</text>

  <!-- 제목 -->
  <text x="540" y="158" font-family="-apple-system,sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" text-anchor="middle">경영체 등록 여부별 신청 절차 비교</text>
  <text x="540" y="210" font-family="-apple-system,sans-serif" font-size="32" font-weight="600" fill="#A0B4D0" text-anchor="middle">농어업경영체 등록자 vs 미등록자</text>

  <line x1="60" y1="236" x2="1020" y2="236" stroke="#1A3270" stroke-width="2"/>

  <!-- 등록자 절차 -->
  <rect x="60" y="256" width="445" height="520" rx="18" fill="#0D2347"/>
  <rect x="60" y="256" width="445" height="6" rx="3" fill="#34D399"/>
  <text x="282" y="304" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#34D399" text-anchor="middle">경영체 등록자</text>
  <text x="282" y="338" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">간소화 절차</text>
  <line x1="80" y1="352" x2="485" y2="352" stroke="#1A3270" stroke-width="1"/>
  <!-- 단계 -->
  <rect x="80" y="364" width="405" height="50" rx="10" fill="#1A3270"/>
  <text x="282" y="395" font-family="-apple-system,sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">STEP 1. 신청서 작성</text>
  <!-- 화살표 -->
  <text x="282" y="432" font-family="-apple-system,sans-serif" font-size="24" fill="#34D399" text-anchor="middle">▼</text>
  <rect x="80" y="444" width="405" height="50" rx="10" fill="#1A3270"/>
  <text x="282" y="475" font-family="-apple-system,sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">STEP 2. 경영체 등록 확인서 발급</text>
  <text x="282" y="512" font-family="-apple-system,sans-serif" font-size="24" fill="#34D399" text-anchor="middle">▼</text>
  <!-- 읍면동 생략 -->
  <rect x="80" y="524" width="405" height="50" rx="10" fill="#EF4444" opacity="0.15"/>
  <text x="282" y="555" font-family="-apple-system,sans-serif" font-size="21" fill="#EF4444" text-anchor="middle">읍면동 방문 — 생략 가능 ✅</text>
  <text x="282" y="592" font-family="-apple-system,sans-serif" font-size="24" fill="#34D399" text-anchor="middle">▼</text>
  <rect x="80" y="604" width="405" height="50" rx="10" fill="#34D399" opacity="0.2"/>
  <text x="282" y="635" font-family="-apple-system,sans-serif" font-size="21" fill="#34D399" text-anchor="middle">STEP 3. 건강보험공단 지사 제출</text>
  <text x="282" y="672" font-family="-apple-system,sans-serif" font-size="24" fill="#34D399" text-anchor="middle">▼</text>
  <rect x="80" y="684" width="405" height="50" rx="10" fill="#34D399" opacity="0.2"/>
  <text x="282" y="715" font-family="-apple-system,sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">다음 달 고지서 반영</text>
  <!-- 소요 시간 -->
  <rect x="80" y="752" width="405" height="36" rx="8" fill="#34D399" opacity="0.12"/>
  <text x="282" y="776" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">총 소요: 약 1~2주</text>

  <!-- 미등록자 절차 -->
  <rect x="575" y="256" width="445" height="520" rx="18" fill="#0D2347"/>
  <rect x="575" y="256" width="445" height="6" rx="3" fill="#F59E0B"/>
  <text x="797" y="304" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#F59E0B" text-anchor="middle">경영체 미등록자</text>
  <text x="797" y="338" font-family="-apple-system,sans-serif" font-size="20" fill="#A0B4D0" text-anchor="middle">기본 절차 (2단계)</text>
  <line x1="595" y1="352" x2="1000" y2="352" stroke="#1A3270" stroke-width="1"/>
  <!-- 단계 -->
  <rect x="595" y="364" width="405" height="50" rx="10" fill="#1A3270"/>
  <text x="797" y="395" font-family="-apple-system,sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">STEP 1. 신청서 작성</text>
  <text x="797" y="432" font-family="-apple-system,sans-serif" font-size="24" fill="#F59E0B" text-anchor="middle">▼</text>
  <rect x="595" y="444" width="405" height="50" rx="10" fill="#F59E0B" opacity="0.15"/>
  <text x="797" y="475" font-family="-apple-system,sans-serif" font-size="21" fill="#F59E0B" text-anchor="middle">STEP 2. 읍면동 방문 (필수)</text>
  <text x="797" y="512" font-family="-apple-system,sans-serif" font-size="24" fill="#F59E0B" text-anchor="middle">▼</text>
  <rect x="595" y="524" width="405" height="50" rx="10" fill="#1A3270"/>
  <text x="797" y="555" font-family="-apple-system,sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">읍면동장 농어업 확인 도장</text>
  <text x="797" y="592" font-family="-apple-system,sans-serif" font-size="24" fill="#F59E0B" text-anchor="middle">▼</text>
  <rect x="595" y="604" width="405" height="50" rx="10" fill="#34D399" opacity="0.2"/>
  <text x="797" y="635" font-family="-apple-system,sans-serif" font-size="21" fill="#34D399" text-anchor="middle">STEP 3. 건강보험공단 지사 제출</text>
  <text x="797" y="672" font-family="-apple-system,sans-serif" font-size="24" fill="#34D399" text-anchor="middle">▼</text>
  <rect x="595" y="684" width="405" height="50" rx="10" fill="#34D399" opacity="0.2"/>
  <text x="797" y="715" font-family="-apple-system,sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">다음 달 고지서 반영</text>
  <rect x="595" y="752" width="405" height="36" rx="8" fill="#F59E0B" opacity="0.12"/>
  <text x="797" y="776" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">총 소요: 약 2~4주</text>

  <!-- 하단 팁 -->
  <rect x="60" y="794" width="960" height="80" rx="14" fill="#34D399" opacity="0.12"/>
  <rect x="60" y="794" width="4" height="80" rx="2" fill="#34D399"/>
  <text x="540" y="830" font-family="-apple-system,sans-serif" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">💡 미등록자라면? 먼저 농어업경영체 등록부터!</text>
  <text x="540" y="862" font-family="-apple-system,sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">건강보험·연금·재해보험 등 향후 행정 절차 전체가 간소화됨</text>

  <text x="540" y="1036" font-family="-apple-system,sans-serif" font-size="20" fill="#4B6080" text-anchor="middle">정부24·건강보험공단 기준 | 2026.05 기준</text>
</svg>
