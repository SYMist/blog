<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <!-- Title -->
  <text x="80" y="185" font-family="'Pretendard', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">소상공인 세무조사 대응 핵심 정리</text>

  <!-- Divider -->
  <rect x="80" y="215" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Row 1 -->
  <rect x="60" y="260" width="960" height="105" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="300" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">조사 유예</text>
  <text x="100" y="340" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">매출 10억 미만 → 상반기 유예 (124만 명)</text>

  <!-- Row 2 -->
  <rect x="60" y="385" width="960" height="105" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="425" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">무신고 가산세</text>
  <text x="100" y="465" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">일반 20% / 부정 40%</text>

  <!-- Row 3 -->
  <rect x="60" y="510" width="960" height="105" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="550" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">과소신고 가산세</text>
  <text x="100" y="590" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">일반 10% / 부정 40%</text>

  <!-- Row 4 -->
  <rect x="60" y="635" width="960" height="105" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="675" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">납부지연</text>
  <text x="100" y="715" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">일 0.022% (연 8.03%)</text>

  <!-- Row 5 (highlighted) -->
  <rect x="60" y="760" width="960" height="105" rx="16" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="800" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">수정신고 감면</text>
  <text x="100" y="840" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#F59E0B">1개월 내 90% 감면 → 실질 1%</text>

  <!-- Row 6 -->
  <rect x="60" y="885" width="960" height="105" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="925" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#F59E0B">체납 소멸</text>
  <text x="100" y="965" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">8,000만 원 이하 면제 (상향)</text>
</svg>