<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <rect x="80" y="72" width="160" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="103" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#0B1F3B" text-anchor="middle">2026 변경</text>

  <text x="80" y="185" font-family="'Pretendard', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">2026 장기요양 제도 변화</text>
  <rect x="80" y="215" width="120" height="4" rx="2" fill="#F59E0B"/>

  <!-- Header -->
  <rect x="60" y="270" width="960" height="60" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="250" y="308" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">기존</text>
  <text x="540" y="308" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#F59E0B" text-anchor="middle">→</text>
  <text x="790" y="308" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="middle">2026년</text>

  <!-- Row 1 -->
  <rect x="60" y="350" width="960" height="110" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="385" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">1등급 재가 한도</text>
  <text x="250" y="430" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" opacity="0.5" text-anchor="middle">226.5만</text>
  <text x="540" y="430" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">→</text>
  <text x="790" y="430" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">251.2만</text>

  <!-- Row 2 -->
  <rect x="60" y="480" width="960" height="110" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="515" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">1등급 유효기간</text>
  <text x="250" y="560" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" opacity="0.5" text-anchor="middle">4년</text>
  <text x="540" y="560" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">→</text>
  <text x="790" y="560" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">5년</text>

  <!-- Row 3 -->
  <rect x="60" y="610" width="960" height="110" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="645" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">방문요양 중증 가산</text>
  <text x="250" y="690" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" opacity="0.5" text-anchor="middle">일 3,000원</text>
  <text x="540" y="690" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">→</text>
  <text x="790" y="690" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#F59E0B" text-anchor="middle">시간당 2,000원</text>

  <!-- Row 4 -->
  <rect x="60" y="740" width="960" height="110" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="775" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">가족휴가 단기보호</text>
  <text x="250" y="820" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" opacity="0.5" text-anchor="middle">연 11일</text>
  <text x="540" y="820" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">→</text>
  <text x="790" y="820" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">연 12일</text>

  <!-- Row 5 -->
  <rect x="60" y="870" width="960" height="110" rx="16" fill="url(#rowBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="905" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#F59E0B">보험료율</text>
  <text x="250" y="950" font-family="'Pretendard', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" opacity="0.5" text-anchor="middle">12.95%</text>
  <text x="540" y="950" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle">→</text>
  <text x="790" y="950" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">13.14%</text>
</svg>