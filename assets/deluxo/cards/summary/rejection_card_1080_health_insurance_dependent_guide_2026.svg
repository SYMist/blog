  <text x="145" y="752" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">공시가격 확인: 부동산공시가격알리미(realtyprice.kr) 또는 국토부 공시</text>
  <text x="145" y="776" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">재산세 과세표준 = 공시가격 × 60% (아파트·연립 기준)</text>

  <!-- Item 5 -->
