  <!-- Title -->
  <text x="540" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#EF4444" text-anchor="middle">건강보험 피부양자 탈락 주요 사유 TOP 5</text>
  <text x="540" y="82" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">이 5가지 중 하나라도 해당하면 지역가입자로 전환됩니다 (2026년 기준)</text>

  <!-- Item 1 -->
  <rect x="30" y="100" width="1020" height="168" rx="12" fill="#1A3270"/>
  <rect x="30" y="100" width="6" height="168" rx="3" fill="#EF4444"/>
  <circle cx="92" cy="184" r="30" fill="#EF4444"/>
  <text x="92" y="192" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="145" y="142" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">연 합산소득 2,000만원 초과</text>
  <text x="145" y="172" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0">이자+배당+사업+근로+연금+기타소득 합산 | 은퇴자·배당투자자 주의</text>
  <text x="145" y="198" font-family="-apple-system, sans-serif" font-size="14" fill="#EF4444">→ 각 소득 항목을 합산해 2,000만원 초과 여부를 매년 확인할 것</text>
  <text x="145" y="224" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">국세청 소득 자료가 11월 공단에 통보되면 즉시 탈락 처리됨</text>
  <text x="145" y="248" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">연 합산소득 집계는 홈택스 > 조회/발급 > 소득확인에서 확인 가능</text>

