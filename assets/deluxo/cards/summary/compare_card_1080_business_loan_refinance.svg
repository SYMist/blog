  <text x="260" y="505" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#F59E0B">세종 소상공인 자금 600억</text>
  <text x="260" y="550" font-family="'Pretendard', sans-serif" font-size="26" font-weight="600" fill="#EAF2FF">한도: 최대 7,000만</text>
