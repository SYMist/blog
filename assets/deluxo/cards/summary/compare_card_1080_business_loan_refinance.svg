  <text x="540" y="200" font-family="'Pretendard', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle">지역별 이차보전 한눈에</text>

  <rect x="60" y="270" width="960" height="170" rx="20" fill="#1A3270"/>
