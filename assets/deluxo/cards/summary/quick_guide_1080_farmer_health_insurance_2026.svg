<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 레이블 -->
  <rect x="60" y="52" width="240" height="44" rx="22" fill="#34D399" opacity="0.18"/>
  <text x="180" y="80" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">빠른 지원금 계산</text>

  <!-- 제목 -->
  <text x="540" y="158" font-family="-apple-system,sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" text-anchor="middle">나는 얼마나 절감되나? 월별 계산</text>
  <text x="540" y="210" font-family="-apple-system,sans-serif" font-size="32" font-weight="600" fill="#A0B4D0" text-anchor="middle">22% 경감 + 28% 지원 합산 기준 (2026)</text>

  <line x1="60" y1="236" x2="1020" y2="236" stroke="#1A3270" stroke-width="2"/>

  <!-- 계산 과정 설명 -->
  <rect x="60" y="252" width="960" height="90" rx="14" fill="#1A3270"/>
  <text x="540" y="288" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">계산 공식: 원래 부과액 × (1 − 22%) × (1 − 28%)</text>
  <text x="540" y="326" font-family="-apple-system,sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">22% 경감 후 잔액에 28% 국고지원 차감</text>

  <!-- 표 헤더 -->
  <rect x="60" y="358" width="960" height="50" rx="8" fill="#0D2347"/>
