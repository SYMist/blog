  <text x="570" y="564" font-family="-apple-system,sans-serif" font-size="24" fill="#F59E0B" text-anchor="middle">−56,000원</text>
  <text x="770" y="564" font-family="-apple-system,sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">100,000원</text>
  <text x="960" y="564" font-family="-apple-system,sans-serif" font-size="24" font-weight="900" fill="#EF4444" text-anchor="middle">50%↓</text>
