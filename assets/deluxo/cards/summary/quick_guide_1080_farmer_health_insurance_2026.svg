  <!-- 행 1 -->
  <rect x="60" y="408" width="960" height="60" rx="0" fill="#0D2347"/>
  <text x="190" y="444" font-family="-apple-system,sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">100,000원</text>
