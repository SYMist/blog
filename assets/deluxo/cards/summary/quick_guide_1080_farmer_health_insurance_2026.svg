  <text x="540" y="820" font-family="-apple-system,sans-serif" font-size="26" font-weight="900" fill="#F59E0B" text-anchor="middle">⚠ 최대 6개월 소급 — 20만 원 부과 시 6개월 환급 약 336,000원</text>
