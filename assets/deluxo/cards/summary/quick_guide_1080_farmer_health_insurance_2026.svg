  <rect x="60" y="884" width="960" height="68" rx="14" fill="#0D2347"/>
  <text x="540" y="914" font-family="-apple-system,sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">신청: 관할 국민건강보험공단 지사 방문</text>
  <text x="540" y="942" font-family="-apple-system,sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">고객센터 ☎ 1577-1000 (평일 09:00~18:00)</text>

  <text x="540" y="1036" font-family="-apple-system,sans-serif" font-size="20" fill="#4B6080" text-anchor="middle">정부24·국민건강보험공단 기준 | 2026.05 기준</text>
