  <text x="370" y="390" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">22% 후</text>
  <text x="570" y="390" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">28% 지원액</text>
  <text x="770" y="390" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">실 납부액</text>
  <text x="960" y="390" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#EF4444" text-anchor="middle">절감률</text>

