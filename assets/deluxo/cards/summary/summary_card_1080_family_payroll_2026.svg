<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#accent)"/>

  <!-- Title -->
  <text x="60" y="90" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF">가족 인건비 비용처리</text>
  <text x="60" y="140" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" fill="#F59E0B">핵심 요약 2026</text>

  <!-- Divider -->
  <rect x="60" y="162" width="960" height="3" fill="#F59E0B" rx="2"/>

  <!-- Section: 비용처리 4가지 요건 -->
  <text x="60" y="204" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#F59E0B">✅ 비용처리 인정 4가지 요건 (전부 충족 필요)</text>

  <!-- Req 1 -->
  <rect x="60" y="218" width="450" height="96" rx="14" fill="#1A3270"/>
  <text x="90" y="258" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#F59E0B">① 실제 근로 수행</text>
  <text x="90" y="288" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">사업에 직접 종사, 업무 내용 구체적</text>

  <!-- Req 2 -->
  <rect x="570" y="218" width="450" height="96" rx="14" fill="#1A3270"/>
  <text x="600" y="258" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#F59E0B">② 적정 수준의 급여</text>
  <text x="600" y="288" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">동종 업종·동일 직급 기준, 과도 시 부인</text>

  <!-- Req 3 -->
  <rect x="60" y="328" width="450" height="96" rx="14" fill="#1A3270"/>
  <text x="90" y="368" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#F59E0B">③ 원천징수 신고</text>
  <text x="90" y="398" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">매달 원천세 신고·납부 필수</text>

  <!-- Req 4 -->
  <rect x="570" y="328" width="450" height="96" rx="14" fill="#1A3270"/>
  <text x="600" y="368" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#F59E0B">④ 증빙 자료 유지</text>
  <text x="600" y="398" font-family="-apple-system, sans-serif" font-size="17" fill="#EAF2FF">근로계약서·출근부·급여이체내역</text>

  <!-- Divider 2 -->
  <rect x="60" y="444" width="960" height="2" fill="#1A3270" rx="1"/>

  <!-- Section: 특수관계인 범위 -->
  <text x="60" y="484" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#F59E0B">📌 특수관계인 범위 (2023년 2월 개정 현행)</text>

  <rect x="60" y="498" width="300" height="90" rx="14" fill="#1A3270"/>
  <text x="210" y="538" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#F59E0B" text-anchor="middle">혈족 범위</text>
  <text x="210" y="568" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">4촌 이내</text>

  <rect x="390" y="498" width="300" height="90" rx="14" fill="#1A3270"/>
  <text x="540" y="538" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#F59E0B" text-anchor="middle">인척 범위</text>
  <text x="540" y="568" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">3촌 이내</text>

  <rect x="720" y="498" width="300" height="90" rx="14" fill="#1A3270"/>
  <text x="870" y="538" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#F59E0B" text-anchor="middle">배우자</text>
  <text x="870" y="568" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">사실혼 포함</text>

  <!-- Divider 3 -->
  <rect x="60" y="614" width="960" height="2" fill="#1A3270" rx="1"/>

  <!-- Section: 원천세·가산세 -->
  <text x="60" y="654" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#F59E0B">⏱ 원천세 신고 기한 &amp; 가산세</text>

  <rect x="60" y="668" width="460" height="130" rx="14" fill="#1A3270"/>
  <text x="290" y="716" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle">일반 신고 기한</text>
  <text x="290" y="756" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">다음 달 10일</text>
  <text x="290" y="786" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">20인 이하: 반기 신고 특례 적용 가능</text>

  <rect x="560" y="668" width="460" height="130" rx="14" fill="#EF4444"/>
  <text x="790" y="716" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">미신고 가산세</text>
  <text x="790" y="756" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">10~20%</text>
  <text x="790" y="786" font-family="-apple-system, sans-serif" font-size="16" fill="#FCA5A5" text-anchor="middle">지급명세서 미제출 시 1% 추가</text>

  <!-- Bottom note -->
  <rect x="60" y="826" width="960" height="74" rx="14" fill="#0A1A35"/>
  <text x="540" y="862" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#EAF2FF" text-anchor="middle">⚠ 사업주 본인 급여는 개인사업자의 경우 어떤 경우에도 비용처리 불가</text>
  <text x="540" y="888" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">법인사업자 전환 시 대표이사 급여 비용처리 가능 (부당행위계산부인 주의)</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
</svg>
