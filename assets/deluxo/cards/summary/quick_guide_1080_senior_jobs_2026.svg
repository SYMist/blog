<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#F59E0B"/>

  <!-- Title -->
  <text x="540" y="72" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">내 상황에 맞는 유형 10초 판단</text>
  <text x="540" y="112" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#F59E0B" text-anchor="middle">노인 일자리·사회활동 지원사업 (2026)</text>

  <!-- Header -->
  <rect x="40" y="148" width="1000" height="52" rx="8" fill="#1D4ED8"/>
  <text x="320" y="180" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">내 상황</text>
  <text x="800" y="180" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">추천 유형</text>

  <!-- Row 1 -->
  <rect x="40" y="208" width="1000" height="118" rx="8" fill="#1A3270"/>
  <rect x="40" y="208" width="6" height="118" rx="3" fill="#F59E0B"/>
  <text x="320" y="258" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">만 65세 이상이고 기초연금을 받고 있다</text>
  <text x="320" y="284" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">특별한 전문 자격 없어도 참여 가능</text>
  <text x="800" y="258" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F59E0B" text-anchor="middle">공익활동형</text>
  <text x="800" y="284" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">월 30시간 / 월 약 29만원</text>

  <!-- Row 2 -->
  <rect x="40" y="334" width="1000" height="118" rx="8" fill="#102A56"/>
  <rect x="40" y="334" width="6" height="118" rx="3" fill="#34D399"/>
  <text x="320" y="384" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">만 65세 이상이고 돌봄·안전 분야 활동을</text>
  <text x="320" y="408" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">원한다</text>
  <text x="800" y="384" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">사회서비스형</text>
  <text x="800" y="410" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">월 60시간 / 59만~65만원</text>

  <!-- Row 3 -->
  <rect x="40" y="460" width="1000" height="118" rx="8" fill="#1A3270"/>
  <rect x="40" y="460" width="6" height="118" rx="3" fill="#60A5FA"/>
  <text x="320" y="510" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">만 60세 이상이고 전문 자격증·경력이 있다</text>
  <text x="320" y="534" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">교원·의료·회계·법률·상담 등 경력 보유</text>
  <text x="800" y="510" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#60A5FA" text-anchor="middle">역량활용형</text>
  <text x="800" y="536" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">월 60시간 / 월 약 76만원 (최고)</text>

  <!-- Row 4 -->
  <rect x="40" y="586" width="1000" height="118" rx="8" fill="#102A56"/>
  <rect x="40" y="586" width="6" height="118" rx="3" fill="#A78BFA"/>
  <text x="320" y="636" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">만 60세 이상이고 소규모 사업 운영을</text>
  <text x="320" y="660" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">경험해보고 싶다</text>
  <text x="800" y="636" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#A78BFA" text-anchor="middle">시장형사업단</text>
  <text x="800" y="660" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">성과 기반 수익</text>

  <!-- Row 5 -->
  <rect x="40" y="712" width="1000" height="118" rx="8" fill="#1A3270"/>
  <rect x="40" y="712" width="6" height="118" rx="3" fill="#F472B6"/>
  <text x="320" y="762" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">만 60세 이상이고 일반 기업에 취업하거나</text>
  <text x="320" y="786" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">정규직 채용을 원한다</text>
  <text x="800" y="762" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#F472B6" text-anchor="middle">취업알선/인턴십</text>
  <text x="800" y="788" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">시급 기준 / 채용 연계</text>

  <!-- Row 6 -->
  <rect x="40" y="838" width="1000" height="118" rx="8" fill="#102A56"/>
  <rect x="40" y="838" width="6" height="118" rx="3" fill="#FB923C"/>
  <text x="320" y="888" font-family="-apple-system, sans-serif" font-size="19" fill="#EAF2FF" text-anchor="middle">어떤 유형인지 모르겠다, 처음 신청한다</text>
  <text x="800" y="876" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FB923C" text-anchor="middle">주민센터 방문</text>
  <text x="800" y="900" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">또는 ☎ 1544-3388 상담</text>

  <!-- Divider -->
  <line x1="570" y1="148" x2="570" y2="964" stroke="#1D4ED8" stroke-width="1" opacity="0.5"/>

  <!-- Footer -->
  <text x="540" y="1000" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 보건복지부·한국노인인력개발원</text>
  <text x="540" y="1026" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">지역별 운영 기관에 따라 조건이 달라질 수 있음</text>

  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
</svg>
