<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">채무조정 3가지 한눈에 비교</text>
  <rect x="60" y="110" width="960" height="6" rx="3" fill="#F59E0B"/>

  <!-- 워크아웃 -->
  <rect x="60" y="140" width="960" height="260" rx="20" fill="rgba(59,130,246,0.12)"/>
  <rect x="80" y="160" width="200" height="44" rx="22" fill="#3B82F6"/>
  <text x="180" y="190" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">신용회복위원회</text>
  <text x="300" y="190" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">워크아웃 (사적 조정)</text>

  <text x="100" y="240" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">감면 범위</text>
  <text x="280" y="240" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">이자 감면·기간 연장 중심 (원금 감면 제한)</text>

  <text x="100" y="280" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">비용</text>
  <text x="280" y="280" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">무료 (수수료 없음)</text>

  <text x="100" y="320" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">신용회복</text>
  <text x="280" y="320" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">완제 후 즉시 신용정보 삭제</text>

  <text x="100" y="360" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">대상</text>
  <text x="280" y="360" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">연체 90일 이상 · 총채무 15억 이하</text>

  <!-- 개인회생 -->
  <rect x="60" y="420" width="960" height="260" rx="20" fill="rgba(16,185,129,0.12)"/>
  <rect x="80" y="440" width="160" height="44" rx="22" fill="#10B981"/>
  <text x="160" y="470" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">개인회생</text>
  <text x="260" y="470" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">법원 인가 (법적 절차)</text>

  <text x="100" y="520" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">감면 범위</text>
  <text x="280" y="520" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">원금 최대 90% 감면 가능</text>

  <text x="100" y="560" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">변제 기간</text>
  <text x="280" y="560" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">3~5년 (36~60개월)</text>

  <text x="100" y="600" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">신용회복</text>
  <text x="280" y="600" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">면책 결정 후 5년 이내 삭제</text>

  <text x="100" y="640" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">대상</text>
  <text x="280" y="640" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">무담보 10억 / 담보 15억 이하 · 정기 소득 필수</text>

  <!-- 개인파산 -->
  <rect x="60" y="700" width="960" height="260" rx="20" fill="rgba(239,68,68,0.12)"/>
  <rect x="80" y="720" width="160" height="44" rx="22" fill="#EF4444"/>
  <text x="160" y="750" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="800" fill="#FFF">개인파산</text>
  <text x="260" y="750" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">법원 면책 (최후 수단)</text>

  <text x="100" y="800" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">감면 범위</text>
  <text x="280" y="800" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">채무 전액 면책 (비면책 채권 제외)</text>

  <text x="100" y="840" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">재산</text>
  <text x="280" y="840" font-family="'Pretendard',sans-serif" font-size="20" fill="#EAF2FF">재산 처분 수반 (자유재산 제외)</text>

  <text x="100" y="880" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">신용회복</text>
  <text x="280" y="880" font-family="'Pretendard',sans-serif" font-size="20" fill="#F59E0B">면책 확정 후 5년 이내 삭제</text>

  <text x="100" y="920" font-family="'Pretendard',sans-serif" font-size="22" font-weight="700" fill="#FFF">비면책</text>
  <text x="280" y="920" font-family="'Pretendard',sans-serif" font-size="20" fill="#EF4444">세금·벌금·양육비·고의 불법행위</text>

  <!-- 하단 -->
  <rect x="60" y="980" width="960" height="60" rx="16" fill="rgba(245,158,11,0.12)"/>
  <text x="540" y="1020" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#F59E0B">신용회복위원회 1600-5500 · 대한법률구조공단 132</text>

  <rect x="60" y="1050" width="960" height="6" rx="3" fill="#F59E0B"/>
</svg>