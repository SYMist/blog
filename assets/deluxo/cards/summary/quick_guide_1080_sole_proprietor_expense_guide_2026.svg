  <!-- 3 stat boxes -->
  <rect x="30" y="828" width="310" height="148" rx="12" fill="#0D2347"/>
  <text x="185" y="874" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle">무기장 가산세 면제</text>
  <text x="185" y="916" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">4,800만원 미만</text>
