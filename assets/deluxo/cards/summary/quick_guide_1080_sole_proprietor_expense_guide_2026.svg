  <text x="515" y="948" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">복식부기 자발 신고 시 최대 100만원</text>

  <rect x="690" y="828" width="360" height="148" rx="12" fill="#0D2347"/>
