  <text x="870" y="916" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">☎ 126</text>
  <text x="870" y="948" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">국세청 세금 상담 (평일 09~18시)</text>

  <text x="540" y="1060" font-family="-apple-system, sans-serif" font-size="13" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 기준: 2024년 수입금액 | hometax.go.kr | 정확한 유형은 홈택스 또는 세무사 확인</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
