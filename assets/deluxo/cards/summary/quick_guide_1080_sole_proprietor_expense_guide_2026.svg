  <text x="540" y="90" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#A0B4D0" text-anchor="middle">2026년 신고 기준: 2024년 수입금액으로 판정</text>

  <!-- Table header -->
  <rect x="30" y="108" width="1020" height="48" rx="8" fill="#1A3270"/>
