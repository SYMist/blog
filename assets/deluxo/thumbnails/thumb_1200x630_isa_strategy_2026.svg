<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="60%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0B1F3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Left: Title area -->
  <!-- Chips -->
  <rect x="60" y="72" width="164" height="46" rx="23" fill="#1D4ED8"/>
  <text x="142" y="102" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">2026 최신</text>

  <rect x="236" y="72" width="196" height="46" rx="23" fill="#1D4ED8"/>
  <text x="334" y="102" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">비과세 400만</text>

  <rect x="444" y="72" width="224" height="46" rx="23" fill="#F59E0B"/>
  <text x="556" y="102" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#0B1F3B" text-anchor="middle">연금공제 300만</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="'Pretendard', sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">ISA 계좌 절세 전략</text>
  <text x="60" y="296" font-family="'Pretendard', sans-serif" font-size="72" font-weight="900" fill="#F59E0B">총정리 2026</text>

  <!-- Subtitle -->
  <text x="60" y="362" font-family="'Pretendard', sans-serif" font-size="30" font-weight="700" fill="#EAF2FF">비과세·분리과세·연금 세액공제 · 만기 출금 3가지 전략</text>

  <!-- Divider -->
  <rect x="60" y="404" width="700" height="3" fill="#F59E0B" rx="2"/>

  <!-- Bottom note -->
  <text x="60" y="450" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#A0B4D0">2026년 현행 기준 · 의무기간 3년 · 손익통산 과세</text>

  <!-- Right: Key stat cards -->
  <rect x="840" y="68" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="122" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">서민형 비과세</text>
  <text x="1000" y="184" font-family="'Pretendard', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">400만원</text>

  <rect x="840" y="232" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="286" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">분리과세율</text>
  <text x="1000" y="348" font-family="'Pretendard', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">9.9%</text>

  <rect x="840" y="396" width="320" height="148" rx="20" fill="#F59E0B"/>
  <text x="1000" y="450" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#0B1F3B" text-anchor="middle">연금이전 추가공제</text>
  <text x="1000" y="512" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#0B1F3B" text-anchor="middle">최대 300만</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
