  <text x="540" y="818" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">청년창업 세액감면은 종소세 신고 시 직접 신청 — 자동 미적용!</text>
  <text x="540" y="852" font-family="-apple-system, sans-serif" font-size="18" fill="#EAF2FF" text-anchor="middle">사업자등록: hometax.go.kr | 신고: hometax.go.kr | 안내: nts.go.kr</text>
