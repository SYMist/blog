  <!-- Footer note -->
  <text x="540" y="964" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 개인 상황에 따라 달라질 수 있음</text>

  <rect x="0" y="1070" width="1080" height="10" fill="url(#accent)"/>
