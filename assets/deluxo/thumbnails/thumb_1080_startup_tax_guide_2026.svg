  <text x="540" y="554" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#F59E0B" text-anchor="middle">비수도권 청년 감면</text>
  <text x="540" y="608" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">100%</text>
  <text x="540" y="638" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">소득세 5년 전액 감면</text>

  <rect x="730" y="494" width="290" height="160" rx="20" fill="#34D399" opacity="0.2"/>
