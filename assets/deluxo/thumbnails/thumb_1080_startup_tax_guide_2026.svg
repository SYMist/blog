  <text x="205" y="608" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">20일</text>
  <text x="205" y="638" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">개시 후 이내 의무</text>

