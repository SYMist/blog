<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="365" y="60" width="470" height="48" rx="24" fill="#F59E0B"/>
  <text x="600" y="93" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#0B1F3B">2026 최신 · 비수도권 정책자금 60% 배정</text>

  <!-- 메인 텍스트 -->
  <text x="600" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">부산·대구·광주</text>
  <text x="600" y="290" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">소상공인 지원금</text>

  <!-- 서브 텍스트 -->
  <text x="600" y="365" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="40" font-weight="600" fill="#EAF2FF">지역별 핵심 혜택 한눈에 비교 총정리</text>

  <!-- 칩 -->
  <rect x="225" y="410" width="140" height="44" rx="22" fill="#E8F0FF"/>
  <text x="295" y="439" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">부산</text>
  <rect x="385" y="410" width="140" height="44" rx="22" fill="#E8F0FF"/>
  <text x="455" y="439" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">대구</text>
  <rect x="545" y="410" width="140" height="44" rx="22" fill="#E8F0FF"/>
  <text x="615" y="439" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">광주</text>
  <rect x="705" y="410" width="180" height="44" rx="22" fill="#E8F0FF"/>
  <text x="795" y="439" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">신청 방법</text>

  <!-- 하단 -->
  <rect x="250" y="500" width="700" height="64" rx="14" fill="rgba(245,158,11,0.15)"/>
  <text x="600" y="542" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="32" font-weight="700" fill="#F59E0B">놓치면 수백만 원 손해 — 지금 확인하세요</text>
</svg>
