<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="60%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0B1F3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Chips -->
  <rect x="60" y="72" width="150" height="46" rx="23" fill="#1D4ED8"/>
  <text x="135" y="102" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">2026 최신</text>

  <rect x="222" y="72" width="182" height="46" rx="23" fill="#1D4ED8"/>
  <text x="313" y="102" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">실수 TOP10</text>

  <rect x="416" y="72" width="210" height="46" rx="23" fill="#EF4444"/>
  <text x="521" y="102" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">소멸시효 주의</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="'Pretendard', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">산재 휴업급여 신청</text>
  <text x="60" y="294" font-family="'Pretendard', sans-serif" font-size="68" font-weight="900" fill="#F59E0B">실수 TOP10 총정리</text>

  <!-- Subtitle -->
  <text x="60" y="362" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#EAF2FF">소멸시효·청구 기한·불복 절차 90일 · 2026년 기준</text>

  <!-- Divider -->
  <rect x="60" y="402" width="660" height="3" fill="#F59E0B" rx="2"/>

  <!-- Bottom note -->
  <text x="60" y="452" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#A0B4D0">2026년 현행 기준 · 사업주 전액 부담 · 단독 신청 가능</text>

  <!-- Right: Key stat cards -->
  <rect x="840" y="68" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="122" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">요양·휴업 시효</text>
  <text x="1000" y="184" font-family="'Pretendard', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">3년</text>

  <rect x="840" y="232" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="286" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">장해·유족 시효</text>
  <text x="1000" y="348" font-family="'Pretendard', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">5년</text>

  <rect x="840" y="396" width="320" height="148" rx="20" fill="#EF4444"/>
  <text x="1000" y="450" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">불복 심사청구 기한</text>
  <text x="1000" y="512" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">90일</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
