<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="50" width="200" height="48" rx="24" fill="#F59E0B"/>
  <text x="160" y="83" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#0B1F3B">2026 최신</text>

  <!-- Main Title -->
  <text x="60" y="170" font-family="'Pretendard',sans-serif" font-size="68" font-weight="900" fill="#FFF">개인회생 변제금 계산법 총정리</text>

  <!-- Sub Text -->
  <text x="60" y="250" font-family="'Pretendard',sans-serif" font-size="40" font-weight="600" fill="#EAF2FF">최저생계비 154만 + 면제재산 250만 확대</text>

  <!-- Info Box -->
  <rect x="60" y="300" width="1080" height="90" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="600" y="358" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#F59E0B">소득 - 생계비 - 추가공제 = 월 변제금</text>

  <!-- Chips -->
  <rect x="60" y="430" width="170" height="50" rx="25" fill="#E8F0FF"/>
  <text x="145" y="463" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">계산법</text>
  <rect x="250" y="430" width="170" height="50" rx="25" fill="#E8F0FF"/>
  <text x="335" y="463" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">변제계획</text>
  <rect x="440" y="430" width="170" height="50" rx="25" fill="#E8F0FF"/>
  <text x="525" y="463" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">면책</text>

  <!-- Gold Bar -->
  <rect x="60" y="570" width="1080" height="6" rx="3" fill="#F59E0B"/>
</svg>