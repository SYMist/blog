<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" rx="24"/>

  <!-- Badge -->
  <rect x="470" y="90" width="260" height="50" rx="25" fill="#F59E0B"/>
  <text x="600" y="123" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <!-- Main text -->
  <text x="600" y="260" font-family="'Pretendard', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" text-anchor="middle">세무조사 대응법</text>

  <!-- Sub text -->
  <text x="600" y="340" font-family="'Pretendard', sans-serif" font-size="40" font-weight="600" fill="#EAF2FF" text-anchor="middle">소상공인 가산세 줄이는 법 총정리</text>

  <!-- Chips -->
  <rect x="240" y="430" width="180" height="52" rx="24" fill="#E8F0FF"/>
  <text x="330" y="464" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8" text-anchor="middle">가산세</text>

  <rect x="460" y="430" width="220" height="52" rx="24" fill="#E8F0FF"/>
  <text x="570" y="464" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8" text-anchor="middle">수정신고</text>

  <rect x="720" y="430" width="200" height="52" rx="24" fill="#E8F0FF"/>
  <text x="820" y="464" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8" text-anchor="middle">AI검증</text>
</svg>