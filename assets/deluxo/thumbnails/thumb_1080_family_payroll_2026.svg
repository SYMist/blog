  <text x="205" y="808" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">다음달 10일</text>

  <rect x="395" y="698" width="290" height="140" rx="20" fill="#1A3270"/>
  <text x="540" y="754" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">특수관계인 혈족</text>
  <text x="540" y="808" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">4촌 이내</text>

  <rect x="730" y="698" width="290" height="140" rx="20" fill="#1A3270"/>
  <text x="875" y="754" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">국민연금 요율</text>
