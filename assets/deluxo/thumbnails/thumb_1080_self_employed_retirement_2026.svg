  <text x="540" y="466" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#A0B4D0" text-anchor="middle">종합소득 4,000만원↓ 기준 연간 최대 절세</text>
  <text x="540" y="562" font-family="-apple-system, sans-serif" font-size="96" font-weight="900" fill="#34D399" text-anchor="middle">238만원</text>

