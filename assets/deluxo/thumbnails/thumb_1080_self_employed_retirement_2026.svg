  <rect x="60" y="618" width="300" height="172" rx="16" fill="#0D2347"/>
  <text x="210" y="672" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">노란우산공제</text>
  <text x="210" y="730" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">~90만원</text>
  <text x="210" y="770" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">소득공제 최대</text>

  <rect x="390" y="618" width="300" height="172" rx="16" fill="#0D2347"/>
  <text x="540" y="672" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">IRP+연금저축</text>
  <text x="540" y="730" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">~148만원</text>
  <text x="540" y="770" font-family="-apple-system, sans-serif" font-size="15" fill="#A0B4D0" text-anchor="middle">세액공제 최대</text>

