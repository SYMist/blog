  <!-- Bottom note -->
  <text x="540" y="976" font-family="-apple-system, sans-serif" font-size="14" fill="#A0B4D0" text-anchor="middle">2026년 5월 기준 | 개인 소득 상황에 따라 실제 절세액 상이 | 세무사 상담 권장</text>
  <rect x="0" y="1072" width="1080" height="8" fill="#F59E0B"/>
