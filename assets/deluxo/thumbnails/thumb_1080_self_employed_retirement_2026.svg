  <rect x="60" y="80" width="148" height="42" rx="21" fill="#F59E0B"/>
  <text x="134" y="107" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <rect x="224" y="80" width="248" height="42" rx="21" fill="#1A3270"/>
