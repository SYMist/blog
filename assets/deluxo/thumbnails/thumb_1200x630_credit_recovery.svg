<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>

  <!-- 뱃지 -->
  <rect x="60" y="50" width="240" height="44" rx="22" fill="rgba(245,158,11,0.2)"/>
  <text x="180" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">2026 최신판</text>

  <!-- 메인 타이틀 -->
  <text x="60" y="170" font-family="'Pretendard',sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">신용점수 올리는 법</text>

  <!-- 서브 타이틀 -->
  <text x="60" y="230" font-family="'Pretendard',sans-serif" font-size="40" font-weight="600" fill="#EAF2FF">개인회생 면책 후 신용회복 로드맵</text>

  <!-- 칩 라인 -->
  <rect x="60" y="270" width="200" height="44" rx="22" fill="#E8F0FF"/>
  <text x="160" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">1년 조기 삭제</text>

  <rect x="280" y="270" width="220" height="44" rx="22" fill="#E8F0FF"/>
  <text x="390" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">마이데이터 가점</text>

  <rect x="520" y="270" width="230" height="44" rx="22" fill="#E8F0FF"/>
  <text x="635" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">카드 단계 전환</text>

  <!-- 우측 핵심 수치 -->
  <rect x="800" y="100" width="360" height="480" rx="20" fill="rgba(245,158,11,0.08)"/>

  <text x="980" y="180" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFF">500~600</text>
  <text x="980" y="215" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#F59E0B">점수 급상승</text>

  <text x="980" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFF">790점</text>
  <text x="980" y="335" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#F59E0B">카드 발급 기준</text>

  <text x="980" y="420" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="52" font-weight="900" fill="#FFF">12.5%</text>
  <text x="980" y="455" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#F59E0B">햇살론 특례 금리</text>

  <text x="980" y="540" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">NICE vs KCB 비교</text>
  <text x="980" y="565" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">3단계 로드맵</text>

  <!-- 좌측 하단 -->
  <text x="60" y="400" font-family="'Pretendard',sans-serif" font-size="32" font-weight="700" fill="#EAF2FF">1년 성실 상환 → 공공기록 삭제</text>
  <text x="60" y="445" font-family="'Pretendard',sans-serif" font-size="32" font-weight="700" fill="#EAF2FF">마이데이터 +10~20점 가점</text>
  <text x="60" y="490" font-family="'Pretendard',sans-serif" font-size="32" font-weight="700" fill="#EAF2FF">햇살론 → 일반카드 단계 전환</text>

  <text x="60" y="570" font-family="'Pretendard',sans-serif" font-size="24" font-weight="600" fill="#F59E0B">서민금융진흥원 1397 · 신용회복위원회 1600-5500</text>
</svg>