<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="60%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0B1F3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Chips -->
  <rect x="60" y="72" width="150" height="46" rx="23" fill="#1D4ED8"/>
  <text x="135" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">2026 최신</text>

  <rect x="222" y="72" width="190" height="46" rx="23" fill="#1D4ED8"/>
  <text x="317" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">1년 조기삭제</text>

  <rect x="424" y="72" width="210" height="46" rx="23" fill="#34D399" opacity="0.8"/>
  <text x="529" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#0B1F3B" text-anchor="middle">단계별 가이드</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="-apple-system, sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">개인회생 면책 후</text>
  <text x="60" y="294" font-family="-apple-system, sans-serif" font-size="68" font-weight="900" fill="#F59E0B">신용회복 단계별 로드맵</text>

  <!-- Subtitle -->
  <text x="60" y="362" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#EAF2FF">1년·3년·5년 타임라인 · 공공기록 조기삭제 · 대출 재개 시점</text>

  <!-- Divider -->
  <rect x="60" y="402" width="660" height="3" fill="#F59E0B" rx="2"/>

  <!-- Bottom note -->
  <text x="60" y="452" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#A0B4D0">2025년 7월 조기삭제 제도 반영 · 체크카드 실적 + 비금융정보 제출</text>

  <!-- Right: Key stat cards -->
  <rect x="840" y="68" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="122" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">공공기록 삭제 기간</text>
  <text x="1000" y="184" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">1년</text>

  <rect x="840" y="232" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="286" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">삭제 후 신용점수</text>
  <text x="1000" y="348" font-family="-apple-system, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">700점대+</text>

  <rect x="840" y="396" width="320" height="148" rx="20" fill="#34D399" opacity="0.2"/>
  <rect x="840" y="396" width="320" height="148" rx="20" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="1000" y="450" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">평균 상승폭</text>
  <text x="1000" y="512" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">+102점</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
