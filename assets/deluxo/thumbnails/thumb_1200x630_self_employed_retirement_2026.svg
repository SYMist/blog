  <text x="134" y="67" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <rect x="222" y="42" width="232" height="38" rx="19" fill="#1A3270"/>
