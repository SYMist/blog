  <text x="338" y="67" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#34D399" text-anchor="middle">연간 238만원 절세</text>

  <rect x="468" y="42" width="192" height="38" rx="19" fill="#1A3270"/>
