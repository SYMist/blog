  <text x="208" y="548" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">1억 증여</text>
  <text x="208" y="600" font-family="-apple-system, sans-serif" font-size="48" font-weight="700" fill="#34D399" text-anchor="middle">485만원</text>
  <text x="208" y="642" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">납부세액</text>

  <rect x="376" y="500" width="296" height="160" rx="16" fill="#0D2347"/>
  <text x="524" y="548" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">3억 증여</text>
  <text x="524" y="600" font-family="-apple-system, sans-serif" font-size="48" font-weight="700" fill="#34D399" text-anchor="middle">3,880만원</text>
  <text x="524" y="642" font-family="-apple-system, sans-serif" font-size="22" fill="#A0B4D0" text-anchor="middle">납부세액</text>

