  <text x="856" y="548" font-family="-apple-system, sans-serif" font-size="24" fill="#A0B4D0" text-anchor="middle">3억+혼인공제</text>
  <text x="856" y="600" font-family="-apple-system, sans-serif" font-size="48" font-weight="700" fill="#F59E0B" text-anchor="middle">1,940만원</text>
  <text x="856" y="642" font-family="-apple-system, sans-serif" font-size="22" fill="#F59E0B" text-anchor="middle">↓ 1,940만 절감!</text>

