<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="80" y="120" width="200" height="56" rx="28" fill="#F59E0B"/>
  <text x="180" y="157" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#0B1F3B">2026 최신</text>

  <!-- Main text -->
  <text x="80" y="290" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="84" font-weight="900" fill="#FFFFFF">소상공인</text>
  <text x="80" y="400" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="84" font-weight="900" fill="#FFFFFF">전기료 감면</text>

  <!-- Sub text -->
  <text x="80" y="500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="52" font-weight="600" fill="#EAF2FF">에너지 비용 지원 3가지</text>
  <text x="80" y="570" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="52" font-weight="600" fill="#EAF2FF">조건·금액·신청 총정리</text>

  <!-- Highlight box -->
  <rect x="80" y="640" width="920" height="120" rx="20" fill="rgba(255,255,255,0.08)"/>
  <text x="540" y="695" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="44" font-weight="800" fill="#F59E0B">바우처 25만 + 기기 160만</text>
  <text x="540" y="740" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="32" fill="#EAF2FF">세 가지 중복 신청 가능</text>

  <!-- Chips -->
  <rect x="80" y="830" width="220" height="60" rx="30" fill="#E8F0FF"/>
  <text x="190" y="869" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">경영안정바우처</text>

  <rect x="330" y="830" width="220" height="60" rx="30" fill="#E8F0FF"/>
  <text x="440" y="869" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">고효율기기</text>

  <rect x="580" y="830" width="220" height="60" rx="30" fill="#E8F0FF"/>
  <text x="690" y="869" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">에너지효율</text>

  <!-- Bottom accent -->
  <rect x="80" y="980" width="920" height="6" rx="3" fill="#F59E0B"/>
</svg>
