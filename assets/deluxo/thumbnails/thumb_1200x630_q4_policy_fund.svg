  <text x="60" y="175" font-family="'Pretendard',sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">소상공인 정책자금</text>
  <text x="60" y="240" font-family="'Pretendard',sans-serif" font-size="40" font-weight="600" fill="#EAF2FF">신청 일정·금리·한도 총정리</text>

