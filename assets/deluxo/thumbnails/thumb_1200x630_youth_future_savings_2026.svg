<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="60%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0B1F3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Chips -->
  <rect x="60" y="72" width="150" height="46" rx="23" fill="#1D4ED8"/>
  <text x="135" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">2026 최신</text>

  <rect x="222" y="72" width="214" height="46" rx="23" fill="#1D4ED8"/>
  <text x="329" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">정부기여금 12%</text>

  <rect x="448" y="72" width="220" height="46" rx="23" fill="#34D399" opacity="0.8"/>
  <text x="558" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#0B1F3B" text-anchor="middle">3년 자산형성</text>

  <!-- Main title -->
  <text x="60" y="206" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">청년 미래적금 완전 가이드</text>
  <text x="60" y="286" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#F59E0B">3년 2,200만 원 자산형성 (2026)</text>

  <!-- Subtitle -->
  <text x="60" y="352" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#EAF2FF">가입 조건 · 우대형 정부기여금 12% · 도약계좌 갈아타기 비교</text>

  <!-- Divider -->
  <rect x="60" y="390" width="660" height="3" fill="#F59E0B" rx="2"/>

  <!-- Bottom note -->
  <text x="60" y="438" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#A0B4D0">2026년 6월 출시 예정 · 납입액별 수령액 시뮬레이션 · 서민금융진흥원 ☎ 1397</text>

  <!-- Right: Key stat cards -->
  <rect x="840" y="68" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="122" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">우대형 수령액</text>
  <text x="1000" y="184" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">2,200만원</text>

  <rect x="840" y="232" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="286" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">정부기여금</text>
  <text x="1000" y="348" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">최대 12%</text>

  <rect x="840" y="396" width="320" height="148" rx="20" fill="#34D399" opacity="0.2"/>
  <rect x="840" y="396" width="320" height="148" rx="20" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="1000" y="450" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">만기</text>
  <text x="1000" y="512" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">3년</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
