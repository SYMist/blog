  <text x="380" y="496" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">보증료 환급</text>

  <rect x="520" y="460" width="220" height="54" rx="27" fill="#E8F0FF"/>
  <text x="630" y="496" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">신청 방법</text>

