  <text x="980" y="350" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#EAF2FF">보증료 환급 (정부24)</text>
  <text x="980" y="385" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#F59E0B">최대 40만원</text>

