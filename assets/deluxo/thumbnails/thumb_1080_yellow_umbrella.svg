<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="80" y="120" width="200" height="56" rx="28" fill="#F59E0B"/>
  <text x="180" y="157" font-size="28" fill="#0B1F3B" font-weight="800" font-family="'Pretendard',sans-serif" text-anchor="middle">2026 최신</text>

  <!-- Main Text -->
  <text x="80" y="280" font-size="82" fill="#FFFFFF" font-weight="900" font-family="'Pretendard',sans-serif" letter-spacing="-1.5">노란우산공제</text>
  <text x="80" y="380" font-size="82" fill="#FFFFFF" font-weight="900" font-family="'Pretendard',sans-serif" letter-spacing="-1.5">가입·해지·절세</text>

  <!-- Sub Text -->
  <text x="80" y="480" font-size="52" fill="#EAF2FF" font-weight="600" font-family="'Pretendard',sans-serif" letter-spacing="-0.5">소득공제 최대 600만 원</text>
  <text x="80" y="555" font-size="52" fill="#EAF2FF" font-weight="600" font-family="'Pretendard',sans-serif" letter-spacing="-0.5">소상공인 퇴직금 만들기</text>

  <!-- Info box -->
  <rect x="80" y="620" width="920" height="140" rx="20" fill="rgba(255,255,255,0.08)"/>
  <text x="540" y="678" font-size="36" fill="#FFFFFF" font-weight="700" font-family="'Pretendard',sans-serif" text-anchor="middle">압류 금지 · 복리이자 · 무이자 대출</text>
  <text x="540" y="730" font-size="30" fill="#B0C4FF" font-weight="500" font-family="'Pretendard',sans-serif" text-anchor="middle">8대 지급 사유 확대 · 중간 정산 가능</text>

  <!-- 3 Chips -->
  <rect x="260" y="830" width="180" height="60" rx="30" fill="#E8F0FF"/>
  <text x="350" y="870" font-size="30" fill="#1D4ED8" font-weight="700" font-family="'Pretendard',sans-serif" text-anchor="middle">절세</text>

  <rect x="460" y="830" width="180" height="60" rx="30" fill="#E8F0FF"/>
  <text x="550" y="870" font-size="30" fill="#1D4ED8" font-weight="700" font-family="'Pretendard',sans-serif" text-anchor="middle">압류금지</text>

  <rect x="660" y="830" width="180" height="60" rx="30" fill="#E8F0FF"/>
  <text x="750" y="870" font-size="30" fill="#1D4ED8" font-weight="700" font-family="'Pretendard',sans-serif" text-anchor="middle">퇴직금</text>

  <!-- Gold bar -->
  <rect x="0" y="980" width="1080" height="100" rx="0" fill="#F59E0B"/>
</svg>
