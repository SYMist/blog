<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 장식 -->
  <circle cx="1050" cy="315" r="300" fill="#1A3270" opacity="0.35"/>
  <circle cx="150" cy="580" r="140" fill="#0D2347" opacity="0.5"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="160" height="44" rx="22" fill="#F59E0B"/>
  <text x="140" y="79" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <!-- 메인 제목 -->
  <text x="60" y="166" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF">사업주가 알아야 할</text>
  <text x="60" y="240" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="900" fill="#34D399">가족돌봄휴직 의무</text>
  <text x="60" y="314" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF">취업규칙 가이드</text>

  <!-- 서브 -->
  <text x="60" y="378" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" fill="#EAF2FF">거부 5가지 사유 · 과태료·벌금 기준</text>
  <text x="60" y="412" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" fill="#EAF2FF">취업규칙 필수 조항까지</text>

  <!-- 구분선 -->
  <rect x="60" y="440" width="500" height="3" rx="2" fill="#34D399"/>

  <!-- 칩 -->
  <rect x="60" y="464" width="170" height="44" rx="22" fill="#E8F0FF"/>
  <text x="145" y="492" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">거부 5가지 사유</text>

  <rect x="246" y="464" width="170" height="44" rx="22" fill="#E8F0FF"/>
  <text x="331" y="492" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">과태료 500만 원</text>

  <rect x="432" y="464" width="148" height="44" rx="22" fill="#E8F0FF"/>
  <text x="506" y="492" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">취업규칙</text>

  <!-- 우측 카드 -->
  <rect x="700" y="50" width="450" height="530" rx="24" fill="#0D2347" stroke="#1A3270" stroke-width="2"/>

  <text x="925" y="104" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="middle">핵심 의무 요약</text>
  <rect x="720" y="118" width="410" height="2" fill="#1A3270"/>

  <!-- 허용 의무 -->
  <rect x="720" y="132" width="410" height="90" rx="12" fill="#102A56"/>
  <text x="925" y="168" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle">허용 의무 (원칙)</text>
  <text x="925" y="196" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">정당한 예외 없으면 반드시 허용</text>
  <text x="925" y="216" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">위반 시 500만 원 이하 과태료</text>

  <!-- 기간 -->
  <rect x="720" y="234" width="410" height="90" rx="12" fill="#102A56"/>
  <text x="925" y="270" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle">기간 (무급)</text>
  <text x="925" y="298" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">휴직 연 90일 (1회 30일+) / 휴가 연 10일</text>

  <!-- 서면 의무 -->
  <rect x="720" y="336" width="410" height="90" rx="12" fill="#102A56"/>
  <text x="925" y="372" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle">거부 시 서면 통보</text>
  <text x="925" y="400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">사유 서면 명시 + 대안 제시 의무</text>

  <!-- 불이익 금지 -->
  <rect x="720" y="438" width="410" height="90" rx="12" fill="#1A0F2E"/>
  <text x="925" y="474" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="800" fill="#EF4444" text-anchor="middle">불이익 처우 금지</text>
  <text x="925" y="502" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">해고·근로조건 악화 → 3천만 원 벌금</text>

  <!-- 출처 -->
  <text x="600" y="604" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#4A6080" text-anchor="middle">deluxo · 남녀고용평등과 일·가정 양립 지원에 관한 법률 · 2026년 5월 기준</text>
</svg>
