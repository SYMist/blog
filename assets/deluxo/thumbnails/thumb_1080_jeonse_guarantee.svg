<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="80" y="120" width="200" height="56" rx="28" fill="#F59E0B"/>
  <text x="180" y="157" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#0B1F3B">2026 최신</text>

  <!-- Main text -->
  <text x="80" y="290" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="82" font-weight="900" fill="#FFFFFF">전세보증금</text>
  <text x="80" y="395" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="82" font-weight="900" fill="#FFFFFF">반환보증</text>

  <!-- Sub text -->
  <text x="80" y="500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="52" font-weight="600" fill="#EAF2FF">HUG·HF·SGI 비교</text>
  <text x="80" y="570" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="52" font-weight="600" fill="#EAF2FF">보증료 최대 40만원 환급</text>

  <!-- Highlight box -->
  <rect x="80" y="640" width="920" height="120" rx="20" fill="rgba(255,255,255,0.08)"/>
  <text x="540" y="695" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="44" font-weight="800" fill="#F59E0B">보증금 최대 7억원 보호</text>
  <text x="540" y="740" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="32" fill="#EAF2FF">요율 최저 연 0.04%부터</text>

  <!-- Chips -->
  <rect x="80" y="830" width="180" height="60" rx="30" fill="#E8F0FF"/>
  <text x="170" y="869" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">기관 비교</text>

  <rect x="290" y="830" width="220" height="60" rx="30" fill="#E8F0FF"/>
  <text x="400" y="869" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">보증료 환급</text>

  <rect x="540" y="830" width="220" height="60" rx="30" fill="#E8F0FF"/>
  <text x="650" y="869" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">신청 방법</text>

  <!-- Bottom accent line -->
  <rect x="80" y="980" width="920" height="6" rx="3" fill="#F59E0B"/>
</svg>
