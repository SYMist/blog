  <text x="995" y="388" font-family="-apple-system, sans-serif" font-size="20" fill="#EF4444" text-anchor="middle">③ 채무자 이자 납부</text>
  <text x="995" y="414" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">승인 = 중단!</text>
  <line x1="870" y1="430" x2="1120" y2="430" stroke="#1A3270" stroke-width="1"/>
  <text x="995" y="466" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">easylaw.go.kr</text>
  <text x="995" y="490" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">법률구조공단 132</text>

  <!-- Footer -->
  <rect x="0" y="580" width="1200" height="50" fill="#0D2347" opacity="0.9"/>
  <text x="600" y="612" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">deluxo.co.kr · 채무 소멸시효 완전 정리 | 2026년 최신</text>
