  <text x="145" y="370" font-family="-apple-system, sans-serif" font-size="44" font-weight="700" fill="#F59E0B" text-anchor="middle">5년</text>
  <text x="145" y="398" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">상사채권</text>

  <rect x="246" y="286" width="170" height="120" rx="12" fill="#0D2347"/>
  <text x="331" y="322" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">개인 차용</text>
  <text x="331" y="370" font-family="-apple-system, sans-serif" font-size="44" font-weight="700" fill="#34D399" text-anchor="middle">10년</text>
  <text x="331" y="398" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">민사채권</text>

  <rect x="432" y="286" width="170" height="120" rx="12" fill="#0D2347"/>
  <text x="517" y="322" font-family="-apple-system, sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">임금·퇴직금</text>
  <text x="517" y="370" font-family="-apple-system, sans-serif" font-size="44" font-weight="700" fill="#60A5FA" text-anchor="middle">3년</text>
  <text x="517" y="398" font-family="-apple-system, sans-serif" font-size="16" fill="#A0B4D0" text-anchor="middle">근로기준법</text>

