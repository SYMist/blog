  <rect x="80" y="930" width="920" height="70" rx="16" fill="rgba(245,158,11,0.15)"/>
  <text x="540" y="975" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="34" font-weight="800" fill="#F59E0B">모르면 수억 원 지원금 놓칩니다!</text>

