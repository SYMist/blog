  <text x="540" y="720" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" fill="#EAF2FF">창업패키지 + 정책자금 + 지자체 이차보전</text>

  <!-- Chips -->
  <rect x="80" y="810" width="200" height="60" rx="32" fill="#E8F0FF"/>
  <text x="180" y="849" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">보조금3억</text>
  <rect x="310" y="810" width="200" height="60" rx="32" fill="#E8F0FF"/>
  <text x="410" y="849" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">대출2.5%</text>
  <rect x="540" y="810" width="180" height="60" rx="32" fill="#E8F0FF"/>
  <text x="630" y="849" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">패키지</text>
  <rect x="750" y="810" width="200" height="60" rx="32" fill="#E8F0FF"/>
  <text x="850" y="849" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#1D4ED8">교육필수</text>

