<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="60" y="50" width="200" height="50" rx="25" fill="#F59E0B"/>
  <text x="160" y="84" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#0B1F3B">2026 최신</text>

  <!-- Main text -->
  <text x="60" y="185" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">소상공인 전기료 감면</text>

  <!-- Sub text -->
  <text x="60" y="260" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="42" font-weight="600" fill="#EAF2FF">에너지 비용 지원 3가지 | 조건·금액·신청 총정리</text>

  <!-- Highlight box -->
  <rect x="60" y="305" width="700" height="90" rx="16" fill="rgba(255,255,255,0.08)"/>
  <text x="410" y="352" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="38" font-weight="800" fill="#F59E0B">바우처 25만 + 고효율기기 160만</text>
  <text x="410" y="385" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#EAF2FF">세 가지 사업 중복 신청 가능</text>

  <!-- Right side -->
  <rect x="810" y="305" width="340" height="90" rx="16" fill="rgba(255,255,255,0.12)"/>
  <text x="980" y="348" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="24" fill="#EAF2FF">에너지효율향상 지원</text>
  <text x="980" y="383" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#F59E0B">설비비 70% 보조</text>

  <!-- Chips -->
  <rect x="60" y="460" width="220" height="54" rx="27" fill="#E8F0FF"/>
  <text x="170" y="496" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">경영안정바우처</text>

  <rect x="310" y="460" width="200" height="54" rx="27" fill="#E8F0FF"/>
  <text x="410" y="496" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">고효율기기</text>

  <rect x="540" y="460" width="200" height="54" rx="27" fill="#E8F0FF"/>
  <text x="640" y="496" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">에너지효율</text>

  <!-- Bottom accent -->
  <rect x="60" y="585" width="1080" height="5" rx="2.5" fill="#F59E0B"/>
</svg>
