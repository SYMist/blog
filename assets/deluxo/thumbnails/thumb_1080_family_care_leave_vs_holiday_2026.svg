<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 배경 장식 원 -->
  <circle cx="900" cy="180" r="200" fill="#1A3270" opacity="0.5"/>
  <circle cx="150" cy="900" r="160" fill="#1A3270" opacity="0.4"/>

  <!-- 배지 (amber) -->
  <rect x="60" y="60" width="200" height="52" rx="26" fill="#F59E0B"/>
  <text x="160" y="93" font-family="-apple-system,sans-serif" font-size="26" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <!-- 메인 텍스트 -->
  <text x="60" y="220" font-family="-apple-system,sans-serif" font-size="86" font-weight="900" fill="#FFFFFF">가족돌봄</text>
  <text x="60" y="316" font-family="-apple-system,sans-serif" font-size="86" font-weight="900" fill="#FFFFFF">휴직 vs 휴가</text>

  <!-- 서브 텍스트 -->
  <text x="60" y="400" font-family="-apple-system,sans-serif" font-size="46" font-weight="700" fill="#A0B4D0">차이·중복·사용일수</text>
  <text x="60" y="456" font-family="-apple-system,sans-serif" font-size="46" font-weight="700" fill="#A0B4D0">완전 정리</text>

  <!-- 구분선 -->
  <line x1="60" y1="494" x2="500" y2="494" stroke="#34D399" stroke-width="4"/>

  <!-- 핵심 포인트 -->
  <text x="60" y="558" font-family="-apple-system,sans-serif" font-size="34" fill="#FFFFFF">✔ 두 제도 모두 무급</text>
  <text x="60" y="610" font-family="-apple-system,sans-serif" font-size="34" fill="#FFFFFF">✔ 휴가 10일 ≠ 별도 추가</text>
  <text x="60" y="662" font-family="-apple-system,sans-serif" font-size="34" fill="#FFFFFF">✔ 합산 연간 90일 한도</text>

  <!-- 칩 3개 -->
  <!-- 칩 1: 2026 최신 (amber) — 상단 배지로 표시됨, 여기선 blue chips -->
  <rect x="60" y="726" width="280" height="56" rx="28" fill="#E8F0FF"/>
  <text x="200" y="761" font-family="-apple-system,sans-serif" font-size="28" font-weight="700" fill="#1D4ED8" text-anchor="middle">휴직 최대 90일</text>

  <rect x="360" y="726" width="300" height="56" rx="28" fill="#E8F0FF"/>
  <text x="510" y="761" font-family="-apple-system,sans-serif" font-size="28" font-weight="700" fill="#1D4ED8" text-anchor="middle">휴가 10일은 포함</text>

  <!-- 법적 근거 -->
  <rect x="60" y="820" width="900" height="60" rx="14" fill="#1A3270"/>
  <text x="510" y="857" font-family="-apple-system,sans-serif" font-size="26" fill="#A0B4D0" text-anchor="middle">남녀고용평등법 제22조의2·22조의3 기준</text>

  <!-- 하단 사이트 -->
  <text x="60" y="960" font-family="-apple-system,sans-serif" font-size="26" fill="#4B6080">공식 안내: easylaw.go.kr · gov.kr</text>
  <text x="60" y="1000" font-family="-apple-system,sans-serif" font-size="24" fill="#4B6080">고용노동부 고객상담센터 ☎ 1350</text>
</svg>
