<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Badge: 2026 최신 -->
  <rect x="498" y="130" width="204" height="48" rx="24" fill="#F59E0B"/>
  <text x="600" y="162" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">2026 최신</text>

  <!-- Main text -->
  <text x="600" y="270" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">대전·세종·충청</text>

  <!-- Sub text (single line) -->
  <text x="600" y="340" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="40" font-weight="600" fill="#EAF2FF">소상공인 지원금 지역별 총정리</text>

  <!-- Chips row -->
  <!-- Chip: 대전 -->
  <rect x="270" y="410" width="120" height="50" rx="24" fill="#E8F0FF"/>
  <text x="330" y="443" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">대전</text>

  <!-- Chip: 세종 -->
  <rect x="420" y="410" width="120" height="50" rx="24" fill="#E8F0FF"/>
  <text x="480" y="443" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">세종</text>

  <!-- Chip: 충남 -->
  <rect x="570" y="410" width="120" height="50" rx="24" fill="#E8F0FF"/>
  <text x="630" y="443" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">충남</text>

  <!-- Chip: 충북 -->
  <rect x="720" y="410" width="120" height="50" rx="24" fill="#E8F0FF"/>
  <text x="780" y="443" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">충북</text>
</svg>