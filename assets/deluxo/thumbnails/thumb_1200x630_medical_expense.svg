<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="80" y="100" width="180" height="50" rx="25" fill="#F59E0B"/>
  <text x="170" y="133" font-size="28" fill="#0B1F3B" font-weight="700" font-family="Pretendard, 'Noto Sans KR', sans-serif" text-anchor="middle">2026 최신</text>

  <!-- Main Text -->
  <text x="80" y="250" font-size="82" fill="#FFFFFF" font-weight="800" font-family="Pretendard, 'Noto Sans KR', sans-serif" letter-spacing="-1.5">재난적 의료비 지원</text>

  <!-- Sub Text -->
  <text x="80" y="340" font-size="46" fill="#EAF2FF" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif" letter-spacing="-0.5">비급여 포함 최대 80%</text>
  <text x="80" y="410" font-size="46" fill="#EAF2FF" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif" letter-spacing="-0.5">연간 최대 5,000만원</text>

  <!-- Chips -->
  <rect x="80" y="480" width="120" height="48" rx="24" fill="#E8F0FF"/>
  <text x="140" y="512" font-size="28" fill="#1D4ED8" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif" text-anchor="middle">신청</text>

  <rect x="220" y="480" width="120" height="48" rx="24" fill="#E8F0FF"/>
  <text x="280" y="512" font-size="28" fill="#1D4ED8" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif" text-anchor="middle">조건</text>

  <rect x="360" y="480" width="120" height="48" rx="24" fill="#E8F0FF"/>
  <text x="420" y="512" font-size="28" fill="#1D4ED8" font-weight="600" font-family="Pretendard, 'Noto Sans KR', sans-serif" text-anchor="middle">서류</text>
</svg>
