  <!-- Main text -->
  <text x="540" y="430" font-family="'Pretendard', sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" text-anchor="middle">세무조사 대응법</text>

  <!-- Sub text -->
  <text x="540" y="540" font-family="'Pretendard', sans-serif" font-size="52" font-weight="600" fill="#EAF2FF" text-anchor="middle">소상공인 가산세</text>
  <text x="540" y="610" font-family="'Pretendard', sans-serif" font-size="52" font-weight="600" fill="#EAF2FF" text-anchor="middle">줄이는 법 총정리</text>

