  <text x="525" y="799" font-family="'Pretendard', sans-serif" font-size="30" font-weight="700" fill="#1D4ED8" text-anchor="middle">수정신고</text>

  <rect x="675" y="760" width="200" height="60" rx="32" fill="#E8F0FF"/>
  <text x="775" y="799" font-family="'Pretendard', sans-serif" font-size="30" font-weight="700" fill="#1D4ED8" text-anchor="middle">AI검증</text>
