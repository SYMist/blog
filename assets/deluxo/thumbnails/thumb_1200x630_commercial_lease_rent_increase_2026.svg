<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="100%" stop-color="#102A56"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 장식 -->
  <circle cx="1050" cy="315" r="300" fill="#1A3270" opacity="0.35"/>
  <circle cx="150" cy="580" r="140" fill="#0D2347" opacity="0.5"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="160" height="44" rx="22" fill="#F59E0B"/>
  <text x="140" y="79" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#0B1F3B" text-anchor="middle">2026 최신</text>

  <!-- 메인 제목 -->
  <text x="60" y="166" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF">상가임대차보호법</text>
  <text x="60" y="240" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="60" font-weight="900" fill="#34D399">임대료 인상 한도</text>
  <text x="60" y="314" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF">총정리 (2026)</text>

  <!-- 서브 -->
  <text x="60" y="378" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" fill="#EAF2FF">5% 상한·환산보증금·갱신청구권 10년</text>
  <text x="60" y="416" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" fill="#EAF2FF">권리금 보호·묵시적 갱신까지</text>

  <!-- 구분선 -->
  <rect x="60" y="446" width="500" height="3" rx="2" fill="#34D399"/>

  <!-- 칩 -->
  <rect x="60" y="470" width="180" height="44" rx="22" fill="#E8F0FF"/>
  <text x="150" y="498" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="middle">임대료 5% 상한</text>

  <rect x="256" y="470" width="180" height="44" rx="22" fill="#E8F0FF"/>
  <text x="346" y="498" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="middle">갱신청구권 10년</text>

  <rect x="452" y="470" width="148" height="44" rx="22" fill="#E8F0FF"/>
  <text x="526" y="498" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="middle">권리금 보호</text>

  <!-- 우측 카드 -->
  <rect x="700" y="50" width="450" height="530" rx="24" fill="#0D2347" stroke="#1A3270" stroke-width="2"/>

  <text x="925" y="104" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#F59E0B" text-anchor="middle">핵심 내용 요약</text>
  <rect x="720" y="118" width="410" height="2" fill="#1A3270"/>

  <!-- 지역 기준 -->
  <rect x="720" y="132" width="410" height="100" rx="12" fill="#102A56"/>
  <text x="925" y="171" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">서울 9억 / 수도권·부산 6.9억</text>
  <text x="925" y="199" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">이하 → 연 5% 상한 적용</text>
  <text x="925" y="225" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#A0B4D0" text-anchor="middle">환산보증금 = 보증금 + 월세×100</text>

  <!-- 갱신청구권 -->
  <rect x="720" y="244" width="410" height="90" rx="12" fill="#102A56"/>
  <text x="925" y="281" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">계약갱신청구권 10년</text>
  <text x="925" y="310" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">만료 6개월~1개월 전 요구 필수</text>

  <!-- 권리금 -->
  <rect x="720" y="346" width="410" height="90" rx="12" fill="#102A56"/>
  <text x="925" y="383" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">권리금 회수 보호</text>
  <text x="925" y="412" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">임대인 방해 금지 · 손배 소멸시효 3년</text>

  <!-- 묵시적 갱신 -->
  <rect x="720" y="448" width="410" height="90" rx="12" fill="#102A56"/>
  <text x="925" y="485" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">묵시적 갱신 후 해지</text>
  <text x="925" y="514" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">임차인 통지 후 3개월 → 효력 발생</text>

  <!-- 출처 -->
  <text x="600" y="604" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#4A6080" text-anchor="middle">deluxo · 상가건물 임대차보호법 · 대한법률구조공단 132 · 2026년 5월 기준</text>
</svg>
