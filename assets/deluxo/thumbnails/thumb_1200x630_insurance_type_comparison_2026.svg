<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="60%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0B1F3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Chips -->
  <rect x="60" y="72" width="150" height="46" rx="23" fill="#1D4ED8"/>
  <text x="135" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">2026 최신</text>

  <rect x="222" y="72" width="190" height="46" rx="23" fill="#1D4ED8"/>
  <text x="317" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#E8F0FF" text-anchor="middle">유형별 비교</text>

  <rect x="424" y="72" width="230" height="46" rx="23" fill="#34D399" opacity="0.8"/>
  <text x="539" y="102" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#0B1F3B" text-anchor="middle">차액 시뮬레이션</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">순수보장형 vs 만기환급형</text>
  <text x="60" y="290" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#F59E0B">어떤 게 유리할까 (2026)</text>

  <!-- Subtitle -->
  <text x="60" y="356" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#EAF2FF">적립형 · 무해지환급형 · 갱신형 vs 비갱신형 비교</text>

  <!-- Divider -->
  <rect x="60" y="394" width="660" height="3" fill="#F59E0B" rx="2"/>

  <!-- Bottom note -->
  <text x="60" y="444" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#A0B4D0">20년 차액 투자 시뮬레이션 · 물가상승률 반영 실질 환급금</text>

  <!-- Right: Key stat cards -->
  <rect x="840" y="68" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="122" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">월 보험료 차이</text>
  <text x="1000" y="184" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">2배</text>

  <rect x="840" y="232" width="320" height="148" rx="20" fill="#1A3270"/>
  <text x="1000" y="286" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">차액 20년 투자</text>
  <text x="1000" y="348" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">+1,470만원+</text>

  <rect x="840" y="396" width="320" height="148" rx="20" fill="#34D399" opacity="0.2"/>
  <rect x="840" y="396" width="320" height="148" rx="20" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="1000" y="450" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">전문가 권장</text>
  <text x="1000" y="512" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">순수보장형</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
