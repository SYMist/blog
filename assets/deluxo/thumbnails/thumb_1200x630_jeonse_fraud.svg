<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1F3B"/><stop offset="100%" stop-color="#102A56"/></linearGradient></defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>

  <rect x="60" y="50" width="240" height="44" rx="22" fill="rgba(245,158,11,0.2)"/>
  <text x="180" y="80" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="800" fill="#F59E0B">2026 최신</text>

  <text x="60" y="175" font-family="'Pretendard',sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">전세사기 피해 대응</text>
  <text x="60" y="240" font-family="'Pretendard',sans-serif" font-size="40" font-weight="600" fill="#EAF2FF">보증금 회수·지원제도 총정리</text>

  <rect x="60" y="270" width="200" height="44" rx="22" fill="#E8F0FF"/>
  <text x="160" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">우선매수권</text>

  <rect x="280" y="270" width="180" height="44" rx="22" fill="#E8F0FF"/>
  <text x="370" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">세제 감면</text>

  <rect x="480" y="270" width="180" height="44" rx="22" fill="#E8F0FF"/>
  <text x="570" y="300" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">금융 지원</text>

  <rect x="800" y="80" width="360" height="500" rx="20" fill="rgba(245,158,11,0.08)"/>

  <text x="980" y="170" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFF">279억</text>
  <text x="980" y="205" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#F59E0B">추경 보전 예산</text>

  <text x="980" y="295" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="44" font-weight="900" fill="#FFF">3,040억</text>
  <text x="980" y="330" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#F59E0B">인천 주거안정</text>

  <text x="980" y="415" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="48" font-weight="900" fill="#FFF">4억</text>
  <text x="980" y="450" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="22" font-weight="600" fill="#F59E0B">대환 대출 한도</text>

  <text x="980" y="530" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">취득세 면제 · 재산세 감면</text>
  <text x="980" y="560" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="700" fill="#EAF2FF">법률 비용 250만 원</text>

  <text x="60" y="400" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#EAF2FF">우선매수권 + 조세 안분 특례 → 배당 극대화</text>
  <text x="60" y="445" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#EAF2FF">버팀목 대출 이자 24개월 전액 지원</text>
  <text x="60" y="490" font-family="'Pretendard',sans-serif" font-size="30" font-weight="700" fill="#EAF2FF">인천 이사비 150만 + 월세 40만×12개월</text>

  <text x="60" y="570" font-family="'Pretendard',sans-serif" font-size="24" font-weight="600" fill="#F59E0B">피해자 결정 후 3년 이내 신청 · 세제 감면 26.12.31 한시</text>
