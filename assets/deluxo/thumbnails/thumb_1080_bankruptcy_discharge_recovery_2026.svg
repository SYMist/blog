  <text x="540" y="966" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#EAF2FF" text-anchor="middle">2025년 7월 공공기록 조기삭제 제도 반영</text>
  <text x="540" y="1014" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#F59E0B" text-anchor="middle">체크카드 + 비금융정보 제출 + 새 주거래은행</text>

  <rect x="0" y="1068" width="1080" height="12" fill="url(#accent)"/>
