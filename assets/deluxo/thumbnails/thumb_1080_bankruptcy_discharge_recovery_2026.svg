  <text x="205" y="808" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">1년</text>

  <rect x="395" y="698" width="290" height="140" rx="20" fill="#1A3270"/>
  <text x="540" y="754" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">삭제 후 점수</text>
  <text x="540" y="808" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">700점대+</text>

  <rect x="730" y="698" width="290" height="140" rx="20" fill="#34D399" opacity="0.2"/>
