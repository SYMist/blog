  <text x="60" y="628" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#EAF2FF">2026년 총정리</text>

  <!-- Divider -->
  <rect x="60" y="666" width="960" height="4" fill="#F59E0B" rx="2"/>

