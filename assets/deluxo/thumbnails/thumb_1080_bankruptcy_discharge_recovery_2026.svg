    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="12" fill="url(#accent)"/>

  <!-- Chips -->
  <rect x="60" y="140" width="164" height="54" rx="27" fill="#1D4ED8"/>
  <text x="142" y="174" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#E8F0FF" text-anchor="middle">2026 최신</text>

  <rect x="236" y="140" width="210" height="54" rx="27" fill="#1D4ED8"/>
  <text x="341" y="174" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#E8F0FF" text-anchor="middle">1년 조기삭제</text>

  <rect x="458" y="140" width="240" height="54" rx="27" fill="#34D399" opacity="0.8"/>
