<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="60" y="45" width="160" height="42" rx="21" fill="#EF4444"/>
  <text x="140" y="73" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">2026 최신</text>

  <!-- Title -->
  <text x="540" y="140" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="900" font-family="Pretendard,sans-serif">전기차 보조금·세금 혜택</text>
  <text x="540" y="190" text-anchor="middle" fill="#E2E8F0" font-size="30" font-weight="600" font-family="Pretendard,sans-serif">차종별 실구매가 비교 총정리</text>
  <rect x="390" y="210" width="300" height="4" rx="2" fill="url(#blue)"/>

  <!-- 3 Key Numbers -->
  <rect x="60" y="240" width="300" height="90" rx="16" fill="#1E293B" stroke="#1D4ED8" stroke-width="2"/>
  <text x="210" y="275" text-anchor="middle" fill="#93C5FD" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">국고 보조금 최대</text>
  <text x="210" y="312" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="900" font-family="Pretendard,sans-serif">580만 원</text>

  <rect x="390" y="240" width="300" height="90" rx="16" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <text x="540" y="275" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">세제 감면 합계</text>
  <text x="540" y="312" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="900" font-family="Pretendard,sans-serif">약 430만 원</text>

  <rect x="720" y="240" width="300" height="90" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="870" y="275" text-anchor="middle" fill="#FDE68A" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">전환 지원금 최대</text>
  <text x="870" y="312" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="900" font-family="Pretendard,sans-serif">130만 원</text>

  <!-- Top 5 Cars -->
  <text x="540" y="380" text-anchor="middle" fill="#93C5FD" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">주요 차종 실구매가 (서울 기준)</text>

  <!-- Car 1: 캐스퍼 -->
  <rect x="60" y="405" width="960" height="60" rx="12" fill="#1E293B"/>
  <rect x="80" y="418" width="36" height="36" rx="18" fill="#22C55E"/>
  <text x="98" y="443" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">1</text>
  <text x="135" y="443" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">캐스퍼 일렉트릭</text>
  <text x="500" y="443" text-anchor="end" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">3,137만 → 국비 530만+서울 150만</text>
  <text x="980" y="443" text-anchor="end" fill="#86EFAC" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">약 2,450만</text>

  <!-- Car 2: EV3 -->
  <rect x="60" y="475" width="960" height="60" rx="12" fill="#0F172A"/>
  <rect x="80" y="488" width="36" height="36" rx="18" fill="#22C55E"/>
  <text x="98" y="513" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">2</text>
  <text x="135" y="513" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">기아 EV3</text>
  <text x="500" y="513" text-anchor="end" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">4,200만 → 국비 530만+서울 150만</text>
  <text x="980" y="513" text-anchor="end" fill="#86EFAC" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">약 3,520만</text>

  <!-- Car 3: 아이오닉 5 -->
  <rect x="60" y="545" width="960" height="60" rx="12" fill="#1E293B"/>
  <rect x="80" y="558" width="36" height="36" rx="18" fill="#1D4ED8"/>
  <text x="98" y="583" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">3</text>
  <text x="135" y="583" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">아이오닉 5 스탠다드</text>
  <text x="500" y="583" text-anchor="end" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">5,200만 → 국비 650만+서울 200만</text>
  <text x="980" y="583" text-anchor="end" fill="#93C5FD" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">약 4,350만</text>

  <!-- Car 4: EV6 -->
  <rect x="60" y="615" width="960" height="60" rx="12" fill="#0F172A"/>
  <rect x="80" y="628" width="36" height="36" rx="18" fill="#1D4ED8"/>
  <text x="98" y="653" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">4</text>
  <text x="135" y="653" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">기아 EV6 롱레인지</text>
  <text x="500" y="653" text-anchor="end" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">5,500만 → 국비 570만+서울 190만</text>
  <text x="980" y="653" text-anchor="end" fill="#93C5FD" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">약 4,740만</text>

  <!-- Car 5: 모델 3 -->
  <rect x="60" y="685" width="960" height="60" rx="12" fill="#1E293B"/>
  <rect x="80" y="698" width="36" height="36" rx="18" fill="#EF4444"/>
  <text x="98" y="723" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">T</text>
  <text x="135" y="723" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">테슬라 모델 3 LR RWD</text>
  <text x="530" y="723" text-anchor="end" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">5,999만 → 국비 420만+서울 130만</text>
  <text x="980" y="723" text-anchor="end" fill="#FDE68A" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">약 5,449만</text>

  <!-- Price Cut Bars -->
  <rect x="60" y="775" width="960" height="80" rx="16" fill="#1E40AF" opacity="0.15"/>
  <rect x="60" y="775" width="960" height="80" rx="16" stroke="#1D4ED8" stroke-width="2" fill="none"/>
  <text x="540" y="808" text-anchor="middle" fill="#93C5FD" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">보조금 100% 지원 기준가</text>
  <text x="540" y="840" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="900" font-family="Pretendard,sans-serif">2026년 5,300만 원 미만 → 2027년 5,000만 원 미만으로 강화 예정</text>

  <!-- Warning -->
  <rect x="60" y="875" width="960" height="60" rx="14" fill="#EF4444" opacity="0.1"/>
  <rect x="60" y="875" width="960" height="60" rx="14" stroke="#F87171" stroke-width="1.5" fill="none"/>
  <text x="540" y="912" text-anchor="middle" fill="#FCA5A5" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">지자체 45곳+ 상반기 소진 예상 | ev.or.kr에서 잔여 물량 확인 필수</text>

  <!-- Chips -->
  <rect x="260" y="960" width="100" height="34" rx="17" fill="#EFF6FF"/>
  <text x="310" y="983" text-anchor="middle" fill="#1E40AF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">보조금</text>
  <rect x="376" y="960" width="100" height="34" rx="17" fill="#EFF6FF"/>
  <text x="426" y="983" text-anchor="middle" fill="#1E40AF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">세금</text>
  <rect x="492" y="960" width="120" height="34" rx="17" fill="#EFF6FF"/>
  <text x="552" y="983" text-anchor="middle" fill="#1E40AF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">실구매가</text>
  <rect x="628" y="960" width="120" height="34" rx="17" fill="#EFF6FF"/>
  <text x="688" y="983" text-anchor="middle" fill="#1E40AF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">전기차</text>

  <!-- Footer -->
  <text x="540" y="1055" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
</svg>
