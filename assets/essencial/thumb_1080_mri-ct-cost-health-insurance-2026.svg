  <text x="295" y="785" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">8~12만</text>
  <text x="295" y="820" text-anchor="middle" fill="#2DD4BF" font-size="18" font-weight="600" font-family="sans-serif">상급종합 22~30만</text>

