<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <rect x="80" y="100" width="240" height="46" rx="23" fill="#0F766E"/>
  <text x="200" y="132" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 건강보험 개정</text>

  <text x="80" y="220" fill="#FFFFFF" font-size="62" font-weight="800" font-family="sans-serif">MRI vs CT</text>
  <text x="80" y="290" fill="#5EEAD4" font-size="38" font-weight="600" font-family="sans-serif">비용 비교 2026</text>

  <rect x="80" y="320" width="380" height="6" rx="3" fill="#0F766E"/>

  <text x="80" y="385" fill="#5EEAD4" font-size="28" font-weight="700" font-family="sans-serif">건강보험 적용 조건</text>
  <text x="80" y="425" fill="#5EEAD4" font-size="28" font-weight="700" font-family="sans-serif">본인부담금 차이</text>

  <!-- Big numbers grid -->
  <rect x="80" y="475" width="430" height="170" rx="20" fill="#1e293b" stroke="#0F766E" stroke-width="3"/>
  <text x="295" y="525" text-anchor="middle" fill="#5EEAD4" font-size="20" font-weight="700" font-family="sans-serif">단순 두통 선별급여</text>
  <text x="295" y="585" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">80%</text>
  <text x="295" y="620" text-anchor="middle" fill="#FCA5A5" font-size="18" font-weight="600" font-family="sans-serif">환자 부담</text>

  <rect x="540" y="475" width="430" height="170" rx="20" fill="#1e293b" stroke="#0F766E" stroke-width="3"/>
  <text x="755" y="525" text-anchor="middle" fill="#5EEAD4" font-size="20" font-weight="700" font-family="sans-serif">5세대 비급여 자부담</text>
