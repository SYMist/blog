<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Chip: 2026 서민금융 -->
  <rect x="60" y="60" width="360" height="44" rx="22" fill="#B45309"/>
  <text x="240" y="90" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">2026 서민금융 완전 비교</text>

  <!-- Headline -->
  <text x="60" y="202" fill="#FFFFFF" font-size="54" font-weight="800" font-family="sans-serif">햇살론 vs 새희망홀씨</text>
  <text x="60" y="270" fill="#FCD34D" font-size="56" font-weight="800" font-family="sans-serif">어떤 상품이 유리?</text>
  <text x="60" y="328" fill="#FFFFFF" font-size="28" font-weight="600" font-family="sans-serif">소득·신용점수별 최적 서민금융 선택법</text>

  <!-- Card 1: 햇살론 일반 -->
  <rect x="60" y="376" width="960" height="158" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="90" y="420" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">햇살론 일반보증</text>
  <text x="90" y="468" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">소득 3,500만↓ · 금리 10%↓</text>
  <text x="1010" y="420" text-anchor="end" fill="#FCD34D" font-size="15" font-weight="600" font-family="sans-serif">한도 1,500만</text>
  <text x="1010" y="468" text-anchor="end" fill="#CBD5E1" font-size="16" font-family="sans-serif">신용점수 무관</text>
  <text x="90" y="510" fill="#D97706" font-size="14" font-weight="700" font-family="sans-serif">신용 하위 20% 미해당자도 신청 가능 · 서민금융진흥원 보증</text>

  <!-- Card 2: 햇살론 특례보증 -->
  <rect x="60" y="554" width="960" height="158" rx="16" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <text x="90" y="598" fill="#C4B5FD" font-size="16" font-weight="700" font-family="sans-serif">햇살론 특례보증 (구 햇살론15 개편)</text>
  <text x="90" y="646" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">소득 3,500만↓+신용 하위 20%</text>
  <text x="1010" y="598" text-anchor="end" fill="#C4B5FD" font-size="15" font-weight="600" font-family="sans-serif">한도 1,000만</text>
  <text x="1010" y="646" text-anchor="end" fill="#CBD5E1" font-size="16" font-family="sans-serif">금리 12.5%↓</text>
  <text x="90" y="688" fill="#9F7AEA" font-size="14" font-weight="700" font-family="sans-serif">사회적배려대상자(한부모·장애인·기초수급) 9.9% 우대 · 최저신용자 접근 가능</text>

  <!-- Card 3: 새희망홀씨 -->
  <rect x="60" y="732" width="960" height="158" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="90" y="776" fill="#6EE7B7" font-size="16" font-weight="700" font-family="sans-serif">새희망홀씨</text>
  <text x="90" y="824" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">소득 4,000만↓ · 한도 3,500만</text>
  <text x="1010" y="776" text-anchor="end" fill="#6EE7B7" font-size="15" font-weight="600" font-family="sans-serif">14개 은행</text>
  <text x="1010" y="824" text-anchor="end" fill="#CBD5E1" font-size="16" font-family="sans-serif">금리 10.5%↓</text>
  <text x="90" y="866" fill="#10B981" font-size="14" font-weight="700" font-family="sans-serif">3종 중 최대 한도 · 보증료 없음 · 모바일 비대면 신청 · 2026 공급 5.1조</text>

  <!-- Footer -->
  <text x="60" y="1042" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 2026.05 기준</text>
</svg>
