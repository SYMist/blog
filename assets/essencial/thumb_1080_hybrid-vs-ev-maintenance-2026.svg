  <rect x="230" y="850" width="620" height="60" rx="16" fill="#1E40AF" opacity="0.3"/>
  <text x="540" y="888" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700" font-family="sans-serif">분기점: 7~10년 보유 시 전기차 역전</text>

  <text x="540" y="990" text-anchor="middle" fill="#64748B" font-size="16" font-family="sans-serif">essencial | 비교형 콘텐츠</text>
