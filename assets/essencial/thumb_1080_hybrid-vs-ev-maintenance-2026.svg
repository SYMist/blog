<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <rect x="80" y="100" width="160" height="42" rx="21" fill="#EF4444"/>
  <text x="160" y="128" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="sans-serif">2026 최신</text>

  <text x="540" y="250" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800" font-family="sans-serif">하이브리드</text>
  <text x="540" y="325" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800" font-family="sans-serif">vs 전기차</text>

  <text x="540" y="405" text-anchor="middle" fill="#E2E8F0" font-size="30" font-weight="600" font-family="sans-serif">연료비·세금·보험료·감가</text>
  <text x="540" y="450" text-anchor="middle" fill="#E2E8F0" font-size="30" font-weight="600" font-family="sans-serif">유지비 총정리</text>

  <rect x="340" y="490" width="400" height="3" rx="2" fill="#3B82F6" opacity="0.5"/>

  <rect x="225" y="525" width="130" height="38" rx="19" fill="#FEF3C7"/>
  <text x="290" y="550" text-anchor="middle" fill="#92400E" font-size="16" font-weight="700" font-family="sans-serif">5년 TCO</text>
  <rect x="375" y="525" width="130" height="38" rx="19" fill="#FEF3C7"/>
  <text x="440" y="550" text-anchor="middle" fill="#92400E" font-size="16" font-weight="700" font-family="sans-serif">연료비</text>
  <rect x="525" y="525" width="130" height="38" rx="19" fill="#FEF3C7"/>
  <text x="590" y="550" text-anchor="middle" fill="#92400E" font-size="16" font-weight="700" font-family="sans-serif">감가상각</text>

  <!-- VS Cards -->
  <g transform="translate(80,610)">
    <rect x="0" y="0" width="420" height="190" rx="20" fill="#1e293b"/>
    <rect x="0" y="0" width="420" height="5" rx="3" fill="#34D399"/>
    <text x="210" y="42" text-anchor="middle" fill="#34D399" font-size="22" font-weight="700" font-family="sans-serif">전기차</text>
    <text x="210" y="74" text-anchor="middle" fill="#CBD5E1" font-size="16" font-family="sans-serif">1km = 63원</text>
    <text x="210" y="102" text-anchor="middle" fill="#CBD5E1" font-size="16" font-family="sans-serif">세제 혜택 569만</text>
    <text x="210" y="130" text-anchor="middle" fill="#CBD5E1" font-size="16" font-family="sans-serif">보조금 최대 680만</text>
    <text x="210" y="160" text-anchor="middle" fill="#F87171" font-size="16" font-weight="600" font-family="sans-serif">잔가율 40%</text>
  </g>

  <g transform="translate(580,610)">
    <rect x="0" y="0" width="420" height="190" rx="20" fill="#1e293b"/>
    <rect x="0" y="0" width="420" height="5" rx="3" fill="#3B82F6"/>
    <text x="210" y="42" text-anchor="middle" fill="#60A5FA" font-size="22" font-weight="700" font-family="sans-serif">하이브리드</text>
    <text x="210" y="74" text-anchor="middle" fill="#CBD5E1" font-size="16" font-family="sans-serif">1km = 105원</text>
    <text x="210" y="102" text-anchor="middle" fill="#CBD5E1" font-size="16" font-family="sans-serif">세제 혜택 100만</text>
    <text x="210" y="130" text-anchor="middle" fill="#34D399" font-size="16" font-weight="600" font-family="sans-serif">잔가율 60%</text>
