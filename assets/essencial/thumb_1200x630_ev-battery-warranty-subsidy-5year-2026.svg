<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="120" r="220" fill="#1E40AF" fill-opacity="0.07"/>
  <circle cx="120" cy="540" r="160" fill="#0F766E" fill-opacity="0.07"/>

  <!-- Chips -->
  <rect x="40" y="36" width="110" height="32" rx="16" fill="#1E40AF" fill-opacity="0.35" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="95" y="57" text-anchor="middle" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">자동차</text>

  <rect x="166" y="36" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="236" y="57" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="322" y="36" width="140" height="32" rx="16" fill="#134e4a" stroke="#0F766E" stroke-width="1.5"/>
  <text x="392" y="57" text-anchor="middle" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">5년 혜택 분석</text>

  <!-- Title -->
  <text x="600" y="140" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">전기차 배터리 보증 + 보조금 5년 혜택</text>
  <text x="600" y="184" text-anchor="middle" fill="#93C5FD" font-size="22" font-weight="600" font-family="sans-serif">브랜드별 보증 기간 · 5년 절감 시뮬레이션 · 보조금 신청 방법</text>

  <rect x="300" y="202" width="600" height="3" rx="1.5" fill="#1E40AF" fill-opacity="0.5"/>

  <!-- Stats row -->
  <rect x="40" y="216" width="340" height="90" rx="14" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="210" y="252" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="600" font-family="sans-serif">현대·기아 배터리 보증</text>
  <text x="210" y="288" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">10년 / 20만km 🏆</text>

  <rect x="430" y="216" width="340" height="90" rx="14" fill="url(#tealGrad)" fill-opacity="0.8" stroke="#0F766E" stroke-width="1.5"/>
  <text x="600" y="252" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="600" font-family="sans-serif">국고보조금 최대</text>
  <text x="600" y="288" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">680만원</text>

  <rect x="820" y="216" width="340" height="90" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="990" y="252" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="600" font-family="sans-serif">5년 총 절감</text>
  <text x="990" y="288" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">최대 1,670만원</text>

  <!-- Two main cards -->
  <rect x="40" y="322" width="560" height="272" rx="16" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#1E40AF" stroke-width="2"/>
  <text x="320" y="364" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">국산 전기차 (현대·기아·제네시스)</text>
  <line x1="70" y1="380" x2="570" y2="380" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="70" y="414" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 10년/20만km 배터리 보증 (업계 최장)</text>
  <text x="70" y="442" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 국고 최대 680만원 + 지방 최대 1,100만원</text>
  <text x="70" y="470" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 취득세 140만원 감면 (2026년 12월까지)</text>
  <text x="70" y="498" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 의무운행기간 내 판매 시 보조금 환수</text>
  <rect x="70" y="518" width="470" height="30" rx="8" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="305" y="539" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 개인 최초 구매 고객에 한해 10년 보증 적용</text>

  <rect x="620" y="322" width="540" height="272" rx="16" fill="url(#tealGrad)" fill-opacity="0.8" stroke="#0F766E" stroke-width="2"/>
  <text x="890" y="364" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">수입 전기차 (테슬라·BMW·벤츠)</text>
  <line x1="650" y1="380" x2="1130" y2="380" stroke="#134e4a" stroke-width="1.5"/>
  <text x="650" y="414" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 8년/16만km 배터리 보증 (표준)</text>
  <text x="650" y="442" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 국고보조금 최대 580만원 + 취득세 140만원</text>
  <text x="650" y="470" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 글로벌 검증된 배터리 기술</text>
  <text x="650" y="498" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 일부 차종 보조금 0원 — 사전 확인 필수</text>
  <rect x="650" y="518" width="470" height="30" rx="8" fill="#0F766E" fill-opacity="0.4"/>
  <text x="885" y="539" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">→ ev.or.kr에서 차종별 보조금 금액 사전 확인</text>

  <!-- Footer -->
  <text x="40" y="612" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 구매 전 약관 확인 필요</text>
</svg>
