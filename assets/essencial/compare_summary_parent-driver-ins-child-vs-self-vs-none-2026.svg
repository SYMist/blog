  <text x="75" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 자녀가 절차 보조</text>
  <rect x="65" y="546" width="280" height="44" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="205" y="572" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">부모 거부 시 자녀 대납 추천</text>

  <rect x="378" y="216" width="325" height="390" rx="18" fill="url(#purpleGrad)" fill-opacity="0.9" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">② 부모 본인 가입</text>
  <text x="540" y="288" text-anchor="middle" fill="#DDD6FE" font-size="13" font-family="sans-serif">본인 명의·본인 부담</text>
  <line x1="403" y1="308" x2="683" y2="308" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="540" y="348" text-anchor="middle" fill="#DDD6FE" font-size="22" font-weight="800" font-family="sans-serif">월 2~5만 (본인)</text>
  <text x="540" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">소득공제 적용</text>
  <line x1="403" y1="398" x2="683" y2="398" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="413" y="428" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 일반적 가입 형태</text>
  <text x="413" y="452" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 본인 소득공제 가능</text>
  <text x="413" y="476" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 본인 보험료 부담</text>
  <text x="413" y="500" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 연금 소득 있을 때 OK</text>
  <text x="413" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 80세+ 가입 어려움</text>
  <rect x="403" y="546" width="280" height="44" rx="8" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="543" y="572" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">부모 의지 + 연금 있을 때</text>

  <rect x="716" y="216" width="325" height="390" rx="18" fill="url(#redGrad)" fill-opacity="0.9" stroke="#DC2626" stroke-width="2"/>
  <text x="878" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">③ 미가입 ⚠️</text>
  <text x="878" y="288" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">사고 시 자비 부담</text>
  <line x1="741" y1="308" x2="1021" y2="308" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="878" y="348" text-anchor="middle" fill="#FCA5A5" font-size="22" font-weight="800" font-family="sans-serif">월 0원</text>
  <text x="878" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">사고 1건 6,500만+ 자비</text>
  <line x1="741" y1="398" x2="1021" y2="398" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="751" y="428" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">✅ 보험료 0원</text>
  <text x="751" y="452" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 12대 중과실 자비</text>
  <text x="751" y="476" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 형사합의금 5천만+</text>
  <text x="751" y="500" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 자동차보험과 별개</text>
  <text x="751" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 운전 거의 안 함만 가능</text>
  <rect x="741" y="546" width="280" height="44" rx="8" fill="#DC2626" fill-opacity="0.4"/>
  <text x="881" y="572" text-anchor="middle" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">월 1~2회 단거리 운전만</text>

  <text x="40" y="638" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 음주·무면허는 가입해도 약관 면책 (자비 부담)</text>
</svg>
