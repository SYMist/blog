  <text x="75" y="452" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">✅ 부모 부담 X</text>
  <text x="75" y="476" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 자녀 소득공제 X</text>
