  <rect width="1080" height="660" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">부모 운전자보험 자녀·본인·미가입 3종</text>
  <text x="540" y="92" text-anchor="middle" fill="#DDD6FE" font-size="16" font-family="sans-serif">65~70세 부모 + 12대 중과실 사고 시뮬레이션 · 2026.05</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">어린이보호구역 사고 1건 기준 자비 부담 격차</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">미가입 6,500만 vs 가입 0~500만 · 격차 6,000만+</text>

