  <rect x="40" y="216" width="325" height="390" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="202" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">① 자녀 대납 + 부모 명의</text>
  <text x="202" y="288" text-anchor="middle" fill="#86EFAC" font-size="13" font-family="sans-serif">보험료 자녀 부담</text>
  <line x1="65" y1="308" x2="345" y2="308" stroke="#14532d" stroke-width="1.5"/>
  <text x="202" y="348" text-anchor="middle" fill="#86EFAC" font-size="22" font-weight="800" font-family="sans-serif">월 2~5만 (자녀)</text>
  <text x="202" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">보장 대상: 부모</text>
  <line x1="65" y1="398" x2="345" y2="398" stroke="#14532d" stroke-width="1.5"/>
