<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs><filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter></defs>
  <rect width="1080" height="1080" rx="32" fill="#F0FAF9"/>
  <rect x="40" y="40" width="1000" height="1000" rx="24" fill="#FFF" filter="url(#s)"/>

  <!-- Header -->
  <rect x="40" y="40" width="1000" height="100" rx="24" fill="#0F766E"/><rect x="40" y="95" width="1000" height="45" fill="#0F766E"/>
  <text x="540" y="103" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="36" font-weight="800" fill="#FFF">상황별 임플란트 추천 가이드</text>

  <!-- 안내 -->
  <rect x="80" y="175" width="920" height="55" rx="14" fill="#F0FDFA"/>
  <text x="540" y="210" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="26" font-weight="700" fill="#0F766E">나에게 맞는 선택은? 아래에서 본인 상황을 찾아보세요</text>

  <!-- 시나리오 1 -->
  <rect x="80" y="260" width="920" height="155" rx="20" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <rect x="100" y="280" width="120" height="40" rx="20" fill="#059669"/>
  <text x="160" y="307" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#FFF">상황 1</text>
  <text x="240" y="307" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">만 65세 이상 + 부분 무치악</text>
  <line x1="100" y1="330" x2="980" y2="330" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="100" y="365" font-family="'Pretendard',sans-serif" font-size="22" fill="#374151">추천:</text>
  <text x="160" y="365" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#059669">건강보험 임플란트 (지르코니아 선택 가능)</text>
  <text x="100" y="400" font-family="'Pretendard',sans-serif" font-size="22" fill="#4B5563">본인부담: 일반 약 39만 원 / 의료급여 1종 약 13만 원 / 2종 약 26만 원</text>

  <!-- 시나리오 2 -->
  <rect x="80" y="440" width="920" height="155" rx="20" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <rect x="100" y="460" width="120" height="40" rx="20" fill="#B45309"/>
  <text x="160" y="487" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#FFF">상황 2</text>
  <text x="240" y="487" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">만 65세 이상 + 완전 무치악 (치아 0개)</text>
  <line x1="100" y1="510" x2="980" y2="510" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="100" y="545" font-family="'Pretendard',sans-serif" font-size="22" fill="#374151">추천:</text>
  <text x="160" y="545" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#B45309">완전틀니 급여 (임플란트 보험 적용 불가)</text>
  <text x="100" y="580" font-family="'Pretendard',sans-serif" font-size="22" fill="#4B5563">임플란트를 원하면 전액 비급여 (1개 약 130만 원~)</text>

  <!-- 시나리오 3 -->
  <rect x="80" y="620" width="920" height="155" rx="20" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  <rect x="100" y="640" width="120" height="40" rx="20" fill="#DC2626"/>
  <text x="160" y="667" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#FFF">상황 3</text>
  <text x="240" y="667" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">만 65세 미만</text>
  <line x1="100" y1="690" x2="980" y2="690" stroke="#FECACA" stroke-width="1.5"/>
  <text x="100" y="725" font-family="'Pretendard',sans-serif" font-size="22" fill="#374151">추천:</text>
  <text x="160" y="725" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#DC2626">비급여 시술 (전액 자부담)</text>
  <text x="100" y="760" font-family="'Pretendard',sans-serif" font-size="22" fill="#4B5563">실비보험 약관 확인 필수 | 65세 이후까지 기다리는 것도 방법</text>

  <!-- 시나리오 4 -->
  <rect x="80" y="800" width="920" height="125" rx="20" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <rect x="100" y="820" width="120" height="40" rx="20" fill="#1D4ED8"/>
  <text x="160" y="847" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="800" fill="#FFF">TIP</text>
  <text x="240" y="847" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#111827">뼈이식이 필요한 경우</text>
  <line x1="100" y1="870" x2="980" y2="870" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="100" y="905" font-family="'Pretendard',sans-serif" font-size="22" fill="#4B5563">뼈이식은 비급여 (30만~100만 원 추가) | 병원마다 가격 차이 큼 → 반드시 사전 비교</text>

  <!-- Footer -->
  <text x="540" y="985" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" fill="#9CA3AF">2026년 3월 기준 | 개인 구강 상태에 따라 다를 수 있으며, 전문의 상담을 권장합니다</text>
  <rect x="80" y="1015" width="920" height="5" rx="2" fill="#0F766E"/>
</svg>
