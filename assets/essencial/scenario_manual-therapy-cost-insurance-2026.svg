<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <rect x="60" y="50" width="240" height="40" rx="20" fill="#0F766E"/>
  <text x="180" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">상황별 의사결정 가이드</text>

  <text x="60" y="150" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">도수치료, 나는 어떻게 해야 할까?</text>
  <text x="60" y="192" fill="#5EEAD4" font-size="20" font-weight="600" font-family="sans-serif">실손 세대·진단명·횟수별 최적 전략</text>

  <!-- Scenario 1 -->
  <rect x="60" y="230" width="540" height="240" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="60" y="230" width="8" height="240" fill="#2DD4BF"/>
  <text x="88" y="268" fill="#2DD4BF" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 1</text>
  <text x="88" y="302" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">1~2세대 실손 + 만성 허리 디스크</text>
  <text x="88" y="345" fill="#CBD5E1" font-size="15" font-family="sans-serif">60대 여성, 2005년 가입 1세대, 주 2회 10회 처방</text>
  <rect x="88" y="365" width="484" height="2" fill="#334155"/>
  <text x="88" y="395" fill="#2DD4BF" font-size="18" font-weight="800" font-family="sans-serif">→ 기존 실손 절대 유지</text>
  <text x="88" y="422" fill="#E2E8F0" font-size="14" font-family="sans-serif">관리급여 전환으로 단가↓ · 자기부담 5천 원 이하</text>
  <text x="88" y="448" fill="#FCD34D" font-size="14" font-family="sans-serif">핵심: 회차별 ROM·VAS 기록으로 분쟁 대비</text>

  <!-- Scenario 2 -->
  <rect x="620" y="230" width="520" height="240" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="620" y="230" width="8" height="240" fill="#FCD34D"/>
  <text x="648" y="268" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 2</text>
  <text x="648" y="302" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">3세대 실손 + 급성 경추 통증</text>
  <text x="648" y="345" fill="#CBD5E1" font-size="15" font-family="sans-serif">40대 남성, 2019년 가입 3세대, 회당 10만 예상</text>
  <rect x="648" y="365" width="464" height="2" fill="#334155"/>
  <text x="648" y="395" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">→ 특약 한도 내 소화 가능</text>
  <text x="648" y="422" fill="#E2E8F0" font-size="14" font-family="sans-serif">자기부담 30% · 회당 실부담 약 3만 원</text>
  <text x="648" y="448" fill="#FCD34D" font-size="14" font-family="sans-serif">핵심: 10회차 이후 호전도 증빙 반드시 확보</text>

  <!-- Scenario 3 -->
  <rect x="60" y="490" width="540" height="240" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="60" y="490" width="8" height="240" fill="#F87171"/>
  <text x="88" y="528" fill="#F87171" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 3</text>
  <text x="88" y="562" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">4세대 실손 + 연 8회 장기 치료</text>
  <text x="88" y="605" fill="#CBD5E1" font-size="15" font-family="sans-serif">50대, 2022년 가입 4세대, 회당 10만 · 연 80만</text>
  <rect x="88" y="625" width="484" height="2" fill="#334155"/>
  <text x="88" y="655" fill="#F87171" font-size="18" font-weight="800" font-family="sans-serif">→ 할증 '마지노선' 관리 필수</text>
  <text x="88" y="682" fill="#E2E8F0" font-size="14" font-family="sans-serif">100만 원 초과 시 2단계→3단계(100% 할증)</text>
  <text x="88" y="708" fill="#FCD34D" font-size="14" font-family="sans-serif">핵심: 연간 80만 내 청구 + 소액은 자비 처리</text>

  <!-- Scenario 4 -->
  <rect x="620" y="490" width="520" height="240" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="620" y="490" width="8" height="240" fill="#F87171"/>
  <text x="648" y="528" fill="#F87171" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 4</text>
  <text x="648" y="562" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">5세대 신규 가입자</text>
  <text x="648" y="605" fill="#CBD5E1" font-size="15" font-family="sans-serif">2026.04 가입, 회당 10만, 관리급여 항목</text>
  <rect x="648" y="625" width="464" height="2" fill="#334155"/>
  <text x="648" y="655" fill="#F87171" font-size="18" font-weight="800" font-family="sans-serif">→ 사실상 자비 부담 전제</text>
  <text x="648" y="682" fill="#E2E8F0" font-size="14" font-family="sans-serif">관리급여 95% + 비중증 50% 중첩 부담</text>
  <text x="648" y="708" fill="#FCD34D" font-size="14" font-family="sans-serif">핵심: 병원 선택·치료 목적 증빙이 비용의 전부</text>

  <!-- Scenario 5 -->
  <rect x="60" y="750" width="540" height="240" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="60" y="750" width="8" height="240" fill="#2DD4BF"/>
  <text x="88" y="788" fill="#2DD4BF" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 5</text>
  <text x="88" y="822" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">실손 미가입 + 일시적 통증</text>
  <text x="88" y="865" fill="#CBD5E1" font-size="15" font-family="sans-serif">30대, 교통사고 후 3~5회 단기 치료</text>
  <rect x="88" y="885" width="484" height="2" fill="#334155"/>
  <text x="88" y="915" fill="#2DD4BF" font-size="18" font-weight="800" font-family="sans-serif">→ 건강e음 지역 최저가 병원</text>
  <text x="88" y="942" fill="#E2E8F0" font-size="14" font-family="sans-serif">관리급여 적용 시 회당 1~2만 원대 가능</text>
  <text x="88" y="968" fill="#FCD34D" font-size="14" font-family="sans-serif">핵심: 자동차보험·산재 보험 확인 병행</text>

  <!-- Scenario 6 -->
  <rect x="620" y="750" width="520" height="240" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="620" y="750" width="8" height="240" fill="#F87171"/>
  <text x="648" y="788" fill="#F87171" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 6</text>
  <text x="648" y="822" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">체형 교정·미용 목적</text>
  <text x="648" y="865" fill="#CBD5E1" font-size="15" font-family="sans-serif">거북목·자세 교정 패키지 10회</text>
  <rect x="648" y="885" width="464" height="2" fill="#334155"/>
  <text x="648" y="915" fill="#F87171" font-size="18" font-weight="800" font-family="sans-serif">→ 실비 청구 대상 아님</text>
  <text x="648" y="942" fill="#E2E8F0" font-size="14" font-family="sans-serif">의학적 치료 목적 아닐 시 보험금 지급 거절</text>
  <text x="648" y="968" fill="#FCD34D" font-size="14" font-family="sans-serif">핵심: 선결제·할인 이벤트는 심사 리스크 ↑</text>

  <!-- 6단계 체크리스트 -->
  <rect x="60" y="1020" width="1080" height="400" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="80" y="1065" fill="#5EEAD4" font-size="22" font-weight="800" font-family="sans-serif">실비 청구 성공을 위한 6단계 체크리스트</text>

  <g font-family="sans-serif">
    <circle cx="105" cy="1115" r="20" fill="#0F766E"/>
    <text x="105" y="1122" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">1</text>
    <text x="140" y="1110" fill="#FFFFFF" font-size="16" font-weight="700">실손 세대·약관 확인</text>
    <text x="140" y="1133" fill="#CBD5E1" font-size="13">증권 발행일·자기부담률·도수치료 특약 별도 확인</text>

    <circle cx="625" cy="1115" r="20" fill="#0F766E"/>
    <text x="625" y="1122" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">2</text>
    <text x="660" y="1110" fill="#FFFFFF" font-size="16" font-weight="700">진단명·치료 목적 명확화</text>
    <text x="660" y="1133" fill="#CBD5E1" font-size="13">X-ray·MRI 결과지로 근골격계 질환 입증</text>

    <circle cx="105" cy="1185" r="20" fill="#0F766E"/>
    <text x="105" y="1192" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">3</text>
    <text x="140" y="1180" fill="#FFFFFF" font-size="16" font-weight="700">병원 가격·관리급여 여부</text>
    <text x="140" y="1203" fill="#CBD5E1" font-size="13">'건강e음' 최저가 비교 + 전화로 관리급여 확인</text>

    <circle cx="625" cy="1185" r="20" fill="#0F766E"/>
    <text x="625" y="1192" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">4</text>
    <text x="660" y="1180" fill="#FFFFFF" font-size="16" font-weight="700">ROM·VAS 기록 요청</text>
    <text x="660" y="1203" fill="#CBD5E1" font-size="13">1회차부터 관절가동범위·통증척도 기록 받기</text>

    <circle cx="105" cy="1255" r="20" fill="#0F766E"/>
    <text x="105" y="1262" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">5</text>
    <text x="140" y="1250" fill="#FFFFFF" font-size="16" font-weight="700">10회차 중간 소견서</text>
    <text x="140" y="1273" fill="#CBD5E1" font-size="13">호전 여부·추가 치료 필요성 담긴 의사 소견</text>

    <circle cx="625" cy="1255" r="20" fill="#0F766E"/>
    <text x="625" y="1262" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">6</text>
    <text x="660" y="1250" fill="#FFFFFF" font-size="16" font-weight="700">패키지 선결제 거절</text>
    <text x="660" y="1273" fill="#CBD5E1" font-size="13">회차별 결제 + 치료 기록 일관성 유지</text>

    <rect x="80" y="1310" width="1040" height="90" rx="12" fill="#7C2D12" opacity="0.3" stroke="#FCA5A5" stroke-width="1"/>
    <text x="100" y="1345" fill="#FCA5A5" font-size="15" font-weight="800">⚠ 지급 거절 트리거 TOP 5</text>
    <text x="100" y="1372" fill="#E2E8F0" font-size="13">트레이너·무자격자 시술 · 패키지 선결제 · 기록지 내용 불일치</text>
    <text x="100" y="1392" fill="#E2E8F0" font-size="13">· 10회 이상 호전도 증빙 없음 · 체형 교정·마사지 목적 기재</text>
  </g>

  <!-- 최근 판결 -->
  <rect x="60" y="1450" width="1080" height="170" rx="16" fill="url(#card)" stroke="#14B8A6" stroke-width="2"/>
  <text x="80" y="1490" fill="#14B8A6" font-size="22" font-weight="800" font-family="sans-serif">2026.03.06 전주지법 도수치료 판결 핵심 3가지</text>

  <g font-family="sans-serif">
    <text x="80" y="1530" fill="#FFFFFF" font-size="15" font-weight="700">① 약관에 횟수·효과 제한 없으면 보험사 임의 제한 불가</text>
    <text x="80" y="1560" fill="#FFFFFF" font-size="15" font-weight="700">② 담당 의사의 진단권 존중 — 자문의 소견만으로 배척 불가</text>
    <text x="80" y="1590" fill="#FFFFFF" font-size="15" font-weight="700">③ ROM 확대·VAS 감소 수치가 있으면 정당한 치료 목적 인정</text>
  </g>

  <text x="60" y="1660" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 건강·의료 silo · 자료: 심평원·복지부·금감원·전주지법 (2026.04 기준)</text>
</svg>
