<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="24"/>

  <rect x="60" y="50" width="200" height="42" rx="21" fill="#EF4444"/>
  <text x="160" y="78" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">2026 비교분석</text>

  <text x="60" y="170" fill="#FFFFFF" font-size="52" font-weight="900" font-family="Pretendard,sans-serif">10년 된 차</text>
  <text x="60" y="240" fill="#FFFFFF" font-size="58" font-weight="900" font-family="Pretendard,sans-serif">폐차 vs 수출</text>

  <rect x="60" y="265" width="300" height="4" rx="2" fill="url(#blue)"/>

  <text x="60" y="315" fill="#E2E8F0" font-size="30" font-weight="600" font-family="Pretendard,sans-serif">뭐가 더 이득인지 비교</text>

  <rect x="60" y="355" width="100" height="36" rx="18" fill="#EFF6FF"/>
  <text x="110" y="379" text-anchor="middle" fill="#1E40AF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="175" y="355" width="100" height="36" rx="18" fill="#EFF6FF"/>
  <text x="225" y="379" text-anchor="middle" fill="#1E40AF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">폐차</text>
  <rect x="290" y="355" width="100" height="36" rx="18" fill="#EFF6FF"/>
  <text x="340" y="379" text-anchor="middle" fill="#1E40AF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">수출</text>

  <!-- Right: Two cards -->
  <rect x="660" y="50" width="240" height="190" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="660" y="50" width="240" height="44" rx="16" fill="#F59E0B"/>
  <rect x="660" y="78" width="240" height="16" fill="#F59E0B"/>
  <text x="780" y="80" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">폐차</text>
  <text x="780" y="140" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="900" font-family="Pretendard,sans-serif">50~420만</text>
  <text x="780" y="178" text-anchor="middle" fill="#FDE68A" font-size="16" font-family="Pretendard,sans-serif">보조금+고철+귀금속</text>
  <text x="780" y="215" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">4·5등급 경유 추천</text>

  <rect x="930" y="50" width="240" height="190" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="930" y="50" width="240" height="44" rx="16" fill="#3B82F6"/>
  <rect x="930" y="78" width="240" height="16" fill="#3B82F6"/>
  <text x="1050" y="80" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">수출</text>
  <text x="1050" y="140" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="900" font-family="Pretendard,sans-serif">150~500만</text>
  <text x="1050" y="178" text-anchor="middle" fill="#93C5FD" font-size="16" font-family="Pretendard,sans-serif">차종·상태별 매입가</text>
  <text x="1050" y="215" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">가솔린/LPG 인기차 추천</text>

  <!-- Bottom highlight -->
  <rect x="660" y="270" width="510" height="70" rx="14" fill="#1E40AF" opacity="0.15"/>
  <rect x="660" y="270" width="510" height="70" rx="14" stroke="#3B82F6" stroke-width="2" fill="none"/>
  <text x="915" y="313" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">5등급 보조금 올해 마지막 | 고철 시세 사상 최고</text>

  <!-- 인기 차종 -->
  <rect x="660" y="370" width="510" height="55" rx="14" fill="#1E293B"/>
  <text x="915" y="405" text-anchor="middle" fill="#94A3B8" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">수출 인기: 아반떼 | 투싼 | 그랜저 | 스포티지 | 카니발</text>

  <text x="60" y="580" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="1140" y="580" text-anchor="end" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">자동차 비교</text>
</svg>
