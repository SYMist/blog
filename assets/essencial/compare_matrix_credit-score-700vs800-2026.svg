<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Title -->
  <text x="540" y="75" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="900" font-family="Pretendard,sans-serif">업권별 금리 비교 매트릭스</text>
  <text x="540" y="115" text-anchor="middle" fill="#94A3B8" font-size="22" font-family="Pretendard,sans-serif">신용점수 800점대 vs 700점대 — 2026년 4월 기준</text>

  <!-- Table Header -->
  <rect x="60" y="150" width="960" height="56" rx="12" fill="#B45309"/>
  <text x="260" y="186" text-anchor="middle" fill="#FFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">금융기관</text>
  <text x="530" y="186" text-anchor="middle" fill="#FFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">800점대</text>
  <text x="740" y="186" text-anchor="middle" fill="#FFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">700점대</text>
  <text x="920" y="186" text-anchor="middle" fill="#FFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">격차</text>

  <!-- Section: 인터넷은행 -->
  <rect x="60" y="220" width="960" height="36" rx="0" fill="#D97706" opacity="0.2"/>
