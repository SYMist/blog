  <rect x="60" y="446" width="960" height="52" rx="0" fill="#0F172A"/>
  <text x="260" y="478" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">케이뱅크</text>
  <text x="530" y="478" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">4.25~6.50%</text>
  <text x="740" y="478" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">6.80~9.50%</text>
  <text x="920" y="478" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">2.55~3.00%p</text>

