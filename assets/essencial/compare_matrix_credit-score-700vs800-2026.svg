  <rect x="60" y="386" width="960" height="52" rx="0" fill="#1E293B"/>
  <text x="260" y="418" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">토스뱅크</text>
  <text x="530" y="418" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">5.48~8.50%</text>
  <text x="740" y="418" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">7.79~11.24%</text>
  <text x="920" y="418" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">2.31~2.74%p</text>

