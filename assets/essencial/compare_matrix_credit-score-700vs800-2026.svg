  <!-- Row 1 -->
  <rect x="60" y="266" width="960" height="52" rx="0" fill="#1E293B"/>
  <text x="260" y="298" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">카카오뱅크 (일반)</text>
  <text x="530" y="298" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">5.74%</text>
  <text x="740" y="298" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">6.20%</text>
  <text x="920" y="298" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">0.46%p</text>

  <!-- Row 2 -->
  <rect x="60" y="326" width="960" height="52" rx="0" fill="#0F172A"/>
  <text x="260" y="358" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">카카오뱅크 (중신용)</text>
  <text x="530" y="358" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">7.36%</text>
  <text x="740" y="358" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">7.80%</text>
  <text x="920" y="358" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">0.44%p</text>

