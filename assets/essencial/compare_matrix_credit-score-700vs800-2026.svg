  <!-- Row 5 -->
  <rect x="60" y="558" width="960" height="52" rx="0" fill="#1E293B"/>
  <text x="260" y="590" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">NH직장인스마트론</text>
  <text x="530" y="590" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">5.69%</text>
  <text x="740" y="590" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">5.81%</text>
  <text x="920" y="590" text-anchor="middle" fill="#94A3B8" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">0.12%p</text>

