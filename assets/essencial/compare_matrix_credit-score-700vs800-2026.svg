  <text x="260" y="650" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">신협 815 해방대출</text>
  <text x="530" y="650" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">6.63%</text>
  <text x="740" y="650" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">7.60%</text>
  <text x="920" y="650" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">0.97%p</text>

  <!-- Row 7 -->
  <rect x="60" y="678" width="960" height="52" rx="0" fill="#1E293B"/>
  <text x="260" y="710" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">KB 이지대환 (카드)</text>
  <text x="530" y="710" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">11.89%</text>
  <text x="740" y="710" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">14.17%</text>
  <text x="920" y="710" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">2.28%p</text>

  <!-- Row 8 -->
  <rect x="60" y="738" width="960" height="52" rx="0" fill="#0F172A"/>
  <text x="260" y="770" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">다올저축 Fi직장인</text>
  <text x="530" y="770" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">16.83%</text>
  <text x="740" y="770" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">18.67%</text>
  <text x="920" y="770" text-anchor="middle" fill="#F87171" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">1.84%p</text>

  <!-- Bottom Insight -->
  <rect x="60" y="830" width="960" height="100" rx="16" fill="#B45309" opacity="0.15"/>
  <rect x="60" y="830" width="960" height="100" rx="16" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="540" y="870" text-anchor="middle" fill="#FDE68A" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">핵심 인사이트</text>
  <text x="540" y="910" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600" font-family="Pretendard,sans-serif">상호금융은 격차 작지만, 카드사·저축은행으로 가면 2%p 이상 벌어진다</text>

  <!-- Legend -->
  <circle cx="340" cy="975" r="8" fill="#86EFAC"/>
  <text x="360" y="981" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">800점대</text>
  <circle cx="480" cy="975" r="8" fill="#FDE68A"/>
  <text x="500" y="981" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">700점대</text>
  <circle cx="620" cy="975" r="8" fill="#F87171"/>
  <text x="640" y="981" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">격차 1%p 이상</text>

  <!-- Footer -->
  <text x="540" y="1050" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준 공시금리</text>
</svg>
