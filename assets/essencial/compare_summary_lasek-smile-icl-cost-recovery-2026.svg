<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="660" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">라섹 vs 스마일라식 vs ICL 3종 비교</text>
  <text x="540" y="92" text-anchor="middle" fill="#99F6E4" font-size="16" font-family="sans-serif">양안 비용·회복기간·통증·각막 요구 · 2026.05 기준</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">비용 vs 회복기간 트레이드오프</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">최대 6배 가격차 · 라섹 1~2주 vs ICL 즉시 회복</text>

  <!-- 3 cards horizontal -->
  <rect x="40" y="216" width="325" height="390" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="202" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">라섹 (가성비)</text>
  <text x="202" y="288" text-anchor="middle" fill="#86EFAC" font-size="13" font-family="sans-serif">상피 제거 후 레이저</text>
  <line x1="65" y1="308" x2="345" y2="308" stroke="#14532d" stroke-width="1.5"/>
  <text x="202" y="348" text-anchor="middle" fill="#86EFAC" font-size="24" font-weight="800" font-family="sans-serif">100~200만원</text>
  <text x="202" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">회복 3~7일 + 1~2개월</text>
  <line x1="65" y1="398" x2="345" y2="398" stroke="#14532d" stroke-width="1.5"/>
  <text x="75" y="428" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">✅ 가성비 최고</text>
  <text x="75" y="452" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">✅ 각막 보존도 우수</text>
  <text x="75" y="476" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 통증 큼 (3~7일)</text>
  <text x="75" y="500" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 활동 제한 1~2주</text>
  <text x="75" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 휴가 충분한 직장인용</text>
  <rect x="65" y="546" width="280" height="44" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="205" y="572" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">예산 200만 이하·휴가 1주+</text>

  <rect x="378" y="216" width="325" height="390" rx="18" fill="url(#tealGrad)" fill-opacity="0.9" stroke="#0F766E" stroke-width="2"/>
  <text x="540" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">스마일라식 (균형)</text>
  <text x="540" y="288" text-anchor="middle" fill="#99F6E4" font-size="13" font-family="sans-serif">각막 안 렌티큘 제거</text>
  <line x1="403" y1="308" x2="683" y2="308" stroke="#134E4A" stroke-width="1.5"/>
  <text x="540" y="348" text-anchor="middle" fill="#99F6E4" font-size="24" font-weight="800" font-family="sans-serif">200~350만원</text>
  <text x="540" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">회복 1~3일</text>
  <line x1="403" y1="398" x2="683" y2="398" stroke="#134E4A" stroke-width="1.5"/>
  <text x="413" y="428" fill="#99F6E4" font-size="13" font-weight="700" font-family="sans-serif">✅ 통증 적음</text>
  <text x="413" y="452" fill="#99F6E4" font-size="13" font-weight="700" font-family="sans-serif">✅ 회복 빠름</text>
  <text x="413" y="476" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 각막 절편 영향</text>
  <text x="413" y="500" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 활동 제한 3~5일</text>
  <text x="413" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 직장인 휴가 활용</text>
  <rect x="403" y="546" width="280" height="44" rx="8" fill="#0F766E" fill-opacity="0.4"/>
  <text x="543" y="572" text-anchor="middle" fill="#99F6E4" font-size="13" font-weight="700" font-family="sans-serif">예산 200~400만·휴가 3~5일</text>

  <rect x="716" y="216" width="325" height="390" rx="18" fill="url(#purpleGrad)" fill-opacity="0.9" stroke="#7C3AED" stroke-width="2"/>
  <text x="878" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">ICL (각막 보존)</text>
  <text x="878" y="288" text-anchor="middle" fill="#DDD6FE" font-size="13" font-family="sans-serif">각막 보존 + 렌즈 삽입</text>
  <line x1="741" y1="308" x2="1021" y2="308" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="878" y="348" text-anchor="middle" fill="#DDD6FE" font-size="24" font-weight="800" font-family="sans-serif">470~600만원</text>
  <text x="878" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">회복 즉시~1일</text>
  <line x1="741" y1="398" x2="1021" y2="398" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="751" y="428" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 통증 거의 없음</text>
  <text x="751" y="452" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 각막 보존·가역성</text>
  <text x="751" y="476" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 고도근시 가능</text>
  <text x="751" y="500" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 평생 검진 (6개월)</text>
  <text x="751" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 각막 480μm 이하 OK</text>
  <rect x="741" y="546" width="280" height="44" rx="8" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="881" y="572" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">고도근시·가역성·휴가 짧음</text>

  <text x="40" y="638" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 건강·의료 · 2026.05 기준 · 각막 480μm 이하·고도근시(-8D+) 시 ICL 외 선택지 없음</text>
</svg>
