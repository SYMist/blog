<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg3)"/>

  <text x="540" y="55" font-family="sans-serif" font-size="32" font-weight="900" fill="#111827" text-anchor="middle">자녀 운전 상황별 보험 추천 가이드</text>
  <text x="540" y="88" font-family="sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">2026년 기준 | 자동차보험 특약 + 운전자보험 조합 전략</text>

  <!-- 시나리오 1 -->
  <rect x="50" y="118" width="980" height="125" rx="20" fill="#FFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="50" y="118" width="980" height="42" rx="20" fill="#7C3AED"/>
  <rect x="50" y="140" width="980" height="20" fill="#7C3AED"/>
  <text x="80" y="147" font-family="sans-serif" font-size="19" font-weight="800" fill="#FFF">자녀가 부모 차량을 상시 운전 (통근·통학 등)</text>
  <text x="80" y="190" font-family="sans-serif" font-size="19" fill="#111827">→ <tspan font-weight="800">자동차보험 연령 확대 + 운전자보험</tspan> — 민사+형사 동시 보장</text>
  <text x="80" y="225" font-family="sans-serif" font-size="16" fill="#6B7280">반드시 '경력인정 대상자' 등록 → 최대 3년 무사고 시 24% 할인 확보</text>

  <!-- 시나리오 2 -->
  <rect x="50" y="260" width="980" height="125" rx="20" fill="#FFF" stroke="#A7F3D0" stroke-width="1.5"/>
  <rect x="50" y="260" width="980" height="42" rx="20" fill="#059669"/>
  <rect x="50" y="282" width="980" height="20" fill="#059669"/>
  <text x="80" y="289" font-family="sans-serif" font-size="19" font-weight="800" fill="#FFF">명절·주말만 가끔 운전 (사전 계획)</text>
  <text x="80" y="332" font-family="sans-serif" font-size="19" fill="#111827">→ <tspan font-weight="800">단기운전자확대특약 + 운전자보험</tspan> — 연간 계약보다 비용 절감</text>
  <text x="80" y="367" font-family="sans-serif" font-size="16" fill="#6B7280">효력: 익일 00시부터 | 기존 보험 보장 한도 그대로 | 소유주 할증 주의</text>

  <!-- 시나리오 3 -->
  <rect x="50" y="402" width="980" height="125" rx="20" fill="#FFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="50" y="402" width="980" height="42" rx="20" fill="#1E40AF"/>
  <rect x="50" y="424" width="980" height="20" fill="#1E40AF"/>
  <text x="80" y="431" font-family="sans-serif" font-size="19" font-weight="800" fill="#FFF">갑작스러운 운전 + 부모 보험 할증 방어 필요</text>
  <text x="80" y="474" font-family="sans-serif" font-size="19" fill="#111827">→ <tspan font-weight="800">원데이 자동차보험 + 운전자보험</tspan> — 즉시 효력, 부모 할증 없음</text>
  <text x="80" y="509" font-family="sans-serif" font-size="16" fill="#6B7280">효력: 가입 즉시 | 소유주 할증 없음 | 단독사고 미보장 확인 필수</text>

  <!-- 시나리오 4 -->
  <rect x="50" y="544" width="980" height="125" rx="20" fill="#FFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="50" y="544" width="980" height="42" rx="20" fill="#6D28D9"/>
  <rect x="50" y="566" width="980" height="20" fill="#6D28D9"/>
  <text x="80" y="573" font-family="sans-serif" font-size="19" font-weight="800" fill="#FFF">자녀 본인 명의 차량 보유 (사회초년생)</text>
  <text x="80" y="616" font-family="sans-serif" font-size="19" fill="#111827">→ <tspan font-weight="800">본인 자동차보험 + 운전자보험</tspan> — 독립 보험 가입</text>
  <text x="80" y="651" font-family="sans-serif" font-size="16" fill="#6B7280">부모 보험 경력인정 3년 확보 시 24% 할인 적용 · 독립 운전 경력 시작</text>

  <!-- 시나리오 5 -->
  <rect x="50" y="686" width="980" height="125" rx="20" fill="#FFF" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="50" y="686" width="980" height="42" rx="20" fill="#DC2626"/>
  <rect x="50" y="708" width="980" height="20" fill="#DC2626"/>
  <text x="80" y="715" font-family="sans-serif" font-size="19" font-weight="800" fill="#FFF">만 21세 이하 초보 운전자 (고위험군)</text>
  <text x="80" y="758" font-family="sans-serif" font-size="19" fill="#111827">→ <tspan font-weight="800">부모 보험 연령 확대(필수) + 운전자보험(필수)</tspan></text>
  <text x="80" y="793" font-family="sans-serif" font-size="16" fill="#6B7280">보험료 2~3배지만 미가입=무보험 | 12대 중과실·스쿨존 리스크 가장 높은 연령대</text>

  <!-- 최적 조합 -->
  <rect x="50" y="840" width="980" height="70" rx="16" fill="#7C3AED"/>
  <text x="540" y="870" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">최적 포트폴리오: 자동차보험(경력인정 등록) + 운전자보험(월 1만 원대) + 시민안전보험(무료)</text>
  <text x="540" y="898" font-family="sans-serif" font-size="17" fill="#DDD6FE" text-anchor="middle">민사 배상 + 형사 방어 + 공적 위로금 = 삼중 보호 체계 구축</text>

  <!-- 핵심 체크 -->
  <rect x="50" y="935" width="475" height="55" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="288" y="968" font-family="sans-serif" font-size="16" font-weight="700" fill="#065F46" text-anchor="middle">경력인정 등록 = 미래 24% 할인 확보</text>

  <rect x="555" y="935" width="475" height="55" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="793" y="968" font-family="sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">무면허·음주 운전 = 모든 보험 보장 제외</text>

  <text x="540" y="1050" font-family="sans-serif" font-size="15" fill="#9CA3AF" text-anchor="middle">2026년 4월 기준 | 금융감독원·손해보험협회·국토교통부 기반 | 보험사별 차이 있음</text>
</svg>