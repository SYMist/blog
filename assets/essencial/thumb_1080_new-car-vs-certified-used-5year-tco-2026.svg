  <text x="600" y="686" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 보증 1~2년으로 짧음</text>
  <text x="600" y="714" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 정비비 350~500만원</text>
  <line x1="590" y1="734" x2="1000" y2="734" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="590" y="752" width="380" height="38" rx="10" fill="#0F766E" fill-opacity="0.4"/>
  <text x="780" y="777" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">3~5년 단기 보유 시 유리</text>
  <text x="800" y="836" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">취득세: 약 133만원</text>
  <text x="800" y="862" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">5년 보험료 합산: 약 625만원</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 실제 비용은 차종·조건에 따라 달라집니다</text>
