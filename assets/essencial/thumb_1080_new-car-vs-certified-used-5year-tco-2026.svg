  <text x="540" y="188" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">신차 vs 인증중고차</text>
  <text x="540" y="244" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">5년 TCO 비교</text>
