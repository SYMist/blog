<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="52" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">내 상황에 맞는 서민금융 시나리오</text>
  <text x="540" y="78" text-anchor="middle" fill="#D97706" font-size="15" font-family="sans-serif">소득 · 신용점수별 최적 상품 선택 가이드 — 2026.05 기준</text>
  <rect x="40" y="94" width="1000" height="2" rx="1" fill="#B45309" fill-opacity="0.4"/>

  <!-- Scenario 1 -->
  <rect x="40" y="110" width="480" height="120" rx="12" fill="url(#card)" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="40" y="110" width="48" height="120" rx="12" fill="#7C3AED" fill-opacity="0.3"/>
  <rect x="72" y="110" width="16" height="120" fill="#7C3AED" fill-opacity="0.3"/>
  <text x="64" y="176" text-anchor="middle" fill="#C4B5FD" font-size="22" font-weight="800" font-family="sans-serif">1</text>
  <text x="108" y="138" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">소득 2,500만 · 신용 최하위 20%</text>
  <text x="108" y="162" fill="#FCD34D" font-size="17" font-weight="800" font-family="sans-serif">→ 햇살론 특례보증</text>
  <text x="108" y="185" fill="#CBD5E1" font-size="13" font-family="sans-serif">한도 최대 1,000만 / 금리 12.5%</text>
  <text x="108" y="205" fill="#94A3B8" font-size="12" font-family="sans-serif">사회적배려 해당 시 9.9%↓ 우선 확인</text>

  <!-- Scenario 2 -->
  <rect x="560" y="110" width="480" height="120" rx="12" fill="url(#card)" stroke="#B45309" stroke-width="1.5"/>
  <rect x="560" y="110" width="48" height="120" rx="12" fill="#B45309" fill-opacity="0.3"/>
  <rect x="592" y="110" width="16" height="120" fill="#B45309" fill-opacity="0.3"/>
  <text x="584" y="176" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">2</text>
  <text x="628" y="138" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">소득 3,000만 · 신용 중간 (하위 20% 아님)</text>
  <text x="628" y="162" fill="#FCD34D" font-size="17" font-weight="800" font-family="sans-serif">→ 햇살론 일반</text>
  <text x="628" y="185" fill="#CBD5E1" font-size="13" font-family="sans-serif">신용점수 무관 신청 가능 / 금리 10%↓</text>
  <text x="628" y="205" fill="#94A3B8" font-size="12" font-family="sans-serif">서민금융진흥원 보증 후 취급 은행 실행</text>

  <!-- Scenario 3 -->
  <rect x="40" y="248" width="480" height="120" rx="12" fill="url(#card)" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="40" y="248" width="48" height="120" rx="12" fill="#0F766E" fill-opacity="0.3"/>
  <rect x="72" y="248" width="16" height="120" fill="#0F766E" fill-opacity="0.3"/>
  <text x="64" y="314" text-anchor="middle" fill="#6EE7B7" font-size="22" font-weight="800" font-family="sans-serif">3</text>
  <text x="108" y="276" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">소득 3,500만~4,000만 · 신용 양호</text>
  <text x="108" y="300" fill="#FCD34D" font-size="17" font-weight="800" font-family="sans-serif">→ 새희망홀씨</text>
  <text x="108" y="323" fill="#CBD5E1" font-size="13" font-family="sans-serif">한도 최대 3,500만 / 금리 10.5%↓</text>
  <text x="108" y="343" fill="#94A3B8" font-size="12" font-family="sans-serif">14개 은행 비교 후 가장 낮은 금리 선택</text>

  <!-- Scenario 4 -->
  <rect x="560" y="248" width="480" height="120" rx="12" fill="url(#card)" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="560" y="248" width="48" height="120" rx="12" fill="#0F766E" fill-opacity="0.3"/>
  <rect x="592" y="248" width="16" height="120" fill="#0F766E" fill-opacity="0.3"/>
  <text x="584" y="314" text-anchor="middle" fill="#6EE7B7" font-size="22" font-weight="800" font-family="sans-serif">4</text>
  <text x="628" y="276" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">소득 5,000만 · 신용 하위 20%</text>
  <text x="628" y="300" fill="#FCD34D" font-size="17" font-weight="800" font-family="sans-serif">→ 새희망홀씨 (유일 선택지)</text>
  <text x="628" y="323" fill="#CBD5E1" font-size="13" font-family="sans-serif">햇살론 소득 기준 초과 → 새희망홀씨만 해당</text>
  <text x="628" y="343" fill="#94A3B8" font-size="12" font-family="sans-serif">신용 하위 20% 충족 여부 우선 확인 필수</text>

  <!-- Scenario 5 -->
  <rect x="40" y="386" width="1000" height="120" rx="12" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="40" y="386" width="48" height="120" rx="12" fill="#B45309" fill-opacity="0.3"/>
  <rect x="72" y="386" width="16" height="120" fill="#B45309" fill-opacity="0.3"/>
  <text x="64" y="452" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">5</text>
  <text x="108" y="414" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">기존 고금리 사금융 이용자 — 대환 전략</text>
  <text x="108" y="438" fill="#FCD34D" font-size="17" font-weight="800" font-family="sans-serif">→ 햇살론 일반 우선 → 신용 개선 후 새희망홀씨 전환</text>
  <text x="108" y="462" fill="#FFFFFF" font-size="13" font-family="sans-serif">① 서민금융진흥원 1397 상담 → ② 햇살론 고금리대환 프로그램 확인 → ③ 6개월 성실 상환</text>
  <text x="108" y="484" fill="#94A3B8" font-size="12" font-family="sans-serif">→ ④ 신용점수 개선 확인 → ⑤ 새희망홀씨 금리 인하 요구권 행사</text>

  <!-- Divider before summary -->
  <rect x="40" y="524" width="1000" height="2" rx="1" fill="#334155"/>

  <!-- Summary box -->
  <rect x="40" y="538" width="1000" height="180" rx="12" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="568" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="800" font-family="sans-serif">상품 선택 핵심 체크포인트</text>

  <text x="80" y="598" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">① 소득 확인</text>
  <text x="80" y="618" fill="#CBD5E1" font-size="13" font-family="sans-serif">3,500만↓ → 햇살론 일반·특례 모두 해당 / 5,000만↓+신용 하위 20% → 새희망홀씨</text>

  <text x="80" y="648" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">② 신용점수 확인</text>
  <text x="80" y="668" fill="#CBD5E1" font-size="13" font-family="sans-serif">하위 20% 해당 없음 → 햇살론 일반이 유일 / 하위 20% 해당 → 3종 중 한도 비교</text>

  <text x="80" y="698" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">③ 필요 한도 확인</text>
  <text x="80" y="718" fill="#CBD5E1" font-size="13" font-family="sans-serif">1,500만 이하 → 햇살론 일반 / 1,500만~3,500만 → 새희망홀씨 / 소액 긴급 → 햇살론 특례</text>

  <!-- Footer -->
  <text x="40" y="748" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 대출·금융 silo · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 가입 전 약관 확인 필요</text>
</svg>
