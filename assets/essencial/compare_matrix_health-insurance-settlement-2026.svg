<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <rect x="60" y="50" width="300" height="40" rx="20" fill="#0F766E"/>
  <text x="210" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">정산 체계 상세 비교 매트릭스</text>

  <text x="60" y="155" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">4월 vs 11월 vs 지역 정산</text>
  <text x="60" y="195" fill="#5EEAD4" font-size="20" font-weight="600" font-family="sans-serif">가입자 유형별 정산 시점·대상·조정 수단</text>

  <!-- 정산 체계 3트랙 비교 -->
  <text x="60" y="250" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">① 가입자 유형별 정산 체계</text>

  <rect x="60" y="270" width="1080" height="400" rx="12" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>

  <g font-family="sans-serif">
    <!-- 헤더 -->
    <rect x="60" y="270" width="1080" height="44" fill="#0F766E"/>
    <text x="180" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">구분</text>
    <text x="440" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">직장 4월 (보수월액)</text>
    <text x="720" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">직장 11월 (소득월액)</text>
    <text x="1000" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">지역가입자 11월</text>

    <!-- 행1 -->
    <text x="80" y="350" fill="#CBD5E1" font-size="14">정산 대상</text>
    <text x="440" y="350" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">근로소득 전원</text>
    <text x="720" y="350" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">보수외 2천만 초과자</text>
    <text x="1000" y="350" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">사업자·프리랜서</text>

    <line x1="60" y1="370" x2="1140" y2="370" stroke="#334155" stroke-width="1"/>

    <!-- 행2 -->
    <text x="80" y="400" fill="#CBD5E1" font-size="14">정산 기준</text>
    <text x="440" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">전년 보수총액</text>
    <text x="720" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">전년 종합소득</text>
    <text x="1000" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">소득+재산 점수</text>

    <line x1="60" y1="420" x2="1140" y2="420" stroke="#334155" stroke-width="1"/>

    <!-- 행3 -->
    <text x="80" y="450" fill="#CBD5E1" font-size="14">부담 주체</text>
    <text x="440" y="450" text-anchor="middle" fill="#5EEAD4" font-size="14" font-weight="700">노사 각 50%</text>
    <text x="720" y="450" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">본인 100%</text>
    <text x="1000" y="450" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">본인 100%</text>

    <line x1="60" y1="470" x2="1140" y2="470" stroke="#334155" stroke-width="1"/>

    <!-- 행4 -->
    <text x="80" y="500" fill="#CBD5E1" font-size="14">체감 시점</text>
    <text x="440" y="500" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">5월 급여명세서</text>
    <text x="720" y="500" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">11월 급여 차감</text>
    <text x="1000" y="500" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">11월 고지서</text>

    <line x1="60" y1="520" x2="1140" y2="520" stroke="#334155" stroke-width="1"/>

    <!-- 행5 -->
    <text x="80" y="550" fill="#CBD5E1" font-size="14">주요 변수</text>
    <text x="440" y="550" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">성과급·임금 인상</text>
    <text x="720" y="550" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">배당·임대·N잡</text>
    <text x="1000" y="550" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">종소세 신고 내용</text>

    <line x1="60" y1="570" x2="1140" y2="570" stroke="#334155" stroke-width="1"/>

    <!-- 행6 -->
    <text x="80" y="600" fill="#CBD5E1" font-size="14">조정신청</text>
    <text x="440" y="600" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">제한적 (사후)</text>
    <text x="720" y="600" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">소득 감소 시 가능</text>
    <text x="1000" y="600" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">폐업·실직 즉시</text>

    <line x1="60" y1="620" x2="1140" y2="620" stroke="#334155" stroke-width="1"/>

    <!-- 행7 -->
    <text x="80" y="650" fill="#CBD5E1" font-size="14">분할납부</text>
    <text x="440" y="650" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">자동 10회</text>
    <text x="720" y="650" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">자동 10회</text>
    <text x="1000" y="650" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">자동 10회</text>
  </g>

  <!-- 보수월액 정산 흐름 -->
  <text x="60" y="720" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">② 보수월액 4월 정산 흐름 (5단계)</text>

  <rect x="60" y="740" width="1080" height="260" rx="12" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>

  <g font-family="sans-serif">
    <circle cx="140" cy="800" r="26" fill="#0F766E"/>
    <text x="140" y="810" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">1</text>
    <text x="190" y="795" fill="#FFFFFF" font-size="16" font-weight="700">매월 원천공제</text>
    <text x="190" y="818" fill="#CBD5E1" font-size="13">전년 보수 기준 임시 공제</text>

    <circle cx="140" cy="865" r="26" fill="#0F766E"/>
    <text x="140" y="875" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">2</text>
    <text x="190" y="860" fill="#FFFFFF" font-size="16" font-weight="700">3.10 보수총액 신고</text>
    <text x="190" y="883" fill="#CBD5E1" font-size="13">사업장 → 공단 (EDI)</text>

    <circle cx="140" cy="930" r="26" fill="#0F766E"/>
    <text x="140" y="940" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">3</text>
    <text x="190" y="925" fill="#FFFFFF" font-size="16" font-weight="700">공단 재산정 (4월 초)</text>
    <text x="190" y="948" fill="#CBD5E1" font-size="13">실제 × 7.19% 재계산</text>

    <circle cx="620" cy="865" r="26" fill="#0F766E"/>
    <text x="620" y="875" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">4</text>
    <text x="670" y="860" fill="#FFFFFF" font-size="16" font-weight="700">4월분 고지서 발송</text>
    <text x="670" y="883" fill="#CBD5E1" font-size="13">차액 합산 또는 차감</text>

    <circle cx="620" cy="930" r="26" fill="#0F766E"/>
    <text x="620" y="940" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">5</text>
    <text x="670" y="925" fill="#FCD34D" font-size="16" font-weight="700">5월 급여명세서 반영</text>
    <text x="670" y="948" fill="#CBD5E1" font-size="13">근로자 체감 — '5월 정산'</text>

    <text x="140" y="985" fill="#FCD34D" font-size="14" font-weight="700">※ 소득월액 · 지역가입자는 동일 구조로 11월에 반영 (5월 종소세 신고 → 10월 이관 → 11월 고지)</text>
  </g>

  <!-- 보수외소득 2,000만 기준 -->
  <text x="60" y="1050" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">③ 보수외소득 2,000만 기준 — 소득월액 부과</text>

  <rect x="60" y="1070" width="540" height="260" rx="12" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
  <text x="80" y="1110" fill="#FCA5A5" font-size="18" font-weight="800" font-family="sans-serif">추가 부과 대상 (본인 100%)</text>

  <g font-family="sans-serif">
    <text x="80" y="1145" fill="#CBD5E1" font-size="14">주식 배당·이자</text>
    <text x="580" y="1145" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">종합과세 기준</text>

    <text x="80" y="1175" fill="#CBD5E1" font-size="14">부동산 임대소득</text>
    <text x="580" y="1175" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">연 2천만 초과</text>

    <text x="80" y="1205" fill="#CBD5E1" font-size="14">프리랜서 3.3%</text>
    <text x="580" y="1205" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">종소세 신고 반영</text>

    <text x="80" y="1235" fill="#CBD5E1" font-size="14">유튜브·블로그</text>
    <text x="580" y="1235" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">사업소득 확정</text>

    <text x="80" y="1280" fill="#FCA5A5" font-size="13" font-weight="700">대상자 약 80만 명 (2024년 기준)</text>
    <text x="80" y="1305" fill="#FCA5A5" font-size="13" font-weight="700">→ 2단계 개편으로 3,400만 → 2,000만</text>
  </g>

  <rect x="620" y="1070" width="520" height="260" rx="12" fill="url(#card)" stroke="#5EEAD4" stroke-width="2"/>
  <text x="640" y="1110" fill="#5EEAD4" font-size="18" font-weight="800" font-family="sans-serif">소득월액 산정 공식</text>

  <g font-family="sans-serif">
    <text x="640" y="1150" fill="#FFFFFF" font-size="16" font-weight="700">(보수외소득 − 2,000만)</text>
    <text x="640" y="1180" fill="#FFFFFF" font-size="16" font-weight="700">÷ 12 × 7.19%</text>

    <text x="640" y="1225" fill="#CBD5E1" font-size="14">예시: 보수외 3,000만</text>
    <text x="640" y="1250" fill="#5EEAD4" font-size="18" font-weight="800">(1,000만 ÷ 12) × 7.19%</text>
    <text x="640" y="1275" fill="#5EEAD4" font-size="22" font-weight="800">≒ 월 59,900원 추가</text>

    <text x="640" y="1310" fill="#FCD34D" font-size="13" font-weight="700">연 환산 약 72만 원 — 사용자 부담 없음</text>
  </g>

  <!-- 분할납부·조정신청 요약 -->
  <text x="60" y="1380" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">④ 분할납부·조정신청 핵심</text>

  <rect x="60" y="1400" width="1080" height="220" rx="12" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>

  <g font-family="sans-serif">
    <text x="80" y="1440" fill="#5EEAD4" font-size="17" font-weight="800">▸ 분할납부</text>
    <text x="80" y="1470" fill="#FFFFFF" font-size="14">• 추가납부 ≥ 당월 보험료 → 자동 10회</text>
    <text x="80" y="1495" fill="#FFFFFF" font-size="14">• 1회(일시) ~ 12회 조정 가능</text>
    <text x="80" y="1520" fill="#FFFFFF" font-size="14">• 신청: 공단 홈페이지·앱·1577-1000</text>
    <text x="80" y="1550" fill="#FCA5A5" font-size="13" font-weight="700">⚠ 1회 체납 시 잔여분 일괄 고지</text>

    <text x="620" y="1440" fill="#86EFAC" font-size="17" font-weight="800">▸ 조정신청 (지역가입자)</text>
    <text x="620" y="1470" fill="#FFFFFF" font-size="14">• 폐업·실직·소득 감소 시 즉시</text>
    <text x="620" y="1495" fill="#FFFFFF" font-size="14">• 서류: 해촉증명·휴폐업증명·소득금액증명</text>
    <text x="620" y="1520" fill="#FFFFFF" font-size="14">• 당월 또는 차월부터 반영</text>
    <text x="620" y="1550" fill="#86EFAC" font-size="13" font-weight="700">✓ RTI 2025 본격 확대 — 월별 반영</text>
  </g>

  <text x="60" y="1670" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 건강·의료 silo · 자료: 국민건강보험공단·보건복지부 (2026.04 기준)</text>
</svg>
