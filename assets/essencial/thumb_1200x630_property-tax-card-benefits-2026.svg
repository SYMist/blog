  <text x="960" y="400" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">카드 수수료</text>
  <text x="960" y="460" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">0 원</text>
