  <rect x="60" y="1040" width="960" height="2" rx="1" fill="#334155"/>
  <text x="540" y="1065" text-anchor="middle" fill="#475569" font-size="12" font-family="sans-serif">※ 개인 주행 패턴·보유 기간에 따라 유불리가 달라집니다</text>
