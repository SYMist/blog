<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Title -->
  <text x="540" y="62" text-anchor="middle" fill="#E2E8F0" font-size="26" font-weight="700" font-family="sans-serif">당신의 상황에 맞는 선택은?</text>
  <rect x="340" y="76" width="400" height="3" rx="2" fill="#3B82F6" opacity="0.6"/>

  <!-- EV Scenarios (green) -->
  <g transform="translate(60,96)">
    <rect x="0" y="0" width="460" height="130" rx="16" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#34D399"/>
    <circle cx="30" cy="32" r="16" fill="#065F46"/>
    <text x="30" y="38" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">1</text>
    <text x="56" y="36" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">연 2만km+ · 완속 충전 가능 · 7년+ 보유</text>
    <text x="30" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">연료비 절감 연 84만 원 × 7년 = 588만 원</text>
    <text x="30" y="84" fill="#CBD5E1" font-size="12" font-family="sans-serif">장기 보유로 감가 차이 상쇄</text>
    <rect x="30" y="100" width="100" height="24" rx="8" fill="#065F46"/>
    <text x="80" y="117" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">→ 전기차</text>
  </g>

  <g transform="translate(560,96)">
    <rect x="0" y="0" width="460" height="130" rx="16" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#34D399"/>
    <circle cx="30" cy="32" r="16" fill="#065F46"/>
    <text x="30" y="38" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">2</text>
    <text x="56" y="36" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">노후 내연차 보유 · 전환지원금 수령</text>
    <text x="30" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">국비 580만 + 전환지원금 100만 = 680만</text>
    <text x="30" y="84" fill="#CBD5E1" font-size="12" font-family="sans-serif">+ 지자체 보조금 → 초기 비용 대폭 절감</text>
    <rect x="30" y="100" width="100" height="24" rx="8" fill="#065F46"/>
    <text x="80" y="117" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">→ 전기차</text>
  </g>

  <g transform="translate(60,246)">
    <rect x="0" y="0" width="460" height="130" rx="16" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#34D399"/>
    <circle cx="30" cy="32" r="16" fill="#065F46"/>
    <text x="30" y="38" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">3</text>
    <text x="56" y="36" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">사업자 · 비용처리 극대화</text>
    <text x="30" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">세제 혜택 569만 원 (HEV 대비 +469만)</text>
    <text x="30" y="84" fill="#CBD5E1" font-size="12" font-family="sans-serif">자동차세도 연 16만 원 절감</text>
    <rect x="30" y="100" width="100" height="24" rx="8" fill="#065F46"/>
    <text x="80" y="117" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">→ 전기차</text>
  </g>

  <!-- HEV Scenarios (blue) -->
  <g transform="translate(560,246)">
    <rect x="0" y="0" width="460" height="130" rx="16" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#3B82F6"/>
