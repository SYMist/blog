    <text x="810" y="62" text-anchor="middle" fill="#34D399" font-size="13" font-family="sans-serif">아파트 완속 → 전기차</text>
    <text x="810" y="84" text-anchor="middle" fill="#93C5FD" font-size="13" font-family="sans-serif">급속 의존 → 하이브리드</text>
    <text x="810" y="108" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">완속 시 연료비 1/5 수준</text>
