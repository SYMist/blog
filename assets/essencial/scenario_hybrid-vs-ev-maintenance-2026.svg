    <text x="480" y="84" text-anchor="middle" fill="#93C5FD" font-size="13" font-family="sans-serif">3~5년 → 하이브리드</text>
    <text x="480" y="108" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">잔가율 60% vs 40% 격차</text>

    <rect x="660" y="0" width="300" height="120" rx="14" fill="#1e293b"/>
    <rect x="660" y="0" width="300" height="5" rx="3" fill="#F59E0B"/>
