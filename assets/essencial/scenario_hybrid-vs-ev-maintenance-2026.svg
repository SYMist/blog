    <text x="92" y="72" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">최근 1년 기록 확인</text>

    <rect x="197" y="0" width="185" height="90" rx="10" fill="#1e293b"/>
    <circle cx="289" cy="24" r="14" fill="#1E40AF"/>
    <text x="289" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">2</text>
    <text x="289" y="52" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" font-family="sans-serif">충전 환경 점검</text>
    <text x="289" y="72" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">아파트·직장 충전기</text>

    <rect x="394" y="0" width="185" height="90" rx="10" fill="#1e293b"/>
    <circle cx="486" cy="24" r="14" fill="#1E40AF"/>
    <text x="486" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">3</text>
    <text x="486" y="52" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" font-family="sans-serif">보유 기간 결정</text>
    <text x="486" y="72" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">3~5년 vs 7년+</text>

    <rect x="591" y="0" width="185" height="90" rx="10" fill="#1e293b"/>
    <circle cx="683" cy="24" r="14" fill="#1E40AF"/>
    <text x="683" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">4</text>
    <text x="683" y="52" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" font-family="sans-serif">보조금 잔여 확인</text>
    <text x="683" y="72" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">무공해차 통합누리집</text>

    <rect x="788" y="0" width="172" height="90" rx="10" fill="#1e293b"/>
    <circle cx="874" cy="24" r="14" fill="#1E40AF"/>
    <text x="874" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">5</text>
    <text x="874" y="52" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" font-family="sans-serif">세제 일몰 체크</text>
    <text x="874" y="72" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">2026.12.31 종료</text>
  </g>

  <!-- Warning -->
  <rect x="60" y="905" width="960" height="80" rx="14" fill="#1e293b"/>
  <rect x="60" y="905" width="960" height="5" rx="3" fill="#F59E0B"/>
  <text x="90" y="940" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">하이브리드 혜택 축소 추세 주의</text>
  <text x="90" y="965" fill="#CBD5E1" font-size="12" font-family="sans-serif">취득세 감면 종료 | 개소세 100만→70만 축소 | 저공해차 분류 제외 가시화 → 장기 보유 시 혜택 소멸 리스크</text>

