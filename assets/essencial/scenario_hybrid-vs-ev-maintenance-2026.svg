    <text x="90" y="117" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">→ 하이브리드</text>
  </g>

  <g transform="translate(60,396)">
    <rect x="0" y="0" width="460" height="130" rx="16" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#3B82F6"/>
    <circle cx="30" cy="32" r="16" fill="#1E40AF"/>
    <text x="30" y="38" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">5</text>
    <text x="56" y="36" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">충전 인프라 열악 · 장거리 주행 잦음</text>
    <text x="30" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">급속 충전 의존 시 비용 이점 축소</text>
    <text x="30" y="84" fill="#CBD5E1" font-size="12" font-family="sans-serif">충전 대기 시간 부담 → 하이브리드 편의성</text>
    <rect x="30" y="100" width="120" height="24" rx="8" fill="#1E40AF"/>
    <text x="90" y="117" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">→ 하이브리드</text>
  </g>

  <g transform="translate(560,396)">
    <rect x="0" y="0" width="460" height="130" rx="16" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#3B82F6"/>
    <circle cx="30" cy="32" r="16" fill="#1E40AF"/>
    <text x="30" y="38" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">6</text>
    <text x="56" y="36" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">도심 출퇴근 · 혼잡통행료 면제 활용</text>
    <text x="30" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">남산터널 혼잡통행료 면제 (EV·HEV 동일)</text>
    <text x="30" y="84" fill="#CBD5E1" font-size="12" font-family="sans-serif">공영주차장 50% 감면 + 연비 효율</text>
