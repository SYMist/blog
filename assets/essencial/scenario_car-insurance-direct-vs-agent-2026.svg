<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="860" height="920" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <text x="30" y="45" fill="#FFF" font-size="24" font-weight="900" font-family="Pretendard,sans-serif">상황별 자동차보험 갈아타기 추천 가이드</text>
  <rect x="30" y="57" width="220" height="3" rx="2" fill="url(#purple)"/>

  <!-- Scenario 1 -->
  <rect x="30" y="80" width="800" height="100" rx="14" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
  <rect x="45" y="95" width="34" height="34" rx="17" fill="#7C3AED"/>
  <text x="62" y="118" text-anchor="middle" fill="#FFF" font-size="16" font-weight="900" font-family="Pretendard,sans-serif">1</text>
  <text x="95" y="115" fill="#FFF" font-size="17" font-weight="800" font-family="Pretendard,sans-serif">40대, 연 8,000km, 자녀 있음</text>
  <rect x="460" y="100" width="120" height="24" rx="12" fill="#7C3AED"/>
  <text x="520" y="117" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">다이렉트(CM)</text>
  <text x="95" y="143" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">마일리지 15~25% + 자녀 할인 + CM 최저가 → 최대 절감</text>
  <text x="95" y="166" fill="#A78BFA" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">💡 특약 3개 조합 시 설계사 대비 30만 원+ 절약 가능</text>

  <!-- Scenario 2 -->
  <rect x="30" y="195" width="800" height="100" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <rect x="45" y="210" width="34" height="34" rx="17" fill="#EF4444"/>
  <text x="62" y="233" text-anchor="middle" fill="#FFF" font-size="16" font-weight="900" font-family="Pretendard,sans-serif">2</text>
  <text x="95" y="230" fill="#FFF" font-size="17" font-weight="800" font-family="Pretendard,sans-serif">60대, 보험 처음 갈아타기</text>
  <rect x="420" y="215" width="190" height="24" rx="12" fill="#EF4444"/>
  <text x="515" y="232" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">설계사 → 다음해 CM</text>
  <text x="95" y="258" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">첫 해 설계사로 보장 설계 → 다음 갱신부터 CM 전환</text>
  <text x="95" y="281" fill="#FCA5A5" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">💡 고령자 교통안전교육 이수 시 추가 5% 할인</text>

  <!-- Scenario 3 -->
  <rect x="30" y="310" width="800" height="100" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="45" y="325" width="34" height="34" rx="17" fill="#22C55E"/>
  <text x="62" y="348" text-anchor="middle" fill="#FFF" font-size="16" font-weight="900" font-family="Pretendard,sans-serif">3</text>
  <text x="95" y="345" fill="#FFF" font-size="17" font-weight="800" font-family="Pretendard,sans-serif">30대, 비교 귀찮음, 대형사 선호</text>
  <rect x="500" y="330" width="190" height="24" rx="12" fill="#22C55E"/>
  <text x="595" y="347" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">플랫폼 비교 → CM 가입</text>
  <text x="95" y="373" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">네·카·토에서 비교 후 대형사 홈페이지에서 직접 가입 (수수료 회피)</text>
  <text x="95" y="396" fill="#86EFAC" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">💡 플랫폼 수수료 약 4만 원 절약</text>

  <!-- Scenario 4 -->
  <rect x="30" y="425" width="800" height="100" rx="14" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
  <rect x="45" y="440" width="34" height="34" rx="17" fill="#7C3AED"/>
  <text x="62" y="463" text-anchor="middle" fill="#FFF" font-size="16" font-weight="900" font-family="Pretendard,sans-serif">4</text>
  <text x="95" y="460" fill="#FFF" font-size="17" font-weight="800" font-family="Pretendard,sans-serif">전기차 신규 구매, 보험 첫 가입</text>
  <rect x="490" y="445" width="120" height="24" rx="12" fill="#7C3AED"/>
  <text x="550" y="462" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">다이렉트(CM)</text>
  <text x="95" y="488" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">전기차 전용 특약 + 오프라인 대비 21% 절감</text>
  <text x="95" y="511" fill="#A78BFA" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">💡 배터리 신가보상 + 견인 100km 필수 체크</text>

  <!-- Scenario 5 -->
  <rect x="30" y="540" width="800" height="100" rx="14" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
  <rect x="45" y="555" width="34" height="34" rx="17" fill="#7C3AED"/>
  <text x="62" y="578" text-anchor="middle" fill="#FFF" font-size="16" font-weight="900" font-family="Pretendard,sans-serif">5</text>
  <text x="95" y="575" fill="#FFF" font-size="17" font-weight="800" font-family="Pretendard,sans-serif">주말 운전자, 연 2,000km</text>
  <rect x="420" y="560" width="120" height="24" rx="12" fill="#7C3AED"/>
  <text x="480" y="577" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">다이렉트(CM)</text>
  <text x="95" y="603" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">마일리지 30~45% 환급 → 가장 큰 절감 효과</text>
  <text x="95" y="626" fill="#A78BFA" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">💡 저주행 + CM 가입 = 보험료 거의 절반 수준</text>

  <!-- Scenario 6 -->
  <rect x="30" y="655" width="800" height="100" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="45" y="670" width="34" height="34" rx="17" fill="#22C55E"/>
  <text x="62" y="693" text-anchor="middle" fill="#FFF" font-size="16" font-weight="900" font-family="Pretendard,sans-serif">6</text>
  <text x="95" y="690" fill="#FFF" font-size="17" font-weight="800" font-family="Pretendard,sans-serif">가격 민감, 중소형사 OK</text>
  <rect x="400" y="675" width="120" height="24" rx="12" fill="#22C55E"/>
  <text x="460" y="692" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">플랫폼(PM)</text>
  <text x="95" y="718" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">중소형사 PM=CM 동일 가격 + 비교 편의성</text>
  <text x="95" y="741" fill="#86EFAC" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">💡 메리츠·한화·롯데·AXA 등 수수료 미부과</text>

  <!-- Decision Checklist -->
  <rect x="30" y="775" width="800" height="110" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="50" y="805" fill="#A78BFA" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">✅ 갈아타기 5단계 체크리스트</text>
  <text x="50" y="832" fill="#E2E8F0" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">① 만기 30일 전 비교 시작  ② 주행거리 정산  ③ 특약 점검 (마일리지·자녀·UBI)</text>
  <text x="50" y="858" fill="#E2E8F0" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">④ 대물 한도 최소 5억, 권장 10억  ⑤ 카드 캐시백으로 직접 결제 (간편결제 X)</text>
  <text x="50" y="878" fill="#FCA5A5" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">⚠️ 기존 만기일 = 새 보험 시작일 반드시 일치 (공백 = 무보험!)</text>

  <!-- Footer -->
  <text x="30" y="910" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="830" y="910" text-anchor="end" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">보험 비교</text>
</svg>
