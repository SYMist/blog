<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg2)"/>

  <!-- 제목 -->
  <text x="540" y="70" font-family="sans-serif" font-size="36" font-weight="900" fill="#111827" text-anchor="middle">40대 추가 검사 항목별 비용 비교</text>
  <text x="540" y="105" font-family="sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">의원급·검진기관 vs 대학병원 | 2026년 3월 기준</text>

  <!-- 테이블 헤더 -->
  <rect x="40" y="140" width="1000" height="56" rx="12" fill="#0F766E"/>
  <text x="220" y="175" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">검사 항목</text>
  <text x="530" y="175" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">의원급 / 검진기관</text>
  <text x="800" y="175" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">대학병원</text>
  <text x="980" y="175" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">국가</text>

  <!-- 행 데이터 -->
  <!-- Row 1 -->
  <rect x="40" y="200" width="1000" height="70" rx="0" fill="#FFF"/>
  <line x1="40" y1="270" x2="1040" y2="270" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="240" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🔬 수면 위내시경</text>
  <text x="530" y="240" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">4~7만 원</text>
  <text x="800" y="240" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">14~16만 원</text>
  <text x="980" y="240" font-family="sans-serif" font-size="18" fill="#10B981" text-anchor="middle">✅</text>

  <!-- Row 2 -->
  <rect x="40" y="270" width="1000" height="70" rx="0" fill="#F9FAFB"/>
  <line x1="40" y1="340" x2="1040" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="310" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🔬 수면 대장내시경</text>
  <text x="530" y="310" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">10~19만 원</text>
  <text x="800" y="310" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">15~20만 원</text>
  <text x="980" y="310" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 3 -->
  <rect x="40" y="340" width="1000" height="70" rx="0" fill="#FFF"/>
  <line x1="40" y1="410" x2="1040" y2="410" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="380" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🫁 저선량 폐CT</text>
  <text x="530" y="380" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">13~18만 원</text>
  <text x="800" y="380" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">20~25만 원</text>
  <text x="980" y="380" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 4 -->
  <rect x="40" y="410" width="1000" height="70" rx="0" fill="#F9FAFB"/>
  <line x1="40" y1="480" x2="1040" y2="480" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="450" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🫀 심장 초음파</text>
  <text x="530" y="450" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">15~20만 원</text>
  <text x="800" y="450" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">25~30만 원</text>
  <text x="980" y="450" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 5 -->
  <rect x="40" y="480" width="1000" height="70" rx="0" fill="#FFF"/>
  <line x1="40" y1="550" x2="1040" y2="550" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="520" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🧠 뇌 MRI + MRA</text>
  <text x="530" y="520" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">50~80만 원</text>
  <text x="800" y="520" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">80~120만 원</text>
  <text x="980" y="520" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 6 -->
  <rect x="40" y="550" width="1000" height="70" rx="0" fill="#F9FAFB"/>
  <line x1="40" y1="620" x2="1040" y2="620" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="590" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">👩 유방 초음파</text>
  <text x="530" y="590" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">8~15만 원</text>
  <text x="800" y="590" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">15~20만 원</text>
  <text x="980" y="590" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 7 -->
  <rect x="40" y="620" width="1000" height="70" rx="0" fill="#FFF"/>
  <line x1="40" y1="690" x2="1040" y2="690" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="660" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🦴 골밀도 DEXA</text>
  <text x="530" y="660" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">3~5만 원</text>
  <text x="800" y="660" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">5~8만 원</text>
  <text x="980" y="660" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 8 -->
  <rect x="40" y="690" width="1000" height="70" rx="0" fill="#F9FAFB"/>
  <line x1="40" y1="760" x2="1040" y2="760" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="730" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">👨 전립선 PSA</text>
  <text x="530" y="730" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">2~3만 원</text>
  <text x="800" y="730" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">3~5만 원</text>
  <text x="980" y="730" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- Row 9 -->
  <rect x="40" y="760" width="1000" height="70" rx="0" fill="#FFF"/>
  <text x="80" y="800" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">🦋 갑상선 초음파</text>
  <text x="530" y="800" font-family="sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle">5~10만 원</text>
  <text x="800" y="800" font-family="sans-serif" font-size="20" font-weight="600" fill="#4B5563" text-anchor="middle">10~15만 원</text>
  <text x="980" y="800" font-family="sans-serif" font-size="18" fill="#EF4444" text-anchor="middle">❌</text>

  <!-- 범례 -->
  <rect x="40" y="870" width="1000" height="80" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="540" y="905" font-family="sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle">💡 40대 1순위: 대장내시경 | 2순위: 심장·경동맥 초음파 | 3순위: 성별 특화 검사</text>
  <text x="540" y="935" font-family="sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">국가 ✅ = 무료 제공  |  ❌ = 자비 추가 필요</text>

  <!-- 하단 출처 -->
  <text x="540" y="1010" font-family="sans-serif" font-size="15" fill="#9CA3AF" text-anchor="middle">2026년 3월 기준 | KAHP·대학병원 공개 비급여 수가 기반</text>
  <text x="540" y="1040" font-family="sans-serif" font-size="15" fill="#9CA3AF" text-anchor="middle">수면비·세척비 별도 기관 있음 — 사전 확인 필요</text>
</svg>
