<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="320" height="44" rx="22" fill="#0F766E"/>
  <text x="220" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 비만치료제 3종 비교</text>

  <text x="60" y="175" fill="#FFFFFF" font-size="60" font-weight="800" font-family="sans-serif">위고비 vs 삭센다</text>
  <text x="60" y="248" fill="#5EEAD4" font-size="60" font-weight="800" font-family="sans-serif">vs 큐시미아</text>

  <text x="60" y="310" fill="#94A3B8" font-size="22" font-weight="600" font-family="sans-serif">감량 15% / 7.5% / 10% · 1kg당 71만 / 53만 / 26만</text>

  <!-- 3 약물 카드 -->
  <rect x="60" y="360" width="340" height="180" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="230" y="400" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="sans-serif">위고비 · 효과 최강</text>
  <text x="230" y="460" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">평균 15%</text>
  <text x="230" y="495" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="600" font-family="sans-serif">월 45~55만 · 주 1회 주사</text>
  <text x="230" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">SELECT 4년 · 심혈관 보호</text>

  <rect x="420" y="360" width="340" height="180" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="590" y="400" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">삭센다 · GLP-1 1세대</text>
  <text x="590" y="460" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">평균 7.5%</text>
  <text x="590" y="495" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="600" font-family="sans-serif">월 15~25만 · 매일 주사</text>
  <text x="590" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">5년+ 안전 데이터</text>

  <rect x="780" y="360" width="360" height="180" rx="16" fill="url(#card)" stroke="#5EEAD4" stroke-width="2"/>
  <text x="960" y="400" text-anchor="middle" fill="#5EEAD4" font-size="16" font-weight="700" font-family="sans-serif">큐시미아 · 가성비 1위</text>
  <text x="960" y="460" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">평균 10%</text>
  <text x="960" y="495" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="600" font-family="sans-serif">월 약 15만 · 경구 캡슐</text>
  <text x="960" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">26만 원/kg 최고 효율</text>

  <text x="60" y="590" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 건강·의료 silo · 식약처·STEP·SCALE·CONQUER (2026.04 기준)</text>
</svg>
