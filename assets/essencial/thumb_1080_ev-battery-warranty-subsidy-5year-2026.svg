<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="180" r="220" fill="#1E40AF" fill-opacity="0.08"/>
  <circle cx="180" cy="900" r="180" fill="#0F766E" fill-opacity="0.08"/>

  <!-- Chip: 자동차 -->
  <rect x="40" y="40" width="110" height="34" rx="17" fill="#1E40AF" fill-opacity="0.3" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="95" y="63" text-anchor="middle" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">자동차</text>

  <!-- Chip: 2026.05 -->
  <rect x="166" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="236" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <!-- Chip: 5년 혜택 -->
  <rect x="322" y="40" width="140" height="34" rx="17" fill="#134e4a" stroke="#0F766E" stroke-width="1.5"/>
  <text x="392" y="63" text-anchor="middle" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">5년 혜택 분석</text>

  <!-- Main title -->
  <text x="540" y="192" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">전기차 배터리 보증</text>
  <text x="540" y="250" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">+ 보조금 5년 혜택</text>
  <text x="540" y="296" text-anchor="middle" fill="#93C5FD" font-size="26" font-weight="600" font-family="sans-serif">브랜드별 비교 · 시뮬레이션</text>

  <!-- Divider -->
  <rect x="200" y="320" width="680" height="3" rx="1.5" fill="#1E40AF" fill-opacity="0.6"/>

  <!-- Key stats row -->
  <rect x="40" y="342" width="300" height="120" rx="16" fill="url(#blueGrad)" fill-opacity="0.85" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="190" y="390" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="600" font-family="sans-serif">현대·기아 배터리 보증</text>
  <text x="190" y="432" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">10년 / 20만km</text>
  <text x="190" y="454" text-anchor="middle" fill="#4ADE80" font-size="13" font-family="sans-serif">업계 최장 🏆</text>

  <rect x="390" y="342" width="300" height="120" rx="16" fill="url(#tealGrad)" fill-opacity="0.85" stroke="#0F766E" stroke-width="1.5"/>
  <text x="540" y="390" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="600" font-family="sans-serif">5년 총 절감 (서울 기준)</text>
  <text x="540" y="432" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">최대 1,670만원</text>
  <text x="540" y="454" text-anchor="middle" fill="#4ADE80" font-size="13" font-family="sans-serif">보조금+유류비+정비비 합산</text>

  <rect x="740" y="342" width="300" height="120" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
  <text x="890" y="390" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="600" font-family="sans-serif">국고보조금 최대</text>
  <text x="890" y="432" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">680만원</text>
  <text x="890" y="454" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">전환지원금 100만원 포함</text>

  <!-- Two comparison cards -->
  <rect x="40" y="486" width="480" height="440" rx="20" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#1E40AF" stroke-width="2"/>
  <text x="280" y="540" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">국산 전기차</text>
  <text x="280" y="568" text-anchor="middle" fill="#93C5FD" font-size="15" font-family="sans-serif">현대·기아·제네시스</text>
  <line x1="70" y1="588" x2="480" y2="588" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="280" y="624" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 배터리 10년/20만km</text>
  <text x="280" y="654" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 국고 최대 680만원</text>
  <text x="280" y="684" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 지방 보조금 최대 1,100만원</text>
  <text x="280" y="714" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 취득세 140만원 감면</text>
  <line x1="70" y1="736" x2="480" y2="736" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="70" y="754" width="380" height="38" rx="10" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="260" y="779" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">5년 혜택 최대 ~1,670만원</text>
  <text x="280" y="836" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">개인 최초 구매 고객 대상</text>
  <text x="280" y="860" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">SOH 70% 이상 유지 보증</text>
  <text x="280" y="900" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">보조금 환수: 의무운행기간 내 판매 시</text>

  <rect x="560" y="486" width="480" height="440" rx="20" fill="url(#tealGrad)" fill-opacity="0.8" stroke="#0F766E" stroke-width="2"/>
  <text x="800" y="540" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">수입 전기차</text>
  <text x="800" y="568" text-anchor="middle" fill="#6EE7B7" font-size="15" font-family="sans-serif">테슬라·BMW·벤츠</text>
  <line x1="590" y1="588" x2="1000" y2="588" stroke="#134e4a" stroke-width="1.5"/>
  <text x="800" y="624" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 배터리 8년/16만km</text>
  <text x="800" y="654" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 국고 최대 580만원</text>
  <text x="800" y="684" text-anchor="middle" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 취득세 140만원 동일</text>
  <text x="800" y="714" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 보증 국산 대비 2년 짧음</text>
  <line x1="590" y1="736" x2="1000" y2="736" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="590" y="754" width="380" height="38" rx="10" fill="#0F766E" fill-opacity="0.4"/>
  <text x="780" y="779" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">5년 혜택 최대 ~1,490만원</text>
  <text x="800" y="836" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">차종별 보조금 별도 확인 필요</text>
  <text x="800" y="860" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">ev.or.kr에서 차종별 조회</text>
  <text x="800" y="900" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">보조금 0원 차종도 존재 — 사전 확인 필수</text>

  <!-- Footer -->
  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 구매 전 약관 확인 필요</text>
</svg>
