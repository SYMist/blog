  <text x="55" y="534" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">월 환산</text>
  <text x="480" y="534" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="800" font-family="sans-serif">약 63만원/월</text>
  <text x="790" y="534" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="800" font-family="sans-serif">약 117만원/월</text>
  <text x="970" y="534" text-anchor="middle" fill="#FCA5A5" font-size="16" font-weight="800" font-family="sans-serif">+54만원/월</text>

  <!-- Note box -->
  <rect x="40" y="566" width="1000" height="68" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="592" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">핵심 포인트</text>
  <text x="60" y="612" fill="#CBD5E1" font-size="12" font-family="sans-serif">신차 가격 차이(2,900만원) + 보험료·정비비(+870만원) = 5년 누적 3,254만원 격차. 자동차세는 동일(배기량 기준).</text>

  <text x="40" y="650" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 2026.05 기준 · 차종·옵션·운전이력·보험사에 따라 실제 수치는 다를 수 있습니다</text>
