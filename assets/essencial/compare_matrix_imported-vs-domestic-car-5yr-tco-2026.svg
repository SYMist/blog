  </defs>
  <rect width="1080" height="660" fill="url(#bg)"/>

  <text x="540" y="48" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">수입차 vs 국산차 5년 TCO 상세 비교 매트릭스</text>
  <text x="540" y="74" text-anchor="middle" fill="#93C5FD" font-size="14" font-family="sans-serif">중형 세단 2.0L · 5년 7만 5천km · 2026.05 기준</text>

  <!-- Table header -->
