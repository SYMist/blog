  <text x="790" y="484" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="800" font-family="sans-serif">약 7,030만원</text>
  <text x="970" y="484" text-anchor="middle" fill="#FCA5A5" font-size="16" font-weight="800" font-family="sans-serif">+3,254만원</text>

