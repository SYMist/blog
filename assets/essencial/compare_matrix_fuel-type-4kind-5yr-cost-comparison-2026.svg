  <!-- Note box -->
  <rect x="40" y="516" width="1000" height="100" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="544" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">핵심 포인트</text>
  <text x="60" y="566" fill="#CBD5E1" font-size="12" font-family="sans-serif">연료비만 보면 하이브리드 1위 (5년 750만원) — 그러나 구매가 800만원 비싸 5년 TCO는 4위.</text>
  <text x="60" y="586" fill="#CBD5E1" font-size="12" font-family="sans-serif">LPG는 연비 낮지만 단가·구매가 모두 저렴 → 5년 TCO 1위 (가솔린 대비 294만원 절감).</text>
  <text x="60" y="606" fill="#CBD5E1" font-size="12" font-family="sans-serif">하이브리드 vs 디젤 손익분기점: 약 9년 보유 시점에 따라잡음.</text>

  <text x="40" y="650" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 2026.05 기준 · 보험료·정비비·감가 제외 · 차종·트림에 따라 실제 수치 다름</text>
