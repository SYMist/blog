<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A1D96" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="50" width="380" height="44" rx="22" fill="#B45309"/>
  <text x="250" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 세제혜택 계좌 시나리오별 계산</text>

  <text x="60" y="165" fill="#FFFFFF" font-size="52" font-weight="800" font-family="sans-serif">4가지 실전 시나리오</text>
  <text x="60" y="230" fill="#FCD34D" font-size="52" font-weight="800" font-family="sans-serif">내 상황에 맞는 전략</text>

  <!-- Scenario A -->
  <rect x="60" y="280" width="1080" height="300" rx="16" fill="url(#cardA)" stroke="#B45309" stroke-width="2"/>
  <rect x="60" y="280" width="120" height="300" rx="16" fill="#B45309"/>
  <text x="120" y="395" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif" transform="rotate(-90,120,430)">시나리오 A</text>

  <text x="210" y="320" fill="#FCD34D" font-size="20" font-weight="800" font-family="sans-serif">30대 직장인 · 연 4,500만원 · 세금 절약 극대화</text>

  <rect x="210" y="340" width="280" height="60" rx="8" fill="#1e293b"/>
  <text x="350" y="370" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">소득: 연 4,500만원</text>
  <text x="350" y="392" text-anchor="middle" fill="#D97706" font-size="14" font-weight="700" font-family="sans-serif">세율: 16.5% (5,500만↓)</text>

  <text x="210" y="430" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">연금저축 600만 + IRP 300만 = 합산 900만 납입</text>
  <text x="210" y="460" fill="#6EE7B7" font-size="16" font-family="sans-serif">900만 × 16.5% = 세액공제 148.5만원 환급</text>
  <text x="210" y="490" fill="#6EE7B7" font-size="16" font-family="sans-serif">ISA 별도: 비과세 200만원 + 손익통산 혜택</text>

  <rect x="800" y="330" width="300" height="100" rx="12" fill="#B45309"/>
  <text x="950" y="370" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연간 환급</text>
  <text x="950" y="408" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">148.5만원</text>

  <text x="210" y="535" fill="#D97706" font-size="15" font-weight="700" font-family="sans-serif">추천 전략: 연금저축 → 연금저축펀드 (ETF 투자), IRP → 안정형 채권혼합</text>
  <text x="210" y="560" fill="#94A3B8" font-size="14" font-family="sans-serif">ISA 3년 만기 후 연금계좌 이전 시 300만 추가공제 → 연 198만원까지 가능</text>

  <!-- Scenario B -->
  <rect x="60" y="610" width="1080" height="280" rx="16" fill="url(#cardB)" stroke="#0F766E" stroke-width="2"/>
  <rect x="60" y="610" width="120" height="280" rx="16" fill="#0F766E"/>
  <text x="120" y="720" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif" transform="rotate(-90,120,750)">시나리오 B</text>

  <text x="210" y="650" fill="#6EE7B7" font-size="20" font-weight="800" font-family="sans-serif">40대 자영업자 · 연 6,000만원 · IRP 단독 전략</text>

  <rect x="210" y="670" width="280" height="60" rx="8" fill="#1e293b"/>
  <text x="350" y="700" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">소득: 연 6,000만원 (사업소득)</text>
  <text x="350" y="722" text-anchor="middle" fill="#10B981" font-size="14" font-weight="700" font-family="sans-serif">세율: 13.2% (5,500만↑)</text>

  <text x="210" y="760" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">연금저축 600만 + IRP 300만 = 합산 900만 납입</text>
  <text x="210" y="790" fill="#6EE7B7" font-size="16" font-family="sans-serif">900만 × 13.2% = 세액공제 118.8만원 환급</text>
  <text x="210" y="820" fill="#94A3B8" font-size="15" font-family="sans-serif">ISA는 금융소득종합과세 해당 시 가입 불가 (확인 필요)</text>

  <rect x="800" y="660" width="300" height="100" rx="12" fill="#0F766E"/>
  <text x="950" y="700" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연간 환급</text>
  <text x="950" y="738" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">118.8만원</text>

  <text x="210" y="860" fill="#10B981" font-size="15" font-weight="700" font-family="sans-serif">추천: 자영업자는 IRP 우선 (연금저축+IRP 합산한도 활용)</text>

  <!-- Scenario C -->
  <rect x="60" y="920" width="1080" height="300" rx="16" fill="url(#cardC)" stroke="#1E40AF" stroke-width="2"/>
  <rect x="60" y="920" width="120" height="300" rx="16" fill="#1E40AF"/>
  <text x="120" y="1030" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif" transform="rotate(-90,120,1070)">시나리오 C</text>

  <text x="210" y="960" fill="#93C5FD" font-size="20" font-weight="800" font-family="sans-serif">ISA 만기 5,000만원 연금이전 · 세제 혜택 극대화</text>

  <rect x="210" y="980" width="280" height="60" rx="8" fill="#1e293b"/>
  <text x="350" y="1010" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">ISA 만기금: 5,000만원</text>
  <text x="350" y="1032" text-anchor="middle" fill="#3B82F6" font-size="14" font-weight="700" font-family="sans-serif">전액 연금계좌 이전</text>

  <text x="210" y="1070" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">이전 금액 10% = 500만, 한도 300만 → 공제 300만원 추가</text>
  <text x="210" y="1100" fill="#93C5FD" font-size="16" font-family="sans-serif">기존 연금저축+IRP 900만 + ISA이전 300만 = 총 1,200만 공제</text>
  <text x="210" y="1130" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">1,200만 × 16.5% = 연간 환급 198만원</text>

  <rect x="800" y="970" width="300" height="100" rx="12" fill="#1E40AF"/>
  <text x="950" y="1010" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연간 환급</text>
  <text x="950" y="1048" text-anchor="middle" fill="#FCD34D" font-size="46" font-weight="800" font-family="sans-serif">198만원</text>

  <text x="210" y="1175" fill="#3B82F6" font-size="15" font-weight="700" font-family="sans-serif">추천: ISA 3년 의무유지 후 만기 → 전액 연금계좌 이전이 최적</text>
  <text x="210" y="1200" fill="#94A3B8" font-size="14" font-family="sans-serif">ISA 이전 추가공제는 이전 연도에 1회 적용 (매년 반복 가능)</text>

  <!-- Scenario D -->
  <rect x="60" y="1250" width="1080" height="280" rx="16" fill="url(#cardD)" stroke="#7C3AED" stroke-width="2"/>
  <rect x="60" y="1250" width="120" height="280" rx="16" fill="#7C3AED"/>
  <text x="120" y="1360" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif" transform="rotate(-90,120,1390)">시나리오 D</text>

  <text x="210" y="1290" fill="#C4B5FD" font-size="20" font-weight="800" font-family="sans-serif">55세 연금 수령 시작 · 연 1,200만원 수령</text>

  <rect x="210" y="1310" width="280" height="60" rx="8" fill="#1e293b"/>
  <text x="350" y="1340" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">연금 수령: 월 100만 (연 1,200만)</text>
  <text x="350" y="1362" text-anchor="middle" fill="#A78BFA" font-size="14" font-weight="700" font-family="sans-serif">55~69세: 연금소득세 5.5%</text>

  <text x="210" y="1400" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">연금소득 1,200만 이하 → 분리과세 선택 가능</text>
  <text x="210" y="1430" fill="#C4B5FD" font-size="16" font-family="sans-serif">원천징수 5.5% = 66만원 / 실수령 1,134만원</text>
  <text x="210" y="1460" fill="#6EE7B7" font-size="16" font-family="sans-serif">1,500만 초과 시 종합소득 합산 (주의)</text>

  <rect x="800" y="1300" width="300" height="100" rx="12" fill="#7C3AED"/>
  <text x="950" y="1340" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">실효 세율</text>
  <text x="950" y="1378" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">5.5%</text>

  <text x="210" y="1500" fill="#A78BFA" font-size="15" font-weight="700" font-family="sans-serif">70세 이후 4.4%, 80세 이후 3.3%로 세율 인하</text>

  <text x="60" y="1656" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 국세청·금융위·기획재정부 (2026.04 기준) · 개인 상황에 따라 달라질 수 있음</text>
</svg>
