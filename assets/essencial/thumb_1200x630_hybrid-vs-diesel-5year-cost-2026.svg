<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="320" height="44" rx="22" fill="#1E40AF"/>
  <text x="220" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 하이브리드 vs 디젤 5년 TCO</text>

  <text x="60" y="175" fill="#FFFFFF" font-size="60" font-weight="800" font-family="sans-serif">5년 보유,</text>
  <text x="60" y="248" fill="#93C5FD" font-size="60" font-weight="800" font-family="sans-serif">1,000만 원 차이</text>

  <text x="60" y="310" fill="#94A3B8" font-size="22" font-weight="600" font-family="sans-serif">중형 SUV 4,000만·1.5만km/年·친환경 세제 12.31 일몰 임박</text>

  <!-- 3 key cards -->
  <rect x="60" y="360" width="340" height="180" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="230" y="400" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="sans-serif">하이브리드 5년 TCO</text>
  <text x="230" y="460" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">3,935 만</text>
  <text x="230" y="495" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="600" font-family="sans-serif">잔존율 55% · 친환경 세제 130만</text>
  <text x="230" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">도심·5년+·세제 활용 시 최적</text>

  <rect x="420" y="360" width="340" height="180" rx="16" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
  <text x="590" y="400" text-anchor="middle" fill="#FCA5A5" font-size="16" font-weight="700" font-family="sans-serif">디젤 5년 TCO (+1,016만)</text>
  <text x="590" y="460" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">4,951 만</text>
  <text x="590" y="495" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="600" font-family="sans-serif">잔존율 45% · 환경부담금 부과</text>
  <text x="590" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">고속·견인·연 3만 km+ 시 검토</text>

  <rect x="780" y="360" width="360" height="180" rx="16" fill="url(#card)" stroke="#1E40AF" stroke-width="2"/>
  <text x="960" y="400" text-anchor="middle" fill="#93C5FD" font-size="16" font-weight="700" font-family="sans-serif">친환경 세제 일몰</text>
  <text x="960" y="460" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">2026.12.31</text>
  <text x="960" y="495" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="600" font-family="sans-serif">개소세·취득세 감면 마감</text>
  <text x="960" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">통행료 할인 30%(2026)·20%(2027)</text>

  <text x="60" y="590" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 자동차 silo · 한국에너지공단·환경부·자동차365 (2026.04 기준)</text>
</svg>
