  <text x="810" y="475" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">비갱신형 — 고정 보험료</text>
  <text x="810" y="515" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">KB / DB / 삼성</text>
  <text x="810" y="545" fill="#CBD5E1" font-size="14" font-family="sans-serif">20·30년 만기 비갱신 풍부</text>
  <text x="810" y="568" fill="#CBD5E1" font-size="14" font-family="sans-serif">갱신 인상 리스크 회피</text>
  <text x="810" y="600" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">+ 신계약 변호사비 50% 자부담 주의</text>

  <!-- Card 7 -->
  <rect x="60" y="645" width="715" height="230" rx="16" fill="#1e293b" stroke="#FCD34D" stroke-width="2"/>
  <rect x="80" y="665" width="120" height="32" rx="16" fill="#FCD34D"/>
  <text x="140" y="687" text-anchor="middle" fill="#92400E" font-size="14" font-weight="800" font-family="sans-serif">50~60대</text>
  <text x="80" y="725" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">갱신형 — 단기 저보험료 우선</text>
  <text x="80" y="765" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">메리츠 / 한화</text>
  <text x="80" y="795" fill="#CBD5E1" font-size="14" font-family="sans-serif">단기 갱신형으로 초기 부담 최소화 — 단, 60세 이후 비갱신 대비 약 1.5~2배 가능</text>
