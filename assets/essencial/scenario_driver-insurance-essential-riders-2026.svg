  <g font-family="sans-serif">
    <!-- Step 1 -->
    <rect x="60" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="145" cy="1010" r="22" fill="#7C3AED"/>
    <text x="145" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">1</text>
    <text x="145" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">중복가입 확인</text>
    <text x="145" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">손보협회 조회로</text>
    <text x="145" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">기존 계약 점검</text>
    <text x="145" y="1130" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700">중복 시 비례보상</text>

    <!-- Step 2 -->
    <rect x="245" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="330" cy="1010" r="22" fill="#7C3AED"/>
    <text x="330" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">2</text>
    <text x="330" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">필수 4종 확정</text>
    <text x="330" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">벌금·합의금·</text>
    <text x="330" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">변호사·교통사고처리</text>
    <text x="330" y="1130" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">한도 5,000만↑</text>

    <!-- Step 3 -->
    <rect x="430" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="515" cy="1010" r="22" fill="#7C3AED"/>
    <text x="515" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">3</text>
    <text x="515" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">갱신 vs 비갱신</text>
    <text x="515" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">30~40대: 비갱신</text>
    <text x="515" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">50대~: 단기 갱신</text>
    <text x="515" y="1130" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">총납입 비교 필수</text>

    <!-- Step 4 -->
    <rect x="615" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="700" cy="1010" r="22" fill="#7C3AED"/>
    <text x="700" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">4</text>
    <text x="700" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2026 개정 반영</text>
    <text x="700" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">신계약 변호사비</text>
    <text x="700" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">자기부담 50% 인지</text>
    <text x="700" y="1130" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700">기존계약은 무관</text>

    <!-- Step 5 -->
    <rect x="800" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="885" cy="1010" r="22" fill="#7C3AED"/>
    <text x="885" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">5</text>
    <text x="885" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">결합 할인 활용</text>
    <text x="885" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">자동차+운전자</text>
    <text x="885" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">티맵·블박 결합</text>
    <text x="885" y="1130" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">5~10% 절감</text>

    <!-- Step 6 -->
    <rect x="985" y="975" width="155" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="1062" cy="1010" r="22" fill="#7C3AED"/>
    <text x="1062" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">6</text>
    <text x="1062" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">사고 시 대응</text>
    <text x="1062" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">진단주수 확정 후</text>
    <text x="1062" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">즉시 청구</text>
    <text x="1062" y="1130" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">8주 룰 서류 챙김</text>
  </g>

  <!-- Bottom warning -->
  <rect x="60" y="1190" width="1080" height="120" rx="14" fill="#1e293b" stroke="#F87171" stroke-width="2"/>
  <text x="80" y="1230" fill="#FCA5A5" font-size="20" font-weight="800" font-family="sans-serif">⚠ 2026 음주방지장치 의무 부착 (10월 시행)</text>
  <text x="80" y="1265" fill="#FFFFFF" font-size="15" font-family="sans-serif">최근 5년 내 음주운전 2회 이상 적발자는 2026년 10월부터 음주방지장치(IID) 의무 부착 — 자비 약 300만 원 발생</text>
  <text x="80" y="1295" fill="#CBD5E1" font-size="14" font-family="sans-serif">약물운전은 음주와 동일 격상되어 보험료 약 20% 할증 — 운전자보험은 음주·약물 사고 완전 면책 유지</text>

  <text x="60" y="1620" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 보험 silo · 본 자료는 일반 정보 제공 목적으로 개별 가입은 약관·청약서 확인 필수</text>
</svg>
