<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <text x="60" y="80" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">시나리오별 추천 — 운전자보험 2026</text>
  <text x="60" y="115" fill="#C4B5FD" font-size="18" font-weight="600" font-family="sans-serif">운전 패턴·연령·차종 기준 6사 적합도</text>

  <!-- Card 1 -->
  <rect x="60" y="145" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="80" y="165" width="100" height="32" rx="16" fill="#7C3AED"/>
  <text x="130" y="187" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">자녀 보호</text>
  <text x="80" y="225" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">스쿨존 통행 잦은 학부모</text>
  <text x="80" y="265" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">DB손보</text>
  <text x="80" y="295" fill="#CBD5E1" font-size="14" font-family="sans-serif">스쿨존 6주미만 +500만</text>
  <text x="80" y="318" fill="#CBD5E1" font-size="14" font-family="sans-serif">최대 800만 (업계 최고)</text>
  <text x="80" y="350" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">+ 가족 한정 운전 특약 결합</text>

  <!-- Card 2 -->
  <rect x="425" y="145" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="445" y="165" width="100" height="32" rx="16" fill="#7C3AED"/>
  <text x="495" y="187" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">장거리</text>
  <text x="445" y="225" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">출퇴근·고속도로 잦은 직장인</text>
  <text x="445" y="265" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">삼성화재</text>
  <text x="445" y="295" fill="#CBD5E1" font-size="14" font-family="sans-serif">변호사비 1~14급 선지급</text>
  <text x="445" y="318" fill="#CBD5E1" font-size="14" font-family="sans-serif">장기 분쟁·중대사고 유리</text>
  <text x="445" y="350" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">+ 형사합의금 1억 가입</text>

  <!-- Card 3 -->
  <rect x="790" y="145" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="810" y="165" width="100" height="32" rx="16" fill="#7C3AED"/>
  <text x="860" y="187" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">티맵</text>
  <text x="810" y="225" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">티맵 안전운전 점수 80+</text>
  <text x="810" y="265" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">KB손보</text>
  <text x="810" y="295" fill="#CBD5E1" font-size="14" font-family="sans-serif">자동차+운전자 결합 할인</text>
  <text x="810" y="318" fill="#CBD5E1" font-size="14" font-family="sans-serif">통합 청구·관리 편의</text>
  <text x="810" y="350" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">+ 점수 90+ 추가 할인</text>

  <!-- Card 4 -->
  <rect x="60" y="395" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="80" y="415" width="100" height="32" rx="16" fill="#7C3AED"/>
  <text x="130" y="437" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">가성비</text>
  <text x="80" y="475" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">월 1만 원대 단독형 원할 때</text>
  <text x="80" y="515" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">메리츠 / 한화</text>
  <text x="80" y="545" fill="#CBD5E1" font-size="14" font-family="sans-serif">메리츠: 4주미만 500만 강세</text>
  <text x="80" y="568" fill="#CBD5E1" font-size="14" font-family="sans-serif">한화: 초저가·필수만 슬림</text>
  <text x="80" y="600" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">+ 비갱신 20년·30년 옵션 비교</text>

  <!-- Card 5 -->
  <rect x="425" y="395" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="445" y="415" width="100" height="32" rx="16" fill="#7C3AED"/>
  <text x="495" y="437" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">전기차</text>
  <text x="445" y="475" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">EV 보유 + 저속 사고 우려</text>
  <text x="445" y="515" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">현대해상</text>
  <text x="445" y="545" fill="#CBD5E1" font-size="14" font-family="sans-serif">자동차보험 묶음 시너지</text>
  <text x="445" y="568" fill="#CBD5E1" font-size="14" font-family="sans-serif">EV 특화 부가 서비스</text>
  <text x="445" y="600" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">+ 자동차보험 결합 할인 5~7%</text>

  <!-- Card 6 -->
  <rect x="790" y="395" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="810" y="415" width="100" height="32" rx="16" fill="#7C3AED"/>
