  <!-- Decision flow / 5단계 체크리스트 -->
  <rect x="790" y="645" width="350" height="230" rx="16" fill="#1e293b" stroke="#34D399" stroke-width="2"/>
  <text x="810" y="685" fill="#34D399" font-size="20" font-weight="800" font-family="sans-serif">기존 가입자 점검</text>
  <g font-family="sans-serif">
    <text x="810" y="725" fill="#FFFFFF" font-size="14">✓ 변호사선임비 한도 ≥ 5,000만</text>
    <text x="810" y="755" fill="#FFFFFF" font-size="14">✓ 형사합의금 ≥ 5,000만</text>
    <text x="810" y="785" fill="#FFFFFF" font-size="14">✓ 벌금 대인 3,000만/대물 500만</text>
    <text x="810" y="815" fill="#FFFFFF" font-size="14">✓ 중복 가입 여부 확인</text>
    <text x="810" y="845" fill="#FFFFFF" font-size="14">✓ 갱신·비갱신 만기 점검</text>
  </g>

  <!-- 6 step checklist -->
