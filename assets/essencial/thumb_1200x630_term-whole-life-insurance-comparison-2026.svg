<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="100" r="220" fill="#7C3AED" fill-opacity="0.07"/>
  <circle cx="120" cy="560" r="160" fill="#0F766E" fill-opacity="0.07"/>

  <!-- Chip -->
  <rect x="40" y="36" width="140" height="32" rx="16" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="110" y="57" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700" font-family="sans-serif">보험 비교</text>

  <rect x="196" y="36" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="266" y="57" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <!-- Title block -->
  <text x="600" y="136" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">종신보험 vs 정기보험</text>
  <text x="600" y="178" text-anchor="middle" fill="#A78BFA" font-size="22" font-weight="600" font-family="sans-serif">50대 실질 보장 · 월 보험료 · 시나리오별 추천</text>

  <rect x="300" y="198" width="600" height="3" rx="1.5" fill="#7C3AED" fill-opacity="0.5"/>

  <!-- 종신보험 card -->
  <rect x="40" y="218" width="540" height="336" rx="16" fill="url(#purpleGrad)" fill-opacity="0.8" stroke="#7C3AED" stroke-width="2"/>
  <text x="310" y="268" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">종신보험</text>
  <text x="310" y="298" text-anchor="middle" fill="#C4B5FD" font-size="14" font-family="sans-serif">평생 보장 · 해약환급금 있음</text>
  <line x1="70" y1="314" x2="550" y2="314" stroke="#4C1D95" stroke-width="1.5"/>
  <text x="310" y="358" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">월 12만~18만원</text>
  <text x="310" y="386" text-anchor="middle" fill="#FCA5A5" font-size="15" font-family="sans-serif">정기보험의 2~3배 · 20년 총납 최대 4,320만원</text>
  <line x1="70" y1="406" x2="550" y2="406" stroke="#4C1D95" stroke-width="1.5"/>
  <text x="70" y="440" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 사망 시점 불문 평생 보장</text>
  <text x="70" y="466" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 해약환급금 60~100%</text>
  <text x="70" y="492" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 50대 신규 보험료 부담 큼</text>
  <rect x="70" y="514" width="450" height="30" rx="8" fill="#7C3AED" fill-opacity="0.3"/>
  <text x="295" y="535" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 상속·장례비 목적 소액(3천만원) 활용 권장</text>

  <!-- 정기보험 card -->
  <rect x="620" y="218" width="540" height="336" rx="16" fill="url(#tealGrad)" fill-opacity="0.8" stroke="#0F766E" stroke-width="2"/>
  <text x="890" y="268" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">정기보험</text>
  <text x="890" y="298" text-anchor="middle" fill="#6EE7B7" font-size="14" font-family="sans-serif">기간 보장 · 보험료 저렴</text>
  <line x1="650" y1="314" x2="1130" y2="314" stroke="#134e4a" stroke-width="1.5"/>
  <text x="890" y="358" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">월 4만~7만원 🏆</text>
  <text x="890" y="386" text-anchor="middle" fill="#4ADE80" font-size="15" font-family="sans-serif">종신보험의 1/3 · 20년 총납 최대 1,680만원</text>
  <line x1="650" y1="406" x2="1130" y2="406" stroke="#134e4a" stroke-width="1.5"/>
  <text x="650" y="440" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 보험료 최소화</text>
  <text x="650" y="466" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 단순 구조 (기간+금액만 설정)</text>
  <text x="650" y="492" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 만기 후 보장 소멸</text>
  <rect x="650" y="514" width="450" height="30" rx="8" fill="#0F766E" fill-opacity="0.3"/>
  <text x="875" y="535" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">→ 자녀 독립·부채 완납 시점까지 기간 설정</text>

  <!-- Footer -->
  <text x="40" y="610" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 가입 전 약관 확인 필요</text>
</svg>
