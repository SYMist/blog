<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="24"/>

  <!-- Left Section -->
  <!-- Badge -->
  <rect x="60" y="50" width="200" height="42" rx="21" fill="#EF4444"/>
  <text x="160" y="78" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">2026 비교분석</text>

  <!-- Main Text -->
  <text x="60" y="170" fill="#FFFFFF" font-size="54" font-weight="900" font-family="Pretendard,sans-serif">신용점수</text>
  <text x="60" y="245" fill="#FFFFFF" font-size="66" font-weight="900" font-family="Pretendard,sans-serif">700 vs 800</text>

  <!-- Divider -->
  <rect x="60" y="270" width="300" height="4" rx="2" fill="url(#amber)"/>

  <!-- Sub Text -->
  <text x="60" y="320" fill="#E2E8F0" font-size="32" font-weight="600" font-family="Pretendard,sans-serif">대출금리 실제 차이 — 등급별 비교</text>

  <!-- Chips -->
  <rect x="60" y="360" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="110" y="384" text-anchor="middle" fill="#92400E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="175" y="360" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="225" y="384" text-anchor="middle" fill="#92400E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">금리</text>
  <rect x="290" y="360" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="340" y="384" text-anchor="middle" fill="#92400E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">전략</text>

  <!-- Right Section: Two Cards -->
  <!-- 800점 Card -->
  <rect x="660" y="50" width="240" height="250" rx="16" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="660" y="50" width="240" height="48" rx="16" fill="#22C55E"/>
  <rect x="660" y="82" width="240" height="16" fill="#22C55E"/>
  <text x="780" y="83" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">800점대</text>
  <text x="780" y="140" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">인터넷은행</text>
  <text x="780" y="180" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">연 4~7%</text>
  <text x="780" y="225" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">2금융권</text>
  <text x="780" y="265" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="Pretendard,sans-serif">연 11~16%</text>

  <!-- 700점 Card -->
  <rect x="930" y="50" width="240" height="250" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="930" y="50" width="240" height="48" rx="16" fill="#F59E0B"/>
  <rect x="930" y="82" width="240" height="16" fill="#F59E0B"/>
  <text x="1050" y="83" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">700점대</text>
  <text x="1050" y="140" text-anchor="middle" fill="#FDE68A" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">인터넷은행</text>
  <text x="1050" y="180" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">연 7~11%</text>
  <text x="1050" y="225" text-anchor="middle" fill="#FDE68A" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">2금융권</text>
  <text x="1050" y="265" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="Pretendard,sans-serif">연 14~18%</text>

  <!-- Bottom Highlight -->
  <rect x="660" y="330" width="510" height="80" rx="14" fill="#B45309" opacity="0.2"/>
  <rect x="660" y="330" width="510" height="80" rx="14" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="915" y="365" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">1억 대출 · 5년 기준 이자 차이</text>
  <text x="915" y="398" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="900" font-family="Pretendard,sans-serif">약 840만 원</text>

  <!-- Footer -->
  <text x="60" y="580" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="1140" y="580" text-anchor="end" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">대출·금융 비교</text>
</svg>
