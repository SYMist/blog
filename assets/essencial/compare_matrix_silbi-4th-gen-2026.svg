  <rect x="40" y="555" width="1000" height="220" rx="20" fill="#FFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="540" y="590" font-family="sans-serif" font-size="24" font-weight="900" fill="#7C3AED" text-anchor="middle">4세대 비급여 차등제 등급별 보험료 (50대 기준)</text>

  <rect x="70" y="610" width="180" height="60" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
