  <text x="370" y="503" font-family="sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">제한 없음</text>
  <text x="570" y="503" font-family="sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">제한 없음</text>
  <text x="770" y="503" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">특약 분리</text>
  <text x="940" y="503" font-family="sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">50회·350만</text>

