<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg2)"/>

  <text x="540" y="55" font-family="sans-serif" font-size="32" font-weight="900" fill="#111827" text-anchor="middle">실비보험 세대별 비교 매트릭스</text>
  <text x="540" y="88" font-family="sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">2026년 50대 기준 | 보험료·자기부담·차등제·재가입 종합 비교</text>

  <!-- 테이블 헤더 -->
  <rect x="40" y="115" width="1000" height="50" rx="12" fill="#7C3AED"/>
  <text x="160" y="147" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">비교 항목</text>
  <text x="370" y="147" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">1세대 (구실손)</text>
