  <text x="360" y="660" font-family="sans-serif" font-size="20" font-weight="900" fill="#059669" text-anchor="middle">~3.3만 (0%)</text>

  <rect x="470" y="610" width="180" height="60" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
