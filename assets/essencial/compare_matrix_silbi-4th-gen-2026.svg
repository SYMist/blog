  <text x="560" y="660" font-family="sans-serif" font-size="20" font-weight="900" fill="#DC2626" text-anchor="middle">~6.6만 (2배)</text>

  <rect x="670" y="610" width="160" height="60" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
