  <text x="750" y="660" font-family="sans-serif" font-size="20" font-weight="900" fill="#DC2626" text-anchor="middle">~9.8만 (3배)</text>

  <rect x="850" y="610" width="160" height="60" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="930" y="635" font-family="sans-serif" font-size="16" font-weight="800" fill="#991B1B" text-anchor="middle">5등급 (300만+)</text>
  <text x="930" y="660" font-family="sans-serif" font-size="20" font-weight="900" fill="#DC2626" text-anchor="middle">~13.1만 (4배)</text>

  <text x="540" y="715" font-family="sans-serif" font-size="16" fill="#DC2626" text-anchor="middle">5등급이 되면 4세대 보험료(~13.1만)가 1세대(~12만)보다 더 비싸지는 역전 현상 발생</text>
  <text x="540" y="745" font-family="sans-serif" font-size="16" fill="#7C3AED" text-anchor="middle">1등급 할인율: 흥국화재 11% (최고) vs NH농협손보 4.1% (최저) — 보험사 선택 중요</text>

  <!-- 4세대 vs 5세대 -->
  <rect x="40" y="800" width="1000" height="150" rx="20" fill="#FFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="540" y="835" font-family="sans-serif" font-size="22" font-weight="900" fill="#7C3AED" text-anchor="middle">4세대 vs 5세대 (2026.04 출시 예정) 보장 비교</text>

  <rect x="70" y="855" width="440" height="70" rx="14" fill="#F5F3FF"/>
  <text x="290" y="882" font-family="sans-serif" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="middle">4세대: 경증 한도 5,000만 · 자기부담 30%</text>
  <text x="290" y="910" font-family="sans-serif" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="middle">통원 1일 최대 20만 원</text>

  <text x="540" y="895" font-family="sans-serif" font-size="28" font-weight="900" fill="#6B7280">→</text>

  <rect x="570" y="855" width="440" height="70" rx="14" fill="#FEF2F2"/>
  <text x="790" y="882" font-family="sans-serif" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">5세대: 경증 한도 1,000만 · 자기부담 50%</text>
  <text x="790" y="910" font-family="sans-serif" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">통원 10만 원 이하 검토 중</text>

  <rect x="40" y="975" width="1000" height="45" rx="12" fill="#7C3AED"/>
  <text x="540" y="1004" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">5세대 출시 전(2026.04) 4세대 전환 → 현재 보장 5년간 확보 가능</text>

  <text x="540" y="1060" font-family="sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">2026년 3월 기준 | 보험개발원·금융감독원 공시 자료 기반 | 개인별 차이 있음</text>
</svg>