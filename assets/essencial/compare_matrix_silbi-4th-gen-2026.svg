  <text x="370" y="383" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">3~5년</text>
  <text x="570" y="383" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">1~3년</text>
  <text x="770" y="383" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">1년</text>
  <text x="940" y="383" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">1년</text>

