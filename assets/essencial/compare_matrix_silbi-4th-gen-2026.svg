  <text x="770" y="147" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">3세대 (착한)</text>
  <text x="940" y="147" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">4세대 (차등제)</text>

  <!-- Row 1: 월 보험료 -->
  <rect x="40" y="170" width="1000" height="55" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
