  <text x="370" y="203" font-family="sans-serif" font-size="20" font-weight="900" fill="#DC2626" text-anchor="middle">~12만 원</text>
  <text x="570" y="203" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">~8만 원</text>
  <text x="770" y="203" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">~5만 원</text>
  <text x="940" y="203" font-family="sans-serif" font-size="20" font-weight="900" fill="#059669" text-anchor="middle">~3.3만 원</text>

  <!-- Row 2: 자기부담 (급여) -->
  <rect x="40" y="230" width="1000" height="55" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="160" y="263" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">자기부담(급여)</text>
  <text x="370" y="263" font-family="sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">0~5,000원</text>
  <text x="570" y="263" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">10~20%</text>
  <text x="770" y="263" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">10~20%</text>
  <text x="940" y="263" font-family="sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">20%</text>

