  <rect x="40" y="410" width="1000" height="55" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="160" y="443" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">재가입 주기</text>
  <text x="370" y="443" font-family="sans-serif" font-size="18" font-weight="900" fill="#059669" text-anchor="middle">없음 (종신)</text>
  <text x="570" y="443" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">15년</text>
