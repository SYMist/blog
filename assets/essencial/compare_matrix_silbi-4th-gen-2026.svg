  <text x="160" y="660" font-family="sans-serif" font-size="20" font-weight="900" fill="#059669" text-anchor="middle">~2.9만 (-11%)</text>

  <rect x="270" y="610" width="180" height="60" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
