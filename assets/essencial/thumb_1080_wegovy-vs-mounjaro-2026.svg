<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#tbg)" rx="24"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="200" fill="#0F766E" fill-opacity="0.15"/>
  <circle cx="930" cy="930" r="250" fill="#7C3AED" fill-opacity="0.1"/>

  <!-- Badge -->
  <rect x="390" y="180" width="300" height="52" rx="26" fill="#EF4444"/>
  <text x="540" y="213" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="700">2026 최신 비교</text>

  <!-- Main text -->
  <text x="540" y="360" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="64" font-weight="900">위고비</text>
  <text x="540" y="440" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="48" font-weight="700">vs</text>
  <text x="540" y="530" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="64" font-weight="900">마운자로</text>

  <!-- Sub text -->
  <text x="540" y="640" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="30">가격·보험적용·감량 효과</text>
  <text x="540" y="690" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="30">비만 신약 선택 가이드</text>

  <!-- Chips -->
  <rect x="230" y="770" width="120" height="44" rx="22" fill="#FEF3C7"/>
  <text x="290" y="798" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="20" font-weight="700">가격 비교</text>

  <rect x="380" y="770" width="140" height="44" rx="22" fill="#FEF3C7"/>
  <text x="450" y="798" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="20" font-weight="700">보험 적용</text>

  <rect x="550" y="770" width="140" height="44" rx="22" fill="#FEF3C7"/>
  <text x="620" y="798" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="20" font-weight="700">감량 효과</text>

  <rect x="720" y="770" width="140" height="44" rx="22" fill="#FEF3C7"/>
  <text x="790" y="798" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="20" font-weight="700">부작용</text>

  <!-- Watermark -->
  <text x="540" y="960" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.3" font-family="sans-serif" font-size="22">essencial</text>
