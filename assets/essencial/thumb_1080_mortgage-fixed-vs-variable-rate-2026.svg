<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <rect x="80" y="100" width="260" height="46" rx="23" fill="#B45309"/>
  <text x="210" y="132" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">2026 스트레스 DSR 3단계</text>

  <text x="80" y="220" fill="#FFFFFF" font-size="58" font-weight="800" font-family="sans-serif">주담대 고정 vs 변동</text>
  <text x="80" y="288" fill="#FFFFFF" font-size="58" font-weight="800" font-family="sans-serif">금리인하기 전략</text>
  <text x="80" y="348" fill="#FCD34D" font-size="32" font-weight="600" font-family="sans-serif">한도 vs 이자 절감 매트릭스</text>

  <rect x="80" y="378" width="380" height="6" rx="3" fill="#B45309"/>

  <text x="80" y="438" fill="#FCD34D" font-size="26" font-weight="700" font-family="sans-serif">기준금리 2.50% 3연속 동결</text>
  <text x="80" y="475" fill="#FCD34D" font-size="26" font-weight="700" font-family="sans-serif">고정 상단 7.01% 돌파</text>

  <!-- Big numbers grid -->
  <rect x="80" y="525" width="430" height="170" rx="20" fill="#1e293b" stroke="#B45309" stroke-width="3"/>
  <text x="295" y="575" text-anchor="middle" fill="#FCD34D" font-size="20" font-weight="700" font-family="sans-serif">주기형 한도 우위</text>
  <text x="295" y="635" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">+1억 원</text>
  <text x="295" y="670" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="600" font-family="sans-serif">DSR 40% 반영</text>

  <rect x="540" y="525" width="430" height="170" rx="20" fill="#1e293b" stroke="#B45309" stroke-width="3"/>
  <text x="755" y="575" text-anchor="middle" fill="#FCD34D" font-size="20" font-weight="700" font-family="sans-serif">고정 vs 변동 하단 격차</text>
  <text x="755" y="635" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">0.8%p</text>
  <text x="755" y="670" text-anchor="middle" fill="#FCD34D" font-size="18" font-weight="600" font-family="sans-serif">4.41% vs 3.61%</text>

  <rect x="80" y="725" width="430" height="170" rx="20" fill="#1e293b" stroke="#B45309" stroke-width="3"/>
  <text x="295" y="775" text-anchor="middle" fill="#FCD34D" font-size="20" font-weight="700" font-family="sans-serif">케이뱅크 최저 금리</text>
  <text x="295" y="835" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">3.26%</text>
  <text x="295" y="870" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="600" font-family="sans-serif">금융권 최저 · 인터넷은행</text>

  <rect x="540" y="725" width="430" height="170" rx="20" fill="#1e293b" stroke="#B45309" stroke-width="3"/>
  <text x="755" y="775" text-anchor="middle" fill="#FCD34D" font-size="20" font-weight="700" font-family="sans-serif">신생아 특례 디딤돌</text>
  <text x="755" y="835" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">1.8~4.5%</text>
  <text x="755" y="870" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="600" font-family="sans-serif">최대 4억 · 자녀 우대 -0.2%p</text>

  <text x="80" y="970" fill="#FFFFFF" font-size="26" font-weight="700" font-family="sans-serif">주기형·혼합형·변동형 한도 시뮬레이션</text>
  <text x="80" y="1010" fill="#FCD34D" font-size="22" font-weight="600" font-family="sans-serif">차주 유형 6가지 + 대환 손익분기 공식</text>

  <text x="80" y="1055" fill="#64748B" font-size="18" font-family="sans-serif">essencial | 대출·금융 silo</text>
