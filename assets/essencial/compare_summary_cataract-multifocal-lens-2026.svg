  <text x="330" y="998" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="396" y="975" width="110" height="34" rx="17" fill="#F0FDFA"/>
  <text x="451" y="998" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">다초점</text>
  <rect x="522" y="975" width="100" height="34" rx="17" fill="#F0FDFA"/>
  <text x="572" y="998" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">비용</text>
  <rect x="638" y="975" width="100" height="34" rx="17" fill="#F0FDFA"/>
  <text x="688" y="998" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">실비</text>

  <!-- Footer -->
  <text x="540" y="1055" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준 심평원 데이터</text>
</svg>
