  <!-- Title -->
  <text x="540" y="140" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="900" font-family="Pretendard,sans-serif">백내장 다초점 렌즈 비교</text>
  <text x="540" y="190" text-anchor="middle" fill="#E2E8F0" font-size="30" font-weight="600" font-family="Pretendard,sans-serif">수술 비용·렌즈 선택·실비 적용 총정리</text>
  <rect x="390" y="210" width="300" height="4" rx="2" fill="url(#teal)"/>

