  <text x="540" y="798" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">300만+ → 보험료 4배</text>
  <text x="540" y="820" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">양안 시 합산 주의</text>

  <rect x="710" y="742" width="290" height="88" rx="12" fill="#1E293B"/>
  <text x="855" y="772" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">노인 개안 지원</text>
  <text x="855" y="798" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">60세+ 저소득 전액</text>
  <text x="855" y="820" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">단초점만 · 사전 신청</text>

  <!-- Key Insight -->
  <rect x="60" y="880" width="960" height="70" rx="14" fill="#0F766E" opacity="0.15"/>
  <rect x="60" y="880" width="960" height="70" rx="14" stroke="#0D9488" stroke-width="2" fill="none"/>
  <text x="540" y="923" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">비싼 렌즈 ≠ 좋은 렌즈 — 내 생활 패턴에 맞는 렌즈가 정답</text>

  <!-- Chips -->
