  <!-- Row 1 -->
  <rect x="60" y="345" width="460" height="145" rx="16" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="80" y="362" width="48" height="48" rx="24" fill="#0D9488"/>
  <text x="104" y="393" text-anchor="middle" fill="#FFF" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">1</text>
  <text x="145" y="383" fill="#5EEAD4" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">팬옵틱스 (알콘)</text>
