  <text x="200" y="308" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Pretendard,sans-serif">전국 평균 220만 원</text>
  <!-- price bar -->
  <rect x="380" y="265" width="620" height="8" rx="4" fill="#1E293B"/>
  <rect x="380" y="265" width="90" height="8" rx="4" fill="#22C55E"/>
  <text x="380" y="300" fill="#86EFAC" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">29만</text>
  <rect x="380" y="265" width="620" height="8" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="600" cy="269" r="6" fill="#FDE68A"/>
