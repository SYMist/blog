  <text x="790" y="458" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="600" font-family="Pretendard,sans-serif">독서·스마트폰 | 근거리 ★★★★★ 중간 ★★★★</text>

  <!-- Row 2 -->
  <rect x="60" y="510" width="300" height="145" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
