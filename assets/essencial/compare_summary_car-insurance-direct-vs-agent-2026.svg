<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="860" height="880" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <rect x="30" y="25" width="220" height="38" rx="19" fill="#EF4444"/>
  <text x="140" y="51" text-anchor="middle" fill="#FFF" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">2026 비교분석</text>
  <text x="30" y="100" fill="#FFF" font-size="28" font-weight="900" font-family="Pretendard,sans-serif">자동차보험 다이렉트 vs 설계사 한눈에 비교</text>
  <rect x="30" y="115" width="260" height="3" rx="2" fill="url(#purple)"/>

  <!-- Key Numbers: 3 cards -->
  <rect x="30" y="140" width="260" height="120" rx="16" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
  <text x="160" y="175" text-anchor="middle" fill="#A78BFA" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">다이렉트 절감폭</text>
  <text x="160" y="220" text-anchor="middle" fill="#FFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">15~20%</text>
  <text x="160" y="248" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">설계사 대비</text>

  <rect x="305" y="140" width="260" height="120" rx="16" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <text x="435" y="175" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">마일리지 최대 환급</text>
  <text x="435" y="220" text-anchor="middle" fill="#FFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">45%</text>
  <text x="435" y="248" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">3,000km 이하</text>

  <rect x="580" y="140" width="250" height="120" rx="16" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="705" y="175" text-anchor="middle" fill="#FBBF24" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">카드 캐시백</text>
  <text x="705" y="220" text-anchor="middle" fill="#FFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">최대 5만</text>
  <text x="705" y="248" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">현대카드 4~5월</text>

  <!-- Channel Comparison -->
  <text x="30" y="300" fill="#FFF" font-size="20" font-weight="900" font-family="Pretendard,sans-serif">채널별 보험료 수준 비교</text>

  <!-- 다이렉트 bar -->
  <text x="30" y="340" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">다이렉트(CM)</text>
  <rect x="180" y="326" width="300" height="24" rx="12" fill="#7C3AED"/>
  <text x="490" y="344" fill="#FFF" font-size="15" font-weight="800" font-family="Pretendard,sans-serif">최저가 (기준)</text>

  <!-- 플랫폼 bar -->
  <text x="30" y="375" fill="#86EFAC" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">플랫폼(PM)</text>
  <rect x="180" y="361" width="330" height="24" rx="12" fill="#22C55E"/>
  <text x="520" y="379" fill="#FFF" font-size="15" font-weight="800" font-family="Pretendard,sans-serif">대형사 CM+3% / 중소형사 동일</text>

  <!-- TM bar -->
  <text x="30" y="410" fill="#94A3B8" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">텔레마케팅(TM)</text>
  <rect x="180" y="396" width="380" height="24" rx="12" fill="#64748B"/>
  <text x="570" y="414" fill="#FFF" font-size="15" font-weight="800" font-family="Pretendard,sans-serif">중간 수준</text>

  <!-- 설계사 bar -->
  <text x="30" y="445" fill="#FCA5A5" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">설계사(오프라인)</text>
  <rect x="180" y="431" width="480" height="24" rx="12" fill="#EF4444"/>
  <text x="670" y="449" fill="#FFF" font-size="15" font-weight="800" font-family="Pretendard,sans-serif">CM 대비 +15~20%</text>

  <!-- 할인 특약 리스트 -->
  <text x="30" y="500" fill="#FFF" font-size="20" font-weight="900" font-family="Pretendard,sans-serif">보험료 깎는 7가지 무기</text>
  <rect x="30" y="512" width="140" height="3" rx="2" fill="url(#purple)"/>

  <!-- 할인 카드 2x3 + 1 -->
  <rect x="30" y="530" width="250" height="65" rx="12" fill="#1E293B"/>
  <text x="50" y="555" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">① 마일리지</text>
  <text x="50" y="580" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">최대 45% 환급</text>

  <rect x="300" y="530" width="250" height="65" rx="12" fill="#1E293B"/>
  <text x="320" y="555" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">② 자녀 할인</text>
  <text x="320" y="580" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">최대 19%</text>

  <rect x="570" y="530" width="260" height="65" rx="12" fill="#1E293B"/>
  <text x="590" y="555" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">③ UBI 안전운전</text>
  <text x="590" y="580" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">최대 15%</text>

  <rect x="30" y="610" width="250" height="65" rx="12" fill="#1E293B"/>
  <text x="50" y="635" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">④ 블랙박스</text>
  <text x="50" y="660" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">최대 7%</text>

  <rect x="300" y="610" width="250" height="65" rx="12" fill="#1E293B"/>
  <text x="320" y="635" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">⑤ ADAS 장치</text>
  <text x="320" y="660" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">최대 9%</text>

  <rect x="570" y="610" width="260" height="65" rx="12" fill="#1E293B"/>
  <text x="590" y="635" fill="#A78BFA" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">⑥ 전기차 전용</text>
  <text x="590" y="660" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">오프라인 대비 21%↓</text>

  <rect x="30" y="690" width="800" height="65" rx="12" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="50" y="715" fill="#FBBF24" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">⑦ 카드 프로모션</text>
  <text x="50" y="740" fill="#FFF" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">현대카드 5만 캐시백 (DB·현대해상) | 주유권 3만 | 삼성 iD VITA 보험료 10% 할인</text>

  <!-- Warning -->
  <rect x="30" y="775" width="800" height="50" rx="14" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
  <text x="50" y="807" fill="#FCA5A5" font-size="16" font-weight="800" font-family="Pretendard,sans-serif">⚠️ 2026년 보험료 3~5% 인상 전망 | 손해율 85.7% | 적자 5,000억 돌파</text>

  <!-- Footer -->
  <text x="30" y="860" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="830" y="860" text-anchor="end" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">보험 비교</text>
</svg>
