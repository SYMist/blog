<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="48" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">자차보험 할증 vs 자비수리 손익분기 비교</text>
  <text x="540" y="74" text-anchor="middle" fill="#93C5FD" font-size="14" font-family="sans-serif">2026년 5월 기준 · 연 보험료 70만원 기준 시뮬레이션</text>
  <rect x="60" y="88" width="960" height="2" rx="1" fill="#7C3AED" fill-opacity="0.5"/>

  <!-- Card 1: 자비수리 -->
  <rect x="40" y="104" width="480" height="500" rx="14" fill="url(#greenCard)" stroke="#15803D" stroke-width="2"/>
  <rect x="40" y="104" width="480" height="48" rx="14" fill="#15803D"/>
  <rect x="40" y="136" width="480" height="16" fill="#15803D"/>
  <text x="280" y="136" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">자비수리 (보험 미청구)</text>
  <text x="280" y="172" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">보험료 변동 없음 · 사고 기록 없음</text>

  <line x1="70" y1="192" x2="490" y2="192" stroke="#14532d" stroke-width="1"/>

  <text x="280" y="220" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">수리비 60만원 이하 시 유리</text>
  <text x="280" y="256" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">수리비 전액 부담</text>
  <text x="280" y="280" text-anchor="middle" fill="#4ADE80" font-size="14" font-family="sans-serif">3년 보험료 변동 없음 ✅</text>

  <line x1="70" y1="300" x2="490" y2="300" stroke="#14532d" stroke-width="1"/>

  <text x="280" y="328" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">3년 총 부담 (수리비 50만원 예시)</text>
  <text x="280" y="366" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">50만원 (수리비만)</text>

  <line x1="70" y1="386" x2="490" y2="386" stroke="#14532d" stroke-width="1"/>

  <text x="80" y="420" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 3년 보험료 인상 없음</text>
  <text x="80" y="446" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 무사고 할인 유지</text>
  <text x="80" y="472" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 사고 기록 없음 (가입 거절 위험 없음)</text>
  <text x="80" y="498" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 수리비 즉시 전액 부담</text>

  <rect x="70" y="518" width="390" height="38" rx="10" fill="#15803D" fill-opacity="0.3"/>
  <text x="265" y="543" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">수리비 60만원 이하면 자비수리 선택</text>

  <!-- Card 2: 자차보험 처리 -->
  <rect x="560" y="104" width="480" height="500" rx="14" fill="url(#purpleCard)" stroke="#7C3AED" stroke-width="2"/>
  <rect x="560" y="104" width="480" height="48" rx="14" fill="#7C3AED"/>
  <rect x="560" y="136" width="480" height="16" fill="#7C3AED"/>
  <text x="800" y="136" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">자차보험 처리</text>
  <text x="800" y="172" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">자기부담금 납부 · 3년 할증 발생</text>

  <line x1="590" y1="192" x2="1010" y2="192" stroke="#4c1d95" stroke-width="1"/>

  <text x="800" y="220" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">수리비 100만원 이상 시 유리</text>
  <text x="800" y="256" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">자기부담금 최소 20만원</text>
  <text x="800" y="280" text-anchor="middle" fill="#FCA5A5" font-size="14" font-family="sans-serif">3년간 보험료 약 42만원 추가 ⚠️</text>

  <line x1="590" y1="300" x2="1010" y2="300" stroke="#4c1d95" stroke-width="1"/>

  <text x="800" y="328" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">3년 총 부담 (수리비 50만원 예시)</text>
  <text x="800" y="366" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">62만원 (자비보다 손해)</text>

  <line x1="590" y1="386" x2="1010" y2="386" stroke="#4c1d95" stroke-width="1"/>

  <text x="600" y="420" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 대형 수리비 시 초기 비용 절감</text>
  <text x="600" y="446" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 수리비 100만원+ 시 3~4년 내 손익분기</text>
  <text x="600" y="472" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 3년간 보험료 약 +20% (할증+할인상실)</text>
  <text x="600" y="498" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 사고 이력 누적 시 가입 거절 위험</text>

  <rect x="590" y="518" width="390" height="38" rx="10" fill="#7C3AED" fill-opacity="0.3"/>
  <text x="785" y="543" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">수리비 100만원 이상이면 보험처리 선택</text>

  <text x="40" y="622" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 연 보험료 70만원 기준 시뮬레이션 · 실제 값은 계약 조건에 따라 다릅니다</text>
</svg>
