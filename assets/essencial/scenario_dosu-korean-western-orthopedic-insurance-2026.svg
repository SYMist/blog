<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">도수치료·추나요법 상황별 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#99F6E4" font-size="13" font-family="sans-serif">실손 세대·치료 빈도·예산별 5종 · 2026.05</text>

  <rect x="40" y="90" width="480" height="116" rx="10" fill="#134E4A" fill-opacity="0.6" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#0F766E"/>
  <rect x="40" y="112" width="480" height="14" fill="#0F766E"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">A. 만성 요통 + 1~2세대 실손</text>
  <text x="60" y="148" fill="#99F6E4" font-size="13" font-weight="700" font-family="sans-serif">→ 정형외과 도수치료 (연 50회·350만원·본인 0~10%)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">1세대는 30회 후 180일 면책기간 주의</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">2세대는 50회·350만원까지 자유롭게 청구</text>

  <rect x="560" y="90" width="480" height="116" rx="10" fill="#134E4A" fill-opacity="0.6" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#0F766E"/>
  <rect x="560" y="112" width="480" height="14" fill="#0F766E"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">B. 4세대 실손 + 10회 이상 필요</text>
  <text x="580" y="148" fill="#99F6E4" font-size="13" font-weight="700" font-family="sans-serif">→ 도수치료 + 추가 서류 미리 준비</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">의사소견서·검사기록지·도수치료기록지 필수</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">9회에서 멈추지 말고 50회까지 활용 가능</text>

  <rect x="40" y="226" width="480" height="116" rx="10" fill="#14532d" fill-opacity="0.6" stroke="#15803D" stroke-width="1.5"/>
