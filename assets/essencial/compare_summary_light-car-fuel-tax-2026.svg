  <rect x="385" y="820" width="310" height="80" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="540" y="855" font-family="sans-serif" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle">고속도로·공영주차장</text>
  <text x="540" y="880" font-family="sans-serif" font-size="15" fill="#1E40AF" text-anchor="middle">통행료 50% + 주차비 50% 할인</text>

  <rect x="720" y="820" width="310" height="80" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="875" y="855" font-family="sans-serif" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle">자동차세 연 ~10만 원</text>
  <text x="875" y="880" font-family="sans-serif" font-size="15" fill="#1E40AF" text-anchor="middle">쏘나타(52만)의 1/5 수준</text>

  <text x="540" y="960" font-family="sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">2026년 3월 기준 | 조세특례제한법 기반</text>
  <text x="540" y="990" font-family="sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">카드사 추가 혜택은 프로모션에 따라 변동될 수 있습니다</text>
</svg>
