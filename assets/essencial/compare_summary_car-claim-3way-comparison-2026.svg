<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="660" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">자차 · 상대 · 자비 3종 처리 비교</text>
  <text x="540" y="92" text-anchor="middle" fill="#93C5FD" font-size="16" font-family="sans-serif">사고 상황별 손익 결정 가이드 · 2026.05 기준</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">손익분기점 (연 보험료 70만원 기준)</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">자차 처리 = 자기부담금 20만 + 3년 할증 42만 = 62만원</text>

  <!-- Three cards -->
  <rect x="40" y="216" width="325" height="390" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="202" y="260" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">상대보험 처리</text>
  <text x="202" y="286" text-anchor="middle" fill="#86EFAC" font-size="13" font-family="sans-serif">상대 과실 100%</text>
  <line x1="65" y1="306" x2="345" y2="306" stroke="#14532d" stroke-width="1.5"/>
  <text x="202" y="346" text-anchor="middle" fill="#86EFAC" font-size="26" font-weight="800" font-family="sans-serif">본인 0원</text>
  <text x="202" y="376" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="sans-serif">사고 기록 없음</text>
  <line x1="65" y1="396" x2="345" y2="396" stroke="#14532d" stroke-width="1.5"/>
  <text x="75" y="428" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">✅ 부담금 0원</text>
  <text x="75" y="452" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">✅ 본인 기록 없음</text>
  <text x="75" y="476" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">✅ 할증 없음</text>
  <text x="75" y="500" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 과실 100% 상대 시</text>
  <text x="75" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 협의 2주~2개월</text>
  <rect x="65" y="546" width="280" height="44" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="205" y="572" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">BEST 선택 (피해자일 때)</text>

  <rect x="378" y="216" width="325" height="390" rx="18" fill="url(#blueGrad)" fill-opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
  <text x="540" y="260" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">자차보험 처리</text>
  <text x="540" y="286" text-anchor="middle" fill="#BFDBFE" font-size="13" font-family="sans-serif">본인 과실 · 수리비 크면</text>
  <line x1="403" y1="306" x2="683" y2="306" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="540" y="346" text-anchor="middle" fill="#BFDBFE" font-size="22" font-weight="800" font-family="sans-serif">62만원 (할증 포함)</text>
  <text x="540" y="376" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="sans-serif">3년 할증 · 사고 기록</text>
  <line x1="403" y1="396" x2="683" y2="396" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="413" y="428" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">✅ 큰 수리비 부담 ↓</text>
  <text x="413" y="452" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">✅ 환입 신청 가능</text>
  <text x="413" y="476" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 자기부담 20~50만</text>
  <text x="413" y="500" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 3년 할증 (실질 20%)</text>
  <text x="413" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 무사고 할인 상실</text>
  <rect x="403" y="546" width="280" height="44" rx="8" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="543" y="572" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700" font-family="sans-serif">수리비 &gt; 62만원 시</text>

  <rect x="716" y="216" width="325" height="390" rx="18" fill="url(#amberGrad)" fill-opacity="0.9" stroke="#D97706" stroke-width="2"/>
  <text x="878" y="260" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">자비수리</text>
  <text x="878" y="286" text-anchor="middle" fill="#FCD34D" font-size="13" font-family="sans-serif">본인 과실 · 수리비 작으면</text>
  <line x1="741" y1="306" x2="1021" y2="306" stroke="#7C2D12" stroke-width="1.5"/>
  <text x="878" y="346" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">수리비 전액</text>
  <text x="878" y="376" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="sans-serif">기록·할증 없음</text>
  <line x1="741" y1="396" x2="1021" y2="396" stroke="#7C2D12" stroke-width="1.5"/>
  <text x="751" y="428" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">✅ 본인 기록 없음</text>
  <text x="751" y="452" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">✅ 무사고 할인 유지</text>
  <text x="751" y="476" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">✅ 즉시 처리</text>
  <text x="751" y="500" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 수리비 전액 즉시</text>
  <text x="751" y="524" fill="#FFFFFF" font-size="13" font-family="sans-serif">— 손익 직접 계산 필요</text>
  <rect x="741" y="546" width="280" height="44" rx="8" fill="#D97706" fill-opacity="0.4"/>
  <text x="881" y="572" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">수리비 &lt; 62만원 시</text>

  <text x="40" y="638" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 손익분기점은 연 보험료에 따라 다름 (연 40만→44만, 연 100만→80만)</text>
</svg>
