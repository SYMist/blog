  <line x1="70" y1="596" x2="480" y2="596" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="630" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 무사고 할인 유지</text>
  <text x="80" y="658" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 사고 기록 없음</text>
  <text x="80" y="686" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 수리비 전액 즉시 부담</text>
  <line x1="70" y1="710" x2="480" y2="710" stroke="#14532d" stroke-width="1.5"/>
