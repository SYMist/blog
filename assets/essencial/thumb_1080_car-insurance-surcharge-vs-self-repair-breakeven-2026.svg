  <text x="260" y="753" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">수리비 60만원 이하 시 선택</text>
  <text x="280" y="812" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">자비 50만원 vs 보험처리 62만원</text>
  <text x="280" y="838" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 자비수리가 12만원 저렴</text>

  <rect x="560" y="434" width="480" height="510" rx="20" fill="url(#purpleGrad)" fill-opacity="0.85" stroke="#7C3AED" stroke-width="2"/>
  <text x="800" y="486" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">자차보험 처리</text>
  <text x="800" y="514" text-anchor="middle" fill="#DDD6FE" font-size="15" font-family="sans-serif">수리비 100만원 이상 시 유리</text>
  <line x1="590" y1="534" x2="1000" y2="534" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="800" y="568" text-anchor="middle" fill="#DDD6FE" font-size="28" font-weight="800" font-family="sans-serif">38만원+ 절약 가능</text>
  <line x1="590" y1="596" x2="1000" y2="596" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="600" y="630" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 자기부담금만 납부(최소 20만원)</text>
  <text x="600" y="658" fill="#4ADE80" font-size="15" font-weight="700" font-family="sans-serif">✅ 환입 제도로 기록 삭제 가능</text>
  <text x="600" y="686" fill="#94A3B8" font-size="15" font-family="sans-serif">❌ 3년 보험료 약 +42만원</text>
  <line x1="590" y1="710" x2="1000" y2="710" stroke="#4c1d95" stroke-width="1.5"/>
  <rect x="590" y="728" width="380" height="38" rx="10" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="780" y="753" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">수리비 100만원 이상 시 선택</text>
  <text x="800" y="812" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">자비 100만원 vs 보험처리 62만원</text>
  <text x="800" y="838" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 보험처리가 38만원 절약</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 연 보험료 70만원 기준 · 실제 값은 계약 조건에 따라 다릅니다</text>
</svg>
