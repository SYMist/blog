  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <circle cx="920" cy="160" r="220" fill="#7C3AED" fill-opacity="0.08"/>
  <circle cx="160" cy="920" r="180" fill="#15803D" fill-opacity="0.08"/>

  <!-- Chips -->
  <rect x="40" y="40" width="120" height="34" rx="17" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="100" y="63" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">보험 비교</text>

  <rect x="176" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="246" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="332" y="40" width="170" height="34" rx="17" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="417" y="63" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">손익분기 계산</text>

  <!-- Title -->
  <text x="540" y="188" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">자차보험 할증</text>
  <text x="540" y="244" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">vs 자비수리</text>
  <text x="540" y="292" text-anchor="middle" fill="#DDD6FE" font-size="26" font-weight="600" font-family="sans-serif">손익분기점 완전 계산 (2026)</text>

  <rect x="200" y="316" width="680" height="3" rx="1.5" fill="#7C3AED" fill-opacity="0.6"/>

