  <rect x="200" y="334" width="680" height="80" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="372" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">손익분기점 (연 70만원 기준)</text>
  <text x="540" y="402" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">수리비 62만원 → 이하 자비 / 이상 보험</text>

