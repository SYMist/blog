<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="660" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">렌터카 vs 카셰어링 항목별 비교 매트릭스</text>
  <text x="540" y="70" text-anchor="middle" fill="#93C5FD" font-size="13" font-family="sans-serif">2026년 5월 기준 · 준중형 기준</text>

  <!-- Header row -->
  <rect x="40" y="84" width="1000" height="44" rx="8" fill="#1E40AF"/>
  <text x="200" y="112" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">비교 항목</text>
  <text x="560" y="112" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">렌터카 (롯데·SK)</text>
  <text x="900" y="112" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">카셰어링 (쏘카·그린카)</text>
  <line x1="380" y1="84" x2="380" y2="128" stroke="#1e3a8a" stroke-width="1"/>
  <line x1="720" y1="84" x2="720" y2="128" stroke="#1e3a8a" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="40" y="128" width="1000" height="48" rx="0" fill="#1e293b" fill-opacity="0.7"/>
  <text x="200" y="157" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">주말 1박2일 기본 요금</text>
  <text x="560" y="157" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" font-family="sans-serif">7~12만원</text>
  <text x="900" y="157" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" font-family="sans-serif">6~10만원</text>
  <line x1="40" y1="176" x2="1040" y2="176" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="128" x2="380" y2="176" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="128" x2="720" y2="176" stroke="#334155" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="40" y="176" width="1000" height="48" rx="0" fill="#0f172a" fill-opacity="0.7"/>
  <text x="200" y="205" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">주행요금</text>
  <text x="560" y="205" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 없음 (유류비만)</text>
  <text x="900" y="205" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">❌ 150~240원/km (30km 초과)</text>
  <line x1="40" y1="224" x2="1040" y2="224" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="176" x2="380" y2="224" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="176" x2="720" y2="224" stroke="#334155" stroke-width="1"/>

  <!-- Row 3 -->
  <rect x="40" y="224" width="1000" height="48" rx="0" fill="#1e293b" fill-opacity="0.7"/>
  <text x="200" y="253" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">유류비</text>
  <text x="560" y="253" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">이용자 부담 (만차→만차)</text>
  <text x="900" y="253" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 대여료에 포함</text>
  <line x1="40" y1="272" x2="1040" y2="272" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="224" x2="380" y2="272" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="224" x2="720" y2="272" stroke="#334155" stroke-width="1"/>

  <!-- Row 4 -->
  <rect x="40" y="272" width="1000" height="48" rx="0" fill="#0f172a" fill-opacity="0.7"/>
  <text x="200" y="301" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">기본 보험</text>
  <text x="560" y="301" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 종합보험 포함</text>
  <text x="900" y="301" text-anchor="middle" fill="#FCD34D" font-size="13" font-family="sans-serif">완전자차 별도 선택 (~1만원/일)</text>
  <line x1="40" y1="320" x2="1040" y2="320" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="272" x2="380" y2="320" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="272" x2="720" y2="320" stroke="#334155" stroke-width="1"/>

  <!-- Row 5 -->
  <rect x="40" y="320" width="1000" height="48" rx="0" fill="#1e293b" fill-opacity="0.7"/>
  <text x="200" y="349" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">최소 대여 단위</text>
  <text x="560" y="349" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">보통 24시간</text>
  <text x="900" y="349" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 30분 단위</text>
  <line x1="40" y1="368" x2="1040" y2="368" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="320" x2="380" y2="368" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="320" x2="720" y2="368" stroke="#334155" stroke-width="1"/>

  <!-- Row 6 -->
  <rect x="40" y="368" width="1000" height="48" rx="0" fill="#0f172a" fill-opacity="0.7"/>
  <text x="200" y="397" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">반납 조건</text>
  <text x="560" y="397" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">픽업 지점 동일 반납</text>
  <text x="900" y="397" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">❌ 지정 쏘카존/그린카존만</text>
  <line x1="40" y1="416" x2="1040" y2="416" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="368" x2="380" y2="416" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="368" x2="720" y2="416" stroke="#334155" stroke-width="1"/>

  <!-- Row 7 -->
  <rect x="40" y="416" width="1000" height="48" rx="0" fill="#1e293b" fill-opacity="0.7"/>
  <text x="200" y="445" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">장기 한달 총비용</text>
  <text x="560" y="445" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 월 20~25만원 (월단기)</text>
  <text x="900" y="445" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">매일 이용 시 30~45만원+</text>
  <line x1="40" y1="464" x2="1040" y2="464" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="416" x2="380" y2="464" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="416" x2="720" y2="464" stroke="#334155" stroke-width="1"/>

  <!-- Row 8 -->
  <rect x="40" y="464" width="1000" height="48" rx="0" fill="#0f172a" fill-opacity="0.7"/>
  <text x="200" y="493" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">주차비</text>
  <text x="560" y="493" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">이용자 부담</text>
  <text x="900" y="493" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 쏘카존·그린카존 무료</text>
  <line x1="40" y1="512" x2="1040" y2="512" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="464" x2="380" y2="512" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="464" x2="720" y2="512" stroke="#334155" stroke-width="1"/>

  <!-- Row 9 -->
  <rect x="40" y="512" width="1000" height="48" rx="0" fill="#1e293b" fill-opacity="0.7"/>
  <text x="200" y="541" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">200km+ 장거리 주말 총비용</text>
  <text x="560" y="541" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 약 12~13만원 유리</text>
  <text x="900" y="541" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">약 13~14만원 (주행요금 누적)</text>
  <line x1="40" y1="560" x2="1040" y2="560" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="512" x2="380" y2="560" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="512" x2="720" y2="560" stroke="#334155" stroke-width="1"/>

  <rect x="40" y="560" width="1000" height="2" fill="#1E40AF" fill-opacity="0.5"/>

  <!-- Summary -->
  <text x="540" y="588" text-anchor="middle" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">손익분기점 약 200~220km | 이하→카셰어링 유리 | 이상·장기→렌터카 유리</text>

  <text x="40" y="644" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 실제 요금은 차종·시즌·조건에 따라 달라집니다</text>
</svg>
