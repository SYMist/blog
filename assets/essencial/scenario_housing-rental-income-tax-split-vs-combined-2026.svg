<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">임대 절세 상황별 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#FCD34D" font-size="13" font-family="sans-serif">임대료·다른 소득·보유 계획별 6종 · 2026.05</text>

  <!-- Scenario 1: 전업 임대인 종합 -->
  <rect x="40" y="90" width="480" height="116" rx="10" fill="#4c1d95" fill-opacity="0.6" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#7C3AED"/>
  <rect x="40" y="112" width="480" height="14" fill="#7C3AED"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 전업 임대인 (다른 소득 0) + 임대료 1,500만</text>
  <text x="60" y="148" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">→ 종합과세 + 등록임대 (누진 6% + 공제 400만)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">분리과세 77만 vs 종합과세 약 30만원 (분리 대비 47만 절감)</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">등록임대 8~10년 의무 + 5% 인상 제한 감수</text>

  <!-- Scenario 2: 근로 5천만+ -->
  <rect x="560" y="90" width="480" height="116" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="112" width="480" height="14" fill="#D97706"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 근로 5천만+ + 임대료 1,500~2,000만</text>
  <text x="580" y="148" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 분리과세 14% (누진 부담 회피)</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">종합과세 시 누진 24% 이상 적용 → 100만~180만 추가</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">근로소득자에게 가장 흔한 케이스 (직장 + 임대)</text>

  <!-- Scenario 3: 2001만+ -->
  <rect x="40" y="226" width="480" height="116" rx="10" fill="#7f1d1d" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="40" y="226" width="480" height="36" rx="10" fill="#DC2626"/>
  <rect x="40" y="248" width="480" height="14" fill="#DC2626"/>
  <text x="60" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 임대료 2,001만 이상 (분리과세 불가)</text>
  <text x="60" y="284" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">→ 종합과세 의무 + 등록임대사업자 검토</text>
  <text x="60" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">2,000만에서 2,001만 단 1원 차이로 약 184만 추가 부담 발생</text>
  <text x="60" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">2,000만 한도 직전 임대료 책정 권장 (1,990만 수준 안전)</text>

  <!-- Scenario 4: 다주택 등록임대 -->
  <rect x="560" y="226" width="480" height="116" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="226" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="248" width="480" height="14" fill="#D97706"/>
  <text x="580" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ 다주택 임대 + 장기 보유 계획</text>
  <text x="580" y="284" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 등록임대사업자 8~10년 장기 (분리 효과 극대)</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">필요경비 60% + 공제 400만 → 분리과세 약 50% 절감</text>
  <text x="580" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">5% 인상 한도 + 의무임대 위반 시 감면 추징 위험</text>

  <!-- Scenario 5: 단기 보유 + 피부양자 -->
  <rect x="40" y="362" width="1000" height="116" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="40" y="362" width="1000" height="36" rx="10" fill="#4F46E5"/>
  <rect x="40" y="384" width="1000" height="14" fill="#4F46E5"/>
  <text x="60" y="386" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 3~5년 내 매도 예정 / 배우자 피부양자 자격 유지 중</text>
  <text x="60" y="420" fill="#A5B4FC" font-size="13" font-weight="700" font-family="sans-serif">→ 미등록 + 분리과세 (의무임대 회피 + 피부양자 자격 보호)</text>
  <text x="60" y="442" fill="#CBD5E1" font-size="12" font-family="sans-serif">등록임대 의무 4~10년 묶이지 않고 단기 매도 가능</text>
  <text x="60" y="464" fill="#CBD5E1" font-size="12" font-family="sans-serif">분리과세는 종합소득과 분리되어 직장가입자 피부양자 자격 영향 비교적 작음</text>

  <!-- Summary -->
  <rect x="40" y="496" width="1000" height="176" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="528" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 결론 3줄 요약</text>
  <text x="80" y="562" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">다른 소득 3천만 이하</text>
  <text x="280" y="562" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 종합과세 유리 (누진 6~15% 저구간)</text>
  <text x="80" y="594" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">다른 소득 3천만+</text>
  <text x="280" y="594" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 분리과세 14% 유리 (누진 부담 회피, 약 36만~186만 절감)</text>
  <text x="80" y="626" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">임대료 2,001만+</text>
  <text x="280" y="626" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 종합과세 의무 (1원 차이로 약 184만 추가, 한도 관리 핵심)</text>
  <text x="80" y="654" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 홈택스 분리·종합 예상세액 비교 서비스 활용 권장 · 1억+ 임대 수입 시 세무사 상담 강력 권장</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 대출·금융 · 2026.05 기준 · 매년 5월 종합소득세 신고 기간에 선택 (그 해는 변경 불가)</text>
</svg>
