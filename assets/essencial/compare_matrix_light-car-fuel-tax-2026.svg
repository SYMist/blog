  <rect width="1080" height="1080" rx="32" fill="url(#bg2)"/>

  <text x="540" y="55" font-family="sans-serif" font-size="32" font-weight="900" fill="#111827" text-anchor="middle">1세대 1경차 자격 요건 + 환급 단가 매트릭스</text>
  <text x="540" y="90" font-family="sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">2026년 기준 | 조세특례제한법 제111조의2</text>

