  <text x="540" y="830" font-family="sans-serif" font-size="22" font-weight="900" fill="#059669" text-anchor="middle">합산 400원/L*</text>

  <rect x="720" y="755" width="290" height="80" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="865" y="783" font-family="sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="middle">롯데 경차smart</text>
  <text x="865" y="810" font-family="sans-serif" font-size="17" fill="#111827" text-anchor="middle">모든 주유소 80원/L</text>
  <text x="865" y="830" font-family="sans-serif" font-size="22" font-weight="900" fill="#059669" text-anchor="middle">합산 330원/L</text>

  <text x="540" y="895" font-family="sans-serif" font-size="15" fill="#DC2626" text-anchor="middle">*현대카드 150원/L은 현대오일뱅크·SK에너지 한정. 다른 주유소에서는 추가 할인 없음</text>

  <!-- 부정사용 경고 -->
  <rect x="40" y="930" width="1000" height="60" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="540" y="967" font-family="sans-serif" font-size="17" font-weight="700" fill="#991B1B" text-anchor="middle">부정 사용 시: 환급액 전액 환수 + 가산세 40% + 자격 정지 | 1회 48L 초과 금지</text>

  <text x="540" y="1040" font-family="sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">2026년 3월 기준 | 조세특례제한법·자동차관리법 기반</text>
