<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="680" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="52" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">2026 태아보험 vs 어린이보험 비교 요약</text>
  <text x="540" y="78" text-anchor="middle" fill="#A78BFA" font-size="15" font-family="sans-serif">가입시기 · 보장범위 · 만기 전략 — 2026.05 기준</text>
  <rect x="60" y="94" width="960" height="2" rx="1" fill="#7C3AED" fill-opacity="0.5"/>

  <!-- Col 1: 태아보험 -->
  <rect x="60" y="110" width="452" height="540" rx="14" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <rect x="60" y="110" width="452" height="52" rx="14" fill="#7C3AED"/>
  <rect x="60" y="148" width="452" height="14" fill="#7C3AED"/>
  <text x="286" y="145" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">태아보험 (어린이보험+태아특약)</text>

  <text x="286" y="200" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">가입 시기</text>
  <text x="286" y="224" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="sans-serif">임신 22주 이내</text>
  <text x="286" y="246" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">1차 기형아 검사 전후 즉시 가입 권장</text>

  <line x1="90" y1="266" x2="482" y2="266" stroke="#334155" stroke-width="1"/>

  <text x="286" y="292" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">태아 특약 (추가 가능)</text>
  <text x="110" y="316" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 선천성이상 수술·입원비</text>
  <text x="110" y="338" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 미숙아 인큐베이터 비용</text>
  <text x="110" y="360" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 주산기질환 입원비</text>
  <text x="110" y="382" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 산모 특약 (유산·조산·임신중독증)</text>

  <line x1="90" y1="404" x2="482" y2="404" stroke="#334155" stroke-width="1"/>

  <text x="286" y="430" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">보험료 (종합형 기준)</text>
  <text x="286" y="456" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">월 4만~7만원</text>
  <text x="286" y="476" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">태아특약 포함 시 약 5,000~10,000원↑</text>

  <line x1="90" y1="496" x2="482" y2="496" stroke="#334155" stroke-width="1"/>

  <text x="286" y="522" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">핵심 장점</text>
  <text x="286" y="548" text-anchor="middle" fill="#FFFFFF" font-size="14" font-family="sans-serif">선천성이상 진단 전 가입 확정</text>
  <text x="286" y="568" text-anchor="middle" fill="#FFFFFF" font-size="14" font-family="sans-serif">출생 후 건강 문제와 무관하게 보장</text>

  <rect x="90" y="618" width="392" height="18" rx="6" fill="#7C3AED" fill-opacity="0.15"/>
  <text x="286" y="632" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">22주 지나면 영구 불가 → 지금 즉시</text>

  <!-- Col 2: 어린이보험 -->
  <rect x="568" y="110" width="452" height="540" rx="14" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <rect x="568" y="110" width="452" height="52" rx="14" fill="#0F766E"/>
  <rect x="568" y="148" width="452" height="14" fill="#0F766E"/>
  <text x="794" y="145" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">어린이보험 (출생 후 단독)</text>

  <text x="794" y="200" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">가입 시기</text>
  <text x="794" y="224" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="sans-serif">출생 후 0세~ (만 15세 이하)</text>
  <text x="794" y="246" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">0세가 가장 저렴 → 빠를수록 유리</text>

  <line x1="598" y1="266" x2="990" y2="266" stroke="#334155" stroke-width="1"/>

  <text x="794" y="292" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">태아 특약 (추가 불가)</text>
  <text x="618" y="316" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 선천성이상 특약 불가</text>
  <text x="618" y="338" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 미숙아 특약 불가</text>
  <text x="618" y="360" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 산모 특약 불가</text>
  <text x="618" y="382" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 일반 어린이 보장 동일</text>

  <line x1="598" y1="404" x2="990" y2="404" stroke="#334155" stroke-width="1"/>

  <text x="794" y="430" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">보험료 (종합형 기준)</text>
  <text x="794" y="456" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">월 3만~5만원</text>
  <text x="794" y="476" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">0세 기준, 비갱신형 종합 상품</text>

  <line x1="598" y1="496" x2="990" y2="496" stroke="#334155" stroke-width="1"/>

  <text x="794" y="522" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">핵심 장점</text>
  <text x="794" y="548" text-anchor="middle" fill="#FFFFFF" font-size="14" font-family="sans-serif">보험료 상대적 저렴</text>
  <text x="794" y="568" text-anchor="middle" fill="#FFFFFF" font-size="14" font-family="sans-serif">30세 만기 + 계약전환 전략 활용 가능</text>

  <rect x="598" y="618" width="392" height="18" rx="6" fill="#0F766E" fill-opacity="0.15"/>
  <text x="794" y="632" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">출생 후 0세에 즉시 가입 → 보험료 최저</text>

  <!-- Footer -->
  <text x="60" y="666" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 보험 비교 silo · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 가입 전 약관 확인 필요</text>
</svg>
