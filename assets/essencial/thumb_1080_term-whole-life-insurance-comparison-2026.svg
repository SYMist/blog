<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="160" r="200" fill="#7C3AED" fill-opacity="0.08"/>
  <circle cx="180" cy="900" r="160" fill="#0F766E" fill-opacity="0.08"/>

  <!-- Chip: 보험 비교 -->
  <rect x="40" y="40" width="140" height="34" rx="17" fill="#7C3AED" fill-opacity="0.25" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="110" y="63" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700" font-family="sans-serif">보험 비교</text>

  <!-- Chip: 2026.05 기준 -->
  <rect x="196" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="266" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <!-- Main title -->
  <text x="540" y="200" text-anchor="middle" fill="#FFFFFF" font-size="52" font-weight="800" font-family="sans-serif">종신보험 vs 정기보험</text>
  <text x="540" y="264" text-anchor="middle" fill="#A78BFA" font-size="28" font-weight="600" font-family="sans-serif">50대 실질 보장 비교</text>

  <!-- Divider -->
  <rect x="240" y="290" width="600" height="3" rx="1.5" fill="#7C3AED" fill-opacity="0.5"/>

  <!-- Two cards side by side -->
  <!-- 종신보험 card -->
  <rect x="40" y="320" width="480" height="520" rx="20" fill="url(#purpleGrad)" fill-opacity="0.85" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="380" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">종신보험</text>
  <text x="280" y="414" text-anchor="middle" fill="#C4B5FD" font-size="16" font-family="sans-serif">평생 보장 · 해약환급금 있음</text>

  <line x1="80" y1="436" x2="480" y2="436" stroke="#4C1D95" stroke-width="1.5"/>

  <text x="280" y="490" text-anchor="middle" fill="#E9D5FF" font-size="17" font-weight="600" font-family="sans-serif">월 보험료 (50세 남성, 1억원)</text>
  <text x="280" y="548" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">12만~18만원</text>
  <text x="280" y="580" text-anchor="middle" fill="#FCA5A5" font-size="16" font-family="sans-serif">정기보험의 2~3배</text>

  <line x1="80" y1="606" x2="480" y2="606" stroke="#4C1D95" stroke-width="1.5"/>

  <text x="80" y="648" fill="#4ADE80" font-size="16" font-weight="700" font-family="sans-serif">✅ 사망 시점 불문 평생 보장</text>
  <text x="80" y="678" fill="#4ADE80" font-size="16" font-weight="700" font-family="sans-serif">✅ 해약환급금 60~100%</text>
  <text x="80" y="708" fill="#94A3B8" font-size="16" font-family="sans-serif">❌ 보험료 부담 큼</text>

  <rect x="80" y="756" width="380" height="38" rx="10" fill="#7C3AED" fill-opacity="0.3"/>
  <text x="270" y="781" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700" font-family="sans-serif">상속·장례비 목적 → 소액 3천만원</text>

  <!-- 정기보험 card -->
  <rect x="560" y="320" width="480" height="520" rx="20" fill="url(#tealGrad)" fill-opacity="0.85" stroke="#0F766E" stroke-width="2"/>
  <text x="800" y="380" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">정기보험</text>
  <text x="800" y="414" text-anchor="middle" fill="#6EE7B7" font-size="16" font-family="sans-serif">기간 보장 · 보험료 저렴</text>

  <line x1="600" y1="436" x2="1000" y2="436" stroke="#134e4a" stroke-width="1.5"/>

  <text x="800" y="490" text-anchor="middle" fill="#A7F3D0" font-size="17" font-weight="600" font-family="sans-serif">월 보험료 (50세 남성, 1억원)</text>
  <text x="800" y="548" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">4만~7만원</text>
  <text x="800" y="580" text-anchor="middle" fill="#4ADE80" font-size="16" font-family="sans-serif">종신보험의 1/3 수준 🏆</text>

  <line x1="600" y1="606" x2="1000" y2="606" stroke="#134e4a" stroke-width="1.5"/>

  <text x="600" y="648" fill="#4ADE80" font-size="16" font-weight="700" font-family="sans-serif">✅ 보험료 최소화</text>
  <text x="600" y="678" fill="#4ADE80" font-size="16" font-weight="700" font-family="sans-serif">✅ 단순 구조 (기간+금액만 설정)</text>
  <text x="600" y="708" fill="#94A3B8" font-size="16" font-family="sans-serif">❌ 만기 후 보장 소멸</text>

  <rect x="600" y="756" width="380" height="38" rx="10" fill="#0F766E" fill-opacity="0.3"/>
  <text x="790" y="781" text-anchor="middle" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">자녀 독립 시점까지 기간 설정 권장</text>

  <!-- Bottom summary -->
  <rect x="40" y="876" width="1000" height="70" rx="14" fill="#1e293b" fill-opacity="0.9"/>
  <text x="540" y="910" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700" font-family="sans-serif">50대 복합 전략: 종신 3천만(장례비) + 정기 7천만(생활비) 조합 시 보험료 30~50% 절감</text>
  <text x="540" y="934" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">개인 상황에 따라 다를 수 있으며, 가입 전 약관 확인 필요</text>

  <!-- Footer -->
  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준</text>
</svg>
