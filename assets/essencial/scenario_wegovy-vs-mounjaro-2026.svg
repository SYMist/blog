<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg3)" rx="24"/>

  <!-- Badge -->
  <rect x="40" y="40" width="160" height="44" rx="22" fill="#EF4444"/>
  <text x="120" y="68" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="700">선택 가이드</text>

  <!-- Title -->
  <text x="540" y="140" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="800">내 상황에 맞는 선택은?</text>
  <text x="540" y="185" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="24">위고비 vs 마운자로 시나리오별 추천</text>

  <!-- Divider -->
  <line x1="200" y1="220" x2="880" y2="220" stroke="#99F6E4" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Scenario 1 -->
  <rect x="60" y="260" width="960" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#A7F3D0" stroke-opacity="0.3"/>
  <rect x="80" y="278" width="40" height="40" rx="20" fill="#A7F3D0"/>
  <text x="100" y="305" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="22" font-weight="800">1</text>
  <text x="140" y="300" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700">초기 비용 부담을 낮추고 싶다면</text>
  <rect x="140" y="320" width="100" height="32" rx="16" fill="#0D9488"/>
  <text x="190" y="342" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">위고비</text>
  <text x="260" y="342" fill="#E2E8F0" font-family="sans-serif" font-size="18">초기 4개월 월 22만~30만 원 · 가격 인하로 마운자로 대비 월 5만~25만 원 절감</text>

  <!-- Scenario 2 -->
  <rect x="60" y="410" width="960" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#A7F3D0" stroke-opacity="0.3"/>
  <rect x="80" y="428" width="40" height="40" rx="20" fill="#A7F3D0"/>
  <text x="100" y="455" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="22" font-weight="800">2</text>
  <text x="140" y="450" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700">고도비만(BMI 35+) + 단기 집중 감량 목표</text>
  <rect x="140" y="470" width="120" height="32" rx="16" fill="#7C3AED"/>
  <text x="200" y="492" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">마운자로</text>
  <text x="280" y="492" fill="#E2E8F0" font-family="sans-serif" font-size="18">평균 22.5% 감량 · 비만 수술급 효과 · 치료 기간 단축 가능</text>

  <!-- Scenario 3 -->
  <rect x="60" y="560" width="960" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#A7F3D0" stroke-opacity="0.3"/>
  <rect x="80" y="578" width="40" height="40" rx="20" fill="#A7F3D0"/>
  <text x="100" y="605" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="22" font-weight="800">3</text>
  <text x="140" y="600" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700">제2형 당뇨 동반 + 보험 혜택 기대</text>
  <rect x="140" y="620" width="120" height="32" rx="16" fill="#7C3AED"/>
  <text x="200" y="642" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">마운자로</text>
  <text x="280" y="642" fill="#E2E8F0" font-family="sans-serif" font-size="18">2026년 상반기 당뇨 치료 급여 등재 예정 → 보험 적용 가능성</text>

  <!-- Scenario 4 -->
  <rect x="60" y="710" width="960" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#A7F3D0" stroke-opacity="0.3"/>
  <rect x="80" y="728" width="40" height="40" rx="20" fill="#A7F3D0"/>
  <text x="100" y="755" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="22" font-weight="800">4</text>
  <text x="140" y="750" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700">심혈관 고위험군 + 장기 복용 계획</text>
  <rect x="140" y="770" width="100" height="32" rx="16" fill="#0D9488"/>
  <text x="190" y="792" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">위고비</text>
  <text x="260" y="792" fill="#E2E8F0" font-family="sans-serif" font-size="18">SELECT 임상 — 심혈관 사건 위험 20% 감소 데이터 보유</text>

  <!-- Bottom note -->
  <rect x="240" y="890" width="600" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="540" y="925" text-anchor="middle" fill="#FEF3C7" font-family="sans-serif" font-size="20" font-weight="600">반드시 비만 전문의 상담 후 처방받으세요</text>

  <!-- Chips -->
  <rect x="300" y="975" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="350" y="999" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="700">비교</text>
  <rect x="420" y="975" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="470" y="999" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="700">추천</text>
  <rect x="540" y="975" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="590" y="999" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="700">비용</text>
  <rect x="660" y="975" width="120" height="36" rx="18" fill="#FEF3C7"/>
  <text x="720" y="999" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="700">보험적용</text>

  <!-- Watermark -->
  <text x="540" y="1050" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.4" font-family="sans-serif" font-size="16">essencial</text>
</svg>
