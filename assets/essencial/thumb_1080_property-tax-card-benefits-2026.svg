<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <rect x="60" y="60" width="360" height="44" rx="22" fill="#B45309"/>
  <text x="240" y="90" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">2026 재산세 7월 · 카드 납부</text>

  <text x="60" y="200" fill="#FFFFFF" font-size="70" font-weight="800" font-family="sans-serif">재산세 카드</text>
  <text x="60" y="280" fill="#FCD34D" font-size="62" font-weight="800" font-family="sans-serif">캐시백 2%</text>
  <text x="60" y="340" fill="#FFFFFF" font-size="36" font-weight="600" font-family="sans-serif">수수료 0원 · 9대 카드사 비교</text>

  <!-- 3 key cards stacked -->
  <rect x="60" y="400" width="960" height="180" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="90" y="445" fill="#86EFAC" font-size="17" font-weight="700" font-family="sans-serif">최고 캐시백</text>
  <text x="90" y="510" fill="#FFFFFF" font-size="50" font-weight="800" font-family="sans-serif">롯데 LOCA Pro 2%</text>
  <text x="990" y="445" text-anchor="end" fill="#86EFAC" font-size="16" font-weight="600" font-family="sans-serif">분할 기능</text>
  <text x="990" y="510" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">40만 → 8,000원</text>
  <text x="90" y="555" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">국세·지방세 공통 적용</text>

  <rect x="60" y="600" width="960" height="180" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="90" y="645" fill="#86EFAC" font-size="17" font-weight="700" font-family="sans-serif">소액 최고 효율</text>
  <text x="90" y="710" fill="#FFFFFF" font-size="50" font-weight="800" font-family="sans-serif">KB 7,000원 정액</text>
  <text x="990" y="645" text-anchor="end" fill="#86EFAC" font-size="16" font-weight="600" font-family="sans-serif">실효 4.67%</text>
  <text x="990" y="710" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">직장인보너스 체크</text>
  <text x="90" y="755" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">15만 원 일시 납부 최적</text>

  <rect x="60" y="800" width="960" height="180" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="90" y="845" fill="#FCD34D" font-size="17" font-weight="700" font-family="sans-serif">무이자 할부 (고액)</text>
  <text x="90" y="910" fill="#FFFFFF" font-size="50" font-weight="800" font-family="sans-serif">2 ~ 12개월</text>
  <text x="990" y="845" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="600" font-family="sans-serif">신한 슬림 12개월</text>
  <text x="990" y="910" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">NH·하나 7개월</text>
  <text x="90" y="955" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">200만 납부 시 약 2.5만 절약</text>

  <text x="60" y="1040" fill="#64748B" font-size="15" font-family="sans-serif">essencial | 대출·금융 silo · 2026.04 기준</text>
</svg>
