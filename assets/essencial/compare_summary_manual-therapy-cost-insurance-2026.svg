<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <rect x="60" y="50" width="240" height="40" rx="20" fill="#0F766E"/>
  <text x="180" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">2026 실손·관리급여 대개편</text>

  <text x="60" y="155" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">도수치료 비용·실비 총정리</text>
  <text x="60" y="200" fill="#5EEAD4" font-size="22" font-weight="600" font-family="sans-serif">세대별 자기부담·횟수·관리급여 95% 한눈에</text>

  <!-- 4 key cards -->
  <rect x="60" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="190" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">전국 평균 비용</text>
  <text x="190" y="340" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">7.6만 원</text>
  <text x="190" y="370" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="600" font-family="sans-serif">전년 +1.6%</text>
  <text x="190" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">심평원 2026 공시</text>

  <rect x="340" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="470" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">병원별 가격 편차</text>
  <text x="470" y="340" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">2,000배</text>
  <text x="470" y="370" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="600" font-family="sans-serif">300원 ~ 60만 원</text>
  <text x="470" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">서울 평균 12.8만</text>

  <rect x="620" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="750" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">5세대 비중증 자부담</text>
  <text x="750" y="340" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">50%</text>
  <text x="750" y="370" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="600" font-family="sans-serif">연 1,000만 한도</text>
  <text x="750" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">도수치료 원칙 제외</text>

  <rect x="900" y="240" width="240" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="1020" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">관리급여 본인부담</text>
  <text x="1020" y="340" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">95%</text>
  <text x="1020" y="370" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="600" font-family="sans-serif">공단 5%·환자 95%</text>
  <text x="1020" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">2026.02.19 시행</text>

  <!-- 종별 평균 비용 막대 차트 -->
  <text x="60" y="475" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">의료기관 종별 평균 도수치료 비용 (2026)</text>
  <text x="60" y="503" fill="#94A3B8" font-size="14" font-family="sans-serif">회당 기준 · 심평원 비급여 공시 · 종합병원 상승률 +6.2%로 가장 가파름</text>

  <g font-family="sans-serif">
    <text x="60" y="545" fill="#FFFFFF" font-size="16" font-weight="700">의원</text>
    <rect x="200" y="528" width="296" height="22" rx="4" fill="#5EEAD4"/>
    <text x="516" y="545" fill="#5EEAD4" font-size="15" font-weight="700">74,000원</text>

    <text x="60" y="585" fill="#FFFFFF" font-size="16" font-weight="700">병원</text>
    <rect x="200" y="568" width="312" height="22" rx="4" fill="#2DD4BF"/>
    <text x="532" y="585" fill="#5EEAD4" font-size="15" font-weight="700">78,000원</text>

    <text x="60" y="625" fill="#FFFFFF" font-size="16" font-weight="700">한방병원</text>
    <rect x="200" y="608" width="320" height="22" rx="4" fill="#14B8A6"/>
    <text x="540" y="625" fill="#5EEAD4" font-size="15" font-weight="700">80,000원</text>

    <text x="60" y="665" fill="#FFFFFF" font-size="16" font-weight="700">종합병원</text>
    <rect x="200" y="648" width="352" height="22" rx="4" fill="#0F766E"/>
    <text x="572" y="665" fill="#FCD34D" font-size="15" font-weight="700">88,000원 (+6.2%)</text>

    <text x="60" y="705" fill="#FFFFFF" font-size="16" font-weight="700">상급종합</text>
    <rect x="200" y="688" width="524" height="22" rx="4" fill="#064E3B"/>
    <text x="744" y="705" fill="#FCA5A5" font-size="15" font-weight="700">131,000원</text>

    <text x="60" y="745" fill="#FCD34D" font-size="14" font-weight="700">※ 상급종합은 의원 대비 약 1.8배 — 급성기 아니면 2차 병원·의원 권장</text>
  </g>

  <!-- 실손 세대별 비교 카드 -->
  <rect x="60" y="780" width="540" height="320" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="80" y="820" fill="#5EEAD4" font-size="22" font-weight="800" font-family="sans-serif">1~2세대 실손 (유지 유리)</text>

  <g font-family="sans-serif">
    <text x="80" y="860" fill="#CBD5E1" font-size="14">자기부담금</text>
    <text x="580" y="860" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">0~5,000원 / 10~20%</text>

    <text x="80" y="890" fill="#CBD5E1" font-size="14">횟수 한도</text>
    <text x="580" y="890" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">약관상 제한 거의 없음</text>

    <text x="80" y="920" fill="#CBD5E1" font-size="14">차등제</text>
    <text x="580" y="920" text-anchor="end" fill="#2DD4BF" font-size="15" font-weight="700">미적용</text>

    <text x="80" y="950" fill="#CBD5E1" font-size="14">관리급여 효과</text>
    <text x="580" y="950" text-anchor="end" fill="#2DD4BF" font-size="14">단가↓ + 급여 보장 → 실부담 감소</text>

    <text x="80" y="985" fill="#CBD5E1" font-size="14">핵심 한계</text>
    <text x="580" y="985" text-anchor="end" fill="#FCA5A5" font-size="14">보험료 인상·재가입 불가</text>
  </g>
  <text x="80" y="1060" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">✓ 만성 척추질환·고령 가입자는 유지 1순위</text>

  <rect x="620" y="780" width="520" height="320" rx="16" fill="url(#card)" stroke="#14B8A6" stroke-width="2"/>
  <text x="640" y="820" fill="#14B8A6" font-size="22" font-weight="800" font-family="sans-serif">4~5세대 실손 (신규 가입군)</text>

  <g font-family="sans-serif">
    <text x="640" y="860" fill="#CBD5E1" font-size="14">자기부담금</text>
    <text x="1120" y="860" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">30% → 50% (4→5세대)</text>

    <text x="640" y="890" fill="#CBD5E1" font-size="14">횟수·한도</text>
    <text x="1120" y="890" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">연 50회·350만 → 연 1,000만</text>

    <text x="640" y="920" fill="#CBD5E1" font-size="14">차등제</text>
    <text x="1120" y="920" text-anchor="end" fill="#FCA5A5" font-size="15" font-weight="700">최대 300% 할증</text>

    <text x="640" y="950" fill="#CBD5E1" font-size="14">도수치료 보장</text>
    <text x="1120" y="950" text-anchor="end" fill="#FCA5A5" font-size="14">원칙적 제외(5세대)</text>

    <text x="640" y="985" fill="#CBD5E1" font-size="14">관리급여 중첩</text>
    <text x="1120" y="985" text-anchor="end" fill="#FCA5A5" font-size="14">95% + 자부담 50% 이중 부담</text>
  </g>
  <text x="640" y="1060" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">✓ 연 100만 원 이하 청구로 할인 등급 유지</text>

  <!-- 5세대 핵심 -->
  <rect x="60" y="1130" width="1080" height="230" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="80" y="1170" fill="#5EEAD4" font-size="22" font-weight="800" font-family="sans-serif">5세대 실손 (2026.04~) 핵심 변화</text>

  <g font-family="sans-serif">
    <text x="80" y="1215" fill="#FFFFFF" font-size="16" font-weight="700">비중증 자기부담</text>
    <text x="570" y="1215" text-anchor="end" fill="#F87171" font-size="18" font-weight="800">30% → 50%</text>

    <text x="80" y="1250" fill="#FFFFFF" font-size="16" font-weight="700">연간 비중증 보상 한도</text>
    <text x="570" y="1250" text-anchor="end" fill="#FCD34D" font-size="18" font-weight="800">5,000만 → 1,000만</text>

    <text x="600" y="1215" fill="#FFFFFF" font-size="16" font-weight="700">통원 일당 / 입원 회당</text>
    <text x="1120" y="1215" text-anchor="end" fill="#2DD4BF" font-size="16" font-weight="800">20만 / 300만 한도</text>

    <text x="600" y="1250" fill="#FFFFFF" font-size="16" font-weight="700">도수치료 보장</text>
    <text x="1120" y="1250" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="800">원칙적 제외</text>

    <text x="80" y="1295" fill="#FFFFFF" font-size="16" font-weight="700">재가입 주기</text>
    <text x="570" y="1295" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="800">15년 → 3년 단축</text>

    <text x="600" y="1295" fill="#FFFFFF" font-size="16" font-weight="700">무청구 할인</text>
    <text x="1120" y="1295" text-anchor="end" fill="#2DD4BF" font-size="16" font-weight="800">약 5%</text>

    <text x="80" y="1340" fill="#FCD34D" font-size="14" font-weight="700">→ 치료 목적·호전도 기록(ROM·VAS)이 실비 청구 성공의 핵심</text>
  </g>

  <text x="60" y="1420" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 건강·의료 silo · 자료: 심평원·복지부·금융위·금감원 (2026.04 기준)</text>
</svg>
