      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#tbg)"/>

  <!-- 배지 -->
  <rect x="390" y="200" width="300" height="52" rx="26" fill="#EF4444"/>
