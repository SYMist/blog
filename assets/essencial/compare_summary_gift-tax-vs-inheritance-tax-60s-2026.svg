<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">증여세 vs 상속세 부모 60대 비교</text>
  <text x="540" y="92" text-anchor="middle" fill="#FCD34D" font-size="16" font-family="sans-serif">자녀 2명 균등 분배 · 자산 규모별 시뮬레이션 · 2026.05</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">손익분기점 (자녀 2명 기준)</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">자산 약 20억원 · 이하 상속 / 이상 사전 증여</text>

  <!-- Two cards -->
  <rect x="40" y="216" width="495" height="370" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="288" y="262" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">상속 (10억 이하 유리)</text>
  <text x="288" y="290" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">일괄공제 5억원 활용</text>
  <line x1="70" y1="312" x2="505" y2="312" stroke="#14532d" stroke-width="1.5"/>
  <text x="288" y="354" text-anchor="middle" fill="#86EFAC" font-size="32" font-weight="800" font-family="sans-serif">10억 → 9,000만원</text>
  <text x="288" y="384" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">5억 → 0원 (전액 비과세)</text>
  <line x1="70" y1="406" x2="505" y2="406" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="438" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 일괄공제 5억 (자녀 수 무관)</text>
  <text x="80" y="464" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 배우자공제 5억~30억 추가</text>
  <text x="80" y="490" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 자녀공제 5억 개정안 검토 중</text>
  <text x="80" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 부모 사망 시점에 일괄 처리</text>
  <rect x="80" y="538" width="416" height="32" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="288" y="560" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">자산 10억 이하·자녀 자금 여유면 선택</text>

  <rect x="545" y="216" width="495" height="370" rx="18" fill="url(#purpleGrad)" fill-opacity="0.9" stroke="#7C3AED" stroke-width="2"/>
  <text x="793" y="262" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">사전 증여 (30억+ 유리)</text>
  <text x="793" y="290" text-anchor="middle" fill="#DDD6FE" font-size="15" font-family="sans-serif">10년 누계 + 자산 증가분 분리</text>
  <line x1="575" y1="312" x2="1010" y2="312" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="793" y="354" text-anchor="middle" fill="#DDD6FE" font-size="30" font-weight="800" font-family="sans-serif">50억 → 16.4억</text>
  <text x="793" y="384" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">상속 17.9억 대비 1.5억 절감</text>
  <line x1="575" y1="406" x2="1010" y2="406" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="585" y="438" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">✅ 10년 누계 공제 4회 활용</text>
  <text x="585" y="464" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">✅ 증가분 자녀 자산 → 상속 제외</text>
  <text x="585" y="490" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 사망 10년 이내 증여 합산</text>
  <text x="585" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 60대 일찍 시작 필수</text>
  <rect x="585" y="538" width="416" height="32" rx="8" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="793" y="560" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">자산 30억+·자녀 자금 필요면 선택</text>

  <text x="40" y="618" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 대출·금융 · 2026.05 기준 · 자녀공제 5억 개정안 시행 시 상속 매력 더 커짐</text>
</svg>
