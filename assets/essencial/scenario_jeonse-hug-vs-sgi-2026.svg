<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 950">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="860" height="950" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <text x="30" y="48" fill="#FFF" font-size="26" font-weight="900" font-family="Pretendard,sans-serif">상황별 전세보증보험 추천 가이드</text>
  <rect x="30" y="60" width="220" height="3" rx="2" fill="url(#amber)"/>

  <!-- Scenario 1 -->
  <rect x="30" y="85" width="800" height="110" rx="14" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
  <rect x="45" y="100" width="36" height="36" rx="18" fill="#D97706"/>
  <text x="63" y="125" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">1</text>
  <text x="100" y="120" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">아파트, 보증금 5억, 서울</text>
  <rect x="440" y="103" width="70" height="26" rx="13" fill="#D97706"/>
  <text x="475" y="122" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">HUG</text>
  <text x="100" y="150" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">7억 이하 + 보증료 저렴 → 연 약 57~64만 원</text>
  <text x="100" y="175" fill="#FBBF24" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">💡 SGI 대비 연 32~39만 원 절약</text>

  <!-- Scenario 2 -->
  <rect x="30" y="210" width="800" height="110" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="45" y="225" width="36" height="36" rx="18" fill="#22C55E"/>
  <text x="63" y="250" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">2</text>
  <text x="100" y="245" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">아파트, 보증금 10억, 강남</text>
  <rect x="460" y="228" width="70" height="26" rx="13" fill="#22C55E"/>
  <text x="495" y="247" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">SGI</text>
  <text x="100" y="275" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">HUG 7억 한도 초과 → SGI가 유일한 대안</text>
  <text x="100" y="300" fill="#86EFAC" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">💡 LTV 70% 이하 선택 시 연 약 154만 원</text>

  <!-- Scenario 3 -->
  <rect x="30" y="335" width="800" height="110" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="45" y="350" width="36" height="36" rx="18" fill="#22C55E"/>
  <text x="63" y="375" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">3</text>
  <text x="100" y="370" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">신축 빌라, 공시가 대비 전세가 높음</text>
  <rect x="530" y="353" width="70" height="26" rx="13" fill="#22C55E"/>
  <text x="565" y="372" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">SGI</text>
  <text x="100" y="400" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">HUG 126% 룰 미충족 → SGI가 KB시세 기준으로 유연하게 적용</text>
  <text x="100" y="425" fill="#FCA5A5" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">⚠️ 전세가율 90% 초과 시 보증료 10% 할증 주의</text>

  <!-- Scenario 4 -->
  <rect x="30" y="460" width="800" height="110" rx="14" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
  <rect x="45" y="475" width="36" height="36" rx="18" fill="#D97706"/>
  <text x="63" y="500" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">4</text>
  <text x="100" y="495" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">청년(만 28세), 보증금 2억, 소득 4천만</text>
  <rect x="550" y="478" width="160" height="26" rx="13" fill="#D97706"/>
  <text x="630" y="497" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">HUG + 보증료 지원</text>
  <text x="100" y="525" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">보증료 연 23~26만 원 + 지자체 전액 환급 (최대 40만 원)</text>
  <text x="100" y="550" fill="#FBBF24" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">💡 실질 보증료 부담 0원 가능!</text>

  <!-- Scenario 5 -->
  <rect x="30" y="585" width="800" height="110" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="45" y="600" width="36" height="36" rx="18" fill="#22C55E"/>
  <text x="63" y="625" text-anchor="middle" fill="#FFF" font-size="18" font-weight="900" font-family="Pretendard,sans-serif">5</text>
  <text x="100" y="620" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">법인 임대인 소유 주택</text>
  <rect x="380" y="603" width="70" height="26" rx="13" fill="#22C55E"/>
  <text x="415" y="622" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">SGI</text>
  <text x="100" y="650" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">법인 임대인 대응 가능 + 전세권 설정 시 가입</text>
  <text x="100" y="675" fill="#86EFAC" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">💡 법인 보증료 아파트 0.240%, 기타 0.273%</text>

  <!-- Decision Checklist -->
  <rect x="30" y="715" width="800" height="200" rx="14" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="50" y="748" fill="#FBBF24" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">✅ 의사결정 체크리스트</text>

  <text x="50" y="782" fill="#E2E8F0" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">□ 보증금이 수도권 7억 / 지방 5억 이하인가?</text>
  <text x="650" y="782" fill="#FBBF24" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">YES → HUG 우선</text>

  <text x="50" y="812" fill="#E2E8F0" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">□ 전세금이 공시가격 × 1.26 이내인가?</text>
  <text x="650" y="812" fill="#FBBF24" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">YES → HUG 가능</text>

  <text x="50" y="842" fill="#E2E8F0" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">□ 보증금 3억 이하 + 소득 기준 충족?</text>
  <text x="650" y="842" fill="#86EFAC" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">보증료 지원 신청</text>

  <text x="50" y="872" fill="#E2E8F0" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">□ 위 조건 하나라도 NO?</text>
  <text x="650" y="872" fill="#86EFAC" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">SGI 검토</text>

  <text x="50" y="902" fill="#E2E8F0" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">□ 등기부 깨끗 + 계약서 특약 4가지 삽입?</text>
  <text x="650" y="902" fill="#FCA5A5" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">필수 확인!</text>

  <!-- Footer -->
  <text x="30" y="940" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="830" y="940" text-anchor="end" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">대출·금융 비교</text>
</svg>
