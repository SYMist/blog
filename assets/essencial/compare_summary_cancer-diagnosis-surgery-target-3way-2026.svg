<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="660" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">암진단비 · 암수술비 · 표적치료비 3종 비교</text>
  <text x="540" y="92" text-anchor="middle" fill="#DDD6FE" font-size="16" font-family="sans-serif">진단비 5천만·수술비 회당 300만·표적치료비 연 3천만 가입 기준 · 2026.05</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">암종별 총 보장 시뮬레이션</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">갑상선암 1,060만 vs 폐암 4기 9,600만 · 격차 9배</text>

  <!-- 3 cards horizontal -->
  <rect x="40" y="216" width="325" height="390" rx="18" fill="url(#purpleGrad)" fill-opacity="0.9" stroke="#7C3AED" stroke-width="2"/>
  <text x="202" y="262" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">⭐ 진단비 (1순위)</text>
  <text x="202" y="288" text-anchor="middle" fill="#DDD6FE" font-size="13" font-family="sans-serif">확진 시 일시금 지급</text>
  <line x1="65" y1="308" x2="345" y2="308" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="202" y="348" text-anchor="middle" fill="#DDD6FE" font-size="26" font-weight="800" font-family="sans-serif">5,000만원</text>
  <text x="202" y="378" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">최초 1회 (소멸)</text>
  <line x1="65" y1="398" x2="345" y2="398" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="75" y="428" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 초기 충격·생활비</text>
  <text x="75" y="452" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 자녀 양육비 충당</text>
  <text x="75" y="476" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 유사암 10~20%만</text>
