<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">4세대 실손 전환 후 도수치료·MRI 보장 변화</text>
  <text x="540" y="92" text-anchor="middle" fill="#DDD6FE" font-size="16" font-family="sans-serif">2026.05.06 4세대 신규 종료 + 5세대 출시 (도수치료 제외) · 2026.05</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">도수치료 회당 12만·연 24회 사용 자기부담</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">1세대 0원 vs 5세대 288만원 · 격차 288만</text>

  <!-- Two cards -->
  <rect x="40" y="216" width="495" height="370" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="288" y="262" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">유지 (1·2·3·4세대)</text>
  <text x="288" y="290" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">도수치료·MRI 보장 유지</text>
  <line x1="70" y1="312" x2="505" y2="312" stroke="#14532d" stroke-width="1.5"/>
  <text x="288" y="354" text-anchor="middle" fill="#86EFAC" font-size="26" font-weight="800" font-family="sans-serif">자기부담 0~30%</text>
  <text x="288" y="384" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="sans-serif">도수치료 보장 + 한도 350만/연</text>
  <line x1="70" y1="406" x2="505" y2="406" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="438" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 1세대 자부담 0~10% (최강)</text>
  <text x="80" y="464" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 3·4세대 30% + 한도 보장</text>
  <text x="80" y="490" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ MRI 21만원 (70만 시 자기부담)</text>
  <text x="80" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 4세대는 사용량 할증 주의</text>
  <rect x="80" y="538" width="416" height="32" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="288" y="560" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">도수치료·MRI 사용자는 유지 권장</text>

  <rect x="545" y="216" width="495" height="370" rx="18" fill="url(#redGrad)" fill-opacity="0.9" stroke="#DC2626" stroke-width="2"/>
  <text x="793" y="262" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">5세대 전환 (도수치료 X)</text>
  <text x="793" y="290" text-anchor="middle" fill="#FCA5A5" font-size="15" font-family="sans-serif">비중증 비급여 보장 제외</text>
  <line x1="575" y1="312" x2="1010" y2="312" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="793" y="354" text-anchor="middle" fill="#FCA5A5" font-size="26" font-weight="800" font-family="sans-serif">도수치료 100% 자비</text>
  <text x="793" y="384" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="sans-serif">연 24회 = 약 288만원</text>
  <line x1="575" y1="406" x2="1010" y2="406" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="585" y="438" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">❌ 도수치료 0% 보장</text>
  <text x="585" y="464" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">❌ MRI 비중증 100% 자비</text>
  <text x="585" y="490" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">✅ 월 보험료 약 25% 절감</text>
  <text x="585" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 4세대→5세대 5년 940만 추가 가능</text>
  <rect x="585" y="538" width="416" height="32" rx="8" fill="#DC2626" fill-opacity="0.4"/>
  <text x="793" y="560" text-anchor="middle" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">도수치료 자주 사용자는 절대 금지</text>

  <text x="40" y="618" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 4세대 신규 가입 종료(05.06) · 본인 약관은 보험사·금감원(1332) 확인</text>
</svg>
