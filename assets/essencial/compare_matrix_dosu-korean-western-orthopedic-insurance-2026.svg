  <text x="410" y="434" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">보장 ✅</text>
  <text x="660" y="434" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">자동 보장 ✅</text>
