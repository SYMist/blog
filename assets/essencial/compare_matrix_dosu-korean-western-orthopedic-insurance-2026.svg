  <text x="660" y="538" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">불필요</text>
  <text x="920" y="538" text-anchor="middle" fill="#94A3B8" font-size="14" font-weight="700" font-family="sans-serif">N/A</text>

  <rect x="40" y="568" width="1000" height="104" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="594" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">의사결정 핵심 변수 4가지</text>
  <text x="60" y="618" fill="#CBD5E1" font-size="12" font-family="sans-serif">① 실손 세대: 1~4세대 도수치료 보장 / 5세대는 한방 추나요법으로 대체</text>
  <text x="60" y="638" fill="#CBD5E1" font-size="12" font-family="sans-serif">② 치료 빈도: 연 20회 이하면 추나요법 충분 / 50회 가까이면 도수치료 활용</text>
  <text x="60" y="658" fill="#CBD5E1" font-size="12" font-family="sans-serif">③ 2026.07 관리급여 전환 / ④ 4세대 10회 이상 서류 미리 준비</text>

  <text x="40" y="708" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 2026.05 기준 · 보험사·약관별 차이 있음 · 추나요법은 의원/병원/종합병원 본인부담률 다름</text>
