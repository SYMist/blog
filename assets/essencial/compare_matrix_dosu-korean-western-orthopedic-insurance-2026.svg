  <rect width="1080" height="720" fill="url(#bg)"/>

  <text x="540" y="48" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">도수치료 3종 비용·보험·연 한도 매트릭스</text>
  <text x="540" y="74" text-anchor="middle" fill="#99F6E4" font-size="14" font-family="sans-serif">정형외과·한방 추나요법·한방 비급여 약침 · 2026.05 기준</text>

  <rect x="40" y="96" width="1000" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
