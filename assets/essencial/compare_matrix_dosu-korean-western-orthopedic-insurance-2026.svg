  <text x="660" y="174" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">건보 급여 (2019.04~)</text>
  <text x="920" y="174" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">비급여</text>

