  <text x="55" y="226" fill="#F1F5F9" font-size="13" font-weight="700" font-family="sans-serif">시술자</text>
  <text x="410" y="226" text-anchor="middle" fill="#99F6E4" font-size="14" font-weight="700" font-family="sans-serif">물리치료사</text>
