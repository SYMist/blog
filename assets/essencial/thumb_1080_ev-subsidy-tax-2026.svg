  <text x="400" y="750" text-anchor="middle" fill="#1E40AF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">세금</text>
  <rect x="480" y="720" width="140" height="44" rx="22" fill="#EFF6FF"/>
  <text x="550" y="750" text-anchor="middle" fill="#1E40AF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">실구매가</text>
  <rect x="640" y="720" width="120" height="44" rx="22" fill="#EFF6FF"/>
  <text x="700" y="750" text-anchor="middle" fill="#1E40AF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">전기차</text>

  <text x="540" y="900" text-anchor="middle" fill="#64748B" font-size="22" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
