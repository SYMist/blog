  <text x="310" y="640" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">580만 원</text>

  <rect x="580" y="545" width="380" height="120" rx="18" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
