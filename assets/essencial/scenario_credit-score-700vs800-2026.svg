<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Title -->
  <text x="540" y="75" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="900" font-family="Pretendard,sans-serif">상황별 맞춤 전략 가이드</text>
  <text x="540" y="115" text-anchor="middle" fill="#94A3B8" font-size="22" font-family="Pretendard,sans-serif">신용점수 구간별 최적의 금융 전략</text>

  <!-- Scenario 1 -->
  <rect x="60" y="155" width="960" height="145" rx="18" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="80" y="175" width="180" height="36" rx="18" fill="#22C55E"/>
  <text x="170" y="200" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">800점대 + 주담대</text>
  <text x="80" y="240" fill="#E2E8F0" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">추천: 고정금리 + 부수거래 우대</text>
  <text x="80" y="272" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">스트레스 DSR 한도 축소 최소화 (1,800만) + 연 4%대 진입 가능</text>

  <!-- Scenario 2 -->
  <rect x="60" y="320" width="960" height="145" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="80" y="340" width="260" height="36" rx="18" fill="#F59E0B"/>
  <text x="210" y="365" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">700점대 후반 + 빠른 점수 향상</text>
  <text x="80" y="405" fill="#E2E8F0" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">추천: 마이데이터 비금융 연동 + 2금융 우선 상환</text>
  <text x="80" y="437" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">즉시 10~30점 상승 + 거래 형태 개선으로 6개월 내 800점 돌파</text>

  <!-- Scenario 3 -->
  <rect x="60" y="485" width="960" height="145" rx="18" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <rect x="80" y="505" width="260" height="36" rx="18" fill="#EF4444"/>
  <text x="210" y="530" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">700점대 초반 + 당장 자금 필요</text>
  <text x="80" y="570" fill="#E2E8F0" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">추천: 서민금융 (새희망홀씨 II · 햇살론)</text>
  <text x="80" y="602" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">2금융 연 15% 대비 연 10.5% 이내 → 5%p 절감, 최대 3,500만 한도</text>

  <!-- Scenario 4 -->
  <rect x="60" y="650" width="960" height="145" rx="18" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="80" y="670" width="260" height="36" rx="18" fill="#8B5CF6"/>
  <text x="210" y="695" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">700점대 + 기존 고금리 대출</text>
  <text x="80" y="735" fill="#E2E8F0" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">추천: 대환대출 (2금융 → 1금융 전환)</text>
  <text x="80" y="767" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">금리 3~5%p 인하 + 부채 통합 + 신용점수 회복 일석삼조</text>

  <!-- Scenario 5 -->
  <rect x="60" y="815" width="960" height="145" rx="18" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="80" y="835" width="260" height="36" rx="18" fill="#3B82F6"/>
  <text x="210" y="860" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">청년(19~34세) + 700점대</text>
  <text x="80" y="900" fill="#E2E8F0" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">추천: 햇살론 유스 (연 3.5~4.5%)</text>
  <text x="80" y="932" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">사회 초년생 초저금리 + 최대 1,200만 한도 + 성실상환 시 1금융 재진입</text>

  <!-- Footer -->
  <text x="540" y="1010" text-anchor="middle" fill="#B45309" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">100점 차이가 수백만 원의 이자를 결정합니다</text>
  <text x="540" y="1055" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
</svg>
