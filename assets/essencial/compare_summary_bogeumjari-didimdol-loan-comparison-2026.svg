<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="50" width="400" height="44" rx="22" fill="#B45309"/>
  <text x="260" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 보금자리론 vs 디딤돌대출 핵심 비교</text>

  <text x="60" y="165" fill="#FFFFFF" font-size="56" font-weight="800" font-family="sans-serif">보금자리론 vs 디딤돌</text>
  <text x="60" y="232" fill="#FCD34D" font-size="56" font-weight="800" font-family="sans-serif">금리 최대 2%p 차이</text>
  <text x="60" y="290" fill="#94A3B8" font-size="22" font-weight="600" font-family="sans-serif">소득·한도·무주택 요건으로 결정 · 2026.05 HF 공시 기준</text>

  <!-- Column Headers -->
  <rect x="60" y="322" width="520" height="64" rx="12" fill="url(#teal)" stroke="#0F766E" stroke-width="2"/>
  <text x="320" y="356" text-anchor="middle" fill="#6EE7B7" font-size="28" font-weight="800" font-family="sans-serif">디딤돌대출</text>
  <text x="320" y="378" text-anchor="middle" fill="#10B981" font-size="15" font-weight="600" font-family="sans-serif">주택도시기금 · 저소득층 특화</text>

  <rect x="620" y="322" width="520" height="64" rx="12" fill="url(#blue)" stroke="#1E40AF" stroke-width="2"/>
  <text x="880" y="356" text-anchor="middle" fill="#93C5FD" font-size="28" font-weight="800" font-family="sans-serif">보금자리론</text>
  <text x="880" y="378" text-anchor="middle" fill="#3B82F6" font-size="15" font-weight="600" font-family="sans-serif">한국주택금융공사 · 중산층까지</text>

  <!-- Row: 소득 한도 -->
  <rect x="60" y="412" width="1080" height="36" rx="0" fill="#1e293b"/>
  <text x="80" y="436" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">소득 한도</text>

  <rect x="60" y="448" width="520" height="80" rx="0" fill="url(#teal)" stroke="#0F766E" stroke-width="1"/>
  <text x="320" y="483" text-anchor="middle" fill="#6EE7B7" font-size="28" font-weight="800" font-family="sans-serif">6,000만원 이하</text>
  <text x="320" y="510" text-anchor="middle" fill="#10B981" font-size="15" font-family="sans-serif">신혼 8,500만 · 생애최초 7,000만</text>

  <rect x="620" y="448" width="520" height="80" rx="0" fill="url(#blue)" stroke="#1E40AF" stroke-width="1"/>
  <text x="880" y="483" text-anchor="middle" fill="#93C5FD" font-size="28" font-weight="800" font-family="sans-serif">7,000만원 이하</text>
  <text x="880" y="510" text-anchor="middle" fill="#3B82F6" font-size="15" font-family="sans-serif">신혼 8,500만 · 다자녀 1억</text>

  <!-- Row: 기본 금리 -->
  <rect x="60" y="548" width="1080" height="36" rx="0" fill="#1e293b"/>
  <text x="80" y="572" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">기본 금리 (2026.05.01)</text>

  <rect x="60" y="584" width="520" height="80" rx="0" fill="url(#teal)" stroke="#0F766E" stroke-width="1"/>
  <text x="320" y="618" text-anchor="middle" fill="#6EE7B7" font-size="28" font-weight="800" font-family="sans-serif">2.85 ~ 4.15%</text>
  <text x="320" y="646" text-anchor="middle" fill="#10B981" font-size="15" font-family="sans-serif">소득 구간별 · 최저 2.55%(신혼)</text>

  <rect x="620" y="584" width="520" height="80" rx="0" fill="url(#blue)" stroke="#1E40AF" stroke-width="1"/>
  <text x="880" y="618" text-anchor="middle" fill="#93C5FD" font-size="28" font-weight="800" font-family="sans-serif">4.60 ~ 5.00%</text>
  <text x="880" y="646" text-anchor="middle" fill="#3B82F6" font-size="15" font-family="sans-serif">만기별 · 최저 3.60%(우대 최대)</text>

  <!-- Row: 대출 한도 -->
  <rect x="60" y="684" width="1080" height="36" rx="0" fill="#1e293b"/>
  <text x="80" y="708" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">대출 한도</text>

  <rect x="60" y="720" width="520" height="80" rx="0" fill="url(#teal)" stroke="#0F766E" stroke-width="1"/>
  <text x="320" y="754" text-anchor="middle" fill="#6EE7B7" font-size="28" font-weight="800" font-family="sans-serif">최대 2억원</text>
  <text x="320" y="782" text-anchor="middle" fill="#10B981" font-size="15" font-family="sans-serif">신혼·2자녀이상 3.2억</text>

  <rect x="620" y="720" width="520" height="80" rx="0" fill="url(#blue)" stroke="#1E40AF" stroke-width="1"/>
  <text x="880" y="754" text-anchor="middle" fill="#93C5FD" font-size="28" font-weight="800" font-family="sans-serif">최대 3.6억원</text>
  <text x="880" y="782" text-anchor="middle" fill="#3B82F6" font-size="15" font-family="sans-serif">생애최초 4.2억 · 다자녀 4억</text>

  <!-- Row: 주택가격 -->
  <rect x="60" y="820" width="1080" height="36" rx="0" fill="#1e293b"/>
  <text x="80" y="844" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">주택 가격</text>

  <rect x="60" y="856" width="520" height="80" rx="0" fill="url(#teal)" stroke="#0F766E" stroke-width="1"/>
  <text x="320" y="890" text-anchor="middle" fill="#6EE7B7" font-size="28" font-weight="800" font-family="sans-serif">5억원 이하</text>
  <text x="320" y="918" text-anchor="middle" fill="#10B981" font-size="15" font-family="sans-serif">신혼·2자녀이상 6억</text>

  <rect x="620" y="856" width="520" height="80" rx="0" fill="url(#blue)" stroke="#1E40AF" stroke-width="1"/>
  <text x="880" y="890" text-anchor="middle" fill="#93C5FD" font-size="28" font-weight="800" font-family="sans-serif">6억원 이하</text>
  <text x="880" y="918" text-anchor="middle" fill="#3B82F6" font-size="15" font-family="sans-serif">전 가구 동일</text>

  <!-- Row: 무주택 조건 -->
  <rect x="60" y="956" width="1080" height="36" rx="0" fill="#1e293b"/>
  <text x="80" y="980" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">무주택 조건</text>

  <rect x="60" y="992" width="520" height="80" rx="0" fill="url(#teal)" stroke="#0F766E" stroke-width="1"/>
  <text x="320" y="1026" text-anchor="middle" fill="#FCA5A5" font-size="22" font-weight="800" font-family="sans-serif">세대원 전원 무주택</text>
  <text x="320" y="1054" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="sans-serif">1주택자 신청 불가</text>

  <rect x="620" y="992" width="520" height="80" rx="0" fill="url(#blue)" stroke="#1E40AF" stroke-width="1"/>
  <text x="880" y="1026" text-anchor="middle" fill="#6EE7B7" font-size="22" font-weight="800" font-family="sans-serif">무주택 또는 1주택</text>
  <text x="880" y="1054" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="sans-serif">3년 이내 처분 조건</text>

  <!-- Row: 만기 -->
  <rect x="60" y="1092" width="1080" height="36" rx="0" fill="#1e293b"/>
  <text x="80" y="1116" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">최대 만기</text>

  <rect x="60" y="1128" width="520" height="80" rx="0" fill="url(#teal)" stroke="#0F766E" stroke-width="1"/>
  <text x="320" y="1162" text-anchor="middle" fill="#6EE7B7" font-size="28" font-weight="800" font-family="sans-serif">30년</text>
  <text x="320" y="1190" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="sans-serif">10·15·20·30년 선택</text>

  <rect x="620" y="1128" width="520" height="80" rx="0" fill="url(#blue)" stroke="#1E40AF" stroke-width="1"/>
  <text x="880" y="1162" text-anchor="middle" fill="#93C5FD" font-size="28" font-weight="800" font-family="sans-serif">50년</text>
  <text x="880" y="1190" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="sans-serif">10·15·20·30·40·50년 선택</text>

  <!-- 결론 박스 -->
  <rect x="60" y="1250" width="1080" height="160" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="600" y="1293" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">★ 핵심 선택 기준</text>
  <text x="600" y="1333" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">소득 6,000만↓ + 무주택 → 디딤돌대출 (금리 최대 1%p 이상 낮음)</text>
  <text x="600" y="1368" text-anchor="middle" fill="#D97706" font-size="22" font-weight="700" font-family="sans-serif">소득 초과·1주택·대출 2억 이상 필요 → 보금자리론</text>
  <text x="600" y="1398" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="sans-serif">두 상품 동시 보유 불가 · DSR 적용 제외 (정책금융)</text>

  <text x="60" y="1456" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 한국주택금융공사 공시 (2026.05.01 기준) · 개인 상황에 따라 달라질 수 있음</text>
</svg>
