    <text x="80" y="875" fill="#CBD5E1" font-size="14">재산세 고지 금액</text>
    <text x="580" y="875" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">400,000 원</text>

    <text x="80" y="905" fill="#CBD5E1" font-size="14">카드 수수료</text>
    <text x="580" y="905" text-anchor="end" fill="#86EFAC" font-size="15" font-weight="700">0 원</text>

    <text x="80" y="935" fill="#CBD5E1" font-size="14">LOCA Pro 2% 적용</text>
    <text x="580" y="935" text-anchor="end" fill="#86EFAC" font-size="18" font-weight="800">−8,000 원</text>

    <text x="80" y="965" fill="#CBD5E1" font-size="14">전자고지 세액공제</text>
    <text x="580" y="965" text-anchor="end" fill="#86EFAC" font-size="15" font-weight="700">−500 원</text>

    <text x="80" y="1000" fill="#FCD34D" font-size="16" font-weight="800">최종 실납부</text>
    <text x="580" y="1000" text-anchor="end" fill="#FCD34D" font-size="20" font-weight="800">391,500 원</text>

    <text x="80" y="1045" fill="#86EFAC" font-size="13" font-weight="700">→ 실효 할인율 약 2.12% · 즉시 캐시백</text>
  </g>

  <rect x="620" y="795" width="520" height="280" rx="16" fill="url(#card)" stroke="#5EEAD4" stroke-width="2"/>
  <text x="640" y="835" fill="#5EEAD4" font-size="20" font-weight="800" font-family="sans-serif">S4 — 200만 원 · 무이자+캐시백</text>

  <g font-family="sans-serif">
    <text x="640" y="875" fill="#CBD5E1" font-size="14">재산세 고지 금액</text>
    <text x="1120" y="875" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">2,000,000 원</text>

    <text x="640" y="905" fill="#CBD5E1" font-size="14">NH 6개월 무이자 환산</text>
    <text x="1120" y="905" text-anchor="end" fill="#5EEAD4" font-size="16" font-weight="800">약 1.5만 이자 절약</text>

    <text x="640" y="935" fill="#CBD5E1" font-size="14">삼성 0.5% 캐시백</text>
    <text x="1120" y="935" text-anchor="end" fill="#86EFAC" font-size="18" font-weight="800">−10,000 원</text>

    <text x="640" y="965" fill="#CBD5E1" font-size="14">월 분할 (약 33.3만)</text>
    <text x="1120" y="965" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">현금흐름 개선</text>

    <text x="640" y="1000" fill="#FCD34D" font-size="16" font-weight="800">총 절감 효과</text>
    <text x="1120" y="1000" text-anchor="end" fill="#FCD34D" font-size="20" font-weight="800">약 25,000 원</text>

    <text x="640" y="1045" fill="#5EEAD4" font-size="13" font-weight="700">→ 할부 + 캐시백 동시 적용 가능</text>
  </g>

  <!-- 6단계 체크리스트 -->
  <text x="60" y="1130" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">7월 납부 전 6단계 체크리스트</text>

  <rect x="60" y="1155" width="1080" height="450" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>

  <g font-family="sans-serif">
    <circle cx="100" cy="1210" r="22" fill="#B45309"/>
    <text x="100" y="1218" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">1</text>
    <text x="140" y="1205" fill="#FFFFFF" font-size="17" font-weight="700">[재산세 예상액 확인] 위택스 '지방세 미리보기' 또는 7월 중순 고지서</text>
    <text x="140" y="1228" fill="#CBD5E1" font-size="14">20만 이하 일시납 여부 + 250만 초과 분납 필요성 판단</text>

    <circle cx="100" cy="1275" r="22" fill="#B45309"/>
    <text x="100" y="1283" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">2</text>
    <text x="140" y="1270" fill="#FFFFFF" font-size="17" font-weight="700">[보유 카드 혜택 점검] 국세·지방세 이벤트 페이지 + 실적 제외 여부</text>
    <text x="140" y="1293" fill="#CBD5E1" font-size="14">롯데 LOCA Pro·KB 직장인보너스 등 최적 카드 발급 검토</text>

    <circle cx="100" cy="1340" r="22" fill="#B45309"/>
    <text x="100" y="1348" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">3</text>
    <text x="140" y="1335" fill="#FFFFFF" font-size="17" font-weight="700">[전자고지 전환 신청] 종이 → 모바일·이메일 전환</text>
    <text x="140" y="1358" fill="#CBD5E1" font-size="14">세액공제 150~500원 + 마일리지 최대 850원 누적</text>

    <circle cx="100" cy="1405" r="22" fill="#B45309"/>
    <text x="100" y="1413" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">4</text>
    <text x="140" y="1400" fill="#FFFFFF" font-size="17" font-weight="700">[자동이체 해제] 카드 혜택 받으려면 수동 납부</text>
    <text x="140" y="1423" fill="#CBD5E1" font-size="14">자동이체는 캐시백·포인트 제외 · BC 머니박스는 사전 응모 필수</text>

    <circle cx="100" cy="1470" r="22" fill="#B45309"/>
    <text x="100" y="1478" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">5</text>
    <text x="140" y="1465" fill="#FFFFFF" font-size="17" font-weight="700">[납부 시점 분산] 7월 / 9월 각 다른 카드사 이벤트 활용</text>
    <text x="140" y="1488" fill="#CBD5E1" font-size="14">공동명의면 1인 카드로 몰아서 실적·한도 충족</text>

    <circle cx="100" cy="1535" r="22" fill="#B45309"/>
    <text x="100" y="1543" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">6</text>
    <text x="140" y="1530" fill="#FFFFFF" font-size="17" font-weight="700">[마감 22시 이전 납부] 시스템 혼잡 회피 + 확인서 보관</text>
    <text x="140" y="1553" fill="#CBD5E1" font-size="14">기한 경과 시 3% + 매월 0.75% 가산금 (최대 48%)</text>
  </g>

  <text x="60" y="1670" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 자료: 위택스·카드사 공식·지방세법 (2026.04 기준)</text>
</svg>
