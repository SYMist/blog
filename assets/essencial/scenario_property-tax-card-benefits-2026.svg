<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <rect x="60" y="50" width="300" height="40" rx="20" fill="#B45309"/>
  <text x="210" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">금액대별 시나리오·체크리스트</text>

  <text x="60" y="155" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">내 재산세별 최적 카드</text>
  <text x="60" y="195" fill="#FCD34D" font-size="20" font-weight="600" font-family="sans-serif">8개 시나리오 · 40만 원 수령액 실전 계산 · 6단계 절차</text>

  <!-- 8 시나리오 카드 -->
  <text x="60" y="250" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">8가지 상황별 최적 카드 조합</text>

  <!-- Row 1 -->
  <rect x="60" y="280" width="260" height="200" rx="12" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="80" y="315" fill="#86EFAC" font-size="15" font-weight="800" font-family="sans-serif">S1 · 소액 15만 원</text>
  <text x="80" y="345" fill="#CBD5E1" font-size="13" font-family="sans-serif">7월 일시 납부</text>
  <text x="80" y="368" fill="#CBD5E1" font-size="13" font-family="sans-serif">KB 직장인보너스 체크</text>
  <text x="80" y="391" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">→ 7,000원 정액 할인</text>
  <text x="80" y="414" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">실효 4.67%</text>
  <text x="80" y="455" fill="#86EFAC" font-size="12" font-weight="700" font-family="sans-serif">소액 최고 효율</text>

  <rect x="340" y="280" width="260" height="200" rx="12" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="360" y="315" fill="#86EFAC" font-size="15" font-weight="800" font-family="sans-serif">S2 · 중액 40만 원</text>
  <text x="360" y="345" fill="#CBD5E1" font-size="13" font-family="sans-serif">분할 중간 구간</text>
  <text x="360" y="368" fill="#CBD5E1" font-size="13" font-family="sans-serif">롯데 LOCA Pro</text>
  <text x="360" y="391" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">→ 최대 2% = 8,000원</text>
  <text x="360" y="414" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">확정 캐시백</text>
  <text x="360" y="455" fill="#86EFAC" font-size="12" font-weight="700" font-family="sans-serif">이벤트 응모 후 결제</text>

  <rect x="620" y="280" width="260" height="200" rx="12" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="640" y="315" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">S3 · 분할 80만 (7·9)</text>
  <text x="640" y="345" fill="#CBD5E1" font-size="13" font-family="sans-serif">각 40만 분산</text>
  <text x="640" y="368" fill="#CBD5E1" font-size="13" font-family="sans-serif">7월 롯데 + 9월 BC</text>
  <text x="640" y="391" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 시점별 이벤트</text>
  <text x="640" y="414" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">조합 할인 최대</text>
  <text x="640" y="455" fill="#FCD34D" font-size="12" font-weight="700" font-family="sans-serif">BC 머니박스 응모</text>

  <rect x="900" y="280" width="240" height="200" rx="12" fill="url(#card)" stroke="#5EEAD4" stroke-width="2"/>
  <text x="920" y="315" fill="#5EEAD4" font-size="15" font-weight="800" font-family="sans-serif">S4 · 고액 200만</text>
  <text x="920" y="345" fill="#CBD5E1" font-size="13" font-family="sans-serif">무이자 + 캐시백 병행</text>
  <text x="920" y="368" fill="#CBD5E1" font-size="13" font-family="sans-serif">NH 6개월 + 삼성 0.5%</text>
  <text x="920" y="391" fill="#5EEAD4" font-size="13" font-weight="700" font-family="sans-serif">→ 이자 1.5만 + 1만</text>
  <text x="920" y="414" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">약 2.5만 절약</text>
  <text x="920" y="455" fill="#5EEAD4" font-size="12" font-weight="700" font-family="sans-serif">현금흐름 + 할인</text>

  <!-- Row 2 -->
  <rect x="60" y="500" width="260" height="200" rx="12" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="80" y="535" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">S5 · 공동명의 부부</text>
  <text x="80" y="565" fill="#CBD5E1" font-size="13" font-family="sans-serif">2인 합산 결제</text>
  <text x="80" y="588" fill="#CBD5E1" font-size="13" font-family="sans-serif">1인 카드로 몰아주기</text>
  <text x="80" y="611" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 실적·한도 충족</text>
  <text x="80" y="634" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">캐시백 한도 극대화</text>
  <text x="80" y="675" fill="#FCD34D" font-size="12" font-weight="700" font-family="sans-serif">롯데·KB 월 한도 체크</text>

  <rect x="340" y="500" width="260" height="200" rx="12" fill="url(#card)" stroke="#5EEAD4" stroke-width="2"/>
  <text x="360" y="535" fill="#5EEAD4" font-size="15" font-weight="800" font-family="sans-serif">S6 · 자영업자</text>
  <text x="360" y="565" fill="#CBD5E1" font-size="13" font-family="sans-serif">사업용 부동산</text>
  <text x="360" y="588" fill="#CBD5E1" font-size="13" font-family="sans-serif">법인카드 결제</text>
  <text x="360" y="611" fill="#5EEAD4" font-size="13" font-weight="700" font-family="sans-serif">→ 비용 처리 + 혜택</text>
  <text x="360" y="634" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">이중 효과</text>
  <text x="360" y="675" fill="#5EEAD4" font-size="12" font-weight="700" font-family="sans-serif">경비 처리 요건 확인</text>

  <rect x="620" y="500" width="260" height="200" rx="12" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="640" y="535" fill="#86EFAC" font-size="15" font-weight="800" font-family="sans-serif">S7 · 체크 선호자</text>
  <text x="640" y="565" fill="#CBD5E1" font-size="13" font-family="sans-serif">자금 여유 · 할부 싫음</text>
  <text x="640" y="588" fill="#CBD5E1" font-size="13" font-family="sans-serif">신한 체크 0.1%</text>
  <text x="640" y="611" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">+ KB 정액 7천원</text>
  <text x="640" y="634" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">즉시 출금 + 소액 할인</text>
  <text x="640" y="675" fill="#86EFAC" font-size="12" font-weight="700" font-family="sans-serif">자동이체 해제 필수</text>

  <rect x="900" y="500" width="240" height="200" rx="12" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="920" y="535" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">S8 · 초고액 250만+</text>
  <text x="920" y="565" fill="#CBD5E1" font-size="13" font-family="sans-serif">지자체 분납 신청</text>
  <text x="920" y="588" fill="#CBD5E1" font-size="13" font-family="sans-serif">최대 2개월 분할</text>
  <text x="920" y="611" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">+ 카드 무이자 할부</text>
  <text x="920" y="634" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">이중 부담 완화</text>
  <text x="920" y="675" fill="#FCD34D" font-size="12" font-weight="700" font-family="sans-serif">별개 절차 — 함께 진행</text>

