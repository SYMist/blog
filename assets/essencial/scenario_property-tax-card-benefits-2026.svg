  <rect x="60" y="795" width="540" height="280" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="80" y="835" fill="#86EFAC" font-size="20" font-weight="800" font-family="sans-serif">S2 — 40만 원 · 롯데 LOCA Pro 2%</text>

