    <text x="500" y="918" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">디젤 라인업</text>
    <text x="800" y="918" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">하이브리드 라인업</text>
