  <!-- 차종·세그먼트별 추천 -->
  <text x="60" y="870" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">② 세그먼트별 라인업 현황·추천</text>

  <rect x="60" y="890" width="1080" height="380" rx="12" fill="url(#card)" stroke="#1E40AF" stroke-width="2"/>

