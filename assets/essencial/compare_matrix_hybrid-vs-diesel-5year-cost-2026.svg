    <text x="500" y="1070" text-anchor="middle" fill="#FCA5A5" font-size="13">단종</text>
    <text x="800" y="1070" text-anchor="middle" fill="#86EFAC" font-size="13">17~21km/L</text>
    <text x="1060" y="1070" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">하이브리드</text>

    <line x1="60" y1="1090" x2="1140" y2="1090" stroke="#334155" stroke-width="1"/>

    <text x="80" y="1120" fill="#FFFFFF" font-size="14" font-weight="700">준중형 SUV (투싼)</text>
    <text x="500" y="1120" text-anchor="middle" fill="#FCD34D" font-size="13">14~15km/L</text>
    <text x="800" y="1120" text-anchor="middle" fill="#86EFAC" font-size="13">17~18km/L</text>
    <text x="1060" y="1120" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">HEV (도심)</text>

    <line x1="60" y1="1140" x2="1140" y2="1140" stroke="#334155" stroke-width="1"/>

    <text x="80" y="1170" fill="#FFFFFF" font-size="14" font-weight="700">중형 SUV (쏘렌토·싼타페)</text>
    <text x="500" y="1170" text-anchor="middle" fill="#FCD34D" font-size="13">13~14km/L</text>
    <text x="800" y="1170" text-anchor="middle" fill="#86EFAC" font-size="13">15~17km/L</text>
    <text x="1060" y="1170" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">HEV (5년 보유)</text>

    <line x1="60" y1="1190" x2="1140" y2="1190" stroke="#334155" stroke-width="1"/>

    <text x="80" y="1220" fill="#FFFFFF" font-size="14" font-weight="700">대형 SUV (팰리세이드)</text>
    <text x="500" y="1220" text-anchor="middle" fill="#FCD34D" font-size="13">잔존</text>
    <text x="800" y="1220" text-anchor="middle" fill="#FCD34D" font-size="13">일부</text>
    <text x="1060" y="1220" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700">용도 의존</text>

    <line x1="60" y1="1240" x2="1140" y2="1240" stroke="#334155" stroke-width="1"/>

    <text x="80" y="1270" fill="#FFFFFF" font-size="14" font-weight="700">픽업·상용</text>
    <text x="500" y="1270" text-anchor="middle" fill="#86EFAC" font-size="13">주력</text>
    <text x="800" y="1270" text-anchor="middle" fill="#FCA5A5" font-size="13">드묾</text>
    <text x="1060" y="1270" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">디젤</text>
