    <text x="500" y="298" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">디젤</text>
    <text x="800" y="298" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">하이브리드</text>
    <text x="1060" y="298" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">차이</text>

    <text x="80" y="350" fill="#FCD34D" font-size="14" font-weight="800">차량가 (취득세·세제 반영)</text>
    <text x="500" y="350" text-anchor="middle" fill="#FFFFFF" font-size="14">4,200만</text>
    <text x="800" y="350" text-anchor="middle" fill="#86EFAC" font-size="14">4,030만</text>
    <text x="1060" y="350" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">+170만</text>

    <line x1="60" y1="370" x2="1140" y2="370" stroke="#334155" stroke-width="1"/>

    <text x="80" y="400" fill="#FCD34D" font-size="14" font-weight="800">5년 연료비</text>
    <text x="500" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14">1,111만 (경유 13.5km/L)</text>
    <text x="800" y="400" text-anchor="middle" fill="#86EFAC" font-size="14">938만 (휘발유 16km/L)</text>
    <text x="1060" y="400" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">+173만</text>

    <line x1="60" y1="420" x2="1140" y2="420" stroke="#334155" stroke-width="1"/>

    <text x="80" y="450" fill="#FCD34D" font-size="14" font-weight="800">5년 자동차세</text>
    <text x="500" y="450" text-anchor="middle" fill="#FFFFFF" font-size="14">260만</text>
    <text x="800" y="450" text-anchor="middle" fill="#FFFFFF" font-size="14">260만</text>
    <text x="1060" y="450" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">동일</text>

    <line x1="60" y1="470" x2="1140" y2="470" stroke="#334155" stroke-width="1"/>

