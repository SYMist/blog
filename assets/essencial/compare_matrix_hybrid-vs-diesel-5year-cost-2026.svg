    <text x="800" y="500" text-anchor="middle" fill="#86EFAC" font-size="14">0원</text>
    <text x="1060" y="500" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">+30만</text>

    <line x1="60" y1="520" x2="1140" y2="520" stroke="#334155" stroke-width="1"/>

