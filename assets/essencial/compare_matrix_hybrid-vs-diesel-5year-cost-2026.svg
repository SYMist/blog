    <text x="800" y="1020" text-anchor="middle" fill="#86EFAC" font-size="13">21.1km/L (1위)</text>
    <text x="1060" y="1020" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">하이브리드</text>

    <line x1="60" y1="1040" x2="1140" y2="1040" stroke="#334155" stroke-width="1"/>

