    <text x="500" y="550" text-anchor="middle" fill="#FFFFFF" font-size="14">550만</text>
    <text x="800" y="550" text-anchor="middle" fill="#86EFAC" font-size="14">520만 (친환경 5%)</text>
    <text x="1060" y="550" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">+30만</text>

    <line x1="60" y1="570" x2="1140" y2="570" stroke="#334155" stroke-width="1"/>

    <text x="80" y="600" fill="#FCD34D" font-size="14" font-weight="800">5년 정비비</text>
    <text x="500" y="600" text-anchor="middle" fill="#FCA5A5" font-size="14">350만 (DPF·EGR·요소수)</text>
    <text x="800" y="600" text-anchor="middle" fill="#86EFAC" font-size="14">200만</text>
    <text x="1060" y="600" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">+150만</text>

    <line x1="60" y1="620" x2="1140" y2="620" stroke="#334155" stroke-width="1"/>

    <text x="80" y="650" fill="#FCD34D" font-size="14" font-weight="800">5년 통행료</text>
