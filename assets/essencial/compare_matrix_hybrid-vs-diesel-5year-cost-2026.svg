<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <rect x="60" y="50" width="320" height="40" rx="20" fill="#1E40AF"/>
  <text x="220" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">5년 TCO 7개 항목 매트릭스</text>

  <text x="60" y="155" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">하이브리드 vs 디젤 항목별 분해</text>
  <text x="60" y="195" fill="#93C5FD" font-size="20" font-weight="600" font-family="sans-serif">중형 SUV 4,000만 · 5년·7.5만 km · 항목별 차이 한눈 비교</text>

  <!-- 7개 항목 상세표 -->
  <text x="60" y="250" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">① 5년 TCO 7개 항목 분해</text>

  <rect x="60" y="270" width="1080" height="540" rx="12" fill="url(#card)" stroke="#1E40AF" stroke-width="2"/>

  <g font-family="sans-serif">
