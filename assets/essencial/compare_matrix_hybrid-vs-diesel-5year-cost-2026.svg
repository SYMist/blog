  <rect x="60" y="1360" width="540" height="280" rx="12" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
  <text x="80" y="1400" fill="#FCA5A5" font-size="18" font-weight="800" font-family="sans-serif">디젤 추가 정비 (약 85~225만)</text>

  <g font-family="sans-serif">
    <text x="80" y="1435" fill="#FFFFFF" font-size="14">• DPF 클리닝 1~2회 → 40~120만</text>
    <text x="80" y="1463" fill="#FFFFFF" font-size="14">• EGR 청소·교체 → 30~80만</text>
    <text x="80" y="1491" fill="#FFFFFF" font-size="14">• 요소수 보충 5년 → 15~25만</text>
    <text x="80" y="1519" fill="#FFFFFF" font-size="14">• 인젝터·터보 정비 (발생 시) 50~200만</text>
    <text x="80" y="1547" fill="#FCA5A5" font-size="13" font-weight="700">⚠ 도심 단거리 시 DPF 빈도↑</text>
    <text x="80" y="1572" fill="#FCA5A5" font-size="13" font-weight="700">⚠ 일반 정비 + 추가 = 250~400만</text>
    <text x="80" y="1605" fill="#FCD34D" font-size="14" font-weight="700">→ 5년 총 약 350만</text>
  </g>

  <rect x="620" y="1360" width="520" height="280" rx="12" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="640" y="1400" fill="#86EFAC" font-size="18" font-weight="800" font-family="sans-serif">하이브리드 (약 150~250만)</text>

  <g font-family="sans-serif">
    <text x="640" y="1435" fill="#FFFFFF" font-size="14">• 일반 정비 (오일·타이어·브레이크)</text>
    <text x="640" y="1463" fill="#FFFFFF" font-size="14">• 보조 배터리 12V 교체 10~15만</text>
    <text x="640" y="1491" fill="#FFFFFF" font-size="14">• 메인 배터리 보증 10년/20만 km</text>
    <text x="640" y="1519" fill="#FFFFFF" font-size="14">• 변속기 오일·HEV 시스템 점검</text>
    <text x="640" y="1547" fill="#86EFAC" font-size="13" font-weight="700">✓ 5년 보증 내 통상 무상</text>
    <text x="640" y="1572" fill="#86EFAC" font-size="13" font-weight="700">✓ DPF·요소수 부담 없음</text>
    <text x="640" y="1605" fill="#FCD34D" font-size="14" font-weight="700">→ 5년 총 약 200만</text>
  </g>

  <text x="60" y="1675" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 자동차 silo · 자료: 한국에너지공단·환경부·자동차365·다나와 (2026.04 기준)</text>
</svg>
