    <text x="800" y="750" text-anchor="middle" fill="#86EFAC" font-size="14">−2,200만 (55%)</text>
    <text x="1060" y="750" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">+400만</text>

    <text x="80" y="790" fill="#86EFAC" font-size="16" font-weight="800">순 TCO 5년</text>
    <text x="500" y="790" text-anchor="middle" fill="#FCA5A5" font-size="20" font-weight="800">4,951만</text>
    <text x="800" y="790" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="800">3,935만</text>
    <text x="1060" y="790" text-anchor="middle" fill="#FCA5A5" font-size="18" font-weight="800">+1,016만</text>
