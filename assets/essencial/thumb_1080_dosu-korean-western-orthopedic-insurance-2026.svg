  <text x="60" y="828" fill="#FCD34D" font-size="18" font-weight="700" font-family="sans-serif">실손 거의 보장 안 됨 · 본인 100% 부담</text>
  <text x="60" y="860" fill="#CBD5E1" font-size="15" font-family="sans-serif">✅ 한의사 직접 시술 · 횟수 제한 없음</text>
  <text x="60" y="888" fill="#CBD5E1" font-size="15" font-family="sans-serif">— 1세대 일부만 보장 · 2~5세대 실손은 약침·봉침 거의 X</text>

  <rect x="40" y="940" width="1000" height="80" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="970" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">결정 변수 = 실손 세대 + 치료 빈도 + 2026.07 관리급여</text>
  <text x="540" y="998" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">1~4세대 도수치료 / 5세대·미가입 추나요법 / 2026.07 이후 병행 전략</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 건강·의료 · 2026.05 기준 · 보험사·약관 직접 확인 필요 · 의료 자문 아님</text>
