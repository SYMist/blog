<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="100" r="200" fill="#1E40AF" fill-opacity="0.07"/>
  <circle cx="120" cy="540" r="160" fill="#0F766E" fill-opacity="0.07"/>

  <!-- Chips -->
  <rect x="40" y="36" width="110" height="32" rx="16" fill="#1E40AF" fill-opacity="0.35" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="95" y="57" text-anchor="middle" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">자동차</text>

  <rect x="166" y="36" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="236" y="57" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="322" y="36" width="160" height="32" rx="16" fill="#134e4a" stroke="#0F766E" stroke-width="1.5"/>
  <text x="402" y="57" text-anchor="middle" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">5년 TCO 분석</text>

  <!-- Title -->
  <text x="600" y="136" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">신차 vs 인증중고차 5년 TCO 비교</text>
  <text x="600" y="178" text-anchor="middle" fill="#93C5FD" font-size="20" font-weight="600" font-family="sans-serif">구매가·취득세·보험료·감가·정비비 총보유비용 시뮬레이션</text>

  <!-- Key stat bar -->
  <rect x="200" y="194" width="800" height="62" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="224" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">5년 TCO 절감액 비교</text>
  <text x="600" y="248" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">인증중고차가 약 657만원(15%) 저렴 · 단 정비비 리스크 감수 필요</text>

  <rect x="200" y="270" width="800" height="2" rx="1" fill="#1E40AF" fill-opacity="0.4"/>

  <!-- Two cards -->
  <rect x="40" y="280" width="555" height="316" rx="16" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#1E40AF" stroke-width="2"/>
  <text x="317" y="320" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">신차 (2,900만원)</text>
  <line x1="70" y1="334" x2="565" y2="334" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="317" y="374" text-anchor="middle" fill="#FCA5A5" font-size="32" font-weight="800" font-family="sans-serif">5년 TCO 4,318만원</text>
  <line x1="70" y1="396" x2="565" y2="396" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="70" y="428" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 보증 5년/10만km</text>
  <text x="70" y="454" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 5년 정비비 200~300만원 (낮음)</text>
  <text x="70" y="480" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 첫해 20~30% 감가 급락</text>
  <rect x="70" y="498" width="465" height="30" rx="8" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="302" y="519" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 5년 이상 장기 보유 시 선택</text>

  <rect x="605" y="280" width="555" height="316" rx="16" fill="url(#tealGrad)" fill-opacity="0.8" stroke="#0F766E" stroke-width="2"/>
  <text x="882" y="320" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">3년식 인증중고차 (1,900만원)</text>
  <line x1="635" y1="334" x2="1130" y2="334" stroke="#134e4a" stroke-width="1.5"/>
  <text x="882" y="374" text-anchor="middle" fill="#4ADE80" font-size="32" font-weight="800" font-family="sans-serif">5년 TCO 3,661만원 🏆</text>
  <line x1="635" y1="396" x2="1130" y2="396" stroke="#134e4a" stroke-width="1.5"/>
  <text x="635" y="428" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 구매가 1,000만원 + 취득세 70만원 절감</text>
  <text x="635" y="454" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 이미 60% 감가 완료 → 완만한 추가 감가</text>
  <text x="635" y="480" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 정비비 350~500만원 (증가 리스크)</text>
  <rect x="635" y="498" width="465" height="30" rx="8" fill="#0F766E" fill-opacity="0.4"/>
  <text x="867" y="519" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">→ 3~5년 단기 보유·비용 절감 시 선택</text>

  <text x="40" y="612" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 추정치이며 실제 비용은 차종·조건에 따라 달라집니다</text>
</svg>
