<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="260" height="36" rx="18" fill="#B45309"/>
  <text x="190" y="74" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800" font-family="sans-serif">2026 개인사업자 대출 4채널 비교</text>

  <text x="60" y="145" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">개인사업자 대출 비교</text>
  <text x="60" y="200" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">신용 vs 담보 vs 정책 vs 보증</text>

  <text x="60" y="255" fill="#FCD34D" font-size="22" font-weight="600" font-family="sans-serif">연이자 180만 원 절감 가능 · 정책자금 최저 2.9%</text>

  <rect x="60" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="120" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">신용대출</text>
  <rect x="195" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="255" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">담보대출</text>
  <rect x="330" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="390" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">정책자금</text>
  <rect x="465" y="285" width="140" height="34" rx="17" fill="#FEF3C7"/>
  <text x="535" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">보증서대출</text>

  <rect x="60" y="345" width="560" height="3" rx="2" fill="#B45309" opacity="0.6"/>

  <text x="60" y="395" fill="#FCD34D" font-size="20" font-weight="600" font-family="sans-serif">신용대출 (시중)</text>
  <text x="60" y="430" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">4.8~6.5% · 1~1.5억 · 1~3일</text>

  <text x="60" y="480" fill="#86EFAC" font-size="20" font-weight="600" font-family="sans-serif">담보대출 (시중)</text>
  <text x="60" y="515" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">3.8~5.2% · LTV 40~70%</text>

  <!-- Right card -->
  <rect x="850" y="100" width="280" height="420" rx="20" fill="#1e293b" opacity="0.85"/>
  <text x="990" y="148" text-anchor="middle" fill="#FCD34D" font-size="18" font-weight="700" font-family="sans-serif">2026.04 핵심 숫자</text>

  <text x="990" y="185" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">정책자금 기준금리</text>
  <text x="990" y="212" text-anchor="middle" fill="#86EFAC" font-size="22" font-weight="800" font-family="sans-serif">2.96%</text>

  <rect x="870" y="225" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="255" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">청년고용연계 (최저)</text>
  <text x="990" y="282" text-anchor="middle" fill="#86EFAC" font-size="22" font-weight="800" font-family="sans-serif">약 2.9%</text>

  <rect x="870" y="295" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="325" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">일반경영안정 · 7천만</text>
  <text x="990" y="352" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">3.5%</text>

  <rect x="870" y="365" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="395" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">저금리 대환 (NCB 919↓)</text>
  <text x="990" y="422" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">4.5% 고정</text>

  <rect x="870" y="440" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="470" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">주담대 보유자 한도</text>
  <text x="990" y="497" text-anchor="middle" fill="#FCA5A5" font-size="20" font-weight="700" font-family="sans-serif">−10~15%</text>

  <text x="60" y="595" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 비교형 콘텐츠</text>
</svg>
