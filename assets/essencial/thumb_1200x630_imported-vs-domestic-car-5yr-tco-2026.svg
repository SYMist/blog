  <text x="70" y="454" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 보험료 연 70만원 (모델등급 16)</text>
  <text x="70" y="480" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 정비비 5년 280만원</text>
