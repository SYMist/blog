  <line x1="70" y1="338" x2="565" y2="338" stroke="#14532d" stroke-width="1.5"/>
  <text x="317" y="378" text-anchor="middle" fill="#86EFAC" font-size="26" font-weight="800" font-family="sans-serif">5년 약 3,776만원</text>
