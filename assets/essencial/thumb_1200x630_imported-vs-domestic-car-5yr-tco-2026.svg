  <rect x="605" y="284" width="555" height="300" rx="16" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#3B82F6" stroke-width="2"/>
  <text x="882" y="324" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">수입 (BMW 320i급)</text>
  <line x1="635" y1="338" x2="1130" y2="338" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="882" y="378" text-anchor="middle" fill="#BFDBFE" font-size="26" font-weight="800" font-family="sans-serif">5년 약 7,030만원</text>
  <text x="882" y="406" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">월 약 117만원 · 잔존 40%</text>
  <line x1="635" y1="426" x2="1130" y2="426" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="635" y="454" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 보험료 연 160만원 (모델등급 6)</text>
  <text x="635" y="480" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 정비비 5년 700만원 (공임 2배)</text>
  <text x="635" y="506" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 절대 감가 3,720만원 (2.3배)</text>
  <rect x="635" y="526" width="465" height="36" rx="8" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="867" y="550" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700" font-family="sans-serif">사업자·장기보유·일본브랜드면 고려</text>

  <text x="40" y="610" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 5년 7만 5천km 시뮬레이션 · 실제 값은 차종·조건에 따라 다릅니다</text>
</svg>
