  <text x="600" y="130" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">수입차 vs 국산차 5년 유지비</text>
  <text x="600" y="178" text-anchor="middle" fill="#93C5FD" font-size="26" font-weight="700" font-family="sans-serif">중형 세단 2.0L 총비용 시뮬레이션 (2026)</text>

  <!-- Key stat bar -->
  <rect x="200" y="198" width="800" height="62" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
