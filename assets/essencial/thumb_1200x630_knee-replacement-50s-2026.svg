<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="24"/>

  <!-- Left Section -->
  <rect x="60" y="50" width="200" height="42" rx="21" fill="#EF4444"/>
  <text x="160" y="78" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">2026 비교분석</text>

  <text x="60" y="165" fill="#FFFFFF" font-size="50" font-weight="900" font-family="Pretendard,sans-serif">50대 무릎</text>
  <text x="60" y="235" fill="#FFFFFF" font-size="50" font-weight="900" font-family="Pretendard,sans-serif">인공관절 수술</text>

  <rect x="60" y="260" width="300" height="4" rx="2" fill="url(#teal)"/>

  <text x="60" y="310" fill="#E2E8F0" font-size="30" font-weight="600" font-family="Pretendard,sans-serif">비용·건강보험 적용 비교</text>

  <!-- Chips -->
  <rect x="60" y="350" width="100" height="36" rx="18" fill="#F0FDFA"/>
  <text x="110" y="374" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="175" y="350" width="100" height="36" rx="18" fill="#F0FDFA"/>
  <text x="225" y="374" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비용</text>
  <rect x="290" y="350" width="130" height="36" rx="18" fill="#F0FDFA"/>
  <text x="355" y="374" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">건강보험</text>

  <!-- Right Section: 2 Cards -->
  <rect x="620" y="50" width="260" height="200" rx="16" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="620" y="50" width="260" height="44" rx="16" fill="#0D9488"/>
  <rect x="620" y="78" width="260" height="16" fill="#0D9488"/>
  <text x="750" y="80" text-anchor="middle" fill="#FFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">전치환술</text>
  <text x="750" y="140" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">611만 원</text>
  <text x="750" y="180" text-anchor="middle" fill="#5EEAD4" font-size="18" font-family="Pretendard,sans-serif">건보 시 ~120만</text>
  <text x="750" y="225" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">내구성 15~25년</text>

  <rect x="910" y="50" width="260" height="200" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="910" y="50" width="260" height="44" rx="16" fill="#8B5CF6"/>
  <rect x="910" y="78" width="260" height="16" fill="#8B5CF6"/>
  <text x="1040" y="80" text-anchor="middle" fill="#FFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">줄기세포</text>
  <text x="1040" y="140" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="900" font-family="Pretendard,sans-serif">850만 원</text>
  <text x="1040" y="180" text-anchor="middle" fill="#C4B5FD" font-size="18" font-family="Pretendard,sans-serif">비급여</text>
  <text x="1040" y="225" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">수술 10년+ 지연</text>

  <!-- Bottom Right: 건보 기준 -->
  <rect x="620" y="280" width="550" height="80" rx="14" fill="#0F766E" opacity="0.15"/>
  <rect x="620" y="280" width="550" height="80" rx="14" stroke="#0D9488" stroke-width="2" fill="none"/>
  <text x="895" y="315" text-anchor="middle" fill="#5EEAD4" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">건보 급여 기준</text>
  <text x="895" y="348" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">만 60세+ KL 3~4단계 → 본인부담 20%</text>

  <!-- Bottom Right: 50대 주의 -->
  <rect x="620" y="390" width="550" height="60" rx="14" fill="#EF4444" opacity="0.1"/>
  <rect x="620" y="390" width="550" height="60" rx="14" stroke="#F87171" stroke-width="1.5" fill="none"/>
  <text x="895" y="428" text-anchor="middle" fill="#FCA5A5" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">50대: 급여 제한 | 1~2세대 실손 유지 필수</text>

  <!-- Footer -->
  <text x="60" y="580" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="1140" y="580" text-anchor="end" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">건강·의료 비교</text>
</svg>
