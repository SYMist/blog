<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="720" fill="url(#bg)"/>

  <text x="540" y="48" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">암종별 3종 보장 지급액 매트릭스</text>
  <text x="540" y="74" text-anchor="middle" fill="#DDD6FE" font-size="14" font-family="sans-serif">진단비 5천만·수술비 회당 300만·표적치료비 연 3천만 가입 · 2026.05</text>

  <!-- Table header -->
  <rect x="40" y="96" width="1000" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="124" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">암종 · 단계</text>
  <text x="440" y="124" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="800" font-family="sans-serif">진단비</text>
  <text x="610" y="124" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="800" font-family="sans-serif">수술비</text>
  <text x="800" y="124" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="800" font-family="sans-serif">표적치료비</text>
  <text x="980" y="124" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="800" font-family="sans-serif">총 보장</text>

  <!-- Row A: 갑상선암 -->
  <rect x="40" y="144" width="1000" height="60" fill="#0e7490" fill-opacity="0.3" stroke="#0e7490" stroke-width="1.5"/>
  <text x="55" y="170" fill="#67E8F9" font-size="14" font-weight="800" font-family="sans-serif">A. 갑상선암 (유사암)</text>
  <text x="55" y="190" fill="#CBD5E1" font-size="12" font-family="sans-serif">수술 1회 + 1차 치료 종료</text>
  <text x="440" y="178" text-anchor="middle" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">1,000만 (20%)</text>
  <text x="610" y="178" text-anchor="middle" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">60만</text>
  <text x="800" y="178" text-anchor="middle" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">거의 X</text>
  <text x="980" y="178" text-anchor="middle" fill="#67E8F9" font-size="15" font-weight="800" font-family="sans-serif">1,060만</text>

  <!-- Row B: 위암 -->
  <rect x="40" y="208" width="1000" height="60" fill="#15803D" fill-opacity="0.3" stroke="#15803D" stroke-width="1.5"/>
  <text x="55" y="234" fill="#86EFAC" font-size="14" font-weight="800" font-family="sans-serif">B. 위암 1기 (일반암)</text>
  <text x="55" y="254" fill="#CBD5E1" font-size="12" font-family="sans-serif">수술 후 치료 종료</text>
  <text x="440" y="242" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">5,000만 (전액)</text>
  <text x="610" y="242" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">300만</text>
  <text x="800" y="242" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">일부 또는 X</text>
  <text x="980" y="242" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="800" font-family="sans-serif">약 5,300만</text>

  <!-- Row C: 폐암 4기 -->
  <rect x="40" y="272" width="1000" height="60" fill="#FCD34D" fill-opacity="0.2" stroke="#FCD34D" stroke-width="2"/>
  <text x="55" y="298" fill="#FCD34D" font-size="14" font-weight="800" font-family="sans-serif">C. 폐암 4기 (표적치료 장기) ⭐</text>
  <text x="55" y="318" fill="#CBD5E1" font-size="12" font-family="sans-serif">수술 2회 + 표적치료 2년</text>
  <text x="440" y="306" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">5,000만</text>
  <text x="610" y="306" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">600만 (2회)</text>
  <text x="800" y="306" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">4,000만 (2년)</text>
  <text x="980" y="306" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">9,600만</text>

  <!-- Row D: 유방암 -->
  <rect x="40" y="336" width="1000" height="60" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="55" y="362" fill="#DDD6FE" font-size="14" font-weight="800" font-family="sans-serif">D. 유방암 3기 (수술 + 표적 1년)</text>
  <text x="55" y="382" fill="#CBD5E1" font-size="12" font-family="sans-serif">수술 1회 + 표적치료 1년</text>
  <text x="440" y="370" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">5,000만</text>
  <text x="610" y="370" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">300만</text>
  <text x="800" y="370" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">2,000만 (1년)</text>
  <text x="980" y="370" text-anchor="middle" fill="#DDD6FE" font-size="15" font-weight="800" font-family="sans-serif">7,300만</text>

  <!-- Highlight: 격차 -->
  <rect x="40" y="412" width="1000" height="56" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-width="2"/>
  <text x="55" y="436" fill="#FCA5A5" font-size="14" font-weight="800" font-family="sans-serif">암종별 보장 격차 (A vs C)</text>
  <text x="55" y="458" fill="#FFFFFF" font-size="14" font-family="sans-serif">→ 갑상선암 1,060만 vs 폐암 4기 9,600만 · 약 9배 차이 · 표적치료비가 결정 변수</text>

  <!-- Key points -->
  <rect x="40" y="484" width="1000" height="190" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="510" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">가입 우선순위 + 보험료 가성비 (40대 기준)</text>
  <text x="60" y="534" fill="#CBD5E1" font-size="12" font-family="sans-serif">⭐ 1순위 진단비 5,000만 (월 약 2~4만) — 모든 가입자 필수 (확진 즉시 일시금)</text>
  <text x="60" y="556" fill="#CBD5E1" font-size="12" font-family="sans-serif">2순위 표적치료비 연 3,000만 (월 약 3~5만) — 가족력·폐/간/유방 대비</text>
  <text x="60" y="578" fill="#CBD5E1" font-size="12" font-family="sans-serif">3순위 수술비 회당 300만 (월 약 1~2만) — 일반암 수술 대비</text>
  <text x="60" y="600" fill="#CBD5E1" font-size="12" font-family="sans-serif">권장 조합: 진단비 + 표적치료비 (월 5~9만, 폐암 4기 9,000만+ 보장)</text>
  <text x="60" y="626" fill="#CBD5E1" font-size="12" font-family="sans-serif">중복 가입 가능 (보험사별 합산 한도 1억~2.5억)</text>
  <text x="60" y="648" fill="#FCA5A5" font-size="12" font-family="sans-serif">⚠️ 면책 90일 + 감액 1~2년 (50% 지급) 주의</text>

  <text x="40" y="708" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 2026.05 기준 · 본인 약관·특약은 보험사·금감원(1332) 확인 필수</text>
</svg>
