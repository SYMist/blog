<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="60" y="50" width="160" height="42" rx="21" fill="#EF4444"/>
  <text x="140" y="78" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">2026 최신</text>

  <!-- Title -->
  <text x="540" y="155" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="900" font-family="Pretendard,sans-serif">50대 무릎 인공관절 수술</text>
  <text x="540" y="210" text-anchor="middle" fill="#E2E8F0" font-size="34" font-weight="600" font-family="Pretendard,sans-serif">비용·건강보험 적용 비교</text>

  <!-- Divider -->
  <rect x="390" y="240" width="300" height="4" rx="2" fill="url(#teal)"/>

  <!-- 4 Cards Grid -->
  <!-- Card 1: 전치환술 -->
  <rect x="60" y="280" width="460" height="165" rx="18" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="80" y="300" width="130" height="32" rx="16" fill="#0D9488"/>
  <text x="145" y="322" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">전치환술</text>
  <text x="80" y="370" fill="#FFFFFF" font-size="38" font-weight="900" font-family="Pretendard,sans-serif">평균 611만 원</text>
  <text x="80" y="410" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">432~952만 | 건보 시 본인부담 ~120만</text>

  <!-- Card 2: 부분치환술 -->
  <rect x="560" y="280" width="460" height="165" rx="18" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="580" y="300" width="130" height="32" rx="16" fill="#0D9488"/>
  <text x="645" y="322" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">부분치환술</text>
  <text x="580" y="370" fill="#FFFFFF" font-size="38" font-weight="900" font-family="Pretendard,sans-serif">평균 460만 원</text>
  <text x="580" y="410" fill="#94A3B8" font-size="18" font-family="Pretendard,sans-serif">343~843만 | 빠른 회복, 재수술 위험</text>

  <!-- Card 3: 로봇 수술 -->
  <rect x="60" y="465" width="460" height="165" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="80" y="485" width="130" height="32" rx="16" fill="#F59E0B"/>
  <text x="145" y="507" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">로봇 수술</text>
  <text x="80" y="555" fill="#FFFFFF" font-size="34" font-weight="900" font-family="Pretendard,sans-serif">전치환 + 수백만 추가</text>
  <text x="80" y="595" fill="#FDE68A" font-size="18" font-family="Pretendard,sans-serif">0.5mm 정밀도 | 재수술 시점 지연 효과</text>

  <!-- Card 4: 줄기세포 -->
  <rect x="560" y="465" width="460" height="165" rx="18" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="580" y="485" width="160" height="32" rx="16" fill="#8B5CF6"/>
  <text x="660" y="507" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">줄기세포(카티스템)</text>
  <text x="580" y="555" fill="#FFFFFF" font-size="34" font-weight="900" font-family="Pretendard,sans-serif">약 850만 원 (비급여)</text>
  <text x="580" y="595" fill="#C4B5FD" font-size="18" font-family="Pretendard,sans-serif">연골 재생 | 수술 10년+ 지연 가능</text>

  <!-- Bottom Section: 건보 기준 -->
  <rect x="60" y="670" width="960" height="110" rx="16" fill="#0F766E" opacity="0.15"/>
  <rect x="60" y="670" width="960" height="110" rx="16" stroke="#0D9488" stroke-width="2" fill="none"/>
  <text x="540" y="715" text-anchor="middle" fill="#5EEAD4" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">건강보험 급여 기준</text>
  <text x="540" y="755" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="700" font-family="Pretendard,sans-serif">만 60세 이상 + KL 3~4단계 → 본인부담 약 20%</text>

  <!-- 50대 주의 -->
  <rect x="60" y="810" width="960" height="100" rx="16" fill="#EF4444" opacity="0.1"/>
  <rect x="60" y="810" width="960" height="100" rx="16" stroke="#F87171" stroke-width="2" fill="none"/>
  <text x="540" y="850" text-anchor="middle" fill="#FCA5A5" font-size="22" font-weight="700" font-family="Pretendard,sans-serif">50대 핵심 포인트</text>
  <text x="540" y="888" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600" font-family="Pretendard,sans-serif">60세 미만 → 급여 제한 | 1~2세대 실손 유지 필수 | 로봇으로 재수술 방지</text>

  <!-- Chips -->
  <rect x="280" y="950" width="100" height="36" rx="18" fill="#F0FDFA"/>
  <text x="330" y="974" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="400" y="950" width="100" height="36" rx="18" fill="#F0FDFA"/>
  <text x="450" y="974" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비용</text>
  <rect x="520" y="950" width="130" height="36" rx="18" fill="#F0FDFA"/>
  <text x="585" y="974" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">건강보험</text>
  <rect x="670" y="950" width="130" height="36" rx="18" fill="#F0FDFA"/>
  <text x="735" y="974" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">인공관절</text>

  <!-- Footer -->
  <text x="540" y="1050" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
</svg>
