<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <rect x="60" y="50" width="320" height="40" rx="20" fill="#0F766E"/>
  <text x="220" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">2026 건강보험료 4월 정산 (5월 체감)</text>

  <text x="60" y="155" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">환급 vs 추가납부 한눈에</text>
  <text x="60" y="200" fill="#5EEAD4" font-size="22" font-weight="600" font-family="sans-serif">요율 7.19% + 장기요양 0.9448% 이중 인상</text>

  <!-- 4 key cards -->
  <rect x="60" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="190" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">건강보험료율 2026</text>
  <text x="190" y="340" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">7.19%</text>
  <text x="190" y="370" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="600" font-family="sans-serif">+0.1%p (약 1.48% ↑)</text>
  <text x="190" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">본인 부담 3.595%</text>

  <rect x="340" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="470" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">장기요양보험료율</text>
  <text x="470" y="340" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">0.9448%</text>
  <text x="470" y="370" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="600" font-family="sans-serif">건보료의 13.14%</text>
  <text x="470" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">2년 만에 인상</text>

  <rect x="620" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
  <text x="750" y="285" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">추가납부 평균</text>
  <text x="750" y="340" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">21.8만 원</text>
  <text x="750" y="370" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="600" font-family="sans-serif">대상자 60% · 환급의 2배</text>
  <text x="750" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">2024년 귀속 기준</text>

  <rect x="900" y="240" width="240" height="180" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="1020" y="285" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">환급 평균</text>
  <text x="1020" y="340" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">11.5만 원</text>
  <text x="1020" y="370" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="600" font-family="sans-serif">대상자 20%</text>
  <text x="1020" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">휴직·퇴사 이력</text>

  <!-- 2024년 귀속 정산 결과 비율 차트 -->
  <text x="60" y="475" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">2024년 귀속 정산 결과 분포</text>
  <text x="60" y="503" fill="#94A3B8" font-size="14" font-family="sans-serif">추가납부자가 환급자의 약 2배 — 2026년도 유사 또는 더 큰 격차 예상</text>

  <g font-family="sans-serif">
    <text x="60" y="545" fill="#FFFFFF" font-size="16" font-weight="700">추가납부 60%</text>
    <rect x="240" y="528" width="420" height="22" rx="4" fill="#92400E"/>
    <text x="680" y="545" fill="#FCA5A5" font-size="15" font-weight="700">평균 21.8만 원</text>

    <text x="60" y="585" fill="#FFFFFF" font-size="16" font-weight="700">환급 20%</text>
    <rect x="240" y="568" width="140" height="22" rx="4" fill="#86EFAC"/>
    <text x="400" y="585" fill="#86EFAC" font-size="15" font-weight="700">평균 11.5만 원</text>

    <text x="60" y="625" fill="#FFFFFF" font-size="16" font-weight="700">변동 없음 20%</text>
    <rect x="240" y="608" width="140" height="22" rx="4" fill="#64748B"/>
    <text x="400" y="625" fill="#CBD5E1" font-size="15" font-weight="700">임금 변동 無</text>

    <text x="60" y="675" fill="#5EEAD4" font-size="15" font-weight="700">→ 추가납부 ≥ 당월 보험료 시 자동 10회 분할 적용 (1~12회 조정 가능)</text>
    <text x="60" y="700" fill="#FCD34D" font-size="14" font-weight="700">※ 국민건강보험공단 2024년 연말정산 결과 기준</text>
  </g>

  <!-- 추가납부 vs 환급 사유 카드 -->
  <rect x="60" y="740" width="540" height="370" rx="16" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
  <text x="80" y="780" fill="#FCA5A5" font-size="22" font-weight="800" font-family="sans-serif">▲ 추가납부 발생 조건</text>

  <g font-family="sans-serif">
    <text x="80" y="820" fill="#FFFFFF" font-size="15" font-weight="700">1. 임금 인상·승진·호봉 상승</text>
    <text x="80" y="850" fill="#CBD5E1" font-size="13">   전년 대비 실제 보수 증가</text>

    <text x="80" y="885" fill="#FFFFFF" font-size="15" font-weight="700">2. 성과급·상여금·연차수당</text>
    <text x="80" y="915" fill="#CBD5E1" font-size="13">   불규칙 지급 → 월 공제 미반영</text>

    <text x="80" y="950" fill="#FFFFFF" font-size="15" font-weight="700">3. 부양가족·시간외수당 증가</text>
    <text x="80" y="980" fill="#CBD5E1" font-size="13">   연간 총액 기준 재산정</text>

    <text x="80" y="1015" fill="#FFFFFF" font-size="15" font-weight="700">4. 보수외소득 2,000만 초과</text>
    <text x="80" y="1045" fill="#CBD5E1" font-size="13">   11월 소득월액 정산 대상</text>

    <text x="80" y="1085" fill="#FCA5A5" font-size="13" font-weight="700">⚠ 평균 21.8만 원 · 대상자 60%</text>
  </g>

  <rect x="620" y="740" width="520" height="370" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="640" y="780" fill="#86EFAC" font-size="22" font-weight="800" font-family="sans-serif">▼ 환급 발생 조건</text>

  <g font-family="sans-serif">
    <text x="640" y="820" fill="#FFFFFF" font-size="15" font-weight="700">1. 육아휴직·질병휴직 (무급)</text>
    <text x="640" y="850" fill="#CBD5E1" font-size="13">   무급 기간 보수 0 → 대체로 환급</text>

    <text x="640" y="885" fill="#FFFFFF" font-size="15" font-weight="700">2. 중도 퇴사 (연도 중)</text>
    <text x="640" y="915" fill="#CBD5E1" font-size="13">   실근무 기간 기준 재산정</text>

    <text x="640" y="950" fill="#FFFFFF" font-size="15" font-weight="700">3. 임금 삭감·동결 + 수당 축소</text>
    <text x="640" y="980" fill="#CBD5E1" font-size="13">   기납부액 > 실제 산정액</text>

    <text x="640" y="1015" fill="#FFFFFF" font-size="15" font-weight="700">4. 중도 입사 (연간 합산 감소)</text>
    <text x="640" y="1045" fill="#CBD5E1" font-size="13">   신고 시점 기준보다 적게 확정</text>

    <text x="640" y="1085" fill="#86EFAC" font-size="13" font-weight="700">✓ 평균 11.5만 원 · 대상자 20%</text>
  </g>

  <!-- 월 보수 400만 예시 -->
  <rect x="60" y="1140" width="1080" height="210" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="80" y="1180" fill="#5EEAD4" font-size="22" font-weight="800" font-family="sans-serif">예시 — 월 보수 400만 원 근로자</text>

  <g font-family="sans-serif">
    <text x="80" y="1220" fill="#FFFFFF" font-size="16" font-weight="700">건강보험료 총액</text>
    <text x="570" y="1220" text-anchor="end" fill="#FFFFFF" font-size="18" font-weight="800">287,600 원</text>

    <text x="80" y="1255" fill="#FFFFFF" font-size="16" font-weight="700">→ 근로자 본인 부담</text>
    <text x="570" y="1255" text-anchor="end" fill="#5EEAD4" font-size="18" font-weight="800">143,800 원</text>

    <text x="600" y="1220" fill="#FFFFFF" font-size="16" font-weight="700">장기요양보험료 총액</text>
    <text x="1120" y="1220" text-anchor="end" fill="#FFFFFF" font-size="18" font-weight="800">37,791 원</text>

    <text x="600" y="1255" fill="#FFFFFF" font-size="16" font-weight="700">→ 근로자 본인 부담</text>
    <text x="1120" y="1255" text-anchor="end" fill="#5EEAD4" font-size="18" font-weight="800">18,895 원</text>

    <text x="80" y="1305" fill="#FCD34D" font-size="16" font-weight="800">월 본인 합계 약 162,695 원 · 2025 대비 +2~3천 체감</text>
  </g>

  <text x="60" y="1420" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 건강·의료 silo · 자료: 국민건강보험공단·보건복지부 (2026.04 기준)</text>
</svg>
