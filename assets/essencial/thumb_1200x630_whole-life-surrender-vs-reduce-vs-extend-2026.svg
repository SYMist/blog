<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="100" r="200" fill="#7C3AED" fill-opacity="0.07"/>
  <circle cx="120" cy="540" r="160" fill="#DC2626" fill-opacity="0.07"/>

  <!-- Chips -->
  <rect x="40" y="36" width="100" height="32" rx="16" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="90" y="57" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">보험 비교</text>

  <rect x="156" y="36" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="226" y="57" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="312" y="36" width="160" height="32" rx="16" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="392" y="57" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">15년차 시뮬</text>

  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">종신보험 해지 vs 감액완납 vs 연장</text>
  <text x="600" y="178" text-anchor="middle" fill="#DDD6FE" font-size="26" font-weight="700" font-family="sans-serif">3종 손익 비교 (2026)</text>

  <!-- Key stat bar -->
  <rect x="200" y="198" width="800" height="62" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="226" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">월 30만·15년차·환급금 4,000만·사망 1억</text>
  <text x="600" y="250" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">3종 모두 특약 소멸 · 되돌리기 불가</text>

  <rect x="200" y="274" width="800" height="2" rx="1" fill="#7C3AED" fill-opacity="0.4"/>

  <!-- 3 cards horizontal -->
  <rect x="40" y="284" width="370" height="300" rx="16" fill="url(#redGrad)" fill-opacity="0.85" stroke="#DC2626" stroke-width="2"/>
  <text x="225" y="324" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">해지</text>
  <text x="225" y="350" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="sans-serif">즉시 환급금 수령</text>
  <line x1="70" y1="368" x2="380" y2="368" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="225" y="408" text-anchor="middle" fill="#FCA5A5" font-size="24" font-weight="800" font-family="sans-serif">4,000만원</text>
  <text x="225" y="436" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">보장 0원 · 종료</text>
  <line x1="70" y1="456" x2="380" y2="456" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="70" y="484" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">✅ 즉시 현금</text>
  <text x="70" y="508" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 보장 0원·특약 소멸</text>
  <text x="70" y="532" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 환급률 74% (-26%)</text>
  <rect x="70" y="552" width="310" height="22" rx="6" fill="#DC2626" fill-opacity="0.4"/>
  <text x="225" y="568" text-anchor="middle" fill="#FECACA" font-size="12" font-weight="700" font-family="sans-serif">자금 필요·보장 불필요만</text>

  <rect x="420" y="284" width="370" height="300" rx="16" fill="url(#amberGrad)" fill-opacity="0.85" stroke="#D97706" stroke-width="2"/>
  <text x="605" y="324" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">감액완납</text>
  <text x="605" y="350" text-anchor="middle" fill="#FCD34D" font-size="13" font-family="sans-serif">납입 0원 + 종신 축소 보장</text>
  <line x1="450" y1="368" x2="760" y2="368" stroke="#7C2D12" stroke-width="1.5"/>
  <text x="605" y="408" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">3,000~4,000만</text>
  <text x="605" y="436" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">사망보장 · 종신</text>
  <line x1="450" y1="456" x2="760" y2="456" stroke="#7C2D12" stroke-width="1.5"/>
  <text x="450" y="484" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">✅ 보험료 0원·평생</text>
  <text x="450" y="508" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 보장 30~50% 축소</text>
  <text x="450" y="532" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 특약 소멸</text>
  <rect x="450" y="552" width="310" height="22" rx="6" fill="#D97706" fill-opacity="0.4"/>
  <text x="605" y="568" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700" font-family="sans-serif">부담↓ + 평생 일부 보장</text>

  <rect x="800" y="284" width="370" height="300" rx="16" fill="url(#purpleGrad)" fill-opacity="0.85" stroke="#7C3AED" stroke-width="2"/>
  <text x="985" y="324" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">연장정기</text>
  <text x="985" y="350" text-anchor="middle" fill="#DDD6FE" font-size="13" font-family="sans-serif">납입 0원 + 풀 보장 단축</text>
  <line x1="830" y1="368" x2="1140" y2="368" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="985" y="408" text-anchor="middle" fill="#DDD6FE" font-size="24" font-weight="800" font-family="sans-serif">1억 유지</text>
  <text x="985" y="436" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">75~80세 만기</text>
  <line x1="830" y1="456" x2="1140" y2="456" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="830" y="484" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">✅ 사망보장 풀</text>
  <text x="830" y="508" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 만기 후 무보장</text>
  <text x="830" y="532" fill="#FECACA" font-size="13" font-weight="700" font-family="sans-serif">❌ 특약 소멸</text>
  <rect x="830" y="552" width="310" height="22" rx="6" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="985" y="568" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="700" font-family="sans-serif">자녀 대출 65~70대 종료 OK</text>

  <text x="40" y="610" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 결정 전 가입 보험사·금감원(1332) 본인 약관 시뮬레이션 필수</text>
</svg>
