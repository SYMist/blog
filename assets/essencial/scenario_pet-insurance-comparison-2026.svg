<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="48" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">펫보험 상황별 추천 시나리오</text>
  <text x="540" y="72" text-anchor="middle" fill="#A78BFA" font-size="13" font-family="sans-serif">5가지 상황 · 2026.05 기준</text>

  <!-- Scenario 1: 보험료 최저 -->
  <rect x="40" y="92" width="480" height="112" rx="10" fill="#3b0764" fill-opacity="0.6" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="40" y="92" width="480" height="36" rx="10" fill="#7C3AED"/>
  <rect x="40" y="114" width="480" height="14" fill="#7C3AED"/>
  <text x="60" y="116" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 보험료 부담이 커서 최저가를 원한다면</text>
  <text x="60" y="148" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 삼성화재 선택</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">3사 최저 29,827원/월 (연간 357,924원). 수술 한도 300만원으로 수술 대응도 우수</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">카드 결제·동물등록증 제출 시 최대 15% 추가 할인 가능</text>

  <!-- Scenario 2: 통원 잦음 -->
  <rect x="560" y="92" width="480" height="112" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="92" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="114" width="480" height="14" fill="#D97706"/>
  <text x="580" y="116" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 피부·귀·관절로 통원이 잦은 경우</text>
  <text x="580" y="148" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ DB손해보험 선택</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">통원 한도 30만원 (업계 최고). 메리츠·삼성 15만원의 2배</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">회당 보상액 최대 10만원 이상 차이 → 연간 수십만원 절약</text>

  <!-- Scenario 3: 청구 편의 -->
  <rect x="40" y="224" width="480" height="112" rx="10" fill="#134e4a" fill-opacity="0.6" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="40" y="224" width="480" height="36" rx="10" fill="#0F766E"/>
  <rect x="40" y="246" width="480" height="14" fill="#0F766E"/>
  <text x="60" y="248" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 청구 서류 준비가 번거로운 경우</text>
  <text x="60" y="280" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">→ 메리츠화재 선택</text>
  <text x="60" y="302" fill="#CBD5E1" font-size="12" font-family="sans-serif">전국 400개 이상 제휴병원 현장 즉시 청구 — 진료 후 카운터에서 바로 처리</text>
  <text x="60" y="324" fill="#CBD5E1" font-size="12" font-family="sans-serif">비제휴 병원 방문 시 일반 앱 청구로 전환, 사전에 인근 제휴병원 확인 권장</text>

  <!-- Scenario 4: MRI·CT -->
  <rect x="560" y="224" width="480" height="112" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="224" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="246" width="480" height="14" fill="#D97706"/>
  <text x="580" y="248" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ MRI·CT 등 고가 검사 가능성 있는 경우</text>
  <text x="580" y="280" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ DB손해보험 선택</text>
  <text x="580" y="302" fill="#CBD5E1" font-size="12" font-family="sans-serif">MRI·CT·내시경 특약 연간 100만원 보장 (선택 특약)</text>
  <text x="580" y="324" fill="#CBD5E1" font-size="12" font-family="sans-serif">대형견·노령견, 신경·종양 의심 품종에 특히 유용</text>

  <!-- Scenario 5: 수술 위험 -->
  <rect x="40" y="356" width="1000" height="112" rx="10" fill="#3b0764" fill-opacity="0.6" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="40" y="356" width="1000" height="36" rx="10" fill="#7C3AED"/>
  <rect x="40" y="378" width="1000" height="14" fill="#7C3AED"/>
  <text x="60" y="380" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 슬개골 탈구 등 수술 위험이 높은 소형견</text>
  <text x="60" y="412" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 삼성화재 선택 (수술 한도 300만원 — 3사 최고)</text>
  <text x="60" y="434" fill="#CBD5E1" font-size="12" font-family="sans-serif">메리츠·DB손보 수술 한도 250만원보다 50만원 높음. 고액 수술 시 삼성화재가 보상 유리</text>
  <text x="60" y="456" fill="#CBD5E1" font-size="12" font-family="sans-serif">특정 질환 90일 면책 조항 있으므로, 건강할 때 미리 가입해야 실효 보장</text>

  <!-- Summary box -->
  <rect x="40" y="488" width="1000" height="178" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="520" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 선택 기준 3줄 요약</text>
  <text x="80" y="552" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">보험료 최저</text>
  <text x="210" y="552" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 삼성화재 (월 29,827원, 수술 한도 300만원)</text>
  <text x="80" y="584" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">통원 잦음 / MRI 필요</text>
  <text x="270" y="584" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ DB손해보험 (통원 30만원, MRI·CT 100만원 특약)</text>
  <text x="80" y="616" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">청구 편의</text>
  <text x="210" y="616" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 메리츠화재 (전국 400개 병원 현장 즉시 청구)</text>
  <text x="80" y="648" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 공통: 3사 모두 갱신형. 어릴수록 보험료 저렴 → 건강할 때 가입이 유리</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 가입 전 약관 확인 필요</text>
</svg>
