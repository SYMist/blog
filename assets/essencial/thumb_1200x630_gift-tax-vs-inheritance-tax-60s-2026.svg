<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="100" r="200" fill="#7C3AED" fill-opacity="0.07"/>
  <circle cx="120" cy="540" r="160" fill="#15803D" fill-opacity="0.07"/>

  <!-- Chips -->
  <rect x="40" y="36" width="120" height="32" rx="16" fill="#B45309" fill-opacity="0.4" stroke="#D97706" stroke-width="1.5"/>
  <text x="100" y="57" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">대출·금융</text>

  <rect x="176" y="36" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="246" y="57" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="332" y="36" width="170" height="32" rx="16" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="417" y="57" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">60대 부모 시뮬</text>

  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">증여세 vs 상속세 60대 부모 비교</text>
  <text x="600" y="178" text-anchor="middle" fill="#FCD34D" font-size="26" font-weight="700" font-family="sans-serif">자산 규모별 손익분기 분석 (2026)</text>

  <!-- Key stat bar -->
  <rect x="200" y="198" width="800" height="62" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="226" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">손익분기점 (자녀 2명)</text>
  <text x="600" y="250" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">자산 약 20억원 · 이하 상속 / 이상 사전 증여</text>

  <rect x="200" y="274" width="800" height="2" rx="1" fill="#D97706" fill-opacity="0.4"/>

  <!-- Two cards -->
  <rect x="40" y="284" width="555" height="300" rx="16" fill="url(#greenGrad)" fill-opacity="0.8" stroke="#15803D" stroke-width="2"/>
  <text x="317" y="324" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">상속 (10억 이하 유리)</text>
  <line x1="70" y1="338" x2="565" y2="338" stroke="#14532d" stroke-width="1.5"/>
  <text x="317" y="382" text-anchor="middle" fill="#86EFAC" font-size="26" font-weight="800" font-family="sans-serif">10억 → 9천만원</text>
  <text x="317" y="410" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">5억 → 0원 · 일괄공제 5억 활용</text>
  <line x1="70" y1="430" x2="565" y2="430" stroke="#14532d" stroke-width="1.5"/>
  <text x="70" y="458" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 일괄공제 5억 (자녀 수 무관)</text>
  <text x="70" y="484" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 자녀공제 5억 개정안 검토 중</text>
  <text x="70" y="510" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 사전 증여 대비 7천만원 절감</text>
  <rect x="70" y="530" width="465" height="36" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="302" y="554" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">자산 10억 이하·자녀 자금 여유면 선택</text>

  <rect x="605" y="284" width="555" height="300" rx="16" fill="url(#purpleGrad)" fill-opacity="0.8" stroke="#7C3AED" stroke-width="2"/>
  <text x="882" y="324" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">사전 증여 (30억+ 유리)</text>
  <line x1="635" y1="338" x2="1130" y2="338" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="882" y="382" text-anchor="middle" fill="#DDD6FE" font-size="26" font-weight="800" font-family="sans-serif">50억 → 16.4억</text>
  <text x="882" y="410" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">상속 17.9억 대비 1.5억 절감</text>
  <line x1="635" y1="430" x2="1130" y2="430" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="635" y="458" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">✅ 10년 누계 60→90세 4회 공제</text>
  <text x="635" y="484" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">✅ 자산 증가분 자녀 자산 분리</text>
  <text x="635" y="510" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 사망 10년 내 증여는 상속 합산</text>
  <rect x="635" y="530" width="465" height="36" rx="8" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="867" y="554" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">자산 30억+·자녀 자금 필요면 선택</text>

  <text x="40" y="610" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 대출·금융 · 2026.05 기준 · 60대 일찍 시작이 사전 증여 효과 핵심 · 1억+ 이전 시 세무사 상담</text>
</svg>
