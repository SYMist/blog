<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <rect x="60" y="60" width="340" height="44" rx="22" fill="#0F766E"/>
  <text x="230" y="90" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">2026 건강보험료 5월 정산</text>

  <text x="60" y="200" fill="#FFFFFF" font-size="70" font-weight="800" font-family="sans-serif">환급 vs</text>
  <text x="60" y="280" fill="#5EEAD4" font-size="70" font-weight="800" font-family="sans-serif">추가납부</text>
  <text x="60" y="340" fill="#FFFFFF" font-size="36" font-weight="600" font-family="sans-serif">5월 급여 어떻게 바뀔까</text>

  <!-- 3 key cards stacked -->
  <rect x="60" y="400" width="960" height="180" rx="16" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
  <text x="90" y="445" fill="#FCA5A5" font-size="17" font-weight="700" font-family="sans-serif">추가납부 (대상자 60%)</text>
  <text x="90" y="510" fill="#FFFFFF" font-size="50" font-weight="800" font-family="sans-serif">평균 21.8만 원</text>
  <text x="990" y="445" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="600" font-family="sans-serif">환급의 약 2배</text>
  <text x="990" y="510" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">성과급·임금 인상</text>
  <text x="90" y="555" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">자동 10회 분할 (1~12회 조정)</text>

  <rect x="60" y="600" width="960" height="180" rx="16" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="90" y="645" fill="#86EFAC" font-size="17" font-weight="700" font-family="sans-serif">환급 (대상자 20%)</text>
  <text x="90" y="710" fill="#FFFFFF" font-size="50" font-weight="800" font-family="sans-serif">평균 11.5만 원</text>
  <text x="990" y="645" text-anchor="end" fill="#86EFAC" font-size="16" font-weight="600" font-family="sans-serif">4월분에서 상계</text>
  <text x="990" y="710" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">휴직·중도퇴사</text>
  <text x="90" y="755" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">급여명세서 '연말정산' 확인</text>

  <rect x="60" y="800" width="960" height="180" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="90" y="845" fill="#5EEAD4" font-size="17" font-weight="700" font-family="sans-serif">2026 요율 이중 인상</text>
  <text x="90" y="910" fill="#FFFFFF" font-size="50" font-weight="800" font-family="sans-serif">7.19% + 13.14%</text>
  <text x="990" y="845" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="600" font-family="sans-serif">건보 +0.1%p</text>
  <text x="990" y="910" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">장기요양 2년만에↑</text>
  <text x="90" y="955" fill="#5EEAD4" font-size="15" font-weight="700" font-family="sans-serif">본인 부담 월 400만 → 약 16.3만</text>

  <text x="60" y="1040" fill="#64748B" font-size="15" font-family="sans-serif">essencial | 건강·의료 silo · 2026.04 기준</text>
</svg>
