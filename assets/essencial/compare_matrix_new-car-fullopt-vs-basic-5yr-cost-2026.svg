  <text x="60" y="674" fill="#CBD5E1" font-size="12" font-family="sans-serif">풀옵션 1,300만원 추가 → 650만원 실손. 가성비 옵션 선택이 핵심.</text>

  <text x="40" y="710" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 2026.05 기준 · 차종·인기도·중고 시세에 따라 회수율 변동</text>
