<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <rect x="60" y="50" width="300" height="40" rx="20" fill="#B45309"/>
  <text x="210" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">상세 비교 · 세율 · 공제 한도</text>

  <text x="60" y="155" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">3트랙 종합소득세 전체 매트릭스</text>
  <text x="60" y="195" fill="#FCD34D" font-size="20" font-weight="600" font-family="sans-serif">사업자 · 근로자 · 투잡별 필수 점검표</text>

  <!-- 사업자/근로자/투잡 3트랙 비교표 -->
  <text x="60" y="250" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">① 3트랙 신고 체계 비교</text>

  <rect x="60" y="270" width="1080" height="370" rx="12" fill="url(#card)" stroke="#B45309" stroke-width="2"/>

  <g font-family="sans-serif">
    <!-- 헤더 -->
    <rect x="60" y="270" width="1080" height="44" fill="#B45309"/>
    <text x="180" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">구분</text>
    <text x="440" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">사업자·프리랜서</text>
    <text x="720" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">근로자 (단일)</text>
    <text x="1000" y="298" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">투잡·N잡러</text>

    <!-- 행1 -->
    <text x="80" y="350" fill="#CBD5E1" font-size="14">5월 신고</text>
    <text x="440" y="350" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">필수</text>
    <text x="720" y="350" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">원칙 不필요</text>
    <text x="1000" y="350" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">합산 확정신고 필수</text>

    <line x1="60" y1="370" x2="1140" y2="370" stroke="#334155" stroke-width="1"/>

    <!-- 행2 -->
    <text x="80" y="400" fill="#CBD5E1" font-size="14">경비 레버</text>
    <text x="440" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">기장 · 단순/기준경비율</text>
    <text x="720" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">근로소득공제</text>
    <text x="1000" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">근로+사업 합산</text>

    <line x1="60" y1="420" x2="1140" y2="420" stroke="#334155" stroke-width="1"/>

    <!-- 행3 -->
    <text x="80" y="450" fill="#CBD5E1" font-size="14">환급 경로</text>
    <text x="440" y="450" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">원천 3.3% 초과분</text>
    <text x="720" y="450" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">경정청구 (5년)</text>
    <text x="1000" y="450" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">합산 후 재정산</text>

    <line x1="60" y1="470" x2="1140" y2="470" stroke="#334155" stroke-width="1"/>

    <!-- 행4 -->
    <text x="80" y="500" fill="#CBD5E1" font-size="14">전용 공제</text>
    <text x="440" y="500" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">노란우산 500만</text>
    <text x="720" y="500" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">월세·의료비·기부금</text>
    <text x="1000" y="500" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">두 트랙 장점 결합</text>

    <line x1="60" y1="520" x2="1140" y2="520" stroke="#334155" stroke-width="1"/>

    <!-- 행5 -->
    <text x="80" y="550" fill="#CBD5E1" font-size="14">주요 감면</text>
    <text x="440" y="550" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">창업중기 50~100%</text>
    <text x="720" y="550" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">연금저축·IRP 세액공제</text>
    <text x="1000" y="550" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">사업측 감면 우선 적용</text>

    <line x1="60" y1="570" x2="1140" y2="570" stroke="#334155" stroke-width="1"/>

    <!-- 행6 -->
    <text x="80" y="600" fill="#CBD5E1" font-size="14">주의</text>
    <text x="440" y="600" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">업종별 기장의무 확인</text>
    <text x="720" y="600" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">연말정산 누락 확인</text>
    <text x="1000" y="600" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">기타소득 300만 초과</text>
  </g>

  <!-- 세율표 8구간 -->
  <text x="60" y="690" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">② 2025 귀속 종합소득세율표 (8구간)</text>

  <rect x="60" y="710" width="1080" height="420" rx="12" fill="url(#card)" stroke="#B45309" stroke-width="2"/>

  <g font-family="sans-serif">
    <!-- 헤더 -->
    <rect x="60" y="710" width="1080" height="44" fill="#B45309"/>
    <text x="280" y="738" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">과세표준</text>
    <text x="700" y="738" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">세율</text>
    <text x="1000" y="738" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">누진공제</text>

    <!-- 8구간 -->
    <text x="80" y="790" fill="#FFFFFF" font-size="15" font-weight="700">1,400만 원 이하</text>
    <text x="700" y="790" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700">6%</text>
    <text x="1120" y="790" text-anchor="end" fill="#CBD5E1" font-size="14">—</text>

    <line x1="60" y1="805" x2="1140" y2="805" stroke="#334155" stroke-width="1"/>

    <text x="80" y="830" fill="#FFFFFF" font-size="15" font-weight="700">1,400 ~ 5,000만</text>
    <text x="700" y="830" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700">15%</text>
    <text x="1120" y="830" text-anchor="end" fill="#CBD5E1" font-size="14">126만</text>

    <line x1="60" y1="845" x2="1140" y2="845" stroke="#334155" stroke-width="1"/>

    <text x="80" y="870" fill="#FFFFFF" font-size="15" font-weight="700">5,000 ~ 8,800만</text>
    <text x="700" y="870" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700">24%</text>
    <text x="1120" y="870" text-anchor="end" fill="#CBD5E1" font-size="14">576만</text>

    <line x1="60" y1="885" x2="1140" y2="885" stroke="#334155" stroke-width="1"/>

    <text x="80" y="910" fill="#FFFFFF" font-size="15" font-weight="700">8,800 ~ 1.5억</text>
    <text x="700" y="910" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700">35%</text>
    <text x="1120" y="910" text-anchor="end" fill="#CBD5E1" font-size="14">1,544만</text>

    <line x1="60" y1="925" x2="1140" y2="925" stroke="#334155" stroke-width="1"/>

    <text x="80" y="950" fill="#FFFFFF" font-size="15" font-weight="700">1.5 ~ 3억</text>
    <text x="700" y="950" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700">38%</text>
    <text x="1120" y="950" text-anchor="end" fill="#CBD5E1" font-size="14">1,994만</text>

    <line x1="60" y1="965" x2="1140" y2="965" stroke="#334155" stroke-width="1"/>

    <text x="80" y="990" fill="#FFFFFF" font-size="15" font-weight="700">3 ~ 5억</text>
    <text x="700" y="990" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700">40%</text>
    <text x="1120" y="990" text-anchor="end" fill="#CBD5E1" font-size="14">2,594만</text>

    <line x1="60" y1="1005" x2="1140" y2="1005" stroke="#334155" stroke-width="1"/>

    <text x="80" y="1030" fill="#FFFFFF" font-size="15" font-weight="700">5 ~ 10억</text>
    <text x="700" y="1030" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700">42%</text>
    <text x="1120" y="1030" text-anchor="end" fill="#CBD5E1" font-size="14">3,594만</text>

    <line x1="60" y1="1045" x2="1140" y2="1045" stroke="#334155" stroke-width="1"/>

    <text x="80" y="1070" fill="#FFFFFF" font-size="15" font-weight="700">10억 초과</text>
    <text x="700" y="1070" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700">45%</text>
    <text x="1120" y="1070" text-anchor="end" fill="#CBD5E1" font-size="14">6,594만</text>

    <text x="80" y="1110" fill="#FCD34D" font-size="14" font-weight="700">※ 산출세액 = 과표 × 세율 − 누진공제 | 지방소득세(10%) 별도 납부</text>
  </g>

  <!-- 기장의무 업종별 표 -->
  <text x="60" y="1180" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">③ 업종별 복식부기·기준경비율 기준</text>

  <rect x="60" y="1200" width="540" height="230" rx="12" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="80" y="1240" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">복식부기 대상 (무기장 시 가산세 20%)</text>

  <g font-family="sans-serif">
    <text x="80" y="1275" fill="#CBD5E1" font-size="14">농업·도소매</text>
    <text x="580" y="1275" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">3억 이상</text>

    <text x="80" y="1305" fill="#CBD5E1" font-size="14">제조·음식·건설</text>
    <text x="580" y="1305" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">1.5억 이상</text>

    <text x="80" y="1335" fill="#CBD5E1" font-size="14">서비스·전문직·프리랜서</text>
    <text x="580" y="1335" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">7,500만 이상</text>

    <text x="80" y="1380" fill="#FCA5A5" font-size="13" font-weight="700">→ 기준 미달은 간편장부 가능 · 그러나 복식전환 세액공제 20%</text>
  </g>

  <rect x="620" y="1200" width="520" height="230" rx="12" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
  <text x="640" y="1240" fill="#86EFAC" font-size="18" font-weight="800" font-family="sans-serif">경비율 적용 기준 (추계신고)</text>

  <g font-family="sans-serif">
    <text x="640" y="1275" fill="#CBD5E1" font-size="14">단순경비율</text>
    <text x="1120" y="1275" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">소규모 (업종별 기준 이하)</text>

    <text x="640" y="1305" fill="#CBD5E1" font-size="14">기준경비율</text>
    <text x="1120" y="1305" text-anchor="end" fill="#FFFFFF" font-size="14" font-weight="700">중규모 (기장의무 미만)</text>

    <text x="640" y="1335" fill="#CBD5E1" font-size="14">프리랜서 단순경비율</text>
    <text x="1120" y="1335" text-anchor="end" fill="#86EFAC" font-size="14" font-weight="700">평균 약 75%</text>

    <text x="640" y="1380" fill="#FCD34D" font-size="13" font-weight="700">→ 수입 3,000만 프리랜서 → 소득 750만 → 세액 ≒ 1.1만 → 약 54만 환급</text>
  </g>

  <!-- 공제·감면 한도표 -->
  <text x="60" y="1480" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">④ 주요 공제·감면 한도 총정리</text>

  <rect x="60" y="1500" width="1080" height="130" rx="12" fill="url(#card)" stroke="#B45309" stroke-width="2"/>

  <g font-family="sans-serif">
    <text x="80" y="1540" fill="#FFFFFF" font-size="15" font-weight="700">연금저축+IRP</text>
    <text x="380" y="1540" text-anchor="end" fill="#86EFAC" font-size="15" font-weight="800">900만 × 13.2~16.5%</text>

    <text x="80" y="1570" fill="#FFFFFF" font-size="15" font-weight="700">노란우산 (사업자)</text>
    <text x="380" y="1570" text-anchor="end" fill="#86EFAC" font-size="15" font-weight="800">200~500만 소득공제</text>

    <text x="420" y="1540" fill="#FFFFFF" font-size="15" font-weight="700">월세 (총급여 8천만 이하)</text>
    <text x="750" y="1540" text-anchor="end" fill="#86EFAC" font-size="15" font-weight="800">2,000만 × 15~17%</text>

    <text x="420" y="1570" fill="#FFFFFF" font-size="15" font-weight="700">자녀 (1/2/3명+)</text>
    <text x="750" y="1570" text-anchor="end" fill="#86EFAC" font-size="15" font-weight="800">25·55·95만</text>

    <text x="800" y="1540" fill="#FFFFFF" font-size="15" font-weight="700">결혼 (2024~2026)</text>
    <text x="1120" y="1540" text-anchor="end" fill="#FCD34D" font-size="15" font-weight="800">부부 100만 (신설)</text>

    <text x="800" y="1570" fill="#FFFFFF" font-size="15" font-weight="700">체육시설 (신설)</text>
    <text x="1120" y="1570" text-anchor="end" fill="#FCD34D" font-size="15" font-weight="800">300만 × 30%</text>

    <text x="80" y="1610" fill="#FCA5A5" font-size="13" font-weight="700">※ 신용카드 공제는 총급여 25% 초과분부터 · 소득 구간에 따라 공제율 변동</text>
  </g>

  <text x="60" y="1670" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 자료: 국세청·기획재정부 (2026.04 기준)</text>
</svg>
