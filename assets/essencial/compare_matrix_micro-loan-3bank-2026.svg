  <text x="865" y="700" font-family="sans-serif" font-size="15" fill="#065F46" text-anchor="middle">연체 있으면 SGI 발급 불가</text>

  <text x="540" y="770" font-family="sans-serif" font-size="17" fill="#B45309" text-anchor="middle">SGI 보증서 발급 = 승인의 결정적 요인 (은행 자체 심사보다 중요)</text>

  <!-- DSR 예외 -->
  <rect x="40" y="820" width="1000" height="80" rx="16" fill="#B45309"/>
  <text x="540" y="853" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">스트레스 DSR 3단계 (2025.07~) : 300만 이하 소액 = 예외 적용</text>
  <text x="540" y="885" font-family="sans-serif" font-size="17" fill="#FDE68A" text-anchor="middle">실제 금리 + 1.5% 스트레스 금리 → 대출 한도 축소 | 단, 비상금 대출은 DSR 영향 미미</text>

  <!-- 경고 -->
  <rect x="40" y="930" width="1000" height="55" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="540" y="955" font-family="sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">한도 100% 사용 → 이자 출금 시 잔액 부족 → 의도치 않은 연체 발생 위험</text>
  <text x="540" y="978" font-family="sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">연체 시 '대출 금리 + 연 3%' 가산 + 신용점수 급락 | 한도의 90% 이하 사용 권장</text>

  <text x="540" y="1050" font-family="sans-serif" font-size="15" fill="#9CA3AF" text-anchor="middle">2026년 4월 기준 | 금융감독원·각 은행 공시 기반 | 개인 신용점수에 따라 실제 금리 상이</text>
</svg>