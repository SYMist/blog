  <rect x="40" y="365" width="1000" height="45" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="140" y="394" font-family="sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">금리 상한</text>
  <text x="370" y="394" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">15.0%</text>
  <text x="590" y="394" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">15.0%</text>
  <text x="810" y="394" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">15.0%</text>
  <text x="970" y="394" font-family="sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">동일</text>

  <rect x="40" y="415" width="1000" height="45" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
