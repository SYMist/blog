  <rect x="420" y="160" width="240" height="60" rx="12" fill="#FFFBEB"/>
  <text x="540" y="185" font-family="sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">필요 금액만 인출</text>
  <text x="540" y="210" font-family="sans-serif" font-size="16" fill="#92400E" text-anchor="middle">인출액×일수 이자만</text>
