  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg2)"/>

  <text x="540" y="50" font-family="sans-serif" font-size="30" font-weight="900" fill="#111827" text-anchor="middle">비상금 대출 구조 + 승인 전략 매트릭스</text>
  <text x="540" y="82" font-family="sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">2026년 4월 기준 | SGI 보증 마이너스통장 | 스트레스 DSR 예외</text>

