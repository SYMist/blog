  <rect x="70" y="160" width="290" height="60" rx="12" fill="#FFFBEB"/>
  <text x="215" y="185" font-family="sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">한도 설정</text>
  <text x="215" y="210" font-family="sans-serif" font-size="16" fill="#92400E" text-anchor="middle">이자 0원 (미사용 시)</text>
