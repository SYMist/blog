  <text x="140" y="494" font-family="sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">최대 연장</text>
  <text x="370" y="494" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">연장 심사</text>
  <text x="590" y="494" font-family="sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">연장 심사</text>
  <text x="810" y="494" font-family="sans-serif" font-size="17" font-weight="900" fill="#059669" text-anchor="middle">최대 10년</text>
  <text x="970" y="494" font-family="sans-serif" font-size="16" font-weight="900" fill="#059669" text-anchor="middle">케이</text>

