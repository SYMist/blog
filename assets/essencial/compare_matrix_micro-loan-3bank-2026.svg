  <rect x="395" y="645" width="290" height="70" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="540" y="673" font-family="sans-serif" font-size="17" font-weight="800" fill="#92400E" text-anchor="middle">신용카드 이력 관리</text>
