  <text x="60" y="270" fill="#E2E8F0" font-size="28" font-weight="600" font-family="sans-serif">유효기간·검사 비용·과태료 피하는 법</text>

  <rect x="60" y="300" width="130" height="34" rx="17" fill="#FEF3C7"/>
