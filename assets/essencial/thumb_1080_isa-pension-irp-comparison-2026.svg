<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <rect x="60" y="60" width="380" height="44" rx="22" fill="#B45309"/>
  <text x="250" y="90" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">2026 ISA·연금저축·IRP 비교</text>

  <text x="60" y="210" fill="#FFFFFF" font-size="62" font-weight="800" font-family="sans-serif">ISA · 연금저축 · IRP</text>
  <text x="60" y="285" fill="#FCD34D" font-size="64" font-weight="800" font-family="sans-serif">세제혜택 총정리</text>
  <text x="60" y="350" fill="#FFFFFF" font-size="30" font-weight="600" font-family="sans-serif">납입전략이 환급액을 결정한다</text>

  <!-- Card 1: ISA -->
  <rect x="60" y="400" width="960" height="173" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="90" y="445" fill="#FCD34D" font-size="17" font-weight="700" font-family="sans-serif">ISA (개인종합자산관리계좌)</text>
  <text x="90" y="505" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">비과세 200만 / 손익통산</text>
  <text x="990" y="445" text-anchor="end" fill="#FCD34D" font-size="16" font-weight="600" font-family="sans-serif">연 2,000만 납입</text>
  <text x="990" y="505" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">3년 후 자유 인출</text>
  <text x="90" y="548" fill="#D97706" font-size="15" font-weight="700" font-family="sans-serif">서민·농어민형 400만 비과세 · 초과 분리과세 9.9% · 주식 직접투자 가능</text>

  <!-- Card 2: 연금저축+IRP -->
  <rect x="60" y="593" width="960" height="173" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="90" y="638" fill="#6EE7B7" font-size="17" font-weight="700" font-family="sans-serif">연금저축 + IRP (세액공제 최적조합)</text>
  <text x="90" y="698" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">합산 900만 × 16.5% = 148.5만</text>
  <text x="990" y="638" text-anchor="end" fill="#6EE7B7" font-size="16" font-weight="600" font-family="sans-serif">연금저축 600만</text>
  <text x="990" y="698" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">+ IRP 300만</text>
  <text x="90" y="741" fill="#10B981" font-size="15" font-weight="700" font-family="sans-serif">연금소득세 3.3~5.5% · 과세이연 · 55세 이후 수령</text>

  <!-- Card 3: 만기이전 전략 -->
  <rect x="60" y="786" width="960" height="173" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="90" y="831" fill="#FCD34D" font-size="17" font-weight="700" font-family="sans-serif">ISA 만기 연금이전 추가전략</text>
  <text x="90" y="891" fill="#FFFFFF" font-size="48" font-weight="800" font-family="sans-serif">추가 공제 300만 → 연 198만 환급</text>
  <text x="990" y="831" text-anchor="end" fill="#FCD34D" font-size="16" font-weight="600" font-family="sans-serif">3,000만↑ 이전 시</text>
  <text x="990" y="891" text-anchor="end" fill="#CBD5E1" font-size="18" font-family="sans-serif">최대 300만 공제</text>
  <text x="90" y="934" fill="#D97706" font-size="15" font-weight="700" font-family="sans-serif">이전금액 10%, 한도 300만 · 해당 연도 연금계좌 반영 · 매년 이전 가능</text>

  <text x="60" y="1042" fill="#64748B" font-size="15" font-family="sans-serif">essencial | 대출·금융 silo · 2026.04 기준</text>
</svg>
