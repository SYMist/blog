<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="400" height="44" rx="22" fill="#B45309"/>
  <text x="260" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 보금자리론 vs 디딤돌대출 비교</text>

  <text x="60" y="175" fill="#FFFFFF" font-size="56" font-weight="800" font-family="sans-serif">보금자리론 vs 디딤돌</text>
  <text x="60" y="246" fill="#FCD34D" font-size="56" font-weight="800" font-family="sans-serif">금리 최대 2%p 차이</text>
  <text x="60" y="305" fill="#94A3B8" font-size="22" font-weight="600" font-family="sans-serif">소득 6,000만↓ → 디딤돌 2.55%~ · 초과 → 보금자리론 4.60%~</text>

  <!-- 3 key cards -->
  <rect x="60" y="352" width="330" height="198" rx="16" fill="url(#card)" stroke="#0F766E" stroke-width="2"/>
  <text x="225" y="392" text-anchor="middle" fill="#6EE7B7" font-size="17" font-weight="700" font-family="sans-serif">디딤돌 최저 금리</text>
  <text x="225" y="445" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">2.55%</text>
  <text x="225" y="482" text-anchor="middle" fill="#10B981" font-size="15" font-weight="600" font-family="sans-serif">신혼·생애최초 특별금리</text>
  <text x="225" y="510" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">소득 6,000만↓ · 주택 5억↓</text>
  <text x="225" y="534" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">세대원 전원 무주택</text>

  <rect x="410" y="352" width="330" height="198" rx="16" fill="url(#card)" stroke="#1E40AF" stroke-width="2"/>
  <text x="575" y="392" text-anchor="middle" fill="#93C5FD" font-size="17" font-weight="700" font-family="sans-serif">보금자리론 최저 금리</text>
  <text x="575" y="445" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">3.60%</text>
  <text x="575" y="482" text-anchor="middle" fill="#3B82F6" font-size="15" font-weight="600" font-family="sans-serif">우대금리 최대 1.0%p 적용</text>
  <text x="575" y="510" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">소득 7,000만↓ · 주택 6억↓</text>
  <text x="575" y="534" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">1주택자도 신청 가능</text>

  <rect x="760" y="352" width="380" height="198" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="950" y="392" text-anchor="middle" fill="#FCD34D" font-size="17" font-weight="700" font-family="sans-serif">선택 기준</text>
  <text x="950" y="435" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">소득 6,000만↓ + 무주택</text>
  <text x="950" y="464" text-anchor="middle" fill="#6EE7B7" font-size="18" font-weight="700" font-family="sans-serif">→ 디딤돌 우선</text>
  <text x="950" y="500" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">소득 초과 · 1주택자</text>
  <text x="950" y="529" text-anchor="middle" fill="#93C5FD" font-size="18" font-weight="700" font-family="sans-serif">→ 보금자리론</text>

  <text x="60" y="592" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 한국주택금융공사 공시 (2026.05.01 기준)</text>
</svg>
