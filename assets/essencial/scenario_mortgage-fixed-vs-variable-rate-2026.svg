<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <rect x="60" y="50" width="240" height="40" rx="20" fill="#B45309"/>
  <text x="180" y="77" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" font-family="sans-serif">차주 유형별 의사결정 가이드</text>

  <text x="60" y="150" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">나는 어떤 주담대를 골라야 할까?</text>
  <text x="60" y="192" fill="#FCD34D" font-size="20" font-weight="600" font-family="sans-serif">소득·한도·지역·가족 상황별 최적 전략 6가지</text>

  <!-- Scenario 1: 수도권 고가 -->
  <rect x="60" y="230" width="540" height="240" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="60" y="230" width="8" height="240" fill="#FCD34D"/>
  <text x="88" y="268" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 1</text>
  <text x="88" y="302" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">수도권 9억 + 한도 극대화</text>
  <text x="88" y="345" fill="#CBD5E1" font-size="15" font-family="sans-serif">연 1.2억 맞벌이, 수도권 9억 아파트 매수</text>
  <rect x="88" y="365" width="484" height="2" fill="#334155"/>
  <text x="88" y="395" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">→ 주기형 (고정) 추천</text>
  <text x="88" y="422" fill="#E2E8F0" font-size="14" font-family="sans-serif">스트레스 DSR 40% 반영 → 한도 6.4억 (변동 +1억)</text>
  <text x="88" y="448" fill="#86EFAC" font-size="14" font-family="sans-serif">핵심: 수도권 3%p 가산 하 유일한 한도 확보법</text>

  <!-- Scenario 2: 신생아 특례 -->
  <rect x="620" y="230" width="520" height="240" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="620" y="230" width="8" height="240" fill="#86EFAC"/>
  <text x="648" y="268" fill="#86EFAC" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 2</text>
  <text x="648" y="302" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">출산 1년 차 + 맞벌이 1.8억</text>
  <text x="648" y="345" fill="#CBD5E1" font-size="15" font-family="sans-serif">2025년 출산, 신축 5억 매수 예정</text>
  <rect x="648" y="365" width="464" height="2" fill="#334155"/>
  <text x="648" y="395" fill="#86EFAC" font-size="18" font-weight="800" font-family="sans-serif">→ 신생아 특례 디딤돌</text>
  <text x="648" y="422" fill="#E2E8F0" font-size="14" font-family="sans-serif">1.8~4.5% + 자녀 우대 0.2%p = 시중 대비 -3~5%p</text>
  <text x="648" y="448" fill="#86EFAC" font-size="14" font-family="sans-serif">핵심: 조건 충족 시 민간 상품 검토 불필요</text>

  <!-- Scenario 3: 지방 실수요 -->
  <rect x="60" y="490" width="540" height="240" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="60" y="490" width="8" height="240" fill="#86EFAC"/>
  <text x="88" y="528" fill="#86EFAC" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 3</text>
  <text x="88" y="562" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">지방 4억 + 5월 실행 계획</text>
  <text x="88" y="605" fill="#CBD5E1" font-size="15" font-family="sans-serif">부산 실수요, 연 7천만 단독명의</text>
  <rect x="88" y="625" width="484" height="2" fill="#334155"/>
  <text x="88" y="655" fill="#86EFAC" font-size="18" font-weight="800" font-family="sans-serif">→ 케이뱅크 주기형 (3.26%)</text>
  <text x="88" y="682" fill="#E2E8F0" font-size="14" font-family="sans-serif">2026.06까지 지방 0.75%p 완화 + 인터넷 최저가</text>
  <text x="88" y="708" fill="#86EFAC" font-size="14" font-family="sans-serif">핵심: 6월 완화 만료 전 실행이 한도 +α</text>

  <!-- Scenario 4: 인하 확신 -->
  <rect x="620" y="490" width="520" height="240" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="620" y="490" width="8" height="240" fill="#D97706"/>
  <text x="648" y="528" fill="#D97706" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 4</text>
  <text x="648" y="562" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">하반기 인하 확신 + 소액 2~3억</text>
  <text x="648" y="605" fill="#CBD5E1" font-size="15" font-family="sans-serif">자금 여력 있어 위험 감수 가능한 차주</text>
  <rect x="648" y="625" width="464" height="2" fill="#334155"/>
  <text x="648" y="655" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">→ 변동형 (코픽스)</text>
  <text x="648" y="682" fill="#E2E8F0" font-size="14" font-family="sans-serif">하단 3.61%로 초기 이자 절감 · 인하 즉시 반영</text>
  <text x="648" y="708" fill="#FCA5A5" font-size="14" font-family="sans-serif">핵심: 중동 리스크 재점화 시 이자 급등 각오</text>

  <!-- Scenario 5: 리스크 분산 -->
  <rect x="60" y="750" width="540" height="240" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="60" y="750" width="8" height="240" fill="#FCD34D"/>
  <text x="88" y="788" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 5</text>
  <text x="88" y="822" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">리스크 분산 + 중기 5~7년</text>
  <text x="88" y="865" fill="#CBD5E1" font-size="15" font-family="sans-serif">실거주 예정 기간 불확실, 이직 가능성</text>
  <rect x="88" y="885" width="484" height="2" fill="#334155"/>
  <text x="88" y="915" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">→ 혼합형 (5년 고정→변동)</text>
  <text x="88" y="942" fill="#E2E8F0" font-size="14" font-family="sans-serif">DSR 80% + 5년 방어 + 인하기 대환 옵션</text>
  <text x="88" y="968" fill="#86EFAC" font-size="14" font-family="sans-serif">핵심: '5년 버티기' 후 인하 본격화 시 갈아타기</text>

  <!-- Scenario 6: 대환 타이밍 -->
  <rect x="620" y="750" width="520" height="240" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <rect x="620" y="750" width="8" height="240" fill="#FCA5A5"/>
  <text x="648" y="788" fill="#FCA5A5" font-size="15" font-weight="800" font-family="sans-serif">SCENARIO 6</text>
  <text x="648" y="822" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">기존 4%대 대출 + 인하 대기</text>
  <text x="648" y="865" fill="#CBD5E1" font-size="15" font-family="sans-serif">2~3년 전 5%대로 받아 놓은 잔액 5억</text>
  <rect x="648" y="885" width="464" height="2" fill="#334155"/>
  <text x="648" y="915" fill="#FCA5A5" font-size="18" font-weight="800" font-family="sans-serif">→ 수수료 확인 후 대환 타이밍</text>
  <text x="648" y="942" fill="#E2E8F0" font-size="14" font-family="sans-serif">KB 0.75% · 우리 0.95% 인상 반영 손익분기 계산</text>
  <text x="648" y="968" fill="#86EFAC" font-size="14" font-family="sans-serif">핵심: 3년 경과 시 수수료 소멸, 그 이후가 유리</text>

  <!-- 대환 손익분기 공식 카드 -->
  <rect x="60" y="1020" width="1080" height="230" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="80" y="1065" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">대환(갈아타기) 손익분기 공식</text>

  <g font-family="sans-serif">
    <text x="80" y="1105" fill="#FFFFFF" font-size="16" font-weight="700">▶ 비용 = (기존 잔액 × 중도상환수수료율) + 부대비용(인지세·채권매입)</text>
    <text x="80" y="1135" fill="#FFFFFF" font-size="16" font-weight="700">▶ 편익 = (기존 이자 − 신규 이자) × 잔여 기간</text>
    <text x="80" y="1165" fill="#FFFFFF" font-size="16" font-weight="700">▶ 판단: 편익 &gt; 비용 = 대환 이득</text>

    <rect x="80" y="1185" width="1040" height="50" rx="10" fill="#064E3B" opacity="0.4" stroke="#86EFAC" stroke-width="1"/>
    <text x="100" y="1210" fill="#86EFAC" font-size="14" font-weight="800">예시</text>
    <text x="160" y="1210" fill="#E2E8F0" font-size="14">잔액 5억·금리 5.2%→3.8%·잔여 20년 · 비용 425만 vs 편익 6,000~7,000만 →</text>
    <text x="1108" y="1210" text-anchor="end" fill="#86EFAC" font-size="14" font-weight="800">대환 이득</text>
    <text x="100" y="1228" fill="#CBD5E1" font-size="13">※ 디딤돌 등 정책상품은 2026.12.31까지 수수료 면제 이벤트 운영</text>
  </g>

  <!-- 지금 바로 확인 6단계 -->
  <rect x="60" y="1280" width="1080" height="300" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="80" y="1325" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">신청 전 확인 체크리스트 6단계</text>

  <g font-family="sans-serif">
    <circle cx="105" cy="1370" r="20" fill="#B45309"/>
    <text x="105" y="1377" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">1</text>
    <text x="140" y="1365" fill="#FFFFFF" font-size="16" font-weight="700">신용점수 무료 조회</text>
    <text x="140" y="1388" fill="#CBD5E1" font-size="13">토스·카카오페이·올크레딧 — 800점 이상이면 우대 적용</text>

    <circle cx="625" cy="1370" r="20" fill="#B45309"/>
    <text x="625" y="1377" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">2</text>
    <text x="660" y="1365" fill="#FFFFFF" font-size="16" font-weight="700">정책 모기지 자격 스크리닝</text>
    <text x="660" y="1388" fill="#CBD5E1" font-size="13">2년 내 출산·무주택·소득 2억 → 신생아 특례 최우선</text>

    <circle cx="105" cy="1435" r="20" fill="#B45309"/>
    <text x="105" y="1442" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">3</text>
    <text x="140" y="1430" fill="#FFFFFF" font-size="16" font-weight="700">사전 한도 조회 (가심사)</text>
    <text x="140" y="1453" fill="#CBD5E1" font-size="13">케이뱅크·카카오뱅크 앱 — 신용 영향 없음</text>

    <circle cx="625" cy="1435" r="20" fill="#B45309"/>
    <text x="625" y="1442" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">4</text>
    <text x="660" y="1430" fill="#FFFFFF" font-size="16" font-weight="700">스트레스 DSR 3종 한도</text>
    <text x="660" y="1453" fill="#CBD5E1" font-size="13">주기형·혼합형·변동형 각각 조회 → 자금 확보 가능한 것</text>

    <circle cx="105" cy="1500" r="20" fill="#B45309"/>
    <text x="105" y="1507" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">5</text>
    <text x="140" y="1495" fill="#FFFFFF" font-size="16" font-weight="700">지역 완화 타이밍 확인</text>
    <text x="140" y="1518" fill="#CBD5E1" font-size="13">지방 거주자는 2026.06 이전 실행으로 0.75%p 완화 활용</text>

    <circle cx="625" cy="1500" r="20" fill="#B45309"/>
    <text x="625" y="1507" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">6</text>
    <text x="660" y="1495" fill="#FFFFFF" font-size="16" font-weight="700">중도상환수수료 조항</text>
    <text x="660" y="1518" fill="#CBD5E1" font-size="13">대환 가능성 있으면 3년 내 면제·감경 상품 우선 선택</text>

    <text x="80" y="1565" fill="#FCA5A5" font-size="14" font-weight="700">⚠ 여러 은행 동시 가심사 남발 주의 — 단기간 집중 조회는 신용평가 반영</text>
  </g>

  <text x="60" y="1645" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 자료: 한은·금감원·주금공·은행연합회 (2026.04 기준)</text>
</svg>
