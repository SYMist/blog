<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Chip -->
  <rect x="480" y="44" width="240" height="36" rx="18" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="67" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700" font-family="sans-serif">보험 비교 · 2026.05 기준</text>

  <!-- Title -->
  <text x="600" y="154" text-anchor="middle" fill="#FFFFFF" font-size="52" font-weight="800" font-family="sans-serif">태아보험 vs 어린이보험</text>
  <text x="600" y="204" text-anchor="middle" fill="#94A3B8" font-size="22" font-family="sans-serif">가입시기 · 보장범위 · 만기 전략 완전 비교</text>

  <!-- Divider -->
  <rect x="200" y="228" width="800" height="3" rx="1.5" fill="url(#purpleGrad)"/>

  <!-- 3 key points horizontal -->
  <rect x="60" y="252" width="340" height="160" rx="12" fill="#3b0764" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="230" y="290" text-anchor="middle" fill="#C4B5FD" font-size="15" font-weight="800" font-family="sans-serif">태아보험 (22주 이내)</text>
  <text x="100" y="326" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 선천성이상·미숙아 특약</text>
  <text x="100" y="352" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 산모 특약 추가 가능</text>
  <text x="230" y="394" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">월 4만~7만원</text>

  <rect x="430" y="252" width="340" height="160" rx="12" fill="#134e4a" fill-opacity="0.5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="600" y="290" text-anchor="middle" fill="#6EE7B7" font-size="15" font-weight="800" font-family="sans-serif">어린이보험 (출생 후)</text>
  <text x="470" y="326" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">❌ 태아특약 불가</text>
  <text x="470" y="352" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">✅ 일반 어린이 보장 동일</text>
  <text x="600" y="394" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">월 3만~5만원</text>

  <rect x="800" y="252" width="340" height="160" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="970" y="290" text-anchor="middle" fill="#A5B4FC" font-size="15" font-weight="800" font-family="sans-serif">만기 전략 (공통)</text>
  <text x="840" y="326" fill="#A5B4FC" font-size="13" font-weight="700" font-family="sans-serif">30세 만기 저렴하게 가입</text>
  <text x="840" y="352" fill="#FFFFFF" font-size="13" font-family="sans-serif">↓ 만기 전 계약전환 신청</text>
  <text x="970" y="394" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="800" font-family="sans-serif">건강 무관 장기 보장</text>

  <!-- Bottom bar -->
  <rect x="60" y="440" width="1080" height="70" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="600" y="476" text-anchor="middle" fill="#FCD34D" font-size="18" font-weight="800" font-family="sans-serif">22주 이내 → 태아보험 즉시  |  출생 후 → 어린이보험 즉시 (0세 최저)</text>
  <text x="600" y="500" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">22주 지나면 태아특약 영구 불가 — 지금이 마지막 기회</text>

  <text x="600" y="580" text-anchor="middle" fill="#475569" font-size="13" font-family="sans-serif">essencial | 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 가입 전 약관 확인 필요</text>

  <!-- Decorative -->
  <circle cx="60" cy="60" r="80" fill="#7C3AED" fill-opacity="0.05"/>
  <circle cx="1140" cy="570" r="80" fill="#0F766E" fill-opacity="0.05"/>
</svg>
