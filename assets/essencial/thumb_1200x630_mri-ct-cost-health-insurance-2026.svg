<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="200" height="36" rx="18" fill="#0F766E"/>
  <text x="160" y="74" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">2026 5세대 실손</text>

  <text x="60" y="145" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">MRI vs CT 비용 비교</text>
  <text x="60" y="200" fill="#FFFFFF" font-size="38" font-weight="800" font-family="sans-serif">건강보험 적용·본인부담 (2026)</text>

  <text x="60" y="255" fill="#E2E8F0" font-size="24" font-weight="600" font-family="sans-serif">종별 부담률·비급여 편차·조영제까지 한번에</text>

  <rect x="60" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="120" y="308" text-anchor="middle" fill="#92400E" font-size="15" font-weight="700" font-family="sans-serif">급여기준</text>
  <rect x="195" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="255" y="308" text-anchor="middle" fill="#92400E" font-size="15" font-weight="700" font-family="sans-serif">본인부담</text>
  <rect x="330" y="285" width="130" height="34" rx="17" fill="#FEF3C7"/>
  <text x="395" y="308" text-anchor="middle" fill="#92400E" font-size="15" font-weight="700" font-family="sans-serif">5세대실손</text>

  <rect x="60" y="345" width="500" height="3" rx="2" fill="#0F766E" opacity="0.5"/>

  <text x="60" y="395" fill="#5EEAD4" font-size="20" font-weight="600" font-family="sans-serif">CT</text>
  <text x="60" y="430" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">빠르고 저렴 · 폐·뼈·급성 출혈</text>

  <text x="60" y="480" fill="#2DD4BF" font-size="20" font-weight="600" font-family="sans-serif">MRI</text>
  <text x="60" y="515" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">정밀·무방사선 · 뇌·신경·디스크</text>

  <!-- Right card -->
  <rect x="850" y="100" width="280" height="420" rx="20" fill="#1e293b" opacity="0.8"/>
  <text x="990" y="148" text-anchor="middle" fill="#5EEAD4" font-size="18" font-weight="700" font-family="sans-serif">2026 핵심 숫자</text>

  <text x="990" y="185" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">단순 두통 선별급여</text>
  <text x="990" y="210" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">80% 본인부담</text>

  <rect x="870" y="225" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="255" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">5세대 비급여 자부담</text>
  <text x="990" y="280" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">30% → 50%</text>

  <rect x="870" y="295" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="325" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">상급종합 뇌 MRI</text>
  <text x="990" y="350" text-anchor="middle" fill="#FCA5A5" font-size="20" font-weight="800" font-family="sans-serif">22~30만 원</text>

  <rect x="870" y="365" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="395" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">의원 뇌 MRI</text>
  <text x="990" y="420" text-anchor="middle" fill="#2DD4BF" font-size="20" font-weight="800" font-family="sans-serif">8~12만 원</text>

  <rect x="870" y="440" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="470" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">실손 재가입 주기</text>
  <text x="990" y="495" text-anchor="middle" fill="#F87171" font-size="18" font-weight="700" font-family="sans-serif">15년 → 3년 단축</text>

  <text x="60" y="595" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 비교형 콘텐츠</text>
</svg>
