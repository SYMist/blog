<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Badge -->
  <rect x="370" y="120" width="340" height="50" rx="25" fill="#EF4444"/>
  <text x="540" y="153" text-anchor="middle" fill="#FFF" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">2026 비교분석</text>

  <!-- Main Text -->
  <text x="540" y="280" text-anchor="middle" fill="#FFFFFF" font-size="64" font-weight="900" font-family="Pretendard,sans-serif">50대 무릎</text>
  <text x="540" y="370" text-anchor="middle" fill="#FFFFFF" font-size="64" font-weight="900" font-family="Pretendard,sans-serif">인공관절 수술</text>

  <!-- Divider -->
  <rect x="340" y="410" width="400" height="5" rx="3" fill="url(#teal)"/>

  <!-- Sub Text -->
  <text x="540" y="490" text-anchor="middle" fill="#E2E8F0" font-size="38" font-weight="600" font-family="Pretendard,sans-serif">비용·건강보험 적용 비교</text>

  <!-- Highlight Box -->
  <rect x="160" y="550" width="760" height="200" rx="20" fill="#0F766E" opacity="0.15"/>
  <rect x="160" y="550" width="760" height="200" rx="20" stroke="#0D9488" stroke-width="2" fill="none"/>
  <text x="540" y="600" text-anchor="middle" fill="#5EEAD4" font-size="24" font-weight="700" font-family="Pretendard,sans-serif">수술 유형별 평균 비용</text>
  <text x="340" y="660" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="Pretendard,sans-serif">전치환 611만</text>
  <text x="740" y="660" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="Pretendard,sans-serif">부분치환 460만</text>
  <text x="340" y="720" text-anchor="middle" fill="#FDE68A" font-size="24" font-weight="700" font-family="Pretendard,sans-serif">로봇 +수백만</text>
  <text x="740" y="720" text-anchor="middle" fill="#C4B5FD" font-size="24" font-weight="700" font-family="Pretendard,sans-serif">줄기세포 850만</text>

  <!-- Chips -->
  <rect x="240" y="810" width="120" height="44" rx="22" fill="#F0FDFA"/>
  <text x="300" y="840" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="380" y="810" width="120" height="44" rx="22" fill="#F0FDFA"/>
  <text x="440" y="840" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">비용</text>
  <rect x="520" y="810" width="160" height="44" rx="22" fill="#F0FDFA"/>
  <text x="600" y="840" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">건강보험</text>
  <rect x="700" y="810" width="160" height="44" rx="22" fill="#F0FDFA"/>
  <text x="780" y="840" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">인공관절</text>

  <!-- Footer -->
  <text x="540" y="970" text-anchor="middle" fill="#64748B" font-size="22" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
