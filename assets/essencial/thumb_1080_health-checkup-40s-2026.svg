<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="0" fill="url(#tbg)"/>

  <!-- 배지 -->
  <rect x="390" y="200" width="300" height="52" rx="26" fill="#EF4444"/>
  <text x="540" y="233" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFF" text-anchor="middle">2026 최신 비교</text>

  <!-- 메인 텍스트 -->
  <text x="540" y="370" font-family="sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">40대 건강검진</text>
  <text x="540" y="460" font-family="sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">추가 항목 추천</text>

  <!-- 서브 텍스트 -->
  <text x="540" y="550" font-family="sans-serif" font-size="32" fill="#E2E8F0" text-anchor="middle">꼭 받아야 할 검사 비용 비교</text>

  <!-- 칩 -->
  <rect x="215" y="640" width="140" height="48" rx="24" fill="#FEF3C7"/>
  <text x="285" y="671" font-family="sans-serif" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">비교분석</text>

  <rect x="385" y="640" width="130" height="48" rx="24" fill="#FEF3C7"/>
  <text x="450" y="671" font-family="sans-serif" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">비용</text>

  <rect x="545" y="640" width="130" height="48" rx="24" fill="#FEF3C7"/>
  <text x="610" y="671" font-family="sans-serif" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">추천</text>

  <rect x="705" y="640" width="160" height="48" rx="24" fill="#FEF3C7"/>
  <text x="785" y="671" font-family="sans-serif" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">성별맞춤</text>

  <!-- 하단 -->
  <text x="540" y="820" font-family="sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">국가검진 vs 추가 검사 · 검진기관 vs 대학병원</text>
  <text x="540" y="860" font-family="sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">실비보험 청구 전략까지</text>
