<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">양도세 상황별 절세 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#FCD34D" font-size="13" font-family="sans-serif">1주택·일시적 2주택·다주택·12억 초과·조정지역 · 2026.05</text>

  <!-- Scenario 1: 1주택 비과세 -->
  <rect x="40" y="90" width="480" height="116" rx="10" fill="#14532d" fill-opacity="0.6" stroke="#15803D" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#15803D"/>
  <rect x="40" y="112" width="480" height="14" fill="#15803D"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 1주택 2년+ 보유 · 양도가 12억 이하</text>
  <text x="60" y="148" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">→ 1주택 비과세 (세액 0원)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">추가 조치 불필요 · 양도일 기준 1세대 1주택 확인</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">조정지역 취득이면 2년 거주 추가 요건 점검</text>

  <!-- Scenario 2: 일시적 2주택 -->
  <rect x="560" y="90" width="480" height="116" rx="10" fill="#14532d" fill-opacity="0.6" stroke="#15803D" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#15803D"/>
  <rect x="560" y="112" width="480" height="14" fill="#15803D"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 신규 주택 취득 + 종전 처분 확실</text>
  <text x="580" y="148" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">→ 일시적 2주택 (세액 0원)</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">신규 취득일 + 3년 처분 기한 캘린더 등록</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">종전 취득 후 1년 경과 조건도 사전 확인 필수</text>

  <!-- Scenario 3: 3년 처분 어려움 -->
  <rect x="40" y="226" width="480" height="116" rx="10" fill="#7C2D12" fill-opacity="0.5" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="40" y="226" width="480" height="36" rx="10" fill="#EA580C"/>
  <rect x="40" y="248" width="480" height="14" fill="#EA580C"/>
  <text x="60" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 3년 내 처분 어려움 우려</text>
  <text x="60" y="284" fill="#FDBA74" font-size="13" font-weight="700" font-family="sans-serif">→ 신규 취득 시기 조정 또는 임대등록 검토</text>
  <text x="60" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">3년 초과 시 비과세 통째 상실 → 5,200만원+ 손실</text>
  <text x="60" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">임대등록·임대사업자 활용으로 양도세 감면 검토</text>

  <!-- Scenario 4: 12억 초과 -->
  <rect x="560" y="226" width="480" height="116" rx="10" fill="#155e75" fill-opacity="0.6" stroke="#0e7490" stroke-width="1.5"/>
  <rect x="560" y="226" width="480" height="36" rx="10" fill="#0e7490"/>
  <rect x="560" y="248" width="480" height="14" fill="#0e7490"/>
  <text x="580" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ 양도가 12억 초과 1주택</text>
  <text x="580" y="284" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">→ 장기보유공제 80% 활용 (10년+ 보유·거주)</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">14억 양도 시 장기공제 후 세액 약 400만원만 발생</text>
  <text x="580" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">상생임대 특례로 거주 면제 가능 (2026.12까지)</text>

  <!-- Scenario 5: 다주택 정리 -->
  <rect x="40" y="362" width="1000" height="116" rx="10" fill="#7f1d1d" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="40" y="362" width="1000" height="36" rx="10" fill="#DC2626"/>
  <rect x="40" y="384" width="1000" height="14" fill="#DC2626"/>
  <text x="60" y="386" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 다주택 정리 의향 (조정지역 포함)</text>
  <text x="60" y="420" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">→ 보유 주택 매도 순서 시뮬레이션 (조정지역 가산 회피)</text>
  <text x="60" y="442" fill="#CBD5E1" font-size="12" font-family="sans-serif">조정지역 외 주택 우선 매도 → 마지막에 조정지역 + 1주택 비과세 적용</text>
  <text x="60" y="464" fill="#CBD5E1" font-size="12" font-family="sans-serif">매도 순서 잘못하면 최대 1억원+ 가산세 발생 → 세무사 상담 필수</text>

  <!-- Summary -->
  <rect x="40" y="496" width="1000" height="176" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="528" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 결론 3줄 요약</text>
  <text x="80" y="562" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">비과세 2종</text>
  <text x="250" y="562" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 1주택 (2년 보유 + 12억) · 일시적 2주택 (3년 내 처분)</text>
  <text x="80" y="594" fill="#FDBA74" font-size="13" font-weight="700" font-family="sans-serif">3년 룰 위반</text>
  <text x="250" y="594" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 양도차익 5억 기준 약 5,200만원 손실 (비과세 통째 상실)</text>
  <text x="80" y="626" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">다주택 가산</text>
  <text x="250" y="626" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 조정지역 다주택 20%p 가산 (2026.05.10 이후) · 매도 순서 핵심</text>
  <text x="80" y="654" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 본 시뮬레이션 추정치 · 본인 케이스는 홈택스 양도세 계산기 또는 세무사 상담 권장</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 대출·금융 · 2026.05 기준 · 양도 전 본인 케이스 시뮬레이션 + 세무사 상담 필수</text>
</svg>
