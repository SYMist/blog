<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">세대별 전환 상황별 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#DDD6FE" font-size="13" font-family="sans-serif">1·2·3·4세대 가입자 + 신규(5세대) 케이스 6종 · 2026.05</text>

  <!-- Scenario 1: 1·2세대 유지 -->
  <rect x="40" y="90" width="480" height="116" rx="10" fill="#14532d" fill-opacity="0.6" stroke="#15803D" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#15803D"/>
  <rect x="40" y="112" width="480" height="14" fill="#15803D"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 1·2세대 + 도수치료·MRI 자주 사용</text>
  <text x="60" y="148" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">→ 무조건 유지 (자기부담 0~20% 압도적)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">시장에서 다시는 나올 수 없는 조건</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">보험료 부담 시 단독보험 분리·감액 등 대안 검토</text>

  <!-- Scenario 2: 3세대 전환 -->
  <rect x="560" y="90" width="480" height="116" rx="10" fill="#0c4a6e" fill-opacity="0.6" stroke="#0e7490" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#0e7490"/>
  <rect x="560" y="112" width="480" height="14" fill="#0e7490"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 3세대 + 도수치료 연 12회 이하</text>
  <text x="580" y="148" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">→ 4세대 전환 검토 (월 2만 절감)</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">5년 누적 보험료 절감 약 120만원</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">단, 4세대 신규 가입 가능 여부 확인 필수 (2026.05.06 종료)</text>

  <!-- Scenario 3: 3세대 유지 -->
  <rect x="40" y="226" width="480" height="116" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="40" y="226" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="40" y="248" width="480" height="14" fill="#D97706"/>
  <text x="60" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 3세대 + 도수치료 연 20회 이상</text>
  <text x="60" y="284" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 3세대 유지 (사용량 할증 회피)</text>
  <text x="60" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">4세대 사용량 할증으로 5년 30만~180만 추가 부담</text>
  <text x="60" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">월 보험료 차이보다 비급여 부담이 커짐</text>

  <!-- Scenario 4: 4세대 절대 금지 -->
  <rect x="560" y="226" width="480" height="116" rx="10" fill="#7f1d1d" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="560" y="226" width="480" height="36" rx="10" fill="#DC2626"/>
  <rect x="560" y="248" width="480" height="14" fill="#DC2626"/>
  <text x="580" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ 4세대 + 도수치료 자주 사용 ⚠️</text>
  <text x="580" y="284" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">→ 5세대 전환 절대 금지</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">5세대 도수치료 100% 자비 → 5년 약 940만 추가 부담</text>
  <text x="580" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">한 번 전환하면 4세대로 되돌릴 수 없음</text>

  <!-- Scenario 5: 4세대 → 5세대 OK 및 신규 -->
  <rect x="40" y="362" width="1000" height="116" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="40" y="362" width="1000" height="36" rx="10" fill="#4F46E5"/>
  <rect x="40" y="384" width="1000" height="14" fill="#4F46E5"/>
  <text x="60" y="386" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 4세대 + 병원 거의 안 씀 / 신규 가입 (2026.05+)</text>
  <text x="60" y="420" fill="#A5B4FC" font-size="13" font-weight="700" font-family="sans-serif">→ 5세대 전환·신규 가입 가능 (보험료 추가 절감)</text>
  <text x="60" y="442" fill="#CBD5E1" font-size="12" font-family="sans-serif">월 1만원 추가 절감 + 도수치료 거의 안 쓰면 손실 없음</text>
  <text x="60" y="464" fill="#CBD5E1" font-size="12" font-family="sans-serif">신규 가입자는 5세대만 선택 가능 (4세대 신규 종료) + 단독 도수치료보험 별도 검토</text>

  <!-- Summary -->
  <rect x="40" y="496" width="1000" height="176" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="528" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 결론 3줄 요약</text>
  <text x="80" y="562" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">1·2세대</text>
  <text x="250" y="562" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 무조건 유지 (자기부담 0~20% 압도적, 시장에 없는 조건)</text>
  <text x="80" y="594" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">3세대 가입자</text>
  <text x="250" y="594" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 도수치료 사용량에 따라 4세대 전환 vs 유지 결정 (손익분기 12회/년)</text>
  <text x="80" y="626" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">4세대 가입자</text>
  <text x="250" y="626" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 도수치료 자주 사용 시 5세대 절대 금지 (5년 940만 추가)</text>
  <text x="80" y="654" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 2026.05.06 4세대 신규 가입 종료 + 5세대 출시 (도수치료 비중증 비급여 분류로 보장 제외)</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 본인 약관 시뮬레이션 후 결정 · 일반 정보 (보험 자문 아님)</text>
</svg>
