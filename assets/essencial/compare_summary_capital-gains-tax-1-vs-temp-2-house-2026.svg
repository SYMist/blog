<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">양도세 1주택 비과세 vs 일시적 2주택</text>
  <text x="540" y="92" text-anchor="middle" fill="#FCD34D" font-size="16" font-family="sans-serif">양도차익 5억원 기준 시뮬레이션 · 2026.05</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">3년 룰 위반 시 손실 (양도차익 5억 기준)</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">비과세 0원 vs 과세 5,200만원 · 격차 5,200만</text>

  <!-- Two cards -->
  <rect x="40" y="216" width="495" height="370" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="288" y="262" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">비과세 (BEST)</text>
  <text x="288" y="290" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">1주택 또는 일시적 2주택 3년 내 처분</text>
  <line x1="70" y1="312" x2="505" y2="312" stroke="#14532d" stroke-width="1.5"/>
  <text x="288" y="354" text-anchor="middle" fill="#86EFAC" font-size="32" font-weight="800" font-family="sans-serif">세액 0원</text>
  <text x="288" y="384" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">양도차익 5억 전액 비과세</text>
  <line x1="70" y1="406" x2="505" y2="406" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="438" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 1주택 2년+ 보유 (조정지역 거주)</text>
  <text x="80" y="464" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 양도가 12억원 이하</text>
  <text x="80" y="490" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 일시적 2주택: 3년 내 종전 처분</text>
  <text x="80" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 상생임대 특례로 거주 면제 가능</text>
  <rect x="80" y="538" width="416" height="32" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="288" y="560" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">조건 충족이면 무조건 비과세</text>

  <rect x="545" y="216" width="495" height="370" rx="18" fill="url(#redGrad)" fill-opacity="0.9" stroke="#DC2626" stroke-width="2"/>
  <text x="793" y="262" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">과세 (WORST)</text>
  <text x="793" y="290" text-anchor="middle" fill="#FCA5A5" font-size="15" font-family="sans-serif">3년 초과·다주택·조정지역 가산</text>
  <line x1="575" y1="312" x2="1010" y2="312" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="793" y="354" text-anchor="middle" fill="#FCA5A5" font-size="32" font-weight="800" font-family="sans-serif">최대 2.4억원</text>
  <text x="793" y="384" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">다주택 + 조정지역 가산 (양도차익 5억)</text>
  <line x1="575" y1="406" x2="1010" y2="406" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="585" y="438" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">❌ 일시적 2주택 3년 초과: 5,200만원</text>
  <text x="585" y="464" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">❌ 다주택 일반: 약 1.44억원</text>
  <text x="585" y="490" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">❌ + 조정지역 20%p 가산: +1억원</text>
  <text x="585" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 2026.05.10 이후 가산 적용</text>
  <rect x="585" y="538" width="416" height="32" rx="8" fill="#DC2626" fill-opacity="0.4"/>
  <text x="793" y="560" text-anchor="middle" fill="#FECACA" font-size="14" font-weight="700" font-family="sans-serif">매도 순서·타이밍 시뮬레이션 필수</text>

  <text x="40" y="618" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 대출·금융 · 2026.05 기준 · 장기보유공제·기본공제 250만 반영 · 본인 케이스는 홈택스 계산기 확인</text>
</svg>
