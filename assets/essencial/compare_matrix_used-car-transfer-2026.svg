<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="32" fill="url(#bg2)"/>

  <text x="540" y="62" font-family="sans-serif" font-size="34" font-weight="900" fill="#111827" text-anchor="middle">차종별 취득세율 · 감면 매트릭스</text>
  <text x="540" y="97" font-family="sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">2026년 기준 | 비영업용 차량</text>

  <!-- 헤더 -->
  <rect x="50" y="130" width="980" height="55" rx="12" fill="#1E40AF"/>
  <text x="150" y="165" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">차량 유형</text>
  <text x="350" y="165" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">취득세율</text>
  <text x="550" y="165" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">감면 혜택</text>
  <text x="780" y="165" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">2,000만 원 차량 예시</text>

  <!-- 행 1: 일반 승용 -->
  <rect x="50" y="190" width="980" height="70" rx="0" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="150" y="232" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">일반 승용차</text>
  <text x="350" y="232" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">7%</text>
  <text x="550" y="232" font-family="sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">없음</text>
  <text x="780" y="225" font-family="sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">140만 원</text>
  <text x="780" y="250" font-family="sans-serif" font-size="15" fill="#6B7280" text-anchor="middle">(등록 5% + 취득 2%)</text>

  <!-- 행 2: 전기차 -->
  <rect x="50" y="265" width="980" height="70" rx="0" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="150" y="307" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">전기 · 수소차</text>
  <text x="350" y="307" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">7%</text>
  <text x="550" y="300" font-family="sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">140만 원 한도 면제</text>
  <text x="550" y="322" font-family="sans-serif" font-size="15" fill="#059669" text-anchor="middle">~2026.12.31</text>
  <text x="780" y="300" font-family="sans-serif" font-size="20" font-weight="800" fill="#059669" text-anchor="middle">0원</text>
  <text x="780" y="322" font-family="sans-serif" font-size="15" fill="#059669" text-anchor="middle">(140만 전액 감면)</text>

  <!-- 행 3: 경차 -->
  <rect x="50" y="340" width="980" height="70" rx="0" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="150" y="382" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">경차</text>
  <text x="350" y="382" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">4%</text>
  <text x="550" y="375" font-family="sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">75만 원 한도 감면</text>
  <text x="550" y="397" font-family="sans-serif" font-size="15" fill="#059669" text-anchor="middle">상시</text>
  <text x="780" y="375" font-family="sans-serif" font-size="20" font-weight="800" fill="#059669" text-anchor="middle">0원</text>
  <text x="780" y="397" font-family="sans-serif" font-size="15" fill="#059669" text-anchor="middle">(800만 원 차량 기준)</text>

  <!-- 행 4: 하이브리드 -->
  <rect x="50" y="415" width="980" height="70" rx="0" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="150" y="457" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">하이브리드</text>
  <text x="350" y="457" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">7%</text>
  <text x="550" y="450" font-family="sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">감면 종료 (2024말)</text>
  <text x="550" y="472" font-family="sans-serif" font-size="15" fill="#DC2626" text-anchor="middle">개소세 70만 감면만 유지</text>
  <text x="780" y="457" font-family="sans-serif" font-size="20" font-weight="800" fill="#DC2626" text-anchor="middle">140만 원 (감면 없음)</text>

  <!-- 행 5: 승합 11인+ -->
  <rect x="50" y="490" width="980" height="70" rx="0" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="150" y="532" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">승합 (11인+)</text>
  <text x="350" y="532" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">5%</text>
  <text x="550" y="532" font-family="sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">없음</text>
  <text x="780" y="532" font-family="sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">100만 원</text>

  <!-- 행 6: 화물 -->
  <rect x="50" y="565" width="980" height="70" rx="0" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="150" y="607" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">화물차</text>
  <text x="350" y="607" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">5%</text>
  <text x="550" y="607" font-family="sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">없음</text>
  <text x="780" y="607" font-family="sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">100만 원</text>

  <!-- 다자녀 감면 섹션 -->
  <rect x="50" y="670" width="980" height="120" rx="20" fill="#FFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="540" y="710" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E40AF" text-anchor="middle">다자녀 추가 감면 (~2027)</text>
  <rect x="90" y="730" width="420" height="44" rx="12" fill="#EFF6FF"/>
  <text x="300" y="758" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">3자녀 이상: 취득세 최대 140만 원 감면</text>
  <rect x="570" y="730" width="420" height="44" rx="12" fill="#EFF6FF"/>
  <text x="780" y="758" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">2자녀: 취득세 최대 70만 원 감면 (50%)</text>

  <!-- 범칙금 경고 -->
  <rect x="50" y="820" width="980" height="120" rx="20" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="540" y="860" font-family="sans-serif" font-size="22" font-weight="900" fill="#DC2626" text-anchor="middle">15일 기한 초과 범칙금</text>
  <rect x="90" y="880" width="290" height="44" rx="12" fill="#FFF"/>
  <text x="235" y="908" font-family="sans-serif" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">10일 이내: 10만 원</text>
  <rect x="400" y="880" width="290" height="44" rx="12" fill="#FFF"/>
  <text x="545" y="908" font-family="sans-serif" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">11~49일: 매일 +1만 원</text>
  <rect x="710" y="880" width="290" height="44" rx="12" fill="#FFF"/>
  <text x="855" y="908" font-family="sans-serif" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">50일+: 최대 50만 원</text>

  <text x="540" y="1000" font-family="sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">2026년 3월 기준 | 지방세법·자동차관리법 기반</text>
  <text x="540" y="1030" font-family="sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">지역·차종에 따라 공채·수수료가 달라질 수 있습니다</text>
</svg>
