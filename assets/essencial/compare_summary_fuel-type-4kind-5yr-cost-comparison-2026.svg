<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>

  <text x="540" y="58" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">LPG · 가솔린 · 디젤 · 하이브리드 5년 비교</text>
  <text x="540" y="92" text-anchor="middle" fill="#93C5FD" font-size="16" font-family="sans-serif">동급 중형 SUV · 연 1만 5천km · 2026.05 기준</text>

  <!-- Key stat -->
  <rect x="160" y="116" width="760" height="76" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">5년 TCO 격차 (LPG 최저 ↔ 하이브리드 최고)</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">약 519만원 차이 · 운전 패턴에 따라 정답 다름</text>

  <!-- Two cards -->
  <rect x="40" y="216" width="495" height="370" rx="18" fill="url(#greenGrad)" fill-opacity="0.9" stroke="#15803D" stroke-width="2"/>
  <text x="288" y="262" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">LPG (TCO 1위)</text>
  <text x="288" y="290" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">쏘렌토 LPG급 · 8km/L · 1,100원/L</text>
  <line x1="70" y1="312" x2="505" y2="312" stroke="#14532d" stroke-width="1.5"/>
  <text x="288" y="354" text-anchor="middle" fill="#86EFAC" font-size="28" font-weight="800" font-family="sans-serif">5년 TCO 약 4,216만원</text>
  <text x="288" y="384" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연료비 1,031만원 · 구매가 3,000만원</text>
  <line x1="70" y1="406" x2="505" y2="406" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="438" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 구매가 가장 저렴</text>
  <text x="80" y="464" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 연료 단가 가장 저렴 (1,100원/L)</text>
  <text x="80" y="490" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✅ 5년 TCO 가솔린 대비 294만원 절감</text>
  <text x="80" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 연비 낮음(8km/L) · 충전소 800곳 24시간</text>
  <rect x="80" y="538" width="416" height="32" rx="8" fill="#15803D" fill-opacity="0.4"/>
  <text x="288" y="560" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">단거리·근거리 운전에 압도적</text>

  <rect x="545" y="216" width="495" height="370" rx="18" fill="url(#blueGrad)" fill-opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
  <text x="793" y="262" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">하이브리드 (연료비 1위)</text>
  <text x="793" y="290" text-anchor="middle" fill="#BFDBFE" font-size="15" font-family="sans-serif">쏘렌토 HEV급 · 18km/L · 1,800원/L</text>
  <line x1="575" y1="312" x2="1010" y2="312" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="793" y="354" text-anchor="middle" fill="#BFDBFE" font-size="28" font-weight="800" font-family="sans-serif">5년 TCO 약 4,735만원</text>
  <text x="793" y="384" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연료비 750만원 · 구매가 3,800만원</text>
  <line x1="575" y1="406" x2="1010" y2="406" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="585" y="438" fill="#67E8F9" font-size="14" font-weight="700" font-family="sans-serif">✅ 연료비 가장 저렴 (5년 750만원)</text>
  <text x="585" y="464" fill="#67E8F9" font-size="14" font-weight="700" font-family="sans-serif">✅ 친환경 혜택 (취득세·주차·통행료)</text>
  <text x="585" y="490" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">❌ 구매가 800만원 비쌈 → 회수 9년</text>
  <text x="585" y="516" fill="#FFFFFF" font-size="14" font-family="sans-serif">— 도심 정체 출퇴근에서 실연비 25km/L+</text>
  <rect x="585" y="538" width="416" height="32" rx="8" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="793" y="560" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700" font-family="sans-serif">7년+ 장기 보유 + 도심 정체에 유리</text>

  <text x="40" y="618" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 가솔린 4,510만원 · 디젤 4,545만원 · 4종 모두 동급 중형 SUV 추정</text>
</svg>
