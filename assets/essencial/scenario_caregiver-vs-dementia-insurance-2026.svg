<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <text x="60" y="80" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">상황별 추천 — 50대 이후 보험 설계</text>
  <text x="60" y="115" fill="#C4B5FD" font-size="18" font-weight="600" font-family="sans-serif">연령·건강·가족력·예산 기준 우선순위 매칭</text>

  <!-- Card 1 -->
  <rect x="60" y="145" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="80" y="165" width="130" height="32" rx="16" fill="#7C3AED"/>
  <text x="145" y="187" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">50대 초반</text>
  <text x="80" y="225" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">가족력 없음·예산 2~3만</text>
  <text x="80" y="265" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">간병보험 단독</text>
  <text x="80" y="295" fill="#CBD5E1" font-size="14" font-family="sans-serif">일당 15만 + 재가급여 50만</text>
  <text x="80" y="318" fill="#CBD5E1" font-size="14" font-family="sans-serif">모든 원인 대응 + 한도 인상 커버</text>
  <text x="80" y="350" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">치매보험은 60대 이후 검토 가능</text>

  <!-- Card 2 -->
  <rect x="425" y="145" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="445" y="165" width="130" height="32" rx="16" fill="#7C3AED"/>
  <text x="510" y="187" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">가족력</text>
  <text x="445" y="225" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">50대 중반·직계 치매 이력</text>
  <text x="445" y="265" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">간병 + 치매 병행</text>
  <text x="445" y="295" fill="#CBD5E1" font-size="14" font-family="sans-serif">CDR 0.5 경증부터 보장</text>
  <text x="445" y="318" fill="#CBD5E1" font-size="14" font-family="sans-serif">월 100만 종신 생활자금</text>
  <text x="445" y="350" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">조기 가입 → 1년 면책 소진</text>

  <!-- Card 3 -->
  <rect x="790" y="145" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="810" y="165" width="130" height="32" rx="16" fill="#7C3AED"/>
  <text x="875" y="187" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">유병자</text>
  <text x="810" y="225" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">50후~60초·만성질환</text>
  <text x="810" y="265" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">간편심사 간병</text>
  <text x="810" y="295" fill="#CBD5E1" font-size="14" font-family="sans-serif">3·10·5 또는 3·5·5로 접근</text>
  <text x="810" y="318" fill="#CBD5E1" font-size="14" font-family="sans-serif">재가특약 우선 확보</text>
  <text x="810" y="350" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">치매는 면책 1년 후순위</text>

  <!-- Card 4 -->
  <rect x="60" y="395" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="80" y="415" width="130" height="32" rx="16" fill="#7C3AED"/>
  <text x="145" y="437" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">부모간병중</text>
  <text x="80" y="475" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">60초반·샌드위치 세대</text>
  <text x="80" y="515" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">지원일당 + 시설</text>
  <text x="80" y="545" fill="#CBD5E1" font-size="14" font-family="sans-serif">인력 직접 파견 편리성</text>
  <text x="80" y="568" fill="#CBD5E1" font-size="14" font-family="sans-serif">시설 입소 초기 안착 비용</text>
  <text x="80" y="600" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">직접 경험자에게 최적</text>

  <!-- Card 5 -->
  <rect x="425" y="395" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="445" y="415" width="130" height="32" rx="16" fill="#7C3AED"/>
  <text x="510" y="437" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">60후반</text>
  <text x="445" y="475" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">고연령·보험료 부담</text>
  <text x="445" y="515" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">간편심사 슬림</text>
  <text x="445" y="545" fill="#CBD5E1" font-size="14" font-family="sans-serif">일당·재가만 슬림 설계</text>
  <text x="445" y="568" fill="#CBD5E1" font-size="14" font-family="sans-serif">치매 1년 면책 체감 효용 낮음</text>
  <text x="445" y="600" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">3·3·5 복수 상품 견적</text>

  <!-- Card 6 -->
  <rect x="790" y="395" width="350" height="230" rx="16" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
  <rect x="810" y="415" width="130" height="32" rx="16" fill="#7C3AED"/>
  <text x="875" y="437" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">장기안정</text>
  <text x="810" y="475" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">예산 5만+·안정 추구</text>
  <text x="810" y="515" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">비갱신 풀패키지</text>
  <text x="810" y="545" fill="#CBD5E1" font-size="14" font-family="sans-serif">간병 + 치매 생활자금</text>
  <text x="810" y="568" fill="#CBD5E1" font-size="14" font-family="sans-serif">갱신 인상 리스크 제거</text>
  <text x="810" y="600" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">중증 치매 월 100만 종신</text>

  <!-- Decision box -->
  <rect x="60" y="645" width="1080" height="230" rx="16" fill="#1e293b" stroke="#FCD34D" stroke-width="2"/>
  <text x="80" y="685" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">기존 가입자 점검 포인트</text>
  <g font-family="sans-serif">
    <text x="80" y="725" fill="#FFFFFF" font-size="16">✓ 요양병원 일당 ≥ 4만 원 (체증형 확인)</text>
    <text x="600" y="725" fill="#FFFFFF" font-size="16">✓ 재가급여 월 수령 ≥ 30만 원</text>

    <text x="80" y="760" fill="#FFFFFF" font-size="16">✓ 경증 치매(CDR 0.5·1) 보장 여부</text>
    <text x="600" y="760" fill="#FFFFFF" font-size="16">✓ 간병인 사용일당 차등 지급 조건</text>

    <text x="80" y="795" fill="#FFFFFF" font-size="16">✓ 중증 치매 월 생활자금 지급 기간</text>
    <text x="600" y="795" fill="#FFFFFF" font-size="16">✓ 지원일당 갱신 시 70대 예상 보험료</text>

    <text x="80" y="830" fill="#FFFFFF" font-size="16">✓ 면책·감액기간 소진 여부</text>
    <text x="600" y="830" fill="#FFFFFF" font-size="16">✓ 중복 가입 시 비례보상 조건</text>
  </g>

  <!-- 6 step checklist -->
  <text x="60" y="945" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">가입·전환 6단계 체크리스트</text>

  <g font-family="sans-serif">
    <rect x="60" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="145" cy="1010" r="22" fill="#7C3AED"/>
    <text x="145" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">1</text>
    <text x="145" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">기존 보험 점검</text>
    <text x="145" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">보험다모아 /</text>
    <text x="145" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">내보험다보여</text>
    <text x="145" y="1130" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700">중복·공백 파악</text>

    <rect x="245" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="330" cy="1010" r="22" fill="#7C3AED"/>
    <text x="330" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">2</text>
    <text x="330" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">트리거 이해</text>
    <text x="330" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">간병=상태/행위</text>
    <text x="330" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">치매=CDR 척도</text>
    <text x="330" y="1130" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">지급 구조 구분</text>

    <rect x="430" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="515" cy="1010" r="22" fill="#7C3AED"/>
    <text x="515" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">3</text>
    <text x="515" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">우선순위 결정</text>
    <text x="515" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">나이·가족력</text>
    <text x="515" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">예산·건강상태</text>
    <text x="515" y="1130" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">1~3순위 매칭</text>

    <rect x="615" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="700" cy="1010" r="22" fill="#7C3AED"/>
    <text x="700" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">4</text>
    <text x="700" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">설계 구조 선택</text>
    <text x="700" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">지원 vs 사용일당</text>
    <text x="700" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">갱신 vs 비갱신</text>
    <text x="700" y="1130" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700">총납입 비교</text>

    <rect x="800" y="975" width="170" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="885" cy="1010" r="22" fill="#7C3AED"/>
    <text x="885" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">5</text>
    <text x="885" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">약관 점검</text>
    <text x="885" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">면책·감액</text>
    <text x="885" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">요양병원·경증</text>
    <text x="885" y="1130" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">치매 보장</text>

    <rect x="985" y="975" width="155" height="170" rx="14" fill="#1e293b" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="1062" cy="1010" r="22" fill="#7C3AED"/>
    <text x="1062" y="1018" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">6</text>
    <text x="1062" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">간편심사 비교</text>
    <text x="1062" y="1090" text-anchor="middle" fill="#CBD5E1" font-size="11">3·10·5 / 3·5·5</text>
    <text x="1062" y="1108" text-anchor="middle" fill="#CBD5E1" font-size="11">3·3·5 / 3·2·5</text>
    <text x="1062" y="1130" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">복수 견적</text>
  </g>

  <!-- Bottom warning -->
  <rect x="60" y="1190" width="1080" height="140" rx="14" fill="#1e293b" stroke="#F87171" stroke-width="2"/>
  <text x="80" y="1230" fill="#FCA5A5" font-size="20" font-weight="800" font-family="sans-serif">⚠ 꼭 확인할 3가지</text>
  <g font-family="sans-serif">
    <text x="80" y="1265" fill="#FFFFFF" font-size="15">① 요양병원 일당 급감 상품 주의 — 일반 15만인데 요양병원 1만 가능</text>
    <text x="80" y="1290" fill="#FFFFFF" font-size="15">② 지원일당 갱신 폭등 — 70대 이후 월 10만 이상으로 인상 가능성</text>
    <text x="80" y="1315" fill="#FFFFFF" font-size="15">③ 경증 치매 미보장 구상품 — 10년 전 가입 치매보험은 CDR 3만 지급</text>
  </g>

  <text x="60" y="1620" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 보험 silo · 본 자료는 일반 정보 제공 목적, 개별 가입은 약관·청약서 확인 필수</text>
</svg>
