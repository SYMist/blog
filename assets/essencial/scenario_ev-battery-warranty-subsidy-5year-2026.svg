<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">상황별 전기차 구매 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#93C5FD" font-size="13" font-family="sans-serif">배터리 보증 · 보조금 · 혜택 최적화 · 2026.05 기준</text>

  <!-- Scenario 1 -->
  <rect x="40" y="90" width="480" height="116" rx="10" fill="#1e3a8a" fill-opacity="0.6" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#1E40AF"/>
  <rect x="40" y="112" width="480" height="14" fill="#1E40AF"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 배터리 보증 기간을 최우선으로 생각하는 경우</text>
  <text x="60" y="148" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 현대·기아·제네시스 (10년/20만km)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">업계 최장 배터리 보증. SOH 70% 미만 저하 시 무상 교체</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">개인 최초 구매 고객에 한해 적용 — 명의 확인 필수</text>

  <!-- Scenario 2 -->
  <rect x="560" y="90" width="480" height="116" rx="10" fill="#134e4a" fill-opacity="0.6" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#0F766E"/>
  <rect x="560" y="112" width="480" height="14" fill="#0F766E"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 보조금을 최대로 받고 싶은 경우</text>
  <text x="580" y="148" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">→ 지방 거주자 + 내연차 처분 교체</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">국고 680만원 + 지자체 최대 1,100만원 + 취득세 140만원</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">서울 대비 지방은 수백~수천만원 보조금 차이 발생</text>

  <!-- Scenario 3 -->
  <rect x="40" y="226" width="480" height="116" rx="10" fill="#1e3a8a" fill-opacity="0.6" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="40" y="226" width="480" height="36" rx="10" fill="#1E40AF"/>
  <rect x="40" y="248" width="480" height="14" fill="#1E40AF"/>
  <text x="60" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 기존 내연기관차를 처분하고 교체하는 경우</text>
  <text x="60" y="284" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 전환지원금 100만원 추가 신청</text>
  <text x="60" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">내연차 처분 증빙서류 준비 필요. 보조금 소진 전 조기 신청 권장</text>
  <text x="60" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">상반기 신청이 하반기보다 보조금 잔액 확보에 유리</text>

  <!-- Scenario 4 -->
  <rect x="560" y="226" width="480" height="116" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="226" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="248" width="480" height="14" fill="#D97706"/>
  <text x="580" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ 5년 내 차량 판매 계획이 있는 경우</text>
  <text x="580" y="284" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 의무운행기간 확인 후 구매 결정</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">의무기간(2~5년, 지역별 상이) 내 판매 시 보조금 환수</text>
  <text x="580" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">의무기간이 짧은 지역 선택 or 의무기간 경과 후 판매 계획 필요</text>

  <!-- Scenario 5 (full width) -->
  <rect x="40" y="362" width="1000" height="116" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="40" y="362" width="1000" height="36" rx="10" fill="#4F46E5"/>
  <rect x="40" y="384" width="1000" height="14" fill="#4F46E5"/>
  <text x="60" y="386" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 보조금 혜택 없이 수입 전기차를 선호하는 경우</text>
  <text x="60" y="420" fill="#A5B4FC" font-size="13" font-weight="700" font-family="sans-serif">→ 취득세 140만원 감면은 동일 적용 · 보증 차이(10년 vs 8년) 감안 후 결정</text>
  <text x="60" y="442" fill="#CBD5E1" font-size="12" font-family="sans-serif">테슬라·BMW·벤츠도 국고보조금 및 취득세 감면 수령 가능. 단, 지자체 보조금은 차종별 조건 다름</text>
  <text x="60" y="464" fill="#CBD5E1" font-size="12" font-family="sans-serif">ev.or.kr에서 구매 전 차종별 보조금 금액 확인 필수 — 차종에 따라 보조금 0원 차종도 존재</text>

  <!-- Summary box -->
  <rect x="40" y="496" width="1000" height="176" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="528" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 결론 3줄 요약</text>
  <text x="80" y="562" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">보증 최장 원하면</text>
  <text x="220" y="562" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 현대·기아·제네시스 (10년/20만km, 개인 최초 구매 고객)</text>
  <text x="80" y="594" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">보조금 최대화</text>
  <text x="220" y="594" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 지방 거주 + 내연차 처분 교체 시 최대 1,780만원 가능</text>
  <text x="80" y="626" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">5년 내 판매 계획</text>
  <text x="220" y="626" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 의무운행기간(2~5년) 확인 후 결정 — 위반 시 보조금 전액 환수</text>
  <text x="80" y="654" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 차종·지역·예산 잔액에 따라 달라짐 · 구매 전 ev.or.kr 및 약관 확인 필수</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 구매 전 약관 확인 필요</text>
</svg>
