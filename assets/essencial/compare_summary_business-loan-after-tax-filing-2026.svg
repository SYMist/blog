  <text x="80" y="860" fill="#86EFAC" font-size="22" font-weight="800" font-family="sans-serif">A · 절세 우선 시나리오</text>

  <g font-family="sans-serif">
    <text x="80" y="900" fill="#CBD5E1" font-size="14">필요경비 인정</text>
    <text x="580" y="900" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">1억 6,500만</text>

    <text x="80" y="930" fill="#CBD5E1" font-size="14">신고 소득금액</text>
    <text x="580" y="930" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">3,500만</text>

    <text x="80" y="960" fill="#CBD5E1" font-size="14">종소세 부담</text>
    <text x="580" y="960" text-anchor="end" fill="#86EFAC" font-size="16" font-weight="800">약 300만</text>

    <text x="80" y="990" fill="#CBD5E1" font-size="14">사업자대출 환산 한도</text>
    <text x="580" y="990" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="800">약 8,000만</text>

    <text x="80" y="1020" fill="#CBD5E1" font-size="14">자기자본·자금수요 無</text>
    <text x="580" y="1020" text-anchor="end" fill="#86EFAC" font-size="14">합리적 선택</text>

    <text x="80" y="1050" fill="#CBD5E1" font-size="14">사업 안정기</text>
    <text x="580" y="1050" text-anchor="end" fill="#FFFFFF" font-size="14">유지·축소 단계</text>
  </g>
  <text x="80" y="1110" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">✓ 자금 수요 없을 때 · 다음 해 한도 회복 가능</text>

  <rect x="620" y="820" width="520" height="310" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="640" y="860" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">B · 한도 우선 시나리오</text>

  <g font-family="sans-serif">
    <text x="640" y="900" fill="#CBD5E1" font-size="14">필요경비 인정</text>
    <text x="1120" y="900" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="700">1억 5,000만</text>

    <text x="640" y="930" fill="#CBD5E1" font-size="14">신고 소득금액</text>
    <text x="1120" y="930" text-anchor="end" fill="#FCD34D" font-size="15" font-weight="700">5,000만</text>

    <text x="640" y="960" fill="#CBD5E1" font-size="14">종소세 부담</text>
    <text x="1120" y="960" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="800">약 600만 (+300)</text>

    <text x="640" y="990" fill="#CBD5E1" font-size="14">사업자대출 환산 한도</text>
    <text x="1120" y="990" text-anchor="end" fill="#86EFAC" font-size="16" font-weight="800">약 1.25억 (+4,500)</text>

    <text x="640" y="1020" fill="#CBD5E1" font-size="14">사업 확장기·인력 충원</text>
    <text x="1120" y="1020" text-anchor="end" fill="#86EFAC" font-size="14">유리</text>

    <text x="640" y="1050" fill="#CBD5E1" font-size="14">주택 구입·임차 계획</text>
    <text x="1120" y="1050" text-anchor="end" fill="#FFFFFF" font-size="14">DSR 합산 영향</text>
  </g>
  <text x="640" y="1110" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">✓ 1년 내 자금 조달 계획·ROI 4%+ 일 때 합리적</text>

  <!-- 4채널 상품 요약 -->
  <rect x="60" y="1160" width="1080" height="200" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="80" y="1200" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">2026 사업자대출 4채널 핵심</text>

  <g font-family="sans-serif">
    <text x="80" y="1240" fill="#FFFFFF" font-size="16" font-weight="700">시중은행 사장님대출</text>
    <text x="570" y="1240" text-anchor="end" fill="#FCD34D" font-size="18" font-weight="800">최대 3억 · 3~6%</text>

    <text x="80" y="1275" fill="#FFFFFF" font-size="16" font-weight="700">정책자금 (신규 사업자)</text>
    <text x="570" y="1275" text-anchor="end" fill="#86EFAC" font-size="18" font-weight="800">2.96% · 1억 한도</text>

    <text x="600" y="1240" fill="#FFFFFF" font-size="16" font-weight="700">신용보증재단</text>
    <text x="1120" y="1240" text-anchor="end" fill="#86EFAC" font-size="16" font-weight="800">개인 5천 · 법인 1억</text>

    <text x="600" y="1275" fill="#FFFFFF" font-size="16" font-weight="700">2금융권 햇살론</text>
    <text x="1120" y="1275" text-anchor="end" fill="#FCA5A5" font-size="16" font-weight="800">10.5% · 차선책</text>

    <text x="80" y="1325" fill="#FCD34D" font-size="14" font-weight="700">→ 2026.3.18 대출이동제: 10억 이하 갈아타기 (승인율 10% 미만 한계)</text>
  </g>

  <text x="60" y="1420" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 대출·금융 silo · 자료: 국세청·금융위·소진공·신용보증재단 (2026.04 기준)</text>
</svg>
