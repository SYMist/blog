<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Title -->
  <text x="540" y="62" text-anchor="middle" fill="#E2E8F0" font-size="24" font-weight="700" font-family="sans-serif">하이브리드 vs 전기차 — 항목별 비교 매트릭스</text>
  <rect x="300" y="76" width="480" height="3" rx="2" fill="#3B82F6" opacity="0.6"/>

  <!-- Section 1: 보험·정비 비교 -->
  <text x="80" y="112" fill="#93C5FD" font-size="17" font-weight="700" font-family="sans-serif">01  보험료·정비비 비교</text>

  <g transform="translate(60,128)">
    <rect x="0" y="0" width="960" height="34" rx="8" fill="#334155"/>
    <text x="200" y="23" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">항목</text>
    <text x="510" y="23" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">전기차 (EV)</text>
    <text x="800" y="23" text-anchor="middle" fill="#60A5FA" font-size="13" font-weight="700" font-family="sans-serif">하이브리드 (HEV)</text>

    <rect x="0" y="40" width="960" height="32" rx="4" fill="#1e293b"/>
    <text x="200" y="61" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">연간 보험료</text>
    <text x="510" y="61" text-anchor="middle" fill="#FCD34D" font-size="12" font-family="sans-serif">~110만 원 (10~15% 높음)</text>
    <text x="800" y="61" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">~100만 원</text>

    <rect x="0" y="76" width="960" height="32" rx="4" fill="#0f172a"/>
    <text x="200" y="97" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">BMS 할인</text>
    <text x="510" y="97" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">5~12% 추가 할인</text>
    <text x="800" y="97" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">해당 없음</text>

    <rect x="0" y="112" width="960" height="32" rx="4" fill="#1e293b"/>
    <text x="200" y="133" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">엔진오일·점화플러그</text>
    <text x="510" y="133" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">불필요</text>
    <text x="800" y="133" text-anchor="middle" fill="#FCD34D" font-size="12" font-family="sans-serif">정기 교체 필요</text>

    <rect x="0" y="148" width="960" height="32" rx="4" fill="#0f172a"/>
    <text x="200" y="169" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">브레이크 패드</text>
    <text x="510" y="169" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">마모 적음 (회생제동)</text>
    <text x="800" y="169" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">일반 수준</text>

    <rect x="0" y="184" width="960" height="32" rx="4" fill="#1e293b"/>
    <text x="200" y="205" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">소모품 비용 절감</text>
    <text x="510" y="205" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">50% 이상 절감</text>
    <text x="800" y="205" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">내연기관 동일 또는 복잡</text>
  </g>

  <!-- Section 2: 공공 혜택 -->
  <text x="80" y="365" fill="#93C5FD" font-size="17" font-weight="700" font-family="sans-serif">02  공공 혜택 비교 (2026)</text>

  <g transform="translate(60,380)">
    <rect x="0" y="0" width="460" height="140" rx="14" fill="#1e293b"/>
    <rect x="0" y="0" width="460" height="5" rx="3" fill="#34D399"/>
    <text x="230" y="35" text-anchor="middle" fill="#34D399" font-size="15" font-weight="700" font-family="sans-serif">전기차 (EV)</text>
    <text x="30" y="62" fill="#CBD5E1" font-size="13" font-family="sans-serif">고속도로 통행료: 30% 할인 (단계 축소 중)</text>
    <text x="30" y="86" fill="#CBD5E1" font-size="13" font-family="sans-serif">공영주차장: 50% 감면</text>
    <text x="30" y="110" fill="#CBD5E1" font-size="13" font-family="sans-serif">남산터널 혼잡통행료: 면제</text>
    <text x="30" y="132" fill="#CBD5E1" font-size="13" font-family="sans-serif">채권 매입 감면: 최대 250만 원</text>

    <rect x="500" y="0" width="460" height="140" rx="14" fill="#1e293b"/>
    <rect x="500" y="0" width="460" height="5" rx="3" fill="#60A5FA"/>
    <text x="730" y="35" text-anchor="middle" fill="#93C5FD" font-size="15" font-weight="700" font-family="sans-serif">하이브리드 (HEV)</text>
    <text x="530" y="62" fill="#F87171" font-size="13" font-family="sans-serif">고속도로 통행료: 할인 없음</text>
    <text x="530" y="86" fill="#CBD5E1" font-size="13" font-family="sans-serif">공영주차장: 50% 감면 (저공해 2종)</text>
    <text x="530" y="110" fill="#CBD5E1" font-size="13" font-family="sans-serif">남산터널 혼잡통행료: 면제</text>
    <text x="530" y="132" fill="#CBD5E1" font-size="13" font-family="sans-serif">채권 매입 감면: 최대 140만 원</text>
  </g>

  <!-- Section 3: 보조금 구조 -->
  <text x="80" y="570" fill="#93C5FD" font-size="17" font-weight="700" font-family="sans-serif">03  전기차 보조금 구조 (2026)</text>

  <g transform="translate(60,588)">
    <!-- Flow: 3 boxes -->
    <rect x="0" y="0" width="280" height="90" rx="14" fill="#065F46"/>
    <text x="140" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">국비 기본</text>
    <text x="140" y="55" text-anchor="middle" fill="#A7F3D0" font-size="22" font-weight="800" font-family="sans-serif">580만 원</text>
    <text x="140" y="80" text-anchor="middle" fill="#6EE7B7" font-size="11" font-family="sans-serif">5,000만 이하 전액 / 5,000~8,500만 50%</text>

    <text x="300" y="50" fill="#34D399" font-size="24" font-weight="800" font-family="sans-serif">+</text>

    <rect x="340" y="0" width="280" height="90" rx="14" fill="#7F1D1D"/>
    <text x="480" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">전환지원금 (신설)</text>
    <text x="480" y="55" text-anchor="middle" fill="#FCA5A5" font-size="22" font-weight="800" font-family="sans-serif">100만 원</text>
    <text x="480" y="80" text-anchor="middle" fill="#FCA5A5" font-size="11" font-family="sans-serif">3년+ 내연차 폐차·매각 시</text>

    <text x="640" y="50" fill="#FCD34D" font-size="24" font-weight="800" font-family="sans-serif">=</text>

    <rect x="680" y="0" width="280" height="90" rx="14" fill="#1E40AF"/>
    <text x="820" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="sans-serif">국비 합계</text>
    <text x="820" y="55" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">최대 680만 원</text>
    <text x="820" y="80" text-anchor="middle" fill="#DBEAFE" font-size="11" font-family="sans-serif">+ 지자체 74~120만 별도</text>
  </g>

  <!-- Section 4: 감가상각 비교 -->
  <text x="80" y="730" fill="#93C5FD" font-size="17" font-weight="700" font-family="sans-serif">04  감가상각 — 유지비의 역설</text>

  <g transform="translate(60,748)">
    <!-- HEV Bar -->
    <text x="0" y="20" fill="#93C5FD" font-size="14" font-weight="600" font-family="sans-serif">하이브리드 (5년 잔가)</text>
    <rect x="220" y="4" width="540" height="28" rx="8" fill="#1E40AF" opacity="0.5"/>
    <rect x="220" y="4" width="324" height="28" rx="8" fill="#3B82F6" opacity="0.8"/>
    <text x="555" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" font-family="sans-serif">60% 잔가 → 2,640만 원</text>

    <!-- EV Bar -->
    <text x="0" y="64" fill="#34D399" font-size="14" font-weight="600" font-family="sans-serif">전기차 (5년 잔가)</text>
    <rect x="220" y="48" width="540" height="28" rx="8" fill="#065F46" opacity="0.5"/>
    <rect x="220" y="48" width="216" height="28" rx="8" fill="#10B981" opacity="0.8"/>
    <text x="500" y="68" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" font-family="sans-serif">40% 잔가 → 1,840만 원</text>

    <!-- Gap -->
    <text x="780" y="44" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">차이: 800만 원</text>

    <!-- 감가 원인 -->
    <rect x="0" y="100" width="960" height="80" rx="12" fill="#1e293b"/>
    <text x="30" y="125" fill="#FCA5A5" font-size="13" font-weight="600" font-family="sans-serif">전기차 감가가 심한 3가지 이유</text>
    <text x="30" y="150" fill="#CBD5E1" font-size="12" font-family="sans-serif">1. 배터리 기술 급발전 → 구형 모델 매력 하락  |  2. 배터리 수명 불안감 → 중고 수요 제한  |  3. 충전 인프라 격차</text>
    <text x="30" y="172" fill="#6EE7B7" font-size="12" font-family="sans-serif">전망: 배터리 정보 공개 의무화(2026.6.3) + 충전 인프라 확충 → 중고 잔가율 점진적 안정화 예상</text>
  </g>

  <!-- Section 5: 세제 혜택 일몰 경고 -->
  <rect x="60" y="945" width="960" height="50" rx="12" fill="#7F1D1D" opacity="0.4"/>
  <text x="540" y="977" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">⚠ 2026.12.31 세제 혜택 일몰 예정 — 전기차 취득세 140만·채권 감면·보조금 모두 종료 가능</text>

  <!-- Footer -->
  <text x="540" y="1030" text-anchor="middle" fill="#64748B" font-size="13" font-family="sans-serif">2026년 4월 기준 | 보험개발원·환경부·국세청 데이터 반영 | essencial</text>
  <rect x="60" y="1045" width="960" height="2" rx="1" fill="#334155"/>
  <text x="540" y="1068" text-anchor="middle" fill="#475569" font-size="12" font-family="sans-serif">※ 개인 주행 패턴·보유 기간에 따라 유불리가 달라질 수 있습니다</text>
</svg>
