<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="860" height="1500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="430" y="45" text-anchor="middle" fill="#93C5FD" font-size="14" font-weight="600" font-family="sans-serif">essencial | 항목별 비교표</text>
  <text x="430" y="80" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">자동차 검사 비용·주기·과태료 상세 비교</text>

  <!-- Section 1: 차종별 유효기간 -->
  <rect x="40" y="105" width="780" height="32" rx="8" fill="#1E40AF" opacity="0.3"/>
  <text x="430" y="128" text-anchor="middle" fill="#93C5FD" font-size="15" font-weight="700" font-family="sans-serif">차종별 유효기간·검사 주기</text>

  <g transform="translate(40,145)">
    <rect x="0" y="0" width="780" height="34" rx="6" fill="#334155"/>
    <text x="140" y="23" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">차종·용도</text>
    <text x="350" y="23" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">최초 검사</text>
    <text x="520" y="23" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">이후 주기</text>
    <text x="680" y="23" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">비고</text>

    <rect x="0" y="38" width="780" height="32" fill="#253044"/>
    <text x="140" y="59" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">비사업용 승용차</text>
    <text x="350" y="59" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="sans-serif">5년</text>
    <text x="520" y="59" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">2년</text>
    <text x="680" y="59" text-anchor="middle" fill="#34D399" font-size="12" font-family="sans-serif">2025년 이후 적용</text>

    <rect x="0" y="72" width="780" height="32" fill="#1e293b"/>
    <text x="140" y="93" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">사업용 승용차</text>
    <text x="350" y="93" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">2년</text>
    <text x="520" y="93" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">1년</text>
    <text x="680" y="93" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">택시·렌터카</text>

    <rect x="0" y="106" width="780" height="32" fill="#253044"/>
    <text x="140" y="127" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">경·소형 승합·화물</text>
    <text x="350" y="127" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">1년</text>
    <text x="520" y="127" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">1년</text>
    <text x="680" y="127" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">상업용 운행</text>

    <rect x="0" y="140" width="780" height="32" fill="#1e293b"/>
    <text x="140" y="161" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">중·대형 화물 (비사업용)</text>
    <text x="350" y="161" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">1년</text>
    <text x="520" y="161" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">1년 (8년+ 시 6개월)</text>
    <text x="680" y="161" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">적재 안전</text>
  </g>

  <!-- Section 2: 부적합 최다 항목 -->
  <rect x="40" y="340" width="780" height="32" rx="8" fill="#EF4444" opacity="0.2"/>
  <text x="430" y="363" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">부적합 최다 항목 (연간 부적합률 약 20%)</text>

  <g transform="translate(40,385)">
    <!-- 등화장치 60% -->
    <rect x="0" y="0" width="250" height="130" rx="14" fill="#1e293b"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#EF4444"/>
    <text x="125" y="32" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">등화장치</text>
    <text x="125" y="65" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">60%+</text>
    <text x="125" y="90" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">전조등·방향등·제동등</text>
    <text x="125" y="115" text-anchor="middle" fill="#34D399" font-size="11" font-family="sans-serif">동승자 도움으로 5분 점검</text>

    <!-- 배출가스 15% -->
    <rect x="265" y="0" width="250" height="130" rx="14" fill="#1e293b"/>
    <rect x="265" y="0" width="250" height="4" rx="2" fill="#F59E0B"/>
    <text x="390" y="32" text-anchor="middle" fill="#FBBF24" font-size="14" font-weight="700" font-family="sans-serif">배출가스</text>
    <text x="390" y="65" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">15%</text>
    <text x="390" y="90" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">디젤 DPF·요소수</text>
    <text x="390" y="115" text-anchor="middle" fill="#34D399" font-size="11" font-family="sans-serif">검사 전 30분 고속주행</text>

    <!-- 제동력 10% + 타이어 5% -->
    <rect x="530" y="0" width="250" height="130" rx="14" fill="#1e293b"/>
    <rect x="530" y="0" width="250" height="4" rx="2" fill="#3B82F6"/>
    <text x="655" y="32" text-anchor="middle" fill="#60A5FA" font-size="14" font-weight="700" font-family="sans-serif">제동력·타이어</text>
    <text x="655" y="65" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">15%</text>
    <text x="655" y="90" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">브레이크 패드·타이어 마모</text>
    <text x="655" y="115" text-anchor="middle" fill="#34D399" font-size="11" font-family="sans-serif">마모한계선 1.6mm 확인</text>
  </g>

  <!-- Section 3: 과태료 단계별 -->
  <rect x="40" y="545" width="780" height="32" rx="8" fill="#F59E0B" opacity="0.2"/>
  <text x="430" y="568" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">과태료 단계별 상세</text>

  <g transform="translate(40,590)">
    <rect x="0" y="0" width="780" height="34" rx="6" fill="#334155"/>
    <text x="120" y="23" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">지연 기간</text>
    <text x="340" y="23" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">과태료</text>
    <text x="600" y="23" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">비고</text>

    <rect x="0" y="38" width="780" height="36" fill="#1e293b"/>
    <text x="120" y="62" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">30일 이내</text>
    <text x="340" y="62" text-anchor="middle" fill="#FBBF24" font-size="14" font-weight="700" font-family="sans-serif">4만 원</text>
    <text x="600" y="62" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">최소 부과액</text>

    <rect x="0" y="76" width="780" height="36" fill="#253044"/>
    <text x="120" y="100" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">31~114일</text>
    <text x="340" y="100" text-anchor="middle" fill="#F59E0B" font-size="14" font-weight="700" font-family="sans-serif">4만 + 3일마다 2만 가산</text>
    <text x="600" y="100" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">점진적 증액</text>

    <rect x="0" y="114" width="780" height="36" fill="#1e293b"/>
    <text x="120" y="138" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="sans-serif">115일 이상</text>
    <text x="340" y="138" text-anchor="middle" fill="#EF4444" font-size="15" font-weight="800" font-family="sans-serif">60만 원 (최대)</text>
    <text x="600" y="138" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">법정 상한액</text>

    <rect x="0" y="152" width="780" height="36" fill="#3B1111"/>
    <text x="120" y="176" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">1년 이상</text>
    <text x="340" y="176" text-anchor="middle" fill="#F87171" font-size="14" font-weight="800" font-family="sans-serif">60만 원 + 운행정지</text>
    <text x="600" y="176" text-anchor="middle" fill="#FCA5A5" font-size="12" font-weight="600" font-family="sans-serif">위반 시 형사처벌</text>
  </g>

  <!-- Section 4: 예약 채널 비교 -->
  <rect x="40" y="810" width="780" height="32" rx="8" fill="#3B82F6" opacity="0.2"/>
  <text x="430" y="833" text-anchor="middle" fill="#93C5FD" font-size="15" font-weight="700" font-family="sans-serif">예약 채널 비교</text>

  <g transform="translate(40,855)">
    <rect x="0" y="0" width="250" height="140" rx="14" fill="#1e293b"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#3B82F6"/>
    <text x="125" y="32" text-anchor="middle" fill="#60A5FA" font-size="15" font-weight="700" font-family="sans-serif">TS 사이버검사소</text>
    <text x="125" y="58" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">차량번호 + 생년월일</text>
    <text x="125" y="82" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">전국 공단·민간 통합</text>
    <text x="125" y="106" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">검사 대상 즉시 확인</text>
    <text x="125" y="130" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="600" font-family="sans-serif">추천</text>

    <rect x="265" y="0" width="250" height="140" rx="14" fill="#1e293b"/>
    <rect x="265" y="0" width="250" height="4" rx="2" fill="#34D399"/>
    <text x="390" y="32" text-anchor="middle" fill="#6EE7B7" font-size="15" font-weight="700" font-family="sans-serif">네이버 예약</text>
    <text x="390" y="58" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">"지역명 + 검사소" 검색</text>
    <text x="390" y="82" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">N페이 선결제</text>
    <text x="390" y="106" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">실시간 빈 자리 확인</text>
    <text x="390" y="130" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">편의성 우수</text>

    <rect x="530" y="0" width="250" height="140" rx="14" fill="#1e293b"/>
    <rect x="530" y="0" width="250" height="4" rx="2" fill="#94A3B8"/>
    <text x="655" y="32" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700" font-family="sans-serif">전화 예약</text>
    <text x="655" y="58" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">TS 콜센터 1577-0990</text>
    <text x="655" y="82" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">디지털 접근 어려운 경우</text>
    <text x="655" y="106" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">상담원 안내</text>
    <text x="655" y="130" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">대기시간 있음</text>
  </g>

  <!-- Section 5: 전기차 2026 변경사항 -->
  <rect x="40" y="1030" width="780" height="32" rx="8" fill="#34D399" opacity="0.2"/>
  <text x="430" y="1053" text-anchor="middle" fill="#6EE7B7" font-size="15" font-weight="700" font-family="sans-serif">전기차 검사 — 2026년 달라진 점</text>

  <g transform="translate(40,1075)">
    <rect x="0" y="0" width="380" height="110" rx="14" fill="#1e293b"/>
    <rect x="0" y="0" width="380" height="4" rx="2" fill="#34D399"/>
    <text x="190" y="30" text-anchor="middle" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">BMS 데이터 실시간 추출</text>
    <text x="190" y="55" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">셀 전압 편차 분석</text>
    <text x="190" y="75" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">배터리 수명(SOH) 측정</text>
    <text x="190" y="95" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">충·방전 이력 정밀 분석</text>

    <rect x="400" y="0" width="380" height="110" rx="14" fill="#1e293b"/>
    <rect x="400" y="0" width="380" height="4" rx="2" fill="#F87171"/>
    <text x="590" y="30" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">리콜 미이행 제재</text>
    <text x="590" y="55" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">통지 후 1년 6개월 내 미조치</text>
    <text x="590" y="75" text-anchor="middle" fill="#F87171" font-size="13" font-weight="700" font-family="sans-serif">→ 부적합 판정</text>
    <text x="590" y="95" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">도로 주행 제한</text>
  </g>

  <!-- 재검사 안내 -->
  <rect x="40" y="1210" width="780" height="32" rx="8" fill="#1E40AF" opacity="0.2"/>
  <text x="430" y="1233" text-anchor="middle" fill="#93C5FD" font-size="15" font-weight="700" font-family="sans-serif">부적합 판정 시 재검사</text>

  <g transform="translate(40,1255)">
    <rect x="0" y="0" width="380" height="80" rx="14" fill="#1e293b"/>
    <rect x="0" y="0" width="380" height="4" rx="2" fill="#34D399"/>
    <text x="190" y="30" text-anchor="middle" fill="#6EE7B7" font-size="14" font-weight="700" font-family="sans-serif">10일 이내 재검사</text>
    <text x="190" y="55" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">추가 수수료 없음</text>
    <text x="190" y="75" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">해당 항목만 재확인</text>

    <rect x="400" y="0" width="380" height="80" rx="14" fill="#1e293b"/>
    <rect x="400" y="0" width="380" height="4" rx="2" fill="#F87171"/>
    <text x="590" y="30" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700" font-family="sans-serif">10일 초과</text>
    <text x="590" y="55" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" font-family="sans-serif">수수료 재부과</text>
    <text x="590" y="75" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">+ 유효기간 초과 시 과태료</text>
  </g>

  <!-- 유예 신청 -->
  <g transform="translate(40,1365)">
    <rect x="0" y="0" width="780" height="70" rx="14" fill="#1E40AF" opacity="0.15"/>
    <text x="390" y="25" text-anchor="middle" fill="#93C5FD" font-size="14" font-weight="700" font-family="sans-serif">유예(연장) 신청 가능 사유</text>
    <text x="390" y="50" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">차량 수리·해외 체류·병원 입원·도난·압류·천재지변 → 정부24 또는 시·군·구청 방문</text>
  </g>

  <!-- Footer -->
  <text x="430" y="1480" text-anchor="middle" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 2026년 기준 | TS 공단·국토교통부 자료</text>
</svg>
