  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="24"/>

  <rect x="60" y="50" width="200" height="42" rx="21" fill="#EF4444"/>
  <text x="160" y="78" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700" font-family="Pretendard,sans-serif">2026 비교분석</text>

  <text x="60" y="170" fill="#FFFFFF" font-size="52" font-weight="900" font-family="Pretendard,sans-serif">백내장 수술</text>
  <text x="60" y="240" fill="#FFFFFF" font-size="54" font-weight="900" font-family="Pretendard,sans-serif">다초점 렌즈 비교</text>

  <rect x="60" y="265" width="300" height="4" rx="2" fill="url(#teal)"/>

  <text x="60" y="315" fill="#E2E8F0" font-size="28" font-weight="600" font-family="Pretendard,sans-serif">수술 비용·실비 적용 총정리</text>

  <rect x="60" y="350" width="100" height="36" rx="18" fill="#F0FDFA"/>
  <text x="110" y="374" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">비교</text>
  <rect x="175" y="350" width="120" height="36" rx="18" fill="#F0FDFA"/>
  <text x="235" y="374" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">다초점</text>
  <rect x="310" y="350" width="100" height="36" rx="18" fill="#F0FDFA"/>
  <text x="360" y="374" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">실비</text>

  <!-- Right: Two cards -->
  <rect x="660" y="50" width="240" height="190" rx="16" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="660" y="50" width="240" height="44" rx="16" fill="#0D9488"/>
  <rect x="660" y="78" width="240" height="16" fill="#0D9488"/>
  <text x="780" y="80" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">전국 평균</text>
  <text x="780" y="140" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="900" font-family="Pretendard,sans-serif">220만 원</text>
  <text x="780" y="178" text-anchor="middle" fill="#5EEAD4" font-size="16" font-family="Pretendard,sans-serif">한쪽 눈 기준</text>
  <text x="780" y="215" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">양쪽 시 350~500만</text>

  <rect x="930" y="50" width="240" height="190" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="930" y="50" width="240" height="44" rx="16" fill="#F59E0B"/>
  <rect x="930" y="78" width="240" height="16" fill="#F59E0B"/>
  <text x="1050" y="80" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">가격 격차</text>
  <text x="1050" y="140" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="900" font-family="Pretendard,sans-serif">29~680만</text>
  <text x="1050" y="178" text-anchor="middle" fill="#FDE68A" font-size="16" font-family="Pretendard,sans-serif">최대 23배 차이</text>
  <text x="1050" y="215" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">비급여 → 병원마다 상이</text>

  <!-- Bottom highlight -->
  <rect x="660" y="270" width="510" height="70" rx="14" fill="#0F766E" opacity="0.15"/>
  <rect x="660" y="270" width="510" height="70" rx="14" stroke="#0D9488" stroke-width="2" fill="none"/>
  <text x="915" y="313" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">실손 통원 처리 → 1일 20~30만 한도만 보상</text>

  <!-- 인기 렌즈 -->
  <rect x="660" y="370" width="510" height="55" rx="14" fill="#1E293B"/>
  <text x="915" y="405" text-anchor="middle" fill="#94A3B8" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">인기: 팬옵틱스 | 시너지 | 퓨어See | 아이핸스 | 리사트리</text>

  <text x="60" y="580" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="1140" y="580" text-anchor="end" fill="#64748B" font-size="18" font-family="Pretendard,sans-serif">건강·의료 비교</text>
