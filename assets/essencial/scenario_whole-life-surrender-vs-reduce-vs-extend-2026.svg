<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">종신보험 변경 상황별 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#DDD6FE" font-size="13" font-family="sans-serif">해지·감액완납·연장·대출·연금전환 6종 · 2026.05</text>

  <!-- Scenario 1: 해지 -->
  <rect x="40" y="90" width="480" height="116" rx="10" fill="#7f1d1d" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#DC2626"/>
  <rect x="40" y="112" width="480" height="14" fill="#DC2626"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 자녀 독립 + 연금 충분 + 자금 필요</text>
  <text x="60" y="148" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">→ 해지 (환급금 4,000만 즉시 수령)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">보장 불필요 + 일시 자금 필요 시 명확한 선택</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">5년 미만이면 손실 큼 → 가급적 7년 이상 유지 후 결정</text>

  <!-- Scenario 2: 감액완납 -->
  <rect x="560" y="90" width="480" height="116" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="112" width="480" height="14" fill="#D97706"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 50~60대 + 부담↓ + 평생 일부 보장</text>
  <text x="580" y="148" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 감액완납 (사망 3,000~4,000만 종신)</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">배우자 보장 우선 + 보험료 0원 + 평생 유지</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">단, 특약(의료·암) 소멸 → 단독보험 별도 가입 필요</text>

  <!-- Scenario 3: 연장정기 -->
  <rect x="40" y="226" width="480" height="116" rx="10" fill="#4c1d95" fill-opacity="0.6" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="40" y="226" width="480" height="36" rx="10" fill="#7C3AED"/>
  <rect x="40" y="248" width="480" height="14" fill="#7C3AED"/>
  <text x="60" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 자녀 학자금·대출 65~70대 종료 + 풀 보장</text>
  <text x="60" y="284" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">→ 연장정기 (1억 + 75~80세 만기)</text>
  <text x="60" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">사망보장 풀 유지 + 보험료 0원 + 만기까지 안전</text>
  <text x="60" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">90세+ 장수 시 무보장 위험 인식하고 결정</text>

  <!-- Scenario 4: 자동대출납입·계약대출 -->
  <rect x="560" y="226" width="480" height="116" rx="10" fill="#155e75" fill-opacity="0.6" stroke="#0e7490" stroke-width="1.5"/>
  <rect x="560" y="226" width="480" height="36" rx="10" fill="#0e7490"/>
  <rect x="560" y="248" width="480" height="14" fill="#0e7490"/>
  <text x="580" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ 일시 자금 필요 + 보장 풀 유지 의향</text>
  <text x="580" y="284" fill="#67E8F9" font-size="13" font-weight="700" font-family="sans-serif">→ 보험계약대출 또는 자동대출납입</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">해지환급금 80% 한도 대출 (이자 4~5%)</text>
  <text x="580" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">보험 유지 + 즉시 현금 → 단기 자금 부족 해결책</text>

  <!-- Scenario 5: 5년 미만 + 65세+ -->
  <rect x="40" y="362" width="1000" height="116" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="40" y="362" width="1000" height="36" rx="10" fill="#4F46E5"/>
  <rect x="40" y="384" width="1000" height="14" fill="#4F46E5"/>
  <text x="60" y="386" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 65세+ 노후자금 필요 (가입 25년+ 환급률 100%+)</text>
  <text x="60" y="420" fill="#A5B4FC" font-size="13" font-weight="700" font-family="sans-serif">→ 연금전환 (월 일정금 수령)</text>
  <text x="60" y="442" fill="#CBD5E1" font-size="12" font-family="sans-serif">환급금 9,000만+ 활용 → 월 30만~50만 노후 수령 가능 (보험사·전환 조건 따라)</text>
  <text x="60" y="464" fill="#CBD5E1" font-size="12" font-family="sans-serif">사망보장 종료 인식 + 전환 절차 보험사 약관 확인 필수</text>

  <!-- Summary -->
  <rect x="40" y="496" width="1000" height="176" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="528" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 결론 3줄 요약</text>
  <text x="80" y="562" fill="#FCA5A5" font-size="13" font-weight="700" font-family="sans-serif">자금 필요 + 보장 불필요</text>
  <text x="320" y="562" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 해지 (15년차 환급금 약 4,000만)</text>
  <text x="80" y="594" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">부담↓ + 평생 일부 보장</text>
  <text x="320" y="594" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 감액완납 (사망 3,000~4,000만 종신, 특약 소멸)</text>
  <text x="80" y="626" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">풀 보장 + 만기 OK</text>
  <text x="320" y="626" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 연장정기 (1억 + 75~80세 만기)</text>
  <text x="80" y="654" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 해지·감액·연장 모두 특약 소멸 + 되돌리기 불가 · 결정 전 보험사·금감원(1332) 상담 필수</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 본인 약관 기준 시뮬레이션 후 결정 · 일반 정보 (보험 자문 아님)</text>
</svg>
