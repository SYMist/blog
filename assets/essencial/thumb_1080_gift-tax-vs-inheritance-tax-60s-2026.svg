<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <circle cx="920" cy="160" r="220" fill="#7C3AED" fill-opacity="0.08"/>
  <circle cx="160" cy="920" r="180" fill="#15803D" fill-opacity="0.08"/>

  <!-- Chips -->
  <rect x="40" y="40" width="120" height="34" rx="17" fill="#B45309" fill-opacity="0.4" stroke="#D97706" stroke-width="1.5"/>
  <text x="100" y="63" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700" font-family="sans-serif">대출·금융</text>

  <rect x="176" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="246" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="332" y="40" width="170" height="34" rx="17" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="417" y="63" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">60대 부모 시뮬</text>

  <!-- Title -->
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">증여세 vs 상속세</text>
  <text x="540" y="234" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">60대 부모 비교</text>
  <text x="540" y="282" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="600" font-family="sans-serif">자산 규모별 손익분기 분석 (2026)</text>

  <rect x="200" y="310" width="680" height="3" rx="1.5" fill="#D97706" fill-opacity="0.6"/>

  <!-- Key stat -->
  <rect x="160" y="330" width="760" height="80" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="368" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">손익분기점 (자녀 2명 기준)</text>
  <text x="540" y="398" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">자산 약 20억원 · 이하 상속 / 이상 증여</text>

  <!-- Two cards -->
  <rect x="40" y="430" width="480" height="510" rx="20" fill="url(#greenGrad)" fill-opacity="0.85" stroke="#15803D" stroke-width="2"/>
  <text x="280" y="482" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">상속 (10억 이하)</text>
  <text x="280" y="510" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">일괄공제 5억 활용</text>
  <line x1="70" y1="530" x2="480" y2="530" stroke="#14532d" stroke-width="1.5"/>
  <text x="280" y="572" text-anchor="middle" fill="#86EFAC" font-size="28" font-weight="800" font-family="sans-serif">10억 → 9천만</text>
  <text x="280" y="602" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">5억 → 0원 (비과세)</text>
  <line x1="70" y1="624" x2="480" y2="624" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="656" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 일괄공제 5억</text>
  <text x="80" y="684" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 배우자공제 추가</text>
  <text x="80" y="712" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 자녀공제 5억 개정안</text>
  <line x1="70" y1="734" x2="480" y2="734" stroke="#14532d" stroke-width="1.5"/>
  <rect x="70" y="752" width="380" height="38" rx="10" fill="#15803D" fill-opacity="0.4"/>
  <text x="260" y="777" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">자산 10억 이하면 압도적 선택</text>
  <text x="280" y="826" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">상속 7천만 절감 (사전 증여 대비)</text>
  <text x="280" y="852" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 사망 시점 일괄 처리</text>

  <rect x="560" y="430" width="480" height="510" rx="20" fill="url(#purpleGrad)" fill-opacity="0.85" stroke="#7C3AED" stroke-width="2"/>
  <text x="800" y="482" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">사전 증여 (30억+)</text>
  <text x="800" y="510" text-anchor="middle" fill="#DDD6FE" font-size="15" font-family="sans-serif">10년 누계 + 자산 분리</text>
  <line x1="590" y1="530" x2="1000" y2="530" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="800" y="572" text-anchor="middle" fill="#DDD6FE" font-size="28" font-weight="800" font-family="sans-serif">50억 → 16.4억</text>
  <text x="800" y="602" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">상속 17.9억 대비 1.5억 절감</text>
  <line x1="590" y1="624" x2="1000" y2="624" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="600" y="656" fill="#DDD6FE" font-size="15" font-weight="700" font-family="sans-serif">✅ 60→90세 4회 공제</text>
  <text x="600" y="684" fill="#DDD6FE" font-size="15" font-weight="700" font-family="sans-serif">✅ 자산 증가분 분리</text>
  <text x="600" y="712" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 사망 10년 내 합산</text>
  <line x1="590" y1="734" x2="1000" y2="734" stroke="#4c1d95" stroke-width="1.5"/>
  <rect x="590" y="752" width="380" height="38" rx="10" fill="#7C3AED" fill-opacity="0.4"/>
  <text x="780" y="777" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" font-family="sans-serif">자산 30억+면 60대 일찍 시작</text>
  <text x="800" y="826" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">자녀 결혼·주택 자금 시기 일치</text>
  <text x="800" y="852" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 부동산 상승기에 효과 극대</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 대출·금융 · 2026.05 기준 · 자녀공제 5억 개정안 시행 시 상속 더 유리 · 1억+ 이전 시 세무사 상담 필수</text>
</svg>
