<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Title -->
  <text x="540" y="70" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="900" font-family="Pretendard,sans-serif">수술 유형별 비교 매트릭스</text>
  <text x="540" y="108" text-anchor="middle" fill="#94A3B8" font-size="20" font-family="Pretendard,sans-serif">50대 무릎 인공관절 — 2026년 4월 기준</text>

  <!-- Table Header -->
  <rect x="60" y="140" width="960" height="50" rx="12" fill="#0F766E"/>
  <text x="160" y="172" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">비교 항목</text>
  <text x="365" y="172" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">전치환술</text>
  <text x="555" y="172" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">부분치환술</text>
  <text x="745" y="172" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">로봇 수술</text>
  <text x="920" y="172" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">줄기세포</text>

  <!-- Row 1 -->
  <rect x="60" y="200" width="960" height="55" fill="#1E293B"/>
  <text x="160" y="234" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="600" font-family="Pretendard,sans-serif">평균 비용</text>
  <text x="365" y="234" text-anchor="middle" fill="#5EEAD4" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">611만</text>
  <text x="555" y="234" text-anchor="middle" fill="#5EEAD4" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">460만</text>
  <text x="745" y="234" text-anchor="middle" fill="#FDE68A" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">611만+a</text>
  <text x="920" y="234" text-anchor="middle" fill="#C4B5FD" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">850만</text>

  <!-- Row 2 -->
  <rect x="60" y="260" width="960" height="55" fill="#0F172A"/>
  <text x="160" y="294" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="600" font-family="Pretendard,sans-serif">건보 적용</text>
  <text x="365" y="294" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">60세+ KL3~4</text>
  <text x="555" y="294" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">60세+ KL3~4</text>
  <text x="745" y="294" text-anchor="middle" fill="#FDE68A" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">수술비만 급여</text>
  <text x="920" y="294" text-anchor="middle" fill="#F87171" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">비급여</text>

  <!-- Row 3 -->
  <rect x="60" y="320" width="960" height="55" fill="#1E293B"/>
  <text x="160" y="354" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="600" font-family="Pretendard,sans-serif">급여 시 본인부담</text>
  <text x="365" y="354" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">~120만</text>
  <text x="555" y="354" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">~92만</text>
  <text x="745" y="354" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">120만+로봇료</text>
  <text x="920" y="354" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">전액 자부담</text>

  <!-- Row 4 -->
  <rect x="60" y="380" width="960" height="55" fill="#0F172A"/>
  <text x="160" y="414" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="600" font-family="Pretendard,sans-serif">내구성</text>
  <text x="365" y="414" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">15~25년</text>
  <text x="555" y="414" text-anchor="middle" fill="#FDE68A" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">10~15년</text>
  <text x="745" y="414" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">수명 연장</text>
  <text x="920" y="414" text-anchor="middle" fill="#C4B5FD" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">수술 지연</text>

  <!-- Row 5 -->
  <rect x="60" y="440" width="960" height="55" fill="#1E293B"/>
  <text x="160" y="474" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="600" font-family="Pretendard,sans-serif">재수술 위험</text>
  <text x="365" y="474" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">낮음</text>
  <text x="555" y="474" text-anchor="middle" fill="#F87171" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">높음 (50대)</text>
  <text x="745" y="474" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">매우 낮음</text>
  <text x="920" y="474" text-anchor="middle" fill="#94A3B8" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">해당 없음</text>

  <!-- Row 6 -->
  <rect x="60" y="500" width="960" height="55" fill="#0F172A"/>
  <text x="160" y="534" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="600" font-family="Pretendard,sans-serif">50대 적합도</text>
  <text x="365" y="534" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">높음 (표준)</text>
  <text x="555" y="534" text-anchor="middle" fill="#FDE68A" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">보통</text>
  <text x="745" y="534" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">매우 높음</text>
  <text x="920" y="534" text-anchor="middle" fill="#86EFAC" font-size="19" font-weight="800" font-family="Pretendard,sans-serif">높음 (초기)</text>

  <!-- Bottom: 실손 세대별 보장 -->
  <text x="540" y="610" text-anchor="middle" fill="#5EEAD4" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">실손보험 세대별 도수치료 보장</text>

  <!-- 4 mini cards -->
  <rect x="60" y="640" width="220" height="120" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="170" y="672" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">1세대 (2009.9 이전)</text>
  <text x="170" y="705" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">연 30회</text>
  <text x="170" y="735" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="Pretendard,sans-serif">자부담 거의 없음</text>

  <rect x="305" y="640" width="220" height="120" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="415" y="672" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">2세대 (~2017.3)</text>
  <text x="415" y="705" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">연 180회</text>
  <text x="415" y="735" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="Pretendard,sans-serif">80~90% 보상</text>

  <rect x="550" y="640" width="220" height="120" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="660" y="672" text-anchor="middle" fill="#FDE68A" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">3·4세대 (~2026.3)</text>
  <text x="660" y="705" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">연 50회</text>
  <text x="660" y="735" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="Pretendard,sans-serif">자부담 30%</text>

  <rect x="795" y="640" width="225" height="120" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="908" y="672" text-anchor="middle" fill="#FCA5A5" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">5세대 (2026.4~)</text>
  <text x="908" y="705" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">대폭 축소</text>
  <text x="908" y="735" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="Pretendard,sans-serif">50%+ 또는 미보장</text>

  <!-- Insight -->
  <rect x="60" y="800" width="960" height="90" rx="16" fill="#0F766E" opacity="0.15"/>
  <rect x="60" y="800" width="960" height="90" rx="16" stroke="#0D9488" stroke-width="2" fill="none"/>
  <text x="540" y="835" text-anchor="middle" fill="#5EEAD4" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">핵심 인사이트</text>
  <text x="540" y="870" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600" font-family="Pretendard,sans-serif">50대는 재수술 비용(1,001만)을 고려해 첫 수술의 정밀도에 투자하는 것이 장기적으로 유리</text>

  <!-- Legend -->
  <circle cx="300" cy="940" r="8" fill="#86EFAC"/>
  <text x="318" y="946" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">유리</text>
  <circle cx="400" cy="940" r="8" fill="#FDE68A"/>
  <text x="418" y="946" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">보통</text>
  <circle cx="500" cy="940" r="8" fill="#F87171"/>
  <text x="518" y="946" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">불리</text>
  <circle cx="600" cy="940" r="8" fill="#C4B5FD"/>
  <text x="618" y="946" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">줄기세포</text>

  <!-- Footer -->
  <text x="540" y="1050" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준 심평원 데이터</text>
</svg>
