<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <!-- Title -->
  <text x="540" y="65" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="900" font-family="Pretendard,sans-serif">생활 패턴별 렌즈 추천 가이드</text>
  <text x="540" y="100" text-anchor="middle" fill="#94A3B8" font-size="19" font-family="Pretendard,sans-serif">예산·직업·운전 빈도에 따른 최적 선택 — 2026년 기준</text>

  <!-- Scenario 1: 사무직 -->
  <rect x="60" y="130" width="960" height="145" rx="18" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="80" y="148" width="54" height="54" rx="27" fill="#0D9488"/>
  <text x="107" y="183" text-anchor="middle" fill="#FFF" font-size="26" font-weight="900" font-family="Pretendard,sans-serif">1</text>
  <text x="150" y="170" fill="#5EEAD4" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">사무직 · PC·서류 작업 중심</text>
  <text x="150" y="200" fill="#FFFFFF" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">→ 팬옵틱스 (알콘) ~300만</text>
  <text x="150" y="230" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">60cm 모니터 거리 최적화 | 4중 초점으로 원·중·근 모두 커버</text>
  <rect x="150" y="245" width="500" height="4" rx="2" fill="#0D9488" opacity="0.3"/>
  <text x="150" y="265" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">클라레온 재질 → 장기 투명도 우수, Glistening 억제 | 근거리도 ★★★★</text>

  <!-- Scenario 2: 독서 -->
  <rect x="60" y="295" width="960" height="145" rx="18" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="80" y="313" width="54" height="54" rx="27" fill="#3B82F6"/>
  <text x="107" y="348" text-anchor="middle" fill="#FFF" font-size="26" font-weight="900" font-family="Pretendard,sans-serif">2</text>
  <text x="150" y="335" fill="#93C5FD" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">독서·스마트폰 · 근거리 중시</text>
  <text x="150" y="365" fill="#FFFFFF" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">→ 시너지 (J&amp;J) 280~300만</text>
  <text x="150" y="395" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">33cm 근거리 선명도 최강 | 연속초점으로 자연스러운 시야 전환</text>
  <rect x="150" y="410" width="500" height="4" rx="2" fill="#3B82F6" opacity="0.3"/>
  <text x="150" y="430" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">다초점+EDOF 결합 기술 | 독서·핸드폰 하루 3시간+ 사용자 만족도 높음</text>

  <!-- Scenario 3: 야간 운전 -->
  <rect x="60" y="460" width="960" height="145" rx="18" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="80" y="478" width="54" height="54" rx="27" fill="#8B5CF6"/>
  <text x="107" y="513" text-anchor="middle" fill="#FFF" font-size="26" font-weight="900" font-family="Pretendard,sans-serif">3</text>
  <text x="150" y="500" fill="#C4B5FD" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">야간 운전 · 빛번짐 민감</text>
  <text x="150" y="530" fill="#FFFFFF" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">→ 퓨어See (J&amp;J) 240~280만</text>
  <text x="150" y="560" fill="#94A3B8" font-size="16" font-family="Pretendard,sans-serif">회절링 없는 굴절형 설계 → 야간 빛 번짐·달무리 획기적 감소</text>
  <rect x="150" y="575" width="500" height="4" rx="2" fill="#8B5CF6" opacity="0.3"/>
  <text x="150" y="595" fill="#64748B" font-size="14" font-family="Pretendard,sans-serif">야간 운전 주 3회+ | 빛 번짐 예민한 분에게 혁신적 대안 | 가격도 다소 저렴</text>

  <!-- Scenario 4: 비용 절감 -->
  <rect x="60" y="625" width="460" height="145" rx="18" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="80" y="643" width="54" height="54" rx="27" fill="#22C55E"/>
  <text x="107" y="678" text-anchor="middle" fill="#FFF" font-size="26" font-weight="900" font-family="Pretendard,sans-serif">4</text>
  <text x="150" y="665" fill="#86EFAC" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">예산 제한 · 비용 절감</text>
  <text x="150" y="695" fill="#FFFFFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">→ 아이핸스 100~150만</text>
  <text x="150" y="720" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">단초점+강화 | 빛번짐 제로</text>
  <text x="150" y="745" fill="#64748B" font-size="13" font-family="Pretendard,sans-serif">돋보기 병용 OK | 비용 대비 만족도 높음</text>

  <!-- Scenario 5: 난시 -->
  <rect x="560" y="625" width="460" height="145" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="580" y="643" width="54" height="54" rx="27" fill="#F59E0B"/>
  <text x="607" y="678" text-anchor="middle" fill="#FFF" font-size="26" font-weight="900" font-family="Pretendard,sans-serif">5</text>
  <text x="650" y="665" fill="#FDE68A" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">난시 동반 · 균형 시력</text>
  <text x="650" y="695" fill="#FFFFFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">→ 리사트리 250~300만</text>
  <text x="650" y="720" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">난시 교정 최우수 | 유럽 1위</text>
  <text x="650" y="745" fill="#64748B" font-size="13" font-family="Pretendard,sans-serif">칼자이스 3중 초점 | 원·중·근 균형</text>

  <!-- Bonus: 저소득 60세+ -->
  <rect x="60" y="790" width="960" height="100" rx="18" fill="#0F766E" opacity="0.12"/>
  <rect x="60" y="790" width="960" height="100" rx="18" stroke="#0D9488" stroke-width="2" fill="none"/>
  <rect x="80" y="810" width="54" height="54" rx="27" fill="#0F766E"/>
  <text x="107" y="844" text-anchor="middle" fill="#FFF" font-size="22" font-weight="900" font-family="Pretendard,sans-serif">★</text>
  <text x="150" y="832" fill="#5EEAD4" font-size="20" font-weight="800" font-family="Pretendard,sans-serif">60세+ 저소득 (기초수급·차상위)</text>
  <text x="150" y="862" fill="#FFFFFF" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">→ 단초점 + 노인 개안 수술비 지원 (본인부담금 전액 지원)</text>
  <text x="150" y="885" fill="#94A3B8" font-size="14" font-family="Pretendard,sans-serif">보건소 사전 신청 필수 | 수술 후 소급 불가 | 다초점 미지원</text>

  <!-- 의사결정 팁 -->
  <rect x="60" y="915" width="960" height="65" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="942" text-anchor="middle" fill="#E2E8F0" font-size="17" font-weight="700" font-family="Pretendard,sans-serif">의사결정 체크: ① 하루 가장 많이 보는 거리는? ② 야간 운전 빈도는? ③ 예산 한도는?</text>
  <text x="540" y="968" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="Pretendard,sans-serif">IOL Master 정밀 검사 후 안과 전문의와 상담하면 생활 패턴 맞춤 추천을 받을 수 있습니다</text>

  <!-- Footer -->
  <text x="540" y="1050" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
</svg>
