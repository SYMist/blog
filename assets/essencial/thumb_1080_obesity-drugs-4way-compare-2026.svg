  <text x="60" y="767" fill="#86EFAC" font-size="17" font-weight="700" font-family="sans-serif">월 약 15만 · 매일 캡슐 · 가성비 1위</text>
  <text x="60" y="798" fill="#CBD5E1" font-size="14" font-family="sans-serif">✅ 주사 없음 · 향정신성 부작용 주의 (녹내장·우울증 금기)</text>

  <rect x="40" y="835" width="1000" height="80" rx="14" fill="url(#amberGrad)" fill-opacity="0.85" stroke="#D97706" stroke-width="2"/>
  <text x="60" y="868" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">삭센다 — 최저가 (-7.5%)</text>
