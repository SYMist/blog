  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <circle cx="920" cy="160" r="220" fill="#7C3AED" fill-opacity="0.08"/>
  <circle cx="160" cy="920" r="180" fill="#0F766E" fill-opacity="0.08"/>

  <rect x="40" y="40" width="120" height="34" rx="17" fill="#0F766E" fill-opacity="0.3" stroke="#0F766E" stroke-width="1.5"/>
  <text x="100" y="63" text-anchor="middle" fill="#99F6E4" font-size="14" font-weight="700" font-family="sans-serif">건강·의료</text>

