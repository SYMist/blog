  <text x="412" y="63" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">4종 비만약</text>

  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">위고비·삭센다·마운자로</text>
  <text x="540" y="232" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">큐시미아 4종 비교</text>
  <text x="540" y="280" text-anchor="middle" fill="#DDD6FE" font-size="22" font-weight="600" font-family="sans-serif">효과·가격·부작용·처방 (2026)</text>

  <rect x="200" y="308" width="680" height="3" rx="1.5" fill="#7C3AED" fill-opacity="0.6"/>

