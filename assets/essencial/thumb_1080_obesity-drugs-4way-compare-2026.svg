  <text x="540" y="398" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">효과 2.7배 차 · 가격 최대 11배 차</text>

  <rect x="40" y="430" width="1000" height="125" rx="14" fill="url(#purpleGrad)" fill-opacity="0.85" stroke="#7C3AED" stroke-width="2"/>
