  <rect x="40" y="930" width="1000" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="960" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">⚠️ 2024.12.02부터 4종 모두 비대면 처방 금지</text>
  <text x="540" y="988" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">병원 직접 방문 필수 · 약물 중단 시 1년 내 요요 위험 · 의사 상담 후 결정</text>
  <text x="540" y="1010" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="sans-serif">큐시미아는 향정신성 의약품으로 원래 비대면 처방 불가</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 건강·의료 · 2026.05 기준 · 비급여 전문의약품 · 의사 처방 필수 · 의료 자문 아님</text>
