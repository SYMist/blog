<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <circle cx="920" cy="160" r="220" fill="#1E40AF" fill-opacity="0.08"/>
  <circle cx="160" cy="920" r="180" fill="#15803D" fill-opacity="0.08"/>

  <!-- Chips -->
  <rect x="40" y="40" width="100" height="34" rx="17" fill="#1E40AF" fill-opacity="0.3" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="90" y="63" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700" font-family="sans-serif">자동차</text>

  <rect x="156" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="226" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="312" y="40" width="160" height="34" rx="17" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="392" y="63" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">4종 연료 비교</text>

  <!-- Title -->
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">LPG · 가솔린 · 디젤</text>
  <text x="540" y="234" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">· 하이브리드 5년 비교</text>
  <text x="540" y="282" text-anchor="middle" fill="#93C5FD" font-size="22" font-weight="600" font-family="sans-serif">동급 중형 SUV TCO 시뮬레이션 (2026)</text>

  <rect x="200" y="310" width="680" height="3" rx="1.5" fill="#1E40AF" fill-opacity="0.6"/>

  <!-- Key stat -->
  <rect x="160" y="330" width="760" height="80" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="368" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">5년 TCO 격차 (LPG 최저 ↔ 하이브리드 최고)</text>
  <text x="540" y="398" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">약 519만원 · 운전 패턴이 정답 결정</text>

  <!-- Two cards -->
  <rect x="40" y="430" width="480" height="510" rx="20" fill="url(#greenGrad)" fill-opacity="0.85" stroke="#15803D" stroke-width="2"/>
  <text x="280" y="482" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">LPG (TCO 1위)</text>
  <text x="280" y="510" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">쏘렌토 LPG급 · 8km/L</text>
  <line x1="70" y1="530" x2="480" y2="530" stroke="#14532d" stroke-width="1.5"/>
  <text x="280" y="568" text-anchor="middle" fill="#86EFAC" font-size="28" font-weight="800" font-family="sans-serif">5년 약 4,216만원</text>
  <text x="280" y="598" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연료비 1,031만원 · 구매 3,000만원</text>
  <line x1="70" y1="620" x2="480" y2="620" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="652" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 구매가 가장 저렴</text>
  <text x="80" y="680" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 연료 단가 1,100원/L</text>
  <text x="80" y="708" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 셀프충전 허용 (24시간 800곳)</text>
  <line x1="70" y1="730" x2="480" y2="730" stroke="#14532d" stroke-width="1.5"/>
  <rect x="70" y="748" width="380" height="38" rx="10" fill="#15803D" fill-opacity="0.4"/>
  <text x="260" y="773" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">단거리·근거리 운전에 압도적</text>
  <text x="280" y="822" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">가솔린 대비 5년 294만원 절감</text>
  <text x="280" y="848" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 충전소 인프라 사전 확인 필수</text>

  <rect x="560" y="430" width="480" height="510" rx="20" fill="url(#blueGrad)" fill-opacity="0.85" stroke="#3B82F6" stroke-width="2"/>
  <text x="800" y="482" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">하이브리드 (연료비 1위)</text>
  <text x="800" y="510" text-anchor="middle" fill="#BFDBFE" font-size="15" font-family="sans-serif">쏘렌토 HEV급 · 18km/L</text>
  <line x1="590" y1="530" x2="1000" y2="530" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="800" y="568" text-anchor="middle" fill="#BFDBFE" font-size="28" font-weight="800" font-family="sans-serif">5년 약 4,735만원</text>
  <text x="800" y="598" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">연료비 750만원 · 구매 3,800만원</text>
  <line x1="590" y1="620" x2="1000" y2="620" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="600" y="652" fill="#67E8F9" font-size="15" font-weight="700" font-family="sans-serif">✅ 연료비 5년 750만원</text>
  <text x="600" y="680" fill="#67E8F9" font-size="15" font-weight="700" font-family="sans-serif">✅ 친환경 혜택 (취득세·주차)</text>
  <text x="600" y="708" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 구매가 800만원 비쌈</text>
  <line x1="590" y1="730" x2="1000" y2="730" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="590" y="748" width="380" height="38" rx="10" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="780" y="773" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700" font-family="sans-serif">도심 정체 + 7년+ 장기 보유</text>
  <text x="800" y="822" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">디젤 대비 손익분기 약 9년</text>
  <text x="800" y="848" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 친환경 혜택 일몰 검토 중</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 가솔린 4,510만원 · 디젤 4,545만원 · 차종·운전 패턴에 따라 다름</text>
</svg>
