<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)" rx="32"/>

  <text x="540" y="70" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="900" font-family="Pretendard,sans-serif">상황별 최적 선택 가이드</text>
  <text x="540" y="108" text-anchor="middle" fill="#94A3B8" font-size="20" font-family="Pretendard,sans-serif">10년 된 차 처분 — 연료·등급·상태별 전략</text>

  <!-- Scenario 1 -->
  <rect x="60" y="145" width="960" height="145" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="80" y="165" width="280" height="34" rx="17" fill="#F59E0B"/>
  <text x="220" y="188" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">4·5등급 경유 + 신차 계획</text>
  <text x="80" y="230" fill="#E2E8F0" font-size="22" font-weight="700" font-family="Pretendard,sans-serif">추천: 조기폐차</text>
  <text x="80" y="265" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">보조금 100% + 고철비 최대 120만 + 저소득 추가 100만 | 올해가 마지막 기회</text>

  <!-- Scenario 2 -->
  <rect x="60" y="310" width="960" height="145" rx="18" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="80" y="330" width="320" height="34" rx="17" fill="#3B82F6"/>
  <text x="240" y="353" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">가솔린/LPG + 주행 가능 + 인기 차종</text>
  <text x="80" y="395" fill="#E2E8F0" font-size="22" font-weight="700" font-family="Pretendard,sans-serif">추천: 중고차 수출</text>
  <text x="80" y="430" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">폐차 대비 100~300만 원 추가 | 주행거리 30만km도 OK | 아반떼·투싼·그랜저 강세</text>

  <!-- Scenario 3 -->
  <rect x="60" y="475" width="960" height="145" rx="18" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <rect x="80" y="495" width="280" height="34" rx="17" fill="#EF4444"/>
  <text x="220" y="518" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">사고 다수 / 엔진 · 미션 불량</text>
  <text x="80" y="560" fill="#E2E8F0" font-size="22" font-weight="700" font-family="Pretendard,sans-serif">추천: 일반 폐차</text>
  <text x="80" y="595" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">고철 + 촉매 귀금속 + 비철금속 별도 정산 | 2026 금속 시세 사상 최고</text>

  <!-- Scenario 4 -->
  <rect x="60" y="640" width="960" height="145" rx="18" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="80" y="660" width="280" height="34" rx="17" fill="#22C55E"/>
  <text x="220" y="683" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">5등급 + 저소득 / 소상공인</text>
  <text x="80" y="725" fill="#E2E8F0" font-size="22" font-weight="700" font-family="Pretendard,sans-serif">추천: 조기폐차 필수</text>
  <text x="80" y="760" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">보조금 100% + 추가 100만 + DPF 불가 시 60~100만 추가 | 최대 혜택 구간</text>

  <!-- Scenario 5 -->
  <rect x="60" y="805" width="960" height="145" rx="18" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="80" y="825" width="260" height="34" rx="17" fill="#8B5CF6"/>
  <text x="210" y="848" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">수출도 폐차도 고민</text>
  <text x="80" y="890" fill="#E2E8F0" font-size="22" font-weight="700" font-family="Pretendard,sans-serif">추천: 수출 견적 먼저 → 폐차비와 비교</text>
  <text x="80" y="925" fill="#94A3B8" font-size="17" font-family="Pretendard,sans-serif">2~3곳 수출 견적 비교 후, 조기폐차(보조금+고철) 합산액과 비교하여 결정</text>

  <text x="540" y="1005" text-anchor="middle" fill="#3B82F6" font-size="22" font-weight="800" font-family="Pretendard,sans-serif">2026년은 노후차 자산 유동화의 골든타임</text>
  <text x="540" y="1050" text-anchor="middle" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
</svg>
