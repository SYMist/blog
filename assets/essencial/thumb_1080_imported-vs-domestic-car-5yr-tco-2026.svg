  <text x="80" y="710" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 잔존 50% (1,650만원)</text>
  <line x1="70" y1="730" x2="480" y2="730" stroke="#14532d" stroke-width="1.5"/>
  <rect x="70" y="748" width="380" height="38" rx="10" fill="#15803D" fill-opacity="0.4"/>
  <text x="260" y="773" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">총비용 절감이 우선이면 선택</text>
  <text x="280" y="822" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">차량모델등급 약 16등급</text>
  <text x="280" y="848" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 자차보험료 50% 저렴</text>

  <rect x="560" y="434" width="480" height="510" rx="20" fill="url(#blueGrad)" fill-opacity="0.85" stroke="#3B82F6" stroke-width="2"/>
  <text x="800" y="486" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">수입 중형</text>
  <text x="800" y="514" text-anchor="middle" fill="#BFDBFE" font-size="15" font-family="sans-serif">BMW 320i급 · 6,200만원</text>
  <line x1="590" y1="534" x2="1000" y2="534" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="800" y="572" text-anchor="middle" fill="#BFDBFE" font-size="28" font-weight="800" font-family="sans-serif">5년 약 7,030만원</text>
  <text x="800" y="602" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">월 약 117만원</text>
  <line x1="590" y1="624" x2="1000" y2="624" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="600" y="654" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 보험료 연 160만원</text>
  <text x="600" y="682" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 정비비 5년 700만원</text>
  <text x="600" y="710" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 잔존 40% (2,480만원)</text>
  <line x1="590" y1="730" x2="1000" y2="730" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="590" y="748" width="380" height="38" rx="10" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="780" y="773" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700" font-family="sans-serif">사업자·장기 보유면 고려</text>
  <text x="800" y="822" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">차량모델등급 약 6등급</text>
  <text x="800" y="848" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 절대 감가 2배 (3,720만원)</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 중형 2.0L · 5년 7만 5천km · 실제 값은 차종·조건에 따라 다릅니다</text>
</svg>
