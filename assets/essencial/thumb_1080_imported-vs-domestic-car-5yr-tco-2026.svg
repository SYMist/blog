  <text x="280" y="572" text-anchor="middle" fill="#86EFAC" font-size="28" font-weight="800" font-family="sans-serif">5년 약 3,776만원</text>
  <text x="280" y="602" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">월 약 63만원</text>
  <line x1="70" y1="624" x2="480" y2="624" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="654" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 보험료 연 70만원</text>
