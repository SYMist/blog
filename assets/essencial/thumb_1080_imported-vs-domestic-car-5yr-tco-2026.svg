  <rect x="180" y="334" width="720" height="80" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="372" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">5년 TCO 격차</text>
  <text x="540" y="402" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">약 3,254만원 차이 · 월 약 54만원</text>

  <!-- Two cards -->
  <rect x="40" y="434" width="480" height="510" rx="20" fill="url(#greenGrad)" fill-opacity="0.85" stroke="#15803D" stroke-width="2"/>
  <text x="280" y="486" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">국산 중형</text>
  <text x="280" y="514" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">쏘나타 2.0급 · 3,300만원</text>
