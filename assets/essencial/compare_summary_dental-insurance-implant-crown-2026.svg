    <rect x="0" y="0" width="230" height="4" rx="2" fill="#7C3AED"/>
    <text x="115" y="28" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="700" font-family="sans-serif">금·세라믹 인레이</text>
    <text x="115" y="55" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="sans-serif">15만 원</text>
    <text x="115" y="78" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">라이나 기준 / 비급여</text>

    <rect x="250" y="0" width="230" height="90" rx="12" fill="#1e293b"/>
    <rect x="250" y="0" width="230" height="4" rx="2" fill="#3B82F6"/>
    <text x="365" y="28" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">레진 직접 충전</text>
    <text x="365" y="55" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="sans-serif">5만 원</text>
    <text x="365" y="78" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">비급여 / 심미성</text>

    <rect x="500" y="0" width="230" height="90" rx="12" fill="#1e293b"/>
    <rect x="500" y="0" width="230" height="4" rx="2" fill="#94A3B8"/>
    <text x="615" y="28" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="700" font-family="sans-serif">아말감·GI</text>
    <text x="615" y="55" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="sans-serif">1만 원</text>
    <text x="615" y="78" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">급여 항목</text>
  </g>

  <!-- Footer -->
  <text x="430" y="1380" text-anchor="middle" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 2026년 4월 기준 | 보험다모아·보험사 약관 참고</text>
