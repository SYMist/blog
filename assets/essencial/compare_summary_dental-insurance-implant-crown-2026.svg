    <rect x="5" y="190" width="770" height="30" rx="6" fill="#34D399" opacity="0.3"/>
    <text x="390" y="210" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">가입 즉시 100% 보장</text>
  </g>

  <!-- 진단형 vs 무진단형 -->
