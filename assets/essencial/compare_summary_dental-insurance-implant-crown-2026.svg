    <rect x="0" y="105" width="780" height="40" rx="8" fill="#1e293b"/>
    <rect x="5" y="110" width="160" height="30" rx="6" fill="#EF4444" opacity="0.5"/>
    <text x="85" y="130" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700" font-family="sans-serif">면책 90일</text>
    <rect x="170" y="110" width="420" height="30" rx="6" fill="#F59E0B" opacity="0.3"/>
    <text x="380" y="130" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700" font-family="sans-serif">감액 2년 (50%)</text>
