    <text x="492" y="68" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">90일</text>
    <text x="492" y="95" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">질병 치료 기준</text>
    <text x="492" y="112" text-anchor="middle" fill="#34D399" font-size="11" font-family="sans-serif">상해 = 즉시 보장</text>

    <rect x="600" y="0" width="185" height="120" rx="14" fill="#1e293b"/>
    <rect x="600" y="0" width="185" height="4" rx="2" fill="#3B82F6"/>
    <text x="692" y="32" text-anchor="middle" fill="#93C5FD" font-size="12" font-weight="600" font-family="sans-serif">보철 감액기간</text>
    <text x="692" y="68" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="sans-serif">2년</text>
