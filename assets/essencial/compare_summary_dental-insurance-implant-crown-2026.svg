    <text x="430" y="170" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">1회 한정</text>
    <text x="580" y="170" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">최대 100만</text>
    <text x="720" y="170" text-anchor="middle" fill="#F87171" font-size="13" font-family="sans-serif">미포함</text>

