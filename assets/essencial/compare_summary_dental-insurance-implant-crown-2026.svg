    <text x="280" y="206" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">2~64세</text>
    <text x="430" y="206" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="600" font-family="sans-serif">2~70세</text>
    <text x="580" y="206" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="600" font-family="sans-serif">0~70세</text>
    <text x="720" y="206" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">-</text>

    <!-- Row 6: 핵심 강점 -->
