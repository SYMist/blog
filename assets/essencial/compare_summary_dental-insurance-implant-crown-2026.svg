  </defs>
  <rect width="860" height="1400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="430" y="45" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="600" font-family="sans-serif">essencial | 치아보험 4사 비교</text>
  <text x="430" y="82" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">임플란트·크라운 보장 조건 한눈에 비교 (2026)</text>

  <!-- 4 Key Cards -->
