    <text x="280" y="24" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="700" font-family="sans-serif">삼성화재</text>
    <text x="430" y="24" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="700" font-family="sans-serif">DB손해보험</text>
    <text x="580" y="24" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="700" font-family="sans-serif">라이나생명</text>
    <text x="720" y="24" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="700" font-family="sans-serif">라이프플래닛</text>

    <!-- Row 1: 임플란트 -->
    <rect x="0" y="40" width="780" height="34" fill="#1e293b"/>
    <text x="100" y="62" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">임플란트</text>
    <text x="280" y="62" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">무제한</text>
    <text x="430" y="62" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">무제한</text>
    <text x="580" y="62" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="700" font-family="sans-serif">연 3개</text>
    <text x="720" y="62" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="700" font-family="sans-serif">연 3개</text>

    <!-- Row 2: 크라운 -->
    <rect x="0" y="76" width="780" height="34" fill="#253044"/>
    <text x="100" y="98" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="sans-serif">크라운</text>
    <text x="280" y="98" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">무제한</text>
    <text x="430" y="98" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">상품별 상이</text>
    <text x="580" y="98" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="600" font-family="sans-serif">2년 후 무제한</text>
