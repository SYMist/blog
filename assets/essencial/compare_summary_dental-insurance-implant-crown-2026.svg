    <text x="185" y="58" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600" font-family="sans-serif">치과 검진 후 가입</text>
    <text x="185" y="82" text-anchor="middle" fill="#34D399" font-size="15" font-weight="800" font-family="sans-serif">면책·감액 없음 → 즉시 100%</text>
    <text x="185" y="106" text-anchor="middle" fill="#34D399" font-size="13" font-weight="600" font-family="sans-serif">보험료 저렴</text>
