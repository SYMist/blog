    <text x="100" y="245" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700" font-family="sans-serif">핵심 강점</text>
    <text x="280" y="240" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="600" font-family="sans-serif">무제한+치조골</text>
