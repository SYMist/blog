    <rect x="410" y="0" width="370" height="150" rx="16" fill="#1e293b"/>
    <rect x="410" y="0" width="370" height="4" rx="2" fill="#F59E0B"/>
    <text x="595" y="32" text-anchor="middle" fill="#FBBF24" font-size="16" font-weight="700" font-family="sans-serif">무진단형</text>
    <text x="595" y="58" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600" font-family="sans-serif">고지의무 답변만으로 가입</text>
    <text x="595" y="82" text-anchor="middle" fill="#FBBF24" font-size="15" font-weight="800" font-family="sans-serif">면책 90일 + 감액 1~2년</text>
    <text x="595" y="106" text-anchor="middle" fill="#F87171" font-size="13" font-weight="600" font-family="sans-serif">보험료 상대적 높음</text>
    <text x="595" y="130" text-anchor="middle" fill="#34D399" font-size="12" font-family="sans-serif">가입 절차 간편</text>
