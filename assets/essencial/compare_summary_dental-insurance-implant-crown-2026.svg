    <text x="280" y="134" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">별도 담보</text>
    <text x="430" y="134" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="sans-serif">별도 담보</text>
    <text x="580" y="134" text-anchor="middle" fill="#F87171" font-size="13" font-family="sans-serif">미포함</text>
    <text x="720" y="134" text-anchor="middle" fill="#F87171" font-size="13" font-family="sans-serif">미포함</text>

