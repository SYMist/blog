    <text x="92" y="32" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="600" font-family="sans-serif">삼성화재·DB손보</text>
    <text x="92" y="62" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">임플란트</text>
    <text x="92" y="88" text-anchor="middle" fill="#34D399" font-size="22" font-weight="800" font-family="sans-serif">무제한</text>
    <text x="92" y="110" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">개수 제한 없음</text>

    <rect x="200" y="0" width="185" height="120" rx="14" fill="#1e293b"/>
    <rect x="200" y="0" width="185" height="4" rx="2" fill="#F59E0B"/>
    <text x="292" y="32" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="600" font-family="sans-serif">라이나·라이프플래닛</text>
    <text x="292" y="62" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">임플란트</text>
    <text x="292" y="88" text-anchor="middle" fill="#FBBF24" font-size="22" font-weight="800" font-family="sans-serif">연간 3개</text>
    <text x="292" y="110" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif">한도 제한</text>

