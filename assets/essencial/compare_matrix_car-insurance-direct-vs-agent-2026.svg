  <rect x="30" y="245" width="200" height="38" fill="#162032"/>
  <rect x="230" y="245" width="210" height="38" fill="#162032"/>
  <rect x="440" y="245" width="210" height="38" fill="#162032"/>
  <rect x="650" y="245" width="180" height="38" fill="#162032"/>
  <text x="50" y="270" fill="#A78BFA" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">❹ 사후 관리</text>
