  <text x="330" y="779" text-anchor="middle" fill="#E2E8F0" font-size="13" font-family="Pretendard,sans-serif">만 9세 이하</text>
  <text x="530" y="779" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">1.7~15.3%</text>
  <text x="730" y="779" text-anchor="middle" fill="#E2E8F0" font-size="12" font-family="Pretendard,sans-serif">-</text>

