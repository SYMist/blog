  <rect x="470" y="257" width="130" height="20" rx="10" fill="#EF4444" opacity="0.2"/>
  <text x="545" y="270" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="800" font-family="Pretendard,sans-serif">전담 설계사 ★</text>
  <text x="740" y="270" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600" font-family="Pretendard,sans-serif">콜센터·앱 셀프</text>

