  <text x="882" y="378" text-anchor="middle" fill="#BFDBFE" font-size="26" font-weight="800" font-family="sans-serif">5년 약 4,735만원</text>
  <text x="882" y="406" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="sans-serif">연료비 750만원 · 구매가 3,800만원</text>
  <line x1="635" y1="426" x2="1130" y2="426" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="635" y="454" fill="#67E8F9" font-size="14" font-weight="700" font-family="sans-serif">✅ 연료비 가장 저렴 (5년 750만원)</text>
  <text x="635" y="480" fill="#67E8F9" font-size="14" font-weight="700" font-family="sans-serif">✅ 친환경 혜택 (취득세·주차·통행료)</text>
