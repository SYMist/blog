  <rect x="635" y="526" width="465" height="36" rx="8" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="867" y="550" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700" font-family="sans-serif">도심 정체 출퇴근 + 7년+ 장기 보유 추천</text>

  <text x="40" y="610" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 가솔린 4,510 · 디젤 4,545 · 보험/정비/감가 제외 · 차종·운전 패턴 따라 다름</text>
</svg>
