<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <circle cx="920" cy="160" r="220" fill="#1E40AF" fill-opacity="0.08"/>
  <circle cx="160" cy="920" r="180" fill="#15803D" fill-opacity="0.08"/>

  <!-- Chips -->
  <rect x="40" y="40" width="100" height="34" rx="17" fill="#1E40AF" fill-opacity="0.3" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="90" y="63" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700" font-family="sans-serif">자동차</text>

  <rect x="156" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="226" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="312" y="40" width="160" height="34" rx="17" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="392" y="63" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">옵션 회수율 분석</text>

  <!-- Title -->
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">신차 풀옵션 vs 깡통</text>
  <text x="540" y="234" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">5년 TCO 비교</text>
  <text x="540" y="282" text-anchor="middle" fill="#93C5FD" font-size="22" font-weight="600" font-family="sans-serif">옵션비 1,300만원 회수율 분석 (2026)</text>

  <rect x="200" y="310" width="680" height="3" rx="1.5" fill="#1E40AF" fill-opacity="0.6"/>

  <!-- Key stat -->
  <rect x="160" y="330" width="760" height="80" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="368" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">옵션비 1,300만 → 5년 회수 650만 (50%)</text>
  <text x="540" y="398" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">5년 TCO 약 883만원 차이 · 월 약 15만원</text>

  <!-- Two cards -->
  <rect x="40" y="430" width="480" height="510" rx="20" fill="url(#greenGrad)" fill-opacity="0.85" stroke="#15803D" stroke-width="2"/>
  <text x="280" y="482" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">깡통 (기본 트림)</text>
  <text x="280" y="510" text-anchor="middle" fill="#86EFAC" font-size="15" font-family="sans-serif">쏘나타급 · 2,346만원 · 12km/L</text>
  <line x1="70" y1="530" x2="480" y2="530" stroke="#14532d" stroke-width="1.5"/>
  <text x="280" y="568" text-anchor="middle" fill="#86EFAC" font-size="28" font-weight="800" font-family="sans-serif">5년 약 2,927만원</text>
  <text x="280" y="598" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">월 약 49만원</text>
  <line x1="70" y1="620" x2="480" y2="620" stroke="#14532d" stroke-width="1.5"/>
  <text x="80" y="652" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 옵션비 손실 0원</text>
  <text x="80" y="680" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 연비 12km/L</text>
  <text x="80" y="708" fill="#86EFAC" font-size="15" font-weight="700" font-family="sans-serif">✅ 5년 883만원 절감</text>
  <line x1="70" y1="730" x2="480" y2="730" stroke="#14532d" stroke-width="1.5"/>
  <rect x="70" y="748" width="380" height="38" rx="10" fill="#15803D" fill-opacity="0.4"/>
  <text x="260" y="773" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700" font-family="sans-serif">단기 보유·가성비 우선이면 선택</text>
  <text x="280" y="822" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">안전·편의 옵션은 제한적</text>
  <text x="280" y="848" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 출고 후 사제 장착 일부 가능</text>

  <rect x="560" y="430" width="480" height="510" rx="20" fill="url(#blueGrad)" fill-opacity="0.85" stroke="#3B82F6" stroke-width="2"/>
  <text x="800" y="482" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">풀옵션 (최상위)</text>
  <text x="800" y="510" text-anchor="middle" fill="#BFDBFE" font-size="15" font-family="sans-serif">쏘나타급 · 3,646만원 · 11km/L</text>
  <line x1="590" y1="530" x2="1000" y2="530" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="800" y="568" text-anchor="middle" fill="#BFDBFE" font-size="28" font-weight="800" font-family="sans-serif">5년 약 3,810만원</text>
  <text x="800" y="598" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">월 약 64만원</text>
  <line x1="590" y1="620" x2="1000" y2="620" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="600" y="652" fill="#67E8F9" font-size="15" font-weight="700" font-family="sans-serif">✅ 안전·편의 풀</text>
  <text x="600" y="680" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 옵션비 650만 순손실</text>
  <text x="600" y="708" fill="#FCA5A5" font-size="15" font-weight="700" font-family="sans-serif">❌ 연비 -1km/L (무게↑)</text>
  <line x1="590" y1="730" x2="1000" y2="730" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="590" y="748" width="380" height="38" rx="10" fill="#1E40AF" fill-opacity="0.4"/>
  <text x="780" y="773" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700" font-family="sans-serif">5년+ 장기·편의 우선이면 선택</text>
  <text x="800" y="822" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">회수율: 안전 65% · HUD 30%</text>
  <text x="800" y="848" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">→ 인기 옵션만 추가 권장</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 자동차 · 2026.05 기준 · 인기 옵션만(430만) 추가가 회수율 65% 최적 · 풀옵션은 절세 효과 사업자에 적합</text>
</svg>
