<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="220" height="36" rx="18" fill="#0F766E"/>
  <text x="170" y="74" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800" font-family="sans-serif">2026 관리급여·5세대 실손</text>

  <text x="60" y="145" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">도수치료 비용·실비 총정리</text>
  <text x="60" y="200" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">횟수·자기부담금 1~5세대 비교</text>

  <text x="60" y="255" fill="#E2E8F0" font-size="22" font-weight="600" font-family="sans-serif">평균 7.6만 · 서울 12.8만 · 강남 60만 · 최대 2,000배 격차</text>

  <rect x="60" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="120" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">자기부담률</text>
  <rect x="195" y="285" width="130" height="34" rx="17" fill="#FEF3C7"/>
  <text x="260" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">횟수 한도</text>
  <rect x="340" y="285" width="140" height="34" rx="17" fill="#FEF3C7"/>
  <text x="410" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">관리급여 95%</text>

  <rect x="60" y="345" width="500" height="3" rx="2" fill="#0F766E" opacity="0.5"/>

  <text x="60" y="395" fill="#5EEAD4" font-size="20" font-weight="600" font-family="sans-serif">1~2세대</text>
  <text x="60" y="430" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">관리급여 효과로 실부담 ↓ · 유지 유리</text>

  <text x="60" y="480" fill="#FCA5A5" font-size="20" font-weight="600" font-family="sans-serif">4~5세대</text>
  <text x="60" y="515" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">자부담 30→50% · 연 50회·1,000만 한도</text>

  <!-- Right card -->
  <rect x="850" y="100" width="280" height="420" rx="20" fill="#1e293b" opacity="0.85"/>
  <text x="990" y="148" text-anchor="middle" fill="#5EEAD4" font-size="18" font-weight="700" font-family="sans-serif">2026 핵심 숫자</text>

  <text x="990" y="185" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">전국 평균 비용</text>
  <text x="990" y="212" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">7.6만 원 (+1.6%)</text>

  <rect x="870" y="225" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="255" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">5세대 비중증 자부담</text>
  <text x="990" y="282" text-anchor="middle" fill="#FCD34D" font-size="22" font-weight="800" font-family="sans-serif">30% → 50%</text>

  <rect x="870" y="295" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="325" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">관리급여 본인부담</text>
  <text x="990" y="352" text-anchor="middle" fill="#FCA5A5" font-size="22" font-weight="800" font-family="sans-serif">95%</text>

  <rect x="870" y="365" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="395" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">4세대 최대 할증</text>
  <text x="990" y="422" text-anchor="middle" fill="#F87171" font-size="22" font-weight="800" font-family="sans-serif">300% (4배)</text>

  <rect x="870" y="440" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="470" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">5세대 재가입 주기</text>
  <text x="990" y="497" text-anchor="middle" fill="#2DD4BF" font-size="18" font-weight="700" font-family="sans-serif">15년 → 3년 단축</text>

  <text x="60" y="595" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 비교형 콘텐츠</text>
</svg>
