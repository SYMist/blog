  <text x="295" y="670" text-anchor="middle" fill="#FCD34D" font-size="18" font-weight="600" font-family="sans-serif">전년 +1.6%</text>

  <rect x="540" y="525" width="430" height="170" rx="20" fill="#1e293b" stroke="#0F766E" stroke-width="3"/>
  <text x="755" y="575" text-anchor="middle" fill="#5EEAD4" font-size="20" font-weight="700" font-family="sans-serif">5세대 비중증 자부담</text>
