<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/></linearGradient></defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>

  <!-- 배지 -->
  <rect x="60" y="50" width="200" height="48" rx="24" fill="#EF4444"/>
  <text x="160" y="83" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="800" fill="#FFF">2026 최신</text>

  <!-- 메인 텍스트 (왼쪽) -->
  <text x="60" y="170" font-family="'Pretendard',sans-serif" font-size="62" font-weight="900" fill="#FFF">임플란트 건강보험</text>
  <text x="60" y="250" font-family="'Pretendard',sans-serif" font-size="62" font-weight="900" fill="#FFF">적용 조건·본인부담금</text>

  <!-- 서브 텍스트 -->
  <text x="60" y="320" font-family="'Pretendard',sans-serif" font-size="36" font-weight="600" fill="#E2E8F0">만 65세 이상 | 평생 2개 | 지르코니아 급여 확대</text>

  <!-- 핵심 수치 박스 -->
  <rect x="60" y="370" width="1080" height="90" rx="18" fill="rgba(255,255,255,0.08)"/>
  <text x="600" y="415" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="38" font-weight="800" fill="#10B981">일반 30% 약 39만 원</text>
  <text x="600" y="448" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" fill="#E2E8F0">의료급여 1종 약 13만 원 | 의료급여 2종 약 26만 원</text>

  <!-- 칩 -->
  <rect x="60" y="500" width="180" height="50" rx="25" fill="#FEF3C7"/>
  <text x="150" y="533" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#92400E">비용 비교</text>
  <rect x="260" y="500" width="180" height="50" rx="25" fill="#FEF3C7"/>
  <text x="350" y="533" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#92400E">적용 조건</text>
  <rect x="460" y="500" width="200" height="50" rx="25" fill="#FEF3C7"/>
  <text x="560" y="533" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="24" font-weight="700" fill="#92400E">지르코니아</text>

  <!-- 하단 라인 -->
  <rect x="60" y="590" width="1080" height="5" rx="2" fill="#10B981"/>
</svg>
