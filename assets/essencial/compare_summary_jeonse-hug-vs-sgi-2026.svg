<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="860" height="920" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <rect x="30" y="25" width="220" height="38" rx="19" fill="#EF4444"/>
  <text x="140" y="51" text-anchor="middle" fill="#FFF" font-size="18" font-weight="700" font-family="Pretendard,sans-serif">2026 비교분석</text>
  <text x="30" y="100" fill="#FFF" font-size="30" font-weight="900" font-family="Pretendard,sans-serif">전세보증보험 HUG vs SGI 한눈에 비교</text>
  <rect x="30" y="115" width="260" height="3" rx="2" fill="url(#amber)"/>

  <!-- HUG Card -->
  <rect x="30" y="145" width="390" height="260" rx="16" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
  <rect x="30" y="145" width="390" height="48" rx="16" fill="#D97706"/>
  <rect x="30" y="177" width="390" height="16" fill="#D97706"/>
  <text x="225" y="178" text-anchor="middle" fill="#FFF" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">HUG (주택도시보증공사)</text>
  <rect x="50" y="210" width="70" height="26" rx="13" fill="#FFFBEB"/>
  <text x="85" y="229" text-anchor="middle" fill="#B45309" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">공적</text>
  <text x="50" y="270" fill="#94A3B8" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">아파트 보증료 (연)</text>
  <text x="50" y="298" fill="#FFF" font-size="28" font-weight="900" font-family="Pretendard,sans-serif">0.115 ~ 0.128%</text>
  <text x="50" y="330" fill="#94A3B8" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">수도권 보증 한도</text>
  <text x="50" y="358" fill="#FFF" font-size="28" font-weight="900" font-family="Pretendard,sans-serif">최대 7억 원</text>
  <text x="50" y="390" fill="#FBBF24" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">✓ 공시가 126% 룰 적용 (엄격)</text>

  <!-- SGI Card -->
  <rect x="440" y="145" width="390" height="260" rx="16" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <rect x="440" y="145" width="390" height="48" rx="16" fill="#22C55E"/>
  <rect x="440" y="177" width="390" height="16" fill="#22C55E"/>
  <text x="635" y="178" text-anchor="middle" fill="#FFF" font-size="24" font-weight="800" font-family="Pretendard,sans-serif">SGI (서울보증보험)</text>
  <rect x="460" y="210" width="70" height="26" rx="13" fill="#F0FDF4"/>
  <text x="495" y="229" text-anchor="middle" fill="#166534" font-size="13" font-weight="700" font-family="Pretendard,sans-serif">민간</text>
  <text x="460" y="270" fill="#94A3B8" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">아파트 보증료 (연)</text>
  <text x="460" y="298" fill="#FFF" font-size="28" font-weight="900" font-family="Pretendard,sans-serif">0.192% (기본)</text>
  <text x="460" y="330" fill="#94A3B8" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">아파트 보증 한도</text>
  <text x="460" y="358" fill="#FFF" font-size="28" font-weight="900" font-family="Pretendard,sans-serif">제한 없음</text>
  <text x="460" y="390" fill="#86EFAC" font-size="14" font-weight="600" font-family="Pretendard,sans-serif">✓ LTV별 보증료 차등 (유연)</text>

  <!-- 126% Rule Visualization -->
  <rect x="30" y="425" width="800" height="130" rx="14" fill="#1E293B" stroke="#D97706" stroke-width="1.5"/>
  <text x="50" y="458" fill="#FBBF24" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">📐 126% 룰 작동 원리</text>
  <text x="50" y="488" fill="#E2E8F0" font-size="16" font-weight="600" font-family="Pretendard,sans-serif">공시가격 × 140% × LTV 90% = 공시가격 × 1.26</text>
  <!-- Example bars -->
  <text x="50" y="520" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">공시가 2억 →</text>
  <rect x="180" y="507" width="252" height="20" rx="10" fill="#D97706" opacity="0.3"/>
  <rect x="180" y="507" width="252" height="20" rx="10" fill="url(#amber)"/>
  <text x="440" y="522" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">2.52억 한도</text>
  <text x="50" y="545" fill="#94A3B8" font-size="13" font-family="Pretendard,sans-serif">공시가 5억 →</text>
  <rect x="180" y="532" width="630" height="20" rx="10" fill="#D97706" opacity="0.3"/>
  <rect x="180" y="532" width="630" height="20" rx="10" fill="url(#amber)"/>
  <text x="440" y="547" fill="#FFF" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">6.30억 한도</text>

  <!-- Cost Comparison: 5억 보증금 시뮬레이션 -->
  <rect x="30" y="575" width="800" height="120" rx="14" fill="#1E293B"/>
  <text x="50" y="608" fill="#FFF" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">💰 보증금 5억 원 기준 연간 보증료 비교</text>
  <!-- HUG bar -->
  <text x="50" y="640" fill="#FBBF24" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">HUG</text>
  <rect x="100" y="626" width="230" height="22" rx="11" fill="#D97706"/>
  <text x="340" y="643" fill="#FFF" font-size="15" font-weight="800" font-family="Pretendard,sans-serif">약 57~64만 원</text>
  <!-- SGI bar -->
  <text x="50" y="672" fill="#86EFAC" font-size="14" font-weight="700" font-family="Pretendard,sans-serif">SGI</text>
  <rect x="100" y="658" width="384" height="22" rx="11" fill="#22C55E"/>
  <text x="494" y="675" fill="#FFF" font-size="15" font-weight="800" font-family="Pretendard,sans-serif">약 96만 원 (LTV 할인 시 77만)</text>

  <!-- Warning: 7월 유예종료 -->
  <rect x="30" y="715" width="800" height="75" rx="14" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
  <text x="50" y="748" fill="#FCA5A5" font-size="18" font-weight="800" font-family="Pretendard,sans-serif">⚠️ 2026년 7월 유예 종료</text>
  <text x="50" y="775" fill="#E2E8F0" font-size="15" font-weight="600" font-family="Pretendard,sans-serif">기존 임대사업자도 126% 룰 전면 적용 | 미가입 시 과태료 최대 보증금의 10% (3,000만 한도)</text>

  <!-- Key Tags -->
  <rect x="30" y="810" width="130" height="36" rx="18" fill="#FFFBEB"/>
  <text x="95" y="834" text-anchor="middle" fill="#B45309" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">보증료 비교</text>
  <rect x="175" y="810" width="120" height="36" rx="18" fill="#FFFBEB"/>
  <text x="235" y="834" text-anchor="middle" fill="#B45309" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">126% 룰</text>
  <rect x="310" y="810" width="140" height="36" rx="18" fill="#FFFBEB"/>
  <text x="380" y="834" text-anchor="middle" fill="#B45309" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">한도 차이</text>
  <rect x="465" y="810" width="160" height="36" rx="18" fill="#FFFBEB"/>
  <text x="545" y="834" text-anchor="middle" fill="#B45309" font-size="16" font-weight="700" font-family="Pretendard,sans-serif">7월 유예종료</text>

  <!-- Footer -->
  <text x="30" y="890" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">essencial | 2026년 4월 기준</text>
  <text x="830" y="890" text-anchor="end" fill="#64748B" font-size="16" font-family="Pretendard,sans-serif">대출·금융 비교</text>
</svg>
