<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="240" height="36" rx="18" fill="#B45309"/>
  <text x="180" y="74" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800" font-family="sans-serif">2026 금리 전환기 · 스트레스 DSR 3단계</text>

  <text x="60" y="145" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">주담대 고정 vs 변동 전략</text>
