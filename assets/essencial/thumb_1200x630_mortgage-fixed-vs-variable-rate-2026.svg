  <text x="990" y="352" text-anchor="middle" fill="#FCA5A5" font-size="22" font-weight="800" font-family="sans-serif">5.56억 (−1억)</text>

  <rect x="870" y="365" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="395" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">케이뱅크 최저 금리</text>
  <text x="990" y="422" text-anchor="middle" fill="#86EFAC" font-size="22" font-weight="800" font-family="sans-serif">3.26%</text>

  <rect x="870" y="440" width="240" height="2" rx="1" fill="#334155"/>

  <text x="990" y="470" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">신생아 특례 금리</text>
  <text x="990" y="497" text-anchor="middle" fill="#86EFAC" font-size="20" font-weight="700" font-family="sans-serif">1.8~4.5%</text>

  <text x="60" y="595" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 비교형 콘텐츠</text>
