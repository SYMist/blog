  <text x="60" y="255" fill="#FCD34D" font-size="22" font-weight="600" font-family="sans-serif">한도 우위 · 이자 절감 · 정책 모기지까지 한 번에</text>

  <rect x="60" y="285" width="120" height="34" rx="17" fill="#FEF3C7"/>
  <text x="120" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">기준금리</text>
  <rect x="195" y="285" width="130" height="34" rx="17" fill="#FEF3C7"/>
  <text x="260" y="308" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700" font-family="sans-serif">스트레스 DSR</text>
