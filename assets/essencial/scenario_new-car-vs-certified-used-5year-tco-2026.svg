<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="46" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">신차 vs 인증중고차 상황별 추천 시나리오</text>
  <text x="540" y="70" text-anchor="middle" fill="#93C5FD" font-size="13" font-family="sans-serif">5년 TCO 비교 · 보증 · 감가 · 2026.05 기준</text>

  <!-- Scenario 1 -->
  <rect x="40" y="90" width="480" height="116" rx="10" fill="#1e3a8a" fill-opacity="0.6" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="40" y="90" width="480" height="36" rx="10" fill="#1E40AF"/>
  <rect x="40" y="112" width="480" height="14" fill="#1E40AF"/>
  <text x="60" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">① 5년 이상 장기 보유 계획인 경우</text>
  <text x="60" y="148" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 신차 유리 (감가 분산 + 보증 극대화)</text>
  <text x="60" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">제조사 보증 5년/10만km로 정비비 리스크 최소화</text>
  <text x="60" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">감가상각 손실이 장기간에 분산되어 연간 부담 감소</text>

  <!-- Scenario 2 -->
  <rect x="560" y="90" width="480" height="116" rx="10" fill="#134e4a" fill-opacity="0.6" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="560" y="90" width="480" height="36" rx="10" fill="#0F766E"/>
  <rect x="560" y="112" width="480" height="14" fill="#0F766E"/>
  <text x="580" y="114" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">② 3~5년 단기 보유 후 교체 예정인 경우</text>
  <text x="580" y="148" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">→ 인증중고차 유리 (TCO 657만원 절감)</text>
  <text x="580" y="170" fill="#CBD5E1" font-size="12" font-family="sans-serif">급격한 초기 감가 구간을 피하고 낮은 취득세·보험료 확보</text>
  <text x="580" y="192" fill="#CBD5E1" font-size="12" font-family="sans-serif">3년식 기준 이미 60% 감가 완료 → 추가 감가 완만</text>

  <!-- Scenario 3 -->
  <rect x="40" y="226" width="480" height="116" rx="10" fill="#1e3a8a" fill-opacity="0.6" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="40" y="226" width="480" height="36" rx="10" fill="#1E40AF"/>
  <rect x="40" y="248" width="480" height="14" fill="#1E40AF"/>
  <text x="60" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">③ 초기 지출을 최대한 줄여야 하는 경우</text>
  <text x="60" y="284" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">→ 인증중고차 (구매가 1,000만원 + 취득세 70만원 절감)</text>
  <text x="60" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">초기 부담 약 1,077만원 절감. 해당 금액 투자·운용 시 추가 수익 가능</text>
  <text x="60" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">KB차차차·케이카 4일 테스트 주행·집 배송 활용 권장</text>

  <!-- Scenario 4 -->
  <rect x="560" y="226" width="480" height="116" rx="10" fill="#422006" fill-opacity="0.6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="560" y="226" width="480" height="36" rx="10" fill="#D97706"/>
  <rect x="560" y="248" width="480" height="14" fill="#D97706"/>
  <text x="580" y="250" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">④ 차량 상태 불확실성이 걱정되는 경우</text>
  <text x="580" y="284" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">→ 제조사 직영 인증중고차 선택</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="12" font-family="sans-serif">현대·기아 공식 인증 → 100항목 점검 + 보증 + 환불 제도</text>
  <text x="580" y="328" fill="#CBD5E1" font-size="12" font-family="sans-serif">기아 K서티파이드: 7일 내 전액 환불 가능 (가장 강한 보호)</text>

  <!-- Scenario 5 (full width) -->
  <rect x="40" y="362" width="1000" height="116" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="40" y="362" width="1000" height="36" rx="10" fill="#4F46E5"/>
  <rect x="40" y="384" width="1000" height="14" fill="#4F46E5"/>
  <text x="60" y="386" fill="#FFFFFF" font-size="13" font-weight="800" font-family="sans-serif">⑤ 수입 인증중고차를 고려하는 경우</text>
  <text x="60" y="420" fill="#A5B4FC" font-size="13" font-weight="700" font-family="sans-serif">→ 엔카 브랜드 인증중고차 또는 수입사 공식 CPO 프로그램 활용</text>
  <text x="60" y="442" fill="#CBD5E1" font-size="12" font-family="sans-serif">BMW·벤츠·렉서스 공식 인증중고차는 보증 범위와 조건이 국산과 다름 — 약관 사전 확인 필수</text>
  <text x="60" y="464" fill="#CBD5E1" font-size="12" font-family="sans-serif">부품·공임비가 국산 대비 비싸 정비비 변수가 더 크므로 TCO 계산 시 보수적으로 산정 권장</text>

  <!-- Summary box -->
  <rect x="40" y="496" width="1000" height="176" rx="10" fill="#1e293b" fill-opacity="0.8"/>
  <text x="540" y="528" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="800" font-family="sans-serif">핵심 결론 3줄 요약</text>
  <text x="80" y="562" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">5년+ 장기 보유</text>
  <text x="220" y="562" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 신차 (보증·정비비 안정, 감가 분산)</text>
  <text x="80" y="594" fill="#4ADE80" font-size="13" font-weight="700" font-family="sans-serif">3~5년 단기 보유</text>
  <text x="220" y="594" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 인증중고차 (5년 TCO 657만원·15% 절감, 취득세·보험 낮음)</text>
  <text x="80" y="626" fill="#FCD34D" font-size="13" font-weight="700" font-family="sans-serif">인증중고차 주의</text>
  <text x="220" y="626" fill="#FFFFFF" font-size="13" font-family="sans-serif">→ 침수 이력·허위매물·보증 범위 확인 필수 / 제조사 직영 우선</text>
  <text x="80" y="654" fill="#94A3B8" font-size="12" font-family="sans-serif">※ 실제 비용은 차종·보험사·주행거리에 따라 달라집니다. 구매 전 실제 견적 확인 필수</text>

  <text x="40" y="686" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 추정치이며 실제 비용은 다를 수 있습니다</text>
</svg>
