<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <circle cx="920" cy="160" r="220" fill="#7C3AED" fill-opacity="0.08"/>
  <circle cx="160" cy="920" r="180" fill="#DC2626" fill-opacity="0.08"/>

  <!-- Chips -->
  <rect x="40" y="40" width="100" height="34" rx="17" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="90" y="63" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700" font-family="sans-serif">보험 비교</text>

  <rect x="156" y="40" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="226" y="63" text-anchor="middle" fill="#94A3B8" font-size="14" font-family="sans-serif">2026.05 기준</text>

  <rect x="312" y="40" width="160" height="34" rx="17" fill="#14532d" stroke="#15803D" stroke-width="1.5"/>
  <text x="392" y="63" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700" font-family="sans-serif">3종 가입 비교</text>

  <!-- Title -->
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">부모 운전자보험</text>
  <text x="540" y="234" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" font-family="sans-serif">자녀·본인·미가입</text>
  <text x="540" y="282" text-anchor="middle" fill="#DDD6FE" font-size="22" font-weight="600" font-family="sans-serif">65~70세 부모 사고 시뮬 (2026)</text>

  <rect x="200" y="310" width="680" height="3" rx="1.5" fill="#7C3AED" fill-opacity="0.6"/>

  <!-- Key stat -->
  <rect x="160" y="330" width="760" height="80" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="368" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700" font-family="sans-serif">어린이보호구역 사고 1건 자비 부담 격차</text>
  <text x="540" y="398" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">미가입 6,500만 vs 가입 0~500만</text>

  <!-- 3 cards stacked -->
  <rect x="40" y="430" width="1000" height="155" rx="14" fill="url(#greenGrad)" fill-opacity="0.85" stroke="#15803D" stroke-width="2"/>
  <text x="60" y="466" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">① 자녀 대납 + 부모 명의 (자녀 보호자 역할)</text>
  <text x="60" y="498" fill="#86EFAC" font-size="18" font-weight="700" font-family="sans-serif">월 2~5만 · 보험료 자녀 부담 · 보장 부모</text>
  <text x="60" y="530" fill="#CBD5E1" font-size="15" font-family="sans-serif">✅ 부모 거부 시·자녀 보호자 역할 · 자녀 절차 보조</text>
  <text x="60" y="558" fill="#CBD5E1" font-size="15" font-family="sans-serif">— 자녀 명의로는 부모 보장 불가 (반드시 부모 명의)</text>

  <rect x="40" y="595" width="1000" height="155" rx="14" fill="url(#purpleGrad)" fill-opacity="0.85" stroke="#7C3AED" stroke-width="2"/>
  <text x="60" y="631" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">② 부모 본인 가입 + 본인 부담 (일반)</text>
  <text x="60" y="663" fill="#DDD6FE" font-size="18" font-weight="700" font-family="sans-serif">월 2~5만 · 본인 부담 · 소득공제 적용</text>
  <text x="60" y="695" fill="#CBD5E1" font-size="15" font-family="sans-serif">✅ 부모 의지 있을 때·연금 소득 있을 때 합리적</text>
  <text x="60" y="723" fill="#CBD5E1" font-size="15" font-family="sans-serif">— 80세 이상 가입 거절 또는 매우 비쌈 (60~70대 미리)</text>

  <rect x="40" y="760" width="1000" height="155" rx="14" fill="url(#redGrad)" fill-opacity="0.85" stroke="#DC2626" stroke-width="2"/>
  <text x="60" y="796" fill="#FFFFFF" font-size="22" font-weight="800" font-family="sans-serif">③ 미가입 (월 1~2회 단거리만) ⚠️</text>
  <text x="60" y="828" fill="#FCA5A5" font-size="18" font-weight="700" font-family="sans-serif">월 0원 · 사고 1건 6,500만+ 자비</text>
  <text x="60" y="860" fill="#CBD5E1" font-size="15" font-family="sans-serif">✅ 운전 거의 안 함 · 면허 반납 검토 시 미가입 가능</text>
  <text x="60" y="888" fill="#CBD5E1" font-size="15" font-family="sans-serif">— 어린이보호구역 통과 부모는 미가입 절대 금지</text>

  <!-- Bottom note -->
  <rect x="40" y="940" width="1000" height="80" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="970" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="800" font-family="sans-serif">⚠️ 음주·무면허는 약관 면책 (가입해도 자비 부담)</text>
  <text x="540" y="998" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">자동차보험과 별도 상품 · 자동차보험은 대인·대물 / 운전자보험은 형사·민사</text>

  <text x="40" y="1060" fill="#64748B" font-size="13" font-family="sans-serif">essencial | 보험 비교 · 2026.05 기준 · 본인 약관·연령 보험사·금감원(1332) 확인</text>
</svg>
