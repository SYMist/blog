<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="48" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" font-family="sans-serif">전기차 배터리 보증 + 보조금 5년 혜택 비교</text>
  <text x="540" y="74" text-anchor="middle" fill="#93C5FD" font-size="14" font-family="sans-serif">2026년 5월 기준 · 국산 vs 수입 전기차 · 5년 혜택 시뮬레이션</text>
  <rect x="60" y="88" width="960" height="2" rx="1" fill="#1E40AF" fill-opacity="0.5"/>

  <!-- Card 1: 국산 전기차 (현대·기아) -->
  <rect x="40" y="104" width="480" height="500" rx="14" fill="url(#blueCard)" stroke="#1E40AF" stroke-width="2"/>
  <rect x="40" y="104" width="480" height="48" rx="14" fill="#1E40AF"/>
  <rect x="40" y="136" width="480" height="16" fill="#1E40AF"/>
  <text x="280" y="136" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">국산 전기차 (현대·기아·제네시스)</text>
  <text x="280" y="172" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">업계 최장 배터리 보증 · 보조금 최대</text>

  <line x1="70" y1="192" x2="490" y2="192" stroke="#1e3a8a" stroke-width="1"/>

  <text x="280" y="220" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">배터리 보증 (개인 최초 구매 고객)</text>
  <text x="280" y="256" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">10년 / 20만km</text>
  <text x="280" y="280" text-anchor="middle" fill="#4ADE80" font-size="14" font-family="sans-serif">SOH 70% 이상 유지 보증 🏆</text>

  <line x1="70" y1="300" x2="490" y2="300" stroke="#1e3a8a" stroke-width="1"/>

  <text x="280" y="328" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">2026년 5년 총 혜택 (서울 기준)</text>
  <text x="280" y="362" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">최대 970만원</text>
  <text x="280" y="386" text-anchor="middle" fill="#4ADE80" font-size="13" font-family="sans-serif">국고 680만원 + 지자체 150만원 + 취득세 140만원</text>

  <line x1="70" y1="406" x2="490" y2="406" stroke="#1e3a8a" stroke-width="1"/>

  <text x="80" y="440" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 배터리 보증 업계 최장 10년</text>
  <text x="80" y="466" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 지방 거주 시 지자체 보조금 최대 1,100만원</text>
  <text x="80" y="492" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 5년 총 절감 최대 1,200만원 이상</text>

  <rect x="70" y="514" width="390" height="38" rx="10" fill="#1E40AF" fill-opacity="0.3"/>
  <text x="265" y="537" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" font-family="sans-serif">내연차 처분 후 교체 시 전환지원금 +100만원</text>

  <!-- Card 2: 수입 전기차 -->
  <rect x="560" y="104" width="480" height="500" rx="14" fill="url(#tealCard)" stroke="#0F766E" stroke-width="2"/>
  <rect x="560" y="104" width="480" height="48" rx="14" fill="#0F766E"/>
  <rect x="560" y="136" width="480" height="16" fill="#0F766E"/>
  <text x="800" y="136" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800" font-family="sans-serif">수입 전기차 (테슬라·BMW·벤츠)</text>
  <text x="800" y="172" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="sans-serif">글로벌 표준 보증 · 보조금 조건 상이</text>

  <line x1="590" y1="192" x2="1010" y2="192" stroke="#134e4a" stroke-width="1"/>

  <text x="800" y="220" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">배터리 보증 (테슬라 모델3·Y 기준)</text>
  <text x="800" y="256" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="800" font-family="sans-serif">8년 / 16만km</text>
  <text x="800" y="280" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">SOH 70% 이상 유지 보증</text>

  <line x1="590" y1="300" x2="1010" y2="300" stroke="#134e4a" stroke-width="1"/>

  <text x="800" y="328" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">2026년 보조금 (차종·지역별 상이)</text>
  <text x="800" y="362" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800" font-family="sans-serif">국고 최대 580만원</text>
  <text x="800" y="386" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">+ 지자체 보조금 · 취득세 감면 140만원</text>

  <line x1="590" y1="406" x2="1010" y2="406" stroke="#134e4a" stroke-width="1"/>

  <text x="600" y="440" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 글로벌 검증된 배터리 기술</text>
  <text x="600" y="466" fill="#4ADE80" font-size="14" font-weight="700" font-family="sans-serif">✅ 취득세 감면 140만원 동일 적용</text>
  <text x="600" y="492" fill="#94A3B8" font-size="14" font-family="sans-serif">❌ 보증 기간 국산 대비 2년 짧음</text>

  <rect x="590" y="514" width="390" height="38" rx="10" fill="#0F766E" fill-opacity="0.3"/>
  <text x="785" y="537" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700" font-family="sans-serif">차종별 보조금 ev.or.kr에서 사전 확인 필수</text>

  <text x="40" y="622" fill="#64748B" font-size="12" font-family="sans-serif">essencial | 자동차 비교 · 2026.05 기준 · 개인 상황에 따라 다를 수 있으며 구매 전 약관 확인 필요</text>
</svg>
