<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="60" y="50" width="220" height="40" rx="20" fill="#7C3AED"/>
  <text x="170" y="77" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="sans-serif">2026 초고령사회 진입</text>
  <text x="60" y="155" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">간병보험 vs 치매보험 — 핵심 숫자</text>
  <text x="60" y="200" fill="#C4B5FD" font-size="22" font-weight="600" font-family="sans-serif">50대 이후 보험 우선순위 한눈에</text>

  <!-- 4 Key Cards -->
  <rect x="60" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <text x="190" y="285" text-anchor="middle" fill="#C4B5FD" font-size="15" font-weight="700" font-family="sans-serif">장기요양 보험료율</text>
  <text x="190" y="340" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">0.9448%</text>
  <text x="190" y="370" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="600" font-family="sans-serif">2025 대비 +0.0266%p</text>
  <text x="190" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">수급자 116.5만(2024)</text>

  <rect x="340" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <text x="470" y="285" text-anchor="middle" fill="#C4B5FD" font-size="15" font-weight="700" font-family="sans-serif">2등급 한도 인상률</text>
  <text x="470" y="340" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">+11.89%</text>
  <text x="470" y="370" text-anchor="middle" fill="#34D399" font-size="14" font-weight="600" font-family="sans-serif">1등급 +8.95%</text>
  <text x="470" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">재가급여 대폭 확대</text>

  <rect x="620" y="240" width="260" height="180" rx="16" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <text x="750" y="285" text-anchor="middle" fill="#C4B5FD" font-size="15" font-weight="700" font-family="sans-serif">간병인 인건비</text>
  <text x="750" y="340" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">15~20만</text>
  <text x="750" y="370" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="600" font-family="sans-serif">하루(2026 시세)</text>
  <text x="750" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">매년 10% 이상 인상</text>

  <rect x="900" y="240" width="240" height="180" rx="16" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <text x="1020" y="285" text-anchor="middle" fill="#C4B5FD" font-size="15" font-weight="700" font-family="sans-serif">50대 초반 보험료</text>
  <text x="1020" y="340" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="800" font-family="sans-serif">1.5~2.2만</text>
  <text x="1020" y="370" text-anchor="middle" fill="#34D399" font-size="14" font-weight="600" font-family="sans-serif">20년납 100세만기</text>
  <text x="1020" y="395" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="sans-serif">일당15만+재가50만</text>

  <!-- 장기요양 등급별 한도액 -->
  <text x="60" y="475" fill="#FFFFFF" font-size="26" font-weight="800" font-family="sans-serif">2026 장기요양 재가급여 한도 — 등급별</text>
  <text x="60" y="503" fill="#94A3B8" font-size="14" font-family="sans-serif">복지부 장기요양위원회 2025-11 의결 · 본인부담률 15% 유지</text>

  <g font-family="sans-serif">
    <text x="60" y="545" fill="#FFFFFF" font-size="16" font-weight="700">1등급</text>
    <rect x="150" y="528" width="860" height="22" rx="4" fill="#7C3AED"/>
    <text x="1020" y="545" fill="#C4B5FD" font-size="15" font-weight="700">2,512,900원</text>

    <text x="60" y="585" fill="#FFFFFF" font-size="16" font-weight="700">2등급</text>
    <rect x="150" y="568" width="790" height="22" rx="4" fill="#A78BFA"/>
    <text x="1020" y="585" fill="#C4B5FD" font-size="15" font-weight="700">2,331,200원</text>

    <text x="60" y="625" fill="#FFFFFF" font-size="16" font-weight="700">3등급</text>
    <rect x="150" y="608" width="520" height="22" rx="4" fill="#A78BFA"/>
    <text x="1020" y="625" fill="#C4B5FD" font-size="15" font-weight="700">1,528,200원</text>

    <text x="60" y="665" fill="#FFFFFF" font-size="16" font-weight="700">4등급</text>
    <rect x="150" y="648" width="480" height="22" rx="4" fill="#C4B5FD"/>
    <text x="1020" y="665" fill="#C4B5FD" font-size="15" font-weight="700">1,409,700원</text>

    <text x="60" y="705" fill="#FFFFFF" font-size="16" font-weight="700">5등급</text>
    <rect x="150" y="688" width="412" height="22" rx="4" fill="#DDD6FE"/>
    <text x="1020" y="705" fill="#C4B5FD" font-size="15" font-weight="700">1,208,900원</text>

    <text x="60" y="745" fill="#FFFFFF" font-size="16" font-weight="700">인지지원</text>
    <rect x="150" y="728" width="230" height="22" rx="4" fill="#DDD6FE"/>
    <text x="1020" y="745" fill="#C4B5FD" font-size="15" font-weight="700">676,320원</text>
  </g>

  <!-- 지급 트리거 비교 -->
  <rect x="60" y="800" width="540" height="280" rx="16" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
  <text x="80" y="840" fill="#FCD34D" font-size="20" font-weight="800" font-family="sans-serif">간병보험 — 상태·행위 기반</text>

  <text x="80" y="880" fill="#CBD5E1" font-size="14" font-family="sans-serif">지급 트리거</text>
  <text x="80" y="910" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">간병인 고용 OR 장기요양등급</text>

  <text x="80" y="960" fill="#CBD5E1" font-size="14" font-family="sans-serif">보장 원인</text>
  <text x="80" y="990" fill="#34D399" font-size="18" font-weight="800" font-family="sans-serif">상해·질병·노환 전반</text>

  <text x="80" y="1030" fill="#CBD5E1" font-size="14" font-family="sans-serif">주요 지급형태</text>
  <text x="80" y="1055" fill="#FFFFFF" font-size="16" font-family="sans-serif">일당(일 15만) · 재가급여(월 50만)</text>

  <rect x="620" y="800" width="520" height="280" rx="16" fill="url(#card)" stroke="#34D399" stroke-width="2"/>
  <text x="640" y="840" fill="#34D399" font-size="20" font-weight="800" font-family="sans-serif">치매보험 — 진단·척도 기반</text>

  <text x="640" y="880" fill="#CBD5E1" font-size="14" font-family="sans-serif">지급 트리거</text>
  <text x="640" y="910" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">전문의 진단 + CDR 0.5~3점</text>

  <text x="640" y="960" fill="#CBD5E1" font-size="14" font-family="sans-serif">보장 원인</text>
  <text x="640" y="990" fill="#F87171" font-size="18" font-weight="800" font-family="sans-serif">치매 특정 (알츠하이머·혈관성)</text>

  <text x="640" y="1030" fill="#CBD5E1" font-size="14" font-family="sans-serif">주요 지급형태</text>
  <text x="640" y="1055" fill="#FFFFFF" font-size="16" font-family="sans-serif">진단비 일시금 + 월 100만 종신</text>

  <!-- 50대 이후 우선순위 -->
  <rect x="60" y="1100" width="1080" height="250" rx="16" fill="url(#card)" stroke="#7C3AED" stroke-width="2"/>
  <text x="80" y="1140" fill="#C4B5FD" font-size="20" font-weight="800" font-family="sans-serif">50대 이후 가입 우선순위</text>

  <g font-family="sans-serif">
    <circle cx="110" cy="1185" r="18" fill="#7C3AED"/>
    <text x="110" y="1192" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">1</text>
    <text x="145" y="1192" fill="#FFFFFF" font-size="16" font-weight="600">간병인 사용/지원일당 보험 — 모든 원인 대응, 보험료 대비 활용도 최고</text>
  </g>
  <g font-family="sans-serif">
    <circle cx="110" cy="1230" r="18" fill="#A78BFA"/>
    <text x="110" y="1237" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">2</text>
    <text x="145" y="1237" fill="#FFFFFF" font-size="16" font-weight="600">재가급여 + 시설급여 특약 — 장기요양등급 판정 시 월 30~70만 현금</text>
  </g>
  <g font-family="sans-serif">
    <circle cx="110" cy="1275" r="18" fill="#C4B5FD"/>
    <text x="110" y="1282" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">3</text>
    <text x="145" y="1282" fill="#FFFFFF" font-size="16" font-weight="600">치매 진단비 + 종신 생활자금 — CDR 0.5 경증부터 보장, 월 100만 종신</text>
  </g>
  <g font-family="sans-serif">
    <circle cx="110" cy="1320" r="18" fill="#DDD6FE"/>
    <text x="110" y="1327" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800">+</text>
    <text x="145" y="1327" fill="#FFFFFF" font-size="16" font-weight="600">유병자 → 간편심사 3·10·5 / 3·5·5 / 3·3·5 복수 견적 비교</text>
  </g>

  <text x="60" y="1420" fill="#64748B" font-size="14" font-family="sans-serif">essencial | 보험 silo · 자료: 복지부·건보공단·생보/손보협회 (2026.04 기준)</text>
</svg>
