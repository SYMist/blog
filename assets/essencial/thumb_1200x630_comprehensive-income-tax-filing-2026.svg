  <text x="960" y="400" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700" font-family="sans-serif">프리랜서 3천만 환급</text>
  <text x="960" y="460" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800" font-family="sans-serif">약 54만</text>
