  <text x="230" y="520" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="sans-serif">무신고 가산세 20%</text>

  <rect x="420" y="360" width="340" height="180" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="590" y="400" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">연금·IRP 세액공제</text>
