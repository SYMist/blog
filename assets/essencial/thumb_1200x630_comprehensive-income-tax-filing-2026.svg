<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="50" width="360" height="44" rx="22" fill="#B45309"/>
  <text x="240" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" font-family="sans-serif">2026 종합소득세 사업자·근로자 비교</text>

  <text x="60" y="175" fill="#FFFFFF" font-size="64" font-weight="800" font-family="sans-serif">5월 종소세</text>
  <text x="60" y="248" fill="#FCD34D" font-size="56" font-weight="800" font-family="sans-serif">환급 전략 총정리</text>

  <text x="60" y="310" fill="#94A3B8" font-size="22" font-weight="600" font-family="sans-serif">사업자 · 근로자 · 투잡 3트랙 비교 · 공제 레버 148.5만</text>

  <!-- 3 key metrics -->
  <rect x="60" y="360" width="340" height="180" rx="16" fill="url(#card)" stroke="#B45309" stroke-width="2"/>
  <text x="230" y="400" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="700" font-family="sans-serif">신고 기간</text>
  <text x="230" y="460" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="800" font-family="sans-serif">5.1 ~ 6.1</text>
